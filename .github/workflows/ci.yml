name: CI

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'client/**'
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - 'client/**'

# 배포 대상(온프레미스, 한국)과 같은 타임존으로 고정한다. GitHub Actions 기본 러너는 UTC라
# "오늘" 날짜 계산이 로컬(KST)과 항상 일치해버려, 자정~오전9시(KST) 구간에서만 터지는
# 타임존 버그(실측 2026-07-19: SLA 기한초과 판정이 하루 밀림)를 CI가 절대 못 잡는다.
env:
  TZ: Asia/Seoul

jobs:
  server:
    name: Server — typecheck + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  client:
    name: Client — typecheck + preload bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
