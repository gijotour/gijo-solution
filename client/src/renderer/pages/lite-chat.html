<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>내 지식 — GIJO AS Lite</title>
<!--
  lite-chat.html — **화면이 아니라 이름표다.**

  ■ 왜 바뀌었나 (2026-08-22, 사장님 「AI에게 물어보기도 우리 대화창을 그대로 이관하자」)
    전에는 여기에 라이트 전용 대화 화면 247줄이 있었다. 프로 대화창과 **두 벌**이었고,
    그래서 프로에 들어간 것이 라이트에 안 왔다 — 실제로 **＋(파일 넣기)가 없었다.**
    그 상태에서 라이트 메뉴를 「대화창 + 내 문서」 둘로 줄이자(같은 날 결정)
    **라이트에 문서를 넣을 길이 아예 없어졌다** — 내 문서에는 입력칸이 없기 때문이다
    (「지시는 대화창에서만」 원칙). 포크의 값이 그날 청구서로 돌아온 셈이다.

  ■ 왜 화면을 새로 안 짜나
    `lite-mydocs.html`과 **같은 판단**이다. 한 벌 더 만들면 그 순간 포크가 되고,
    프로에서 고친 것이 라이트에 안 온다. 여기서는 아무것도 그리지 않고 **본체로 넘긴다.**
    ★ 실측(설계관 2026-08-22): `console.js` 2,155줄에 **`edition=lite` 분기가 0곳**이고,
      라이트 전용 새 코드는 14줄이다. 이 파일이 247줄 사라지므로 **순증감 약 −183줄** —
      기능은 늘고 코드는 줄었다.

  ■ 접지 않는다 — **저절로 빈다**
    사장님 방침이 「프로에서 쓰는 형태로 그대로 · 기능은 일부 · 라이트 전용 새 코드 최소화」다.
    실측으로 **9가지가 감추는 코드 없이 저절로 빈다**(홈 히어로·현황판·메뉴 칩·선택 카드·
    보는목록·화면 카드·데이터 카드·AI 팀 배지·결재판) — 라이트에 그 데이터·화면이 없어서다.
    ★ 결재판이 좋은 예다: 라이트 도구 13개가 전부 읽기 전용이라 **지금은 안 뜨지만 코드는 살아 있다.**
      쓰기 도구를 하나 켜는 날 **그날 바로 동작한다.** 접어 없앴으면 그날 다시 만들어야 한다.
    없는 화면을 가리키는 경우는 라이트 셸(lite-app.html)의 메시지 리스너가 받아
    「이 기능은 라이트 에디션에 없습니다」로 **정직하게** 답한다 — 그 합류점이 이미 있다.

  ■ 왜 iframe이 아니라 location.replace 인가
    `lite-mydocs.html`과 같은 이유다. 한 겹 더 감싸면 `window.top`이 달라져 바깥으로 보내는
    신호(화면 열기·선택 알림)가 안 닿는다. 자리를 바꿔치기하면 부모가 그대로 라이트 셸이라
    신호가 제대로 가고 발신자 검증도 성립한다.

  ■ embed=1 이 하는 일
    ① `console.html`이 `data-mode="embed"`로 바꾼다 — 없으면 「⇤ 앱에 붙이기」 경로를 타서
       **눌렀는데 아무 일도 안 일어난다**(라이트 셸엔 붙일 자리가 없다).
    ② 「⧉ 창으로」 단추가 숨는다 — 안 숨기면 별도 창이 열려 **대화창이 둘**이 된다
       (같은 세션·같은 초안이라 서로를 덮어쓴다).
    ③ footbar가 스스로 접힌다.

  ■ ⚠ id는 `lite-chat`을 유지한다
    라이트 셸이 화면 파일 이름을 강제 조립하고(`"lite-" + id + ".html"`),
    `lite-edition-shell.test.ts`가 id의 `lite-` 접두사를 요구한다. 그래서 이 이름의 파일이 필요하다.
    ⚠ `main.ts`의 「라이트에서 열 수 있나」 문지기에 `console.html`을 **넣지 말 것** —
      그 문지기는 `lite-` 접두사로 판단하고, 이름표의 자리 바꿈은 그 길을 안 지난다.
-->
</head>
<body>
<script>
  (function () {
    // 원래 붙어 온 값은 그대로 이어 준다 — 나중에 셸이 특정 상태로 바로 보내고 싶을 때
    // 이 파일을 다시 손댈 일이 없게(lite-mydocs와 같은 규약).
    var q = new URLSearchParams(location.search);
    q.set("embed", "1");
    q.set("edition", "lite");
    location.replace("console.html?" + q.toString());
  })();
</script>
</body>
</html>
