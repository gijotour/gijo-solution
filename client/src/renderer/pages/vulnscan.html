<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIJO AS — 취약 자산관리</title>
<style>
/* ── 취약점 심각도 히트맵(지형도 3단계 ㉯) — map-view.js render(flat) 재사용 ── */
.vv.on{background:rgba(59,130,246,.16);border-color:var(--blue)!important;color:#8fb8ff;}
.mv-stage{display:flex;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--panel);}
.mv-map{flex:1;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0;position:relative;}
.mv-zone{border:1px solid var(--border);border-radius:8px;padding:6px 8px 8px;background:rgba(255,255,255,0.02);}
.mv-zone h4{margin:0 0 6px;font-size:11.5px;color:var(--muted);font-weight:600;}
.mv-zone h4 b{color:var(--white);}
.mv-tiles{display:flex;flex-wrap:wrap;gap:5px;}
.mv-tile{border-radius:5px;padding:4px 8px;font-size:11.5px;cursor:pointer;border:1px solid transparent;display:flex;flex-direction:column;justify-content:space-between;min-width:72px;max-width:100%;position:relative;}/* max-width: 세로에서 6px 넘침(2026-08-19 QA) */
.mv-tile:hover{border-color:rgba(255,255,255,0.35);}
.mv-tile.mv-sel{border-color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,0.55);}
.mv-nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;}
.mv-ct{font-size:11px;opacity:.85;}
.mv-kev{position:absolute;top:-6px;right:-6px;background:#e5484d;color:#fff;border-radius:8px;font-size:11px;padding:1px 5px;font-weight:800;}
.mv-high{background:rgba(229,72,77,.30);color:#ffd7d8;} .mv-mid{background:rgba(240,160,32,.42);color:#ffe9c4;}
.mv-low{background:rgba(70,167,88,.35);color:#d2f2da;} .mv-ai{outline:1px dashed rgba(139,124,240,.55);}
.mv-side{width:300px;border-left:1px solid var(--border);padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:12.5px;}
.mv-side h3{margin:0;font-size:13.5px;} .mv-rk{font-size:11.5px;padding:2px 8px;border-radius:4px;display:inline-block;margin-right:6px;}
.mv-row{border-bottom:1px solid var(--border);padding:6px 0;} .mv-lbl{color:var(--muted);font-size:11px;}
.mv-ask{background:rgba(59,130,246,.14);border:1px solid rgba(59,130,246,.5);color:#8fb8ff;border-radius:6px;padding:7px 10px;cursor:pointer;font-size:12px;text-align:left;font-family:inherit;}
.mv-ask:hover{background:rgba(59,130,246,.26);} .mv-hint{color:var(--muted);font-size:11px;margin-top:auto;}
:root{
  --bg:#262624;--panel:#30302e;--panel-2:#1f1e1d;--border:rgba(255,255,255,0.08);
  --border-strong:rgba(255,255,255,0.16);--blue:#3b82f6;--blue-light:#5fa1ff;--white:#ffffff;
  --text:#e9e7e2;--muted:#b3ada4;--muted-2:#a49d95;--red:#e2483d;--amber:#f0a020;--teal:#1eb980;--purple:#8b7cf0;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Pretendard","Malgun Gothic","Segoe UI",sans-serif;background:var(--bg);color:var(--text);}
.app{display:grid;grid-template-columns:220px 1fr;}
.sidebar{padding:22px 14px;border-right:1px solid var(--border);min-height:900px;}
.nav-section{font-size:12px;font-weight:700;color:var(--muted-2);letter-spacing:1.2px;margin:18px 10px 8px;}
.nav-section:first-child{margin-top:0;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;margin-bottom:2px;}
.nav-item .ic{width:18px;text-align:center;font-size:14px;}
.nav-item.active{background:rgba(59,130,246,0.12);color:var(--white);box-shadow:inset 3px 0 0 var(--blue);cursor:default;}
.nav-item:hover:not(.active){background:rgba(255,255,255,0.04);color:var(--white);}
.main{padding:28px 32px 48px;}
.topbar-row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;}
.page-title{font-size:21px;font-weight:800;color:var(--text-strong, #fff);}
.page-sub{font-size:12.5px;color:var(--muted);margin-top:4px;}
.btn-primary{background:var(--blue);color:#fff;border:none;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;}
.btn-ghost{background:transparent;border:1px solid var(--border-strong);color:var(--text);padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:16px;}
/* (요약 5칸 .kpi-strip은 2026-08-21에 걷었다 — 심각도 4칸이 그림띠 막대와 같은 원천의 중복) */
.table-panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:0 18px 10px;margin-bottom:16px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:12px;font-weight:700;padding:12px 10px;color:var(--muted-2);text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid var(--border);}
td{padding:13px 10px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.host-name{font-weight:700;color:var(--text-strong, #fff);}
.sev{display:inline-block;min-width:26px;text-align:center;padding:1px 7px;border-radius:6px;font-size:12.25px;font-weight:800;margin-right:4px;}
.sev-c{background:rgba(226,72,61,0.18);color:#f5928a;}
.sev-h{background:rgba(240,120,40,0.18);color:#f7a86a;}
.sev-m{background:rgba(240,160,32,0.15);color:var(--amber);}
.sev-l{background:rgba(139,147,171,0.15);color:var(--muted);}
/* 호스트 행 클릭 → 취약점 목록 드릴다운 */
tbody tr[data-id]{cursor:pointer;}
tbody tr[data-id]:hover td{background:rgba(59,130,246,0.07);}
tbody tr[data-id].on td{background:rgba(59,130,246,0.10);}
.row-caret{color:var(--muted-2);margin-right:6px;font-size:12.25px;}
.vd-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.vd-title{font-size:14.5px;font-weight:800;color:var(--text-strong, #fff);}
.vd-close{font-size:12px;color:var(--blue-light);font-weight:700;cursor:pointer;}
.vd-sub{font-size:12.5px;color:var(--muted);margin-bottom:14px;line-height:1.6;}
.vd-controls{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap;}
.vd-chip{background:var(--panel-2);border:1px solid var(--border-strong);color:var(--muted);padding:5px 12px;border-radius:20px;font-size:12.5px;font-weight:700;cursor:pointer;}
.vd-chip.active{background:rgba(59,130,246,0.15);border-color:var(--blue);color:var(--blue-light);}
.vd-search{flex:1;min-width:200px;background:var(--panel-2);border:1px solid var(--border-strong);border-radius:8px;padding:7px 12px;color:var(--text);font-size:12.5px;outline:none;}
/* max-height는 공용 gijoFitList가 창 높이에 맞춰 잰다(data-gijo-fit) — 고정 520px는 1080
   모니터에서 아래 400px를 놀렸다(2026-08-21). */
.vd-list{max-height:60vh;overflow-y:auto;border:1px solid var(--border);border-radius:8px;} /* 60vh=폴백 — 실높이는 gijoFitList가 다시 잰다(다른 data-gijo-fit 화면과 같은 관례) */
.vd-item{border-bottom:1px solid var(--border);padding:4px 12px;cursor:pointer;}
.vd-item:last-child{border-bottom:none;}
.vd-item:hover{background:rgba(255,255,255,0.03);}
.vd-item-top{display:flex;align-items:center;gap:8px;font-size:12.5px;}
.vd-name{color:var(--text);flex:1;line-height:1.5;}
.vd-epss{font-size:12px;font-weight:800;padding:1px 7px;border-radius:5px;background:rgba(139,124,240,0.16);color:var(--purple);flex-shrink:0;}
.vd-epss.hot{background:rgba(226,72,61,0.18);color:#f5928a;}
.vd-vpr{font-size:12px;font-weight:700;padding:1px 7px;border-radius:5px;background:rgba(255,255,255,0.06);color:var(--muted);flex-shrink:0;}
.vd-misfit{font-size:11.75px;font-weight:800;padding:1px 6px;border-radius:5px;background:rgba(240,160,32,0.18);color:var(--amber);flex-shrink:0;}
.vd-kev{font-size:11.75px;font-weight:800;padding:1px 7px;border-radius:5px;background:rgba(226,72,61,0.22);color:#ff8a80;flex-shrink:0;border:1px solid rgba(226,72,61,0.5);}
.vd-state{font-size:11.75px;font-weight:800;padding:1px 7px;border-radius:5px;flex-shrink:0;}
.vd-state.new{background:rgba(59,130,246,0.18);color:var(--blue-light);}
.vd-state.resurfaced{background:rgba(240,120,40,0.2);color:#f7a86a;}
.vd-state.fixed{background:rgba(30,185,128,0.16);color:var(--teal);}
.vd-state.fixed-unverified{background:rgba(245,185,66,0.16);color:#f5b942;border:1px dashed rgba(245,185,66,0.5);}
.vd-item.is-fixed{opacity:.5;}
.vd-item.is-fixed .vd-name{text-decoration:line-through;}
.vd-remediate{flex-shrink:0;background:rgba(59,130,246,0.14);border:1px solid var(--border-strong);color:var(--blue-light);font-size:12px;font-weight:800;padding:2px 9px;border-radius:6px;cursor:pointer;}
.vd-remediate:hover{background:rgba(59,130,246,0.24);border-color:var(--blue);}
.vd-remediate.done{background:rgba(30,185,128,0.16);color:var(--teal);border-color:rgba(30,185,128,0.4);cursor:default;}
.vd-ev{display:none;margin-top:8px;padding:10px 12px;background:var(--panel-2);border-radius:6px;font-size:12.5px;color:var(--muted);line-height:1.75;white-space:pre-wrap;word-break:break-word;max-height:240px;overflow-y:auto;}
.vd-item.open .vd-ev{display:block;}
/* 원문 아래 한글 한 줄 풀이(전-7 ③) — 같은 화면 .vd-sub의 글꼴/줄높이 그대로 재사용(새 색·글꼴 없음). 못 찾으면 아예 안 그림. */
.vd-plain{font-size:12.5px;line-height:1.6;color:var(--muted);margin-top:4px;}
.vd-plain b{color:var(--text);font-weight:700;}
.vd-empty{padding:16px;color:var(--muted);font-size:12.5px;}
.status-line{font-size:12.5px;margin-top:10px;}
.footer{margin-top:8px;padding:18px 0 0;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted-2);}
.footer img{height:16px;opacity:0.6;}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--panel-2);}
.header-left{display:flex;align-items:center;gap:12px;}
.header-left img{height:22px;}
.app-title{font-size:15px;font-weight:800;color:var(--text-strong, #fff);}
.clock{font-size:12px;color:var(--blue-light);font-weight:600;}
.header-right{display:flex;align-items:center;gap:10px;}
.status-pill{display:flex;align-items:center;gap:6px;background:rgba(30,185,128,0.15);border:1px solid rgba(30,185,128,0.4);color:var(--teal);padding:6px 14px;border-radius:20px;font-size:12px;font-weight:800;}
.status-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);}
.beta-tag{background:var(--teal);color:var(--fill-contrast,#06281c);font-size:11.25px;font-weight:800;padding:1px 6px;border-radius:4px;margin-left:2px;}
.avatar-btn{width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;}
.icon-btn{width:32px;height:32px;border-radius:8px;background:var(--panel);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted);cursor:pointer;}
/* 오늘의 조치(우선순위) */
.tp-rank{width:20px;text-align:center;font-weight:800;color:var(--muted-2);font-size:12px;}
.tp-sev{font-size:11.5px;font-weight:800;padding:2px 7px;border-radius:5px;text-transform:uppercase;}
.tp-sev-critical{color:#fff;background:#91243E;}.tp-sev-high{color:#fff;background:#DD4B50;}
.tp-sev-medium{color:#1a1200;background:#F18C43;}.tp-sev-low{color:var(--text);background:rgba(255,255,255,0.1);}
.tp-b{font-size:11.5px;font-weight:800;padding:2px 7px;border-radius:5px;}
.tp-kev{color:#fff;background:var(--red);}.tp-epss{color:var(--amber);background:rgba(240,160,32,0.15);}
.tp-vpr{color:var(--blue-light);background:rgba(59,130,246,0.15);}
.tp-type{font-size:12.5px;font-weight:700;color:var(--text-strong, #fff);}
.tp-asset{font-size:12.25px;color:var(--purple);}
.tp-metaend{margin-left:auto;display:flex;align-items:center;gap:8px;}
.tp-who{font-size:12px;font-weight:700;color:var(--teal);}
.tp-unassigned{color:var(--muted-2);}
.tp-due{font-size:12px;color:var(--muted);}
.tp-overdue{color:#f5928a;font-weight:800;}
/* ⚠ 세로 모니터 대응(2026-08-19 QA 실측). 무대 폭 644px에서 히트맵 옆판(.mv-side 300px 고정)이
   지도 자리를 344px로 짓눌러 타일이 넘쳤다(mv-tiles·mv-tile). 좁으면 옆판을 아래로 내린다. */
@media (max-width:900px){
  .mv-stage{flex-direction:column;}
  .mv-side{width:auto;border-left:0;border-top:1px solid var(--border);}
}
</style>
<script src="viz.js"></script>
</head>
<body>

<!-- 상단 바는 공용이다 — titlebar.js가 그린다(분리창=공용 헤더, 탭 안=셸 탭줄). 화면마다 두던 사본 23개를 지웠다(2026-08-07). -->

<div class="app">
  <div class="sidebar" id="gijoNav"></div>

  <div class="main">
    <!-- ⚠ 제목줄은 공용 CSS가 제목을 숨겨 내용 0인 빈 줄이었다 — nav.js 빈제목줄걷기가 숨긴다.
         ⚠ 요약 5칸은 걷었다(2026-08-21 밀도 — 설계관 원천 대조: 심각도 4칸이 아래 그림띠
         막대와 같은 원천의 중복. 부분만 걷으면 공용 변환기 조건이 깨져 남은 칸이 옛 큰 카드
         모양으로 되돌아가므로 전부 걷는다). 막대에 없던 「스캔 호스트」는 그림띠 제목으로. -->
    <div id="gijoChatWidget" data-prompts='["미조치 Critical 몇 건이야?","KEV 있는 거 있어?"]' style="max-width:640px;margin-bottom:16px;"></div>

    <!-- 「오늘의 조치 우선순위」 블록은 2026-08-09 사용자 지시로 제거 — 대시보드 오늘 계획 판의
         「급한 것」이 같은 목록을 같은 규칙(KEV→EPSS→VPR)으로 이미 보여 준다. 같은 목록이 두 곳이면
         한쪽만 갱신됐을 때 담당자가 어느 쪽도 못 믿는다. 조치 브리핑은 대화창 「오늘 뭐부터 해야 해?」로. -->

    <!-- 그림 먼저(전-7 ①, 2026-08-05). 위 KPI는 "얼마나 남았나"의 숫자고, 이 띠는 **눌러서 좁히는** 그림이다.
         심각도 막대를 누르면 아래 호스트 목록이 그 심각도를 가진 호스트만 남는다. -->
    <div id="vizStrip"></div>
    <div id="vizFilter" style="display:none"></div>

    <!-- 목록 ⇄ 🗺 히트맵(2026-08-04, 지형도 3단계 ㉯). 목록은 그대로, 보기만 전환. -->
    <div style="display:flex;gap:4px;margin:0 0 8px;justify-content:flex-end">
      <span class="vv on" id="vvList" style="font-size:12px;border:1px solid var(--border);border-radius:12px;padding:2px 10px;cursor:pointer">목록</span>
      <span class="vv" id="vvHeat" style="font-size:12px;border:1px solid var(--border);border-radius:12px;padding:2px 10px;cursor:pointer" title="자산을 심각도 순으로 — 크기=취약점 수, 색=최고 심각도">🗺 히트맵</span>
    </div>
    <div class="table-panel" id="tablePane">
      <table>
        <thead><tr><th>호스트 / IP</th><th>출처</th><th>취약점(심각도별)</th><th>최근 스캔</th></tr></thead>
        <tbody id="hostRows">
          <tr><td colspan="4" style="color:var(--muted)">불러오는 중...</td></tr>
        </tbody>
      </table>
    </div>
    <!-- 히트맵 뷰 — map-view.js render(flat) 재사용 -->
    <div id="vheatWrap" style="display:none">
      <div class="mv-stage" style="min-height:360px">
        <div class="mv-map" id="vheatMap"></div>
        <div class="mv-side" id="vheatSide"></div>
      </div>
    </div>

    <!-- 호스트를 클릭하면 그 호스트의 취약점 목록이 여기에 열린다 -->
    <div class="panel" id="vulnDetail" style="display:none">
      <div class="vd-head">
        <span class="vd-title" id="vdTitle">—</span>
        <span class="vd-close" id="vdClose">✕ 닫기</span>
      </div>
      <div class="vd-sub" id="vdSub"></div>
      <div class="vd-controls">
        <span class="vd-chip active" data-sev="all">전체</span>
        <span class="vd-chip" data-sev="kev" id="vdKevChip" title="CISA KEV — 실제 악용이 확인된 취약점만">🔴 KEV</span>
        <span class="vd-chip" data-sev="critical">Critical</span>
        <span class="vd-chip" data-sev="high">High</span>
        <span class="vd-chip" data-sev="medium">Medium</span>
        <span class="vd-chip" data-sev="low">Low/Info</span>
        <span class="vd-chip" id="vdSortBtn" title="정렬 기준 전환 — EPSS는 30일 내 실제 악용될 확률">↕ 심각도 순</span>
        <input class="vd-search" id="vdSearch" placeholder="취약점명 · CVE로 검색 (예: log4j, CVE-2021-44228, firefox)" aria-label="취약점명 · CVE로 검색">
      </div>
      <div class="vd-list" id="vdList" data-gijo-fit></div>
    </div>

    <div class="footer">
      <img src="gijo-symbol.svg" alt="GIJO">
      <span>© 2026 GIJO Technology · GIJO AS Platform · Confidential</span>
    </div>
  </div>
</div>

<script>
  const hostRows = document.getElementById("hostRows");



  let currentUser = "";

  // 취약점 → 조치 항목: 심각도·KEV로 우선순위와 SLA(기한)를 자동 산정한다.
  // KEV(실제 악용)는 7일, Critical 14, High 30, Medium 60, Low 90일.
  function remediationPlan(sev, kev) {
    const days = kev ? 7 : sev === "critical" ? 14 : sev === "high" ? 30 : sev === "medium" ? 60 : 90;
    const priority = kev || sev === "critical" ? "P0" : sev === "high" ? "P1" : sev === "medium" ? "P2" : "P3";
    return { days, priority, dueAt: Date.now() + days * 86400000 };
  }

  async function remediate(btn) {
    const asset = hostCache.find((a) => a.id === currentHostId);
    const name = btn.dataset.name;
    const { days, priority, dueAt } = remediationPlan(btn.dataset.sev, btn.dataset.kev === "1");
    btn.disabled = true;
    btn.textContent = "등록 중...";
    try {
      await window.gijo.addTask(`[조치] ${name} — ${asset ? asset.name : ""}`, { priority, dueAt, assignee: currentUser, ref: currentHostId });
      btn.textContent = `✓ 등록됨 · 기한 D-${days}`;
      btn.classList.add("done");
    } catch (err) {
      btn.disabled = false;
      btn.textContent = "＋ 조치 등록";
      gijoTell("조치 등록 실패: " + (err.message || err));
    }
  }

  function sevCounts(findings) {
    // 고쳐진(fixed) 항목은 "현재 위험"이 아니므로 심각도 카운트에서 제외한다.
    const c = { critical: 0, high: 0, medium: 0, low: 0 };
    (findings || []).forEach((f) => { if (f.state !== "fixed") c[f.severity] = (c[f.severity] || 0) + 1; });
    return c;
  }
  const activeCount = (findings) => (findings || []).filter((f) => f.state !== "fixed").length;

  // ── 그림 먼저(전-7 ①, 2026-08-05) ─────────────────────────────────────────
  // 목록보다 그림이 먼저 눈에 들어오게. 그리는 일은 viz.js 한 곳에서만 한다
  // (화면마다 따로 그리면 같은 데이터인데 화면마다 숫자가 달라진다 — 지도에서 겪은 함정).
  let 심각도필터 = null;
  const 심각도한글 = { critical: "긴급", high: "높음", medium: "보통", low: "낮음" };

  // 필터 띠 — 목록 단위(호스트)로만 적는다. 막대 값(취약점 건수)은 막대 위에 이미 있다.
  function 필터띠(assets, 자산별) {
    if (!window.gijoViz) return;
    const el = document.getElementById("vizFilter");
    if (!심각도필터) { window.gijoViz.filterBar(el, null, null); return; }
    const 보임 = assets.filter((a) => (자산별.get(a.id) || {})[심각도필터] > 0).length;
    window.gijoViz.filterBar(el, { label: 심각도한글[심각도필터] || 심각도필터, 보임, 전체: assets.length, 단위: "호스트" }, () => {
      심각도필터 = null;
      document.querySelectorAll("#vizStrip .gviz-bar").forEach((b) => b.classList.remove("on"));
      필터띠(assets, 자산별);
      호스트줄그리기(assets, 자산별);
      if (vheatOn) renderVHeat();
    });
  }

  function 그림띠(assets, totals, 자산별) {
    const 자리 = document.getElementById("vizStrip");
    if (!자리 || !window.gijoViz) return;   // viz.js가 없으면 목록만 보인다(화면은 살아 있어야 한다)
    // ⚠ 도넛 분모와 막대 합의 모수를 맞춘다(2026-08-05 검토 지적). 막대는 fixed를 빼고 세므로
    //   도넛도 같은 모수(fixed 제외 + fixed)로 잡되, 분모를 **막대 합 + 고친 것**으로 둔다.
    //   그래야 담당자가 막대를 더해 봤을 때 분모에서 고친 수를 뺀 값과 맞아떨어진다.
    const 남음 = totals.critical + totals.high + totals.medium + totals.low;
    const 고침 = (assets || []).reduce((n, a) => n + (a.findings || []).filter((f) => f.state === "fixed").length, 0);
    const 전체취약점 = 남음 + 고침;
    const 좁히기 = () => { 호스트줄그리기(assets, 자산별); if (vheatOn) renderVHeat(); };

    window.gijoViz.mount(자리, {
      // 스캔 호스트 — 걷어낸 요약 5칸에서 막대에 없던 유일한 값. 제목 글자로 남긴다(0도 말한다).
      title: "한눈에 — 스캔 호스트 " + (assets || []).length + "대",
      hint: "누르면 목록이 좁혀집니다",
      parts: [
        {
          kind: "bars",
          segments: [
            { key: "critical", label: "긴급", value: totals.critical },
            { key: "high", label: "높음", value: totals.high },
            { key: "medium", label: "보통", value: totals.medium },
            { key: "low", label: "낮음", value: totals.low },
          ],
          onPick: (key) => {
            심각도필터 = key;
            필터띠(assets, 자산별);
            좁히기();
          },
        },
        // ⚠ 비율(%)이 아니라 **몇/몇**으로 적는다(2026-08-05 실측): 실제 5/4,890인데 반올림하면
        //   0%가 되어 "하나도 안 했다"로 읽힌다. 적은 것을 적다고 말하되 없다고는 말하지 않는다.
        { kind: "donut", value: 고침, total: 전체취약점, label: "조치 완료", color: "ok", showRatio: true },
      ],
    });
    // 다시 그린 뒤에도 고른 상태가 남아 있게 — 막대 표시와 필터 띠를 맞춘다.
    if (심각도필터) {
      const b = 자리.querySelector('.gviz-bar[data-key="' + 심각도필터 + '"]');
      if (b) b.classList.add("on");
    }
    필터띠(assets, 자산별);   // 다시 그릴 때 띠 숫자도 같이 새로 낸다(낡은 숫자가 남지 않게)
  }
  // ──────────────────────────────────────────────────────────────────────────

  // ── 취약점 심각도 히트맵(2026-08-04, 지형도 3단계 ㉯, 시안 security-map-v2 승인) ──
  // 자산 지도(inventory)와 **같은 map-view.js를 재사용**하되, 취약점 화면은 「오늘 뭐부터」가
  // 목적이라 구획 없이(flat) 심각도 순 한 판으로 그린다. 판정은 이 화면 것을 주입한다.
  let vheatOn = false;
  function vheatCtx() {
    return {
      flat: true,
      activeFindings: (a) => (a.findings || []).filter((f) => f.state !== "fixed"),
      // 색은 자산 지도와 같은 규칙(critical/high=high) — 두 화면 색이 어긋나지 않게.
      riskOf: (a) => {
        const c = sevCounts(a.findings);
        const n = activeCount(a.findings);
        const kev = (a.findings || []).some((f) => f.state !== "fixed" && f.kev);
        if (n === 0) return { level: "none", label: a.lastScannedAt ? "양호" : "미스캔", kev: false };
        const level = (c.critical || c.high) ? "high" : c.medium ? "mid" : "low";
        const word = level === "high" ? "높음" : level === "mid" ? "중간" : "낮음";
        return { level, label: `${word} · ${n}건`, kev };
      },
      onDetail: (a) => { document.getElementById("vheatSide").innerHTML = window.gijoMapView.detailHtml(a, vheatCtx()); },
    };
  }
  function renderVHeat() {
    if (!window.gijoMapView) return;
    const ctx = vheatCtx();
    // 취약점 있는 자산만 — 미스캔·양호 타일이 지도를 채우면 「급한 것」이 안 보인다.
    // ⚠ 그림 띠에서 고른 심각도를 **히트맵도 따른다**(2026-08-05 검토 지적). 예전엔 목록만
    //   좁혀져, 히트맵 보기(저장된 선택이라 들어오자마자 이 상태일 수 있다)에서 막대를 누르면
    //   띠는 좁혔다고 말하는데 지도는 하나도 안 변했다 — 눌러도 아무 일 없는 자리였다.
    const shown = hostCache.filter((a) => activeCount(a.findings) > 0)
      .filter((a) => !심각도필터 || sevCounts(a.findings)[심각도필터] > 0);
    window.gijoMapView.render(document.getElementById("vheatMap"), shown, ctx);
    const 급한 = [...shown].sort((x, y) => activeCount(y.findings) - activeCount(x.findings))[0];
    if (급한) ctx.onDetail(급한);
    else document.getElementById("vheatSide").innerHTML = '<div style="color:var(--muted)">' +
      (심각도필터 ? "고른 심각도의 자산이 없습니다 — 위 「✕ 해제」를 누르면 전체가 다시 보입니다."
                  : "조치할 취약점이 없습니다 — 스캔 결과를 올려 주세요.") + "</div>";
  }
  function setVView(heat) {
    vheatOn = heat;
    document.getElementById("vvList").classList.toggle("on", !heat);
    document.getElementById("vvHeat").classList.toggle("on", heat);
    document.getElementById("tablePane").style.display = heat ? "none" : "";
    document.getElementById("vheatWrap").style.display = heat ? "" : "none";
    if (heat) renderVHeat();
    try { localStorage.setItem("gijo:vuln:view", heat ? "heat" : "list"); } catch (e) {}
  }

  function fmtDate(ts) {
    return ts ? new Date(ts).toLocaleString("ko-KR", { year: "2-digit", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }) : "—";
  }

  const esc = (s) => String(s == null ? "" : s).replace(/</g, "&lt;");
  // findingplain의 `말`에 든 리터럴 **강조**를 <b>로 바꾼다. ⚠ esc 다음에 적용해야 별표가 화면에 안 남는다.
  const boldify = (s) => String(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");

  // ── 호스트 → 취약점 목록 드릴다운 ───────────────────────────────────────
  const SEV_ORDER = { critical: 0, high: 1, medium: 2, low: 3 };
  const SEV_CLASS = { critical: "sev-c", high: "sev-h", medium: "sev-m", low: "sev-l" };
  const SEV_LABEL = { critical: "CRIT", high: "HIGH", medium: "MED", low: "LOW" };
  let hostCache = [];
  let currentHostId = null;
  let vdFilter = "all";
  let vdSort = "sev"; // "sev" = 심각도 순, "epss" = 악용확률 순

  // CVSS 기반 Risk 는 Medium인데 실제 악용확률(EPSS)이 높은 건 — 등급만 보면 놓친다.
  const isMisfit = (f) => (f.epss ?? 0) >= 0.5 && f.severity !== "critical" && f.severity !== "high";

  // 선택 알림(2026-08-09 3단계) — 고른 것을 셸 📌칩에 싣는다. 「이거」가 이걸 가리키게 된다.
  // ⚠ parent가 아니라 top이다 — 이 화면은 허브 화면(triage) 안에 한 겹 더 들어간다(지도에서 실측).
  // fields — 대화창 「고른 항목」 카드의 재료(승인 시안 조치항목_대화창 B16 복제).
  // 전송 규격(top 한 겹·팝업 릴레이·허용 키·200자 컷)은 공용 부품 selectnotify.js 한 곳이 진다(2026-08-20 이관).
  function 선택알림(label, text, fields) {
    if (!window.gijoSelectNotify) return; // 부품 미로드(단독 열람 등)면 조용히 없던 일로
    window.gijoSelectNotify(label && text ? { label: label, text: text, fields: fields || undefined } : undefined);
  }

  function closeDetail() {
    currentHostId = null;
    document.getElementById("vulnDetail").style.display = "none";
    document.querySelectorAll("#hostRows tr[data-id]").forEach((tr) => {
      tr.classList.remove("on");
      const c = tr.querySelector(".row-caret"); if (c) c.textContent = "▸";
    });
    선택알림(null, null); // 상세를 닫으면 가리키던 것도 없다
  }

  function openHost(asset, keepFilters) {
    currentHostId = asset.id;
    선택알림(asset.name, "자산 " + asset.name); // 행을 골랐다 = 이 자산이 「이거」다
    // ⚠ 목록 높이는 판이 **보일 때** 재야 한다(검토관 2026-08-21 상4) — gijoFitList는 안
    //   보이는 요소를 건너뛰는데(offsetParent) 부팅 4회 재기는 판이 닫혀 있을 때 지나간다.
    //   여기서 안 재면 max-height가 없어 판이 문서 끝까지 늘어난다(520px 고정보다 후퇴).
    setTimeout(function () { if (window.gijoFitList) window.gijoFitList(document.getElementById("vdList")); }, 0);
    if (!keepFilters) {
      vdFilter = "all";
      vdSort = "sev";
      document.querySelectorAll(".vd-chip[data-sev]").forEach((c) => c.classList.toggle("active", c.dataset.sev === "all"));
      const sortBtn = document.getElementById("vdSortBtn");
      sortBtn.textContent = "↕ 심각도 순";
      sortBtn.classList.remove("active");
      document.getElementById("vdSearch").value = "";
    }
    const f = asset.findings || [];
    const c = sevCounts(f);
    const active = f.filter((x) => x.state !== "fixed");
    document.getElementById("vdTitle").textContent = `${asset.name} — 취약점 ${active.length.toLocaleString()}건`;
    const misfits = active.filter(isMisfit).length;
    const kevCount = active.filter((x) => x.kev).length;
    const nNew = f.filter((x) => x.state === "new").length;
    const nResurf = f.filter((x) => x.state === "resurfaced").length;
    const nFixed = f.filter((x) => x.state === "fixed").length;
    const delta = (nNew || nResurf || nFixed)
      ? ` · 이번 스캔: ${nNew ? `🆕 신규 ${nNew}` : ""}${nResurf ? ` ♻ 재발 ${nResurf}` : ""}${nFixed ? ` ✓ 고쳐짐 ${nFixed}` : ""}`
      : "";
    document.getElementById("vdSub").textContent =
      `출처 ${asset.owner} · 최근 스캔 ${fmtDate(asset.lastScannedAt)} · Critical ${c.critical} / High ${c.high} / Medium ${c.medium} / Low·Info ${c.low}` +
      (kevCount ? ` · 🔴 실제 악용 확인(KEV) ${kevCount}건 — 최우선` : "") +
      (misfits ? ` · ⚠ 등급은 낮지만 악용확률 50%↑ ${misfits}건 (등급만 보면 놓침)` : "") +
      delta +
      ` — 항목을 클릭하면 상세가 펼쳐집니다.`;
    // KEV가 없으면 KEV 필터 칩을 흐리게(정보 전달)
    const kevChip = document.getElementById("vdKevChip");
    if (kevChip) kevChip.style.opacity = kevCount ? "1" : "0.4";
    document.getElementById("vulnDetail").style.display = "";
    renderVdList();
    // 행 하이라이트
    document.querySelectorAll("#hostRows tr[data-id]").forEach((tr) => {
      const on = tr.dataset.id === asset.id;
      tr.classList.toggle("on", on);
      const car = tr.querySelector(".row-caret"); if (car) car.textContent = on ? "▾" : "▸";
    });
  }

  function renderVdList() {
    const list = document.getElementById("vdList");
    const asset = hostCache.find((a) => a.id === currentHostId);
    if (!asset) return;
    const q = document.getElementById("vdSearch").value.trim().toLowerCase();
    // 고쳐진 것은 항상 맨 아래, KEV(실제 악용 확인)는 그 위에서 최상단.
    const fixedLast = (a, b) => (a.state === "fixed" ? 1 : 0) - (b.state === "fixed" ? 1 : 0);
    const kevFirst = (a, b) => (b.kev ? 1 : 0) - (a.kev ? 1 : 0);
    const bySev = (a, b) => fixedLast(a, b) || kevFirst(a, b) || (SEV_ORDER[a.severity] ?? 9) - (SEV_ORDER[b.severity] ?? 9) || String(a.finding_type).localeCompare(String(b.finding_type));
    const byEpss = (a, b) => fixedLast(a, b) || kevFirst(a, b) || (b.epss ?? -1) - (a.epss ?? -1) || bySev(a, b);
    const items = (asset.findings || [])
      .filter((f) => (vdFilter === "kev" ? f.kev : vdFilter === "all" || f.severity === vdFilter))
      .filter((f) => !q || `${f.finding_type} ${f.evidence || ""}`.toLowerCase().includes(q))
      .sort(vdSort === "epss" ? byEpss : bySev);
    if (items.length === 0) {
      list.innerHTML = '<div class="vd-empty">조건에 맞는 취약점이 없습니다.</div>';
      return;
    }
    list.innerHTML = items
      .map((f) => {
        const epss =
          f.epss != null
            ? `<span class="num vd-epss ${f.epss >= 0.5 ? "hot" : ""}" title="EPSS — 30일 내 실제 악용될 확률">EPSS ${(f.epss * 100).toFixed(1)}%</span>`
            : "";
        const vpr = f.vpr != null ? `<span class="num vd-vpr" title="Tenable VPR — 실제 위협 기반 우선순위(0~10)">VPR ${f.vpr}</span>` : "";
        const misfit = isMisfit(f) ? `<span class="vd-misfit" title="CVSS 등급은 낮지만 실제 악용확률이 높습니다 — 등급만 보면 놓치는 건">⚠ 등급↓ 악용↑</span>` : "";
        const kev = f.kev ? `<span class="vd-kev" title="CISA KEV — 실제 악용이 확인된 취약점. 최우선 조치.&#10;${esc((f.kevCves || []).join(', '))}">🔴 KEV 악용중</span>` : "";
        const STATE_LABEL = { new: "🆕 신규", resurfaced: "♻ 재발", fixed: "✓ 고쳐짐" };
        let state = "";
        if (f.state === "fixed") {
          // 인증 재스캔으로 검증된 Fixed와, 비인증이라 신뢰할 수 없는 Fixed를 구분한다(Tenable 조치 검증 요건).
          if (f.fixedVerified === false)
            state = `<span class="vd-state fixed-unverified" title="비인증(원격) 재스캔에서 사라졌을 뿐, 정말 고쳐졌는지 검증되지 않았습니다. 인증(credentialed) 재스캔으로 재확인이 필요합니다.">✓ 고쳐짐(미검증)</span>`;
          else if (f.fixedVerified === true)
            state = `<span class="vd-state fixed" title="인증(credentialed) 재스캔에서 사라져 조치가 검증되었습니다.">✓ 고쳐짐 · 검증됨</span>`;
          else state = `<span class="vd-state fixed" title="지난 스캔에서 사라짐">✓ 고쳐짐</span>`;
        } else if (f.state && STATE_LABEL[f.state]) {
          state = `<span class="vd-state ${f.state}" title="지난 스캔 대비 상태">${STATE_LABEL[f.state]}</span>`;
        }
        // 고쳐진 것엔 조치 등록 버튼을 달지 않는다.
        const remediate = f.state === "fixed" ? "" : `<button class="vd-remediate" data-rem data-name="${esc(f.finding_type)}" data-sev="${f.severity}" data-kev="${f.kev ? 1 : 0}" title="이 취약점을 조치 항목(담당자·기한)으로 등록">＋ 조치 등록</button>`;
        return (
          // data-fkey — 서버가 동봉한 안정 키(sha1 16자). 「고른 항목」이 이 키를 대화창에
          // 실어야 배정·판정이 표시명이 아니라 키로 그 건을 잡는다(2026-08-19 QA ③).
          `<div class="vd-item ${f.state === "fixed" ? "is-fixed" : ""}" data-fkey="${esc(f.fkey || "")}">` +
          `<div class="vd-item-top">` +
          `<span class="sev ${SEV_CLASS[f.severity] || "sev-l"}">${SEV_LABEL[f.severity] || "?"}</span>` +
          `<span class="vd-name">${esc(f.finding_type)}</span>` +
          state + kev + misfit + epss + vpr + remediate +
          `</div>` +
          (f.plain ? `<div class="vd-plain">→ ${boldify(esc(f.plain))}</div>` : "") +
          `<div class="vd-ev">${esc(f.evidence || "(상세 없음)")}</div>` +
          `</div>`
        );
      })
      .join("");
    const shown = items.length, total = (asset.findings || []).length;
    if (shown !== total) list.insertAdjacentHTML("afterbegin", `<div class="vd-empty" style="border-bottom:1px solid var(--border)">${shown.toLocaleString()}건 표시 (전체 ${total.toLocaleString()}건)</div>`);
  }

  // 호스트 줄만 다시 그린다 — 막대를 눌러 좁힐 때 서버를 다시 부르지 않기 위해 떼어 냈다.
  function 호스트줄그리기(assets, 자산별) {
    // 🗂 지금 범위 — ⓪ 자산에서 고른 자산이 있으면 그것만 보인다(2026-08-18 승인 시안).
    // ⚠ 아래 `?host=`(561행)와 **다른 일**이다 — 그건 그 자산을 펼쳐 둘 뿐 목록은 그대로다.
    const 범위자산 = window.gijoScope ? window.gijoScope.assetId() : "";
    const 범위전 = 심각도필터 ? assets.filter((a) => (자산별.get(a.id) || {})[심각도필터] > 0) : assets;
    const 보일자산 = 범위자산 ? 범위전.filter((a) => a.id === 범위자산) : 범위전;
    // 좁혔으면 띠로 알린다 — 안 알리면 그 수를 전체로 읽는다.
    if (window.gijoScope) window.gijoScope.chip(보일자산.length, 범위전.length);
    if (assets.length === 0) {
      hostRows.innerHTML = '<tr><td colspan="4" style="color:var(--muted)">업로드된 취약점 스캔 결과가 없습니다. 위에서 Nessus 등의 결과 파일을 올려주세요.</td></tr>';
      return;
    }
    if (보일자산.length === 0) {
      hostRows.innerHTML = '<tr><td colspan="4" style="color:var(--muted)">고른 심각도를 가진 호스트가 없습니다 — 위 「✕ 해제」를 누르면 전체가 다시 보입니다.</td></tr>';
      return;
    }
    hostRows.innerHTML = 보일자산.map((a) => {
      const c = 자산별.get(a.id) || sevCounts(a.findings);
      const badges =
        (c.critical ? `<span class="sev sev-c">C ${c.critical}</span>` : "") +
        (c.high ? `<span class="sev sev-h">H ${c.high}</span>` : "") +
        (c.medium ? `<span class="sev sev-m">M ${c.medium}</span>` : "") +
        (c.low ? `<span class="sev sev-l">L ${c.low}</span>` : "") || '<span style="color:var(--muted)">—</span>';
      const open = currentHostId === a.id ? " on" : "";
      return `<tr data-id="${esc(a.id)}" class="${open.trim()}" title="클릭하면 이 호스트의 취약점 목록이 열립니다">
        <td><div class="host-name"><span class="row-caret">${currentHostId === a.id ? "▾" : "▸"}</span>${esc(a.name)}</div></td>
        <td style="color:var(--muted)">${esc(a.owner)}</td>
        <td>${badges}</td>
        <td style="color:var(--muted)">${fmtDate(a.lastScannedAt)}</td>
      </tr>`;
    }).join("");
  }

  async function refresh() {
    let assets = [];
    try {
      assets = (await window.gijo.listAssets()).filter((a) => a.assetType === "infra-host");
    } catch (e) {
      hostRows.innerHTML = '<tr><td colspan="4" style="color:#f5928a">자산을 불러오지 못했습니다</td></tr>';
      return;
    }
    // ★ 총계는 **전체 자산**으로 먼저 낸다(2026-08-05, 전-7 ①). 막대를 눌러 목록을 좁혀도
    //   위 KPI 숫자는 그대로여야 한다 — 좁힌 목록으로 총계를 내면 "고쳤더니 취약점이 줄었다"로 읽힌다.
    const totals = { critical: 0, high: 0, medium: 0, low: 0 };
    const 자산별 = new Map();
    assets.forEach((a) => {
      const c = sevCounts(a.findings);
      자산별.set(a.id, c);
      totals.critical += c.critical; totals.high += c.high; totals.medium += c.medium; totals.low += c.low;
    });
    그림띠(assets, totals, 자산별);
    호스트줄그리기(assets, 자산별);
    hostCache = assets;
    // 🗂 범위가 바뀌면 목록을 다시 그린다(2026-08-18). 등록 즉시 한 번 불리므로
    // 화면이 뜰 때 이미 걸려 있던 범위도 놓치지 않는다.
    if (window.gijoScope) window.gijoScope.onChange(() => 호스트줄그리기(assets, 자산별));
    // 다른 화면에서 "이 자산" 을 지목해 들어왔으면 그 호스트를 펼친 채로 시작한다
    // (?host=<자산id>). 안 그러면 46개 목록에서 방금 보던 자산을 다시 찾아야 한다.
    if (!currentHostId) {
      try {
        const want = new URLSearchParams(location.search).get("host");
        if (want && assets.some((a) => a.id === want)) currentHostId = want;
      } catch (e) { /* 주소가 이상해도 화면은 떠야 한다 */ }
    }
    // 열어둔 호스트가 있으면 최신 데이터로 다시 그린다(업로드 후 갱신 등).
    if (currentHostId) {
      const still = assets.find((a) => a.id === currentHostId);
      if (still) openHost(still, true); else closeDetail();
    }
    // (요약 5칸 갱신은 2026-08-21에 걷었다 — 심각도는 그림띠가, 스캔 호스트는 그림띠 제목이 맡는다)
    if (vheatOn) renderVHeat();  // 히트맵 뷰가 켜져 있으면 함께 갱신
  }


  async function init() {
    await refresh();


    document.querySelectorAll("[data-page]").forEach((el) => {
      el.addEventListener("click", () => (window.gijoOpenScreen ? window.gijoOpenScreen(el.dataset.page) : window.gijo.navigateTo(el.dataset.page)));
    });
    // 스캔 파일 인입은 대시보드 ＋로 통일(2026-07-27). 비인증 스캔 경고도 그쪽 결과 카드로 옮겼다.

    // 호스트 행 클릭 → 취약점 목록 열기/닫기 (행은 매번 다시 그려지므로 tbody에 위임)
    hostRows.addEventListener("click", (e) => {
      const tr = e.target.closest("tr[data-id]");
      if (!tr) return;
      const asset = hostCache.find((a) => a.id === tr.dataset.id);
      if (!asset) return;
      if (currentHostId === asset.id) closeDetail(); else openHost(asset);
    });
    // 목록 ⇄ 히트맵 전환 + 히트맵 상세의 「대화창에 묻기」(지시는 전부 대화창)
    document.getElementById("vvList").addEventListener("click", () => setVView(false));
    document.getElementById("vvHeat").addEventListener("click", () => setVView(true));
    document.getElementById("vheatSide").addEventListener("click", (e) => {
      const b = e.target.closest(".mv-ask");
      if (b && b.dataset.ask && window.gijo && window.gijo.askConsole) window.gijo.askConsole(b.dataset.ask);
    });
    try { if (localStorage.getItem("gijo:vuln:view") === "heat") setVView(true); } catch (e) {}
    document.getElementById("vdClose").addEventListener("click", closeDetail);
    // 심각도 필터 칩 (정렬 토글 칩은 data-sev 가 없으므로 제외)
    document.querySelectorAll(".vd-chip[data-sev]").forEach((chip) => {
      chip.addEventListener("click", () => {
        vdFilter = chip.dataset.sev;
        document.querySelectorAll(".vd-chip[data-sev]").forEach((c) => c.classList.toggle("active", c === chip));
        renderVdList();
      });
    });
    // 정렬 토글: 심각도 순 ↔ 악용확률(EPSS) 순
    document.getElementById("vdSortBtn").addEventListener("click", (e) => {
      vdSort = vdSort === "sev" ? "epss" : "sev";
      e.target.textContent = vdSort === "epss" ? "↕ 악용확률 순" : "↕ 심각도 순";
      e.target.classList.toggle("active", vdSort === "epss");
      renderVdList();
    });
    document.getElementById("vdSearch").addEventListener("input", renderVdList);
    // 취약점 항목 클릭 → 상세(CVE 목록·증거) 펼치기 + 선택(펼친 취약점이 「이거」)
    document.getElementById("vdList").addEventListener("click", (e) => {
      const btn = e.target.closest(".vd-remediate");
      if (btn) { e.stopPropagation(); if (!btn.classList.contains("done")) remediate(btn); return; }
      const item = e.target.closest(".vd-item");
      if (!item) return;
      item.classList.toggle("open");
      const asset = hostCache.find((a) => a.id === currentHostId);
      const 이름 = (item.querySelector(".vd-name") || {}).textContent || "";
      if (item.classList.contains("open") && 이름 && asset) {
        // fields — 펼친 항목의 실제 값(카드 재료). 화면이 이미 그린 것만 옮긴다(재계산 금지).
        var 심각도 = (item.querySelector(".sev, [class*=sev-]") || {}).textContent || "";
        var 한줄 = (item.querySelector(".vd-plain, .dt-plain") || {}).textContent || "";
        선택알림(이름.slice(0, 60), "자산 " + asset.name + "의 취약점 " + 이름, {
          asset: asset.name, title: 이름, severity: 심각도.trim(), plain: 한줄.replace(/^→\s*/, "").trim(),
          kev: item.textContent.indexOf("KEV") >= 0 ? "KEV" : "",
          // ⌗기계 키(QA ③) — 배정·판정이 글자 대조 없이 정확히 이 건을 잡게 한다.
          assetId: asset.id, findingKey: item.dataset.fkey || "",
        });
      } else if (asset) {
        선택알림(asset.name, "자산 " + asset.name); // 접으면 열어 둔 자산으로 되돌아간다
      }
    });
  }

  if (!window.gijo.isAuthenticated()) {
    window.gijo.navigateTo("login.html");
  } else {
    init();
  }
</script>
