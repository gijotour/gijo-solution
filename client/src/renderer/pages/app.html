<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>GIJO AS</title>
<!-- 디자인 시스템을 처음부터 건다 — nav.js가 나중에 주입하기도 하지만, 그러면 첫 그림이
     기본 글꼴로 그려졌다가 바뀌어 깜빡인다(셸은 앱의 첫 화면이라 특히 눈에 띈다). -->
<link rel="stylesheet" href="gijo-ui.css">
<style>
  :root{--bg:#262624;--panel:#30302e;--panel-2:#1f1e1d;--border:rgba(255,255,255,0.08);--border-strong:rgba(255,255,255,0.16);
    --blue:#3b82f6;--blue-light:#5fa1ff;--text:#e9e7e2;--muted:#b3ada4;--muted-2:#a49d95;--teal:#1eb980;--red:#e2483d;--amber:#f0a020;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;}
  body{font-family:"Pretendard","Malgun Gothic","Segoe UI",sans-serif;background:var(--bg);color:var(--text);}

  /* 셸 뼈대 — [상단 조작 줄] 아래 왼쪽 메뉴 고정, 오른쪽은 [탭줄 / 화면 / 콘솔] 세로 3단
     ⚠ 상단 줄은 창 전체 폭을 쓴다(사이드바 위까지). 메뉴를 접어도 조작이 남으려면 이 자리여야 한다. */
  body{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
  /* 상단 조작 줄 — 높이는 OS 창 버튼(titleBarOverlay 46px)과 맞춘다.
     낮으면 버튼이 줄 밖으로 삐져나오고, 높으면 화면이 그만큼 줄어든다. */
  /* 하단 고정바 — 상단 바와 짝을 이룬다(같은 바탕·같은 테두리 두께). */
  /* 하단 통합 줄 — 탭 + 창 조작 + 심볼이 **한 줄**에 산다(2026-08-08 시안 ㉯ 승인).
     34px → 40px로 6px만 늘렸다: 탭줄(44px)을 따로 두면 상단 빈 띠까지 122px가 되지만,
     합치면 84px(상단 44 + 여기 40)로 끝난다. 세로를 파는 대신 탭을 아래로 옮긴 값이다. */
  .shellfoot{display:flex;align-items:center;gap:9px;flex:0 0 auto;height:40px;padding:0 12px;
    border-top:1px solid var(--border);background:var(--panel-2);color:var(--muted-2);font-size:12px;}
  .shellfoot img{height:14px;opacity:.55;}
  /* ⚠ 예전엔 `.shellfoot span{margin-left:auto}`였다. 창 조작이 내려오면서 버튼 **안의**
     <span id="tbWinCnt">까지 이 규칙에 걸려 「🗔 창」과 숫자가 갈라졌다 — 클래스로 좁힌다. */
  .shellfoot .brand{flex:0 0 auto;margin-left:auto;}
  /* 하단 줄 안 조작 단추 — 40px 안에 24px 단추가 들어간다. */
  .shellfoot .tb-act{padding-bottom:0;}
  .shellfoot .tb-btn{padding:3px 8px;font-size:11.75px;}
  /* 상단 줄의 내력 — 두 번 바뀌었다. 다음 사람이 "왜 이 모양인가"를 알아야 또 안 뒤집는다.
     ① ~2026-08-07: 조작줄(46px) + 탭줄(44px) 두 줄 = 90px. 경로 표시가 활성 탭과 따로 갱신돼
        어긋나는 사고까지 있었다(실측: 대시보드를 보는데 「설정 › 시스템 로그」).
     ② 2026-08-07: 탭줄 하나(44px)로 합침. 경로는 **활성 탭이 곧 경로**라 갱신할 상태가 없다.
     ③ 2026-08-08(지금): 사용자 지시로 **탭을 아래로** 내렸다(시안 ㉯ 승인). 상단 44px는
        창 버튼(OS가 그린다) 때문에 어차피 비워야 하므로, 빈 띠 대신 조작·세션·시계를 둔다.
        탭은 하단 줄(40px)이 창 조작과 함께 받는다 — 총합 84px(②보다 6px 늘고 ①보다 6px 준다). */
  /* ⚠ **줄 높이를 못 박는다**(2026-08-02 사용자 신고: "상단 하단 고정탭 아직도 문제있음 …
       고정값이 필요할듯"). 격자 줄은 기본이 auto라 **내용이 요구하는 만큼 늘어난다** —
       실측에서 안쪽 내용이 900px를 요구해 854px 칸을 넘겼고, 그만큼 하단 바가 창 밖으로
       밀려났다(하단바 위치 912 / 창 높이 900 → 안 보임).
       minmax(0,1fr)로 두면 줄이 남는 높이만 쓰고, 넘치는 내용은 안에서 스크롤한다. */
  .app{display:grid;grid-template-columns:232px minmax(0,1fr);grid-template-rows:minmax(0,1fr);
    flex:1;min-height:0;overflow:hidden;}
  .app > *{min-height:0;}
  #gijoNav{border-right:1px solid var(--border);background:var(--panel-2);min-height:0;display:flex;flex-direction:column;}
  .work{display:flex;flex-direction:column;min-width:0;min-height:0;}

  /* 상단 조작 줄(#shellTop) — 탭이 아래로 내려간 뒤 이 자리를 맡는다(2026-08-08 시안 ㉯).
     ⚠ 오른쪽 끝은 **비워 둬야 한다.** 이 앱은 OS 타이틀바를 숨기고(titleBarStyle:hidden)
       창 컨트롤(─ ▢ ✕)을 오버레이로 그리게 해 뒀는데(main.ts, 높이 44px), 그 자리가 바로
       이 줄의 오른쪽이다. 그냥 두면 시계·세션이 창 버튼 **밑에 깔린다** —
       좁을 땐 가려 안 보이다가 창을 넓히면 삐져나오고, 겹친 가장자리는 클릭도 된다
       (2026-07-28 사용자 신고: "오른쪽 위 종료 버튼 있는 데 뒤에 뭐가 보인다").
     ⚠ 폭을 숫자로 박지 않는다 — 창 버튼 너비는 OS·테마·배율마다 다르다.
       브라우저가 알려주는 실제 값(env(titlebar-area-*))으로 남는 폭만큼만 비운다.
       그 값이 없는 환경(오버레이 미사용)에서는 fallback으로 0이 된다.
     ⚠ 높이 44px는 main.ts titleBarOverlay와 **같아야 한다**(다르면 창 버튼이 삐져나온다). */
  /* ⚠ **왼쪽도** 비워야 한다 — 위 설명은 오른쪽(Windows)만 보고 쓴 것이었다.
       macOS는 창 버튼(신호등 ● ● ●)이 **왼쪽**에 그려진다. 왼쪽을 10px만 두면
       맨 앞 단추(⚙)가 신호등 위로 올라간다 (2026-08-09 사용자 신고 화면: 톱니가
       노란 버튼을 덮고 있었다). 겹친 자리는 눌리기까지 한다.
     ⚠ 여기서도 숫자를 박지 않는다. env(titlebar-area-x)가 곧 「왼쪽에 비켜야 할 폭」이고,
       창 버튼이 오른쪽인 Windows에서는 그 값이 0이라 10px 그대로 남는다 —
       한 줄로 두 OS가 다 맞는다.
       (같은 처리가 titlebar.js의 .header에는 이미 있었다. 30개 화면이 멀쩡하고
        셸만 겹친 이유가 그것이다.) */
  .topbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;height:44px;
    padding:0 10px;
    padding-left:calc(10px + env(titlebar-area-x, 0px));
    padding-right:calc(10px + 100vw - env(titlebar-area-width, 100vw) - env(titlebar-area-x, 0px));
    border-bottom:1px solid var(--border);background:var(--panel-2);
    -webkit-app-region:drag;}
  .topbar .spacer{flex:1 1 auto;}
  /* 창을 끄는 손잡이는 이제 이 줄뿐이다 — 그 안의 누르는 것들만 되돌린다
     (안 되돌리면 단추가 안 눌리고 창만 끌린다). */
  .topbar button,.topbar .gtb-acts,.topbar .gtb-sess,.topbar input,.topbar select{-webkit-app-region:no-drag;}
  /* 조작 단추(⚙ ▣ 🔍 ← →)는 titlebar.js가 여기 맨 앞에 붙인다 */
  .topbar .gtb-acts{padding-bottom:0;}

  /* 탭줄 — **하단 통합 줄 안**에 산다(2026-08-08 시안 ㉯). 높이는 하단 줄이 정하고
     여기서는 남는 가로만 쓴다. 탭이 많으면 이 안에서 가로로 스크롤된다. */
  .tabbar{flex:1 1 auto;display:flex;align-items:center;gap:2px;min-width:0;height:100%;
    overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;}
  /* 활성 탭 앞의 구역 표시 — 「② 우선순위 ›」. 탭이 곧 경로다(별도 상태 없음). */
  .tab .tgrp{flex:0 0 auto;font-weight:600;color:var(--muted-2);overflow:hidden;white-space:nowrap;}
  /* 오른쪽 정보(시계·서버상태·세션) — titlebar.js가 채운다. 창 버튼 여백 바로 앞. */
  #tbInfo{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 6px 6px 4px;-webkit-app-region:no-drag;}
  #tbInfo .tb-clock{font-size:12.25px;color:var(--muted);white-space:nowrap;}
  #tbInfo .tb-status{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--teal);
    background:rgba(30,185,128,.14);border:1px solid rgba(30,185,128,.4);padding:3px 10px;border-radius:16px;white-space:nowrap;}
  #tbInfo .tb-status .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
  .tabbar::-webkit-scrollbar{height:5px;}
  .tabbar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:3px;}
  /* 탭이 **아래**에 있으므로 둥근 쪽도 아래다(2026-08-08 시안 ㉯) — 화면과 맞닿는 위쪽은
     각지게 두어야 활성 탭이 그 위 화면과 한 덩어리로 읽힌다. */
  .tab{display:flex;align-items:center;gap:7px;padding:6px 10px 6px 12px;border-radius:0 0 9px 9px;font-size:12.5px;font-weight:600;
    color:var(--muted);cursor:pointer;white-space:nowrap;border:1px solid transparent;border-top:none;max-width:230px;flex:0 0 auto;}
  .tab:hover{color:#fff;background:rgba(255,255,255,.04);}
  .tab.on{color:#fff;background:var(--bg);border-color:var(--border);font-weight:700;}
  .tab .nm{overflow:hidden;text-overflow:ellipsis;}
  .tab .x{flex:0 0 auto;opacity:0;font-size:12px;color:var(--muted-2);border-radius:5px;padding:0 4px;line-height:1.5;}
  .tab:hover .x,.tab.on .x{opacity:.75;}
  .tab .x:hover{opacity:1;color:#fff;background:rgba(226,72,61,.4);}
  .tab.pinned .x{display:none;}
  .tab .pin{flex:0 0 auto;font-size:11.25px;color:var(--blue-light);}
  /* ★ 창을 마우스로 끌 수 있는 자리 (2026-08-01 사용자 지적 — "마우스 눌러서 창을 이동하는건데").
     이 앱은 윈도우 제목표시줄을 숨기고(main.ts titleBarStyle:"hidden") 버튼 셋만 OS가 그린다.
     그런데 셸에는 끌 수 있는 자리가 **하나도 없어서 본창을 아예 못 옮겼다** — 실앱에서
     맨 위 가운데를 찍어 보니 잡히는 것이 DIV.spacer였고 drag 영역이 아니었다.
     ⚠ 그 손잡이는 **탭줄에서 상단 조작 줄(.topbar)로 넘어갔다**(2026-08-08 탭을 아래로 내리면서).
       탭줄이 아래로 간 뒤에도 여기에 drag를 남겨 두면, 탭을 누르려다 창이 끌린다. */
  .tabbar .tab,.tabbar button,.tabbar .winmenu,.tabbar input,.tabbar select{-webkit-app-region:no-drag;}
  .tb-act{flex:0 0 auto;display:flex;align-items:center;gap:4px;}
  .tb-btn{font-size:12.25px;font-weight:700;color:var(--muted);background:transparent;border:1px solid var(--border);border-radius:7px;padding:4px 9px;cursor:pointer;white-space:nowrap;}
  .tb-btn:hover{color:#fff;border-color:var(--blue);}

  /* 열린 창 목록 */
  .winmenu{position:relative;}
  /* ⚠ 창 목록은 **위로** 연다 — 단추가 하단바로 내려갔기 때문이다(2026-08-08).
     top으로 두면 목록이 창 아래로 나가 한 줄도 안 보인다. */
  .winpop{display:none;position:absolute;right:0;bottom:calc(100% + 5px);z-index:60;min-width:230px;
    background:var(--panel);border:1px solid var(--border-strong);border-radius:10px;padding:5px;
    box-shadow:0 12px 34px rgba(0,0,0,.5);}
  .winpop.on{display:block;}
  .winpop .wp-h{font-size:12px;color:var(--muted-2);padding:5px 8px 6px;}
  .wp-row{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;cursor:pointer;font-size:12px;color:var(--text);}
  .wp-row:hover{background:rgba(59,130,246,.14);}
  .wp-row .ic{flex:0 0 auto;font-size:12px;}
  .wp-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .wp-row .tag{flex:0 0 auto;font-size:11.75px;color:var(--muted-2);}
  .wp-row.now .nm{color:var(--blue-light);font-weight:700;}
  .wp-row .cl{flex:0 0 auto;font-size:12.25px;color:var(--muted-2);padding:0 4px;border-radius:5px;opacity:.5;}
  .wp-row .cl:hover{opacity:1;color:#fff;background:rgba(226,72,61,.4);}
  .wp-empty{padding:8px;font-size:12.5px;color:var(--muted-2);line-height:1.7;}

  /* 화면 영역 — 탭마다 iframe 하나, 활성만 보인다(숨겨도 살아 있어 보던 상태가 유지된다) */
  .screens{flex:1 1 auto;position:relative;min-height:0;background:var(--bg);}
  .screen{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg);}
  .screen.on{display:block;}
  .screens .blank{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted-2);font-size:13px;}


  /* 콘솔 — 셸에 있으므로 탭을 옮겨도 대화가 끊기지 않는다. 겉모습은 console.js가 넣는다.
     높이는 **대화 4줄이 보이는 만큼으로 고정**한다(2026-07-28 사용자 결정).
       맥락 줄 34 + 대화 4줄(22px×4=88) + 입력 52 + 여백 16 ≒ 190px
     끌어서 늘리는 손잡이는 없앴다 — 끄는 동안 아래 iframe이 매번 다시 그려져 버벅였다.
     더 넓게 보려면 「⧉ 창으로」로 빼면 된다. */
  .console{flex:0 0 auto;display:flex;flex-direction:column;height:190px;min-height:190px;
    background:var(--panel-2);border-top:1px solid var(--border);}

  /* ★ 넓은 창에서는 대화창을 **오른쪽 세로 패널**로 세운다 (2026-08-01 사용자 결정 · 시안 ③).
     왜: 아래 도킹은 화면마다 세로 190px를 먹는다 — 1920×1080에서 세로의 17.6%다.
        우리 화면은 표·목록이 많아 세로가 귀하고 가로는 상대적으로 여유가 있다.
        옆으로 세우면 세로를 100% 쓰고 가로만 내준다(VS Code Copilot·Cursor·JetBrains AI가
        고른 방식이기도 하다).
     ⚠ **한 가지로 고정하면 절반의 환경에서 나쁘다**(실측). 세로 모니터(1080×1920)에서는
        가로가 귀해서 반대가 된다 — 아래 도킹은 세로의 9.9%뿐이고, 옆에 두면 본문이
        660px만 남아 표가 깨진다. 그래서 **창 너비로 자동 전환**하고, 담당자가 언제든 바꾼다.
     기준 1600px 근거: Material Design 3의 Extra-large 등급(1600~)이 다분할 배치를 권한다.
        1600에서 패널 380을 빼도 본문이 1220 남아 우리 표가 들어간다. */
  /* ⚠ 줄 구성이 2026-08-08에 뒤집혔다. 예전에는 [1행=탭줄 / 2행=화면+콘솔]이었는데
     탭이 하단 줄로 내려가면서 **[1행=화면+콘솔 / 2행=하단 줄]**이 됐다.
     ⚠ 실측 사고: 이 격자를 안 고치고 탭만 옮겼더니 .shellfoot이 자리를 못 받아
       자동 배치로 **1행(맨 위 y=44)에 붙었다** — 하단 줄이 위로 올라가 보였다.
       격자에서는 "자리를 안 주면 아래로 가는" 것이 아니라 **빈 칸을 찾아 위로 간다.** */
  .work.console-side{display:grid;grid-template-columns:minmax(0,1fr) var(--console-w, 380px);
    grid-template-rows:minmax(0,1fr) auto;}
  .work.console-side .console{grid-column:2;grid-row:1;height:auto;min-height:0;
    border-top:0;border-left:1px solid var(--border);}
  .work.console-side .screens{grid-column:1;grid-row:1;}
  .work.console-side .shellfoot{grid-column:1 / -1;grid-row:2;}
  /* ⚠ 대화창을 **창으로 빼 두면** 도킹 콘솔은 숨겨진다(.console{display:none}). 그때도 옆 자리를
     비워 두면 **본문만 380px 줄고 그 자리가 텅 빈다**(실측: 1196 → 816). 없는 것을 위해
     자리를 남기지 않는다 — 분리 상태에서는 한 칸으로 되돌린다. */
  body.console-popped .work.console-side{display:flex;flex-direction:column;}
  /* 창으로 빼냈을 때 — 콘솔을 접는다(화면이 100%가 된다).
     예전엔 본문 아래에 안내 줄(.console-out, 38px)을 가로로 깔았는데, 대화창을 뺄수록
     화면이 좁아지는 모순이 있어 **왼쪽 패널 문서함 줄 위로** 옮겼다(2026-08-08 시안 승인). */
  body.console-popped .console{display:none;}
  /* 대화 되돌리기 줄 — titlebar.js가 사용자 영역 안에 만든다. 분리했을 때만 보인다
     (붙어 있을 때는 누를 일이 없는 단추라, 늘 두면 메뉴 높이를 상시로 먹는다). */
  #csBackRow{display:none;}
  body.console-popped #csBackRow{display:block;}
  #csBackRow .tb-btn{width:100%;text-align:center;padding:4px 6px;font-size:11.75px;}
</style>
</head>
<body class="g-ui">

<!-- 상단 조작 줄(#shellTop, 44px) — **탭은 아래에 있다**(2026-08-08 사용자 지시·시안 ㉯ 승인).
     ⚠ 이 44px는 없앨 수 없다: 창 버튼(─ ▢ ✕)을 Windows가 상단에 직접 그린다
       (main.ts titleBarOverlay height:44). 그래서 빈 띠로 버리는 대신 조작·세션·시계에 쓴다.
     ⚠ 창을 끄는 **유일한 손잡이**이기도 하다(예전엔 탭줄이 그 일을 했다).
     조작 단추(⚙ ▣ 🔍 ← →)와 시계·세션은 titlebar.js가 붙인다 — 여기 직접 적지 말 것(단일 소스). -->
<div class="topbar" id="shellTop">
  <div class="spacer"></div>
  <!-- 시계·세션 — titlebar.js가 채운다(예전에 화면마다 있던 것을 셸 한 곳으로).
       ⚠ 서버 연결상태 배지는 없앴다(2026-08-08 사용자 지시) — titlebar.js 정보채우기 참조. -->
  <div id="tbInfo"></div>
</div>
<div class="app">
  <div id="gijoNav"></div>
  <div class="work">
    <div class="screens" id="screens"><div class="blank">왼쪽 메뉴에서 화면을 고르면 탭으로 열립니다.</div></div>
    <!-- 콘솔은 console.js가 그린다 — 별도 창(console.html)과 같은 파일을 쓴다(자리만 다르다). -->
    <div class="console" id="console"><div id="consoleHost" data-mode="dock"></div></div>
    <!-- 콘솔을 창으로 빼냈을 때 자리에 남는 안내 -->
    <!-- 하단 고정바 — 화면마다 다르던 푸터를 **셸에 하나로** 모았다(2026-08-02 사용자 지시).
         왼쪽 아래 사용자 줄 **옆**에서 시작해 창 오른쪽 끝까지 간다(.work 안이라 자동으로 그렇다).
         ⚠ 화면 안 푸터는 전부 감춘다 — 두 개가 겹쳐 보이면 "왜 두 번 나오지"가 된다. -->
    <div class="shellfoot">
      <!-- 하단 한 줄이 **탭과 창 조작을 함께** 단다(2026-08-08 시안 ㉯ 승인).
           탭줄(44px)을 따로 두면 상단 빈 띠 44px까지 더해 122px가 된다 — 합쳐서 84px로 끝낸다.
           ⚠ 창 목록 팝업(winpop)은 **위로** 열어야 한다(아래로 열면 창 밖이다). -->
      <div class="tabbar" id="tabBar"></div>
      <div class="tb-act">
        <button class="tb-btn" id="tbPopout" title="지금 탭을 별도 창으로 빼냅니다 — 두 화면을 나란히 볼 때">⧉ 창으로</button>
        <button class="tb-btn" id="tbCloseAll" title="고정하지 않은 탭을 모두 닫습니다">모두 닫기</button>
        <!-- 대화창 자리 바꾸기 — 넓은 창이면 기본이 「옆」이고, 여기서 언제든 되돌린다. -->
        <button class="tb-btn" id="tbConsoleSide" title="대화창 자리를 바꿉니다">▥ 옆으로</button>
        <!-- 열린 창 목록 — 빼낸 창이 본창 뒤에 숨어 못 찾는 일을 없앤다(4.0.1 사용자 요청). -->
        <div class="winmenu">
          <button class="tb-btn" id="tbWins" title="열려 있는 창 목록 — 누르면 그 창이 앞으로">🗔 창 <span id="tbWinCnt"></span></button>
          <div class="winpop" id="winPop"></div>
        </div>
      </div>
      <!-- 브랜드는 **심볼만** 남긴다(시안 ㉯). 탭이 같은 줄에 오면서 「GIJO Technology」 글자까지
           두면 탭이 그만큼 좁아진다 — 글자는 설정 › 정보에 있다. -->
      <img class="brand" src="gijo-symbol.svg" alt="GIJO">
    </div>

    <!-- 「⇤ 여기로 다시 붙이기」는 **왼쪽 패널 문서함 줄 위로 이사했다**(2026-08-08 시안 승인).
         본문 아래 가로 한 줄(38px)을 통째로 먹던 자리라, 대화창을 빼낼수록 화면이 좁아졌다.
         만드는 곳은 titlebar.js buildUserArea(셸에서만) — 보이고 숨는 것은 아래 CSS가 정한다. -->
  </div>
</div>

<script>
// app.html — 앱 탭 셸 (4.0.0).
//
// 왜 만들었나: 여태 화면을 "대시보드 위 팝업"으로 띄웠는데 겹이 3중(대시보드→허브→실화면)이라
// 레이아웃이 0으로 굳어 빈 화면이 되는 사고가 났다(2026-07-28). 분리창은 2겹이라 멀쩡했다.
// 그래서 겹을 **셸→실화면 2겹으로 고정**하고, 여러 화면은 팝업 대신 탭으로 유지한다.
// 탭은 숨겨도 iframe이 살아 있어 스크롤·필터·입력 같은 "보던 상태"가 그대로 남는다.
//
// 콘솔이 셸에 있는 것이 핵심이다 — 셸은 리로드되지 않으므로 탭을 아무리 옮겨도 대화가 안 끊긴다.
// (팝업이 존재하던 유일한 이유가 "이동하지 않아 대화가 유지된다"였는데, 그걸 구조로 해결한다.)
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var KEY_TABS = "gijo:tabs:v1";
  var MAX_TABS = 8;          // 살아있는 iframe이라 무한정 열면 메모리를 먹는다

  var tabs = [];             // {page, label, el, frame, pinned}
  var active = null;

  function save() {
    try {
      localStorage.setItem(KEY_TABS, JSON.stringify({
        open: tabs.map(function (t) { return { page: t.page, label: t.label, pinned: !!t.pinned }; }),
        active: active ? active.page : null,
      }));
    } catch (e) {}
  }

  function embedSrc(page) { return page + (page.indexOf("?") >= 0 ? "&" : "?") + "embed=1"; }
  // 합쳐서 없어진 화면의 **옛 탭**을 새 이름·새 주소로 바로잡는다 (2026-08-02).
  //
  // ⚠ iframe 쪽 리다이렉트만으로는 부족하다. 리다이렉트는 화면 안에서 일어나고 **탭 이름은
  //   셸이 따로 저장**하므로, 그냥 두면 「자산 통합 뷰」라는 이름 안에 자산 목록이 뜬다 —
  //   이름과 내용이 다르면 담당자는 잘못 눌렀다고 생각한다(실측 2026-08-02).
  // ⚠ 새 이름은 사이드바(nav.js GROUPS)에 적힌 것과 **같아야** 한다.
  var 옛탭 = {
    "assethub.html": { page: "inventory.html", label: "자산 목록" },
    "opsguide.html": { page: "maintenance.html", label: "정기 점검" },
    "ontology.html": { page: "memory.html", label: "AI 지식" },
    "mywork.html": { page: "dashboard.html", label: "대시보드" },
  };
  function 옛탭바로잡기(o) {
    var m = 옛탭[String(o && o.page || "").split("?")[0]];
    return m ? { page: m.page, label: m.label, pinned: !!(o && o.pinned) } : o;
  }

  /** 화면 주소 → 사람이 읽는 이름. 못 찾으면 빈 문자열(부르는 쪽이 판단한다).
   *
   * ⚠ **파일명을 사람에게 보이지 않는다**(2026-08-18 사장님 QA 발견: 탭에 `discover.html?p…`).
   *   뿌리 — `open(page, label)`이 `label || page`로 떨어지는데(아래), `nav.js`의 리다이렉트 표는
   *   옛 화면 **23개**를 허브(`?panel=…`)로 넘기면서 **이름은 안 바꿔 준다.** 위 `옛탭` 표는
   *   그중 **4개만** 손으로 적어 둔 것이라 나머지 19개가 파일명을 그대로 드러냈다.
   * ⚠ 그래서 표를 더 채우지 않는다 — 그건 지금 4/23이 된 바로 그 방식이다.
   *   **이름의 주인은 사이드바(nav.js GROUPS)**이므로 거기서 찾아 쓴다(단일 출처).
   *   nav.js가 아직 안 실렸으면 빈 값을 주고, 다음 그리기 때 다시 찾는다. */
  function 화면이름찾기(page) {
    var 주소 = String(page || "");
    var 파일 = 주소.split("?")[0];
    var G = window.gijoNavGroups;
    if (!G || !G.length) return "";
    for (var i = 0; i < G.length; i++) {
      var items = G[i].items || [];
      for (var j = 0; j < items.length; j++) {
        var it = items[j];
        if (!it || !it.page) continue;
        // 주소 전체가 같으면 가장 좋고(패널까지 일치), 아니면 파일명으로 맞춘다.
        if (it.page === 주소) return it.label || G[i].label || "";
        if (String(it.page).split("?")[0] === 파일) return it.label || G[i].label || "";
      }
      if (G[i].page && String(G[i].page).split("?")[0] === 파일) return G[i].label || "";
    }
    return "";
  }


  function find(page) {
    for (var i = 0; i < tabs.length; i++) if (tabs[i].page === page) return tabs[i];
    return null;
  }

  // 탭 안 화면에 데이터가 안 들어오는 것을 스스로 고친다 — 겹을 줄여도 이 플레이크는 남을 수 있어
  // 안전망은 유지한다(2026-07-28 실측: 다시 읽으면 살아난다, 리플로우로는 안 살아난다).
  var HEAL_MAX = 2;
  function healFrames() {
    tabs.forEach(function (t) {
      var f = t.frame;
      try {
        var d = f.contentDocument;
        if (!d || d.readyState !== "complete") return;
        var n = Number(f.dataset.healTries || 0);
        if (!f.contentWindow.gijo) {
          if (n >= HEAL_MAX) return;
          f.dataset.healTries = String(n + 1);
          console.warn("[shell] 탭에 연결 통로가 안 실렸습니다 — 다시 읽습니다:", t.page, "(" + (n + 1) + "/" + HEAL_MAX + ")");
          f.src = f.src;
          return;
        }
        if (t !== active) { f.dataset.emptyTicks = "0"; return; } // 숨은 탭은 원래 글자가 안 잡힌다
        var blank = !((d.body && d.body.innerText || "").trim().length);
        f.dataset.emptyTicks = blank ? String(Number(f.dataset.emptyTicks || 0) + 1) : "0";
        if (blank && Number(f.dataset.emptyTicks) >= 2 && n < HEAL_MAX) {
          f.dataset.healTries = String(n + 1);
          f.dataset.emptyTicks = "0";
          console.warn("[shell] 탭이 빈 화면입니다 — 다시 읽습니다:", t.page, "(" + (n + 1) + "/" + HEAL_MAX + ")");
          f.src = f.src;
        }
      } catch (e) { /* 교차 출처 등 */ }
    });
  }
  setInterval(healFrames, 1500);

  // 화면이 속한 메뉴 구역 — 활성 탭 앞에 「구역 ›」로 보인다. nav.js의 메뉴 목록(단일 소스)을
  // 그대로 읽을 뿐 따로 저장하지 않는다 — 저장하는 순간 어긋날 두 번째 상태가 생긴다(옛 조작줄 사고).
  function groupOf(page) {
    var 목록 = (typeof window.gijoScreenList === "function") ? window.gijoScreenList() : [];
    var 정확 = null, 파일만 = null;
    for (var i = 0; i < 목록.length; i++) {
      var p = 목록[i].page || "";
      if (p === page) { 정확 = 목록[i]; break; }
      if (!파일만 && p.split("?")[0] === String(page).split("?")[0]) 파일만 = 목록[i];
    }
    return ((정확 || 파일만 || {}).group) || "";
  }

  function renderTab(t) {
    var el = document.createElement("div");
    el.className = "tab" + (t.pinned ? " pinned" : "");
    // 고정은 더블클릭인데, 더블클릭은 화면에 흔적이 없어 아무도 모른다(사용자가 "탭 고정키는
    // 어떻게 쓰냐"고 물어 왔다 — 2026-07-28). 말로 적어 둔다.
    el.title = t.label + "\n" + (t.pinned
      ? "📌 고정됨 — 두 번 클릭하면 고정이 풀립니다"
      : "두 번 클릭하면 고정됩니다 (고정한 탭은 ✕와 「모두 닫기」로 닫히지 않습니다)");
    if (t === active) {
      var g = groupOf(t.page);
      if (g) { var gs = document.createElement("span"); gs.className = "tgrp"; gs.textContent = g + " ›"; el.appendChild(gs); }
    }
    var nm = document.createElement("span"); nm.className = "nm"; nm.textContent = t.label;
    el.appendChild(nm);
    if (t.pinned) { var p = document.createElement("span"); p.className = "pin"; p.textContent = "📌"; el.appendChild(p); }
    var x = document.createElement("span"); x.className = "x"; x.textContent = "✕"; x.title = "탭 닫기";
    x.addEventListener("click", function (ev) { ev.stopPropagation(); close(t.page); });
    el.appendChild(x);
    el.addEventListener("click", function () { show(t.page); });
    // 가운데 버튼으로 닫기 — 브라우저 관례
    el.addEventListener("auxclick", function (ev) { if (ev.button === 1) { ev.preventDefault(); close(t.page); } });
    // 더블클릭 = 고정 토글(고정한 탭은 '모두 닫기'에도 안 닫힌다)
    el.addEventListener("dblclick", function () { t.pinned = !t.pinned; redraw(); save(); });
    t.el = el;
    return el;
  }

  function redraw() {
    var bar = $("tabBar");
    Array.prototype.slice.call(bar.querySelectorAll(".tab")).forEach(function (e) { e.remove(); });
    var anchor = bar.querySelector(".spacer");
    tabs.forEach(function (t) {
      var el = renderTab(t);
      el.classList.toggle("on", t === active);
      bar.insertBefore(el, anchor);
    });
    var blank = $("screens").querySelector(".blank");
    if (blank) blank.style.display = tabs.length ? "none" : "";
  }

  /** 끝내 이름을 못 찾았을 때 쓰는 **읽을 만한 이름**. 파일명을 그대로 보이지 않는 마지막 방어.
   *  `discover.html?panel=assets` → 「발견·수집」 같은 것을 못 찾으면 최소한 「화면」이라고 쓴다.
   *  ⚠ 여기까지 왔다는 건 사이드바에 없는 화면이라는 뜻이다 — 파일명을 보이느니 담백한 편이 낫다. */
  function 읽을이름(page) {
    var 이름 = 화면이름찾기(page);
    if (이름) return 이름;
    var 파일 = String(page || "").split("?")[0].replace(/\.html$/i, "");
    // 파일명이 사람 말이 아니면(영문 소문자·하이픈뿐) 감춘다.
    return /^[a-z0-9_-]+$/i.test(파일) ? "화면" : (파일 || "화면");
  }

  function open(page, label) {
    if (!page) return;
    // ⚠ 이름이 없으면 **사이드바에서 찾는다** — 없다고 파일명을 사람에게 보이면 안 된다
    //   (2026-08-18 사장님 QA: 탭에 `discover.html?p…`). 자세한 사정은 화면이름찾기 주석.
    if (!label) label = 화면이름찾기(page) || "";
    var t = find(page);
    if (!t) {
      // 상한에 닿으면 **열지 않고 알린다**(2026-07-28 사용자 지시).
      // 전에는 가장 오래 안 본 탭을 조용히 닫고 새 탭을 열었다. 그게 더 매끄러워 보였지만,
      // 담당자는 그 탭에서 필터를 걸고 스크롤을 내려 둔 상태였다 — 말없이 사라지면 그 작업이
      // 통째로 날아간다. 무엇을 버릴지는 사람이 정할 일이다.
      if (tabs.length >= MAX_TABS) {
        var free = tabs.filter(function (x) { return !x.pinned; }).length;
        gijoTell("화면은 한 번에 " + MAX_TABS + "개까지 열 수 있습니다.\n\n" +
          "보던 화면이 말없이 닫히면 걸어 둔 조건과 스크롤이 사라지므로, 여기서 멈춥니다.\n\n" +
          (free > 0
            ? "필요 없는 탭을 ✕로 닫고 다시 열어 주세요."
            : "지금은 " + MAX_TABS + "개가 모두 📌 고정 상태입니다.\n닫으려는 탭을 두 번 클릭해 고정을 푼 뒤 ✕로 닫아 주세요."));
        return;
      }
      var f = document.createElement("iframe");
      f.className = "screen";
      f.title = label || 읽을이름(page);
      $("screens").appendChild(f);
      // 문서 파싱 중에 src를 붙이면 서브프레임 preload 주입이 간헐적으로 빠진다(실측) — 다음 프레임에.
      (function (frame, p) { requestAnimationFrame(function () { frame.src = embedSrc(p); }); })(f, page);
      t = { page: page, label: label || 읽을이름(page), frame: f, pinned: false };
      tabs.push(t);
    }
    show(page);
  }

  function show(page) {
    var t = find(page);
    if (!t) return;
    active = t;
    tabs.forEach(function (x) { x.frame.classList.toggle("on", x === t); });
    redraw();
    setCtx(t.label);
    save();
    // 상단 바 ← →에게 "지금 이 화면을 본다"고 알린다.
    // ⚠ 셸 안에서는 **문서가 안 바뀐다**(화면은 iframe 탭이다) — 주소 이력에 기대면 뒤로 가기가
    //   영원히 흐린 채로 남는다(2026-08-02 실측에서 login→app 두 칸만 쌓였다).
    //   그래서 "본 화면 순서"는 여기서 직접 알려 준다.
    if (typeof window.gijoNoteScreen === "function") window.gijoNoteScreen(t.page, t.label);
  }

  function close(page, quiet) {
    var t = find(page);
    if (!t) return;
    var idx = tabs.indexOf(t);
    t.frame.remove();
    tabs.splice(idx, 1);
    if (active === t) {
      active = tabs[Math.min(idx, tabs.length - 1)] || null;
      if (active) active.frame.classList.add("on");
      setCtx(active ? active.label : "대시보드");
    }
    if (!quiet) { redraw(); save(); }
  }

  function closeAll() {
    tabs.slice().forEach(function (t) { if (!t.pinned) close(t.page, true); });
    redraw(); save();
  }

  // 명령 맥락 — 보고 있는 탭이 곧 지시 대상이다. 팝업 시절처럼 어느 슬롯이 맥락인지 따로
  // 추적할 필요가 없다(화면이 하나뿐이라 애매함이 없다).
  // 콘솔이 도킹이면 그 자리에서 바로 읽고, 창으로 빠져 있으면 메인 프로세스를 거쳐 알린다.
  function setCtx(label) {
    if (window.gijoConsoleSyncCtx) window.gijoConsoleSyncCtx();
    if (window.gijo && window.gijo.onShellOpenTab) {
      // 지휘소가 "이 화면 열어 주세요" 하면 탭으로 연다(셸을 갈아치우지 않는다).
      window.gijo.onShellOpenTab(function (i) {
        if (i && i.page && window.gijoTabs) window.gijoTabs.open(i.page, i.label || undefined);
      });
    }
    if (popped && window.gijo && window.gijo.sendConsoleContext) {
      window.gijo.sendConsoleContext(active ? active.page : null, label || null);
    }
  }

  // ── 콘솔 자리(아래 도킹 ↔ 별도 창) ────────────────────────────────────
  var popped = false;
  function setPopped(on) {
    popped = !!on;
    document.body.classList.toggle("console-popped", popped);
    try { localStorage.setItem("gijo:console:popped", popped ? "1" : "0"); } catch (e) {}
    if (popped) setCtx(active ? active.label : null); // 창에 지금 맥락을 즉시 알린다
  }
  window.gijoConsoleHidden = setPopped; // console.js가 '창으로' 눌렀을 때 셸에 알린다

  // ── 화면/대화 비율 ────────────────────────────────────────────────────
  // 콘솔 높이는 **고정**이다(2026-07-28 사용자 결정). 예전엔 손잡이를 끌어 비율을 바꿨는데
  // 움직임이 매끄럽지 않았다 — mousemove마다 높이를 바꾸면 그 아래 iframe이 통째로 다시
  // 레이아웃되기 때문이다(무거운 화면일수록 끊긴다). 끌면서 계속 버벅이는 조작은 없느니만 못하다.
  // 대신 넓게 보고 싶으면 「⧉ 창으로」가 있다 — 그쪽이 본래 그 용도다.
  // 옛 저장값(gijo:console:height)은 더 쓰지 않는다 — 남아 있어도 무시된다.

  // ── 공개 API ──────────────────────────────────────────────────────────
  // nav.js가 메뉴 클릭 때 이걸 보고 "이동" 대신 "탭 열기"를 한다.
  // activeScreen()은 팝업 셸(window.gijoShell)이 쓰던 이름을 그대로 유지한다 — 콘솔·서버 쪽이
  // 그 이름으로 "지금 보는 화면"을 묻고 있어서, 이관 중에도 깨지지 않게 한다.
  window.gijoTabs = {
    open: open,
    show: show,
    close: close,
    closeAll: closeAll,
    list: function () { return tabs.map(function (t) { return { page: t.page, label: t.label, pinned: t.pinned }; }); },
    activeScreen: function () { return active ? active.page : null; },
    activeLabel: function () { return active ? active.label : null; },
  };
  // (옛 이름 window.gijoShell 별칭은 두지 않는다 — 팝업 셸을 지운 뒤 부르는 곳이 없다.
  //  이름을 남겨 두면 "아직 팝업이 있나" 하고 헷갈릴 뿐이다.)

  // 탭 안 화면이 셸에 부탁하는 것들.
  window.addEventListener("message", function (ev) {
    var d = ev && ev.data;
    if (!d) return;
    // ① "이 화면 열어줘" — 자기 자리를 갈아치우지 않고 새 탭으로(대시보드 바로가기 타일 등).
    if (d.type === "gijo:openTab" && d.page) {
      var known = window.gijoMenuLabel ? window.gijoMenuLabel(d.page) : null;
      open(d.page, d.label || known || d.page);
      return;
    }
    // ② "이 화면 설명해줘"(ⓘ) — 화면 안 챗봇을 없앴으므로 콘솔이 답한다.
    // ⑤′ "이걸 골랐어" — 화면(iframe)이 항목을 고르면 대화창 머리에 📌칩이 붙는다(2026-08-09 2단계).
    if (d.type === "gijo:select" && window.gijoConsole && window.gijoConsole.select) {
      // ⚠ **값을 다시 만들어 넘긴다** — iframe이 보낸 것을 그대로 믿지 않는다(String 강제).
      //   2026-08-18: 여기서 label·text만 골라 담느라 **fields가 조용히 사라졌다.** 보내는 쪽과
      //   받는 쪽(console.js setSelection)만 고치면 화면은 멀쩡한데 상태 패널이 영영 안 뜬다.
      //   fields도 같은 방어를 걸어 통과시킨다 — **아는 키만 · 문자열 강제 · 길이 캡**.
      var 허용키 = ["asset", "title", "severity", "status", "owner", "due", "plain", "kev", "assetId", "findingKey"];
      var f = null;
      if (d.fields && typeof d.fields === "object") {
        f = {};
        허용키.forEach(function (k) {
          if (d.fields[k] == null) return;
          var v = String(d.fields[k]).replace(/\s+/g, " ").trim();
          if (v) f[k] = v.slice(0, 200); // 한 칸이 길어도 카드가 안 무너지게
        });
        if (!Object.keys(f).length) f = null;
      }
      window.gijoConsole.select(d.label && d.text ? { label: String(d.label), text: String(d.text), fields: f } : null);
      return;
    }
    if (d.type === "gijo:explain" && window.gijoConsole) {
      // 화면 안내는 카드 한 장으로(2026-08-09 재설계) — 말풍선으로 쌓으면 같은 안내가
      // 중복된다(실측 3중복). 특정 주제(topic)는 일반 대화로 — 그건 안내가 아니라 질문이다.
      if (!d.topic && window.gijoConsole.guide) window.gijoConsole.guide();
      else window.gijoConsole.ask(d.topic ? '"' + d.topic + '" 사용법 알려줘' : "이 화면에서 뭐 할 수 있어?");
      return;
    }
    // ③ "이 지시를 대신 물어봐" — 콘솔은 셸에 있고 화면은 iframe 안이라 화면이 직접 못 부른다.
    //    대시보드 시작 가이드 카드가 "해보기"를 누를 때 쓴다. ②와 달리 문구를 감싸지 않고
    //    **담당자가 직접 친 것과 똑같이** 보낸다 — 카드가 가르치는 것이 곧 실제로 쓰는 말이어야 한다.
    if (d.type === "gijo:ask" && d.text && window.gijoConsole) {
      window.gijoConsole.ask(String(d.text));
    }
    // ④ "문장만 얹어 줘" — ③과 달리 **보내지 않는다**. 뒷말을 담당자가 채워야 하는 자리에 쓴다
    //    (대시보드 「적어 넣기」 → "할 일 추가: "). 빈 칸만 보면 무슨 말을 할지 몰라 멈춘다.
    if (d.type === "gijo:prefill" && d.text && window.gijoConsole && window.gijoConsole.prefill) {
      window.gijoConsole.prefill(String(d.text));
    }
  });

  $("tbCloseAll").addEventListener("click", closeAll);

  // ── 대화창 자리: **오른쪽이 기본** ──────────────────────────────────────
  // 사용자 결정(2026-08-09): "아래는 쓰지 말자 — 대화 쓸 공간이 없다. 오른쪽에 붙는 걸 기본으로."
  //   아래에 붙이면 높이가 얼마 안 남아 몇 줄 쓰면 화면이 꽉 찬다. 옆에 세우면 세로를 다 쓴다.
  //   (그전 규칙은 창 너비 1600 이상일 때만 옆이었다 — 그래서 넓지 않은 창에서는 늘 아래였다.)
  // 버튼은 그대로 둔다 — 좁은 화면에서 아래가 나은 사람은 언제든 바꾼다. 다만 **기본이 옆**이다.
  var SIDE_KEY = "gijo:console:side"; // "auto" | "side" | "dock"
  // 예전에 아래로 굳어 있던 설정을 한 번만 풀어 준다(담당자가 이 결정 뒤에 고른 값은 그대로 둔다).
  var SIDE_MIGRATED = "gijo:console:side:v2";
  try {
    if (!localStorage.getItem(SIDE_MIGRATED)) {
      if (localStorage.getItem(SIDE_KEY) === "dock") localStorage.removeItem(SIDE_KEY);
      localStorage.setItem(SIDE_MIGRATED, "1");
    }
  } catch (e) {}
  function 자리모드() {
    try { return localStorage.getItem(SIDE_KEY) || "auto"; } catch (e) { return "auto"; }
  }
  function 옆에둘까() {
    var m = 자리모드();
    if (m === "side") return true;
    if (m === "dock") return false;
    return true; // auto = 오른쪽(기본)
  }
  function 자리적용() {
    var 옆 = 옆에둘까();
    document.querySelector(".work").classList.toggle("console-side", 옆);
    var b = $("tbConsoleSide");
    if (b) {
      b.textContent = 옆 ? "▤ 아래로" : "▥ 옆으로";
      b.title = 옆
        ? "대화창을 화면 아래로 옮깁니다"
        : "대화창을 오른쪽에 세웁니다 — 세로 공간이 넓어집니다";
    }
    // 자리를 바꾸면 iframe 크기가 달라진다 — 안에서 크기를 재는 화면이 다시 재게 알린다.
    //
    // ⚠ **셸 자신에게 쏘면 무한 되풀이가 된다**(2026-08-01 실측: RangeError Maximum call stack).
    //   아래 resize 리스너가 다시 자리적용()을 부르고, 그게 또 resize를 쏜다.
    //   알려야 할 대상은 셸이 아니라 **탭 안의 화면들**이므로 iframe에만 쏜다.
    try {
      document.querySelectorAll("#screens iframe").forEach(function (f) {
        try { f.contentWindow.dispatchEvent(new Event("resize")); } catch (e) {}
      });
    } catch (e) {}
  }
  $("tbConsoleSide").addEventListener("click", function () {
    // 지금과 반대쪽으로 **명시적으로** 고정한다(자동으로 되돌아가면 담당자가 진 것처럼 느낀다).
    try { localStorage.setItem(SIDE_KEY, 옆에둘까() ? "dock" : "side"); } catch (e) {}
    자리적용();
  });
  // 창 크기가 바뀌면 자동 모드에서만 따라간다.
  window.addEventListener("resize", function () { if (자리모드() === "auto") 자리적용(); });
  자리적용();

  // ── 열린 창 목록 ─────────────────────────────────────────────────────
  // 빼낸 창(화면·대화·팀 사무실)은 본창 뒤로 숨는다. 작업표시줄에도 뜨지만 아이콘이 다 같아
  // 구분이 안 된다 — 앱이 자기 창을 아니까 앱이 알려준다.
  var WIN_ICON = { main: "▣", popout: "⧉", console: "💬", office: "🏢" };
  function closeWinPop() { $("winPop").classList.remove("on"); }
  async function refreshWinCount() {
    if (!window.gijo || !window.gijo.listWindows) { $("tbWins").style.display = "none"; return; }
    try {
      var ws = await window.gijo.listWindows();
      // 본 창 말고 **빼낸 것이 몇 개인지**를 보여준다 — 0이면 숫자를 안 붙인다(늘 1이면 뜻이 없다).
      var extra = ws.filter(function (w) { return w.kind !== "main"; }).length;
      $("tbWinCnt").textContent = extra ? String(extra) : "";
    } catch (e) {}
  }
  async function openWinPop() {
    var pop = $("winPop");
    pop.innerHTML = '<div class="wp-h">열려 있는 창</div>';
    var ws = [];
    try { ws = await window.gijo.listWindows(); } catch (e) {}
    if (!ws.length) { pop.innerHTML += '<div class="wp-empty">창을 못 읽었습니다.</div>'; pop.classList.add("on"); return; }
    ws.forEach(function (w) {
      var row = document.createElement("div");
      row.className = "wp-row" + (w.focused ? " now" : "");
      row.innerHTML = '<span class="ic">' + (WIN_ICON[w.kind] || "▫") + "</span>" +
        '<span class="nm"></span>' +
        '<span class="tag">' + (w.focused ? "지금 여기" : w.minimized ? "최소화됨" : "") + "</span>";
      row.querySelector(".nm").textContent = w.label;
      row.addEventListener("click", function () {
        closeWinPop();
        if (window.gijo.focusWindow) window.gijo.focusWindow(w.id);
      });
      // 본 창은 여기서 닫지 않는다 — 앱이 통째로 꺼져 놀란다(창 버튼 ✕이 그 자리다).
      if (w.kind !== "main") {
        var x = document.createElement("span");
        x.className = "cl"; x.textContent = "✕"; x.title = "이 창 닫기";
        x.addEventListener("click", async function (ev) {
          ev.stopPropagation();
          if (window.gijo.closeWindow) await window.gijo.closeWindow(w.id);
          openWinPop(); refreshWinCount();
        });
        row.appendChild(x);
      }
      pop.appendChild(row);
    });
    if (ws.length === 1) pop.innerHTML += '<div class="wp-empty">빼낸 창이 없습니다.<br>「⧉ 창으로」로 탭이나 대화를 창으로 뺄 수 있습니다.</div>';
    pop.classList.add("on");
  }
  $("tbWins").addEventListener("click", function (e) {
    e.stopPropagation();
    if ($("winPop").classList.contains("on")) closeWinPop(); else openWinPop();
  });
  document.addEventListener("click", closeWinPop);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeWinPop(); });
  $("winPop").addEventListener("click", function (e) { e.stopPropagation(); });
  refreshWinCount();
  window.gijoRefreshWinCount = refreshWinCount; // 아래 onPopoutContext 쪽에서도 부른다
  // ⚠ onPopoutContext는 removeAllListeners로 등록하므로 여기서 또 부르면 **앞서 붙인 것이
  //   지워진다**(맥락 전달이 죽는다). 그래서 따로 붙이지 않고, 원래 핸들러 안에서 같이 센다.
  // ⚠ 「⇤ 다시 붙이기」는 이제 **왼쪽 패널 안**에 있고 titlebar.js가 나중에 만든다 —
  //   여기서 getElementById로 잡으면 그 시점엔 없어서 TypeError로 셸 초기화가 통째로 죽는다
  //   (없는 것을 부르는 단추 사고의 재발 방지). 문서에 위임해 두면 언제 생기든 걸린다.
  document.addEventListener("click", function (e) {
    var t = e.target;
    if (!t || !t.closest || !t.closest("#csBackBtn")) return;
    if (window.gijo && window.gijo.dockConsoleWindow) window.gijo.dockConsoleWindow();
  });
  // 빼낸 창을 클릭해 보고 있으면 그 화면이 맥락이다 — 규칙은 하나: **보고 있는 것이 맥락**.
  // 창을 닫으면 다시 활성 탭으로 돌아온다.
  if (window.gijo && window.gijo.onPopoutContext) {
    window.gijo.onPopoutContext(function (kind, info) {
      if (kind === "focus" && info && info.label) setCtx(String(info.label));
      else if (kind === "closed") setCtx(active ? active.label : null);
      setTimeout(refreshWinCount, 250); // 창이 생기거나 닫힐 때마다 목록 개수를 맞춘다
    });
  }
  // 콘솔 창을 닫으면 다시 아래에 붙인다 — 안 그러면 대화할 곳이 사라진다.
  if (window.gijo && window.gijo.onConsoleClosed) {
    window.gijo.onConsoleClosed(function () { setPopped(false); setTimeout(refreshWinCount, 250); });
  }
  $("tbPopout").addEventListener("click", function () {
    if (!active) return;
    if (window.gijo && window.gijo.openShellPopout) window.gijo.openShellPopout(active.page, active.label);
    setTimeout(refreshWinCount, 700);
  });

  // ── 복원 ──────────────────────────────────────────────────────────────
  function boot() {
    if (!window.gijo || !window.gijo.isAuthenticated || !window.gijo.isAuthenticated()) {
      if (window.gijo && window.gijo.navigateTo) window.gijo.navigateTo("login.html");
      return;
    }
    var st = null;
    try { st = JSON.parse(localStorage.getItem(KEY_TABS) || "null"); } catch (e) {}
    if (st && st.open && st.open.length) {
      // ⚠ 바로잡으면 두 옛 탭이 같은 화면을 가리킬 수 있다(자산 통합 뷰 + 자산 목록) —
      //   그대로 열면 같은 탭이 두 번 생긴다. open()이 이미 있는 탭을 재사용하므로 안전하지만,
      //   활성 탭 주소도 함께 바로잡아야 엉뚱한 탭이 선택된다.
      st.open.map(옛탭바로잡기).forEach(function (o) { open(o.page, o.label); if (o.pinned) { var t = find(o.page); if (t) t.pinned = true; } });
      var 활성 = (옛탭[String(st.active || "").split("?")[0]] || {}).page || st.active;
      if (활성 && find(활성)) show(활성);
      redraw();
    } else {
      open("dashboard.html", "대시보드"); // 첫 실행 — 대시보드도 여러 탭 중 하나다
    }
    // 지난번에 콘솔을 창으로 빼놨으면 그대로 이어간다(모니터가 여럿인 담당자는 한 번만 빼면 된다).
    var wasPopped = "0";
    try { wasPopped = localStorage.getItem("gijo:console:popped") || "0"; } catch (e) {}
    if (wasPopped === "1" && window.gijo.openConsoleWindow) { setPopped(true); window.gijo.openConsoleWindow(); }
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
<script src="progresscard.js"></script>
<script src="gijomd.js"></script>
<script src="chatparts.js"></script>
<script src="console.js"></script>
<script src="nav.js"></script>
<script src="titlebar.js"></script>
