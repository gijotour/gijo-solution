<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>GIJO AS</title>
<!-- 디자인 시스템을 처음부터 건다 — nav.js가 나중에 주입하기도 하지만, 그러면 첫 그림이
     기본 글꼴로 그려졌다가 바뀌어 깜빡인다(셸은 앱의 첫 화면이라 특히 눈에 띈다). -->
<link rel="stylesheet" href="gijo-ui.css">
<style>
  :root{--bg:#262624;--panel:#30302e;--panel-2:#1f1e1d;--border:rgba(255,255,255,0.08);--border-strong:rgba(255,255,255,0.16);
    --blue:#3b82f6;--blue-light:#5fa1ff;--text:#e9e7e2;--muted:#b3ada4;--muted-2:#a49d95;--teal:#1eb980;--red:#e2483d;--amber:#f0a020;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;}
  body{font-family:"Pretendard","Malgun Gothic","Segoe UI",sans-serif;background:var(--bg);color:var(--text);}

  /* 셸 뼈대 — [상단 조작 줄] 아래 왼쪽 메뉴 고정, 오른쪽은 [탭줄 / 화면 / 콘솔] 세로 3단
     ⚠ 상단 줄은 창 전체 폭을 쓴다(사이드바 위까지). 메뉴를 접어도 조작이 남으려면 이 자리여야 한다. */
  body{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
  /* 상단 조작 줄 — 높이는 OS 창 버튼(titleBarOverlay 46px)과 맞춘다.
     낮으면 버튼이 줄 밖으로 삐져나오고, 높으면 화면이 그만큼 줄어든다. */
  /* 하단 고정바 — 상단 바와 짝을 이룬다(같은 바탕·같은 테두리 두께). */
  /* 하단 통합 줄 — 탭 + 창 조작 + 심볼이 **한 줄**에 산다(2026-08-08 시안 ㉯ 승인).
     34px → 40px로 6px만 늘렸다: 탭줄(44px)을 따로 두면 상단 빈 띠까지 122px가 되지만,
     합치면 84px(상단 44 + 여기 40)로 끝난다. 세로를 파는 대신 탭을 아래로 옮긴 값이다. */
  .shellfoot{display:flex;align-items:center;gap:9px;flex:0 0 auto;height:40px;padding:0 12px;
    border-top:1px solid var(--border);background:var(--panel-2);color:var(--muted-2);font-size:12px;}
  .shellfoot img{height:14px;opacity:.55;}
  /* ⚠ 예전엔 `.shellfoot span{margin-left:auto}`였다. 창 조작이 내려오면서 버튼 **안의**
     <span id="tbWinCnt">까지 이 규칙에 걸려 「🗔 창」과 숫자가 갈라졌다 — 클래스로 좁힌다. */
  .shellfoot .brand{flex:0 0 auto;margin-left:auto;}
  /* 하단 줄 안 조작 단추 — 40px 안에 24px 단추가 들어간다. */
  .shellfoot .tb-act{padding-bottom:0;}
  .shellfoot .tb-btn{padding:3px 8px;font-size:11.75px;}
  /* 상단 줄의 내력 — 두 번 바뀌었다. 다음 사람이 "왜 이 모양인가"를 알아야 또 안 뒤집는다.
     ① ~2026-08-07: 조작줄(46px) + 탭줄(44px) 두 줄 = 90px. 경로 표시가 활성 탭과 따로 갱신돼
        어긋나는 사고까지 있었다(실측: 대시보드를 보는데 「설정 › 시스템 로그」).
     ② 2026-08-07: 탭줄 하나(44px)로 합침. 경로는 **활성 탭이 곧 경로**라 갱신할 상태가 없다.
     ③ 2026-08-08(지금): 사용자 지시로 **탭을 아래로** 내렸다(시안 ㉯ 승인). 상단 44px는
        창 버튼(OS가 그린다) 때문에 어차피 비워야 하므로, 빈 띠 대신 조작·세션·시계를 둔다.
        탭은 하단 줄(40px)이 창 조작과 함께 받는다 — 총합 84px(②보다 6px 늘고 ①보다 6px 준다). */
  /* ⚠ **줄 높이를 못 박는다**(2026-08-02 사용자 신고: "상단 하단 고정탭 아직도 문제있음 …
       고정값이 필요할듯"). 격자 줄은 기본이 auto라 **내용이 요구하는 만큼 늘어난다** —
       실측에서 안쪽 내용이 900px를 요구해 854px 칸을 넘겼고, 그만큼 하단 바가 창 밖으로
       밀려났다(하단바 위치 912 / 창 높이 900 → 안 보임).
       minmax(0,1fr)로 두면 줄이 남는 높이만 쓰고, 넘치는 내용은 안에서 스크롤한다. */
  .app{display:grid;grid-template-columns:232px minmax(0,1fr);grid-template-rows:minmax(0,1fr);
    flex:1;min-height:0;overflow:hidden;}
  .app > *{min-height:0;}
  /* ── 🚀 프로 셸 (2026-08-18 승인 시안) ────────────────────────────────────
     사이드바 232px → **56px 아이콘 레일**. 대화가 주인공이고 화면은 부를 때만 온다.
     ⚠ **반드시 위 `.app` 규칙 아래에 적는다.** 위에 적으면 shelllayout.test.ts가
       `.app{…}` **첫 매치**를 잡아 `grid-template-rows`·`flex:1`·`min-height:0` 검사가
       프로 규칙을 보고 실패한다. 순서가 시험의 전제다. */
  /* 🏠 셸 재구축 0-2(2026-08-23) — 왼쪽 56px 레일을 **상단바로 옮겼다.**
     ⚠ #gijoRail 요소는 **지우지 않았다** — railroster.js와 titlebar.js가 id로 찾는다.
       마크업만 .topbar 안으로 옮기고 아래에서 가로로 눕힌다.
     🗂 셸 재구축 0-3(2026-08-27, 사장님 「1+3」) — 왼쪽에 **접는 화면 메뉴 판**이 선다.
     ■ 두 줄이 원자다(설계 검토 [BLOCKER]): 아래 「두 칸 격자」와 「#gijoNav 표시」는
       반드시 함께 산다 — display:none만 걷으면 grid 자동 배치가 #gijoNav를 1행에 넣고
       .work가 암묵 2행으로 떨어져 화면 전체가 아래로 밀리는 즉사형이다.
     ■ 판의 내용은 셸이 nav.js의 gijoRenderMenu를 **재사용**해 그린다(아래 메뉴판설치) —
       그룹 접기·즐겨찾기·배지·클릭(gijoTabs.open)이 표준과 한 원천이다. 새로 그리지 않는다.
     ■ 접기(1+3의 「3」)는 **새 키**(gijo:proMenu:collapsed)다 — 표준의
       gijo:leftPanel:collapsed(LEFT_KEY)를 같이 쓰면 프로에서 접은 것이 표준 사이드바를
       접는다(설계 검토 [높음]). body 클래스가 --menu-w를 0으로 만들 뿐, 격자 규칙은 하나다. */
  body.pro-shell .app{grid-template-columns:var(--menu-w, 200px) minmax(0,1fr);}
  /* nav.js injectCss가 #gijoNav에 sticky·100vh를 주입한다(단독 화면용) — 프로 격자는
     44px 상단바 아래라 100vh가 넘친다. !important 아닌 선언이라 특이도로 이긴다. */
  body.pro-shell #gijoNav{display:flex;position:static;height:auto;align-self:stretch;
    min-width:0;overflow-y:auto;overflow-x:hidden;}
  body.pro-shell.pro-menu-closed{--menu-w:0px;}
  /* 0px 칸에서 테두리 1px가 실선으로 남는다 — 접힘엔 선도 지운다(injectCss가 !important라 여기도). */
  body.pro-shell.pro-menu-closed #gijoNav{border-right:0 !important;}
  /* 레일을 상단바 안에서 **가로 줄**로. 세로 시절 규칙(테두리·배경·세로 정렬)을 여기서 되돌린다. */
  body.pro-shell #gijoRail{flex-direction:row;align-items:center;gap:3px;padding:0;
    border-right:0;background:transparent;overflow:visible;flex:0 0 auto;}
  /* 44px 상단바에 38px은 꽉 낀다 — 프로에서만 32px로 줄인다.
     ⚠ `#gijoRail button`(id 특이도)이 38px을 박고 있어 클래스만으로는 안 눌린다
       (2026-08-20 검토관 M1이 같은 자리에서 잡았다). body.pro-shell을 앞에 붙여 이긴다. */
  body.pro-shell #gijoRail button,body.pro-shell #gijoRail .rr-item{width:32px;height:32px;font-size:14px;}
  body.pro-shell #gijoRail .rr-item{font-size:12px;}
  /* 구분선도 세로에서 가로로 — 26×1 가로줄이 아니라 1×20 세로줄이 된다. */
  body.pro-shell #gijoRail .rr-div{width:1px;height:20px;margin:0 4px;}
  /* 계정·문서함(rail-foot)은 「맨 아래로 밀기」가 뜻이 없어졌다 — 오른쪽으로 이어 붙인다. */
  body.pro-shell #gijoRail .rail-foot{margin-top:0;margin-left:4px;flex-direction:row;width:auto;align-items:center;}
  /* 프로는 탭 개념이 없다(화면=별도 창, 승인 시안) — 탭줄·탭 조작 띠를 통째로 감춘다.
     2026-08-19 사용자 테스트 P2: 빈 탭바 띠와 옛 탭 2개가 남아 「대화가 주인공」을 깼다. */
  body.pro-shell .shellfoot{display:none;}
  /* 56px 아이콘 레일 — 사이드바를 대신한다. 계정·문서함이 여기 아래에 붙는다
     (titlebar.js mountUserArea의 세 번째 갈래) — 안 붙이면 통째로 사라진다. */
  #gijoRail{display:none;flex-direction:column;align-items:center;gap:5px;padding:10px 0;
    border-right:1px solid var(--border);background:var(--panel-2);min-height:0;overflow-y:auto;}
  /* AI 팀 로스터(승인 시안 AI팀_가시화, 2026-08-20) — 깜박임은 전부 서버 실신호(railroster.js) */
  #gijoRail .rr-item{width:38px;height:38px;/* 32px 시안은 #gijoRail button(id 특이도)에 눌려 무효였다(검토관 M1) — 기존 버튼과 38px 통일, 접근성 40px 권장에도 더 가깝다 */border-radius:9px;background:transparent;border:1px solid var(--border);color:var(--muted);font-size:13.5px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;flex:0 0 auto;font-weight:800;}
  #gijoRail .rr-item:hover{border-color:var(--border-strong);color:var(--text-strong, #fff);}
  #gijoRail .rr-item.watching{border-color:rgba(95,161,255,.5);color:var(--blue-l,var(--blue-light));box-shadow:inset 0 0 0 1px rgba(95,161,255,.35);/* 테두리만으론 id 규칙에 눌려 안 보였다 — inset 링 추가 */border-color:rgba(95,161,255,.5);color:var(--blue-l,var(--blue-light));}
  #gijoRail .rr-item.working{border-color:rgba(30,185,128,.6);color:var(--teal);animation:rrbreath 1.6s ease-in-out infinite;}
  @keyframes rrbreath{0%,100%{box-shadow:0 0 0 0 rgba(30,185,128,.35);}50%{box-shadow:0 0 0 5px rgba(30,185,128,0);}}
  #gijoRail .rr-item.flash-search{animation:rrflash .9s ease-out;}
  #gijoRail .rr-item.flash-guard-ok{animation:rrflash .9s ease-out;}
  #gijoRail .rr-item.flash-guard-warn{border-color:rgba(240,160,32,.7);color:var(--amber);animation:rrflash .9s ease-out;}
  #gijoRail .rr-item.flash-guard-block{border-color:rgba(226,72,61,.7);color:var(--red-ink, #f5928a);animation:rrflashred .9s ease-out;}
  @keyframes rrflash{0%{box-shadow:0 0 0 0 rgba(95,161,255,.5);}100%{box-shadow:0 0 0 8px rgba(95,161,255,0);}}
  @keyframes rrflashred{0%{box-shadow:0 0 0 0 rgba(226,72,61,.55);}100%{box-shadow:0 0 0 8px rgba(226,72,61,0);}}
  #gijoRail .rr-item.training{border-color:rgba(139,124,240,.65);color:var(--purple,#8b7cf0);animation:rrtrain 1.5s ease-in-out infinite;}
  @keyframes rrtrain{0%,100%{box-shadow:0 0 0 0 rgba(139,124,240,.4);}50%{box-shadow:0 0 0 5px rgba(139,124,240,0);}}
  .rr-div{width:26px;height:1px;background:var(--border-strong);margin:7px 0;flex:0 0 auto;}
  body.pro-shell #gijoRail{display:flex;}
  #gijoRail button{width:38px;height:38px;border-radius:9px;background:transparent;border:1px solid transparent;
    color:var(--muted);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;
    font-family:inherit;position:relative;flex:0 0 auto;}
  #gijoRail button:hover{background:rgba(255,255,255,.06);color:var(--text-strong, #fff);border-color:var(--border);}
  #gijoRail .rail-foot{margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:5px;width:100%;}
  /* ── 대화 홈(캔버스 없음) — 시안의 idle 상태 ────────────────────────────
     ⚠ `.screens`를 감추기만 하면 **1열이 빈 채로 남고** 대화창은 오른쪽 380px에 갇힌다
       (창의 65%가 텅 빈다). 이건 `console-popped`가 이미 겪고 적어 둔 사고와 **같은 것**이라
       그때의 처방(격자 → flex 컬럼)을 그대로 쓴다. 새 격자를 만들지 않는다. */
  body.chat-home .work.console-side{display:flex;flex-direction:column;}
  /* ⚠ 이 줄이 **필수다.** flex로 돌아가면 `.console{flex:0 0 auto}`가 다시 먹어
     대화창이 내용 높이만큼만 쪼그라든다. */
  body.chat-home .work.console-side .console{flex:1 1 auto;border-left:0;}
  body.chat-home .screens{display:none;}
  /* 탭이 0개면 탭줄·「모두 닫기」가 가리킬 대상이 없다 — 자리만 차지한다. */
  body.chat-home .shellfoot{display:none;}
  /* ── 🏠 화면 + 대화 나란히(stage-on) — 셸 재구축 0-1, 2026-08-23 사장님 지시 ─────────
     「내 문서가 메인 화면이 되고 여기에 +대화창+상단바」.

     ■ 무엇이 바뀌었나 (그전: 「전면 화면」 2026-08-20)
       예전 stage-on은 **대화를 숨기고** 화면이 .work 전체를 먹었다. 대화와 화면이 번갈아
       나오는 구조라, 「내 문서를 보면서 물어본다」가 안 됐다. 이제 **둘 다 선다** —
       왼쪽 화면(#screens) · 오른쪽 대화(.console).
     ■ 새 격자를 만들지 않는다
       `.work.console-side`가 이미 `grid-template-columns: minmax(0,1fr) var(--console-w)`로
       「화면 | 대화」다(231행). 예전엔 그 위에 flex 컬럼을 덮어써서 한 칸으로 만들었을 뿐이라,
       **덮어쓰기를 걷어내면 원래 격자가 그대로 산다.** 새 상태·새 클래스를 만들지 않았다.
     ■ 클래스 이름(stage-on)은 **그대로 둔다**
       게시 관문·QA 도구·titlebar가 이 이름을 읽는다. 뜻만 「전면」→「화면이 왼쪽에 섰다」로
       바뀌었다. 이름을 갈면 그 여섯 곳이 한꺼번에 어긋난다(이 저장소가 반복해 겪은 모양).
     ⚠ grouphub의 「무대(#ghStage)」와 다른 개념이다 — 여기는 셸 층의 표시 상태.
     ⚠ console-popped(대화 분리창)가 이기게 둔다 — 대화를 창으로 뺐으면 본창은 화면 전폭이
       원래 그 모양이라 이 상태를 따로 걸지 않는다.
     ⚠ 게시 관문(publish-gate-ui.mjs)의 무대 검사가 예전엔 `대화숨김`을 요구했다.
       이 CSS와 **같은 커밋에서** 「대화보임」으로 뒤집었다 — 한쪽만 고치면 게시가 막힌다. */
  body.pro-shell.stage-on .screens{display:block;min-height:0;}
  /* 분리창(대화가 딴 창) 중에는 ⊟ 화면 접기가 뜻이 없다 — 누르면 본창이 백지가 된다(검토관 상3). */
  body.console-popped #stageBack{display:none;}
  #gijoNav{border-right:1px solid var(--border);background:var(--panel-2);min-height:0;display:flex;flex-direction:column;}
  .work{display:flex;flex-direction:column;min-width:0;min-height:0;}

  /* 상단 조작 줄(#shellTop) — 탭이 아래로 내려간 뒤 이 자리를 맡는다(2026-08-08 시안 ㉯).
     ⚠ 오른쪽 끝은 **비워 둬야 한다.** 이 앱은 OS 타이틀바를 숨기고(titleBarStyle:hidden)
       창 컨트롤(─ ▢ ✕)을 오버레이로 그리게 해 뒀는데(main.ts, 높이 44px), 그 자리가 바로
       이 줄의 오른쪽이다. 그냥 두면 시계·세션이 창 버튼 **밑에 깔린다** —
       좁을 땐 가려 안 보이다가 창을 넓히면 삐져나오고, 겹친 가장자리는 클릭도 된다
       (2026-07-28 사용자 신고: "오른쪽 위 종료 버튼 있는 데 뒤에 뭐가 보인다").
     ⚠ 폭을 숫자로 박지 않는다 — 창 버튼 너비는 OS·테마·배율마다 다르다.
       브라우저가 알려주는 실제 값(env(titlebar-area-*))으로 남는 폭만큼만 비운다.
       그 값이 없는 환경(오버레이 미사용)에서는 fallback으로 0이 된다.
     ⚠ 높이 44px는 main.ts titleBarOverlay와 **같아야 한다**(다르면 창 버튼이 삐져나온다). */
  /* ⚠ **왼쪽도** 비워야 한다 — 위 설명은 오른쪽(Windows)만 보고 쓴 것이었다.
       macOS는 창 버튼(신호등 ● ● ●)이 **왼쪽**에 그려진다. 왼쪽을 10px만 두면
       맨 앞 단추(⚙)가 신호등 위로 올라간다 (2026-08-09 사용자 신고 화면: 톱니가
       노란 버튼을 덮고 있었다). 겹친 자리는 눌리기까지 한다.
     ⚠ 여기서도 숫자를 박지 않는다. env(titlebar-area-x)가 곧 「왼쪽에 비켜야 할 폭」이고,
       창 버튼이 오른쪽인 Windows에서는 그 값이 0이라 10px 그대로 남는다 —
       한 줄로 두 OS가 다 맞는다.
       (같은 처리가 titlebar.js의 .header에는 이미 있었다. 30개 화면이 멀쩡하고
        셸만 겹친 이유가 그것이다.) */
  .topbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;height:44px;
    padding:0 10px;
    padding-left:calc(10px + env(titlebar-area-x, 0px));
    padding-right:calc(10px + 100vw - env(titlebar-area-width, 100vw) - env(titlebar-area-x, 0px));
    border-bottom:1px solid var(--border);background:var(--panel-2);
    -webkit-app-region:drag;}
  .topbar .spacer{flex:1 1 auto;}
  /* 창을 끄는 손잡이는 이제 이 줄뿐이다 — 그 안의 누르는 것들만 되돌린다
     (안 되돌리면 단추가 안 눌리고 창만 끌린다).
     ⚠ .gtb-userarea를 2026-09-02(여정 점검 F3-03)에 더했다. 프로 셸에서 계정 줄(.ua-row →
       내 설정)과 ⬆ 업데이트 칩(.ua-upd)은 **div라서** 위 목록에 안 걸렸고, 상단바 drag 영역
       안에 그대로 놓여 **눌러도 클릭이 아니라 창 끌기로 먹혔다** — 담당자 눈에는 「눌러도
       아무 일 없는 자리」였다. 붙이는 곳은 titlebar.js mountUserArea 세 번째 갈래(.rail-foot).
     ⚠ -webkit-app-region은 **상속되는 속성이 아니다** — 자식의 계산값은 none으로 남는다.
       Chromium/Electron은 drag 사각형을 합치고 no-drag 사각형을 **빼서** 손잡이 영역을
       만든다. 그래서 바깥 상자 하나만 no-drag로 선언해도 그 안에 든 .ua-row·.ua-upd가
       통째로 손잡이에서 빠진다 — 자식마다 선언할 필요가 없는 이유가 이것이다.
       ⚠ 그러므로 「자식의 getComputedStyle(...).webkitAppRegion이 no-drag인가」로 검증하면
         안 된다(none이 나와 거짓 빨간불이 된다). .gtb-userarea **자신의** 계산값과
         실제 클릭 동작으로 잰다. */
  .topbar button,.topbar .gtb-acts,.topbar .gtb-sess,.topbar .gtb-userarea,.topbar input,.topbar select{-webkit-app-region:no-drag;}
  /* 조작 단추(⚙ ▣ 🔍 ← →)는 titlebar.js가 여기 맨 앞에 붙인다 */
  .topbar .gtb-acts{padding-bottom:0;}

  /* 탭줄 — **하단 통합 줄 안**에 산다(2026-08-08 시안 ㉯). 높이는 하단 줄이 정하고
     여기서는 남는 가로만 쓴다. 탭이 많으면 이 안에서 가로로 스크롤된다. */
  .tabbar{flex:1 1 auto;display:flex;align-items:center;gap:2px;min-width:0;height:100%;
    overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;}
  /* 활성 탭 앞의 구역 표시 — 「② 우선순위 ›」. 탭이 곧 경로다(별도 상태 없음). */
  .tab .tgrp{flex:0 0 auto;font-weight:600;color:var(--muted-2);overflow:hidden;white-space:nowrap;}
  /* 오른쪽 정보(시계·서버상태·세션) — titlebar.js가 채운다. 창 버튼 여백 바로 앞. */
  #tbInfo{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 6px 6px 4px;-webkit-app-region:no-drag;}
  #tbInfo .tb-clock{font-size:12.25px;color:var(--muted);white-space:nowrap;}
  #tbInfo .tb-status{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--teal);
    background:rgba(30,185,128,.14);border:1px solid rgba(30,185,128,.4);padding:3px 10px;border-radius:16px;white-space:nowrap;}
  #tbInfo .tb-status .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
  .tabbar::-webkit-scrollbar{height:5px;}
  .tabbar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:3px;}
  /* 탭이 **아래**에 있으므로 둥근 쪽도 아래다(2026-08-08 시안 ㉯) — 화면과 맞닿는 위쪽은
     각지게 두어야 활성 탭이 그 위 화면과 한 덩어리로 읽힌다. */
  .tab{display:flex;align-items:center;gap:7px;padding:6px 10px 6px 12px;border-radius:0 0 9px 9px;font-size:12.5px;font-weight:600;
    color:var(--muted);cursor:pointer;white-space:nowrap;border:1px solid transparent;border-top:none;max-width:230px;flex:0 0 auto;}
  .tab:hover{color:var(--text-strong, #fff);background:rgba(255,255,255,.04);}
  .tab.on{color:var(--text-strong, #fff);background:var(--bg);border-color:var(--border);font-weight:700;}
  .tab .nm{overflow:hidden;text-overflow:ellipsis;}
  .tab .x{flex:0 0 auto;opacity:0;font-size:12px;color:var(--muted-2);border-radius:5px;padding:0 4px;line-height:1.5;}
  .tab:hover .x,.tab.on .x{opacity:.75;}
  .tab .x:hover{opacity:1;color:var(--text-strong, #fff);background:rgba(226,72,61,.4);}
  .tab.pinned .x{display:none;}
  .tab .pin{flex:0 0 auto;font-size:11.25px;color:var(--blue-light);}
  /* ★ 창을 마우스로 끌 수 있는 자리 (2026-08-01 사용자 지적 — "마우스 눌러서 창을 이동하는건데").
     이 앱은 윈도우 제목표시줄을 숨기고(main.ts titleBarStyle:"hidden") 버튼 셋만 OS가 그린다.
     그런데 셸에는 끌 수 있는 자리가 **하나도 없어서 본창을 아예 못 옮겼다** — 실앱에서
     맨 위 가운데를 찍어 보니 잡히는 것이 DIV.spacer였고 drag 영역이 아니었다.
     ⚠ 그 손잡이는 **탭줄에서 상단 조작 줄(.topbar)로 넘어갔다**(2026-08-08 탭을 아래로 내리면서).
       탭줄이 아래로 간 뒤에도 여기에 drag를 남겨 두면, 탭을 누르려다 창이 끌린다. */
  .tabbar .tab,.tabbar button,.tabbar .winmenu,.tabbar input,.tabbar select{-webkit-app-region:no-drag;}
  .tb-act{flex:0 0 auto;display:flex;align-items:center;gap:4px;}
  .tb-btn{font-size:12.25px;font-weight:700;color:var(--muted);background:transparent;border:1px solid var(--border);border-radius:7px;padding:4px 9px;cursor:pointer;white-space:nowrap;}
  .tb-btn:hover{color:var(--text-strong, #fff);border-color:var(--blue);}

  /* 열린 창 목록 */
  .winmenu{position:relative;}
  /* ⚠ 창 목록은 **위로** 연다 — 단추가 하단바로 내려갔기 때문이다(2026-08-08).
     top으로 두면 목록이 창 아래로 나가 한 줄도 안 보인다. */
  .winpop{display:none;position:absolute;right:0;bottom:calc(100% + 5px);z-index:60;min-width:230px;
    background:var(--panel);border:1px solid var(--border-strong);border-radius:10px;padding:5px;
    box-shadow:0 12px 34px rgba(0,0,0,.5);}
  .winpop.on{display:block;}
  .winpop .wp-h{font-size:12px;color:var(--muted-2);padding:5px 8px 6px;}
  .wp-row{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;cursor:pointer;font-size:12px;color:var(--text);}
  .wp-row:hover{background:rgba(59,130,246,.14);}
  .wp-row .ic{flex:0 0 auto;font-size:12px;}
  .wp-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .wp-row .tag{flex:0 0 auto;font-size:11.75px;color:var(--muted-2);}
  .wp-row.now .nm{color:var(--blue-light);font-weight:700;}
  .wp-row .cl{flex:0 0 auto;font-size:12.25px;color:var(--muted-2);padding:0 4px;border-radius:5px;opacity:.5;}
  .wp-row .cl:hover{opacity:1;color:var(--text-strong, #fff);background:rgba(226,72,61,.4);}
  .wp-empty{padding:8px;font-size:12.5px;color:var(--muted-2);line-height:1.7;}

  /* 화면 영역 — 탭마다 iframe 하나, 활성만 보인다(숨겨도 살아 있어 보던 상태가 유지된다) */
  .screens{flex:1 1 auto;position:relative;min-height:0;background:var(--bg);}
  .screen{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg);}
  .screen.on{display:block;}
  .screens .blank{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted-2);font-size:13px;}


  /* 콘솔 — 셸에 있으므로 탭을 옮겨도 대화가 끊기지 않는다. 겉모습은 console.js가 넣는다.
     높이는 **대화 4줄이 보이는 만큼으로 고정**한다(2026-07-28 사용자 결정).
       맥락 줄 34 + 대화 4줄(22px×4=88) + 입력 52 + 여백 16 ≒ 190px
     끌어서 늘리는 **높이** 손잡이는 없앴다 — 끄는 동안 아래 iframe이 매번 다시 그려져 버벅였다.
     더 넓게 보려면 「⧉ 창으로」로 빼면 된다.
     (2026-08-27 — **가로** 끌개(#conResize)는 되살렸다. 같은 함정을 유령선 방식으로 회피한다:
      끄는 동안 크기 변경 0회, 놓을 때 한 번. 위 폐지 사유는 「드래그 중 실시간 반영」에만 적용된다.) */
  .console{flex:0 0 auto;display:flex;flex-direction:column;height:190px;min-height:190px;
    background:var(--panel-2);border-top:1px solid var(--border);}

  /* ★ 넓은 창에서는 대화창을 **오른쪽 세로 패널**로 세운다 (2026-08-01 사용자 결정 · 시안 ③).
     왜: 아래 도킹은 화면마다 세로 190px를 먹는다 — 1920×1080에서 세로의 17.6%다.
        우리 화면은 표·목록이 많아 세로가 귀하고 가로는 상대적으로 여유가 있다.
        옆으로 세우면 세로를 100% 쓰고 가로만 내준다(VS Code Copilot·Cursor·JetBrains AI가
        고른 방식이기도 하다).
     ⚠ **한 가지로 고정하면 절반의 환경에서 나쁘다**(실측). 세로 모니터(1080×1920)에서는
        가로가 귀해서 반대가 된다 — 아래 도킹은 세로의 9.9%뿐이고, 옆에 두면 본문이
        660px만 남아 표가 깨진다. 그래서 **창 너비로 자동 전환**하고, 담당자가 언제든 바꾼다.
     기준 1600px 근거: Material Design 3의 Extra-large 등급(1600~)이 다분할 배치를 권한다.
        1600에서 패널 380을 빼도 본문이 1220 남아 우리 표가 들어간다. */
  /* ⚠ 줄 구성이 2026-08-08에 뒤집혔다. 예전에는 [1행=탭줄 / 2행=화면+콘솔]이었는데
     탭이 하단 줄로 내려가면서 **[1행=화면+콘솔 / 2행=하단 줄]**이 됐다.
     ⚠ 실측 사고: 이 격자를 안 고치고 탭만 옮겼더니 .shellfoot이 자리를 못 받아
       자동 배치로 **1행(맨 위 y=44)에 붙었다** — 하단 줄이 위로 올라가 보였다.
       격자에서는 "자리를 안 주면 아래로 가는" 것이 아니라 **빈 칸을 찾아 위로 간다.** */
  .work.console-side{display:grid;grid-template-columns:minmax(0,1fr) var(--console-w, 380px);
    grid-template-rows:minmax(0,1fr) auto;}
  .work.console-side .console{grid-column:2;grid-row:1;height:auto;min-height:0;
    border-top:0;border-left:1px solid var(--border);}
  .work.console-side .screens{grid-column:1;grid-row:1;}
  .work.console-side .shellfoot{grid-column:1 / -1;grid-row:2;}
  /* ── 대화창 폭 끌개 (셸 재구축 0-4, 2026-08-27 사장님 「대화창은 크기조정 기능」) ──────
     ■ 왜 이제야 끌개인가 — 2026-07-28에 **높이** 손잡이를 만들었다 걷어낸 이력이 있다
       (mousemove마다 크기를 바꾸면 아래 iframe이 통째로 재레이아웃되어 버벅였다 — 818행).
       이번 가로 끌개는 그 폐지 사유를 정면으로 회피한다: **끄는 동안에는 유령선만 긋고**
       (#conGhost — 크기 변경 0회), **놓는 순간 한 번만** --console-w를 바꾼다.
       그래서 드래그 중 iframe 재레이아웃이 원리상 없다.
     ■ 끌개는 .console의 **형제**로 같은 격자 칸(2,1)에 겹친다 — .console 안에 넣으면
       console.js가 그리는 DOM에 간섭하고, position:relative를 주면 내부 absolute 기준이
       바뀔 수 있다. 형제 겹침은 둘 다 피한다.
     ■ stage-on에서만 보인다 — chat-home(대화 전폭)·console-popped(대화 없음)에는
       끌 대상이 없다(설계 검토 2026-08-27 [높음]). */
  #conResize{display:none;grid-column:2;grid-row:1;justify-self:start;align-self:stretch;
    width:9px;margin-left:-5px;cursor:col-resize;z-index:5;}
  #conResize:hover,#conResize.drag{background:rgba(95,161,255,.28);}
  body.pro-shell.stage-on .work.console-side #conResize{display:block;}
  /* ── 💬 대화창 온디맨드(2026-08-31 사장님 「대화창은 필요할 때만 불러서 보고」) ─────────
     승인 시안 shell-chat-ondemand: stage-on 위에 「대화접힘」 **독립 축** 하나만 얹는다 —
     stage-on/chat-home 전이·클래스 계약은 한 글자도 안 바꾼다(오늘 개정분과 무충돌).
     · 접힘: 화면이 전폭을 얻고(약 +340px), 오른쪽 40px 세로 손잡이만 남는다.
       접힌 동안 도착한 카드·답은 **배지로만** 쌓인다(자동 펼침 기각 — 작업 중 화면을
       밀어내는 방해. 시안 「설계 긴장」 절·PatternFly Notification Drawer 관례).
     · chat-home(대화 전폭)·console-popped(분리창)에는 손잡이도 접힘도 없다 — 접힘은
       「화면 옆 대화」가 성립하는 상태(stage-on)에만 뜻이 있다.
     · ⓘ·질문 얹기 등 **입력을 요구하는 길(toChat)은 접힘을 강제로 푼다** — 카드 도착
       (신호)과 입력 요구(강제 오픈)는 다른 급이다(시안 명시 계약). */
  body.pro-shell.stage-on.console-folded:not(.console-popped) .work.console-side{grid-template-columns:minmax(0,1fr) 40px;}
  body.pro-shell.stage-on.console-folded:not(.console-popped) .work.console-side .console{display:none;}
  body.pro-shell.stage-on.console-folded .work.console-side #conResize{display:none !important;}
  #conSummon{display:none;grid-column:2;grid-row:1;flex-direction:column;align-items:center;gap:8px;
    padding:12px 0 0;border:0;border-left:1px solid var(--border);background:var(--panel,#30302e);
    color:var(--muted);cursor:pointer;font-size:15px;font-family:inherit;}
  #conSummon:hover{background:var(--panel-2,#1f1e1d);color:var(--text);}
  #conSummon .cs-vt{writing-mode:vertical-rl;font-size:11.5px;letter-spacing:2px;color:var(--muted-2);}
  #conSummon .cs-n{display:none;min-width:18px;height:18px;border-radius:9px;background:var(--red,#e2483d);color:#fff;font-size:11px;font-weight:800;line-height:18px;text-align:center;padding:0 4px;}
  #conSummon.has .cs-n{display:block;}
  body.pro-shell.stage-on.console-folded:not(.console-popped) #conSummon{display:flex;}
  /* 유령선 — 드래그 중 「여기까지 온다」만 보여 준다. 실제 폭은 mouseup에서 한 번. */
  #conGhost{position:fixed;top:0;bottom:0;width:2px;background:var(--blue,#3b82f6);z-index:99;display:none;pointer-events:none;}
  /* 드래그 중 iframe이 마우스 이벤트를 삼키면 유령선이 멈춘다 — 잠깐 입력을 끈다. */
  body.con-resizing .screens{pointer-events:none;}
  body.con-resizing{cursor:col-resize;}
  /* ⚠ 대화창을 **창으로 빼 두면** 도킹 콘솔은 숨겨진다(.console{display:none}). 그때도 옆 자리를
     비워 두면 **본문만 380px 줄고 그 자리가 텅 빈다**(실측: 1196 → 816). 없는 것을 위해
     자리를 남기지 않는다 — 분리 상태에서는 한 칸으로 되돌린다. */
  body.console-popped .work.console-side{display:flex;flex-direction:column;}
  /* 창으로 빼냈을 때 — 콘솔을 접는다(화면이 100%가 된다).
     예전엔 본문 아래에 안내 줄(.console-out, 38px)을 가로로 깔았는데, 대화창을 뺄수록
     화면이 좁아지는 모순이 있어 **왼쪽 패널 문서함 줄 위로** 옮겼다(2026-08-08 시안 승인). */
  body.console-popped .console{display:none;}
  /* 대화 되돌리기 줄 — titlebar.js가 사용자 영역 안에 만든다. 분리했을 때만 보인다

      //   남아 화면이 통째로 안 뜨고, healFrames가 그 빈 값을 문서 자신의 주소로 되살려

    // 대화창에 상위 카드가 보여야 돼」, 사진3 흐름). 카드 없는 화면은 콘솔이 조용히 넘긴다.
    // ⚠ 부팅 복원(저장 탭 되열기)에서는 안 띄운다(검토관 M5 — 로그인마다 카드가 쏟아진다).
    //   콘솔이 분리돼 셸 콘솔이 숨어 있을 때도 안 띄운다(검토관 M2 — 분리창 쪽이 띄운다).

    // 보겠다는 뜻(무대 내림). 안 하면 되붙인 대화가 stage-on의 display:none에 가려 어디에도

    // 별도 창을 띄우므로, 표준 시절 탭 8개가 로그인 직후 **창 폭탄**으로 쏟아졌다.

    if (프로인가()) {

      if (wasPopped0 === "1" && window.gijo.openConsoleWindow) { setPopped(true); window.gijo.openConsoleWindow(프로인가() ? "light" : undefined); }
      로그인선택_못한것알리기();
      프로레일();
      끌개설치(); 대화폭복원(); 대화온디맨드설치(); // 0-4 — 복원값도 클램프를 지난다(0폭 저장→관문 사망 방지)
      return;
    }
    var st = null;
    try { st = JSON.parse(localStorage.getItem(KEY_TABS) || "null"); } catch (e) {}
    if (st && st.open && st.open.length) {
      // ⚠ 바로잡으면 두 옛 탭이 같은 화면을 가리킬 수 있다(자산 통합 뷰 + 자산 목록) —
      //   그대로 열면 같은 탭이 두 번 생긴다. open()이 이미 있는 탭을 재사용하므로 안전하지만,
      //   활성 탭 주소도 함께 바로잡아야 엉뚱한 탭이 선택된다.
      부팅복원중 = true; // 복원 중엔 현황 카드를 안 띄운다(검토관 M5)
      st.open.map(옛탭바로잡기).forEach(function (o) { open(o.page, o.label); if (o.pinned) { var t = find(o.page); if (t) t.pinned = true; } });

      //   「내 문서가 대시보드 메인 화면이 되고 여기에 +대화창+상단바」).
      // ⚠ 새 상태를 만들지 않는다 — 그냥 **탭 하나를 열어 고정**할 뿐이다. 그러면
      //   tabs.length>0이라 stage-on이 걸리고, 위 CSS가 「화면 | 대화」 격자를 세운다.
      // ⚠ pinned를 다는 이유: 「모두 닫기」가 홈을 지우면 프로에 돌아갈 자리가 없어진다.
      //   핀은 이미 있는 장치다(복원 경로 1218행이 같은 필드를 쓴다) — 새로 만들지 않았다.
      open("mydocs.html", "내 문서");

    }

    var wasPopped = "0";
    try { wasPopped = localStorage.getItem("gijo:console:popped") || "0"; } catch (e) {}
    if (wasPopped === "1" && window.gijo.openConsoleWindow) { setPopped(true); window.gijo.openConsoleWindow(프로인가() ? "light" : undefined); }
    로그인선택_못한것알리기();
    프로레일();
    끌개설치(); 대화폭복원(); 대화온디맨드설치(); // 0-4 — 복원값도 클램프를 지난다(0폭 저장→관문 사망 방지)
  }

  // ── 🚀 프로 셸 — 레일과 「대화 홈」(2026-08-18 승인 시안) ────────────────────
  //
  // ⚠ **캔버스를 탭의 대체물로 만들지 않는다.** 탭 모델(tabs·active) 위에 씌운 표현이다:
  //   캔버스 = 「지금 활성 탭 하나만 보이는 .screens」이고 open()·show()·close()·gijoTabs는
  //   한 글자도 안 바꿨다. 시안의 「캔버스는 하나」는 MAX_TABS를 1로 낮추는 게 아니라
  //   **탭줄을 감추는 것**으로 구현한다(탭은 8개까지 그대로 살아 있다).
  //   그래야 `gijo:view` 배관(active.frame·active.page)과 대화 맥락(readCtxFromShell)이
  //   출처를 하나로 유지한다 — 출처가 둘이 되는 순간이 2026-08-18에 배관을 죽인 그 모양이다.
  function 프로인가() { return document.body.classList.contains("pro-shell"); }

  // 열린 탭이 없으면 「대화 홈」(대화만) — 있으면 캔버스가 옆에 선다.
  function 대화홈갱신() {
    빈본창안내(); // 탭이 늘고 줄 때마다 — 빈 본창 안내는 표준·프로 공통(QA ⑥)
    if (!프로인가()) return;
    if (tabs.length === 0) 무대숨김 = false; // 숨길 화면이 없으면 기억도 없앤다(다음 열기는 전면)
    // 전면(stage-on) ↔ 대화(chat-home)는 정확히 반대다 — 화면이 있고 숨기지 않았으면 전면,
    // 그 밖(화면 없음·⊟ 화면 접기)은 대화 전폭. 분리창은 CSS(console-popped)가 이긴다.
    document.body.classList.toggle("stage-on", tabs.length > 0 && !무대숨김);
    document.body.classList.toggle("chat-home", tabs.length === 0 || 무대숨김);
    // 🚀 도킹 패널 머리(승인 시안 §10-1) — 탭줄이 프로에서 숨겨져 있으므로(P2) 도킹된 화면의
    //   이름과 ⧉/✕가 설 자리를 여기 만든다.
    // (--console-w 이력: 무대 전환기에 죽은 값이 됐다가 — 0-1이 나란히 격자를 되살리고
    //  0-4가 끌개(대화폭적용)를 만들면서 **생산자-소비자 짝이 다시 생겼다**. 계약도 부활:
    //  wiringcontract 「대화창 폭 끌개」 시험이 생산자·클램프·저장키를 지킨다.)
    var head = document.getElementById("dockHead");
    if (!head) {

      head.id = "dockHead";

      //   좌상단 토막이 된다(검토관 중7). grid 시절 유물이었다.
      head.style.cssText = "display:flex;align-items:center;gap:8px;" +
        "padding:4px 10px;font-size:12.5px;color:var(--muted);background:var(--panel-2);" +
        "border-bottom:1px solid rgba(255,255,255,.08);position:relative;z-index:3;";
      // 🚀 무대 머리(프로 확정 2026-08-20 「대화창 자리에 화면」) — 조작은 「⊟ 화면 접기」 하나뿐.
      //   ⧉ 창으로/✕는 뺐다: 팝업은 사장님 지시(「팝업 및 옆에 붙는 메뉴를 없애는」·「승인
      //   추천안으로 끝까지 진행」)로 같은 날의 앞선 예외(「필요한 거 빼고」)를 대체 — 이제
      //   프로의 창은 (창) 메뉴(팀 사무실·문서함)뿐이다. ✕(진짜 닫기)도 필요 없다 — 화면은
      //   숨겨 두면(무대숨김) 다음 화면이 열릴 때 교체로 정리된다.
      // ⚠ 문구가 예전 「대화로 돌아가기」에서 「⊟ 화면 접기」로 바뀌었다(셸 재구축 0-1, 2026-08-23).
      //   대화창이 **늘 옆에 보이므로** 「대화로 돌아간다」는 이제 거짓말이다. 이 단추가 실제로
      //   하는 일은 화면을 접어 대화를 전폭으로 만드는 것(무대숨김=true → chat-home)이다.
      //   같은 커밋에서 wiringcontract.test.ts와 publish-gate-ui.mjs의 문자열도 함께 고쳤다.
      head.innerHTML = '<button class="tb-btn" id="stageBack" ' +
        'title="화면을 접고 대화를 넓게 씁니다 — 화면은 닫히지 않아, 카드의 🗔로 되올리면 보던 그대로입니다">⊟ 화면 접기</button>' +
        '<b id="dockName" style="color:var(--text)"></b>' +
        '<span style="margin-left:auto"></span>';
      var scr = document.getElementById("screens");
      if (scr && scr.parentNode) scr.parentNode.insertBefore(head, scr);
      head.querySelector("#stageBack").addEventListener("click", function () {
        무대숨김 = true;
        대화홈갱신();
      });
    }
    var t0 = tabs[0];
    var 전면 = !!t0 && !무대숨김; // 무대가 내려가 있으면(⊟ 화면 접기) 머리도 함께 숨는다
    head.style.display = 전면 ? "flex" : "none";
    // (옛 paddingTop 보정은 제거 — 그리드 시절 머리가 화면 위에 겹칠 때의 유물이다. 무대에서는
    //  머리가 흐름 안(flex 첫 자식)이라 겹치지 않고, .screen{position:absolute}은 padding을
    //  무시해 애초에 iframe엔 안 먹었다 — 검토관 하10.)
    if (전면) head.querySelector("#dockName").textContent = t0.label || "";
    // 무대를 내리고 올린 모든 길에서 대화 맥락을 다시 읽게 한다(검토관 상5 — syncCtx는
    // show/close에서만 불려, 카드·⊟ 화면 접기 경로의 「마지막 카드=맥락」 갈래가 영영 안 닿았다).
    if (window.gijoConsoleSyncCtx) { try { window.gijoConsoleSyncCtx(); } catch (e) { } }
  }

  function 프로레일() {
    if (!프로인가()) return;
    var 눌러 = function (id, fn) {
      var el = document.getElementById(id);
      if (el) el.addEventListener("click", fn);
    };
    // ☰ 전체 메뉴 — **기존 화면찾기를 그대로 부른다.** 새 오버레이를 만들지 않는다:
    //   titlebar.js의 화면찾기가 이미 검색·아이콘·구역·↑↓Enter·**한글 조합 보호**까지 갖췄고,
    //   따로 만들면 아이콘이 갈라져 죽었던 사고(titlebar.js 주석)가 두 번째로 생긴다.
    눌러("railPane", 메뉴판토글); // 🗂 0-3 — 메뉴 판 접기/펴기(저장은 함수 안에서)
    눌러("railMenu", function () {

    // 🗔 열린 창 목록(검토관 #4) — 유일한 진입점(#tbWins)이 탭줄(.shellfoot)과 함께 숨어,
    //   창을 화면마다 띄우는 프로에서만 「숨은 창 되찾기」가 사라졌었다. 기존 winPop을
    //   본문으로 옮겨(1회) 레일 옆에 고정으로 띄운다 — 목록 그리기·닫기 로직은 그대로 재사용.
    var railWins = document.getElementById("railWins");
    if (railWins) railWins.addEventListener("click", function (e) {

      if (!pop) return;

        document.body.appendChild(pop);

      }
      if (pop.classList.contains("on")) pop.classList.remove("on");
      else if (window.gijoOpenWinPop) window.gijoOpenWinPop();
    });
    // (railFav ⭐는 마크업과 함께 제거 — 2026-08-30. 이유는 마크업 자리 주석에.)
    // 💬 대화 홈 = 새 대화(세션) 시작(2026-08-20 사장님 — 「새로운 세션을 열겠습니까 알림
    // 주고 물어보는 거야」). 열린 화면을 닫고(감추지 않는다 — 감추면 active가 남아 맥락이
    // 「닫은 화면」을 가리킨다) 대화·📌 선택·🗂 범위를 초기화한다.
    // ⚠ 확인은 화면 내 창(gijoAsk)으로 — 네이티브 confirm은 렌더러가 통째로 멈춘다(알려진 함정).
    눌러("railHome", function () {
      var 물음 = "새 대화(세션)를 시작할까요?\n\n지금까지의 대화는 「작업 내역」에 저장되어 언제든 다시 볼 수 있습니다." +
        "\n열린 화면과 창은 닫고 처음 화면(대화 홈)으로 돌아갑니다.";
      // ⚠ 확인창이 없으면 아무것도 하지 않는다(검토관 L5 — 묻지 못하면 파괴하지 않는 방향).
      Promise.resolve(window.gijoAsk ? window.gijoAsk(물음) : false).then(function (ok) {
        if (!ok) return;
        // 분리된 대화창이 있으면 먼저 붙인다(검토관 M1 — 안 붙이면 숨은 콘솔만 비워져
        // 사용자가 보는 분리창은 옛 대화·옛 세션에 그대로 남는다).
        if (document.body.classList.contains("console-popped") && window.gijo && window.gijo.dockConsoleWindow) {
          try { window.gijo.dockConsoleWindow(); } catch (e) { }
        }
        // ⧉ 팝업 창도 전부 닫는다(문구 「창은 닫고」와 일치 — 검토관 M3).
        if (window.gijo && window.gijo.closeAllPopouts) { try { window.gijo.closeAllPopouts(); } catch (e) { } }
        tabs.slice().forEach(function (t) { if (!t.pinned) close(t.page, true); });
        대화홈갱신();
        redraw();
        if (window.gijoConsole && window.gijoConsole.newSession) window.gijoConsole.newSession();
      });
    });
    대화홈갱신();
  }

  // ── 대화창 폭 끌개 (셸 재구축 0-4, 2026-08-27) ─────────────────────────────
  //
  // ■ --console-w의 **첫 생산자**다. 이 변수는 0-1 직후까지 「소비자 1곳(위 격자)·생산자 0」인
  //   죽은 값이었고 그렇게 기록돼 있었다 — 이 블록이 그 전제를 뒤집는다(기록도 같은 커밋에서 갱신).
  // ■ 버벅임 회피 계약: **mousemove에서는 절대 --console-w를 바꾸지 않는다.** 유령선(#conGhost)만
  //   움직이고, mouseup에서 대화폭적용()을 한 번 부른다. 2026-07-28 높이 손잡이 폐지 사유
  //   (mousemove마다 iframe 재레이아웃)를 원리로 회피하는 것이 이 분리의 전부다.
  // ■ 클램프: 대화 최소 360(분리 대화창 minWidth와 같은 실증 바닥 — main.ts, 그 밑은 결재판
  //   150px 칸이 먼저 넘친다) · 화면 판 최소 420 보장 · 더블클릭 = 기본 380 복귀.
  // ■ 저장: gijo:console:w (콘솔 상태 가족 — gijo:console:popped·side와 같은 관례).
  //   복원값도 반드시 클램프를 지난다 — 관문 앱이 userData를 실사용과 공유하므로
  //   0 근처 폭이 저장되면 다음 게시 관문(대화보임 offsetWidth>0)이 죽는다(설계 검토 [높음]).
  // ── 화면 메뉴 판 (셸 재구축 0-3, 2026-08-27 사장님 「1+3」) ────────────────────
  //
  // ■ 내용은 nav.js의 gijoRenderMenu(buildMenu) **재사용** — titlebar.js가 대시보드
  //   「전체메뉴」 판에 이미 재사용한 전례 그대로다. 그룹 접기(gijo:menu:closed)·
  //   즐겨찾기·배지 3종(gn-*badge — 갱신이 querySelectorAll이라 레일과 판에 동시 반영)·
  //   클릭(셸 안이면 gijoTabs.open → stage-on 격자에 뜸)이 전부 한 원천에서 온다.
  // ■ ⚠ 컨테이너에 .gn-mid 클래스를 **쓰지 않는다** — titlebar.js mountUserArea의 첫
  //   갈래가 #gijoNav 안 .gn-mid를 보고 계정·문서함을 판 하단으로 이사시킨다. 계정은
  //   상단바(레일 rail-foot)에 남는다 — 판을 접어도 계정·업데이트 배지가 보여야 한다
  //   (「기한 지난 업무 6건이 안 보이던」 2026-08-01 사고 계보).
  // ■ 설치 시점은 DOMContentLoaded — 부팅 인라인이 돌 때 nav.js(뒤 스크립트)가 아직
  //   안 실려 gijoRenderMenu가 없다. DOMContentLoaded면 일반 스크립트 전부 실행 완료.
  var PRO_MENU_KEY = "gijo:proMenu:collapsed"; // ⚠ 표준 LEFT_KEY(gijo:leftPanel:collapsed) 재사용 금지
  function 메뉴판설치() {
    if (!프로인가()) return;
    var nav = document.getElementById("gijoNav");
    if (!nav || nav.querySelector(".pro-menu")) return;
    var box = document.createElement("div");
    box.className = "pro-menu"; // gn-mid 금지(위 주석)
    nav.appendChild(box);
    if (window.gijoRenderMenu) window.gijoRenderMenu(box);
    else box.textContent = "메뉴 로딩 중…"; // titlebar.js와 같은 폴백
    var 접힘 = "0";
    try { 접힘 = localStorage.getItem(PRO_MENU_KEY) || "0"; } catch (e) { }
    document.body.classList.toggle("pro-menu-closed", 접힘 === "1");
  }
  function 메뉴판토글() {
    var 닫힘 = document.body.classList.toggle("pro-menu-closed");
    try { localStorage.setItem(PRO_MENU_KEY, 닫힘 ? "1" : "0"); } catch (e) { }
  }
  // nav.js가 이 인라인보다 **뒤에** 실리므로 여기서 바로 부르면 gijoRenderMenu가 없다.
  document.addEventListener("DOMContentLoaded", 메뉴판설치);

  var CONSOLE_W_KEY = "gijo:console:w";
  var CONSOLE_W_DEFAULT = 380;
  function 대화폭클램프(px) {
    var work = document.querySelector(".work");
    var 최대 = Math.max(360, (work ? work.clientWidth : 1920) - 420); // 화면 판 최소 420 보장
    return Math.max(360, Math.min(최대, Math.round(px)));
  }
  function 대화폭적용(px, 저장) {
    var v = 대화폭클램프(px);
    var work = document.querySelector(".work");
    if (work) work.style.setProperty("--console-w", v + "px");
    if (저장) { try { localStorage.setItem(CONSOLE_W_KEY, String(v)); } catch (e) { } }
    return v;
  }
  function 대화폭복원() {
    var v = null;
    try { v = parseInt(localStorage.getItem(CONSOLE_W_KEY) || "", 10); } catch (e) { }
    if (v && isFinite(v)) 대화폭적용(v, false); // 저장은 안 한다 — 복원이 값을 재작성하면 안 된다
  }
  function 끌개설치() {
    if (!프로인가() || document.getElementById("conResize")) return;
    var work = document.querySelector(".work.console-side");
    if (!work) return;
    var 끌개 = document.createElement("div");
    끌개.id = "conResize";
    끌개.title = "끌어서 대화창 폭 조절 — 더블클릭하면 기본(380px)으로";
    var 유령 = document.createElement("div");
    유령.id = "conGhost";
    work.appendChild(끌개);
    document.body.appendChild(유령);
    끌개.addEventListener("dblclick", function () {
      try { localStorage.removeItem(CONSOLE_W_KEY); } catch (e) { }
      대화폭적용(CONSOLE_W_DEFAULT, false);
    });
    끌개.addEventListener("mousedown", function (e) {
      e.preventDefault();
      끌개.classList.add("drag");
      document.body.classList.add("con-resizing"); // iframe pointer-events 차단 — 안 하면 유령선이 iframe 위에서 멈춘다
      유령.style.display = "block";
      유령.style.left = e.clientX + "px";
      var 이동 = function (ev) { 유령.style.left = ev.clientX + "px"; }; // ⚠ 여기서 폭을 바꾸지 않는다(버벅임 계약)
      var 놓음 = function (ev) {
        document.removeEventListener("mousemove", 이동);
        document.removeEventListener("mouseup", 놓음);
        끌개.classList.remove("drag");
        document.body.classList.remove("con-resizing");
        유령.style.display = "none";
        var work2 = document.querySelector(".work");
        var 오른끝 = work2 ? work2.getBoundingClientRect().right : window.innerWidth;
        대화폭적용(오른끝 - ev.clientX, true);
      };
      document.addEventListener("mousemove", 이동);
      document.addEventListener("mouseup", 놓음);
    });
  }

  // ── 💬 대화창 온디맨드(2026-08-31 사장님 「대화창은 필요할 때만 불러서 보고」) ─────────
  //   승인 시안 shell-chat-ondemand — 규칙은 위 CSS 주석에. 여기는 상태와 배선만.
  //   ⚠ 프로 전용(표준 셸은 대화가 하단 고정이라 접을 대상이 다르다 — 이번 범위 아님).
  var CONSOLE_FOLD_KEY = "gijo:console:folded";
  var 미확인대화 = 0; // 접힌 동안 도착한 카드·답 수 — 손잡이 배지
  function 대화접힘상태() { return document.body.classList.contains("console-folded"); }
  function 손잡이배지그리기() {
    var b = $("conSummon"); if (!b) return;
    b.classList.toggle("has", 미확인대화 > 0);
    var n = b.querySelector(".cs-n"); if (n) n.textContent = String(Math.min(99, 미확인대화));
    b.title = 미확인대화 > 0 ? "대화창 부르기 — 안 본 소식 " + 미확인대화 + "건" : "대화창 부르기";
  }
  function 대화접힘적용(접힘, 저장) {
    if (!프로인가()) 접힘 = false;
    document.body.classList.toggle("console-folded", !!접힘);
    if (!접힘) { 미확인대화 = 0; 손잡이배지그리기(); }
    if (저장) { try { localStorage.setItem(CONSOLE_FOLD_KEY, 접힘 ? "1" : "0"); } catch (e) { } }
  }
  function 대화부르기() {
    if (!대화접힘상태()) return;
    대화접힘적용(false, true);
    // 접힌 동안 온 것을 바로 보인다 — 최신(맨 아래)으로(시안: 열면 그 자리로 스크롤).
    setTimeout(function () {
      try { var m = document.querySelector(".console .cs-rows, .console .cs-body"); if (m) m.scrollTop = m.scrollHeight; } catch (e) { }
    }, 60);
  }
  function 대화접기() { if (프로인가()) 대화접힘적용(true, true); }
  // 접힌 동안의 도착 신호 — console.js append가 부른다(사용자 자신의 발화는 세지 않는다).
  window.gijoConsoleActivity = function () {
    if (프로인가() && 대화접힘상태() && document.body.classList.contains("stage-on")) {
      미확인대화++; 손잡이배지그리기();
    }
  };
  function 대화온디맨드설치() {
    if (!프로인가() || document.getElementById("conSummon")) return;
    var work = document.querySelector(".work.console-side");
    if (!work) return;
    var b = document.createElement("button");
    b.id = "conSummon";
    b.innerHTML = '<span aria-hidden="true">💬</span><span class="cs-n">0</span><span class="cs-vt">대화창</span>';
    b.addEventListener("click", 대화부르기);
    work.appendChild(b);
    // 기본값 = 접힘(사장님 「필요할 때만」) — 담당자가 펴 두면 그 기억이 이긴다.
    var 기억 = null; try { 기억 = localStorage.getItem(CONSOLE_FOLD_KEY); } catch (e) { }
    대화접힘적용(기억 === null ? true : 기억 === "1", false);
    손잡이배지그리기();
  }

  // 로그인 화면에서 고른 구동 모드·AI 위치가 **적용되지 않았으면** 여기서 알린다.
  // ⚠ 로그인 화면은 곧 사라지므로 거기서 띄우면 아무도 못 읽는다 — 그래서 담아 두고 여기서 꺼낸다.
  //   ⚠ **꺼낸 뒤에는 지운다.** 안 지우면 다음 로그인마다 옛 실패가 다시 뜬다.
  //   안 알리고 넘어가면 담당자는 「프로로 골랐으니 프로겠지」라고 믿는다 — 그게 제일 나쁘다.
  function 로그인선택_못한것알리기() {
    var 못한것 = null;
    try {
      var raw = localStorage.getItem("gijo:loginChoiceFailed");
      if (!raw) return;
      localStorage.removeItem("gijo:loginChoiceFailed");
      못한것 = JSON.parse(raw);
    } catch (e) { return; }
    if (!못한것 || !못한것.length) return;
    gijoTell("로그인 화면에서 고른 것 중 " + 못한것.length + "가지가 적용되지 않았습니다.\n\n" +
      못한것.map(function (s) { return "· " + s; }).join("\n") +
      "\n\n나머지는 그대로 로그인됐습니다. 위 항목은 설정에서 다시 정할 수 있습니다.");
  }
  // 🚀 팝업 창이 보낸 gijo:*(select·scope·openTab)를 받아 **자기 window에 재주입**한다(2026-08-19).
  //   기존 message 리스너가 그대로 처리하므로 처리 코드를 복제하지 않는다 —
  //   복제하면 「같은 것을 두 곳에 적으면 어긋난다」가 배관에서 재발한다.
  if (window.gijo && window.gijo.onShellBridge) {
    window.gijo.onShellBridge(function (d) {
      if (d && typeof d === "object") window.postMessage(d, "*");
    });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
