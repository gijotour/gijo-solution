<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIJO AS — AI</title>
<link rel="stylesheet" href="gijo-ui.css">
<!--
  AI 허브 — AI 운영 그룹 통합 (2026-08-09 사용자 승인, mockups/ai-hub 추천안).
  사이드바 그룹 1(통합 관제·위협 인텔·자산 목록)을 한 화면으로: 상단 한눈에 띠 4판(늘 보임)
  + 하단 무대(클릭한 메뉴의 기존 화면을 embed 끼움 창으로 그대로). 화면을 새로 만들지 않는다.
  요약 숫자는 각 화면과 같은 원천 API·같은 기준(정리됨=done/ignored 등)으로 센다.
  다른 그룹도 같은 틀(grouphub.js)로 확장 예정 — 이 파일은 설정+요약 로더만 갖는 얇은 껍데기.
-->
<style>
  :root{--bg:#262624;--panel:#30302e;--border:rgba(255,255,255,.09);--text:#e9e7e2;--muted:#b3ada4;--muted-2:#a49d95;--blue:#3b82f6;--blue-light:#5fa1ff;--teal:#1eb980;--red:#e2483d;--amber:#f0a020;--panel-2:#1f1e1d;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Pretendard","Malgun Gothic","Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:13px;}
  .app{display:grid;grid-template-columns:212px 1fr;min-height:100vh;}
  .sidebar{border-right:1px solid var(--border);background:var(--panel-2);}
  .main{padding:14px 18px 0;display:flex;flex-direction:column;height:100vh;min-width:0;}
  .scr-id{font-size:12.5px;color:var(--muted);margin-bottom:10px;}
  .scr-id b{color:var(--text);font-weight:800;}
  /* 한눈에 띠 — 판 132px, 늘 보임 */
  .gh-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;flex:0 0 auto;}
  .gh-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px 12px;height:138px;cursor:pointer;position:relative;overflow:hidden;}
  .gh-card:hover{border-color:rgba(59,130,246,.5);}
  .gh-card.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue);}
  .gh-head{font-size:11.75px;font-weight:800;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;gap:6px;}
  .gh-badge{font-weight:800;font-size:11.5px;}
  .gh-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:2px 0;}
  .gh-row b{color:var(--text);}
  .gh-bars{display:flex;align-items:flex-end;gap:10px;height:46px;margin:2px 2px 4px;overflow:hidden;}
  .gh-bcol{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:34px;}
  .gh-bv{font-size:11.5px;color:var(--muted);}
  .gh-bar{width:100%;border-radius:3px 3px 0 0;min-height:4px;}
  .gh-bl{font-size:11.5px;color:var(--muted-2);white-space:nowrap;}
  .gh-foot{font-size:11.5px;color:var(--muted-2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .gh-empty{font-size:12px;color:var(--muted-2);}
  /* 좁은 폭 계약(2026-08-31 사장님 「대화창 최대일 때 글씨가 안 깨지게」) — 강제 4열이
     판 420px에서 카드당 ~95px가 되어 「올린 문서 120」이 세로로 뭉개졌다(실측·캡처).
     엑셀 방식: 라벨·값은 말줄임, 격자는 폭 따라 4→2→1열. 높이 고정(138px)은 2열 이하에서
     min-height로 풀린다 — 고정 높이+overflow:hidden이 글자를 자르던 짝이다. */
  .gh-row{min-width:0;}
  .gh-row span, .gh-row b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
  @media (max-width: 720px){
    .gh-strip{grid-template-columns:repeat(2,1fr);}
    .gh-card{height:auto;min-height:110px;}
  }
  @media (max-width: 460px){
    .gh-strip{grid-template-columns:1fr;}
  }
  /* 무대 — 남은 세로 전부 */
  .gh-stage{flex:1;width:100%;border:none;border-radius:12px 12px 0 0;margin-top:12px;background:var(--bg);}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="gijoNav"></aside>
  <div class="main">
    <div class="scr-id"><b>AI</b> — 내 보안 AI가 어떻게 구성되고, 무엇을 알고, 어떻게 배우는지 봅니다.</div>
    <div id="hubHost" style="display:flex;flex-direction:column;flex:1;min-height:0"></div>
  </div>
</div>

<div id="gijoChatWidget"></div>

<script src="dialog.js"></script>
<script src="nav.js"></script>
<script src="workflowrail.js"></script>
<script src="grouppanels.js"></script>
<script src="grouphub.js"></script>
<script src="gijomd.js"></script>
<script src="chatparts.js"></script>
<script src="chatwidget.js"></script>
<script src="titlebar.js"></script>
<script>
(function () {
  "use strict";
  if (!window.gijo || !window.gijo.isAuthenticated || !window.gijo.isAuthenticated()) { location.href = "login.html"; return; }
  // 판 정의는 grouppanels.js 한 곳에 있다(그룹이 늘어도 화면은 그룹 이름만 넘긴다).
  var panels = (window.gijoGroupPanels || {})["aiops"] || [];
  var want = new URLSearchParams(location.search).get("panel");
  var initial = panels.some(function (p) { return p.id === want; }) ? want : "team";
  window.gijoGroupHub.mount(document.getElementById("hubHost"), { panels: panels, initial: initial });
})();
</script>
</body>
</html>
