<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIJO AS — AI Security Manager OS</title>
<link rel="stylesheet" href="gijo-ui.css">
<!-- 공용 디자인 시스템(시안 C). body.g-ui로 전역 베이스라인(스크롤바·포커스) 통일 — 아래 body 태그에 g-ui. -->

<style>
  :root{
    --bg:#0a0e1a;--panel:#121a2e;--panel-2:#0e1526;--border:rgba(255,255,255,0.08);
    --border-strong:rgba(255,255,255,0.16);--blue:#3b82f6;--blue-light:#5fa1ff;--white:#ffffff;
    --text:#e7eaf3;--muted:#8b93ab;--muted-2:#5f6785;--red:#e2483d;--amber:#f0a020;--teal:#1eb980;--purple:#8b7cf0;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Pretendard","Malgun Gothic","Segoe UI",sans-serif;background:#05070d;color:var(--text);}

  .titlebar{display:flex;align-items:center;justify-content:space-between;background:#0d1220;padding:6px 12px;border-bottom:1px solid var(--border);font-size:11.5px;color:var(--muted);}
  .titlebar-left{display:flex;align-items:center;gap:8px;}
  .titlebar-left img{height:14px;}
  .win-dots{display:flex;gap:14px;color:var(--muted-2);font-size:13px;}
  .menubar{display:flex;gap:18px;background:#0a0e1a;padding:6px 14px;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);}

  .app-shell{background:var(--bg);min-height:820px;}
  .header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--border);}
  .header-left{display:flex;align-items:center;gap:12px;}
  .header-left img{height:22px;}
  .app-title{font-size:15px;font-weight:800;color:#fff;}
  .clock{font-size:12.5px;color:var(--blue-light);font-weight:600;}
  .header-right{display:flex;align-items:center;gap:10px;}
  /* 세션 칩과 나란히 놓이므로 같은 규격(11px·3×10 패딩)으로 통일 — 2026-07-25 사용자 요청 */
  .status-pill{display:flex;align-items:center;gap:5px;background:rgba(30,185,128,0.15);border:1px solid rgba(30,185,128,0.4);color:var(--teal);padding:3px 10px;border-radius:16px;font-size:11px;font-weight:800;}
  .status-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);}
  .beta-tag{background:var(--teal);color:#06281c;font-size:9px;font-weight:800;padding:1px 6px;border-radius:4px;margin-left:2px;}
  .icon-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
  /* 상단 툴바 아이콘 — '내 업무 바로가기' 타일(.dm-tile)과 같은 톤으로 통일(panel-2·라운드10·호버 상승). */
  .icon-btn{width:34px;height:34px;border-radius:10px;background:var(--panel-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--muted);cursor:pointer;transition:background .14s,border-color .14s,color .14s,transform .14s;}
  .icon-btn:hover{background:rgba(59,130,246,0.14);border-color:var(--blue);color:var(--blue-light);transform:translateY(-2px);}
  .icon-btn.on{background:rgba(59,130,246,0.18);border-color:var(--blue);color:var(--blue-light);}
  /* 전체메뉴 버튼 — 아이콘 대신 텍스트로. 대시보드엔 nav 사이드바가 없어 KPI(전체 메뉴 화면)로 보낸다. */
  .menu-btn{height:34px;border-radius:10px;background:var(--panel-2);border:1px solid var(--border);display:flex;align-items:center;gap:5px;padding:0 12px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;transition:background .14s,border-color .14s,color .14s,transform .14s;}
  .menu-btn:hover{background:rgba(59,130,246,0.14);border-color:var(--blue);color:var(--blue-light);transform:translateY(-2px);}
  .avatar-btn{width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;}

  .body-grid{display:grid;grid-template-columns:220px 1fr 360px;min-height:640px;}
  /* 오른쪽 패널 — 작업 세션만(지휘 콘솔은 중앙 AI 팀 아래로 이관, 2026-07-21 사용자 요청). */
  .dash-sessions{display:flex;flex-direction:column;min-height:0;}
  .acc{display:flex;flex-direction:column;min-height:0;border-bottom:1px solid var(--border);}
  .acc:last-child{border-bottom:0;}
  .acc.collapsed{flex:0 0 auto;}
  .acc-h{display:flex;align-items:center;gap:9px;padding:11px 12px;cursor:pointer;background:var(--panel-2);flex:0 0 auto;transition:background .12s;user-select:none;}
  .acc-h:hover{background:#16213b;}
  /* 접기/펼치기 캐럿 — 파란 박스로 명확히 보이게(클릭 가능 어포던스). */
  .acc-h .car{color:var(--blue-light);font-size:11px;font-weight:900;flex:0 0 auto;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:rgba(59,130,246,.14);border:1px solid rgba(59,130,246,.35);transition:transform .18s,background .12s;}
  .acc-h:hover .car{background:rgba(59,130,246,.24);}
  .acc-h .acc-t{font-size:12.5px;font-weight:800;color:#fff;}
  .acc-h .acc-sp{margin-left:auto;display:flex;gap:8px;align-items:center;}
  /* 캐럿은 문자 자체를 ▾(열림)/▸(닫힘)로 JS에서 바꿔 상태가 확실히 보이게 한다(회전 대신). */
  .acc.collapsed .acc-b{display:none;}
  .acc-b{display:flex;flex-direction:column;min-height:0;overflow:hidden;}
  .acc-b-console{flex:1 1 auto;min-height:220px;}
  /* 콘솔이 패널 안에 들어오면서 입력 독을 패널형 하단바로 조정 */
  /* 전송 독 소형화(사용자 요청 2026-07-20) — 입력줄·버튼을 낮고 작게 */
  .acc-b-console .agent-dock{position:static;background:var(--panel-2);border-top:1px solid var(--border);padding:7px 10px;margin-top:0;gap:5px;justify-content:stretch;}
  .acc-b-console .agent-dock input{padding:6px 10px;font-size:11.5px;height:28px;box-sizing:border-box;}
  .acc-b-console .dock-plus{width:28px;height:28px;font-size:14px;border-radius:8px;}
  .acc-b-console .dock-send{height:28px;padding:0 10px;font-size:11px;border-radius:8px;}
  .acc-b-console .dock-all{height:28px;padding:0 7px;font-size:9.5px;border-radius:8px;}
  .acc-b-console .model-guide{margin:8px 12px;max-width:none;}
  /* 오른쪽 작업 세션 패널만 숨기기(② 요청) — 왼쪽 탐색기는 남기고 중앙만 넓힌다. */
  .body-grid.no-right{grid-template-columns:220px 1fr;}
  .body-grid.no-right .dash-sessions{display:none;}
  .dsh-hide{background:transparent;border:0;color:var(--muted-2);font-size:14px;cursor:pointer;line-height:1;padding:0 2px;}
  .dsh-hide:hover{color:var(--blue-light);}
  /* 오른쪽 패널 접힘 시 다시 여는 탭(오른쪽 가장자리) — 패널이 보이면 숨김. */
  .right-reopen{position:fixed;right:0;top:50%;transform:translateY(-50%);background:var(--blue);color:#fff;padding:14px 6px;border-radius:10px 0 0 10px;font-size:12px;font-weight:800;cursor:pointer;writing-mode:vertical-rl;display:none;z-index:40;box-shadow:-2px 0 14px rgba(0,0,0,.45);letter-spacing:2px;}
  .right-reopen:hover{background:#3576e0;}
  .right-reopen.on{display:block;}
  /* 오른쪽 작업 화면 전체 접기 헤더 — 두 섹션을 통째로 여닫는 명확한 컨트롤. */
  .dash-right-head{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--border);background:var(--panel-3);flex:0 0 auto;}
  .drh-t{font-size:12px;font-weight:800;color:#fff;letter-spacing:.2px;}
  .drh-toggle{margin-left:auto;background:rgba(59,130,246,.14);border:1px solid rgba(59,130,246,.4);color:var(--blue-light);font-size:11px;font-weight:700;border-radius:8px;padding:5px 10px;cursor:pointer;transition:.14s;white-space:nowrap;}
  .drh-toggle:hover{background:var(--blue);color:#fff;border-color:var(--blue);}
  .explorer{padding:18px 12px;border-right:1px solid var(--border);}
  /* 작업 세션 열 — 이력 관리용. 주 작업은 실시간 활동에서 하므로 오른쪽 끝(order:2)으로 뺀다. */
  .dash-sessions{order:2;border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0;}
  .center-stage{order:1;}
  .dash-sessions .dsh{display:flex;align-items:center;justify-content:space-between;padding:16px 12px 8px;}
  .dash-sessions .dsh-t{font-size:12px;font-weight:700;color:var(--text);}
  .dash-new{background:var(--blue);color:#fff;border:0;border-radius:6px;font-size:11px;font-weight:700;padding:4px 9px;cursor:pointer;}
  .dash-active-badge{background:rgba(30,185,128,.15);color:var(--teal);border:1px solid rgba(30,185,128,.35);border-radius:20px;font-size:10.5px;font-weight:800;padding:3px 10px;cursor:pointer;white-space:nowrap;}
  .dash-active-badge.zero{background:rgba(139,147,171,.12);color:var(--muted-2);border-color:transparent;}
  /* 실측(2026-07-22): 부모 grid에 높이 제약이 없어 flex:1이 무제한으로 늘어나 91개 항목이 스크롤
     없이 전부 펼쳐져 있었다(4475px). 행을 sessions.html과 동일한 .srow로 통일한 뒤 재실측한
     행높이 49px×14 = 686px로 캡 — "14개 정도 보이게" + 두 화면 디자인 통일(사용자 요청). */
  /* 세션 목록은 내용만큼(최대 686px), 남는 세로 공간은 아래 사무실 LIVE가 채운다. */
  .dash-slist{flex:0 1 auto;max-height:686px;overflow-y:auto;padding:2px 8px 8px;}
  /* 세션 행 — sessions.html(작업 세션 열기 화면)의 .srow와 동일한 클래스·스타일을 그대로 써서
     대시보드 패널과 전체 화면이 "동일하게" 보이도록 통일했다(사용자 지적, 2026-07-22:
     두 화면의 세션 행 디자인이 서로 달랐음). */
  .srow{display:flex;align-items:center;gap:11px;padding:9px 6px;border-bottom:1px solid var(--border);cursor:pointer;border-radius:6px;}
  .srow:hover{background:var(--panel-2);}
  .sdot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--teal);}
  .sdot.done{background:var(--muted-2);}.sdot.ignored{background:var(--muted-2);opacity:.5;}
  .sr-main{flex:1;min-width:0;}
  .sr-title{font-weight:700;font-size:12.5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sr-sub{font-size:10.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sr-meta{font-size:10px;color:var(--muted-2);flex:none;text-align:right;white-space:nowrap;}
  .badge{font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:20px;}
  .b-active{color:var(--teal);background:rgba(30,185,128,.14);}.b-done{color:var(--muted-2);background:rgba(255,255,255,.05);}.b-ignored{color:var(--muted-2);background:rgba(255,255,255,.04);}
  .s-done{flex:none;font-size:9.5px;font-weight:700;color:var(--teal);border:1px solid rgba(30,185,128,.4);border-radius:5px;padding:1px 5px;opacity:0;cursor:pointer;white-space:nowrap;}
  .srow:hover .s-done{opacity:.9;}
  .s-done:hover{background:rgba(30,185,128,.15);}
  .sdel{color:var(--muted-2);font-size:12px;cursor:pointer;flex:none;padding:2px 4px;border-radius:4px;}
  .sdel:hover{color:#f5928a;background:rgba(226,72,61,.12);}
  .dash-srep{font-size:10.5px;font-weight:700;color:var(--teal);padding:6px 10px;background:rgba(30,185,128,.08);border:1px solid rgba(30,185,128,.25);border-radius:7px;margin:4px 2px 6px;cursor:pointer;}
  .dash-sitem{padding:8px 8px 8px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent;margin-bottom:2px;display:flex;align-items:center;gap:8px;}
  .dash-sitem:hover{background:var(--panel-2);}
  .dash-sitem .t{flex:1;min-width:0;font-weight:700;font-size:12px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dash-sdel{flex-shrink:0;font-size:11px;color:var(--muted-2);opacity:0;cursor:pointer;padding:2px 4px;border-radius:5px;}
  .dash-sitem:hover .dash-sdel{opacity:.8;}
  .dash-sdel:hover{opacity:1;color:#f5928a;background:rgba(226,72,61,.12);}
  .dash-sfull{padding:9px 12px;border-top:1px solid var(--border);font-size:11px;color:var(--blue-light);font-weight:700;cursor:pointer;text-align:center;}
  .dash-sfull:hover{background:var(--panel-2);}
  /* 🏢 보안팀 사무실 LIVE — 작업 세션 패널 하단 남는 공간. 협업 이벤트(대화)를 실시간으로. */
  .dash-office-live{flex:1 1 auto;min-height:110px;border-top:1px solid var(--border);display:flex;flex-direction:column;}
  .dol-head{display:flex;align-items:center;gap:6px;padding:9px 12px 6px;font-size:11.5px;font-weight:800;color:var(--text);cursor:pointer;}
  .dol-head:hover{color:#fff;}
  .dol-live{font-size:8.5px;font-weight:800;color:var(--teal);border:1px solid rgba(30,185,128,.5);border-radius:8px;padding:1px 6px;position:relative;}
  .dol-live::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--teal);margin-right:4px;vertical-align:middle;animation:dolpulse 1.4s infinite;}
  @keyframes dolpulse{0%,100%{opacity:1}50%{opacity:.3}}
  .dol-feed{flex:1 1 auto;min-height:0;overflow-y:auto;padding:2px 12px 10px;}
  .dol-empty{font-size:10.5px;color:var(--muted-2);padding:6px 2px;line-height:1.6;}
  .dol-line{padding:4px 0;border-bottom:1px solid var(--border);animation:dolup .25s;}
  @keyframes dolup{from{transform:translateY(4px);opacity:0}}
  .dol-who{font-size:10px;font-weight:800;color:var(--blue-light);}
  .dol-msg{display:block;font-size:11px;color:var(--muted);margin-top:1px;line-height:1.45;word-break:break-word;}
  .explorer-title{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;color:var(--text);margin-bottom:3px;}
  /* 탐색기 파일 트리 글자 크기 — 기본(≈16px)이 커서 11.5px로 축소(파일명·폴더명). */
  #explorerTree{font-size:12.5px;line-height:1.55;}
  .explorer-sub{font-size:11px;color:var(--blue-light);margin-bottom:10px;}
  .explorer-tree{font-size:12px;color:var(--muted);line-height:1.9;}
  /* 통일된 트리 탐색기 — 폴더(접기)·자식(가이드라인)·리프(항목)를 한 스타일로 */
  .tree-folder{display:flex;align-items:center;gap:7px;padding:6px 5px;cursor:pointer;font-size:13.5px;font-weight:800;color:#fff;border-radius:6px;}
  .tree-folder:hover{background:rgba(255,255,255,0.04);}
  /* 화면 이동용 폴더(접기 아님) — 클릭하면 해당 관리 화면으로. */
  .tree-nav{display:flex;align-items:center;gap:6px;padding:6px 5px;margin-top:3px;cursor:pointer;font-size:12.5px;font-weight:700;color:var(--blue-light);border-radius:6px;border:1px dashed rgba(59,130,246,0.35);}
  .tree-nav:hover{background:rgba(59,130,246,0.1);border-color:var(--blue);}
  .tree-caret{color:var(--muted-2);font-size:9px;width:9px;flex-shrink:0;text-align:center;}
  .tree-count{margin-left:auto;font-size:10px;color:var(--muted-2);font-weight:700;background:rgba(255,255,255,0.05);border-radius:9px;padding:0 7px;}
  .tree-act{color:var(--muted-2);cursor:pointer;font-size:11px;padding:0 2px;flex-shrink:0;}
  .tree-act:hover{color:var(--blue-light);}
  .tree-children{margin:1px 0 4px 14px;padding-left:10px;border-left:1px solid var(--border-strong);font-size:12.5px;line-height:1.75;}
  .tree-children.collapsed{display:none;}
  .tree-leaf{padding:4px 5px;font-size:12.5px;color:#aab2c6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:5px;}
  .tree-leaf.click{cursor:pointer;}
  .tree-leaf.click:hover{background:rgba(255,255,255,0.04);color:var(--text);}
  .tree-leaf .sub{color:var(--muted-2);font-size:10px;}
  .tree-leaf .badge{color:var(--amber);font-size:10px;font-weight:700;}
  .tree-empty{padding:3px 5px;font-size:11px;color:var(--muted-2);}
  /* AS 탐색기 — 파일 탐색기 아래 2번째 섹션(리포트·문서). 글씨 12px = 지휘 콘솔과 동일. */
  .as-explorer{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border-strong);font-size:12.5px;}
  .as-sec{font-size:12.5px;font-weight:800;color:#c3cad9;letter-spacing:.2px;padding:1px 4px 6px;}
  .asx-row{display:flex;align-items:center;gap:7px;padding:6px 6px;border-radius:7px;cursor:pointer;white-space:nowrap;overflow:hidden;font-size:13px;font-weight:700;}
  .asx-row:hover{background:rgba(255,255,255,.045);}
  .asx-car{width:12px;text-align:center;color:var(--muted-2);font-size:11px;flex:0 0 auto;}
  .asx-ic{width:16px;text-align:center;flex:0 0 auto;}
  .asx-nm{overflow:hidden;text-overflow:ellipsis;color:#eef3fb;}
  .asx-cnt{margin-left:auto;font-size:10.5px;color:var(--blue-light);background:rgba(59,130,246,.14);border:1px solid rgba(59,130,246,.35);border-radius:999px;padding:0 7px;flex:0 0 auto;font-weight:700;}
  /* 하위 파일(리포트/문서) — 왼쪽 가이드선 + 들여쓰기로 폴더 소속을 뚜렷이, 글씨 상향. */
  .asx-body{margin-left:15px;border-left:1px solid var(--border-strong);}
  .asx-body .asx-file{display:flex;align-items:center;gap:7px;padding:4px 6px 4px 12px;border-radius:0 6px 6px 0;cursor:pointer;white-space:nowrap;overflow:hidden;font-size:12.5px;}
  .asx-body .asx-file:hover{background:rgba(255,255,255,.045);}
  .asx-body .asx-file .asx-nm{color:#aab2c6;}
  /* 리포트 바로 보기 아이콘 — 항목 오른쪽. 클릭하면 대시보드에서 PDF를 바로 띄운다. */
  .asx-view{margin-left:auto;flex:0 0 auto;color:var(--muted-2);font-size:13px;padding:1px 5px;border-radius:5px;opacity:.75;}
  .asx-view:hover{color:var(--blue-light);background:rgba(59,130,246,.14);opacity:1;}
  /* 리포트 뷰어 모달(대시보드 내장) */
  .rvm{position:fixed;inset:0;background:rgba(4,7,14,.8);z-index:1200;display:none;align-items:center;justify-content:center;}
  .rvm.open{display:flex;}
  .rvm-box{width:min(900px,92vw);height:88vh;background:var(--panel);border:1px solid var(--border-strong);border-radius:12px;display:flex;flex-direction:column;overflow:hidden;}
  .rvm-head{display:flex;align-items:center;gap:10px;padding:11px 15px;border-bottom:1px solid var(--border);}
  .rvm-t{font-size:13px;font-weight:800;color:#fff;}
  .rvm-dl{margin-left:auto;background:rgba(59,130,246,.16);border:1px solid rgba(59,130,246,.4);color:var(--blue-light);font-size:11.5px;font-weight:700;border-radius:8px;padding:5px 11px;cursor:pointer;}
  .rvm-x{background:transparent;border:1px solid var(--border-strong);color:var(--muted);font-size:12px;border-radius:8px;padding:5px 11px;cursor:pointer;}
  .rvm-body{flex:1;min-height:0;background:#222;}
  .asx-empty{padding:4px 6px 4px 12px;font-size:12px;color:var(--muted-2);}
  .asx-total{font-size:10.5px;color:var(--muted-2);padding:4px 6px 2px 12px;}
  /* 연동 서버 정보 카드 + 시작 가이드 슬롯 — 자산 탐색기 상단(GIJO AS Desktop 아래) */
  .server-card{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:8px 10px;margin:4px 0 6px;}
  .sc-nm{font-size:11.5px;font-weight:800;color:#fff;display:flex;align-items:center;gap:6px;}
  .sc-dot{width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 6px var(--teal);flex-shrink:0;}
  .sc-dot.off{background:#e2483d;box-shadow:none;}
  .sc-meta{font-size:9.5px;color:var(--muted);margin-top:3px;line-height:1.55;}
  .sc-meta b{color:var(--blue-light);font-weight:700;}
  #gijoObSlot .ob-row{display:flex;align-items:center;gap:6px;background:rgba(139,124,240,0.08);border:1px solid rgba(139,124,240,0.35);border-radius:8px;padding:6px 9px;margin-bottom:8px;cursor:pointer;font-size:11px;font-weight:800;color:var(--purple);}
  #gijoObSlot .ob-row .pr{margin-left:auto;font-size:9.5px;background:rgba(139,124,240,0.18);padding:1px 6px;border-radius:5px;}
  /* AI 자산 하위 그룹(AI-BOM/SBOM) 헤더 */
  .tree-sub{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--blue-light);padding:4px 2px 2px;}
  .tree-sub .cnt{font-size:9px;color:var(--muted-2);font-weight:700;}
  /* 자산·제품·문서 리프 상태 배지 */
  .tree-leaf.row{display:flex;align-items:center;gap:5px;}
  .leaf-b{margin-left:auto;font-size:8.5px;font-weight:800;padding:1px 5px;border-radius:5px;flex-shrink:0;}
  .lb-red{color:#f5928a;background:rgba(226,72,61,0.15);}
  .lb-amber{color:var(--amber);background:rgba(240,160,32,0.14);}
  .lb-teal{color:var(--teal);background:rgba(30,185,128,0.13);}
  .lb-blue{color:var(--blue-light);background:rgba(59,130,246,0.14);}
  .lb-purple{color:var(--purple);background:rgba(139,124,240,0.14);}
  .lb-mut{color:var(--muted-2);background:rgba(255,255,255,0.05);}
  /* 자산 상세 팝오버(시안2 확정) — 클릭한 자산 옆에 떠서 설명·최근 취약점·바로가기 */
  .asset-pop{position:fixed;width:300px;background:var(--panel-2);border:1px solid var(--blue);border-radius:12px;padding:12px 13px;box-shadow:0 10px 40px rgba(0,0,0,.55),0 0 24px rgba(59,130,246,.12);z-index:80;display:none;}
  .asset-pop.on{display:block;}
  .ap-links button.ap-term{background:rgba(30,185,128,.14);border-color:var(--teal);color:var(--teal);}
  /* 자산 직접 등록 모달 */
  .areg-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:95;}
  .areg-bg.on{display:flex;}
  .areg{width:360px;max-width:92vw;background:var(--panel);border:1px solid var(--border-strong);border-radius:12px;padding:18px 20px;}
  .areg h4{font-size:14px;color:#fff;margin-bottom:12px;}
  .areg label{font-size:10.5px;color:var(--muted-2);font-weight:700;display:block;margin:8px 0 3px;}
  .areg input,.areg select{width:100%;background:var(--panel-2);border:1px solid var(--border-strong);border-radius:6px;padding:7px 9px;color:var(--text);font-size:12px;outline:none;}
  .areg-err{font-size:11px;color:#f5928a;margin-top:8px;min-height:14px;}
  .areg-acts{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;}
  .areg-acts button{border-radius:7px;padding:7px 14px;font-size:12px;font-weight:800;cursor:pointer;}
  .areg-acts .ok{background:var(--blue);border:0;color:#fff;}
  .areg-acts .no{background:transparent;border:1px solid var(--border-strong);color:var(--muted);}
  .ap-close{position:absolute;top:8px;right:10px;color:var(--muted-2);font-size:12px;cursor:pointer;}
  .ap-t{font-size:12.5px;font-weight:800;color:#fff;display:flex;align-items:center;gap:7px;padding-right:16px;}
  .ap-kv{display:flex;gap:8px;font-size:10.5px;color:var(--muted);margin-top:4px;}
  .ap-kv b{color:#c6d2ea;font-weight:700;min-width:62px;flex-shrink:0;}
  .ap-h{font-size:10px;font-weight:800;color:var(--muted-2);margin:9px 0 2px;}
  .ap-vuln{display:flex;align-items:flex-start;gap:6px;font-size:10.5px;color:#c6d2ea;background:rgba(255,255,255,.03);border-radius:6px;padding:5px 8px;margin-top:4px;line-height:1.4;}
  .ap-sev{font-size:8.5px;font-weight:800;padding:1px 5px;border-radius:4px;flex-shrink:0;}
  .ap-links{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .ap-links button{font-size:10.5px;font-weight:800;color:var(--blue-light);background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.3);padding:5px 10px;border-radius:7px;cursor:pointer;}
  .manual-link{margin-left:auto;font-size:9px;color:var(--blue-light);white-space:nowrap;flex-shrink:0;}

  .center-stage{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:14px 22px 0;position:relative;min-height:640px;}
  /* 로고 발광은 --gpu(0~1, 작업 중일 때만 켜지는 busy 신호)에 비례해 반경·밝기가 커지고, 색은
     --glow-rgb로 바뀐다(JS applyGlow가 두 변수를 함께 갱신). */
  .network-svg{width:100%;max-width:300px;--gpu:0;--glow-rgb:245,200,40;
    filter:drop-shadow(0 0 calc(3px + var(--gpu) * 30px) rgba(var(--glow-rgb), calc(0.14 + var(--gpu) * 0.55)));
    transition:filter 1s ease;}
  .network-svg .spark{animation:twinkle 3.2s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.3}50%{opacity:1}}
  /* 작업 중: 기본 스파크는 더 빨리 반짝이고, 숨겨둔 추가 스파크가 켜진다 */
  .network-svg .spark-extra{opacity:0;}
  .network-svg.busy .spark{animation-duration:1s;}
  .network-svg.busy .spark-extra{animation:twinkle 0.8s ease-in-out infinite;}
  /* 모델 미준비 안내 배너 — 로컬 모델 받기 / 사내 서버 연결 두 경로 제시 */
  .model-guide{margin-top:12px;max-width:520px;background:rgba(240,160,32,0.08);border:1px solid rgba(240,160,32,0.4);border-radius:12px;padding:12px 16px;text-align:center;}
  .mg-title{font-size:12px;font-weight:700;color:var(--amber);margin-bottom:10px;line-height:1.5;}
  .mg-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
  .mg-btn{background:var(--panel);border:1px solid var(--border-strong);color:var(--text);border-radius:8px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;}
  .mg-btn:hover{border-color:var(--blue-light);color:#fff;}
  .mg-btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;}

  .stage-core{position:relative;width:100%;max-width:300px;}

  /* 실시간 에이전트 협업 — 지휘 콘솔 아래 전체 폭, 남은 세로 공간을 꽉 채운다(flex:1). 지시·위임·답변 라이브. */
  /* 콘솔 로그 — 폭 제한 없이 중앙 영역을 꽉 채운다(창을 키우거나 ⛶로 옆 패널을 숨기면 실제로 넓어진다). */
  .collab-live{width:100%;margin-top:8px;background:var(--panel);border:1px solid var(--border);border-radius:13px;overflow:hidden;display:flex;flex-direction:column;flex:1 1 auto;min-height:150px;}
  .cl-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--panel-2);border-bottom:1px solid var(--border);flex:0 0 auto;}
  .cl-title{font-size:12.5px;font-weight:800;color:#fff;}
  .cl-status{font-size:10.5px;font-weight:800;color:var(--muted-2);display:flex;align-items:center;gap:6px;}
  .cl-status .cl-dot{width:7px;height:7px;border-radius:50%;background:var(--muted-2);}
  .cl-status.busy{color:var(--blue-light);}
  .cl-status.busy .cl-dot{background:var(--blue-light);animation:clblink 0.9s infinite;}
  @keyframes clblink{0%,100%{opacity:.35}50%{opacity:1}}
  .cl-rows{flex:1 1 auto;min-height:0;overflow-y:auto;padding:8px 12px;display:flex;flex-direction:column;gap:6px;}
  .cl-empty{font-size:11.5px;color:var(--muted-2);padding:10px 2px;}
  .cl-row{display:flex;gap:9px;align-items:flex-start;font-size:12px;line-height:1.55;padding:7px 9px;border-radius:9px;background:var(--panel-2);border:1px solid var(--border);animation:clpop .25s ease-out;}
  @keyframes clpop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  .cl-row .ci{width:24px;height:24px;border-radius:7px;background:var(--panel);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;flex:0 0 auto;}
  /* 좌측 자산 탐색기 위에 놓인 GIJO 네트워크 그래픽 — 콤팩트. */
  .stage-core-left{max-width:188px;margin:2px auto 12px;}
  .cl-row .cb{flex:1;min-width:0;}
  .cl-row .cn{font-size:10.5px;font-weight:800;color:var(--blue-light);margin-bottom:1px;display:flex;gap:7px;align-items:baseline;}
  .cl-row .cn .ct{font-weight:600;color:var(--muted-2);font-size:9.5px;margin-left:auto;flex:0 0 auto;}
  .cl-row .cm{color:var(--text);white-space:pre-wrap;word-break:break-word;}
  /* 긴 답변은 4줄로 고정(적당한 크기), 클릭하면 펼침 — 피드가 한 답변으로 도배되지 않게. */
  .cl-row .cm.clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden;cursor:pointer;}
  .cl-row .cm.clamp.open{display:block;-webkit-line-clamp:none;overflow:visible;}
  .cl-more{font-size:10px;font-weight:700;color:var(--blue-light);cursor:pointer;margin-top:3px;display:inline-block;}
  .cl-row.offer{border-color:rgba(30,185,128,0.4);background:rgba(30,185,128,0.07);}
  .cl-row.offer .cn{color:var(--teal);}
  .cl-offer-btn{margin-top:6px;background:var(--teal);color:#06281c;border:none;border-radius:7px;padding:5px 12px;font-size:11.5px;font-weight:800;cursor:pointer;}
  .cl-offer-btn:hover{filter:brightness(1.08);}
  /* 답변 뒤 붙는 작은 제안 — 설명 문장 없이 아이콘+짧은 라벨 알약(시안 B, 사용자 확정) */
  .cl-pill-row{display:flex;gap:6px;padding:0 9px;}
  .cl-pill{display:flex;align-items:center;gap:5px;height:24px;padding:0 10px;border-radius:20px;font-size:10.5px;font-weight:700;cursor:pointer;border:1px solid rgba(30,185,128,0.4);background:rgba(30,185,128,0.1);color:var(--teal);}
  .cl-pill:hover{filter:brightness(1.15);}
  .cl-pill:disabled{opacity:.6;cursor:default;}
  .cl-pill.cloud{border-color:rgba(139,124,240,0.4);background:rgba(139,124,240,0.1);color:var(--purple);}
  .cl-row.instr{border-color:rgba(59,130,246,0.35);}
  .cl-row.instr .cn{color:#fff;}
  /* 결재판(시안 B) — 쓰기 도구는 실행 전 여기서 값을 검토·승인한다. 값마다 출처를 표시해
     LLM 추정(guess)을 사람이 빠르게 검증하게 한다. 빠진 필수값은 빈 칸 = 되물어보기. */
  .ap{margin:2px 0;border:1px solid rgba(59,130,246,0.5);border-radius:11px;background:linear-gradient(180deg,rgba(59,130,246,0.1),rgba(59,130,246,0.03));overflow:hidden;animation:clpop .25s ease-out;}
  .ap-head{display:flex;align-items:center;gap:8px;padding:9px 12px;background:rgba(59,130,246,0.14);border-bottom:1px solid rgba(59,130,246,0.28);}
  .ap-title{font-size:11.5px;font-weight:800;color:#fff;}
  .ap-badge{margin-left:auto;font-size:9.5px;font-weight:800;color:var(--amber);background:rgba(240,160,32,0.15);border:1px solid rgba(240,160,32,0.4);border-radius:5px;padding:2px 7px;}
  .ap-body{padding:10px 12px;}
  .ap-intro{font-size:11px;color:var(--muted);margin-bottom:8px;line-height:1.6;}
  .ap-f{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);}
  .ap-f:last-of-type{border-bottom:none;}
  .ap-k{font-size:10.5px;font-weight:700;color:var(--muted);width:72px;flex:0 0 auto;}
  .ap-k .req{color:var(--red);}
  .ap-in{flex:1;min-width:0;background:var(--panel);border:1px solid var(--border-strong);border-radius:6px;padding:5px 8px;color:var(--text);font-size:11.5px;outline:none;font-family:inherit;}
  .ap-in:focus{border-color:var(--blue);}
  .ap-in.need{border-color:rgba(226,72,61,0.55);background:rgba(226,72,61,0.05);}
  .ap-in.auto{border-color:rgba(30,185,128,0.35);}
  .ap-in.guess{border-color:rgba(240,160,32,0.45);}
  .cl-undo{margin-top:6px;font-size:11px;font-weight:600;color:var(--amber);background:rgba(240,160,32,0.1);border:1px solid rgba(240,160,32,0.35);border-radius:6px;padding:4px 10px;cursor:pointer;}
  .cl-undo:hover{background:rgba(240,160,32,0.18);}
  .cl-undo:disabled{opacity:.5;cursor:default;}
  .ap-src{font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;flex:0 0 auto;white-space:nowrap;}
  .ap-src.said{color:var(--blue-light);background:rgba(59,130,246,0.14);border:1px solid rgba(59,130,246,0.3);}
  .ap-src.auto{color:var(--teal);background:rgba(30,185,128,0.12);border:1px solid rgba(30,185,128,0.3);}
  .ap-src.guess{color:var(--amber);background:rgba(240,160,32,0.12);border:1px solid rgba(240,160,32,0.3);}
  .ap-src.empty{color:var(--red);background:rgba(226,72,61,0.12);border:1px solid rgba(226,72,61,0.35);}
  .ap-effect{margin-top:9px;padding:7px 9px;background:var(--panel-2);border:1px solid var(--border);border-radius:6px;font-size:10.5px;color:var(--muted);line-height:1.7;}
  .ap-effect b{color:var(--text);}
  .ap-actions{display:flex;gap:6px;padding:9px 12px;border-top:1px solid var(--border);background:var(--panel-2);}
  .ap-go{background:var(--teal);color:#06281c;border:none;border-radius:7px;padding:6px 14px;font-size:11.5px;font-weight:800;cursor:pointer;}
  .ap-go:disabled{opacity:0.5;cursor:not-allowed;}
  .ap-no{background:transparent;color:var(--muted);border:1px solid var(--border-strong);border-radius:7px;padding:6px 12px;font-size:11.5px;font-weight:700;cursor:pointer;margin-left:auto;}
  .cl-row.event .cn{color:var(--teal);}
  .cl-row.error{border-color:rgba(226,72,61,0.4);}
  .cl-row.error .cn{color:#f5928a;}
  .cl-row.typing .cm span{display:inline-block;width:4px;height:4px;border-radius:50%;background:var(--blue-light);margin:0 2px;animation:clblink 1s infinite;}
  .cl-row.typing .cm span:nth-child(2){animation-delay:.2s}.cl-row.typing .cm span:nth-child(3){animation-delay:.4s}

  .today-panel{padding:18px 16px;border-left:1px solid var(--border);display:flex;flex-direction:column;}
  .today-title{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:800;color:#fff;margin-bottom:14px;}
  .today-input{display:flex;gap:8px;margin-bottom:14px;}
  .today-input input{flex:1;background:var(--panel-2);border:1px solid var(--border-strong);border-radius:8px;padding:0 12px;height:34px;color:var(--text);font-size:12.5px;outline:none;}
  .today-add{width:34px;height:34px;border-radius:8px;background:var(--teal);color:#06281c;border:none;font-weight:800;cursor:pointer;font-size:16px;}
  /* 추천 일과 가이드 패널 — 빈 입력 + 클릭 시 열림 */
  .todo-sugg:not(:empty){background:var(--panel-2);border:1px solid var(--border);border-radius:9px;padding:8px 10px;margin:-6px 0 12px;}
  .ts-load{font-size:11px;color:var(--muted-2);padding:2px 0;}
  .ts-h{font-size:10px;font-weight:800;color:var(--blue-light);margin:5px 0 3px;}
  .ts-item{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:11.5px;color:var(--text);}
  .ts-item .ts-t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ts-item .ts-src{font-size:8.5px;color:var(--muted-2);flex-shrink:0;}
  .ts-add{width:20px;height:20px;border-radius:6px;background:rgba(30,185,128,0.16);color:var(--teal);border:1px solid rgba(30,185,128,0.4);cursor:pointer;font-size:12px;line-height:1;flex-shrink:0;}
  .ts-foot{font-size:9.5px;color:var(--muted-2);margin-top:7px;padding-top:6px;border-top:1px solid var(--border);line-height:1.5;}
  .today-item{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:9px 11px;margin-bottom:8px;font-size:12px;}
  .today-item .today-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .today-item.done{opacity:.55;}
  .today-item.done .today-text{text-decoration:line-through;color:var(--muted);}
  .today-check{width:15px;height:15px;flex-shrink:0;cursor:pointer;accent-color:var(--teal);margin:0;}
  .today-del{flex-shrink:0;background:none;border:none;color:var(--muted-2);cursor:pointer;font-size:13px;line-height:1;padding:2px 5px;border-radius:4px;}
  .today-del:hover{color:#f5928a;background:rgba(226,72,61,0.14);}
  #todayItems{max-height:260px;overflow-y:auto;}
  .today-sla{font-size:10px;font-weight:800;flex-shrink:0;}
  .today-who{font-size:10px;font-weight:700;color:var(--blue-light);background:rgba(59,130,246,0.14);padding:1px 6px;border-radius:5px;flex-shrink:0;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .today-p{padding:2px 7px;border-radius:5px;font-size:10.5px;font-weight:800;flex-shrink:0;}
  .p0{background:rgba(226,72,61,0.18);color:#f5928a;}
  .p1{background:rgba(240,160,32,0.18);color:#f7c777;}
  .today-item.maint-due{cursor:pointer;border-color:rgba(59,130,246,0.35);}
  .today-item.maint-due:hover{border-color:var(--blue-light);}
  .today-p.maint{background:rgba(59,130,246,0.18);color:var(--blue-light);}
  .today-cta{margin-top:auto;background:var(--teal);color:#06281c;border:none;border-radius:8px;padding:13px;font-size:13px;font-weight:800;cursor:pointer;}


  /* 시안3 — 로고 코어 + 팀 카드 그리드 + 하단 대화 독 (AI 에이전트 지휘) */
  .console-caption{font-size:12px;color:var(--muted);margin:2px 0 14px;text-align:center;max-width:560px;}
  /* 6인 로스터가 한 줄에 딱 맞게 — 카드 컴팩트(아바타·글자 축소). */
  /* 팀원 카드 — 이름 없이 아이콘·역할·상태 배지만(어떤 에이전트가 작업 중인지 한눈에). */
  /* 에이전트 6인 + 엔진 2(임베딩·가드레일) = 8칸. 칸 수를 고정하지 않고 auto-fit으로 둔다 —
     앞으로 엔진이 더 붙어도 폭이 부족하면 자연스럽게 다음 줄로 넘어가고, 넉넉하면 한 줄을 유지한다. */
  /* AI 팀 울타리 — 로스터를 제목 있는 박스로 묶는다. 헤더에 팀 사무실 열기 버튼. */
  .ai-team{width:100%;box-sizing:border-box;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:11px 13px 12px;margin-bottom:14px;}
  .ai-team-h{display:flex;align-items:center;gap:9px;margin-bottom:11px;}
  .ai-team-t{font-size:13.5px;font-weight:800;color:#fff;letter-spacing:.2px;}
  .ai-team-sub{font-size:10.5px;color:var(--muted-2);font-weight:600;}
  /* 제목 바로 옆 배치(사용자 요청 2026-07-20 — "AI 팀" 곁에서 바로 열게), 부제는 오른쪽 끝으로. */
  .ai-team-office{background:rgba(59,130,246,.14);border:1px solid rgba(59,130,246,.4);color:var(--blue-light);font-size:11.5px;font-weight:700;border-radius:9px;padding:6px 11px;cursor:pointer;transition:.14s;white-space:nowrap;}
  .ai-team-office:hover{background:var(--blue);color:#fff;border-color:var(--blue);transform:translateY(-1px);}
  .ai-team-sub{margin-left:auto;}
  /* 울타리 안에서는 로스터가 박스의 배경 위에 놓이므로 카드 배경을 한 단계 낮춰 대비를 준다. */
  .ai-team .team-grid .tcard{background:var(--panel-2);}
  .team-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:8px;width:100%;}
  .tcard{background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:9px 5px;text-align:center;cursor:pointer;position:relative;transition:.15s;}
  .tcard:hover{border-color:var(--border-strong);transform:translateY(-2px);}
  .tcard.sel{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset,0 0 18px rgba(59,130,246,.18);}
  .tcard.working{border-color:rgba(59,130,246,0.5);box-shadow:0 0 16px rgba(59,130,246,0.18);}
  .tc-av{width:32px;height:32px;border-radius:9px;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:15px;background:var(--panel-2);border:1px solid var(--border);}
  .tcard.working .tc-av{border-color:var(--blue);animation:tcpulse 1.5s infinite;}
  @keyframes tcpulse{0%,100%{box-shadow:0 0 0 0 rgba(59,130,246,.5)}50%{box-shadow:0 0 0 7px rgba(59,130,246,0)}}
  .tcard.watching .tc-av{border-color:rgba(30,185,128,.55);}
  .tc-name{font-size:10.5px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tc-role{font-size:8.5px;color:var(--muted);margin-top:2px;min-height:22px;line-height:1.3;}
  .tc-badges{display:flex;gap:3px;justify-content:center;margin-top:5px;flex-wrap:wrap;}
  .tc-b{font-size:8px;font-weight:800;padding:2px 5px;border-radius:4px;}
  .tc-work{color:var(--blue-light);background:rgba(59,130,246,0.16);}
  .tc-watch{color:var(--teal);background:rgba(30,185,128,0.16);}
  .tc-idle{color:var(--muted-2);background:rgba(255,255,255,0.05);}
  .tc-llm{color:var(--purple);background:rgba(139,124,240,0.14);}
  .tc-live{position:absolute;top:8px;right:9px;font-size:8.5px;color:var(--blue-light);font-weight:800;}
  .tc-typing span{display:inline-block;width:3.5px;height:3.5px;border-radius:50%;background:var(--blue-light);margin:0 1px;animation:tcblink 1s infinite;}
  .tc-typing span:nth-child(2){animation-delay:.2s}.tc-typing span:nth-child(3){animation-delay:.4s}
  @keyframes tcblink{0%,100%{opacity:.3}50%{opacity:1}}
  /* ── 임베딩 엔진 카드 ──────────────────────────────────────────────────────
     로스터 7번째 자리이지만 성격이 다르다 — 대화 상대(에이전트)가 아니라 RAG 검색·문서
     인입을 처리하는 인프라다. 점선 테두리·청록 계열과 ENGINE 라벨로 구분해, 눌러서
     대화하려는 오해를 막는다(선택 대상에서도 제외). 호출될 때만 파형이 뛴다. */
  .tcard.infra{background:linear-gradient(180deg,rgba(30,185,128,.05),var(--panel));border-style:dashed;
    border-color:rgba(30,185,128,.32);cursor:default;}
  .tcard.infra:hover{transform:none;border-color:rgba(30,185,128,.5);}
  .tcard.infra .tc-av{border-color:rgba(30,185,128,.4);}
  .tcard.infra.down{border-color:rgba(226,72,61,.45);background:linear-gradient(180deg,rgba(226,72,61,.06),var(--panel));}
  .tcard.infra.down .tc-av{border-color:rgba(226,72,61,.5);}
  .tc-b.tc-infra{color:var(--teal);background:rgba(30,185,128,.16);}
  .tc-b.tc-infra-down{color:var(--red);background:rgba(226,72,61,.16);}
  .infra-tag{position:absolute;top:-7px;left:50%;transform:translateX(-50%);font-size:7.5px;font-weight:800;
    letter-spacing:.4px;color:var(--teal);background:var(--bg);padding:0 6px;}
  .tcard.infra.down .infra-tag{color:var(--red);}
  .tcard.infra.active{border-color:rgba(30,185,128,.65);box-shadow:0 0 18px rgba(30,185,128,.22);}
  .tcard.infra.active .tc-av{border-color:var(--teal);animation:embpulse 1.1s infinite;}
  @keyframes embpulse{0%,100%{box-shadow:0 0 0 0 rgba(30,185,128,.55)}50%{box-shadow:0 0 0 8px rgba(30,185,128,0)}}
  .emb-wave{display:flex;align-items:flex-end;justify-content:center;gap:2px;height:13px;margin-top:4px;}
  .emb-wave i{width:2.5px;background:var(--teal);border-radius:2px;height:3px;opacity:.85;}
  .tcard.infra.down .emb-wave i{background:var(--red);}
  .tcard.infra.active .emb-wave i{animation:embwv .85s infinite ease-in-out;}
  .emb-wave i:nth-child(2){animation-delay:.1s}.emb-wave i:nth-child(3){animation-delay:.2s}
  .emb-wave i:nth-child(4){animation-delay:.3s}.emb-wave i:nth-child(5){animation-delay:.4s}
  @keyframes embwv{0%,100%{height:3px}50%{height:12px}}
  .emb-stat{font-size:7.5px;color:var(--teal);margin-top:3px;font-weight:700;min-height:10px;}
  .tcard.infra.down .emb-stat{color:var(--red);}
  /* ── 가드레일 카드 ─────────────────────────────────────────────────────────
     임베딩과 같은 ENGINE 계열이지만 의미가 반대다 — 임베딩은 "돌고 있으면 정상",
     가드레일은 "탐지가 뜨면 공격받는 중"이다. 그래서 평상시 청록이 아니라 중립(회색)이고,
     탐지 시 앰버, 보호가 꺼져 있으면(off) 빨강으로 경고한다. */
  .tcard.guard{background:linear-gradient(180deg,rgba(139,124,240,.05),var(--panel));
    border-color:rgba(139,124,240,.28);}
  .tcard.guard:hover{border-color:rgba(139,124,240,.5);}
  .tcard.guard .tc-av{border-color:rgba(139,124,240,.4);}
  .tcard.guard .infra-tag{color:var(--purple);}
  .tc-b.tc-guard{color:var(--purple);background:rgba(139,124,240,.16);}
  .tc-b.tc-guard-alert{color:var(--amber);background:rgba(240,160,32,.18);}
  .tc-b.tc-guard-off{color:var(--red);background:rgba(226,72,61,.16);}
  .guard-stat{font-size:7.5px;color:var(--muted);margin-top:3px;font-weight:700;min-height:10px;}
  /* 탐지 발생 — 앰버로 강하게 반응 */
  .tcard.guard.hit{border-color:rgba(240,160,32,.7);box-shadow:0 0 18px rgba(240,160,32,.25);}
  .tcard.guard.hit .tc-av{border-color:var(--amber);animation:gdpulse 1s infinite;}
  .tcard.guard.hit .guard-stat{color:var(--amber);}
  @keyframes gdpulse{0%,100%{box-shadow:0 0 0 0 rgba(240,160,32,.6)}50%{box-shadow:0 0 0 8px rgba(240,160,32,0)}}
  /* 보호 꺼짐 — 상시 경고(깜빡이지 않되 눈에 띄게) */
  .tcard.guard.off{border-color:rgba(226,72,61,.5);background:linear-gradient(180deg,rgba(226,72,61,.07),var(--panel));}
  .tcard.guard.off .tc-av{border-color:rgba(226,72,61,.55);}
  .tcard.guard.off .infra-tag{color:var(--red);}
  .tcard.guard.off .guard-stat{color:var(--red);}
  .agent-dock{margin-top:auto;width:100%;position:sticky;bottom:0;background:linear-gradient(180deg,rgba(10,14,26,0) 0%,var(--bg) 26%);padding:16px 0 18px;display:flex;align-items:center;gap:10px;justify-content:center;z-index:6;}
  .dock-who{display:flex;align-items:center;gap:8px;background:rgba(59,130,246,0.1);border:1px solid rgba(59,130,246,0.3);border-radius:10px;padding:7px 11px;white-space:nowrap;}
  .dock-who .dw-i{width:26px;height:26px;border-radius:8px;background:var(--panel);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;}
  .dock-who b{font-size:12px;color:#fff;}.dock-who span{font-size:10px;color:var(--blue-light);}
  .agent-dock input{flex:1;background:var(--panel);border:1px solid var(--border-strong);border-radius:10px;padding:12px 14px;color:var(--text);font-size:13px;outline:none;}
  .agent-dock input:focus{border-color:var(--blue);}
  .dock-plus{flex:none;width:44px;height:44px;border-radius:10px;background:rgba(59,130,246,0.14);border:1px solid rgba(59,130,246,0.4);color:var(--blue-light);font-size:22px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .12s;}
  .dock-plus:hover{background:rgba(59,130,246,0.26);}
  /* 스마트 업로드 결정 카드(콘솔 인라인) — 애매할 때 유형 4택 */
  .cl-updecide{background:rgba(240,160,32,0.06);border:1px solid rgba(240,160,32,0.3);border-radius:10px;padding:11px 13px;margin-top:6px;}
  .cl-upd-h{font-size:12px;font-weight:800;color:#fff;margin-bottom:3px;}
  .cl-upd-f{font-size:11px;color:var(--amber);margin-bottom:7px;word-break:break-all;}
  .cl-upd-pname{margin-bottom:7px;}
  .cl-upd-pname-in{width:100%;background:var(--panel-2);border:1px solid var(--border-strong);border-radius:7px;padding:7px 9px;color:var(--text);font-size:12px;outline:none;}
  .cl-upd-pname-in:focus{border-color:var(--blue);}
  .cl-upd-btns{display:flex;gap:6px;flex-wrap:wrap;}
  .cl-upd-btns button{font-size:11.5px;font-weight:700;border-radius:8px;padding:6px 11px;cursor:pointer;border:1px solid var(--border-strong);background:var(--panel-2);color:var(--text);}
  .cl-upd-btns button.reco{background:rgba(59,130,246,0.14);border-color:var(--blue);color:var(--blue-light);}
  .cl-upd-btns button:hover{border-color:var(--blue);}
  .dock-send{background:var(--blue);color:#fff;border:none;border-radius:10px;padding:0 20px;height:44px;font-weight:800;cursor:pointer;}
  .dock-all{background:var(--panel);border:1px solid var(--border-strong);color:var(--blue-light);font-weight:800;font-size:11.5px;border-radius:10px;padding:0 13px;height:44px;white-space:nowrap;cursor:pointer;}
