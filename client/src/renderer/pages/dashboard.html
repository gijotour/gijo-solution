<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIJO AS — AI Security Manager OS</title>
<style>
  :root{
    --bg:#0a0e1a;--panel:#121a2e;--panel-2:#0e1526;--border:rgba(255,255,255,0.08);
    --border-strong:rgba(255,255,255,0.16);--blue:#3b82f6;--blue-light:#5fa1ff;--white:#ffffff;
    --text:#e7eaf3;--muted:#8b93ab;--muted-2:#5f6785;--red:#e2483d;--amber:#f0a020;--teal:#1eb980;--purple:#8b7cf0;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Pretendard","Malgun Gothic","Segoe UI",sans-serif;background:#05070d;color:var(--text);}

  .titlebar{display:flex;align-items:center;justify-content:space-between;background:#0d1220;padding:6px 12px;border-bottom:1px solid var(--border);font-size:11.5px;color:var(--muted);}
  .titlebar-left{display:flex;align-items:center;gap:8px;}
  .titlebar-left img{height:14px;}
  .win-dots{display:flex;gap:14px;color:var(--muted-2);font-size:13px;}
  .menubar{display:flex;gap:18px;background:#0a0e1a;padding:6px 14px;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);}

  .app-shell{background:var(--bg);min-height:820px;}
  .header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--border);}
  .header-left{display:flex;align-items:center;gap:12px;}
  .header-left img{height:22px;}
  .app-title{font-size:15px;font-weight:800;color:#fff;}
  .clock{font-size:12.5px;color:var(--blue-light);font-weight:600;}
  .header-right{display:flex;align-items:center;gap:10px;}
  .status-pill{display:flex;align-items:center;gap:6px;background:rgba(30,185,128,0.15);border:1px solid rgba(30,185,128,0.4);color:var(--teal);padding:6px 14px;border-radius:20px;font-size:12px;font-weight:800;}
  .status-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);}
  .beta-tag{background:var(--teal);color:#06281c;font-size:9px;font-weight:800;padding:1px 6px;border-radius:4px;margin-left:2px;}
  .icon-row{display:flex;gap:6px;}
  .icon-btn{width:32px;height:32px;border-radius:8px;background:var(--panel);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted);cursor:pointer;}
  .icon-btn.on{background:rgba(59,130,246,0.18);border-color:var(--blue);color:var(--blue-light);}
  .avatar-btn{width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;}

  .body-grid{display:grid;grid-template-columns:220px 1fr 300px;min-height:640px;}
  .explorer{padding:18px 14px;border-right:1px solid var(--border);}
  .explorer-title{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;color:var(--text);margin-bottom:4px;}
  .explorer-sub{font-size:11px;color:var(--blue-light);margin-bottom:24px;}
  .explorer-tree{font-size:12.5px;color:var(--muted);line-height:2.1;}
  .explorer-tree .folder{color:var(--text);font-weight:600;}
  .explorer-hint{margin-top:28px;font-size:12px;color:var(--muted-2);text-align:center;line-height:1.7;font-style:italic;}

  .center-stage{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;position:relative;}
  .network-svg{width:100%;max-width:460px;}
  .agent-bubble{display:flex;align-items:flex-start;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 18px;max-width:420px;margin-top:8px;}
  .agent-avatar{width:28px;height:28px;border-radius:8px;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
  .agent-bubble-text{font-size:12.5px;color:var(--text);line-height:1.6;}
  .agent-bubble-name{font-size:11.5px;font-weight:800;color:var(--blue-light);margin-bottom:4px;}

  .today-panel{padding:18px 16px;border-left:1px solid var(--border);display:flex;flex-direction:column;}
  .today-title{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:800;color:#fff;margin-bottom:14px;}
  .today-input{display:flex;gap:8px;margin-bottom:14px;}
  .today-input input{flex:1;background:var(--panel-2);border:1px solid var(--border-strong);border-radius:8px;padding:0 12px;height:34px;color:var(--text);font-size:12.5px;outline:none;}
  .today-add{width:34px;height:34px;border-radius:8px;background:var(--teal);color:#06281c;border:none;font-weight:800;cursor:pointer;font-size:16px;}
  .today-item{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:12px;}
  .today-p{padding:2px 7px;border-radius:5px;font-size:10.5px;font-weight:800;}
  .p0{background:rgba(226,72,61,0.18);color:#f5928a;}
  .p1{background:rgba(240,160,32,0.18);color:#f7c777;}
  .today-cta{margin-top:auto;background:var(--teal);color:#06281c;border:none;border-radius:8px;padding:13px;font-size:13px;font-weight:800;cursor:pointer;}

  .chatbar{display:flex;flex-direction:column;gap:6px;padding:14px 20px;border-top:1px solid var(--border);}
  .chatbar input{width:100%;background:var(--panel);border:1px solid var(--border-strong);border-radius:10px;padding:14px 16px;color:var(--text);font-size:13px;outline:none;}
  .chatbar-hint{font-size:11px;color:var(--muted-2);}
</style>
</head>
<body>

      </svg>
      <div class="agent-bubble">
        <div class="agent-avatar">◆</div>

          <div class="agent-bubble-name" id="agentBubbleName">오케스트레이터</div>

        </div>

      <div class="collab-feed" id="collabFeed" style="width:100%;max-width:460px;margin-top:14px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px;">
        <div style="font-size:10.5px;font-weight:700;color:var(--muted-2);letter-spacing:1px;margin-bottom:8px;">실시간 에이전트 협업</div>
        <div id="collabRows" style="max-height:150px;overflow-y:auto;font-size:11.5px;line-height:1.9;font-family:'Consolas','Menlo',monospace;">

    <div class="chatbar-hint" id="chatHint">Enter 전송 · Shift+Enter 줄바꿈 · ⌘ 끌어다 놓기</div>

<script>
  const clockEl = document.getElementById("clockEl");
  const statusPill = document.getElementById("statusPill");
  const avatarBtn = document.getElementById("avatarBtn");
  const explorerTree = document.getElementById("explorerTree");
  const todayItems = document.getElementById("todayItems");
  const agentBubbleName = document.getElementById("agentBubbleName");
  const agentBubbleText = document.getElementById("agentBubbleText");
  const chatInput = document.getElementById("chatInput");
  const todoInput = document.getElementById("todoInput");

  let displayName = "";

  function tick() {
    const now = new Date();
    clockEl.textContent = now.toLocaleString("ko-KR", {
      hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: true,
      year: "numeric", month: "2-digit", day: "2-digit",
    });
  }

  const PRIORITY_ORDER = { P0: 0, P1: 1, P2: 2, P3: 3 };
  const PRIORITY_CLASS = { P0: "p0", P1: "p1", P2: "p1", P3: "p1" };

  async function loadHealth() {
    try {
      await window.gijo.checkServerHealth();
      statusPill.innerHTML = '<span class="dot"></span>운영중<span class="beta-tag">LIVE</span>';
    } catch (e) {
      statusPill.innerHTML = '<span class="dot" style="background:#e2483d"></span>서버 연결 끊김';
      statusPill.style.background = "rgba(226,72,61,0.15)";
      statusPill.style.borderColor = "rgba(226,72,61,0.4)";
      statusPill.style.color = "#f5928a";
    }
  }

  async function loadUser() {
    try {
      const user = await window.gijo.me();
      displayName = user.displayName || user.username || "사용자";
      avatarBtn.textContent = displayName.charAt(0);
    } catch (e) {
      displayName = "";
    }
  }

  function assetRow(a, showPath) {
    const nm = String(a.name).replace(/</g, "&lt;");
    const sub = showPath && a.path && a.path !== a.name ? ` <span style="color:var(--muted-2);font-size:10.5px">${String(a.path).replace(/</g, "&lt;")}</span>` : "";
    const vulns = a.findings.length ? ` <span style="color:var(--amber)">(${a.findings.length})</span>` : "";
    return `<div style="padding-left:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${nm}${sub}${vulns}</div>`;
  }

  const STATUS_LABEL = { idle: "대기중", working: "작업중", watching: "모니터링" };
  const STATUS_DOT = { idle: "var(--muted-2)", working: "var(--amber)", watching: "var(--teal)" };

  async function loadTeam() {
    const el = document.getElementById("teamTree");
    try {
      const agents = await window.gijo.listAgents();
      el.innerHTML = agents.map((a) => {
        const model = a.assignedModelId ? ` <span style="color:var(--muted-2);font-size:10px">· ${String(a.assignedModelId).replace(/</g, "&lt;")}</span>` : "";
        return `<div style="display:flex;align-items:center;gap:7px;padding:3px 0 3px 4px;">
          <span style="width:6px;height:6px;border-radius:50%;background:${STATUS_DOT[a.status] || "var(--muted-2)"};flex:none;"></span>
          <span style="color:var(--text);">${String(a.name).replace(/</g, "&lt;")}</span>
          <span style="color:var(--muted-2);font-size:10px;">${STATUS_LABEL[a.status] || ""}</span>${model}
        </div>`;
      }).join("");
    } catch (e) {
      el.innerHTML = '<div style="color:var(--muted-2)">팀을 불러오지 못했습니다</div>';
    }
  }

  async function loadAssets() {
    try {
      const assets = await window.gijo.listAssets();
      if (assets.length === 0) {
        explorerTree.innerHTML = '<div class="folder">▸ AI 자산 (0)</div><div style="padding-left:14px;color:var(--muted-2)">등록된 자산이 없습니다</div>';
        return;
      }
      const hosts = assets.filter((a) => a.assetType === "infra-host");
      const ai = assets.filter((a) => a.assetType !== "infra-host");
      let html = "";
      html += `<div class="folder">▸ AI 자산 (${ai.length})</div>`;
      html += ai.slice(0, 8).map((a) => assetRow(a, false)).join("");
      if (ai.length > 8) html += `<div style="padding-left:14px;color:var(--muted-2);font-size:11px">…외 ${ai.length - 8}건</div>`;
      if (hosts.length) {
        html += `<div class="folder" style="margin-top:8px">▸ 인프라 호스트 (${hosts.length})</div>`;
        html += hosts.slice(0, 8).map((a) => assetRow(a, true)).join("");
        if (hosts.length > 8) html += `<div style="padding-left:14px;color:var(--muted-2);font-size:11px">…외 ${hosts.length - 8}건</div>`;
      }
      explorerTree.innerHTML = html;
    } catch (e) {
      explorerTree.innerHTML = '<div style="color:var(--muted-2)">자산 목록을 불러오지 못했습니다</div>';
    }
  }

  async function loadTasks() {
    try {
      const tasks = await window.gijo.listTasks();
      const open = tasks.filter((t) => !t.done).sort((a, b) => (PRIORITY_ORDER[a.priority] ?? 9) - (PRIORITY_ORDER[b.priority] ?? 9));
      if (open.length === 0) {
        todayItems.innerHTML = '<div style="font-size:12px;color:var(--muted-2);padding:10px 0">오늘 확인할 항목이 없습니다</div>';
        return;
      }
      todayItems.innerHTML = open
        .map(
          (t) => `<div class="today-item"><span class="today-p ${PRIORITY_CLASS[t.priority] || "p1"}">${t.priority}</span>${t.text}</div>`
        )
        .join("");
    } catch (e) {
      todayItems.innerHTML = '<div style="color:var(--muted-2);font-size:12px">작업 목록을 불러오지 못했습니다</div>';
    }
  }

  async function addTodo() {
    const text = todoInput.value.trim();
    if (!text) return;
    todoInput.value = "";
    await window.gijo.addTask(text);
    await loadTasks();
  }

  async function sendToOrchestrator(text) {
    agentBubbleText.textContent = "처리 중...";
    try {
      const result = await window.gijo.sendInstruction(text);
      agentBubbleName.textContent = result.route.agentId;
      agentBubbleText.textContent = result.output;
      await loadTasks();
      if (result.route.action === "scan") await loadAssets();
    } catch (e) {
      agentBubbleText.textContent = "지시 처리 중 오류가 발생했습니다: " + e.message;
    }
  }

  function greet() {
    const hour = new Date().getHours();
    const greeting = hour < 12 ? "좋은 아침입니다" : hour < 18 ? "안녕하세요" : "좋은 저녁입니다";
    agentBubbleText.textContent = `${greeting}${displayName ? ", " + displayName + "님" : ""}. 아래에 지시를 입력하시면 바로 처리합니다.`;
  }

  const collabRows = document.getElementById("collabRows");

  function collabRowHtml(evt) {
    const time = new Date(evt.timestamp || Date.now()).toLocaleTimeString("ko-KR", { hour12: false });
    const from = String(evt.from || "").replace(/</g, "&lt;");
    const to = String(evt.to || "").replace(/</g, "&lt;");
    const msg = String(evt.message || "").replace(/</g, "&lt;");
    return `<div><span style="color:var(--muted-2)">${time}</span> <span style="color:var(--blue-light);font-weight:700">${from}</span> → <span style="color:var(--teal);font-weight:700">${to}</span> <span style="color:var(--text)">${msg}</span></div>`;
  }

  function appendCollabRow(evt) {
    if (collabRows.textContent.includes("대기 중")) collabRows.innerHTML = "";
    collabRows.insertAdjacentHTML("beforeend", collabRowHtml(evt));
    while (collabRows.childElementCount > 50) collabRows.removeChild(collabRows.firstChild);
    collabRows.scrollTop = collabRows.scrollHeight;
  }

  async function loadCollaboration() {
    try {
      const history = await window.gijo.listCollaborationHistory();
      if (history.length === 0) return;
      collabRows.innerHTML = history.slice(-50).map(collabRowHtml).join("");
      collabRows.scrollTop = collabRows.scrollHeight;
    } catch (e) {}
  }

  async function init() {
    tick();
    setInterval(tick, 1000);
    await loadUser();
    greet();
    await Promise.all([loadHealth(), loadTeam(), loadAssets(), loadTasks(), loadCollaboration()]);

    document.getElementById("settingsBtn").addEventListener("click", () => window.gijo.navigateTo("settings.html"));
    document.querySelectorAll("[data-page]").forEach((el) => el.addEventListener("click", () => window.gijo.navigateTo(el.dataset.page)));
    document.getElementById("refreshAssetsBtn").addEventListener("click", loadAssets);
    document.getElementById("todoAddBtn").addEventListener("click", addTodo);
    todoInput.addEventListener("keydown", (e) => { if (e.key === "Enter") addTodo(); });

    chatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        const text = chatInput.value.trim();
        if (!text) return;
        chatInput.value = "";
        sendToOrchestrator(text);
      }
    });

    document.getElementById("todayCtaBtn").addEventListener("click", () => {
      sendToOrchestrator("오늘 확인할 항목을 우선순위대로 에이전트 팀에게 위임해서 처리해줘");
    });

    window.gijo.onCollaborationEvent((evt) => {
      agentBubbleName.textContent = evt.to;
      agentBubbleText.textContent = evt.message;
      appendCollabRow(evt);
    });
  }

  if (!window.gijo.isAuthenticated()) {
    window.gijo.navigateTo("login.html");
  } else {
    window.gijoRealtime.connect();
    init();
  }
</script>

</body>
</html>
