  }
  function openSessionPage(id) {
    try { localStorage.setItem("gijo:sessions:open", id); } catch (e) {}
    window.gijo.navigateTo("sessions.html");
  }

  // ── 통합 자산 탐색기(공유 모듈) — 작업 세션 화면과 동일한 5구획 탐색기 ────────
  // 내 PC 파일 탐색기 — 선택한 루트 폴더(fs:pickRoot) 안의 폴더·파일을 읽기전용 트리로 본다.
  // (기존 자산 탐색기 대체) 폴더는 그 자리에서 ▸/▾ 펼침(renderDir·openDirs), 문서 파일은 클릭 시
  // "🧠 분석해 올리기"로 장기기억(RAG)에 넣을 수 있다. 루트 밖(..)·50MB↑는 메인에서 차단.
  async function reloadDashExplorer() { await loadFileExplorer(); }
  // AS 탐색기 상태·캐시 — 리포트(리포트 메뉴 등록분)·문서(장기기억 RAG 등록분). 콘솔 크기(12px) 폰트.
  const asOpen = { report: false, doc: false };
  let asReportsCache = [];
  let asDocsCache = [];
  async function loadFileExplorer() {
    if (!explorerTree) return;
    try {
      asDocsCache = await window.gijo.listMemoryDocuments();
      docClassMap = new Map(asDocsCache.filter((d) => d.docClass).map((d) => [d.documentId, d.docClass]));
    } catch (e) { asDocsCache = asDocsCache || []; /* 분류 배지는 부가 정보 */ }
    try { asReportsCache = await window.gijo.listReportHistory(); } catch (e) { asReportsCache = asReportsCache || []; }
    explorerTree.innerHTML = "";
    // 1) 내 PC 파일 트리
    const fileBox = document.createElement("div");
    explorerTree.appendChild(fileBox);
    try {
      const data = await window.gijo.listDir("");
      const rn = document.getElementById("fxRoot"); if (rn) rn.textContent = data.rootName || "루트";
      await renderDir("", 0, fileBox);
      if (!fileBox.innerHTML) fileBox.innerHTML = '<div class="tree-empty">빈 폴더</div>';
    } catch (e) {
      fileBox.innerHTML = '<div class="tree-empty">파일을 불러오지 못했습니다 (데스크톱 앱 전용)</div>';
    }
    // 2) AS 탐색기 (리포트 · 문서)
    renderAsExplorer(explorerTree);
  }
  // AS 탐색기 — 리포트/문서를 폴더처럼 ▸ 펼쳐 그 자리에서 목록을 본다(시안 A 2섹션 스택).
  function renderAsExplorer(root) {
    const sec = document.createElement("div");
    sec.className = "as-explorer";
    sec.innerHTML = '<div class="as-sec">📋 AS 탐색기</div>';
    root.appendChild(sec);
    sec.appendChild(asFolder("report", "📊", "리포트", asReportsCache.length, fillReports));
    sec.appendChild(asFolder("doc", "📄", "문서", asDocsCache.length, fillDocs));
  }
  function asFolder(key, icon, label, count, fill) {
    const wrap = document.createElement("div");
    const row = document.createElement("div");
    row.className = "asx-row";
    row.innerHTML = '<span class="asx-car">' + (asOpen[key] ? "▾" : "▸") + '</span><span class="asx-ic">' + icon +
      '</span><span class="asx-nm">' + label + '</span><span class="asx-cnt">' + count + '</span>';
    const body = document.createElement("div");
    body.className = "asx-body";
    if (asOpen[key]) fill(body);
    row.addEventListener("click", () => {
      asOpen[key] = !asOpen[key];
      row.querySelector(".asx-car").textContent = asOpen[key] ? "▾" : "▸";
      if (asOpen[key]) fill(body); else body.innerHTML = "";
    });
    wrap.appendChild(row); wrap.appendChild(body);
    return wrap;
  }
  function fillReports(box) {
    if (!asReportsCache.length) { box.innerHTML = '<div class="asx-empty">등록된 리포트 없음</div>'; return; }
    const typeLabel = (t) => t === "weekly" ? "주간" : t === "quarterly" ? "분기" : "수시";
    box.innerHTML = asReportsCache.map((r, i) => {
      const d = r.createdAt ? new Date(r.createdAt).toLocaleDateString("ko-KR") : "";
      const file = r.pdf || r.docx || "";
      const view = file ? '<span class="asx-view" data-view="' + i + '" title="' + (r.pdf ? "리포트 바로 보기 (PDF)" : "파일 열기") + '">👁</span>' : "";
      return '<div class="asx-file" data-report="1" title="리포트 화면에서 열기"><span class="asx-ic">📄</span>' +
        '<span class="asx-nm">' + escT(typeLabel(r.type) + " 리포트 · " + d) + '</span>' + view + '</div>';
    }).join("");
    // 👁 보기 — 대시보드에서 바로 PDF를 띄운다(행 클릭은 리포트 화면 이동, 아이콘 클릭은 여기서 보기).
    box.querySelectorAll(".asx-view").forEach((el) => el.addEventListener("click", (e) => {
      e.stopPropagation();
      openReportInline(asReportsCache[Number(el.dataset.view)]);
    }));
    box.querySelectorAll("[data-report]").forEach((el) => el.addEventListener("click", () => window.gijo.navigateTo("report.html")));
  }

  // 리포트 뷰어 — 저장된 PDF를 대시보드 모달에서 바로 띄운다. PDF가 없으면 파일을 내려받는다(정직한 폴백).
  function ensureReportViewer() {
    let m = document.getElementById("reportViewModal");
    if (m) return m;
    m = document.createElement("div");
    m.id = "reportViewModal";
    m.className = "rvm";
    m.innerHTML = '<div class="rvm-box"><div class="rvm-head"><span class="rvm-t" id="rvmTitle">리포트</span>' +
      '<button class="rvm-dl" id="rvmDl">⬇ 다운로드</button><button class="rvm-x" id="rvmX">✕ 닫기</button></div>' +
      '<div class="rvm-body" id="rvmBody"></div></div>';
    document.body.appendChild(m);
    const close = () => { m.classList.remove("open"); if (m._url) { URL.revokeObjectURL(m._url); m._url = null; } document.getElementById("rvmBody").innerHTML = ""; };
    m.querySelector("#rvmX").addEventListener("click", close);
    m.addEventListener("click", (e) => { if (e.target === m) close(); });
    return m;
  }
  async function reportBlobUrl(name) {
    const f = await window.gijo.downloadReportFile(name);
    const bytes = Uint8Array.from(atob(f.base64), (c) => c.charCodeAt(0));
    return { url: URL.createObjectURL(new Blob([bytes], { type: f.mime })), file: f };
  }
  async function openReportInline(entry) {
    if (!entry) return;
    const typeLabel = (t) => t === "weekly" ? "주간" : t === "quarterly" ? "분기" : "수시";
    // PDF가 있으면 모달 뷰어로 바로 보기, 없으면 DOCX 다운로드.
    if (entry.pdf) {
      const m = ensureReportViewer();
      const body = document.getElementById("rvmBody");
      document.getElementById("rvmTitle").textContent = typeLabel(entry.type) + " 리포트 · " + (entry.createdAt ? new Date(entry.createdAt).toLocaleString("ko-KR") : "");
      body.innerHTML = '<div style="color:#ccc;padding:22px;font-size:12.5px">불러오는 중…</div>';
      m.classList.add("open");
      document.getElementById("rvmDl").onclick = () => downloadReport(entry.pdf);
      try {
        const { url } = await reportBlobUrl(entry.pdf);
        m._url = url;
        body.innerHTML = '<iframe src="' + url + '" style="width:100%;height:100%;border:0;"></iframe>';
      } catch (e) {
        body.innerHTML = '<div style="color:#f5928a;padding:22px;font-size:12.5px">PDF를 불러오지 못했습니다: ' + escT((e && e.message) || e) + "</div>";
      }
    } else if (entry.docx) {
      downloadReport(entry.docx);
    }
  }
  // 리포트 파일 다운로드(뷰어 없이도 저장) — report.html의 downloadReport와 동일 동작.
  async function downloadReport(name) {
    try {
      const { url, file } = await reportBlobUrl(name);
      const a = document.createElement("a"); a.href = url; a.download = file.name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 8000);
    } catch (e) { alert("리포트를 내려받지 못했습니다: " + ((e && e.message) || e)); }
  }
  function fillDocs(box) {
    if (!asDocsCache.length) { box.innerHTML = '<div class="asx-empty">등록된 문서 없음</div>'; return; }
    box.innerHTML = asDocsCache.map((dd) => {
      const cls = dd.docClass ? ' <span class="leaf-b ' + (DOCCLASS_B[dd.docClass] || "lb-mut") + '">' + escT(dd.docClass) + '</span>' : "";
      return '<div class="asx-file" data-doc="1" title="올린 문서 관리 화면에서 열기"><span class="asx-ic">📄</span>' +
        '<span class="asx-nm">' + escT(dd.documentId) + '</span>' + cls + '</div>';
    }).join("") + '<div class="asx-total">총 ' + asDocsCache.length + '개</div>';
    box.querySelectorAll("[data-doc]").forEach((el) => el.addEventListener("click", () => window.gijo.navigateTo("memory.html")));
  }
  // 대상 클릭 → 별도 화면으로 넘기지 않고 "실시간 활동"에 상태 카드+추천을 바로 표시한다.
  // 이어서 대화 독에 지시하면 이 세션에 기록되고, 응답도 실시간 활동에 흐른다(대시보드에서 모두 처리).
  async function onDashEntitySelect(type, id) {
    const ctx = window.gijoSessionExplorer.buildContext(type, id);
    clAppend("reply", { icon: "📋", name: ctx.title, message: ctx.statusText });
    appendSuggestions(ctx.suggestions);
    try {
      const s = await window.gijo.createWorkSession(ctx.title, type + ":" + id);
      await window.gijo.addWorkSessionTurn(s.id, "assistant", ctx.statusText, "상태");
      dashCurrentSession = { id: s.id, title: s.title || ctx.title };
      chatInput.placeholder = `“${ctx.title}”에 이어서 지시… (또는 위 추천 클릭)`;
      chatInput.focus();
      loadDashSessions();
    } catch (e) { /* 세션 저장에 실패해도 상태 카드는 이미 실시간 활동에 표시됨 */ }
  }
  // 추천 다음 단계를 실시간 활동에 클릭 가능한 버튼으로 붙인다(누르면 그 지시를 대화 독으로 전송).
  function appendSuggestions(suggestions) {
    if (!suggestions || !suggestions.length) return;
    const el = clAppend("offer", { icon: "💡", name: "이런 작업을 할 수 있어요 — 눌러서 지시", message: "" });
    const cb = el.querySelector(".cb");
    if (!cb) return;
    const wrap = document.createElement("div");
    wrap.style.cssText = "display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;";
    suggestions.forEach((sg) => {
      const b = document.createElement("button");
      b.className = "cl-offer-btn";
      b.style.cssText = "background:var(--panel);border:1px solid var(--border-strong);color:var(--blue-light);";
      b.textContent = sg.label;
      b.title = sg.instruction || sg.label;
      if (sg.terminalHost !== undefined) {
        // 🖥 터미널 연결 — ssh 명령을 미리 채워 터미널로 이동(담당자가 검토 후 실행).
        b.style.cssText = "background:rgba(30,185,128,.14);border:1px solid var(--teal);color:var(--teal);";
        b.addEventListener("click", () => {
          try { localStorage.setItem("gijo.terminal.prefill", sg.terminalHost ? "ssh " + sg.terminalHost : ""); } catch (e) {}
          window.gijo.navigateTo("terminal.html");
        });
      } else {
        b.addEventListener("click", () => { chatInput.value = sg.instruction; dockSubmit(); });
      }
      wrap.appendChild(b);
    });
    cb.appendChild(wrap);
  }

  async function init() {
    tick();
    setInterval(tick, 1000);
    checkUpdateChip(); // 시계 옆 업데이트 알림(비차단)
    await loadUser();
    greet();
    // renderTeam을 먼저 끝내 agentsById를 채운다 — 협업 이력(loadCollaboration)·서버 카드가 표시 이름/수를 쓰도록.
    await renderTeam();
    await Promise.all([loadHealth(), loadServerCard(), reloadDashExplorer(), loadCollaboration(), checkModelReady(), loadTodayPriority()]);

    // ☰ 전체메뉴 버튼 제거됨 — 하단 세그먼트가 대체 (요소가 없으므로 배선도 제거)
    document.querySelectorAll("[data-page]").forEach((el) => el.addEventListener("click", () => window.gijo.navigateTo(el.dataset.page)));
    const officeBtn = document.getElementById("officeBtn");
    if (officeBtn) officeBtn.addEventListener("click", () => window.gijo.openTeamOffice()); // 별도 창 — 페이지 이동 아님
    const teamOfficeBtn = document.getElementById("teamOfficeBtn");
    if (teamOfficeBtn) teamOfficeBtn.addEventListener("click", () => window.gijo.openTeamOffice()); // AI 팀 박스 헤더 — 팀 사무실 창
    const refreshFilesBtn = document.getElementById("refreshFilesBtn");
    if (refreshFilesBtn) refreshFilesBtn.addEventListener("click", () => loadFileExplorer());
    const pickRootBtn = document.getElementById("pickRootBtn");
    if (pickRootBtn) pickRootBtn.addEventListener("click", (e) => { e.stopPropagation(); pickFolder(); });
    // 오늘 확인할 항목 UI는 작업 세션(sessions.html)으로 이관됨 — 대시보드에 없으면 배선 생략.
    const todoAddBtn = document.getElementById("todoAddBtn");
    if (todoAddBtn) todoAddBtn.addEventListener("click", addTodo);
    if (todoInput) todoInput.addEventListener("keydown", (e) => { if (e.key === "Enter") addTodo(); });
    if (todayItems) todayItems.addEventListener("click", onTaskAction);
    document.getElementById("mgDownloadBtn").addEventListener("click", () => window.gijo.navigateTo("llmguide.html"));
    document.getElementById("mgServerBtn").addEventListener("click", () => window.gijo.navigateTo("settings.html"));

    chatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); dockSubmit(); }
    });
    document.getElementById("dockSend").addEventListener("click", dockSubmit);
    document.getElementById("dockUpload").addEventListener("click", () => smartInput.click());
    document.getElementById("dockAll").addEventListener("click", () => {
      dashCurrentSession = null; chatInput.placeholder = "지시를 입력하세요…"; // 세션 해제 — 일반 지시
      selectAgent("orchestrator"); dockSubmit();
    });

    const todayCtaBtn = document.getElementById("todayCtaBtn");
    if (todayCtaBtn) todayCtaBtn.addEventListener("click", () => {
      sendToOrchestrator("오늘 확인할 항목을 우선순위대로 에이전트 팀에게 위임해서 처리해줘");
    });

    // 작업 세션 열 — 목록 로드 + 새 세션/전체 화면 진입(전용 화면으로 딥링크).
    loadDashSessions();
    const dashActiveBadge = document.getElementById("dashActiveBadge");
    if (dashActiveBadge) dashActiveBadge.addEventListener("click", () => window.gijo.navigateTo("sessions.html"));
    const dashFull = document.getElementById("dashSessionsFull");
    if (dashFull) dashFull.addEventListener("click", () => window.gijo.navigateTo("sessions.html"));

    // ② 오른쪽 작업 세션 패널만 접기/펴기 — 상태는 기억한다(다음 방문에도 유지).
    // 패널 헤더의 ⏵ 버튼과 상단 ◧ 버튼 둘 다 같은 토글. 접히면 중앙 콘솔이 넓어진다.
    const RIGHT_HIDDEN_KEY = "gijo.dashRightHidden";
    function applyRightHidden(hidden) {
      const bg = document.querySelector(".body-grid");
      if (!bg) return;
      bg.classList.toggle("no-right", hidden);
      const t = document.getElementById("toggleRightBtn");
      if (t) { t.classList.toggle("on", hidden); t.title = hidden ? "오른쪽 세션 패널 펴기" : "오른쪽 세션 패널 접기"; }
      // 가장자리 세로 탭 — 항상 표시(2026-07-25 통일): 접힘=화면 오른쪽 끝 '열기',
      // 열림=패널 왼쪽 경계에 반쯤(12px) 걸친 '접기'(왼쪽 gnLeftEdge와 대칭).
      const rr = document.getElementById("rightReopen");
      if (rr) {
        rr.classList.add("on");
        if (hidden) {
          rr.style.right = "0px"; rr.style.left = "auto";
          rr.style.borderRadius = "10px 0 0 10px"; rr.style.padding = "14px 6px"; rr.style.letterSpacing = "2px";
          rr.textContent = "◀ 작업 세션 열기"; rr.title = "오른쪽 작업 세션 패널 열기";
        } else {
          const panel = document.querySelector(".dash-sessions");
          const leftPx = panel ? Math.max(0, Math.round(panel.getBoundingClientRect().left) - 12) : (window.innerWidth - 372);
          rr.style.left = leftPx + "px"; rr.style.right = "auto";
          rr.style.borderRadius = "10px"; rr.style.padding = "10px 5px"; rr.style.letterSpacing = "1px";
          rr.textContent = "▶ 접기"; rr.title = "오른쪽 작업 세션 패널 접기";
        }
      }
    }
    // 창 크기·배율 변경 시 열림 상태 탭의 경계 재계산
    window.addEventListener("resize", () => {
      const hidden = !!document.querySelector(".body-grid")?.classList.contains("no-right");
      applyRightHidden(hidden);
    });
    function toggleRight() {
      const hidden = !(document.querySelector(".body-grid")?.classList.contains("no-right"));
      try { localStorage.setItem(RIGHT_HIDDEN_KEY, hidden ? "1" : "0"); } catch (e) {}
      applyRightHidden(hidden);
    }
    // 세션 패널의 ⏵/◧는 아코디언 토글과 겹치지 않게(헤더 버튼) 이벤트 전파를 막는다.
    document.getElementById("dashHideRight")?.addEventListener("click", (e) => { e.stopPropagation(); toggleRight(); });
    document.getElementById("toggleRightBtn")?.addEventListener("click", toggleRight);
    document.getElementById("dashRightCollapse")?.addEventListener("click", toggleRight); // 패널 안 '전체 접기' 헤더 버튼
    document.getElementById("rightReopen")?.addEventListener("click", toggleRight); // 접힘 상태 '열기' 탭
    // 기본은 '접힘'(사용자 방침 2026-07-22) — 처음엔 오른쪽 가장자리 '◧ 작업 세션 열기' 탭만 보이고,
    // 누르면 패널이 열린다(메뉴 페이지의 작업 세션 드로어와 동일한 접힘-기본 경험). 상태는 기억한다.
    try { const st = localStorage.getItem(RIGHT_HIDDEN_KEY); applyRightHidden(st === null ? true : st === "1"); } catch (e) { applyRightHidden(true); }

    // 오른쪽 패널 아코디언 — [작업 세션]·[지휘 콘솔] 각각 독립 접기. 헤더의 버튼(.acc-sp)은 제외.
    // 캐럿 문자를 상태에 맞춰 갱신 — ▾(열림)·▸(닫힘). 회전 대신 문자라 열고닫힘이 확실히 보인다.
    const setAccCaret = (acc) => { const c = acc && acc.querySelector(".car"); if (c) c.textContent = acc.classList.contains("collapsed") ? "▸" : "▾"; };
    document.querySelectorAll(".acc-h[data-acc]").forEach((h) => {
      h.addEventListener("click", (e) => {
        if (e.target.closest(".acc-sp")) return;
        const acc = h.closest(".acc");
        const collapsed = acc.classList.toggle("collapsed");
        setAccCaret(acc);
        try { localStorage.setItem("gijo.dashAcc." + h.dataset.acc, collapsed ? "1" : "0"); } catch (e) {}
      });
    });
    // 초기 상태 — 지휘 콘솔은 기본 펼침. 캐럿도 상태에 맞춰 세팅.
    {
      let v; try { v = localStorage.getItem("gijo.dashAcc.console"); } catch (e) {}
      if (v == null) v = "0";
      const acc = document.getElementById("accConsole");
      if (acc) { acc.classList.toggle("collapsed", v === "1"); setAccCaret(acc); }
    }

    window.gijo.onCollaborationEvent((evt) => {
      appendCollabRow(evt);
      appendOfficeLive(evt); // 🏢 보안팀 사무실 LIVE 대화(작업 세션 패널 하단)
      if (evt && evt.to) markWorking(evt.to);
      pulseBusy();
    });
    // 사무실 LIVE 피드 — 로드 시 최근 대화를 채우고, 헤더를 누르면 사무실 창을 연다.
    initOfficeLive();
    // 로컬 LLM이 실제로 추론/임베딩할 때마다도 작업 중으로 간주해 반짝임을 살린다.
    // 임베딩 이벤트는 로스터의 엔진 카드에도 따로 반영한다(파형·처리량).
    if (window.gijo.onLlmActivity) {
      window.gijo.onLlmActivity((evt) => { pulseBusy(); onEmbeddingActivity(evt); });
    }
    // 엔진 생사는 이벤트가 없을 때도 바뀔 수 있어(수동 중지·크래시) 주기적으로 확인한다.
    setInterval(refreshEmbeddingCard, 30000);
    // 가드레일은 ws 푸시가 없어 폴링이 유일한 신호다. 공격 탐지를 늦게 알면 의미가 줄어 15초로 둔다.
    setInterval(refreshGuardCard, 15000);
    // 자산·스캔 변경(asset:updated)이 오면 자산 탐색기·오늘의 조치를 즉시 새로고침 — 스캔 업로드가
    // 대시보드에 바로 반영되게(수동 새로고침 없이). 잦은 이벤트 대비 300ms 디바운스.
    if (window.gijo.onAssetUpdated) {
      let t;
      window.gijo.onAssetUpdated(() => {
        clearTimeout(t);
        t = setTimeout(() => { loadTodayPriority(); loadDashSessions(); }, 300);
      });
    }
  }

  if (!window.gijo.isAuthenticated()) {
    window.gijo.navigateTo("login.html");
  } else {
    window.gijoRealtime.connect();
    init();
  }
</script>

<script>
// 담당자 업무 메뉴 (시안 1: 주기 3섹션) — A 역할 자동 큐레이션 + B 담당자 직접 담기 + C 업무 주기별.
// 자체완결(다른 스크립트와 격리). 커스터마이즈는 localStorage에 저장, 이동은 window.gijo.navigateTo.
(function () {

    "assethub.html": ["자산 허브", "🛡️"],
    "analysis.html": ["보안 분석", "📊"], "vulnscan.html": ["취약점", "🔎"], "approvals.html": ["조치·승인", "✅"], "threat.html": ["위협 인텔", "🎯"],

    "report.html": ["리포트", "📄"], "compliance.html": ["컴플라이언스", "📋"], "opsguide.html": ["유지보수", "🔧"], "redteam.html": ["레드팀·가드레일", "🚨"],
    "kpi.html": ["보안 KPI", "📈"], "sessions.html": ["작업 세션", "🗂️"], "sbom.html": ["AI-BOM", "🤖"], "agent.html": ["에이전트 AI", "🤝"], "merge.html": ["LLM 합성", "⚗️"],
    "memory.html": ["기억·학습(RAG)", "🧠"], "ontology.html": ["온톨로지", "🕸️"], "learnloop.html": ["학습 루프", "🔁"], "logs.html": ["로그", "📃"], "settings.html": ["설정", "⚙️"]
  };
  // 역할 프리셋(2026-07-23 ④ 대시보드 프리셋 A안) — 역할별로 위젯 구성을 통째로 전환한다.
  // SOC 대시보드 모범사례(역할 기반 프리셋). 프리셋을 고르면 layout이 그 구성으로 바뀌고,
  // 이후 편집으로 개인화하면 그 개인화가 저장된다(프리셋은 시작점).
  var PRESETS = {
    officer: { label: "👤 1인 담당자", desc: "혼자 다 보는 담당자 — 발견→조치 흐름 위주", layout: {
      daily: ["assethub.html", "vulnscan.html", "approvals.html", "threat.html", "analysis.html"],
      weekly: ["inventory.html", "products.html", "hardening.html", "opsguide.html", "audit.html"],
      monthly: ["report.html", "compliance.html", "redteam.html"] } },
    soc: { label: "👔 SOC 매니저", desc: "팀 관제 — 태세·KPI·배정·보고 위주", layout: {
      daily: ["kpi.html", "analysis.html", "approvals.html", "threat.html", "assethub.html"],
      weekly: ["report.html", "compliance.html", "audit.html", "redteam.html", "sessions.html"],
      monthly: ["hardening.html", "products.html"] } },
    ops: { label: "🔧 운영자", desc: "점검·유지보수·장비 위주", layout: {
      daily: ["hardening.html", "terminal.html", "opsguide.html", "products.html", "assethub.html"],
      weekly: ["inventory.html", "vulnscan.html", "audit.html", "logs.html"],
      monthly: ["report.html", "compliance.html"] } }
  };
  var PKEY = "gijo.dashMenu.preset.v1";
  function activePreset() { try { return localStorage.getItem(PKEY) || "officer"; } catch (e) { return "officer"; } }
  // 역할 기본(보안담당자) — 프리셋 미선택 시 기본. officer 프리셋과 동일 구성.
  var DEFAULT = PRESETS.officer.layout;
  var SEC = [["daily", "🔵 오늘 (매일)"], ["weekly", "🟢 이번 주 (주간)"], ["monthly", "🟡 이번 달 (월간)"]];
  var LKEY = "gijo.dashMenu.layout.v1", CKEY = "gijo.dashMenu.collapsed";
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function load() { try { var s = localStorage.getItem(LKEY); if (s) { var l = JSON.parse(s); if (l && l.daily && l.weekly && l.monthly) return l; } } catch (e) {} return clone(DEFAULT); }
  function save() { try { localStorage.setItem(LKEY, JSON.stringify(layout)); } catch (e) {} }
  var layout = load();
  var editing = false;
  var collapsed = false; try { collapsed = localStorage.getItem(CKEY) === "1"; } catch (e) {}

  var st = document.createElement("style");
  st.textContent =
    ".dash-menu{width:100%;box-sizing:border-box;margin-bottom:12px;background:var(--panel);border:1px solid var(--border);border-radius:13px;padding:10px 12px;}" +
    ".dm-top{display:flex;align-items:center;gap:9px;}" +
    ".dm-h{font-size:13.5px;font-weight:800;color:#fff;}" +
    ".dm-role{font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px;background:rgba(59,130,246,.15);color:var(--blue-light);}" +
    ".dm-presets{display:flex;gap:5px;margin:9px 0 2px;flex-wrap:wrap;}" +
    ".dm-preset{font-size:11px;font-weight:700;padding:5px 12px;border-radius:18px;border:1px solid var(--border);color:var(--muted);cursor:pointer;background:var(--panel-2);}" +
    ".dm-preset:hover{color:#fff;border-color:var(--blue);}" +
    ".dm-preset.on{background:rgba(59,130,246,.15);border-color:var(--blue);color:var(--blue-light);}" +
    ".dm-presetdesc{font-size:10px;color:var(--muted-2);margin:3px 2px 0;}" +
    ".dm-actions{margin-left:auto;display:flex;gap:6px;}" +
    ".dm-btn{background:transparent;border:1px solid var(--border-strong);color:var(--muted);border-radius:7px;padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer;}" +
    ".dm-btn.on{border-color:var(--blue);color:var(--blue-light);}" +
    ".dm-sub{font-size:11px;color:var(--muted);margin:5px 0 2px;}" +
    ".dm-sec{font-size:10.5px;font-weight:800;color:var(--muted-2);margin:8px 2px 5px;}" +
    // 6열 고정 + 큰 타일 — 아이콘·글자를 키워 폭을 꽉 채운다(사용자 요청 2026-07-20).
    ".dm-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;}" +
    ".dm-tile{background:var(--panel-2);border:1px solid var(--border);border-radius:12px;padding:16px 8px 14px;text-align:center;cursor:pointer;position:relative;transition:.14s;}" +
    ".dm-tile:hover{border-color:var(--blue);transform:translateY(-2px);}" +
    ".dm-tile .dic{font-size:28px;display:block;margin-bottom:8px;}" +
    ".dm-tile .dlb{font-size:13px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}" +
    ".dm-tile.add{border-style:dashed;}.dm-tile.add .dic{color:var(--blue-light);}.dm-tile.add .dlb{color:var(--muted);}" +
    ".dm-x{position:absolute;top:3px;right:5px;width:16px;height:16px;border-radius:50%;background:rgba(226,72,61,.92);color:#fff;font-size:10px;line-height:16px;display:none;}" +
    ".dash-menu.editing .dm-x{display:block;}.dash-menu.editing .dm-tile{cursor:default;}" +
    ".dash-menu.collapsed .dm-body{display:none;}" +
    ".dm-picker{position:absolute;z-index:90;background:var(--panel-2);border:1px solid var(--blue);border-radius:10px;padding:6px;max-height:250px;overflow:auto;box-shadow:0 12px 34px rgba(0,0,0,.55);min-width:180px;}" +
    ".dm-pitem{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:7px;font-size:11.5px;font-weight:600;color:var(--text);cursor:pointer;}" +
    ".dm-pitem:hover{background:var(--panel);}.dm-pempty{font-size:11px;color:var(--muted-2);padding:8px;}";
  document.head.appendChild(st);

  var role = "보안담당자";
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
  function usedPages() { return layout.daily.concat(layout.weekly, layout.monthly); }

  function closePicker() { var p = root.querySelector(".dm-picker"); if (p) p.remove(); }
  function openPicker(cadence, anchor) {
    closePicker();
    var used = usedPages();
    var avail = Object.keys(CATALOG).filter(function (pg) { return used.indexOf(pg) < 0; });
    var pick = document.createElement("div");
    pick.className = "dm-picker";
    if (!avail.length) { pick.innerHTML = '<div class="dm-pempty">추가할 메뉴가 없습니다(모두 담김).</div>'; }
    else pick.innerHTML = avail.map(function (pg) { return '<div class="dm-pitem" data-add="' + pg + '"><span>' + CATALOG[pg][1] + "</span>" + esc(CATALOG[pg][0]) + "</div>"; }).join("");
    root.appendChild(pick);
    var ar = anchor.getBoundingClientRect(), rr = root.getBoundingClientRect();
    pick.style.left = Math.max(6, ar.left - rr.left) + "px";
    pick.style.top = ar.bottom - rr.top + 6 + "px";
    pick.querySelectorAll("[data-add]").forEach(function (el) {
      el.addEventListener("click", function () { layout[cadence].push(el.getAttribute("data-add")); save(); render(); });
    });
  }

  function tile(pg, cadence) {
    var m = CATALOG[pg]; if (!m) return "";
    return '<div class="dm-tile" data-go="' + pg + '" data-cad="' + cadence + '"><span class="dm-x" data-rm="' + pg + '" data-rmcad="' + cadence + '">×</span>' +
      '<span class="dic">' + m[1] + '</span><span class="dlb">' + esc(m[0]) + "</span></div>";
  }

  function render() {
    root.className = "dash-menu" + (editing ? " editing" : "") + (collapsed ? " collapsed" : "");
    var body = SEC.map(function (s) {
      var cad = s[0];
      var tiles = layout[cad].map(function (pg) { return tile(pg, cad); }).join("");
      var addBtn = editing ? '<div class="dm-tile add" data-addcad="' + cad + '"><span class="dic">＋</span><span class="dlb">메뉴 추가</span></div>' : "";
      return '<div class="dm-sec">' + s[1] + " · " + layout[cad].length + "개</div><div class=\"dm-grid\">" + tiles + addBtn + "</div>";
    }).join("");
    var pa = activePreset();
    var presetTabs = Object.keys(PRESETS).map(function (k) {
      return '<span class="dm-preset' + (k === pa ? " on" : "") + '" data-preset="' + k + '">' + PRESETS[k].label + "</span>";
    }).join("");
    root.innerHTML =
      '<div class="dm-top"><span class="dm-h">🧭 내 업무 바로가기</span><span class="dm-role">👤 ' + esc(role) + "</span>" +
      '<div class="dm-actions">' +
      '<button class="dm-btn" id="dmReset" title="현재 프리셋 기본으로 초기화">↺ 기본</button>' +
      '<button class="dm-btn' + (editing ? " on" : "") + '" id="dmEdit">✏ ' + (editing ? "완료" : "편집") + "</button>" +
      '<button class="dm-btn" id="dmCollapse">' + (collapsed ? "▼ 펼치기" : "▲ 접기") + "</button></div></div>" +
      '<div class="dm-body"><div class="dm-presets">' + presetTabs + "</div>" +
      '<div class="dm-presetdesc">' + esc(PRESETS[pa] ? PRESETS[pa].desc : "") + " · 프리셋을 고른 뒤 편집으로 개인화할 수 있어요</div>" +
      (editing ? '<div class="dm-sub">타일 ×로 제거, ＋메뉴 추가로 원하는 메뉴를 담으세요. 업무 주기별로 배치됩니다.</div>' : "") + body + "</div>";

    root.querySelectorAll("[data-preset]").forEach(function (el) {
      el.addEventListener("click", function () {
        var k = el.getAttribute("data-preset");
        if (k === activePreset()) return;
        if (!confirm(PRESETS[k].label + " 프리셋으로 바꿀까요? 현재 구성이 이 프리셋으로 교체됩니다(편집으로 다시 개인화 가능).")) return;
        try { localStorage.setItem(PKEY, k); } catch (e) {}
        layout = clone(PRESETS[k].layout); save(); render();
      });
    });

    document.getElementById("dmEdit").addEventListener("click", function () { editing = !editing; closePicker(); render(); });
    document.getElementById("dmCollapse").addEventListener("click", function () { collapsed = !collapsed; try { localStorage.setItem(CKEY, collapsed ? "1" : "0"); } catch (e) {} render(); });
    document.getElementById("dmReset").addEventListener("click", function () { var pa = activePreset(); var base = PRESETS[pa] ? PRESETS[pa].layout : DEFAULT; if (confirm("현재 프리셋(" + (PRESETS[pa] ? PRESETS[pa].label : "기본") + ") 기본 구성으로 되돌릴까요?")) { layout = clone(base); save(); render(); } });
    root.querySelectorAll("[data-go]").forEach(function (el) {
      el.addEventListener("click", function () { if (editing) return; window.gijo.navigateTo(el.getAttribute("data-go")); });
    });
    root.querySelectorAll("[data-rm]").forEach(function (el) {
      el.addEventListener("click", function (e) { e.stopPropagation(); var cad = el.getAttribute("data-rmcad"), pg = el.getAttribute("data-rm"); layout[cad] = layout[cad].filter(function (x) { return x !== pg; }); save(); render(); });
    });
    root.querySelectorAll("[data-addcad]").forEach(function (el) {
      el.addEventListener("click", function (e) { e.stopPropagation(); openPicker(el.getAttribute("data-addcad"), el); });
    });
    renderTopShortcuts(); // 상단 툴바도 등록 목록과 동기화
  }
  // 상단 툴바 = '내 업무 바로가기'에 등록된 항목만(주기 3구획 합쳐 중복 제거·순서 유지). 등록 변경 시 자동 갱신.
  function renderTopShortcuts() {
    var bar = document.getElementById("topShortcuts");
    if (!bar) return;
    var seen = {}, pages = [];
    ["daily", "weekly", "monthly"].forEach(function (c) {
      (layout[c] || []).forEach(function (pg) { if (!seen[pg] && CATALOG[pg]) { seen[pg] = 1; pages.push(pg); } });
    });
    bar.innerHTML = pages.map(function (pg) {
      var m = CATALOG[pg];
      return '<div class="icon-btn" data-goto="' + pg + '" title="' + esc(m[0]) + '">' + m[1] + "</div>";
    }).join("");
    bar.querySelectorAll("[data-goto]").forEach(function (el) {
      el.addEventListener("click", function () { if (window.gijo && window.gijo.navigateTo) window.gijo.navigateTo(el.getAttribute("data-goto")); });
    });
  }
  document.addEventListener("click", function (e) { if (!e.target.closest(".dm-picker") && !e.target.closest("[data-addcad]")) closePicker(); });

  render();
  // 실제 역할 배지 반영(비차단).
  if (window.gijo && window.gijo.me) {
    window.gijo.me().then(function (u) { role = u && u.role === "admin" ? "관리자" : "보안담당자"; render(); }).catch(function () {});
  }
})();
</script>
<script src="onboarding.js"></script>
<!-- nav.js: 대시보드에선 사이드바를 렌더하지 않지만(#gijoNav 없음) 공용 메뉴 렌더러(window.gijoRenderMenu)를
     제공한다 — '전체메뉴' 모드가 진짜 메뉴를 그리도록(복사본 폐기). render()는 조기 반환. -->
<script src="nav.js"></script>
<script src="titlebar.js"></script>
</body>
</html>
