<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIJO AS — 대시보드</title>
<link rel="stylesheet" href="gijo-ui.css">
<!--
  대시보드 4.0.0 — 시안 B(브리핑 중심). 2026-07-28 사용자 결정.

  왜 다시 짰나
  ────────────
  3.x의 대시보드는 사실상 "앱 전체"였다. 히어로 구체 · 지휘 콘솔 · 탐색기 · 작업세션 패널 ·
  사무실 피드 · 내 업무 바로가기를 한 화면에 다 이고 있었고, JS만 1,100줄이 콘솔 몫이었다.
  4.0.0에서 셸(app.html)이 메뉴·탭줄·콘솔을 가져가면서 이것들이 전부 중복이 됐다 —
  특히 입력칸이 화면에 둘(셸 콘솔 + 대시보드 콘솔) 보이는 상태는 "지시는 한 곳"이라는
  이번 개편의 원칙과 정면으로 어긋났다.

  그래서 대시보드는 **탭 하나의 몫**으로 줄였다: 오늘 무엇이 급한지 읽는 자리.
  숫자판을 늘어놓기보다 AI가 문장으로 먼저 말하고, 근거 목록은 아래 작게 둔다.

  ⚠ 이 화면의 숫자는 전부 서버 실측이다. 값을 못 받으면 빈 상태로 그 사실을 밝힌다 —
    자리를 채우려고 임의 숫자를 넣지 않는다.
-->
<style>
  :root{
    --bg:#262624;--panel:#30302e;--border:rgba(255,255,255,.08);
    --blue:#3b82f6;--blue-l:#5fa1ff;--text:#e9e7e2;--muted:#b3ada4;--muted-2:#a49d95;
    --teal:#1eb980;--red:#e2483d;--amber:#f0a020;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Pretendard","Malgun Gothic","Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:13px;}
  .app{display:grid;grid-template-columns:212px 1fr;min-height:100vh;}
  .sidebar{border-right:1px solid var(--border);background:#1f1e1d;}
  /* 넓은 화면에서 오른쪽이 비지 않게 — 실측(2026-07-28) FHD에서 탭 안 2168px 중 948px가
     빈 채로 남았다(44%). 다만 **글과 목록은 성격이 다르다**:
       · 브리핑은 읽는 글이다. 한 줄이 너무 길면 눈이 다음 줄 첫머리를 못 찾는다 → 폭을 묶는다.
       · 카드는 훑는 목록이다. 넓을수록 취약점 이름이 안 잘린다 → 화면을 채운다.
     그래서 .main의 상한을 풀고, 브리핑에만 상한을 준다. */
  .main{padding:18px 22px 40px;max-width:1800px;}
  .brief{max-width:1220px;}

  /* 정체성 한 줄 — 사용법·용어 풀이는 ⓘ로 챗봇에서(프로젝트 원칙) */
  .scr-id{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:14px;}
  .scr-id b{color:var(--text);font-weight:800;}
  .scr-id .ask{margin-left:2px;color:var(--blue-l);cursor:pointer;font-weight:700;}
  .scr-id .ask:hover{text-decoration:underline;}

  /* 머리(시안 C) — [사람: 인사·사용법 3단계] | [기계: 서버·엔진·리소스·AI 팀] */
  .head{display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap;align-items:stretch;}
  .hello{flex:1 1 420px;min-width:0;background:linear-gradient(180deg,rgba(59,130,246,.08),transparent);
    border:1px solid var(--border);border-radius:12px;padding:16px 18px;
    display:flex;flex-direction:column;justify-content:center;}
  .hi{font-size:23px;font-weight:800;color:#fff;letter-spacing:-.3px;}
  .how{margin-top:8px;font-size:13px;color:var(--muted);line-height:1.7;}
  .steps{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .step{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);
    background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:6px 10px;}
  .step b{color:var(--blue-l);font-weight:700;}
  .step .n{flex:0 0 auto;width:16px;height:16px;border-radius:50%;background:rgba(59,130,246,.18);
    color:var(--blue-l);font-size:11.75px;font-weight:800;display:flex;align-items:center;justify-content:center;}

  /* 상태 판 — 서버·엔진·리소스·AI 팀 */
  .state{flex:0 1 430px;min-width:0;background:var(--panel);border:1px solid var(--border);
    border-radius:12px;padding:13px 15px;}
  .state h4{font-size:12.25px;font-weight:800;color:var(--muted-2);margin-bottom:10px;letter-spacing:.3px;
    display:flex;align-items:center;gap:7px;}
  .st{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;}
  .s{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);padding:3px 0;min-width:0;}
  .s b{color:var(--text);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .s .l{display:flex;align-items:center;flex:0 0 auto;}
  .s .dot{width:6px;height:6px;border-radius:50%;background:var(--muted-2);margin-right:5px;flex:0 0 auto;}
  .s.on .dot{background:var(--teal);}
  .s.off{color:#f5928a;} .s.off .dot{background:#f5928a;} .s.off b{color:#f5928a;}
  .vram{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.06);}
  .vram .t{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:5px;}
  .vram .t b{color:var(--text);font-weight:700;}
  .vram .sub{margin-top:5px;font-size:12px;color:var(--muted-2);}
  .bar{height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--blue));}
  .team{display:flex;align-items:center;gap:6px;margin-top:10px;padding-top:10px;
    border-top:1px solid rgba(255,255,255,.06);cursor:pointer;}
  .eng-load{font-size:12.5px;color:var(--muted-2);}

  /* AI 팀 아이콘 줄 — 로고 + 팀원 아이콘. 브리핑 위에 얇게 얹는다. */
  .team:hover .team-sum{color:var(--blue-l);}
  .team-logo{width:18px;height:18px;flex:0 0 auto;border-radius:5px;opacity:.92;}
  .team-icons{display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-width:0;width:100%;}
  .team-load{font-size:12.5px;color:var(--muted-2);}
  .tm{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;
    font-size:13px;background:#1f1e1d;border:1px solid var(--border);color:var(--muted);}
  .tm.working{border-color:rgba(30,185,128,.55);color:var(--teal);animation:tmbreath 1.6s ease-in-out infinite;}
  .tm.watching{border-color:rgba(59,130,246,.45);color:var(--blue-l);}
  @keyframes tmbreath{0%,100%{box-shadow:0 0 0 0 rgba(30,185,128,.35);}50%{box-shadow:0 0 0 5px rgba(30,185,128,0);}}
  .team-sum{font-size:12.5px;color:var(--muted-2);margin-left:auto;white-space:nowrap;}

  /* 브리핑 — 사람이 읽는 문장이 주인공 */
  .brief{background:linear-gradient(180deg,rgba(59,130,246,.10),transparent);
    border:1px solid rgba(59,130,246,.30);border-radius:14px;padding:18px 20px;margin-bottom:16px;}
  .brief .who{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--blue-l);font-weight:800;margin-bottom:9px;}
  .brief .who .dot{width:6px;height:6px;border-radius:50%;background:var(--teal);flex:0 0 auto;}
  .brief .who .by{margin-left:auto;color:var(--muted-2);font-weight:700;}
  .brief .tx{font-size:14.5px;line-height:1.85;color:#dfe6f7;white-space:pre-wrap;word-break:break-word;}
  .brief.dim .tx{color:var(--muted);}
  .acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .act{background:rgba(59,130,246,.14);border:1px solid rgba(59,130,246,.42);color:#cfe0ff;border-radius:9px;
    padding:8px 13px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
  .act:hover{background:var(--blue);color:#fff;}
  .act.ghost{background:transparent;border-color:rgba(255,255,255,.14);color:var(--muted);}
  .act.ghost:hover{color:#fff;border-color:var(--blue);background:rgba(59,130,246,.1);}
  .act[disabled]{opacity:.45;cursor:default;}

  /* 시작 가이드 카드 — 4대 시나리오 실행 진입점 */
  .guide{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:12px;max-width:1220px;}
  .g-head{display:flex;align-items:center;gap:9px;padding:13px 15px;cursor:pointer;user-select:none;}
  .g-head .car{color:var(--muted-2);font-size:11.75px;transition:transform .15s;}
  .guide.open .g-head .car{transform:rotate(90deg);}
  .g-head h3{font-size:12.5px;font-weight:800;}
  .g-head .gsub{font-size:12.25px;color:var(--muted-2);font-weight:600;}
  .g-prog{margin-left:auto;display:flex;align-items:center;gap:8px;}
  .g-bar{width:78px;height:5px;border-radius:4px;background:#1f1e1d;overflow:hidden;}
  .g-bar i{display:block;height:100%;background:var(--teal);width:0;}
  .g-cnt{font-size:12.25px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;}
  .g-body{display:none;border-top:1px solid var(--border);}
  .guide.open .g-body{display:block;}
  .sc{border-bottom:1px solid var(--border);}
  .sc:last-child{border-bottom:0;}
  .sc-head{display:flex;align-items:center;gap:10px;padding:11px 15px;cursor:pointer;}
  .sc-head:hover{background:rgba(255,255,255,.02);}
  .sc-n{width:19px;height:19px;border-radius:50%;background:#1f1e1d;border:1px solid rgba(255,255,255,.16);
        display:flex;align-items:center;justify-content:center;font-size:11.75px;font-weight:800;color:var(--muted);flex:0 0 auto;}
  .sc.done .sc-n{background:rgba(30,185,128,.16);border-color:rgba(30,185,128,.4);color:var(--teal);}
  .sc-t{font-size:12.5px;font-weight:700;}
  .sc-d{font-size:12.25px;color:var(--muted-2);}
  .sc-r{margin-left:auto;font-size:12.25px;color:var(--muted-2);font-weight:700;}
  .sc.done .sc-r{color:var(--teal);}
  .sc-steps{display:none;padding:2px 15px 12px 44px;}
  .sc.open .sc-steps{display:block;}
  .gst{display:flex;align-items:center;gap:9px;padding:6px 0;}
  .gst-c{width:15px;height:15px;border-radius:4px;border:1px solid rgba(255,255,255,.16);flex:0 0 auto;
         display:flex;align-items:center;justify-content:center;font-size:11.25px;color:transparent;}
  .gst.done .gst-c{background:var(--teal);border-color:var(--teal);color:#06281c;}
  .gst-t{font-size:12px;flex:1;min-width:0;}
  .gst.done .gst-t{color:var(--muted);}
  .gst-q{font-family:Consolas,monospace;font-size:12.25px;color:var(--blue-l);}
  .gst-go{background:transparent;border:1px solid rgba(255,255,255,.16);color:var(--muted);border-radius:7px;
          padding:4px 10px;font-size:12.25px;font-weight:700;cursor:pointer;font-family:inherit;flex:0 0 auto;}
  .gst-go:hover{border-color:var(--blue);color:#fff;}
  .gst.done .gst-go{opacity:.55;}
  .g-foot{padding:10px 15px;border-top:1px solid var(--border);font-size:12.25px;color:var(--muted-2);display:flex;align-items:center;gap:10px;}
  .g-foot button{margin-left:auto;background:transparent;border:1px solid rgba(255,255,255,.16);color:var(--muted);
          border-radius:7px;padding:4px 10px;font-size:12.25px;font-weight:700;cursor:pointer;font-family:inherit;}
  .g-done{display:flex;align-items:center;gap:8px;padding:11px 15px;font-size:12px;color:var(--teal);}
  .g-done button{margin-left:auto;background:transparent;border:1px solid rgba(255,255,255,.16);color:var(--muted);
          border-radius:7px;padding:4px 10px;font-size:12.25px;font-weight:700;cursor:pointer;font-family:inherit;}

  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  @media (max-width:1000px){.grid{grid-template-columns:1fr;}}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:13px 15px;min-width:0;}
  .card h3{font-size:12px;font-weight:800;margin-bottom:9px;color:var(--muted);display:flex;align-items:center;gap:6px;}
  .card h3 .cnt{margin-left:auto;color:var(--muted-2);font-weight:700;}
  .li{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid rgba(255,255,255,.05);font-size:12.5px;min-width:0;}
  .li.go{cursor:pointer;}
  .li.go:hover .tx{color:#fff;}
  .li .b{flex:0 0 auto;width:5px;height:5px;border-radius:50%;}
  .b.red{background:#f5928a;} .b.amber{background:var(--amber);} .b.blue{background:var(--blue-l);} .b.gray{background:var(--muted-2);}
  .li .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .li .m{flex:0 0 auto;font-size:12px;color:var(--muted-2);white-space:nowrap;}
  .li.done .tx{color:var(--muted-2);text-decoration:line-through;}
  .li input.ck{flex:0 0 auto;width:13px;height:13px;accent-color:var(--blue);cursor:pointer;}
  .empty{font-size:12px;color:var(--muted-2);padding:10px 0;line-height:1.7;}
  .more{border-top:1px solid rgba(255,255,255,.05);padding:8px 0 2px;font-size:12.5px;color:var(--muted-2);cursor:pointer;text-align:center;}
  .more:hover{color:var(--blue-l);}
  .big{font-size:21px;font-weight:800;}
  .kv{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:6px 0;border-top:1px solid rgba(255,255,255,.05);}
  .kv span:first-child{font-size:12.5px;color:var(--muted);}
  .kv b{font-size:13px;}
  .addrow{display:flex;gap:6px;margin-top:9px;}
  .addrow input{flex:1;min-width:0;background:#1f1e1d;border:1px solid var(--border);border-radius:8px;
    padding:7px 9px;color:var(--text);font-size:12px;font-family:inherit;}
  .addrow input:focus{outline:none;border-color:rgba(59,130,246,.5);}
  .addrow button{background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--muted);
    border-radius:8px;padding:0 11px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
  .addrow button:hover{color:#fff;border-color:var(--blue);}
</style>
</head>
<body class="g-ui">
<div class="app">
  <div class="sidebar" id="gijoNav"></div>
  <div class="main">
    <div class="scr-id">🏠 <b>대시보드</b> — 오늘 무엇이 급한지 AI가 먼저 알려주는 자리입니다.
      <span class="ask" id="askInfo">· 이 화면 설명 듣기</span></div>


    <!-- AI 팀 — 지금 누가 일하고 있는지 아이콘으로만 보여준다(2026-07-28 사용자 요청).
         3.x 대시보드에 있던 로스터를 되살렸다. 이름·역할·배지까지 늘어놓으면 브리핑을 아래로
         밀어내므로, 아이콘 + 마우스 올렸을 때 설명만 둔다. 작업 중이면 아이콘이 숨 쉰다.
         ⚠ 로고는 **로컬 파일**을 쓴다 — 다른 화면들은 https://gijo.ai/… 를 부르는데
           폐쇄망에서는 그림이 안 뜬다(온프렘 제품에서 외부 주소는 안 된다). -->
    <!-- 환영 인사 + 사용법 — 3.8.2에 있던 것을 되살렸다(2026-07-29 사용자 요청).
         브리핑이 "무엇이 급한가"를 말한다면, 이 줄은 "여기서 무엇을 어떻게 하는가"를 말한다.
         처음 쓰는 사람은 화면만 보고는 어디에 지시해야 하는지 모른다 — 한 줄이면 된다. -->
    <!-- 머리 — 왼쪽은 사람(인사·사용법), 오른쪽은 기계(엔진·AI 팀).
         세로로 세 줄 쌓으면 브리핑이 아래로 밀린다. 한 줄에 좌우로 나눠 얹는다.
         좁아지면(1000px 미만) 자연히 위아래로 접힌다. -->
    <!-- 머리 — 시안 C(2026-07-29 사용자 결정).
         왼쪽은 사람: 인사 + **사용법 3단계**. 대시보드는 하루에 몇 번씩 돌아오는 곳이라
         여기 적어 두면 쓰는 법이 저절로 각인된다(처음 쓰는 사람은 어디에 지시하는지 모른다).
         오른쪽은 기계: 서버·엔진·리소스·AI 팀을 한 판에. "AI가 왜 답을 안 하지?"의 답이
         대개 여기 있다 — 모델이 안 떴거나, 임베딩이 죽었거나, VRAM이 없거나. -->
    <div class="head">
      <div class="hello">
        <div class="hi" id="helloLine">안녕하세요</div>
        <div class="how">오늘 무엇부터 볼지 AI가 아래에 정리해 뒀습니다.</div>
        <div class="steps">
          <span class="step"><span class="n">1</span>왼쪽 메뉴에서 화면을 고르면 <b>탭</b>으로 열립니다</span>
          <span class="step"><span class="n">2</span>지시는 <b>아래 대화창</b>에 적습니다</span>
          <span class="step"><span class="n">3</span>지금 보는 탭이 곧 지시의 대상입니다</span>
        </div>
      </div>

      <div class="state">
        <h4><img class="team-logo" src="gijo-logo.png" alt="GIJO">서버 · 엔진 · 리소스</h4>
        <div class="st" id="stateGrid"><span class="eng-load">상태 확인 중…</span></div>
        <div class="vram" id="vramBox" style="display:none">
          <div class="t"><span>GPU 메모리</span><b id="vramNum">-</b></div>
          <div class="bar"><i id="vramBar" style="width:0%"></i></div>
          <div class="sub" id="tierSub"></div>
        </div>
        <div class="team" id="teamRow" title="AI 팀 — 누르면 에이전트 AI 화면으로">
          <div class="team-icons" id="teamIcons"><span class="team-load">AI 팀 확인 중…</span></div>
        </div>
      </div>
    </div>

    <div class="brief dim" id="brief">
      <div class="who"><span class="dot"></span><span id="briefWho">AI 팀 브리핑</span><span class="by" id="briefBy"></span></div>
      <div class="tx" id="briefTx">오늘 상황을 확인하는 중입니다…</div>
      <div class="acts" id="briefActs"></div>
    </div>

    <!-- 시작 가이드 카드 — 4대 시나리오를 담당자가 직접 눌러 따라 해 보는 자리.
         읽는 안내가 아니라 **실행 진입점**이다: 각 단계가 콘솔에 실제로 물어보거나 화면을 연다.
         다 해 보면 한 줄로 접힌다(매일 쓰는 사람의 첫 화면을 잡아먹지 않게).
         2026-07-30 — onboarding.js 오버레이·런처·코치마크를 이 카드가 대신한다(조작 개념 -1). -->
    <div class="guide" id="guideCard" style="display:none"></div>

    <div class="grid">
      <div class="card"><h3>🔥 급한 것 <span class="cnt" id="urgentCnt"></span></h3>
        <div id="urgentList"><div class="empty">불러오는 중…</div></div></div>

      <!-- 오늘 할 일 — **읽기 전용 요약**이다(2026-07-31).
           같은 목록을 대시보드·팀 사무실 창·내 업무 세 군데서 각각 적어 넣고 있었다(전부 /api/tasks).
           적어 넣는 창구는 '내 업무' 하나로 모으고, 여기는 "지금 몇 건 남았나"만 보여준다.
           대시보드는 훑는 자리지 일하는 자리가 아니다. -->
      <div class="card"><h3>☑ 오늘 할 일 <span class="cnt" id="taskCnt"></span></h3>
        <div id="taskList"><div class="empty">불러오는 중…</div></div>
        <div class="addrow"><button id="taskOpen" style="width:100%" title="대화창에 "할 일 추가: "를 얹어 드립니다">＋ 대화창에서 적기</button></div></div>

      <div class="card"><h3>📊 한눈에</h3>
        <div id="kpiBox"><div class="empty">불러오는 중…</div></div></div>
    </div>
  </div>
</div>

<!-- 화면 설명은 셸 콘솔이 답한다 — chatwidget.js가 embed에서 window.gijoExplain만 노출한다 -->
<div id="gijoChatWidget"></div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  // 화면 열기 — 셸이 있으면 새 탭, 없으면(분리창) 그 자리 이동. 다리는 nav.js가 놓는다.
  function go(page) { if (window.gijoOpenScreen) window.gijoOpenScreen(page); else location.href = page; }

  // today 항목 id 접두사 → 실제로 조치하는 화면. 브리핑 버튼과 급한 것 목록이 같은 규칙을 쓴다.
  function screenOf(id) {
    var s = String(id || "");
    if (s.indexOf("vulnhost:") === 0) return "vulnscan.html";
    if (s.indexOf("hardening:") === 0) return "hardening.html";
    if (s.indexOf("maint:") === 0) return "maintenance.html";
    return "approvals.html";
  }

  // ── 환영 인사 ────────────────────────────────────────────────────────
  // 이름을 불러 준다 — 여럿이 쓰는 서버라 "지금 누구로 들어와 있나"가 그 자체로 정보다.
  async function loadHello() {
    if (!window.gijo || !window.gijo.me) return;
    try {
      var u = await window.gijo.me();
      var name = (u && (u.displayName || u.username)) || "";
      $("helloLine").textContent = name ? "안녕하세요, " + name + "님" : "안녕하세요";
    } catch (e) { /* 이름을 못 읽어도 인사는 남는다 */ }
  }

  // ── 엔진 상태 ────────────────────────────────────────────────────────
  // "AI가 왜 답을 안 하지?"의 답이 대개 여기 있다 — 모델이 안 떠 있거나 임베딩이 죽었거나.
  // 숫자를 늘어놓지 않고 **살아 있나/몇 개인가**만 본다.
  function stateRow(on, 이름, 값, 설명) {
    return '<div class="s ' + (on ? "on" : "off") + '" title="' + esc(설명 || "") + '">' +
      '<span class="l"><span class="dot"></span>' + esc(이름) + "</span><b>" + esc(값) + "</b></div>";
  }
  async function loadEngines() {
    var grid = $("stateGrid");
    if (!window.gijo || !window.gijo.getLocalEngineStatus) { grid.textContent = ""; return; }
    var rows = [];

    // 서버 — health가 돌면 운영 중이다. 여기가 꺼져 있으면 나머지는 볼 것도 없다.
    try {
      var h = await window.gijo.checkServerHealth();
      rows.push(stateRow(!!(h && (h.ok || h.status === "ok")), "서버", "운영 중", "연동 서버가 응답합니다"));
    } catch (e) { rows.push(stateRow(false, "서버", "응답 없음", "연동 서버에 닿지 못합니다")); }

    try {
      var s = await window.gijo.getLocalEngineStatus();
      var loaded = (s && s.loaded) || [];
      var ready = loaded.filter(function (m) { return m.ready; }).length;
      rows.push(stateRow(!!(s && s.running) && ready > 0, "로컬 LLM", ready ? ready + "개 로드" : "미기동",
        loaded.map(function (m) { return m.modelId; }).join(", ") || "로드된 모델이 없습니다"));
      var emb = s && s.embedding;
      rows.push(stateRow(!!(emb && emb.running), "임베딩", (emb && emb.modelId) || "미기동",
        "문서 검색(RAG)에 씁니다 — 꺼져 있으면 사내 자료를 못 찾습니다"));
    } catch (e) {
      rows.push(stateRow(false, "로컬 LLM", "확인 불가", "엔진 상태를 못 읽었습니다"));
    }

    try {
      var g = await window.gijo.guardrailStatus();
      var on = g && g.mode && g.mode !== "off";
      rows.push(stateRow(!!on, "가드레일",
        on ? (g.mode === "block" ? "차단" : "탐지") + (g.flaggedCount ? " · " + g.flaggedCount + "건" : "") : "꺼짐",
        "프롬프트 공격을 걸러 냅니다"));
    } catch (e) { /* 못 읽으면 그 줄만 빠진다 */ }
    grid.innerHTML = rows.join("");

    // GPU 메모리 — 숫자만으로는 여유가 얼마인지 감이 안 온다. 막대로 보여 준다.
    // ⚠ GPU가 없는 환경(CPU 전용·Mac)도 있다 — 그때는 이 구획을 통째로 감춘다.
    //   빈 막대를 0%로 그려 두면 "GPU가 꽉 찼나?"로 오해한다.
    try {
      var t = await window.gijo.getLlmTier();
      var gpu = t && t.gpu;
      if (gpu && gpu.totalMb > 0) {
        var GB = function (mb) { return (mb / 1024).toFixed(1); };
        $("vramNum").textContent = GB(gpu.usedMb) + " / " + GB(gpu.totalMb) + " GB · 여유 " + GB(gpu.freeMb) + "GB";
        $("vramBar").style.width = Math.max(0, Math.min(100, Math.round((gpu.usedMb / gpu.totalMb) * 100))) + "%";
        var cur = t.current || {};
        $("tierSub").textContent = cur.tier
          ? "구동 티어 " + cur.tier.charAt(0).toUpperCase() + cur.tier.slice(1) +
            (cur.maxLoadedModels ? " — 채팅 LLM " + cur.maxLoadedModels + "개" : "") +
            (cur.ctxSize ? " · " + Math.round(cur.ctxSize / 1024) + "K 컨텍스트" : "")
          : "";
        $("vramBox").style.display = "";
      }
    } catch (e) { /* GPU 정보를 못 읽으면 막대 없이 간다 */ }
  }

  // ── AI 팀 아이콘 줄 ──────────────────────────────────────────────────
  // "지금 누가 일하고 있나"만 보여준다. 이름·역할·배지를 다 늘어놓으면 브리핑이 아래로 밀린다.
  var AGENT_ICON = { orchestrator: "🧭", scan: "⊘", analysis: "◎", report: "▣", ti: "🛰", normaltic: "📚" };
  var STATUS_KO = { working: "작업 중", watching: "감시 중", idle: "대기" };
  async function loadTeam() {
    var box = $("teamIcons");
    if (!window.gijo || !window.gijo.listAgents) return;
    try {
      var agents = (await window.gijo.listAgents()) || [];
      if (!agents.length) { box.innerHTML = '<span class="team-load">등록된 팀원이 없습니다</span>'; return; }
      var 일하는중 = agents.filter(function (a) { return a.status === "working"; }).length;
      box.innerHTML = agents.map(function (a) {
        var st = STATUS_KO[a.status] ? a.status : "idle";
        // 마우스를 올리면 누구인지 알 수 있게 — 아이콘만으로는 못 알아본다.
        var tip = (a.name || a.id) + (a.role ? " · " + a.role : "") + " — " + STATUS_KO[st];
        return '<span class="tm ' + st + '" title="' + esc(tip) + '">' + (AGENT_ICON[a.id] || "◆") + "</span>";
      }).join("") +
        '<span class="team-sum">AI 팀 ' + agents.length + "명 · " +
        (일하는중 ? "작업 중 " + 일하는중 + "명" : "모두 대기") + "</span>";
    } catch (e) {
      box.innerHTML = '<span class="team-load">AI 팀 상태를 불러오지 못했습니다</span>';
    }
  }
  $("teamRow").addEventListener("click", function () { go("agent.html"); });
  // 모델이 실제로 움직이면 상태가 바뀐다 — 알림이 오면 다시 읽는다(폴링하지 않는다).
  if (window.gijo && window.gijo.onLlmActivity) {
    try {
      var teamTimer = null;
      window.gijo.onLlmActivity(function () { clearTimeout(teamTimer); teamTimer = setTimeout(loadTeam, 600); });
    } catch (e) {}
  }

  // ── 브리핑 ────────────────────────────────────────────────────────────
  // 두 번 부른다: brief=0으로 즉답을 먼저 그리고(목록·버튼이 바로 산다), 이어서 brief=1로
  // 로컬 LLM 문장을 받아 갈아 끼운다. LLM이 느리거나 없어도 화면은 이미 쓸 수 있는 상태다.
  var todayCache = null;

  function renderBrief(d, withText) {
    todayCache = d;
    var tx = $("briefTx"), box = $("brief");
    box.classList.remove("dim");
    if (withText && d && d.brief) {
      tx.textContent = d.brief;
      $("briefBy").textContent = d.briefBy === "llm" ? "AI가 작성" : "규칙 요약";
    } else if (!withText) {
      var n = (d && d.counts) ? d.counts.now : 0;
      var t = (d && d.counts) ? d.counts.today : 0;
      tx.textContent = (n + t) === 0
        ? "지금 급한 일은 없습니다. 새로 들어온 취약점도, 기한이 지난 점검도 없습니다."
        : "지금 봐야 할 것 " + n + "건, 오늘 안에 볼 것 " + t + "건입니다. 문장 요약을 만드는 중…";
      $("briefBy").textContent = "";
    }
    if (d && d.generatedAt) {
      var dt = new Date(d.generatedAt);
      $("briefWho").textContent = "AI 팀 브리핑 · " +
        String(dt.getHours()).padStart(2, "0") + ":" + String(dt.getMinutes()).padStart(2, "0") + " 기준";
    }
    renderActs(d);
  }

  // 브리핑 아래 버튼 — 데이터에서 나온 것만 만든다. 할 게 없으면 '다시 만들기'만 남는다.
  function renderActs(d) {
    var wrap = $("briefActs");
    wrap.innerHTML = "";
    var items = (d && d.items) || [];
    function add(label, cls, fn) {
      var b = document.createElement("button");
      b.className = "act" + (cls ? " " + cls : "");
      b.textContent = label;
      b.addEventListener("click", fn);
      wrap.appendChild(b);
      return b;
    }
    var top = null;
    for (var i = 0; i < items.length; i++) { if (items[i].urgency === "now") { top = items[i]; break; } }
    if (!top) top = items[0] || null;
    if (top) add("🔧 이것부터 — " + (top.subtitle || top.title), "", function () { go(screenOf(top.id)); });
    var later = items.length - (top ? 1 : 0);
    if (later > 0) add("나머지 " + later + "건 보기", "ghost", function () { go("approvals.html"); });
    add("브리핑 다시 만들기", "ghost", function (e) {
      e.currentTarget.disabled = true;
      $("briefTx").textContent = "다시 만드는 중…";
      loadToday(true);
    });
  }

  async function loadToday(force) {
    if (!window.gijo || !window.gijo.getToday) return;
    try {
      if (!force) {
        renderBrief(await window.gijo.getToday(false), false);   // 즉답 — 목록·버튼이 먼저 산다
        renderUrgent(todayCache);
      }
      renderBrief(await window.gijo.getToday(true), true);       // 문장 — 로컬 LLM
      renderUrgent(todayCache);
    } catch (e) {
      $("brief").classList.add("dim");
      $("briefTx").textContent = "오늘 상황을 불러오지 못했습니다 — 서버 연결을 확인하세요.";
      $("briefActs").innerHTML = "";
      $("urgentList").innerHTML = '<div class="empty">불러오지 못했습니다.</div>';
    }
  }

  // ── 급한 것 ──────────────────────────────────────────────────────────
  function renderUrgent(d) {
    var box = $("urgentList"), items = (d && d.items) || [];
    $("urgentCnt").textContent = items.length ? String(items.length) : "";
    if (!items.length) {
      box.innerHTML = '<div class="empty">급한 항목이 없습니다.<br>취약점 스캔 결과나 점검 일정이 들어오면 여기 쌓입니다.</div>';
      return;
    }
    box.innerHTML = items.slice(0, 8).map(function (i) {
      var dot = i.urgency === "now" ? "red" : (i.axis === "device" ? "amber" : "blue");
      var tag = (i.badges && i.badges[0]) || (i.urgency === "now" ? "지금" : "오늘");
      return '<div class="li go" data-page="' + esc(screenOf(i.id)) + '" title="' + esc(i.why || "") + '">' +
        '<span class="b ' + dot + '"></span>' +
        '<span class="tx">' + esc(i.subtitle || i.title) + " — " + esc(i.title) + "</span>" +
        '<span class="m">' + esc(tag) + "</span></div>";
    }).join("");
  }
  $("urgentList").addEventListener("click", function (e) {
    var row = e.target.closest(".li.go");
    if (row) go(row.dataset.page);
  });

  // ── 오늘 할 일 ───────────────────────────────────────────────────────
  var P_ORDER = { P0: 0, P1: 1, P2: 2, P3: 3 };
  function rank(p) { return P_ORDER[p] != null ? P_ORDER[p] : 9; }
  // 세 카드는 나란히 서야 읽힌다. 할 일이 쌓이면(운영 DB에 1,689건이 있었다) 이 카드만
  // 세로로 늘어나 옆 카드가 허공에 뜬다 — 기본은 급한 순 7건만 보이고 나머지는 펼쳐서 본다.
  var TASK_HEAD = 7, taskAll = false;
  async function loadTasks() {
    var box = $("taskList");
    if (!window.gijo || !window.gijo.listTasks) return;
    try {
      var all = (await window.gijo.listTasks()) || [];
      var open = all.filter(function (t) { return !t.done; }).sort(function (a, b) {
        return rank(a.priority) - rank(b.priority) || (a.dueAt || Infinity) - (b.dueAt || Infinity);
      });
      var done = all.filter(function (t) { return t.done; }).sort(function (a, b) { return b.createdAt - a.createdAt; });
      // 배지는 "남은 건수" — 완료가 1,677건이라는 사실은 오늘 할 일을 고르는 데 도움이 안 된다.
      $("taskCnt").textContent = open.length ? "남은 " + open.length + "건" : (all.length ? "다 했습니다" : "");
      if (!all.length) { box.innerHTML = '<div class="empty">할 일이 없습니다. 아래에 적어 두면 여기 남습니다.</div>'; return; }
      var shown = taskAll ? open : open.slice(0, TASK_HEAD);
      var rest = open.length - shown.length;
      var h = shown.concat(done.slice(0, 3)).map(function (t) {
        return '<div class="li' + (t.done ? " done" : "") + '" data-id="' + esc(t.id) + '">' +
          '<input type="checkbox" class="ck"' + (t.done ? " checked" : "") + ' title="완료 표시">' +
          '<span class="tx" title="' + esc(t.text) + '">' + esc(t.text) + "</span>" +
          '<span class="m">' + esc(t.done ? "완료" : (t.priority || "")) + "</span></div>";
      }).join("");
      if (rest > 0) h += '<div class="more" id="taskMore">남은 ' + rest + "건 더 보기</div>";
      else if (taskAll && open.length > TASK_HEAD) h += '<div class="more" id="taskMore">접기</div>';
      box.innerHTML = h;
      var more = $("taskMore");
      if (more) more.addEventListener("click", function () { taskAll = !taskAll; loadTasks(); });
    } catch (e) {
      box.innerHTML = '<div class="empty">할 일을 불러오지 못했습니다.</div>';
    }
  }
  $("taskList").addEventListener("change", async function (e) {
    if (!e.target.classList.contains("ck")) return;
    var row = e.target.closest(".li");
    try { await window.gijo.toggleTask(row.dataset.id, e.target.checked); } catch (err) {}
    loadTasks();
  });
  // 적어 넣기는 **대화창**으로 보낸다(2026-08-01, 내 업무 메뉴 폐지). 거기서 담고·끝내고·
  // 순서까지 안내받는다 — "메뉴는 보기 용도, 입력·설정은 대화창에서"라는 원칙 그대로다.
  // ⚠ 화면 이동이 아니라 **명령창에 문장을 얹어 둔다** — 담당자가 무슨 말을 해야 하는지
  //   모른 채 빈 칸을 마주하면 그 자리에서 멈춘다(2026-07-31 실측).
  $("taskOpen").addEventListener("click", function () {
    // ⚠ window.gijoConsole은 **셸(app.html)에 있고 이 화면은 iframe 안**이라 여기서는 없다
    //   (2026-08-01 실앱에서 확인 — 그냥 뒀으면 눌러도 아무 일이 없는 버튼이 됐다).
    //   같은 화면의 검증된 통로(gijo.askConsole → 없으면 postMessage)를 그대로 쓴다.
    window.parent.postMessage({ type: "gijo:prefill", text: "할 일 추가: " }, "*");
  });

  // ── 한눈에 ───────────────────────────────────────────────────────────
  // 서버 KPI에 실제로 있는 값만 쓴다. 없는 항목은 줄 자체를 안 만든다(빈칸에 0을 채우지 않는다).
  var BAND = { good: "양호", fair: "보통", poor: "미흡" };
  var BAND_COLOR = { good: "var(--teal)", fair: "var(--amber)", poor: "#f5928a" };
  async function loadKpi() {
    var box = $("kpiBox");
    if (!window.gijo || !window.gijo.getSecurityKpi) return;
    try {
      var k = ((await window.gijo.getSecurityKpi()) || {}).current || {};
      var h = "";
      if (k.posture) {
        h += '<div style="padding:4px 0 8px"><span class="big" style="color:' + (BAND_COLOR[k.posture.band] || "var(--muted)") + '">' +
          Math.round(k.posture.score) + '</span> <span style="font-size:12.25px;color:var(--muted)">/100 보안 태세 · ' +
          (BAND[k.posture.band] || "-") + "</span></div>";
      }
      function kv(label, val, color) {
        if (val == null) return;
        h += '<div class="kv"><span>' + label + '</span><b' + (color ? ' style="color:' + color + '"' : "") + ">" + val + "</b></div>";
      }
      if (k.vulnerabilities) {
        kv("미조치 취약점", k.vulnerabilities.active.toLocaleString(), "#f5928a");
        if (k.vulnerabilities.kev) kv("실제 악용(KEV)", k.vulnerabilities.kev, "#f5928a");
      }
      if (k.remediation && k.remediation.overdue) kv("기한 지난 조치", k.remediation.overdue, "var(--amber)");
      if (k.findings) kv("승인 대기", k.findings.pending);
      if (k.assets) kv("자산", k.assets.total);
      // coverageRate는 서버에서 이미 0~100 퍼센트로 계산해 온다(engine/kpi.ts의 compRate).
      // 여기서 100을 또 곱해 1400%가 찍힌 적이 있다 — 소수 비율로 넘겨받는다고 넘겨짚었다.
      if (k.compliance) kv("컴플라이언스", Math.round(k.compliance.coverageRate) + "%");
      box.innerHTML = h || '<div class="empty">아직 집계할 데이터가 없습니다.</div>';
      box.style.cursor = "pointer";
      box.title = "보안 KPI 화면으로";
    } catch (e) {
      box.innerHTML = '<div class="empty">지표를 불러오지 못했습니다.</div>';
    }
  }
  $("kpiBox").addEventListener("click", function () { go("kpi.html"); });

  // ⓘ — 화면 설명은 셸 콘솔이 답한다(프로젝트 원칙: 화면엔 정체성 한 줄만)
  $("askInfo").addEventListener("click", function () {
    if (window.gijoExplain) window.gijoExplain("대시보드");
  });

  // 자산이 바뀌면(스캔 인입 등) 브리핑·지표가 낡는다 — 알림이 오면 다시 읽는다.
  if (window.gijo && window.gijo.onAssetUpdated) {
    try { window.gijo.onAssetUpdated(function () { loadToday(false); loadKpi(); }); } catch (e) {}
  }

  // ── 시작 가이드 카드 ──────────────────────────────────────────────────
  // 4대 시나리오(GIJO_AS_시연_패키지.md)를 담당자가 **직접 눌러 따라 해 보는** 자리.
  // 문구는 그 문서의 실측된 지시문 그대로다 — 카드가 가르치는 말이 실제로 통하는 말이어야 한다.
  //
  // 왜 오버레이가 아니라 카드인가(2026-07-30 사용자 결정): 예전 온보딩은 오버레이라 평소엔
  // 안 보였고, 그래서 "있는 줄 모르는 기능"이 됐다. 첫 화면에 두되 다 해 보면 접는다.
  // 콘솔은 셸(app.html)에 있고 이 화면은 iframe 안이라 직접 못 부른다 — postMessage로 부탁한다.
  var GUIDE_KEY = "gijo:guide:done";      // 끝낸 단계 id 배열
  var GUIDE_FOLD = "gijo:guide:folded";   // 담당자가 손으로 접었나
  var SCENARIOS = [
    { id: "s1", t: "오늘 뭐부터 할지 정하기", d: "쌓인 스캐너 결과에서 급한 것 고르기", steps: [
      { k: "ask", t: "콘솔에 물어보기", q: "오늘 뭐부터 볼까?" },
      { k: "ask", t: "콘솔에 물어보기", q: "미조치 취약점 알려줘" },
      { k: "go", t: "조치·승인 화면 — 결재판 확인", page: "approvals.html" },
      { k: "ask", t: "콘솔에 물어보기", q: "이번 주 예정된 점검 있어?" },
    ]},
    { id: "s2", t: "담당자 인수인계 남기기", d: "퇴사·이동 전에 노하우를 시스템에", steps: [
      { k: "go", t: "인수인계 화면 — 4단계 마법사", page: "handover.html" },
      { k: "go", t: "기억·학습 — 사내 문서 올리기", page: "memory.html" },
      { k: "ask", t: "후임자처럼 물어보기", q: "ASA 106023 로그가 한 IP에서 계속 올라오는데 무슨 의미야?" },
    ]},
    { id: "s3", t: "이거 해도 되는지 확인하기", d: "사내 규정·법령에 맞는지 대조", steps: [
      { k: "ask", t: "규정 찾기", q: "접속기록 보관 기간 규정 알려줘" },
      { k: "ask", t: "행동 대조 — 해도 되는지 묻기", q: "개인정보 시스템 접속기록 보관 주기를 6개월로 줄여도 돼?" },
      { k: "go", t: "컴플라이언스 — 대응 현황", page: "compliance.html" },
    ]},
    { id: "s4", t: "보고서 만들기", d: "주간 현황을 격식 문서로", steps: [
      { k: "ask", t: "말로 현황 받기", q: "오늘 브리핑 해줘" },
      { k: "ask", t: "문서로 만들기", q: "내부 검토용 주간 리포트 작성해줘" },
      { k: "go", t: "보안 KPI — 임원 보고용 화면", page: "kpi.html" },
    ]},
  ];
  var guideDone = readGuideDone();
  var guideOpenSc = {};

  function readGuideDone() {
    try { var v = JSON.parse(localStorage.getItem(GUIDE_KEY) || "[]"); return Array.isArray(v) ? v : []; }
    catch (e) { return []; }
  }
  function saveGuideDone() { try { localStorage.setItem(GUIDE_KEY, JSON.stringify(guideDone)); } catch (e) {} }
  function stepKey(sc, i) { return sc.id + ":" + i; }
  function stepDone(sc, i) { return guideDone.indexOf(stepKey(sc, i)) >= 0; }
  function scDoneCount(sc) { var n = 0; for (var i = 0; i < sc.steps.length; i++) if (stepDone(sc, i)) n++; return n; }
  function scDone(sc) { return scDoneCount(sc) === sc.steps.length; }
  function guideDoneCount() { var n = 0; SCENARIOS.forEach(function (s) { if (scDone(s)) n++; }); return n; }

  function guideStep(si, i) {
    var sc = SCENARIOS[si], st = sc.steps[i];
    if (!stepDone(sc, i)) { guideDone.push(stepKey(sc, i)); saveGuideDone(); }
    renderGuide();
    // 지시는 대화창으로, 화면 열기는 셸로. 둘은 주인이 다르다.
    // ⚠ 옛 길(`gijo:ask` postMessage)은 셸에게 보냈는데, 대화창을 창으로 빼 두면 셸의
    //   대화창은 접혀 있어 **눌러도 아무 일이 없어 보였다**(2026-08-01 검토). askConsole은
    //   도킹이든 분리창이든 지금 보이는 쪽으로 간다.
    try {
      if (st.k === "ask") {
        if (window.gijo && window.gijo.askConsole) window.gijo.askConsole(st.q);
        else window.parent.postMessage({ type: "gijo:ask", text: st.q }, "*"); // 구버전 대비
      } else {
        window.parent.postMessage({ type: "gijo:openTab", page: st.page }, "*");
      }
    } catch (e) {}
  }
  function toggleSc(id) { guideOpenSc[id] = !guideOpenSc[id]; renderGuide(); }
  function toggleGuide() {
    var el = document.getElementById("guideCard");
    var open = !el.classList.contains("open");
    el.classList.toggle("open", open);
    try { localStorage.setItem(GUIDE_FOLD, open ? "0" : "1"); } catch (e) {}
  }
  function resetGuide() {
    guideDone = []; saveGuideDone(); guideOpenSc = {};
    try { localStorage.setItem(GUIDE_FOLD, "0"); } catch (e) {}
    document.getElementById("guideCard").classList.add("open");
    renderGuide();
  }
  window.gijoGuide = { step: guideStep, toggleSc: toggleSc, toggle: toggleGuide, reset: resetGuide };

  function renderGuide() {
    var el = document.getElementById("guideCard");
    if (!el) return;
    el.style.display = "";
    var doneN = guideDoneCount();
    // 숫자는 **시나리오** 단위(0/4), 막대는 **단계** 단위로 채운다. 막대까지 시나리오 단위로 하면
    // 4단계 중 3개를 한 사람에게도 0%가 보여 "아무것도 안 한 것"처럼 느껴진다 — 진행 표시는
    // 실제로 한 만큼 보여야 믿을 수 있다.
    var stepTotal = 0, stepDoneN = 0;
    SCENARIOS.forEach(function (sc) { stepTotal += sc.steps.length; stepDoneN += scDoneCount(sc); });
    var head =
      '<div class="g-head" onclick="gijoGuide.toggle()"><span class="car">▶</span>' +
      "<h3>이렇게 쓰면 됩니다</h3><span class='gsub'>— 4가지 상황으로 익히기</span>" +
      '<span class="g-prog"><span class="g-bar"><i style="width:' + (stepTotal ? stepDoneN / stepTotal * 100 : 0) + '%"></i></span>' +
      '<span class="g-cnt">' + doneN + "/4</span></span></div>";

    if (doneN === 4) {
      // 다 해 봤으면 한 줄로 — 매일 쓰는 사람의 첫 화면을 잡아먹지 않는다.
      el.classList.remove("open");
      el.innerHTML = head +
        '<div class="g-done">✓ 4가지 모두 해봤습니다 — 이제 콘솔에 바로 지시하세요' +
        '<button onclick="gijoGuide.reset()">다시 보기</button></div>';
      return;
    }
    var body = SCENARIOS.map(function (sc, si) {
      var d = scDone(sc);
      var steps = sc.steps.map(function (st, i) {
        var sd = stepDone(sc, i);
        var label = st.k === "ask"
          ? esc(st.t) + ' <span class="gst-q">"' + esc(st.q) + '"</span>'
          : esc(st.t);
        return '<div class="gst' + (sd ? " done" : "") + '"><span class="gst-c">✓</span>' +
          '<span class="gst-t">' + label + "</span>" +
          '<button class="gst-go" onclick="gijoGuide.step(' + si + "," + i + ')">' +
          (sd ? "다시" : st.k === "ask" ? "물어보기" : "열기") + "</button></div>";
      }).join("");
      return '<div class="sc' + (d ? " done" : "") + (guideOpenSc[sc.id] ? " open" : "") + '">' +
        "<div class='sc-head' onclick=\"gijoGuide.toggleSc('" + sc.id + "')\">" +
        '<span class="sc-n">' + (d ? "✓" : si + 1) + "</span>" +
        "<span><span class='sc-t'>" + esc(sc.t) + "</span><br><span class='sc-d'>" + esc(sc.d) + "</span></span>" +
        '<span class="sc-r">' + scDoneCount(sc) + "/" + sc.steps.length + "</span></div>" +
        "<div class='sc-steps'>" + steps + "</div></div>";
    }).join("");
    el.innerHTML = head + '<div class="g-body">' + body + "</div>" +
      '<div class="g-foot"><span>각 단계를 누르면 실제로 실행됩니다 — 읽기만 하는 안내가 아닙니다.</span>' +
      '<button onclick="gijoGuide.reset()">진행 초기화</button></div>';
  }

  // 첫 표시 여부 — 담당자가 손으로 접었으면 그 선택을 존중한다.
  // 예전 온보딩을 이미 다 끝낸 사람은 제품을 아는 사람이므로 접힌 채로 시작한다.
  (function initGuide() {
    var folded = false;
    try {
      folded = localStorage.getItem(GUIDE_FOLD) === "1";
      if (localStorage.getItem(GUIDE_FOLD) === null) {
        var old = JSON.parse(localStorage.getItem("gijo:onboarding:checked") || "[]");
        if (Array.isArray(old) && old.length >= 10) folded = true; // 옛 온보딩을 거의 다 끝낸 사람
      }
    } catch (e) {}
    if (!folded) document.getElementById("guideCard").classList.add("open");
    renderGuide();
  })();

  loadHello();
  loadEngines();
  loadTeam();
  loadToday(false);
  loadTasks();
  loadKpi();
})();
</script>
<script src="nav.js"></script>
<script src="titlebar.js"></script>
<script src="progresscard.js"></script>
<script src="gijomd.js"></script>
<script src="chatparts.js"></script>
<script src="chatwidget.js"></script>
</body>
