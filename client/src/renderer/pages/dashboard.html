<script src="session-explorer.js"></script>
<script>
  const clockEl = document.getElementById("clockEl");
  const statusPill = document.getElementById("statusPill");
  const avatarBtn = document.getElementById("avatarBtn");
  const explorerTree = document.getElementById("explorerTree");
  const todayItems = document.getElementById("todayItems");
  const consoleCaption = document.getElementById("consoleCaption");
  const teamGrid = document.getElementById("teamGrid");
  const dockWho = document.getElementById("dockWho");
  const chatInput = document.getElementById("chatInput");
  const AGENT_ICON = { orchestrator: "🧭", scan: "⊘", analysis: "◎", report: "▣", ti: "🛰", normaltic: "📚" };
  const STATUS_META = {
    working: { cls: "working", badge: "작업 중", bcls: "tc-work" },
    watching: { cls: "watching", badge: "감시 중", bcls: "tc-watch" },
    idle: { cls: "", badge: "대기", bcls: "tc-idle" },
  };
  let agentsById = {};
  // 협업 피드·대화 독에서 에이전트 id 대신 표시 이름을 쓴다(팀 커스텀 이름 반영, 로딩 전엔 기본값).
  const agentLabel = (id) => (agentsById[id] && agentsById[id].name) || id;
  const orchLabel = () => (agentsById.orchestrator && agentsById.orchestrator.name) || "Security Orchestrator";
  let currentTarget = "orchestrator";
  // 탐색기에서 연 작업 세션 — 실시간 활동에서 이어서 지시하면 이 세션에 기록·태깅된다(별도 화면 이동 없음).
  let dashCurrentSession = null;
  const todoInput = document.getElementById("todoInput");

  let displayName = "";

  function tick() {
    const now = new Date();
    clockEl.textContent = now.toLocaleString("ko-KR", {
      hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: true,
      year: "numeric", month: "2-digit", day: "2-digit",
    });
  }

  // 업데이트 알림 — 시계 옆 칩. 새 버전이 있으면 표시, 누르면 업데이트 화면으로.
  async function checkUpdateChip() {
    const chip = document.getElementById("updateChip");
    if (!chip || !window.gijo.update || !window.gijo.update.checkForUpdate) return;
    try {
      const r = await window.gijo.update.checkForUpdate();
      if (r && r.updateAvailable) {
        const ver = r.latest && r.latest.version ? r.latest.version : "";
        document.getElementById("updateChipVer").textContent = ver ? "v" + ver : "";
        chip.style.display = "inline-flex";
        chip.addEventListener("click", () => window.gijo.navigateTo("update.html"), { once: true });
      }
    } catch (e) {}
  }

  // ① 남은 세션 시간 칩 — 실사용 감지 keepalive의 마지막 활동 기준 잔여(유휴 만료까지).
  // 클릭하면 선택지 2개(2026-07-25 사용자 결정): 세션 연장(30분) / 관제(계속·만료 없음).
  // 관제 모드는 5분마다 자동 연장해 대형 모니터 상시 표시용 — 보안상 앱 재시작 시 해제(영속 안 함).
  let sessionMonitorMode = false;
  let sessionMonitorTimer = null;
  function renderSessionChip() {
    const chip = document.getElementById("sessionChip");
    if (!chip) return;
    if (!window.gijo.sessionActivity || !window.gijo.isAuthenticated || !window.gijo.isAuthenticated()) {
      chip.style.display = "none"; return;
    }
    const timeEl = document.getElementById("sessionChipTime");
    if (sessionMonitorMode) {
      timeEl.textContent = "관제(계속)";
      chip.style.background = "rgba(139,124,240,.16)";
      chip.style.borderColor = "rgba(139,124,240,.5)";
      chip.style.color = "var(--purple)";
      chip.style.display = "inline-flex";
      return;
    }
    let info; try { info = window.gijo.sessionActivity(); } catch (e) { return; }
    const ms = Math.max(0, info.remainingMs);
    const m = Math.floor(ms / 60000), s = Math.floor((ms % 60000) / 1000);
    timeEl.textContent = m + ":" + String(s).padStart(2, "0");
    // 색: 5분↑ teal · 2~5분 amber · 2분↓ red
    const rgb = ms > 5 * 60000 ? "30,185,128" : ms > 2 * 60000 ? "240,160,32" : "226,72,61";
    const col = ms > 5 * 60000 ? "var(--teal)" : ms > 2 * 60000 ? "var(--amber)" : "var(--red)";
    chip.style.background = "rgba(" + rgb + ",.14)";
    chip.style.borderColor = "rgba(" + rgb + ",.4)";
    chip.style.color = col;
    chip.style.display = "inline-flex";
  }
  function setMonitorMode(on) {
    sessionMonitorMode = on;
    if (sessionMonitorTimer) { clearInterval(sessionMonitorTimer); sessionMonitorTimer = null; }
    if (on) {
      window.gijo.extendSession().catch(() => {});
      sessionMonitorTimer = setInterval(() => { window.gijo.extendSession().catch(() => {}); }, 5 * 60 * 1000);
    }
    renderSessionChip();
  }
  (function initSessionChip() {
    const chip = document.getElementById("sessionChip");
    if (chip) {
      let pop = null;
      const closePop = () => { if (pop) { pop.remove(); pop = null; } };
      document.addEventListener("click", (e) => { if (pop && !pop.contains(e.target) && !chip.contains(e.target)) closePop(); });
      chip.addEventListener("click", () => {
        if (pop) { closePop(); return; }
        pop = document.createElement("div");
        pop.style.cssText = "position:absolute;top:26px;left:0;min-width:172px;background:#151d33;border:1px solid var(--border-strong);border-radius:10px;box-shadow:0 14px 40px rgba(0,0,0,.5);padding:6px;z-index:960;";
        const mk = (label, sub, fn) => {
          const d = document.createElement("div");
          d.style.cssText = "padding:8px 10px;border-radius:7px;font-size:12px;color:var(--text);cursor:pointer;font-weight:700;";
          d.innerHTML = label + (sub ? '<div style="font-size:10px;color:var(--muted-2);font-weight:500;margin-top:2px">' + sub + "</div>" : "");
          d.addEventListener("mouseenter", () => (d.style.background = "rgba(59,130,246,.12)"));
          d.addEventListener("mouseleave", () => (d.style.background = ""));
          d.addEventListener("click", (e) => { e.stopPropagation(); fn(); closePop(); });
          return d;
        };
        pop.appendChild(mk("⏳ 세션 연장(30분)", "지금부터 30분으로 재설정", async () => {
          const timeEl = document.getElementById("sessionChipTime");
          try { await window.gijo.extendSession(); timeEl.textContent = "연장됨 ✓"; setTimeout(renderSessionChip, 1200); }
          catch (e) { timeEl.textContent = "연장 실패"; setTimeout(renderSessionChip, 1500); }
        }));
        if (sessionMonitorMode) {
          pop.appendChild(mk("⏹ 관제 종료", "일반 세션(30분 유휴 만료)으로 복귀", () => setMonitorMode(false)));
        } else {
          pop.appendChild(mk("🖥 관제(계속)", "만료 없이 유지 — 관제 모니터용, 앱 종료까지", () => setMonitorMode(true)));
        }
        chip.appendChild(pop);
      });
    }
    renderSessionChip();
    setInterval(renderSessionChip, 1000);
  })();

  const PRIORITY_ORDER = { P0: 0, P1: 1, P2: 2, P3: 3 };
  const PRIORITY_CLASS = { P0: "p0", P1: "p1", P2: "p1", P3: "p1" };

  async function loadHealth() {
    try {
      await window.gijo.checkServerHealth();
      statusPill.innerHTML = '<span class="dot"></span>서버 연결상태 양호';
    } catch (e) {
      statusPill.innerHTML = '<span class="dot" style="background:#e2483d"></span>서버 연결상태 불량';
      statusPill.style.background = "rgba(226,72,61,0.15)";
      statusPill.style.borderColor = "rgba(226,72,61,0.4)";
      statusPill.style.color = "#f5928a";
    }
  }

  // 모델 준비 여부 확인 → 안내 배너 노출/숨김. 로드된 모델이 하나라도 ready면 숨긴다.
  const modelGuide = () => document.getElementById("modelGuide");
  async function checkModelReady() {
    try {
      const s = await window.gijo.getLocalEngineStatus();
      const ready = s && Array.isArray(s.loaded) ? s.loaded.some((m) => m.ready) : !!(s && s.running && s.modelId);
      modelGuide().style.display = ready ? "none" : "block";
    } catch (e) { /* 상태 조회 실패 시 안내를 강제로 띄우지 않는다 */ }
  }

  async function loadUser() {
    try {
      const user = await window.gijo.me();
      displayName = user.displayName || user.username || "사용자";
      avatarBtn.textContent = displayName.charAt(0);
    } catch (e) {
      displayName = "";
    }
  }

  const openDirs = new Set();

  async function renderDir(relPath, depth, container) {
    let data;
    try { data = await window.gijo.listDir(relPath); } catch (e) { return; }
    for (const item of data.items) {
      const itemPath = (relPath ? relPath + "/" : "") + item.name;
      const canIngest = !item.dir && /\.(pdf|hwpx|hwp|txt|md|csv|json|log)$/i.test(item.name);
      const row = document.createElement("div");
      row.style.cssText = `padding:2px 0 2px ${depth * 12 + 4}px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;${item.dir || canIngest ? "cursor:pointer;" : "color:var(--muted);"}`;
      const caret = item.dir ? (openDirs.has(itemPath) ? "▾ " : "▸ ") : "";
      // 이미 분석(수집)된 문서면 Scan·Analyze Agent가 판별한 분류 배지를 보여준다.
      const docClass = !item.dir ? docClassMap.get(item.name) : undefined;
      const classBadge = docClass ? ` <span class="leaf-b ${DOCCLASS_B[docClass] || "lb-mut"}">${docClass.replace(/</g, "&lt;")}</span>` : "";
      row.innerHTML = `<span style="color:var(--muted-2)">${caret}</span>${item.name.replace(/</g, "&lt;")}${classBadge}`;
      if (canIngest) row.title = "클릭 → Scan·Analyze Agent가 분석·분류해 장기 기억(RAG)에 저장";
      container.appendChild(row);
      if (item.dir) {
        const childBox = document.createElement("div");
        container.appendChild(childBox);
        if (openDirs.has(itemPath)) await renderDir(itemPath, depth + 1, childBox);
        row.addEventListener("click", async (e) => {
          e.stopPropagation();
          if (openDirs.has(itemPath)) { openDirs.delete(itemPath); childBox.innerHTML = ""; row.querySelector("span").textContent = "▸ "; }
          else { openDirs.add(itemPath); await renderDir(itemPath, depth + 1, childBox); row.querySelector("span").textContent = "▾ "; }
        });
      } else if (canIngest) {
        // 담당자가 대시보드 탐색기에서 문서를 클릭하면 바로 장기 기억(RAG)에 올릴 수 있게 한다.
        const actionBox = document.createElement("div");
        container.appendChild(actionBox);
        row.addEventListener("click", (e) => {
          e.stopPropagation();
          if (actionBox.innerHTML) { actionBox.innerHTML = ""; return; }
          actionBox.innerHTML =
            `<div style="padding:2px 0 6px ${depth * 12 + 20}px;">` +
            `<button class="mem-ingest-btn" style="font-size:11px;background:var(--teal);color:#04211d;border:none;border-radius:6px;padding:3px 9px;cursor:pointer;font-weight:800">🧠 분석해 올리기</button> ` +
            `<span class="mem-ingest-status" style="font-size:11px;color:var(--muted)"></span></div>`;
          const btn = actionBox.querySelector(".mem-ingest-btn");
          const st = actionBox.querySelector(".mem-ingest-status");
          btn.addEventListener("click", async (ev) => {
            ev.stopPropagation();
            btn.disabled = true;
            st.textContent = "Scan·Analyze Agent 분석·분류 중...";
            try {
              const f = await window.gijo.readFile(itemPath);
              const r = await window.gijo.ingestMemoryFile(f.name, f.content, "global");
              st.textContent = `✓ ${r.chunks}개 청크 저장 · 분류: ${r.docClass || "기타"}${r.linkedProduct ? ` · 보안제품 '${r.linkedProduct}'에 연결됨` : ""}`;
              st.style.color = "var(--teal)";
              // 파일 행에 분류 배지 즉시 반영(다음 새로고침 전에도 보이게).
              docClassMap.set(f.name, r.docClass || "기타");
              row.insertAdjacentHTML("beforeend", ` <span class="leaf-b ${DOCCLASS_B[r.docClass] || "lb-mut"}">${String(r.docClass || "기타").replace(/</g, "&lt;")}</span>`);
              if (r.linkedProduct) loadSecurityProducts(); // 매뉴얼 자동 연결 → 제품 매뉴얼 배지 갱신
            } catch (err) {
              st.textContent = "✗ " + err.message;
              st.style.color = "#f87171";
              btn.disabled = false;
            }
          });
        });
      }
    }
  }

  // 분석(수집)된 문서의 분류(매뉴얼/보고서/정책/기타) — 파일명 → 분류 매핑. 배지 색도 분류별로.
  let docClassMap = new Map();
  const DOCCLASS_B = { "매뉴얼": "lb-blue", "보고서": "lb-purple", "정책": "lb-teal", "기타": "lb-mut" };

  async function loadFiles() {
    const el = document.getElementById("tree-files");
    if (!el) return;
    el.innerHTML = "";
    openDirs.clear();
    try {
      const docs = await window.gijo.listMemoryDocuments();
      docClassMap = new Map(docs.filter((d) => d.docClass).map((d) => [d.documentId, d.docClass]));
    } catch (e) { /* 분류 배지는 부가 정보 — 목록 로딩 실패해도 파일 트리는 계속 */ }
    try {
      await window.gijo.listDir("");
      await renderDir("", 0, el);
      if (!el.innerHTML) el.innerHTML = `<div class="tree-empty">문서 없음</div>`;
    } catch (e) {
      el.innerHTML = '<div class="tree-empty">파일을 불러오지 못했습니다 (데스크톱 앱 전용)</div>';
    }
  }

  async function pickFolder() {
    try {
      const r = await window.gijo.pickWorkFolder();
      if (r.cancelled) return;
      openDirs.clear(); // 새 루트 → 펼침 상태 초기화
      await loadFileExplorer();
    } catch (e) {
      alert("폴더 선택 실패: " + e.message);
    }
  }

  // ── 통일된 트리 탐색기 ────────────────────────────────────────────────────
  // AI 자산 · 인프라 호스트 · 보안제품 · 문서를 하나의 파일탐색기형 트리로 묶는다.
  // 접기 상태는 렌더 밖(collapsedFolders)에 둬 새로고침 후에도 유지된다.
  const collapsedFolders = new Set();
  const escT = (s) => String(s == null ? "" : s).replace(/</g, "&lt;");

  function folderHtml(key, label, actsHtml) {
    const c = collapsedFolders.has(key);
    return (
      `<div class="tree-folder" data-folder="${key}">` +
      `<span class="tree-caret">${c ? "▸" : "▾"}</span>${label}` +
      `<span class="tree-count" id="cnt-${key}"></span>${actsHtml || ""}</div>` +
      `<div class="tree-children ${c ? "collapsed" : ""}" id="tree-${key}"><div class="tree-empty">불러오는 중…</div></div>`
    );
  }

  function renderExplorer() {
    // 2026-07-17 개편: AI 자산은 AI-BOM/SBOM 하위로 분리(인프라 호스트는 SBOM에 흡수),
    // "보안제품"→"보안제품 관리"(매뉴얼 업로드 연결), "문서"→"문서 · 분석"(에이전트 자동 분류).
    explorerTree.innerHTML =
      folderHtml("ai", "AI 자산") +
      folderHtml("products", "보안제품 관리", `<span class="tree-act" data-open-products title="보안제품 관리 열기">↗</span>`) +
      folderHtml("files", "문서 · 분석", `<span class="tree-act" id="pickFolderBtn" title="작업 폴더 선택">📂</span><span class="tree-act" id="refreshFilesBtn" title="새로고침">⟳</span>`) +
      `<div class="tree-nav" id="openDocMgmt" title="장기기억(RAG)에 올린 문서 확인·관리 화면으로 이동">📚 올린 문서 관리<span class="tree-act" style="margin-left:auto">↗</span></div>`;
    explorerTree.querySelectorAll(".tree-folder").forEach((hd) => {
      hd.addEventListener("click", (e) => {
        if (e.target.closest(".tree-act")) return; // 액션 아이콘 클릭은 접기와 분리
        const key = hd.dataset.folder;
        const body = document.getElementById("tree-" + key);
        const open = collapsedFolders.has(key);
        if (open) collapsedFolders.delete(key); else collapsedFolders.add(key);
        body.classList.toggle("collapsed", !open);
        hd.querySelector(".tree-caret").textContent = open ? "▾" : "▸";
      });
    });
    explorerTree.querySelectorAll("[data-open-products]").forEach((x) => x.addEventListener("click", () => window.gijo.navigateTo("products.html")));
    document.getElementById("pickFolderBtn").addEventListener("click", pickFolder);
    document.getElementById("refreshFilesBtn").addEventListener("click", loadFiles);
    document.getElementById("openDocMgmt").addEventListener("click", () => window.gijo.navigateTo("memory.html"));
  }

  const setCount = (key, n) => { const el = document.getElementById("cnt-" + key); if (el) el.textContent = n; };

  // Scan Agent가 등록·관리하는 자산 목록 — AI-BOM(AI 모델)/SBOM(인프라 호스트)으로 나눠 표시하고,
  // 리프 클릭 시 상세 팝오버(설명·최근 취약점 상태)를 띄운다.
  let assetById = {};
  const SEV_RANK = { critical: 3, high: 3, medium: 2, low: 1 };
  function assetLeafHtml(a, showPath) {
    const n = (a.findings || []).length;
    const worst = (a.findings || []).reduce((w, f) => Math.max(w, SEV_RANK[f.severity] || 1), 0);
    const badge = n
      ? `<span class="leaf-b ${worst >= 3 ? "lb-red" : "lb-amber"}">취약점 ${n}</span>`
      : `<span class="leaf-b lb-teal">정상</span>`;
    const sub = showPath && a.path && a.path !== a.name ? ` <span class="sub">${escT(a.path)}</span>` : "";
    return `<div class="tree-leaf click row" data-asset="${escT(a.id)}" title="클릭 → 자산 상세(설명·최근 취약점)">${escT(a.name)}${sub}${badge}</div>`;
  }

  async function loadAssets() {
    try {
      const assets = await window.gijo.listAssets();
      assetById = {};
      assets.forEach((a) => { assetById[a.id] = a; });
      const hosts = assets.filter((a) => a.assetType === "infra-host");
      const ai = assets.filter((a) => a.assetType !== "infra-host");
      setCount("ai", assets.length);
      const box = document.getElementById("tree-ai");
      if (!box) return;
      const sec = (label, list, showPath) =>
        `<div class="tree-sub">${label} <span class="cnt">${list.length}</span></div>` +
        (list.length ? list.slice(0, 12).map((a) => assetLeafHtml(a, showPath)).join("") : `<div class="tree-empty">없음</div>`) +
        (list.length > 12 ? `<div class="tree-empty">…외 ${list.length - 12}건</div>` : "");
      box.innerHTML = sec("◆ AI-BOM", ai, false) + sec("▤ SBOM", hosts, true);
      box.querySelectorAll("[data-asset]").forEach((el) =>
        el.addEventListener("click", (e) => { e.stopPropagation(); openAssetPop(el.dataset.asset, el); })
      );
    } catch (e) {
      const b = document.getElementById("tree-ai");
      if (b) b.innerHTML = `<div class="tree-empty">자산을 불러오지 못했습니다</div>`;
    }
  }

  // ── 자산 상세 팝오버(시안2 확정) — 설명·최근 취약점·바로가기. 바깥 클릭/ESC로 닫힘 ──
  const assetPop = document.getElementById("assetPop");
  const AP_SEV_CLS = { critical: "lb-red", high: "lb-red", medium: "lb-amber", low: "lb-mut" };
  function openAssetPop(assetId, anchorEl) {
    const a = assetById[assetId];
    if (!a) return;
    const n = (a.findings || []).length;
    const urgent = (a.findings || []).filter((f) => f.severity === "critical" || f.severity === "high").length;
    const scanned = a.lastScannedAt ? new Date(a.lastScannedAt).toLocaleString("ko-KR", { hour12: false }) : "스캔 전";
    const vulns = (a.findings || []).slice(0, 3).map((f) =>
      `<div class="ap-vuln"><span class="ap-sev ${AP_SEV_CLS[f.severity] || "lb-mut"}">${escT(String(f.severity || "?").toUpperCase())}</span><span>${escT(f.finding_type || "")}${f.evidence ? " — " + escT(String(f.evidence).slice(0, 64)) : ""}</span></div>`
    ).join("");
    assetPop.innerHTML =
      `<span class="ap-close" id="apClose">✕</span>` +
      `<div class="ap-t">${escT(a.name)}${n ? `<span class="leaf-b lb-amber" style="margin-left:auto">취약점 ${n}</span>` : `<span class="leaf-b lb-teal" style="margin-left:auto">정상</span>`}</div>` +
      `<div class="ap-kv"><b>자산 ID</b> ${escT(a.id)}</div>` +
      `<div class="ap-kv"><b>유형</b> ${escT(a.assetType || "-")}</div>` +
      (a.owner ? `<div class="ap-kv"><b>소유부서</b> ${escT(a.owner)}</div>` : "") +
      (a.service ? `<div class="ap-kv"><b>지원 서비스</b> ${escT(a.service)}</div>` : "") +
      `<div class="ap-kv"><b>마지막 스캔</b> ${escT(scanned)}</div>` +
      `<div class="ap-kv"><b>상태</b> <span style="color:${urgent ? "#f5928a" : "var(--teal)"};font-weight:800">즉시 조치 ${urgent}건</span></div>` +
      (vulns ? `<div class="ap-h">최근 취약점</div>${vulns}` : "") +
      `<div class="ap-links">` +
      `<button data-nav="sbom.html">AI-BOM 보기 ↗</button>` +
      `<button data-nav="vulnscan.html">취약점 관리 ↗</button>` +
      `<button id="apRescan">재스캔 ▶</button>` +
      `</div>`;
    const r = anchorEl.getBoundingClientRect();
    assetPop.style.left = Math.round(r.right + 10) + "px";
    assetPop.style.top = Math.max(60, Math.min(window.innerHeight - 340, Math.round(r.top - 14))) + "px";
    assetPop.classList.add("on");
    document.getElementById("apClose").addEventListener("click", closeAssetPop);
    assetPop.querySelectorAll("[data-nav]").forEach((b) => b.addEventListener("click", () => window.gijo.navigateTo(b.dataset.nav)));
    // 경량 단건 재스캔 — dispatch 파이프라인(요약·부연) 없이 어댑터만 즉시 실행하고 팝오버를 갱신.
    document.getElementById("apRescan").addEventListener("click", async (ev) => {
      const btn = ev.currentTarget;
      btn.disabled = true;
      btn.textContent = "스캔 중…";
      try {
        await window.gijo.scanAsset(a.id);
        await loadAssets();
        const leaf = document.querySelector(`[data-asset="${a.id}"]`);
        if (leaf) openAssetPop(a.id, leaf); // 새 findings로 팝오버 갱신
      } catch (err) {
        btn.disabled = false;
        btn.textContent = "재스캔 실패 — 다시";
      }
    });
  }
  function closeAssetPop() { assetPop.classList.remove("on"); }

  // ＋ 자산 직접 등록 — 탐색기 제목의 ＋에서 연다. 이름·유형·주소로 바로 등록(id 자동 생성).
  function openAssetRegForm() {
    let bg = document.getElementById("assetRegBg");
    if (!bg) {
      bg = document.createElement("div");
      bg.className = "areg-bg"; bg.id = "assetRegBg";
      bg.innerHTML =
        '<div class="areg"><h4>＋ 자산 직접 등록</h4>' +
        '<label>이름</label><input id="argName" placeholder="예: fortigate-vpn-02">' +
        '<label>유형</label><select id="argType"><option value="infra-host">인프라 호스트(장비/서버)</option><option value="LLM 서비스">LLM 서비스</option><option value="분류 모델">분류 모델</option><option value="이상탐지 모델">이상탐지 모델</option><option value="에이전트">에이전트</option><option value="기타">기타</option></select>' +
        '<label>주소 / 경로 <span style="color:var(--muted-2)">(호스트면 IP·호스트명 → 터미널 연결에 사용)</span></label><input id="argPath" placeholder="예: 10.20.0.6 또는 models/x.gguf">' +
        '<label>소유부서 (선택)</label><input id="argOwner" placeholder="예: 정보보안팀">' +
        '<div class="areg-err" id="argErr"></div>' +
        '<div class="areg-acts"><button class="no" id="argCancel">취소</button><button class="ok" id="argSave">등록</button></div></div>';
      document.body.appendChild(bg);
      bg.addEventListener("click", (e) => { if (e.target === bg) bg.classList.remove("on"); });
      document.getElementById("argCancel").addEventListener("click", () => bg.classList.remove("on"));
      document.getElementById("argSave").addEventListener("click", saveAssetReg);
    }
    ["argName", "argPath", "argOwner"].forEach((i) => { const el = document.getElementById(i); if (el) el.value = ""; });
    document.getElementById("argErr").textContent = "";
    bg.classList.add("on");
    setTimeout(() => { const n = document.getElementById("argName"); if (n) n.focus(); }, 30);
  }
  async function saveAssetReg() {
    const name = document.getElementById("argName").value.trim();
    const path = document.getElementById("argPath").value.trim();
    const assetType = document.getElementById("argType").value;
    const owner = document.getElementById("argOwner").value.trim();
    const err = document.getElementById("argErr");
    if (!name) { err.textContent = "이름을 입력하세요."; return; }
    if (!path) { err.textContent = "주소 또는 경로를 입력하세요."; return; }
    const id = (name.toLowerCase().replace(/[^가-힣a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 32) || "asset") + "-" + Math.random().toString(36).slice(2, 6);
    const btn = document.getElementById("argSave"); btn.disabled = true; btn.textContent = "등록 중…";
    try {
      await window.gijo.registerAsset({ id, name, path, assetType, owner: owner || undefined });
      document.getElementById("assetRegBg").classList.remove("on");
      await reloadDashExplorer(); // 실제 탐색기(session-explorer) 새로고침 — 새 자산이 트리에 바로 뜬다
    } catch (e) {
      err.textContent = "등록 실패: " + ((e && e.message) || e);
    } finally { btn.disabled = false; btn.textContent = "등록"; }
  }
  document.addEventListener("click", (e) => {
    if (assetPop.classList.contains("on") && !e.target.closest("#assetPop") && !e.target.closest("[data-asset]")) closeAssetPop();
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeAssetPop(); });

  // ── 스마트 통합 업로드 — 파일만 올리면 서버가 유형을 판별해 자동 라우팅(입력칸 최소화) ──
  // 결과는 협업 피드에 한 줄로: 어떤 파이프라인으로 갔고 왜 그렇게 판별됐는지(reason)까지.
  const smartInput = document.getElementById("smartUploadInput");
  // 파일 올리기 트리거는 통합 탐색기(문서·분석 > 파일 올리기)에서 smartInput.click()로 호출한다.
  const readB64 = (file) => new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(String(fr.result).split(",")[1] || "");
    fr.onerror = () => rej(new Error("파일 읽기 실패"));
    fr.readAsDataURL(file);
  });
  function uploadResultMsg(r) {
    if (r.routedTo === "vulnscan") return `취약점 스캔으로 자동 반영 — 호스트 ${r.vulnscan.hosts}·finding ${r.vulnscan.findings}건 (${r.reason})`;
    if (r.routedTo === "product-manual") return `보안제품 '${r.manual.productName}'에 ${r.manual.kind === "logManual" ? "로그" : "제품"} 매뉴얼로 연결${r.manual.createdProduct ? " · 신규 제품 자동 등록" : ""} (${r.reason})`;
    return `장기기억 ${r.memory.chunks}청크 수집${r.memory.docClass ? ` · 분류 ${r.memory.docClass}` : ""}${r.memory.linkedProduct ? ` · 제품 '${r.memory.linkedProduct}' 연결` : ""} (${r.reason})`;
  }
  // 시안 B — 애매하면 콘솔 인라인 결정 카드(5유형). 확실하면 바로 결과 표시.
  const UPLOAD_TYPES = [
    { t: "vulnreport", label: "🩹 취약점 리포트/로그" },
    { t: "asset", label: "🛡 보안제품 자산" },
    { t: "log", label: "📊 로그 매뉴얼" },
    { t: "document", label: "📄 일반 문서" },
    { t: "guideline", label: "📘 가이드라인" },
  ];
  // 신규 제품으로 등록될 유형(보안제품 자산·로그 매뉴얼)에서만 제품명 입력칸을 쓴다 — 자동 추천값 기본,
  // 파일명이 지저분하거나 추천이 어긋나면 수동입력으로 고쳐 확정할 수 있다.
  const PRODUCT_NAME_TYPES = new Set(["asset", "log"]);
  async function handleUpload(name, b64, cm, forceType, productName) {
    if (cm) cm.textContent = `${name} — ${forceType ? "처리 중…" : "유형 판별·처리 중…"}`;
    const r = await window.gijo.uploadAuto(name, b64, forceType, productName);
    if (r.needsDecision && !forceType) {
      const btns = UPLOAD_TYPES.map((x) => `<button data-t="${x.t}"${x.t === r.guess ? ' class="reco"' : ""}>${x.label}${x.t === r.guess ? " (추천)" : ""}</button>`).join("");
      const pname = r.guessProductName ? `<div class="cl-upd-pname"><input type="text" class="cl-upd-pname-in" value="${escB(r.guessProductName)}" placeholder="제품명(보안제품 자산·로그 매뉴얼 선택 시 사용, 필요시 수정)"></div>` : "";
      cm.innerHTML = `<div class="cl-updecide"><div class="cl-upd-h">🤔 이 파일, 어떻게 처리할까요?</div><div class="cl-upd-f">📄 ${escB(name)} — 파일명만으론 유형을 확신하기 어렵습니다</div>${pname}<div class="cl-upd-btns">${btns}</div></div>`;
      cm.querySelectorAll(".cl-upd-btns button").forEach((b) => b.addEventListener("click", () => {
        const t = b.dataset.t;
        const pnameIn = cm.querySelector(".cl-upd-pname-in");
        const pn = PRODUCT_NAME_TYPES.has(t) && pnameIn ? pnameIn.value.trim() || undefined : undefined;
        handleUpload(name, b64, cm, t, pn).catch((e) => { cm.textContent = `${name} — 실패: ${e.message}`; });
      }));
      return;
    }
    if (cm) cm.textContent = `${name} → ${uploadResultMsg(r)}`;
    await Promise.all([reloadDashExplorer(), loadTodayPriority()]);
  }
  smartInput.addEventListener("change", async () => {
    for (const file of [...smartInput.files]) {
      const row = clAppend("event", { icon: "📥", name: "스마트 업로드", message: `${file.name} — 유형 판별·처리 중…` });
      const cm = row.querySelector(".cm");
      try {
        const b64 = await readB64(file);
        await handleUpload(file.name, b64, cm);
      } catch (e) {
        if (cm) cm.textContent = `${file.name} — 실패: ${e.message}`;
      }
    }
    smartInput.value = "";
  });

  // ── 연동 서버 정보 카드 — 실제 연결 정보만 표시(주소·상태·로드된 로컬 LLM·에이전트 수) ──
  async function loadServerCard() {
    const dot = document.getElementById("scDot");
    const meta = document.getElementById("scMeta");
    try {
      await window.gijo.checkServerHealth();
      dot.classList.remove("off");
      let url = "localhost:4000";
      try { url = String(await window.gijo.getServerUrl()).replace(/^https?:\/\//, "").replace(/\/$/, ""); } catch (e) {}
      let chat = 0, emb = 0;
      try {
        const s = await window.gijo.getLocalEngineStatus();
        chat = s && Array.isArray(s.loaded) ? s.loaded.filter((m) => m.ready).length : (s && s.running ? 1 : 0);
        emb = s && s.embedding && s.embedding.running ? 1 : 0; // 임베딩(bge-m3)도 GPU 상주 모듈로 함께 센다
      } catch (e) {}
      const total = chat + emb;
      const agents = Object.keys(agentsById).length;
      meta.innerHTML = `연동 서버 <b>${escT(url)}</b> · 운영중<br>로컬 모델 <b>${total}</b>개 로드${emb ? ` (채팅 ${chat}·임베딩 ${emb})` : ""}${agents ? ` · 에이전트 <b>${agents}</b>` : ""}`;
    } catch (e) {
      dot.classList.add("off");
      meta.textContent = "서버 연결 끊김 — 설정에서 서버 주소를 확인하세요";
    }
  }

  // 보안제품 — 종류(방화벽/EDR/DLP…)를 접두 아이콘으로 붙여 한 줄씩(평평하게). 클릭 시 보안제품 관리로.
  async function loadSecurityProducts() {
    const box = document.getElementById("tree-products");
    if (!box) return; // 통합 탐색기로 교체됨 — 구 트리 컨테이너가 없으면 no-op
    try {
      const groups = await window.gijo.listSecurityProductsGrouped();
      const total = groups.reduce((s, g) => s + g.products.length, 0);
      setCount("products", total);
      if (!box) return;
      if (!total) box.innerHTML = `<div class="tree-leaf click" data-open-products>등록된 제품 없음 — 클릭해 등록</div>`;
      else box.innerHTML = groups.flatMap((g) => g.products.map((p) => {
        // 제품·로그 매뉴얼 첨부 상태 — 있으면 개수, 없으면 올리기 유도. 클릭하면 보안제품 관리로.
        const docs = (p.docs || []).length;
        const tail = docs
          ? `<span class="leaf-b lb-blue">매뉴얼 ${docs}</span>`
          : `<span class="manual-link">매뉴얼 올리기 +</span>`;
        return `<div class="tree-leaf click row" data-open-products title="${escT(g.label)} · 제품·로그 매뉴얼 업로드는 보안제품 관리에서">${escT(p.name)}${tail}</div>`;
      })).join("");
      box.querySelectorAll("[data-open-products]").forEach((x) => x.addEventListener("click", () => window.gijo.navigateTo("products.html")));
    } catch (e) {
      if (box) box.innerHTML = `<div class="tree-empty">보안제품을 불러오지 못했습니다</div>`;
    }
  }

  // SLA(기한) 배지: 남은 일수(D-N) 또는 초과(D+N). 임박(3일↓)·초과는 색으로 경고.
  function slaBadge(t) {
    if (!t.dueAt || t.done) return "";
    const days = Math.ceil((t.dueAt - Date.now()) / 86400000);
    const label = days < 0 ? `기한초과 D+${-days}` : days === 0 ? "오늘 마감" : `D-${days}`;
    const color = days < 0 ? "#f5928a" : days <= 3 ? "var(--amber)" : "var(--muted-2)";
    return `<span class="today-sla" style="color:${color}" title="조치 기한(SLA)">${label}</span>`;
  }

  function taskRowHtml(t) {
    const cls = PRIORITY_CLASS[t.priority] || "p1";
    const text = String(t.text).replace(/</g, "&lt;");
    const who = t.assignee ? `<span class="today-who" title="담당자">${String(t.assignee).replace(/</g, "&lt;")}</span>` : "";
    return (
      `<div class="today-item ${t.done ? "done" : ""}" data-id="${t.id}">` +
      `<input type="checkbox" class="today-check" ${t.done ? "checked" : ""} title="완료 표시">` +
      `<span class="today-p ${cls}">${t.priority}</span>` +
      `<span class="today-text" title="${text}">${text}</span>` +
      who + slaBadge(t) +
      `<button class="today-del" title="삭제">✕</button>` +
      `</div>`
    );
  }

  // 유지보수 점검 중 오늘 마감이거나 지연된 건 — 클릭하면 운영 가이드(opsguide.html)로 이동해서
  // 점검 결과를 등록한다. 체크박스/삭제는 없다(완료 처리는 opsguide.html의 점검 워크플로우에서).
  function maintDueRowHtml(m) {
    const overdue = m.scheduleDate < new Date().toISOString().slice(0, 10);
    const text = `${String(m.title).replace(/</g, "&lt;")} · ${String(m.productName).replace(/</g, "&lt;")}${overdue ? " (지연)" : ""}`;
    return (
      `<div class="today-item maint-due" data-maint-id="${m.id}" title="점검 예정일 ${m.scheduleDate} — 클릭하면 운영 가이드로 이동">` +
      `<span class="today-p maint">🔧</span>` +
      `<span class="today-text">${text}</span>` +
      `</div>`
    );
  }

  async function loadTasks() {
    if (!todayItems) return; // 오늘 확인할 항목 패널은 작업 세션(sessions.html)으로 이관됨
    try {
      const [tasks, dueMaint] = await Promise.all([window.gijo.listTasks(), window.gijo.listDueMaintenance().catch(() => [])]);
      if (tasks.length === 0 && dueMaint.length === 0) {
        todayItems.innerHTML = '<div style="font-size:12px;color:var(--muted-2);padding:10px 0">오늘 확인할 항목이 없습니다</div>';
        return;
      }
      // 지연/마감 점검(있으면) 맨 위, 그다음 미완료 할 일(우선순위 순), 완료(최근 순)는 아래에 흐리게.
      // 우선순위 → 기한(SLA) 순. 기한 있는 건이 없는 건보다 위로, 임박·초과가 먼저.
      const open = tasks.filter((t) => !t.done).sort((a, b) =>
        (PRIORITY_ORDER[a.priority] ?? 9) - (PRIORITY_ORDER[b.priority] ?? 9) ||
        (a.dueAt ?? Infinity) - (b.dueAt ?? Infinity)
      );
      const done = tasks.filter((t) => t.done).sort((a, b) => b.createdAt - a.createdAt);
      todayItems.innerHTML = [...dueMaint.map(maintDueRowHtml), ...open.map(taskRowHtml), ...done.map(taskRowHtml)].join("");
    } catch (e) {
      todayItems.innerHTML = '<div style="color:var(--muted-2);font-size:12px">작업 목록을 불러오지 못했습니다</div>';
    }
  }

  // 체크박스=완료 토글, ✕=삭제, 점검 항목 클릭=운영 가이드로 이동. todayItems가 재렌더돼도
  // 유지되게 부모에 위임(init에서 1회 바인딩).
  async function onTaskAction(e) {
    if (e.target.closest(".maint-due")) {
      window.gijo.navigateTo("opsguide.html");
      return;
    }
    const item = e.target.closest(".today-item");
    if (!item) return;
    const id = item.dataset.id;
    if (e.target.classList.contains("today-del")) {
      await window.gijo.deleteTask(id);
      await loadTasks();
    } else if (e.target.classList.contains("today-check")) {
      await window.gijo.toggleTask(id, e.target.checked);
      await loadTasks();
    }
  }

  async function addTodo() {
    if (!todoInput) return;
    const text = todoInput.value.trim();
    // 비우고 + 를 누르면 추천 일과 가이드를 연다(매일/매주 — 직접 추가 이력·사내 지식 근거).
    if (!text) { toggleTodoSuggestions(); return; }
    todoInput.value = "";
    // 직접 입력한 일과는 학습 신호(routineFeedback)로 기록 — 파인튜닝 데이터셋에 쌓이고 다음 추천에 반영.
    await window.gijo.addTask(text, { routineFeedback: true });
    await loadTasks();
  }

  // ── 추천 일과 가이드 — + 버튼(빈 입력)으로 열림. 항목의 +로 바로 추가 ──
  const todoSugg = document.getElementById("todoSugg");
  const CAD_LABEL = { daily: "매일 하는 일", weekly: "매주(주말) 하는 일" };
  async function toggleTodoSuggestions() {
    if (!todoSugg) return;
    if (todoSugg.innerHTML) { todoSugg.innerHTML = ""; return; }
    todoSugg.innerHTML = '<div class="ts-load">추천 일과 불러오는 중… (사내 지식 참고)</div>';
    let suggs = [];
    try { suggs = await window.gijo.getRoutineSuggestions(); } catch (e) {
      todoSugg.innerHTML = '<div class="ts-load">추천을 불러오지 못했습니다 — 직접 입력해 주세요</div>';
      return;
    }
    const groups = ["daily", "weekly"].map((cad) => {
      const list = suggs.filter((s) => s.cadence === cad);
      if (!list.length) return "";
      return `<div class="ts-h">${CAD_LABEL[cad]}</div>` + list.map((s) =>
        `<div class="ts-item"><span class="ts-t">${escB(s.text)}</span><span class="ts-src">${escB(s.source)}</span><button class="ts-add" data-sugg="${escB(s.text)}">＋</button></div>`
      ).join("");
    }).join("");
    todoSugg.innerHTML = groups +
      '<div class="ts-foot">✍ 직접 입력해 추가한 일과는 학습(파인튜닝 데이터셋)에 쌓여 다음 추천에 반영됩니다</div>';
    todoSugg.querySelectorAll(".ts-add").forEach((b) => b.addEventListener("click", async () => {
      b.disabled = true; b.textContent = "✓";
      await window.gijo.addTask(b.dataset.sugg); // 추천 채택은 학습 신호 아님(추천의 재학습 방지)
      await loadTasks();
    }));
  }

  // 작업 중이면 중앙 그래프에 busy를 켜 반짝임을 빠르게·많게 한다. 마지막 활동 후 4초 지나면 잦아든다.
  const networkSvg = document.querySelector(".network-svg");
  let busyTimer = null;
  // 발광 색 — 사용량(0~1)이 많을수록 노랑(245,200,40)→빨강(230,60,50)으로 보간.
  function glowRgb(g) {
    const c = Math.max(0, Math.min(1, g));
    const r = Math.round(245 + (230 - 245) * c);
    const gg = Math.round(200 + (60 - 200) * c);
    const b = Math.round(40 + (50 - 40) * c);
    return `${r},${gg},${b}`;
  }
  function applyGlow() {
    if (!networkSvg) return;
    // 추론 중(busy)일 때만 발광 — GPU 사용률 폴링은 제거됨(운영 로그 감시 도중 VRAM 이슈로 단순화 결정).
    const g = networkSvg.classList.contains("busy") ? 0.35 : 0;
    networkSvg.style.setProperty("--gpu", g.toFixed(3));
    networkSvg.style.setProperty("--glow-rgb", glowRgb(g));
  }
  function pulseBusy() {
    if (networkSvg) networkSvg.classList.add("busy");
    applyGlow();
    clearTimeout(busyTimer);
    busyTimer = setTimeout(() => { if (networkSvg) networkSvg.classList.remove("busy"); applyGlow(); }, 4000);
  }

  // ── 🏢 보안팀 사무실 LIVE 대화(작업 세션 패널 하단) ──────────────────────────
  // 사무실 창의 캐릭터 말풍선과 같은 협업 이벤트(collaboration:event)를 이 피드에도 흘린다.
  const dolFeed = document.getElementById("dolFeed");
  const DOL_MAX = 40;
  function appendOfficeLive(evt) {
    if (!dolFeed || !evt || !evt.message) return;
    const empty = dolFeed.querySelector(".dol-empty");
    if (empty) empty.remove();
    const who = (evt.from || "팀") + (evt.to ? " → " + evt.to : "");
    const line = document.createElement("div");
    line.className = "dol-line";
    line.innerHTML = '<span class="dol-who">' + escB(who) + '</span><span class="dol-msg">' + escB(evt.message) + "</span>";
    dolFeed.appendChild(line);
    while (dolFeed.childElementCount > DOL_MAX) dolFeed.removeChild(dolFeed.firstChild);
    dolFeed.scrollTop = dolFeed.scrollHeight;
  }
  async function initOfficeLive() {
    const head = document.getElementById("dolHead");
    if (head && window.gijo.openTeamOffice) head.addEventListener("click", () => window.gijo.openTeamOffice());
    // 로드 시 최근 대화로 채운다(빈 화면 방지) — 사무실 창과 같은 협업 이력.
    try {
      const hist = (await window.gijo.listCollaborationHistory()) || [];
      hist.slice(-DOL_MAX).forEach(appendOfficeLive);
    } catch (e) { /* 이력 없으면 안내 문구 유지 */ }
  }

  // ── 실시간 에이전트 협업 라이브 피드(지휘 콘솔 아래 전체 폭) ─────────────────
  // 지시·에이전트 답변·팀원 간 위임(collaboration:event)이 한 줄기로 흐른다("동작하는 형태").
  const clRows = document.getElementById("clRows");
  const clStatus = document.getElementById("clStatus");
  const escB = (s) => String(s == null ? "" : s).replace(/</g, "&lt;");
  const CL_MAX = 10; // 실시간 활동이 세션 작업 공간이 되어 상태 카드+추천+대화가 흐르므로 여유를 둔다(스크롤). 오래된 행은 제거.
  let clStatusTimer = null;

  function clBusy(label) {
    clStatus.classList.add("busy");
    clStatus.innerHTML = '<span class="cl-dot"></span>' + escB(label || "작업 중");
    clearTimeout(clStatusTimer);
    clStatusTimer = setTimeout(() => {
      clStatus.classList.remove("busy");
      clStatus.innerHTML = '<span class="cl-dot"></span>대기 중';
    }, 4000);
  }

  // kind: instr(나의 지시) | reply(에이전트 답변) | event(팀원 간 위임) | error | typing | offer
  const CL_CLAMP_LEN = 140; // 이보다 길면 4줄 고정 + 펼치기
  function clAppend(kind, { icon, name, message }) {
    const empty = clRows.querySelector(".cl-empty");
    if (empty) empty.remove();
    const el = document.createElement("div");
    el.className = "cl-row " + kind;
    const time = new Date().toLocaleTimeString("ko-KR", { hour12: false });
    // 긴 답변(reply/event)은 4줄로 고정하고, 클릭하면 펼치는 "더보기"를 붙인다.
    const long = (kind === "reply" || kind === "event") && String(message).length > CL_CLAMP_LEN;
    const body =
      kind === "typing"
        ? '<span class="cm"><span></span><span></span><span></span></span>'
        : `<div class="cm${long ? " clamp" : ""}">${escB(message)}</div>${long ? '<span class="cl-more">더보기 ▾</span>' : ""}`;
    el.innerHTML =
      `<div class="ci">${icon || "◆"}</div>` +
      `<div class="cb"><div class="cn">${escB(name)}<span class="ct">${time}</span></div>${body}</div>`;
    if (long) {
      const cm = el.querySelector(".cm");
      const more = el.querySelector(".cl-more");
      const toggle = () => {
        const open = cm.classList.toggle("open");
        more.textContent = open ? "접기 ▴" : "더보기 ▾";
      };
      cm.addEventListener("click", toggle);
      more.addEventListener("click", toggle);
    }
    clRows.appendChild(el);
    while (clRows.childElementCount > CL_MAX) clRows.removeChild(clRows.firstChild);
    clRows.scrollTop = clRows.scrollHeight;
    return el;
  }
  function clReplaceTyping(typingEl, kind, entry) {
    if (typingEl && typingEl.parentNode) typingEl.remove();
    return clAppend(kind, entry);
  }
  // 답변 뒤 붙는 작은 제안 알약 — 이름/설명 문장 없이 아이콘+짧은 라벨만(시안 B).
  // title(툴팁)에 원래 설명 문장을 그대로 남겨 정보 손실 없이 자리만 줄인다.
  function clAppendPill(cls, label, title, onClick) {
    const empty = clRows.querySelector(".cl-empty");
    if (empty) empty.remove();
    const row = document.createElement("div");
    row.className = "cl-pill-row";
    const btn = document.createElement("button");
    btn.className = "cl-pill" + (cls ? " " + cls : "");
    btn.textContent = label;
    btn.title = title;
    btn.addEventListener("click", onClick);
    row.appendChild(btn);
    clRows.appendChild(row);
    while (clRows.childElementCount > CL_MAX) clRows.removeChild(clRows.firstChild);
    clRows.scrollTop = clRows.scrollHeight;
    return btn;
  }

  // 답변 뒤 "이 결과를 보고서로 정리할까요?" 제안 — 클릭하면 리포트 화면으로.
  function clOfferReport(label) {
    return clAppendPill(
      "",
      "📄 리포트",
      `방금 ${label ? label + "의 " : ""}결과를 보고서로 정리할까요? — 리포트 만들기`,
      () => window.gijo.navigateTo("report.html")
    );
  }

  // 시안 B — 로컬 답변 뒤 "클라우드에도 물어보기". 클라우드가 켜져 있고(관리자 설정) 유출 게이트를
  // 통과한 일반 질문에만 버튼이 뜬다. 내부정보가 섞이면 버튼 대신 "로컬 전용" 표시 → 유출 유도 자체가 없다.
  let dashCloudStatus = null; // 세션당 1회 조회 후 캐시
  async function getDashCloudStatus() {
    if (dashCloudStatus !== null) return dashCloudStatus;
    try { dashCloudStatus = await window.gijo.cloudStatus(); }
    catch (e) { dashCloudStatus = { enabled: false }; }
    return dashCloudStatus;
  }
  async function clCloudOffer(question) {
    const status = await getDashCloudStatus();
    if (!status || !status.enabled) return; // 클라우드 미사용(기본) — 아무것도 안 함(온프렘 그대로)
    let screen;
    try { screen = await window.gijo.screenCloud(question); } catch (e) { return; }
    if (!screen.allowed) {
      // 내부 정보 포함 — 클라우드 제안을 아예 띄우지 않고, 왜 로컬 전용인지만 조용히 알린다.
      const note = clAppend("event", { icon: "🔒", name: "로컬 전용", message: `이 질문은 내부 정보(${screen.reasons.join(", ")})가 있어 클라우드로 보낼 수 없습니다 — 로컬 답변만 제공됩니다.` });
      return note;
    }
    const btn = clAppendPill(
      "cloud",
      `☁ ${status.providerLabel} 추가 질의`,
      `내부 정보 미포함 — 이 질문을 ${status.providerLabel}에도 물어볼 수 있습니다.`,
      async () => {
        btn.disabled = true; btn.textContent = "☁ 묻는 중…";
        try {
          const r = await window.gijo.askCloud(question);
          if (r.routedToCloud) {
            const row = clAppend("reply", { icon: "☁", name: `${r.providerLabel} · 보조 의견`, message: r.answer || "(빈 응답)" });
            const badge = document.createElement("span");
            badge.textContent = "☁ 클라우드 · 내부정보 미포함";
            badge.style.cssText = "font-size:9.5px;font-weight:800;padding:1px 7px;border-radius:5px;background:rgba(139,124,240,.16);border:1px solid #8b7cf0;color:#b3a6ff;margin-left:6px";
            row.querySelector(".cn").appendChild(badge);
            // 4단계 — 이 답변을 지식베이스(RAG)에 저장. 외부 생성물이라 자동 인입 대신 사람이 눌러 승인.
            const saveBtn = document.createElement("button");
            saveBtn.className = "cl-offer-btn";
            saveBtn.textContent = "📥 지식베이스에 저장";
            saveBtn.title = "외부 클라우드 답변을 사내 지식베이스에 저장합니다(검증 필요 표시가 함께 붙습니다).";
            saveBtn.addEventListener("click", async () => {
              saveBtn.disabled = true; saveBtn.textContent = "저장 중…";
              try {
                const s = await window.gijo.saveCloudAnswerToKb(question, r.answer || "", r.providerLabel || "클라우드", r.model || "");
                saveBtn.textContent = `✓ 지식베이스 저장됨 (${s.chunks}청크)`;
              } catch (e) {
                saveBtn.disabled = false; saveBtn.textContent = "📥 저장 실패 — 다시";
              }
            });
            row.querySelector(".cb").appendChild(saveBtn);
            btn.parentElement.remove(); // 제안 알약 행 제거(중복 방지)
          } else if (r.blocked) {
            btn.textContent = "🔒 감지됨";
          } else {
            btn.disabled = false; btn.textContent = "☁ 다시 시도";
          }
        } catch (e) {
          btn.disabled = false; btn.textContent = "☁ 다시 시도";
        }
      }
    );
    return btn;
  }

  // 결재판 카드(시안 B) — 쓰기 도구는 지시만으로 실행되지 않는다. AI가 채운 값을 표로 보여주고
  // 값마다 출처(지시에서/자동생성/AI 추정)를 달아 사람이 빠르게 검증한 뒤 승인해야 실행된다.
  // 빠진 필수값은 빈 칸으로 떠서 그 자체가 "되물어보기"가 된다(별도 ask 단계 불필요).
  const AP_SRC = {
    said: { label: "지시에서", cls: "said" },
    found: { label: "조회 결과", cls: "auto" }, // 앞선 도구 조회 결과에서 온 값(근거 있음)
    auto: { label: "자동생성", cls: "auto" },
    guess: { label: "AI 추정", cls: "guess" },
    empty: { label: "입력 필요", cls: "empty" },
  };
  function clApproval(approval) {
    const el = clAppend("event", { icon: "🗂️", name: "승인 대기", message: "" });
    el.remove(); // 표준 행 대신 전용 카드로 그린다
    const card = document.createElement("div");
    card.className = "ap";
    const fieldsHtml = approval.fields
      .map((f) => {
        const src = AP_SRC[f.source] || AP_SRC.guess;
        const inCls = f.source === "empty" ? "need" : f.source === "auto" ? "auto" : f.source === "guess" ? "guess" : "";
        return (
          `<div class="ap-f"><div class="ap-k">${escB(f.label)}${f.required ? '<span class="req">*</span>' : ""}</div>` +
          `<input class="ap-in ${inCls}" data-k="${escB(f.key)}" value="${escB(f.value)}" placeholder="${escB(f.hint)}">` +
          `<span class="ap-src ${src.cls}">${src.label}</span></div>`
        );
      })
      .join("");
    card.innerHTML =
      `<div class="ap-head"><span>🗂️</span><span class="ap-title">실행 승인 — ${escB(approval.label)} (${escB(approval.tool)})</span>` +
      `<span class="ap-badge">쓰기 작업</span></div>` +
      `<div class="ap-body"><div class="ap-intro">지시에서 아래와 같이 정리했습니다. 확인 후 승인해 주세요.</div>${fieldsHtml}` +
      (approval.effect || approval.undo
        ? `<div class="ap-effect">${approval.effect ? `<b>실행되면:</b> ${escB(approval.effect)}<br>` : ""}${approval.undo ? `<b>되돌리기:</b> ${escB(approval.undo)}` : ""}</div>`
        : "") +
      `</div><div class="ap-actions"><button class="ap-go">✓ 승인하고 실행</button><button class="ap-no">취소</button></div>`;
    clRows.appendChild(card);
    clRows.scrollTop = clRows.scrollHeight;

    const go = card.querySelector(".ap-go");
    const inputs = [...card.querySelectorAll(".ap-in")];
    const collect = () => Object.fromEntries(inputs.map((i) => [i.dataset.k, i.value.trim()]));
    // 필수값이 비어 있으면 승인 버튼을 잠근다 — 서버도 한 번 더 검증하지만 화면에서 먼저 막는다.
    const required = approval.fields.filter((f) => f.required).map((f) => f.key);
    const sync = () => {
      const args = collect();
      const missing = required.filter((k) => !args[k]);
      go.disabled = missing.length > 0;
      go.textContent = missing.length ? `✓ 승인 (${missing.length}개 입력 필요)` : "✓ 승인하고 실행";
    };
    inputs.forEach((i) => i.addEventListener("input", sync));
    sync();

    card.querySelector(".ap-no").addEventListener("click", () => {
      card.remove();
      clAppend("event", { icon: "✕", name: "취소됨", message: `${approval.label}을(를) 실행하지 않았습니다.` });
    });
    go.addEventListener("click", async () => {
      go.disabled = true;
      go.textContent = "실행 중…";
      try {
        const r = await window.gijo.approveAgentTool(approval.tool, collect(), approval.instruction || "");
        card.remove();
        const row = clAppend("offer", { icon: "✅", name: `실행 완료 — ${approval.tool}`, message: r.output });
        // #7 원클릭 undo — 서버가 되돌릴 게 있으면 undoId를 준다. 방금 실행 취소 버튼을 붙인다.
        if (r && r.undoId) {
          const undoBtn = document.createElement("button");
          undoBtn.className = "cl-undo";
          undoBtn.textContent = "↩ 방금 실행 취소";
          undoBtn.addEventListener("click", async () => {
            undoBtn.disabled = true;
            try {
              const u = await window.gijo.undoAgentTool(r.undoId);
              undoBtn.remove();
              clAppend("event", { icon: "↩", name: "되돌림", message: (u && u.message) || "되돌렸습니다." });
              await loadTasks();
              refreshTeamStatus();
            } catch (e) {
              undoBtn.disabled = false;
              clAppend("error", { icon: "⚠", name: "되돌리기 실패", message: (e && e.message) || String(e) });
            }
          });
          const cb = row.querySelector(".cb");
          if (cb) cb.appendChild(undoBtn);
        }
        await loadTasks();
        refreshTeamStatus();
      } catch (err) {
        go.disabled = false;
        sync();
        clAppend("error", { icon: "⚠", name: "실행 실패", message: (err && err.message) || String(err) });
      }
    });
    return card;
  }

  // 학습 루프 실행 확인 카드 — 서버가 confirm으로 되돌린 요청(무거운 GPU 학습 + 엔진 일시 중단)을
  // 명시적 버튼으로만 시작한다. 시작하면 진행은 학습 루프 화면에서 본다.
  function clLearnConfirm(confirm) {
    const el = clAppend("offer", {
      icon: "🧠",
      name: "학습 루프 실행 확인",
      message: "실 GPU 파인튜닝이 실행되고 학습 중 로컬 LLM이 일시 중단됩니다. 데이터셋을 고르고 시작을 확인하세요.",
    });
    const box = document.createElement("div");
    box.style.cssText = "display:flex;gap:6px;align-items:center;margin-top:7px;flex-wrap:wrap;";
    const ds = confirm.datasets || [];
    if (ds.length) {
      box.innerHTML =
        `<select class="cl-ds" style="background:var(--panel);border:1px solid var(--border-strong);border-radius:7px;padding:5px 8px;color:var(--text);font-size:11px;outline:none;">` +
        ds.map((d) => `<option value="${escB(d.id)}">${escB(d.id)} (${d.examples}건)</option>`).join("") +
        `</select><button class="cl-offer-btn cl-learn-go">▶ 학습 시작 확인</button><button class="cl-offer-btn cl-learn-open">학습 루프 화면 ↗</button>`;
    } else {
      box.innerHTML = `<span style="font-size:11px;color:var(--muted)">데이터셋 없음 — 학습 루프 화면에서 먼저 만드세요.</span><button class="cl-offer-btn cl-learn-open">학습 루프 화면 ↗</button>`;
    }
    el.querySelector(".cb").appendChild(box);
    box.querySelector(".cl-learn-open").addEventListener("click", () => window.gijo.navigateTo("learnloop.html"));
    const go = box.querySelector(".cl-learn-go");
    if (go) go.addEventListener("click", async () => {
      go.disabled = true;
      go.textContent = "시작 중…";
      try {
        await window.gijo.startLearnloopRun(box.querySelector(".cl-ds").value);
        box.innerHTML = `<span style="font-size:11px;color:var(--teal);font-weight:800">🚀 학습 루프 시작됨 — 학습 중 로컬 LLM이 잠시 중단됩니다</span><button class="cl-offer-btn cl-learn-open2">진행 보기 ↗</button>`;
        box.querySelector(".cl-learn-open2").addEventListener("click", () => window.gijo.navigateTo("learnloop.html"));
      } catch (err) {
        go.disabled = false;
        go.textContent = "▶ 학습 시작 확인";
        clAppend("error", { icon: "⚠", name: "학습 루프", message: "시작 실패: " + ((err && err.message) || err) });
      }
    });
    clRows.scrollTop = clRows.scrollHeight;
    return el;
  }

  // 지휘 콘솔의 대화도 작업 세션으로 남긴다 — 열린 세션이 없으면 새로 만든다(제목은 첫 지시로 자동 지정).
  async function ensureDashSession() {
    if (dashCurrentSession) return dashCurrentSession;
    try {
      const s = await window.gijo.createWorkSession();
      dashCurrentSession = { id: s.id, title: s.title };
    } catch (e) { dashCurrentSession = null; }
    return dashCurrentSession;
  }
  async function sendToOrchestrator(text) {
    pulseBusy();
    markWorking("orchestrator");
    clBusy(orchLabel() + " 작업 중");
    clAppend("instr", { icon: "정", name: `나 · 팀장 → ${orchLabel()}`, message: text });
    const typing = clAppend("typing", { icon: "🧭", name: orchLabel() });
    try {
      // 지휘 콘솔의 모든 지시를 작업 세션에 기록한다(열린 세션이 없으면 새로 만들어 이어감).
      const sess = await ensureDashSession();
      const result = await window.gijo.sendInstruction(text, sess ? sess.id : undefined);
      loadDashSessions(); // 작업 세션 목록(제목·미리보기·턴수) 갱신
      const who = result.route && result.route.agentId && result.route.agentId !== "orchestrator"
        ? `${orchLabel()} → ${agentLabel(result.route.agentId)}` : orchLabel();
      clReplaceTyping(typing, "reply", { icon: "🧭", name: who, message: result.output });
      // 쓰기 지시 — 서버가 실행하지 않고 결재판을 돌려줬다. 값을 검토·승인해야 실행된다(시안 B).
      if (result.approval) {
        clApproval(result.approval);
        await loadTasks();
        refreshTeamStatus();
        return;
      }
      // 학습 루프 실행 요청 — 리포트 제안 대신 확인 카드(명시적 시작 버튼)를 붙인다.
      if (result.confirm && result.confirm.type === "learnloop") {
        clLearnConfirm(result.confirm);
        await loadTasks();
        refreshTeamStatus();
        return;
      }
      // 답변이 "모델 미준비" 안내면 배너도 띄워 두 경로(모델 받기/서버 연결)를 바로 제시.
      const notReady = /모델이 아직 준비|로컬 LLM|localengine/.test(result.output || "");
      if (notReady) modelGuide().style.display = "block";
      else { clOfferReport(orchLabel()); clCloudOffer(text); }
      await loadTasks();
      if (result.route && result.route.action === "scan") await reloadDashExplorer();
      refreshTeamStatus();
    } catch (e) {
      clReplaceTyping(typing, "error", { icon: "⚠", name: orchLabel(), message: e.message });
    }
  }

  function greet() {
    const hour = new Date().getHours();
    const greeting = hour < 12 ? "좋은 아침입니다" : hour < 18 ? "안녕하세요" : "좋은 저녁입니다";
    clAppend("reply", { icon: "🧭", name: orchLabel(), message: `${greeting}${displayName ? ", " + displayName + "님" : ""}. 팀원을 고르고 아래 대화 독에서 지시하세요.` });
  }

  // ── 시안3: 팀 카드 그리드 + 하단 대화 독 ─────────────────────────────
  function llmBadge(a) {
    // 보안 합성모델(예: merged-lily-gijo-loop-ai-securityllm)은 이름에 "gijo"도 포함하므로
    // 합성/보안 지표를 먼저 검사한 뒤 gijo를 판정한다.
    const m = String(a.assignedModelId || "").toLowerCase();
    if (m.includes("merge") || m.includes("lily") || m.includes("zysec") || m.includes("security")) return "보안LLM";
    if (m.includes("gijo") || m.includes("orchestrator")) return "gijo";
    return (a.id === "scan" || a.id === "analysis" || a.id === "ti") ? "보안LLM" : "gijo";
  }
  function tcardHtml(a) {
    const meta = STATUS_META[a.status] || STATUS_META.idle;
    const icon = AGENT_ICON[a.id] || "◆";
    const live = a.status === "working" ? '<div class="tc-live tc-typing"><span></span><span></span><span></span></div>' : "";
    // 이름(tc-name)은 표시하지 않는다 — 아이콘·역할·상태로 "어떤 에이전트가 작업 중인지"만 본다.
    return `<div class="tcard ${meta.cls}${a.id === currentTarget ? " sel" : ""}" data-agent="${a.id}" title="${escT(a.name)}">${live}` +
      `<div class="tc-av">${icon}</div>` +
      `<div class="tc-role">${escT(a.role || "")}</div>` +
      `<div class="tc-badges"><span class="tc-b ${meta.bcls}">${meta.badge}</span><span class="tc-b tc-llm">${escT(llmBadge(a))}</span></div></div>`;
  }
  // ── 임베딩 엔진 카드 (로스터 7번째) ────────────────────────────────────────
  // 에이전트가 아니라 인프라라, 서버의 에이전트 목록이 아닌 localengine 상태에서 생사를 읽고
  // llm:event(kind=embed)로 실제 호출을 반영한다. 누적 건수는 화면이 떠 있는 동안의 관측치다.
  let embTotal = 0;
  let embResetTimer = null;

  function embCardHtml() {
    return '<div class="tcard infra" id="embCard" title="임베딩 엔진 — RAG 검색·문서 인입에 쓰입니다 (대화 대상 아님)">' +
      '<span class="infra-tag">ENGINE</span>' +
      '<div class="tc-av">🧬</div>' +
      '<div class="tc-role">임베딩·검색</div>' +
      '<div class="emb-wave"><i></i><i></i><i></i><i></i><i></i></div>' +
      '<div class="emb-stat" id="embStat">확인 중…</div>' +
      '<div class="tc-badges"><span class="tc-b tc-infra" id="embBadge">확인 중</span></div></div>';
  }

  // 엔진이 살아 있는지(상주/중지)를 localengine 상태로 갱신한다.
  async function refreshEmbeddingCard() {
    const card = document.getElementById("embCard");
    if (!card) return;
    const badge = document.getElementById("embBadge");
    const stat = document.getElementById("embStat");
    try {
      const s = await window.gijo.getLocalEngineStatus();
      const up = !!(s && s.embedding && s.embedding.running);
      card.classList.toggle("down", !up);
      badge.textContent = up ? "상주" : "중지";
      badge.className = "tc-b " + (up ? "tc-infra" : "tc-infra-down");
      if (!card.classList.contains("active")) {
        stat.textContent = up
          ? (embTotal > 0 ? `누적 ${embTotal.toLocaleString()}건` : (s.embedding.modelId || "bge-m3"))
          : "엔진 미기동";
      }
    } catch {
      card.classList.add("down");
      badge.textContent = "확인 불가";
      badge.className = "tc-b tc-infra-down";
      stat.textContent = "상태 조회 실패";
    }
  }

  // 임베딩이 실제로 돌 때마다 파형을 띄우고 처리 건수·지연을 찍는다.
  function onEmbeddingActivity(evt) {
    const card = document.getElementById("embCard");
    if (!card || !evt || evt.kind !== "embed") return;
    const stat = document.getElementById("embStat");
    const badge = document.getElementById("embBadge");

    if (evt.phase === "error") {
      card.classList.remove("active");
      card.classList.add("down");
      badge.textContent = "오류";
      badge.className = "tc-b tc-infra-down";
      stat.textContent = "연결 실패";
      return;
    }
    if (evt.phase !== "done") return;

    card.classList.remove("down");
    card.classList.add("active");
    badge.textContent = "검색중";
    badge.className = "tc-b tc-infra";

    // detail은 "N개 임베딩" 형태 — 건수를 뽑아 누적에 더한다(형식이 바뀌면 조용히 1건 취급).
    const n = Number((String(evt.detail || "").match(/(\d+)\s*개/) || [])[1]) || 1;
    embTotal += n;
    stat.textContent = evt.latencyMs ? `${n}건 · ${evt.latencyMs}ms` : `${n}건`;

    clearTimeout(embResetTimer);
    embResetTimer = setTimeout(() => {
      card.classList.remove("active");
      badge.textContent = "상주";
      stat.textContent = `누적 ${embTotal.toLocaleString()}건`;
    }, 2200);
  }

  // ── 가드레일 카드 (로스터 8번째) ──────────────────────────────────────────
  // 용도: "AI가 지금 공격받고 있는가"와 "방어가 켜져 있는가"를 한눈에 본다.
  // 임베딩 카드와 의미가 반대다 — 임베딩은 돌면 정상, 가드레일은 탐지가 뜨면 비정상이다.
  // 가드레일은 ws 푸시가 없어(상태 API만 존재) 폴링으로 증가분을 감지한다.
  let guardSeenFlagged = null; // 직전 관측치. 첫 조회는 기준선만 잡고 반응하지 않는다.
  let guardHitTimer = null;

  function guardCardHtml() {
    return '<div class="tcard infra guard" id="guardCard" data-page="redteam.html" ' +
      'title="런타임 가드레일 — LLM 입력의 프롬프트 인젝션을 실시간 검사합니다. 클릭하면 AI 견고성 화면으로 이동합니다.">' +
      '<span class="infra-tag">GUARD</span>' +
      '<div class="tc-av">🛡</div>' +
      '<div class="tc-role">프롬프트 방어</div>' +
      '<div class="guard-stat" id="guardStat">확인 중…</div>' +
      '<div class="tc-badges"><span class="tc-b tc-guard" id="guardBadge">확인 중</span></div></div>';
  }

  async function refreshGuardCard() {
    const card = document.getElementById("guardCard");
    if (!card) return;
    const badge = document.getElementById("guardBadge");
    const stat = document.getElementById("guardStat");
    try {
      const s = await window.gijo.guardrailStatus();
      const flagged = Number(s.flaggedCount) || 0;
      const blocked = Number(s.blockedCount) || 0;

      // 모드 표시 — off는 방어가 없는 상태라 경고로 다룬다.
      card.classList.toggle("off", s.mode === "off");
      badge.textContent = s.mode === "block" ? "차단" : s.mode === "flag" ? "감시" : "꺼짐";
      badge.className = "tc-b " + (s.mode === "off" ? "tc-guard-off" : "tc-guard");

      // 직전 관측보다 탐지가 늘었으면 공격 시도가 있었다는 뜻 — 앰버로 반응.
      if (guardSeenFlagged !== null && flagged > guardSeenFlagged) {
        const delta = flagged - guardSeenFlagged;
        card.classList.add("hit");
        stat.textContent = `탐지 +${delta}건`;
        clearTimeout(guardHitTimer);
        guardHitTimer = setTimeout(() => {
          card.classList.remove("hit");
          stat.textContent = guardSummary(flagged, blocked, s.mode);
        }, 6000);
      } else if (!card.classList.contains("hit")) {
        stat.textContent = guardSummary(flagged, blocked, s.mode);
      }
      guardSeenFlagged = flagged;
    } catch {
      badge.textContent = "확인 불가";
      badge.className = "tc-b tc-guard-off";
      stat.textContent = "상태 조회 실패";
    }
  }

  // 누적 수치는 서버 기동 이후 기준이고 최근 200건까지만 보관된다 — 문구로 오해를 줄인다.
  function guardSummary(flagged, blocked, mode) {
    if (mode === "off") return "보호 꺼짐";
    if (flagged === 0) return "탐지 없음";
    return `탐지 ${flagged} · 차단 ${blocked}`;
  }

  async function renderTeam() {
    try {
      const agents = await window.gijo.listAgents();
      agentsById = {};
      agents.forEach((a) => { agentsById[a.id] = a; });
      teamGrid.innerHTML = agents.map(tcardHtml).join("") + embCardHtml() + guardCardHtml();
      // data-agent가 있는 카드만 대화 대상 — 엔진 카드들은 속성이 없어 자연히 제외된다.
      teamGrid.querySelectorAll(".tcard[data-agent]").forEach((c) => c.addEventListener("click", () => selectAgent(c.dataset.agent)));
      // 가드레일 카드는 대화가 아니라 화면 이동(AI 견고성)으로 연결한다.
      const gc = document.getElementById("guardCard");
      if (gc) {
        gc.style.cursor = "pointer";
        gc.addEventListener("click", () => window.gijo.navigateTo("redteam.html"));
      }
      refreshEmbeddingCard();
      refreshGuardCard();
      if (!agentsById[currentTarget]) currentTarget = agents[0] ? agents[0].id : "orchestrator";
      selectAgent(currentTarget);
    } catch (e) {
      teamGrid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--muted-2);font-size:12px">팀원을 불러오지 못했습니다</div>';
    }
  }
  function selectAgent(id) {
    currentTarget = id;
    teamGrid.querySelectorAll(".tcard").forEach((c) => c.classList.toggle("sel", c.dataset.agent === id));
    const a = agentsById[id];
    if (dockWho) { // 지시 대상 표시(현재 대시보드에선 제거됨 — 존재할 때만 갱신)
      const icon = AGENT_ICON[id] || "◆";
      dockWho.innerHTML = `<div class="dw-i">${icon}</div><div><b>${a ? escT(a.name) : escT(id)}</b><br><span>지시 대상</span></div>`;
    }
    // 세션에 묶여 있지 않을 때만 placeholder를 대상 안내로 덮는다(세션 이어가기 안내 보존).
    if (!dashCurrentSession) chatInput.placeholder = a ? `${a.name}에게 지시…` : "지시를 입력하세요…";
  }
  function markWorking(id) {
    const c = teamGrid.querySelector('.tcard[data-agent="' + id + '"]');
    if (!c) return;
    c.classList.add("working");
    if (!c.querySelector(".tc-live")) c.insertAdjacentHTML("afterbegin", '<div class="tc-live tc-typing"><span></span><span></span><span></span></div>');
    clearTimeout(c._wt);
    c._wt = setTimeout(refreshTeamStatus, 4000);
  }
  async function refreshTeamStatus() {
    try {
      const agents = await window.gijo.listAgents();
      agents.forEach((a) => {
        agentsById[a.id] = a;
        const c = teamGrid.querySelector('.tcard[data-agent="' + a.id + '"]');
        if (!c) return;
        const meta = STATUS_META[a.status] || STATUS_META.idle;
        c.classList.remove("working", "watching");
        if (meta.cls) c.classList.add(meta.cls);
        const live = c.querySelector(".tc-live");
        if (a.status !== "working" && live) live.remove();
        const badge = c.querySelector(".tc-badges .tc-b");
        if (badge) { badge.className = "tc-b " + meta.bcls; badge.textContent = meta.badge; }
      });
    } catch (e) {}
  }
  async function sendToAgent(id, text) {
    pulseBusy();
    markWorking(id);
    const a = agentsById[id];
    const label = a ? a.name : id;
    const icon = AGENT_ICON[id] || "◆";
    clBusy(label + " 작업 중");
    clAppend("instr", { icon: "정", name: `나 · 팀장 → ${label}`, message: text });
    const typing = clAppend("typing", { icon, name: label });
    // chat()은 orchestrator를 거치지 않는 개별 팀원 직접 대화라 sendInstruction처럼 서버가 알아서
    // 턴을 기록해주지 않는다 — 세션 확보 후 수동으로 남긴다(그래야 목록·제목이 오케스트레이터 경로와 동일).
    const sess = await ensureDashSession();
    if (sess) { try { await window.gijo.addWorkSessionTurn(sess.id, "user", text, label); } catch (e) {} }
    try {
      const r = await window.gijo.chat(id, text);
      const reply = r && r.reply != null ? r.reply : String(r);
      clReplaceTyping(typing, "reply", { icon, name: label, message: reply });
      if (sess) { try { await window.gijo.addWorkSessionTurn(sess.id, "assistant", reply, label); } catch (e) {} }
      loadDashSessions();
      if (/모델이 아직 준비|로컬 LLM|localengine/.test(reply || "")) modelGuide().style.display = "block";
      else clOfferReport(label);
      refreshTeamStatus();
    } catch (e) {
      clReplaceTyping(typing, "error", { icon: "⚠", name: label, message: e.message });
    }
  }
  function dockSubmit() {
    const text = chatInput.value.trim();
    if (!text) return;
    chatInput.value = "";
    if (currentTarget === "orchestrator") sendToOrchestrator(text);
    else sendToAgent(currentTarget, text);
  }

  // 팀원 간 위임 이벤트(from→to)를 라이브 피드에 흘린다.
  function appendCollabRow(evt) {
    const from = String(evt.from || "");
    const to = String(evt.to || "");
    // 세션 태그 이벤트(from/to="세션")는 대시보드에서 상태 카드·대화 독으로 이미 직접 표시하므로 중복 방지.
    if (from === "세션" || to === "세션") return;
    clAppend("event", {
      icon: AGENT_ICON[from] || "◆",
      name: `${agentLabel(from)} → ${agentLabel(to)}`,
      message: String(evt.message || ""),

  }

  async function loadCollaboration() {
    try {
      const history = await window.gijo.listCollaborationHistory();

  // 오늘의 조치 — 전 자산 취약점 우선순위 상위 5(KEV·EPSS·VPR 순). 클릭은 data-page로 취약점 관리 이동.
  async function loadTodayPriority() {
    const box = document.getElementById("todayPriorityList");
    if (!box) return;
    try {
      const { items } = await window.gijo.listActionPriorities(5);
      if (!items || !items.length) { box.innerHTML = '<span style="color:var(--muted-2)">조치 대상 취약점 없음</span>'; return; }

          `<span style="color:var(--text);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${escT(nm)}</span>` +

      box.innerHTML = '<span style="color:var(--muted-2)">불러오지 못함</span>';

  // ── 작업 세션 열(탐색기 옆) ────────────────────────────────────────────
  const DASH_STATUS_LABEL = { active: "진행중", done: "완료", ignored: "무시" };
  async function loadDashSessions() {
    const box = document.getElementById("dashSessionList");
    if (!box) return;
    try {
      const list = await window.gijo.listWorkSessions();
      const activeCount = list.filter((s) => s.status === "active").length;
      const badge = document.getElementById("dashActiveBadge");
      if (badge) {
        badge.textContent = `진행중 ${activeCount}`;
        badge.classList.toggle("zero", activeCount === 0);
      }
      if (!list.length) {
        box.innerHTML = '<div style="font-size:11px;color:var(--muted-2);padding:10px 6px;line-height:1.6">아직 세션이 없습니다.<br>＋ 새 세션 또는 전체 화면의 탐색기 항목을 눌러 시작하세요.</div>';
        return;
      }
      // 모든 세션(행위)을 나열 — sessions.html(작업 세션 열기 화면)과 동일한 .srow 구조로 렌더한다.
      // ✓ 완료를 누르면 서버가 세션 리포트(DOCX)를 자동 생성한다(리포트 화면 이력에 표시).
      const DASH_BADGE_CLASS = { active: "b-active", done: "b-done", ignored: "b-ignored" };
      box.innerHTML = list.map((s) => {
        const d = new Date(s.updatedAt);
        const when = `${d.getMonth() + 1}.${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
        // 완료는 경위 구분 — 사용자 완료 "완료", 30분 무대화 등 자동 완료 "자동완료".
        const stL = s.status === "done" ? (s.doneBy === "auto" ? "자동완료" : "완료") : (DASH_STATUS_LABEL[s.status] || s.status);
        const sub = s.lastPreview ? escT(s.lastPreview) : "아직 대화 없음";
        return `<div class="srow" data-id="${s.id}">
          <span class="sdot ${s.status}"></span>
          <div class="sr-main"><div class="sr-title">${escT(s.title)}</div><div class="sr-sub">${sub}</div></div>
          <div class="sr-meta"><span class="badge ${DASH_BADGE_CLASS[s.status] || "b-active"}">${escT(stL)}</span><br>${when} · ${s.turnCount}턴</div>` +
          (s.status !== "done" ? `<span class="s-done" data-done="${s.id}" title="세션 완료 — 리포트 자동 생성">✓ 완료</span>` : "") +
          `<span class="sdel" data-del="${s.id}" title="세션 삭제">🗑</span></div>`;
      }).join("");
      box.querySelectorAll(".srow").forEach((el) => el.addEventListener("click", (e) => {
        if (e.target.closest(".sdel")) { e.stopPropagation(); deleteDashSession(el.dataset.id); return; }
        if (e.target.closest(".s-done")) { e.stopPropagation(); completeDashSession(el.dataset.id); return; }
        openSessionPage(el.dataset.id);
      }));
    } catch (e) {
      box.innerHTML = '<div style="font-size:11px;color:var(--muted-2);padding:8px">세션을 불러오지 못했습니다</div>';
    }
  }
  async function deleteDashSession(id) {
    if (!confirm("이 세션과 대화를 삭제할까요? 되돌릴 수 없습니다.")) return;
    try { await window.gijo.deleteWorkSession(id); await loadDashSessions(); } catch (e) { alert("삭제 실패: " + (e && e.message || e)); }
  }
  // 세션 완료 처리 — 서버가 대화 전체를 DOCX 리포트로 남긴다(응답 report에 파일 정보).
  async function completeDashSession(id) {
    try {
      const r = await window.gijo.updateWorkSession(id, { status: "done" });
      await loadDashSessions();
      if (r && r.report) {
        const note = document.createElement("div");
        note.className = "dash-srep";
        note.textContent = "📄 세션 리포트 생성됨 — 리포트 화면에서 확인 ↗";
        note.addEventListener("click", () => window.gijo.navigateTo("report.html"));
        const box = document.getElementById("dashSessionList");
        if (box) box.prepend(note);
        setTimeout(() => { try { note.remove(); } catch (e) {} }, 15000);
