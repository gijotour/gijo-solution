<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIJO AS — 대시보드</title>
<link rel="stylesheet" href="gijo-ui.css">
<!--
  대시보드 4.0.0 — 시안 B(브리핑 중심). 2026-07-28 사용자 결정.

  왜 다시 짰나
  ────────────
  3.x의 대시보드는 사실상 "앱 전체"였다. 히어로 구체 · 지휘 콘솔 · 탐색기 · 작업세션 패널 ·
  사무실 피드 · 내 업무 바로가기를 한 화면에 다 이고 있었고, JS만 1,100줄이 콘솔 몫이었다.
  4.0.0에서 셸(app.html)이 메뉴·탭줄·콘솔을 가져가면서 이것들이 전부 중복이 됐다 —
  특히 입력칸이 화면에 둘(셸 콘솔 + 대시보드 콘솔) 보이는 상태는 "지시는 한 곳"이라는
  이번 개편의 원칙과 정면으로 어긋났다.

  그래서 대시보드는 **탭 하나의 몫**으로 줄였다: 오늘 무엇이 급한지 읽는 자리.
  숫자판을 늘어놓기보다 AI가 문장으로 먼저 말하고, 근거 목록은 아래 작게 둔다.

  ⚠ 이 화면의 숫자는 전부 서버 실측이다. 값을 못 받으면 빈 상태로 그 사실을 밝힌다 —
    자리를 채우려고 임의 숫자를 넣지 않는다.
-->
<style>
  :root{
    --bg:#0a0e1a;--panel:#121a2e;--border:rgba(255,255,255,.08);
    --blue:#3b82f6;--blue-l:#5fa1ff;--text:#e7eaf3;--muted:#8b93ab;--muted-2:#5f6785;
    --teal:#1eb980;--red:#e2483d;--amber:#f0a020;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Pretendard","Malgun Gothic","Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:13px;}
  .app{display:grid;grid-template-columns:212px 1fr;min-height:100vh;}
  .sidebar{border-right:1px solid var(--border);background:#0b1020;}
  /* 넓은 화면에서 오른쪽이 비지 않게 — 실측(2026-07-28) FHD에서 탭 안 2168px 중 948px가
     빈 채로 남았다(44%). 다만 **글과 목록은 성격이 다르다**:
       · 브리핑은 읽는 글이다. 한 줄이 너무 길면 눈이 다음 줄 첫머리를 못 찾는다 → 폭을 묶는다.
       · 카드는 훑는 목록이다. 넓을수록 취약점 이름이 안 잘린다 → 화면을 채운다.
     그래서 .main의 상한을 풀고, 브리핑에만 상한을 준다. */
  .main{padding:18px 22px 40px;max-width:1800px;}
  .brief{max-width:1220px;}

  /* 정체성 한 줄 — 사용법·용어 풀이는 ⓘ로 챗봇에서(프로젝트 원칙) */
  .scr-id{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:14px;}
  .scr-id b{color:var(--text);font-weight:800;}
  .scr-id .ask{margin-left:2px;color:var(--blue-l);cursor:pointer;font-weight:700;}
  .scr-id .ask:hover{text-decoration:underline;}

  /* 브리핑 — 사람이 읽는 문장이 주인공 */
  .brief{background:linear-gradient(180deg,rgba(59,130,246,.10),transparent);
    border:1px solid rgba(59,130,246,.30);border-radius:14px;padding:18px 20px;margin-bottom:16px;}
  .brief .who{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--blue-l);font-weight:800;margin-bottom:9px;}
  .brief .who .dot{width:6px;height:6px;border-radius:50%;background:var(--teal);flex:0 0 auto;}
  .brief .who .by{margin-left:auto;color:var(--muted-2);font-weight:700;}
  .brief .tx{font-size:14.5px;line-height:1.85;color:#dfe6f7;white-space:pre-wrap;word-break:break-word;}
  .brief.dim .tx{color:var(--muted);}
  .acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .act{background:rgba(59,130,246,.14);border:1px solid rgba(59,130,246,.42);color:#cfe0ff;border-radius:9px;
    padding:8px 13px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
  .act:hover{background:var(--blue);color:#fff;}
  .act.ghost{background:transparent;border-color:rgba(255,255,255,.14);color:var(--muted);}
  .act.ghost:hover{color:#fff;border-color:var(--blue);background:rgba(59,130,246,.1);}
  .act[disabled]{opacity:.45;cursor:default;}

  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  @media (max-width:1000px){.grid{grid-template-columns:1fr;}}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:13px 15px;min-width:0;}
  .card h3{font-size:12px;font-weight:800;margin-bottom:9px;color:var(--muted);display:flex;align-items:center;gap:6px;}
  .card h3 .cnt{margin-left:auto;color:var(--muted-2);font-weight:700;}
  .li{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid rgba(255,255,255,.05);font-size:12.5px;min-width:0;}
  .li.go{cursor:pointer;}
  .li.go:hover .tx{color:#fff;}
  .li .b{flex:0 0 auto;width:5px;height:5px;border-radius:50%;}
  .b.red{background:#f5928a;} .b.amber{background:var(--amber);} .b.blue{background:var(--blue-l);} .b.gray{background:var(--muted-2);}
  .li .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .li .m{flex:0 0 auto;font-size:10.5px;color:var(--muted-2);white-space:nowrap;}
  .li.done .tx{color:var(--muted-2);text-decoration:line-through;}
  .li input.ck{flex:0 0 auto;width:13px;height:13px;accent-color:var(--blue);cursor:pointer;}
  .empty{font-size:12px;color:var(--muted-2);padding:10px 0;line-height:1.7;}
  .more{border-top:1px solid rgba(255,255,255,.05);padding:8px 0 2px;font-size:11.5px;color:var(--muted-2);cursor:pointer;text-align:center;}
  .more:hover{color:var(--blue-l);}
  .big{font-size:21px;font-weight:800;}
  .kv{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:6px 0;border-top:1px solid rgba(255,255,255,.05);}
  .kv span:first-child{font-size:11.5px;color:var(--muted);}
  .kv b{font-size:13px;}
  .addrow{display:flex;gap:6px;margin-top:9px;}
  .addrow input{flex:1;min-width:0;background:#0b1120;border:1px solid var(--border);border-radius:8px;
    padding:7px 9px;color:var(--text);font-size:12px;font-family:inherit;}
  .addrow input:focus{outline:none;border-color:rgba(59,130,246,.5);}
  .addrow button{background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--muted);
    border-radius:8px;padding:0 11px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;}
  .addrow button:hover{color:#fff;border-color:var(--blue);}
</style>
</head>
<body class="g-ui">
<div class="app">
  <div class="sidebar" id="gijoNav"></div>
  <div class="main">
    <div class="scr-id">🏠 <b>대시보드</b> — 오늘 무엇이 급한지 AI가 먼저 알려주는 자리입니다.
      <span class="ask" id="askInfo">· 이 화면 설명 듣기</span></div>

    <!-- 시작 가이드 슬롯 — onboarding.js가 처음 쓰는 사람에게만 여기 인라인으로 넣는다 -->
    <div id="gijoObSlot"></div>

    <div class="brief dim" id="brief">
      <div class="who"><span class="dot"></span><span id="briefWho">AI 팀 브리핑</span><span class="by" id="briefBy"></span></div>
      <div class="tx" id="briefTx">오늘 상황을 확인하는 중입니다…</div>
      <div class="acts" id="briefActs"></div>
    </div>

    <div class="grid">
      <div class="card"><h3>🔥 급한 것 <span class="cnt" id="urgentCnt"></span></h3>
        <div id="urgentList"><div class="empty">불러오는 중…</div></div></div>

      <div class="card"><h3>☑ 오늘 할 일 <span class="cnt" id="taskCnt"></span></h3>
        <div id="taskList"><div class="empty">불러오는 중…</div></div>
        <div class="addrow"><input id="taskNew" placeholder="할 일 적기" maxlength="200"><button id="taskAdd">추가</button></div></div>

      <div class="card"><h3>📊 한눈에</h3>
        <div id="kpiBox"><div class="empty">불러오는 중…</div></div></div>
    </div>
  </div>
</div>

<!-- 화면 설명은 셸 콘솔이 답한다 — chatwidget.js가 embed에서 window.gijoExplain만 노출한다 -->
<div id="gijoChatWidget"></div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  // 화면 열기 — 셸이 있으면 새 탭, 없으면(분리창) 그 자리 이동. 다리는 nav.js가 놓는다.
  function go(page) { if (window.gijoOpenScreen) window.gijoOpenScreen(page); else location.href = page; }

  // today 항목 id 접두사 → 실제로 조치하는 화면. 브리핑 버튼과 급한 것 목록이 같은 규칙을 쓴다.
  function screenOf(id) {
    var s = String(id || "");
    if (s.indexOf("vulnhost:") === 0) return "vulnscan.html";
    if (s.indexOf("hardening:") === 0) return "hardening.html";
    if (s.indexOf("maint:") === 0) return "opsguide.html";
    return "approvals.html";
  }

  // ── 브리핑 ────────────────────────────────────────────────────────────
  // 두 번 부른다: brief=0으로 즉답을 먼저 그리고(목록·버튼이 바로 산다), 이어서 brief=1로
  // 로컬 LLM 문장을 받아 갈아 끼운다. LLM이 느리거나 없어도 화면은 이미 쓸 수 있는 상태다.
  var todayCache = null;

  function renderBrief(d, withText) {
    todayCache = d;
    var tx = $("briefTx"), box = $("brief");
    box.classList.remove("dim");
    if (withText && d && d.brief) {
      tx.textContent = d.brief;
      $("briefBy").textContent = d.briefBy === "llm" ? "AI가 작성" : "규칙 요약";
    } else if (!withText) {
      var n = (d && d.counts) ? d.counts.now : 0;
      var t = (d && d.counts) ? d.counts.today : 0;
      tx.textContent = (n + t) === 0
        ? "지금 급한 일은 없습니다. 새로 들어온 취약점도, 기한이 지난 점검도 없습니다."
        : "지금 봐야 할 것 " + n + "건, 오늘 안에 볼 것 " + t + "건입니다. 문장 요약을 만드는 중…";
      $("briefBy").textContent = "";
    }
    if (d && d.generatedAt) {
      var dt = new Date(d.generatedAt);
      $("briefWho").textContent = "AI 팀 브리핑 · " +
        String(dt.getHours()).padStart(2, "0") + ":" + String(dt.getMinutes()).padStart(2, "0") + " 기준";
    }
    renderActs(d);
  }

  // 브리핑 아래 버튼 — 데이터에서 나온 것만 만든다. 할 게 없으면 '다시 만들기'만 남는다.
  function renderActs(d) {
    var wrap = $("briefActs");
    wrap.innerHTML = "";
    var items = (d && d.items) || [];
    function add(label, cls, fn) {
      var b = document.createElement("button");
      b.className = "act" + (cls ? " " + cls : "");
      b.textContent = label;
      b.addEventListener("click", fn);
      wrap.appendChild(b);
      return b;
    }
    var top = null;
    for (var i = 0; i < items.length; i++) { if (items[i].urgency === "now") { top = items[i]; break; } }
    if (!top) top = items[0] || null;
    if (top) add("🔧 이것부터 — " + (top.subtitle || top.title), "", function () { go(screenOf(top.id)); });
    var later = items.length - (top ? 1 : 0);
    if (later > 0) add("나머지 " + later + "건 보기", "ghost", function () { go("approvals.html"); });
    add("브리핑 다시 만들기", "ghost", function (e) {
      e.currentTarget.disabled = true;
      $("briefTx").textContent = "다시 만드는 중…";
      loadToday(true);
    });
  }

  async function loadToday(force) {
    if (!window.gijo || !window.gijo.getToday) return;
    try {
      if (!force) {
        renderBrief(await window.gijo.getToday(false), false);   // 즉답 — 목록·버튼이 먼저 산다
        renderUrgent(todayCache);
      }
      renderBrief(await window.gijo.getToday(true), true);       // 문장 — 로컬 LLM
      renderUrgent(todayCache);
    } catch (e) {
      $("brief").classList.add("dim");
      $("briefTx").textContent = "오늘 상황을 불러오지 못했습니다 — 서버 연결을 확인하세요.";
      $("briefActs").innerHTML = "";
      $("urgentList").innerHTML = '<div class="empty">불러오지 못했습니다.</div>';
    }
  }

  // ── 급한 것 ──────────────────────────────────────────────────────────
  function renderUrgent(d) {
    var box = $("urgentList"), items = (d && d.items) || [];
    $("urgentCnt").textContent = items.length ? String(items.length) : "";
    if (!items.length) {
      box.innerHTML = '<div class="empty">급한 항목이 없습니다.<br>취약점 스캔 결과나 점검 일정이 들어오면 여기 쌓입니다.</div>';
      return;
    }
    box.innerHTML = items.slice(0, 8).map(function (i) {
      var dot = i.urgency === "now" ? "red" : (i.axis === "device" ? "amber" : "blue");
      var tag = (i.badges && i.badges[0]) || (i.urgency === "now" ? "지금" : "오늘");
      return '<div class="li go" data-page="' + esc(screenOf(i.id)) + '" title="' + esc(i.why || "") + '">' +
        '<span class="b ' + dot + '"></span>' +
        '<span class="tx">' + esc(i.subtitle || i.title) + " — " + esc(i.title) + "</span>" +
        '<span class="m">' + esc(tag) + "</span></div>";
    }).join("");
  }
  $("urgentList").addEventListener("click", function (e) {
    var row = e.target.closest(".li.go");
    if (row) go(row.dataset.page);
  });

  // ── 오늘 할 일 ───────────────────────────────────────────────────────
  var P_ORDER = { P0: 0, P1: 1, P2: 2, P3: 3 };
  function rank(p) { return P_ORDER[p] != null ? P_ORDER[p] : 9; }
  // 세 카드는 나란히 서야 읽힌다. 할 일이 쌓이면(운영 DB에 1,689건이 있었다) 이 카드만
  // 세로로 늘어나 옆 카드가 허공에 뜬다 — 기본은 급한 순 7건만 보이고 나머지는 펼쳐서 본다.
  var TASK_HEAD = 7, taskAll = false;
  async function loadTasks() {
    var box = $("taskList");
    if (!window.gijo || !window.gijo.listTasks) return;
    try {
      var all = (await window.gijo.listTasks()) || [];
      var open = all.filter(function (t) { return !t.done; }).sort(function (a, b) {
        return rank(a.priority) - rank(b.priority) || (a.dueAt || Infinity) - (b.dueAt || Infinity);
      });
      var done = all.filter(function (t) { return t.done; }).sort(function (a, b) { return b.createdAt - a.createdAt; });
      // 배지는 "남은 건수" — 완료가 1,677건이라는 사실은 오늘 할 일을 고르는 데 도움이 안 된다.
      $("taskCnt").textContent = open.length ? "남은 " + open.length + "건" : (all.length ? "다 했습니다" : "");
      if (!all.length) { box.innerHTML = '<div class="empty">할 일이 없습니다. 아래에 적어 두면 여기 남습니다.</div>'; return; }
      var shown = taskAll ? open : open.slice(0, TASK_HEAD);
      var rest = open.length - shown.length;
      var h = shown.concat(done.slice(0, 3)).map(function (t) {
        return '<div class="li' + (t.done ? " done" : "") + '" data-id="' + esc(t.id) + '">' +
          '<input type="checkbox" class="ck"' + (t.done ? " checked" : "") + ' title="완료 표시">' +
          '<span class="tx" title="' + esc(t.text) + '">' + esc(t.text) + "</span>" +
          '<span class="m">' + esc(t.done ? "완료" : (t.priority || "")) + "</span></div>";
      }).join("");
      if (rest > 0) h += '<div class="more" id="taskMore">남은 ' + rest + "건 더 보기</div>";
      else if (taskAll && open.length > TASK_HEAD) h += '<div class="more" id="taskMore">접기</div>';
      box.innerHTML = h;
      var more = $("taskMore");
      if (more) more.addEventListener("click", function () { taskAll = !taskAll; loadTasks(); });
    } catch (e) {
      box.innerHTML = '<div class="empty">할 일을 불러오지 못했습니다.</div>';
    }
  }
  $("taskList").addEventListener("change", async function (e) {
    if (!e.target.classList.contains("ck")) return;
    var row = e.target.closest(".li");
    try { await window.gijo.toggleTask(row.dataset.id, e.target.checked); } catch (err) {}
    loadTasks();
  });
  async function addTask() {
    var el = $("taskNew"), text = el.value.trim();
    if (!text) return;
    el.value = "";
    try { await window.gijo.addTask(text); } catch (e) {}
    loadTasks();
  }
  $("taskAdd").addEventListener("click", addTask);
  $("taskNew").addEventListener("keydown", function (e) { if (e.key === "Enter") addTask(); });

  // ── 한눈에 ───────────────────────────────────────────────────────────
  // 서버 KPI에 실제로 있는 값만 쓴다. 없는 항목은 줄 자체를 안 만든다(빈칸에 0을 채우지 않는다).
  var BAND = { good: "양호", fair: "보통", poor: "미흡" };
  var BAND_COLOR = { good: "var(--teal)", fair: "var(--amber)", poor: "#f5928a" };
  async function loadKpi() {
    var box = $("kpiBox");
    if (!window.gijo || !window.gijo.getSecurityKpi) return;
    try {
      var k = ((await window.gijo.getSecurityKpi()) || {}).current || {};
      var h = "";
      if (k.posture) {
        h += '<div style="padding:4px 0 8px"><span class="big" style="color:' + (BAND_COLOR[k.posture.band] || "var(--muted)") + '">' +
          Math.round(k.posture.score) + '</span> <span style="font-size:11px;color:var(--muted)">/100 보안 태세 · ' +
          (BAND[k.posture.band] || "-") + "</span></div>";
      }
      function kv(label, val, color) {
        if (val == null) return;
        h += '<div class="kv"><span>' + label + '</span><b' + (color ? ' style="color:' + color + '"' : "") + ">" + val + "</b></div>";
      }
      if (k.vulnerabilities) {
        kv("미조치 취약점", k.vulnerabilities.active.toLocaleString(), "#f5928a");
        if (k.vulnerabilities.kev) kv("실제 악용(KEV)", k.vulnerabilities.kev, "#f5928a");
      }
      if (k.remediation && k.remediation.overdue) kv("기한 지난 조치", k.remediation.overdue, "var(--amber)");
      if (k.findings) kv("승인 대기", k.findings.pending);
      if (k.assets) kv("자산", k.assets.total);
      // coverageRate는 서버에서 이미 0~100 퍼센트로 계산해 온다(engine/kpi.ts의 compRate).
      // 여기서 100을 또 곱해 1400%가 찍힌 적이 있다 — 소수 비율로 넘겨받는다고 넘겨짚었다.
      if (k.compliance) kv("컴플라이언스", Math.round(k.compliance.coverageRate) + "%");
      box.innerHTML = h || '<div class="empty">아직 집계할 데이터가 없습니다.</div>';
      box.style.cursor = "pointer";
      box.title = "보안 KPI 화면으로";
    } catch (e) {
      box.innerHTML = '<div class="empty">지표를 불러오지 못했습니다.</div>';
    }
  }
  $("kpiBox").addEventListener("click", function () { go("kpi.html"); });

  // ⓘ — 화면 설명은 셸 콘솔이 답한다(프로젝트 원칙: 화면엔 정체성 한 줄만)
  $("askInfo").addEventListener("click", function () {
    if (window.gijoExplain) window.gijoExplain("대시보드");
  });

  // 자산이 바뀌면(스캔 인입 등) 브리핑·지표가 낡는다 — 알림이 오면 다시 읽는다.
  if (window.gijo && window.gijo.onAssetUpdated) {
    try { window.gijo.onAssetUpdated(function () { loadToday(false); loadKpi(); }); } catch (e) {}
  }

  loadToday(false);
  loadTasks();
  loadKpi();
})();
</script>
<script src="onboarding.js"></script>
<script src="nav.js"></script>
<script src="titlebar.js"></script>
<script src="chatwidget.js"></script>
</body>
