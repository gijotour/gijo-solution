<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIJO AS Lite — 작업 내역</title>
<link rel="stylesheet" href="gijo-ui.css">
<!--
  lite-records.html — 라이트 「작업 내역」(메뉴 2).

  ■ 본은 records.html이지만 그 파일은 76줄짜리 **허브 껍데기**다 — 내용은 공용 모듈
    (grouphub·grouppanels·workflowrail·chatwidget·titlebar)에 있고, 그 모듈들은
    감사 기록·시스템 로그 패널까지 함께 얹는다. 라이트에 필요 없는 것들이다.
    그래서 여기서는 **API를 직접 부른다**: GET /api/tasks · GET /api/work-sessions.
    ⚠ 논리를 복사한 것이 아니다 — 계산은 서버가 하고 이 화면은 그리기만 한다.

  ■ 라이트에서 뺀 것: 담당자 배정 · 결재 · 감사 기록 패널 · 시스템 로그 패널.
    앞의 둘은 여럿이 써야 뜻이 있고(1인용엔 없는 절차), 뒤의 둘은 운영자용이다.

  ■ ⚠ **0건일 때 「없다」고 하지 않는다.** 라이트 첫 실행이 정확히 0건 상태다 —
    고객이 처음 보는 화면이 여기다. 「아직 안 넣었다」로 말한다(win 2026-08-12 수리와 같은 규칙).
-->
<style>
  :root{--bg:#262624;--panel:#30302e;--border:rgba(255,255,255,.09);--text:#e9e7e2;--muted:#b3ada4;--muted-2:#a49d95;--blue:#3b82f6;--teal:#1eb980;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Pretendard","Malgun Gothic","Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:13px}
  .wrap{padding:18px 22px;display:flex;flex-direction:column;gap:16px;height:100vh;overflow:auto}
  .scr-id{font-size:12.5px;color:var(--muted)}
  .scr-id b{color:var(--text);font-weight:800}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
  .card > h2{font-size:13px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .count{font-size:11.5px;color:var(--muted);font-weight:600}

  .add{display:flex;gap:8px;margin-bottom:10px}
  .add input{flex:1;background:#262624;border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font:inherit}
  .add button{background:var(--blue);border:0;border-radius:8px;padding:8px 14px;color:#fff;font:inherit;font-weight:700;cursor:pointer}
  .add button:disabled{opacity:.5;cursor:default}

  ul{list-style:none}
  li{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--border)}
  li:last-child{border-bottom:0}
  li .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  li.done .t{opacity:.5;text-decoration:line-through}
  li .p{font-size:11px;color:var(--muted-2);flex:0 0 24px}
  li button{background:transparent;border:1px solid var(--border);border-radius:6px;padding:3px 9px;color:var(--muted);font:inherit;font-size:11.5px;cursor:pointer}
  li button:hover{color:var(--text);border-color:var(--blue)}

  .sess{display:flex;flex-direction:column;gap:2px;padding:9px 2px;border-bottom:1px solid var(--border)}
  .sess:last-child{border-bottom:0}
  .sess .h{display:flex;gap:8px;align-items:baseline}
  .sess .h b{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sess .m{font-size:11.5px;color:var(--muted-2);flex:0 0 auto}
  .sess .pv{font-size:11.5px;color:var(--muted-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .st{font-size:11px;padding:1px 7px;border-radius:999px;flex:0 0 auto}
  .st.active{background:rgba(59,130,246,.18);color:var(--blue)}
  .st.done{background:rgba(30,185,128,.16);color:var(--teal)}

  /* ⚠ 0건 자리 — 「없다」가 아니라 「아직 안 넣었다」 */
  .empty{font-size:12.5px;color:var(--muted);line-height:1.75;padding:6px 2px}
  .empty b{color:var(--text)}
  .err{font-size:12.5px;color:#e2483d;padding:6px 2px}
</style>
</head>
<body>
<div class="wrap">
  <div class="scr-id"><b>작업 내역</b> — 내 할 일과 지금까지의 대화를 봅니다.</div>

  <section class="card">
    <h2>내 할 일 <span class="count" id="taskCount"></span></h2>
    <div class="add">
      <input id="taskInput" type="text" placeholder="할 일을 적고 Enter" aria-label="할 일 입력">
      <button id="taskAdd" type="button">담기</button>
    </div>
    <div id="taskBox"><div class="empty">불러오는 중…</div></div>
  </section>

  <section class="card">
    <h2>작업 내역 <span class="count" id="sessCount"></span></h2>
    <div id="sessBox"><div class="empty">불러오는 중…</div></div>
  </section>
</div>

<script>
// lite-records.js — 라이트 「작업 내역」 화면 (메뉴 2).
//
// ■ 부르는 것 — **preload 다리만 쓴다**(생 fetch 금지, 아래 `다리()` 주석 참고):
//   window.gijo.listTasks() · addTask(text) · completeTask(id) · toggleTask(id,false)
//   window.gijo.listWorkSessions()
//   ⚠ 응답 모양은 실제로 재서 맞췄다(2026-08-12) — 넘겨짚으면 빈칸이 난다:
//     tasks:    id · priority · text · done · createdAt
//     sessions: id · title · status · doneBy · createdBy · createdAt · updatedAt ·
//               turnCount · lastPreview · lastRole
//
// ■ ⚠ **0건일 때 「없다」고 하지 않는다.** 라이트 첫 실행이 정확히 0건이고 고객이 처음
//   보는 화면이 여기다. 「없습니다」는 「이 제품엔 그 기능이 없구나」로 읽힌다 —
//   win이 2026-08-12에 본 제품 7자리를 같은 이유로 고쳤다. 라이트는 처음부터 그렇게 쓴다.

(function () {
  "use strict";

  var esc = function (v) {
    return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };

  // ⚠ **생 fetch를 쓰지 않는다.** 화면은 API를 preload 다리(window.gijo)로 부른다 —
  //   토큰·갱신·오류 처리가 거기 한 곳에 있다. 화면마다 fetch를 쓰면 토큰을 만지는 자리가
  //   화면 수만큼 생긴다. (2026-08-12: 처음에 fetch로 짰다가 인증이 안 붙는 걸 확인하고 고쳤다.)
  function 다리() {
    var g = window.gijo;
    if (!g || !g.listTasks || !g.listWorkSessions) return null;
    return g;
  }

  // ⚠ **401을 「서버 오류」라고 말하지 않는다.** 로그인이 안 된 것과 서버가 고장 난 것은
  //   담당자가 할 일이 전혀 다르다. 2026-08-12 앱에서 실제로 「서버 오류 401」이 떠 고쳤다 —
  //   「0건 ≠ 없음」과 같은 계열이다: **상태를 뭉뚱그리면 사람이 엉뚱한 데를 본다.**
  function 오류문구(e, 무엇) {
    var m = String((e && e.message) || e || "");
    if (/401|unauthorized/i.test(m)) return "로그인이 풀렸습니다 — 다시 로그인해 주세요.";
    if (/403|forbidden/i.test(m)) return "이 계정에는 열람 권한이 없습니다.";
    if (/fetch|network|ECONN|Failed to fetch/i.test(m)) return "서버에 닿지 못했습니다 — 서버가 켜져 있는지 확인해 주세요.";
    return 무엇 + "을 못 읽었습니다 — " + esc(m);
  }

  function 날짜(ms) {
    if (!ms) return "";
    var d = new Date(Number(ms));
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  // ── 내 할 일 ────────────────────────────────────────────────────────
  async function 할일그리기() {
    var box = document.getElementById("taskBox");
    var cnt = document.getElementById("taskCount");
    var list;
    var g = 다리();
    if (!g) { box.innerHTML = 다리없음(); return; }
    try { list = await g.listTasks(); }
    catch (e) { box.innerHTML = '<div class="err">' + 오류문구(e, "할 일") + "</div>"; return; }
    if (!Array.isArray(list)) list = [];

    cnt.textContent = list.length ? list.filter(function (t) { return !t.done; }).length + " / " + list.length : "";

    if (!list.length) {
      // ⚠ 「할 일이 없습니다」로 쓰지 않는다 — 안 넣은 것과 없는 것은 다르다.
      box.innerHTML =
        '<div class="empty"><b>아직 담은 할 일이 없습니다.</b><br>' +
        "위 칸에 적으면 여기 쌓입니다. 대화창에서 「할 일 담기: …」라고 말해도 됩니다.</div>";
      return;
    }

    var ul = document.createElement("ul");
    list.slice().sort(function (a, b) { return (a.done ? 1 : 0) - (b.done ? 1 : 0) || b.createdAt - a.createdAt; })
      .forEach(function (t) {
        var li = document.createElement("li");
        if (t.done) li.className = "done";
        li.innerHTML =
          '<span class="p">' + esc(t.priority || "") + "</span>" +
          '<span class="t" title="' + esc(t.text) + '">' + esc(t.text) + "</span>";
        var b = document.createElement("button");
        b.type = "button";
        b.textContent = t.done ? "다시 열기" : "완료";
        b.addEventListener("click", function () { 바꾸기(t); });
        li.appendChild(b);
        ul.appendChild(li);
      });
    box.innerHTML = "";
    box.appendChild(ul);
  }

  async function 바꾸기(t) {
    // 완료는 completeTask, 되돌리기는 toggleTask(id, false) — 서버가 그렇게 갈라 뒀다.
    var g = 다리(); if (!g) return;
    try { t.done ? await g.toggleTask(t.id, false) : await g.completeTask(t.id); }
    catch (e) { alert(오류문구(e, "할 일")); return; }
    await 할일그리기();
  }

  async function 담기() {
    var input = document.getElementById("taskInput");
    var btn = document.getElementById("taskAdd");
    var text = String(input.value || "").trim();
    if (!text) return;
    btn.disabled = true;
    var g = 다리();
    try { if (g) await g.addTask(text); input.value = ""; }
    catch (e) { alert(오류문구(e, "할 일")); }
    finally { btn.disabled = false; }
    await 할일그리기();
    input.focus();
  }

  // ── 작업 내역 ───────────────────────────────────────────────────────
  async function 내역그리기() {
    var box = document.getElementById("sessBox");
    var cnt = document.getElementById("sessCount");
    var list;
    var g = 다리();
    if (!g) { box.innerHTML = 다리없음(); return; }
    try { list = await g.listWorkSessions(); }
    catch (e) { box.innerHTML = '<div class="err">' + 오류문구(e, "작업 내역") + "</div>"; return; }
    if (!Array.isArray(list)) list = [];

    cnt.textContent = list.length ? list.length + "건" : "";

    if (!list.length) {
      box.innerHTML =
        '<div class="empty"><b>아직 쌓인 작업 내역이 없습니다.</b><br>' +
        "대화창에서 무언가를 물으면 그 대화가 여기 한 건으로 남습니다.</div>";
      return;
    }

    // 최근 것부터 30건 — 1인용이라 그 이상은 스크롤만 길어진다.
    var 보일것 = list.slice().sort(function (a, b) { return (b.updatedAt || 0) - (a.updatedAt || 0); }).slice(0, 30);
    box.innerHTML = 보일것.map(function (s) {
      var 상태 = s.status === "done" ? "done" : "active";
      return (
        '<div class="sess">' +
          '<div class="h">' +
            '<b title="' + esc(s.title) + '">' + esc(s.title) + "</b>" +
            '<span class="st ' + 상태 + '">' + (상태 === "done" ? "완료" : "진행중") + "</span>" +
            '<span class="m">' + esc(날짜(s.updatedAt || s.createdAt)) + " · " + esc(s.turnCount || 0) + "턴</span>" +
          "</div>" +
          (s.lastPreview ? '<div class="pv">' + esc(s.lastPreview) + "</div>" : "") +
        "</div>"
      );
    }).join("");
    if (list.length > 보일것.length) {
      box.insertAdjacentHTML("beforeend",
        '<div class="empty" style="padding-top:10px">최근 ' + 보일것.length + "건만 보입니다(전체 " + list.length + "건).</div>");
    }
  }

  // 다리가 없으면(브라우저로 파일만 연 경우) 조용히 빈칸을 두지 않는다 — 왜 비었는지 적는다.
  function 다리없음() {
    return '<div class="err">앱 밖에서 열려 있어 데이터를 못 읽습니다 — GIJO AS 앱에서 열어 주세요.</div>';
  }

  function 시작() {
    document.getElementById("taskAdd").addEventListener("click", 담기);
    document.getElementById("taskInput").addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); 담기(); }
    });
    할일그리기();
    내역그리기();
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", 시작);
  else 시작();
})();
</script>
</body>
</html>
