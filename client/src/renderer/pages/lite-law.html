<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIJO AS Lite — 법령 판례 조회</title>
<link rel="stylesheet" href="gijo-ui.css">
<!--
  lite-law.html — 라이트 「법령 판례 조회」(메뉴 6).
  사장님 말: 「개인이 계정받아서 등록」 · 결정 ②: 기본 꺼짐 + 켜면 조회 + 꺼져도 번들로 답함

  ■ ⚠ 라이트에서 **유일하게 바깥과 통신하는 화면**이다. 온프렘 원칙과 부딪히는 자리라
    ① 기본은 꺼져 있고 ② 꺼진 채로도 쓸모가 있어야 한다.

  ■ ★ 꺼진 상태가 「못 쓰는 상태」가 아니다 — 번들 문서(보안규제_법적근거_모음.md)로 답한다.
    registry.ts:1509가 그 원칙을 적어 뒀다: **「꺼진 기능이 멀쩡하던 답을 빼앗으면 안 된다」**
    그래서 이 화면은 **끈 상태를 기본 동작으로** 짜고, 켜면 바깥 조회가 얹힌다.

  ■ 다리: lawConfig · lawSearch · queryMemory(번들 근거)
-->
<style>
  :root{--bg:#EBF4EB;--panel:#FFFFFF;--border:rgba(24,48,16,.14);--text:#16241A;--muted:#55684C;--muted-2:#5C6F52;--blue:#2563EB;--teal:#0D6B37;--red:#B3261E;--amber:#7A4E00;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Pretendard","Malgun Gothic","Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:13px;overflow-y:auto}
  .wrap{padding:18px 22px 40px;display:flex;flex-direction:column;gap:14px;max-width:900px}
  .scr-id{font-size:12.5px;color:var(--muted)}
  .scr-id b{color:var(--text);font-weight:800}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
  .card h2{font-size:13px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:8px}
  .card .sub{font-size:11.5px;color:var(--muted-2);margin-bottom:10px;line-height:1.6}
  .ask{display:flex;gap:8px;margin-bottom:6px}
  .ask input{flex:1;background:#EBF4EB;border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font:inherit}
  button{background:transparent;border:1px solid var(--border);border-radius:8px;padding:7px 13px;color:var(--text);font:inherit;font-size:12.5px;cursor:pointer}
  button.go{background:var(--blue);border-color:var(--blue);color:var(--text);font-weight:700}
  button:disabled{opacity:.5;cursor:default}
  .pill{font-size:11px;padding:1px 8px;border-radius:999px}
  .pill.on{background:rgba(30,185,128,.16);color:var(--teal)}
  .pill.off{background:rgba(240,160,32,.16);color:var(--amber)}
  .hit{padding:10px 0;border-bottom:1px solid var(--border);font-size:12.5px;line-height:1.75;white-space:pre-wrap}
  .hit:last-child{border-bottom:0}
  .src{font-size:11.5px;color:var(--muted-2);margin-bottom:6px}
  .empty{font-size:12.5px;color:var(--muted);line-height:1.75;padding:6px 2px}
  .empty b{color:var(--text)}
  .err{font-size:12.5px;color:var(--red);padding:6px 2px}
  .note{font-size:11.5px;color:var(--muted-2);line-height:1.7;margin-top:8px}
  .note b{color:var(--text)}
</style>
</head>
<body>
<div class="wrap">
  <div class="scr-id"><b>법령 판례 조회</b> — 규정 근거를 찾습니다.</div>

  <section class="card">
    <h2>찾기 <span class="pill" id="pill">확인 중</span></h2>
    <div class="sub" id="sub">…</div>
    <div class="ask">
      <input id="q" type="text" placeholder="예: 개인정보 유출되면 며칠 안에 신고해야 돼?" aria-label="질문">
      <button class="go" id="go">찾기</button>
    </div>
    <div id="out"></div>
  </section>

  <section class="card">
    <h2>바깥 조회를 켜면</h2>
    <div id="cfgBox">불러오는 중…</div>
  </section>
</div>

<script>
// lite-law — 꺼진 상태를 **기본 동작**으로 짠다. 켜면 바깥 조회가 얹힌다.
(function () {
  "use strict";
  var g = window.gijo || null;
  var 켜짐 = false;
  var esc = function (v) { return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  function 오류문구(e, 무엇) {
    var m = String((e && e.message) || e || "");
    if (/401|unauthorized/i.test(m)) return "로그인이 풀렸습니다 — 다시 로그인해 주세요.";
    if (/403|forbidden/i.test(m)) return "이 계정에는 권한이 없습니다.";
    if (/fetch|network|ECONN/i.test(m)) return "서버에 닿지 못했습니다 — 서버가 켜져 있는지 확인해 주세요.";
    return 무엇 + "을 못 했습니다 — " + esc(m);
  }
  // 조각을 읽히게 다듬는다(다른 라이트 화면과 같은 규칙 — 날것 마크다운은 못 읽는다).
  function 다듬기(t) {
    return String(t || "").split("\n")
      .filter(function (l) { return !/^!\[/.test(l.trim()); })
      .filter(function (l) { return !/^[\s|:-]+$/.test(l); })
      .map(function (l) {
        var s = l.replace(/\*\*/g, "").replace(/^#{1,6}\s*/, "");
        if (/^\s*\|.*\|\s*$/.test(s)) s = s.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|")
          .map(function (c) { return c.trim(); }).filter(Boolean).join(" · ");
        return s;
      }).join("\n").replace(/\n{3,}/g, "\n\n").trim();
  }
  if (!g) {
    document.getElementById("cfgBox").innerHTML = '<div class="err">앱 밖에서 열려 있어 데이터를 못 읽습니다 — GIJO AS 앱에서 열어 주세요.</div>';
    return;
  }

  async function 상태() {
    try {
      var c = await g.lawConfig();
      켜짐 = !!(c && c.enabled);
      var pill = document.getElementById("pill");
      pill.textContent = 켜짐 ? "바깥 조회 켜짐" : "번들 문서로 답함";
      pill.className = "pill " + (켜짐 ? "on" : "off");
      document.getElementById("sub").innerHTML = 켜짐
        ? "국가법령정보센터에서 원문을 가져오고, 우리 번들 문서도 함께 봅니다."
        : "<b>바깥 조회는 꺼져 있습니다 — 그래도 답합니다.</b> 제품에 들어 있는 규제 근거 문서로 찾습니다.";
      document.getElementById("cfgBox").innerHTML = 켜짐
        ? '<div class="empty">켜져 있습니다. 끄거나 키를 바꾸려면 <b>⚙ 설정 → 법령·판례 조회</b>에서 하세요.</div>'
        : '<div class="empty"><b>아직 안 켰습니다.</b><br>국가법령정보센터 인증키를 개인으로 받아 <b>⚙ 설정 → 법령·판례 조회</b>에 넣으면 켜집니다.<br>' +
          '켜면 <b>이 기능만</b> 바깥으로 나갑니다 — 나머지는 이 PC 안에 그대로 있습니다.</div>';
    } catch (e) { document.getElementById("cfgBox").innerHTML = '<div class="err">' + 오류문구(e, "설정") + "</div>"; }
  }

  async function 찾기() {
    var q = String(document.getElementById("q").value || "").trim();
    var out = document.getElementById("out"), btn = document.getElementById("go");
    if (!q) return;
    btn.disabled = true; out.innerHTML = '<div class="empty">찾는 중…</div>';
    var 덩이 = [];

    // ① 번들 근거는 **항상** 먼저 본다 — 켜져 있든 아니든. 우리 문서가 우리 판단의 근거다.
    try {
      // ⚠ topK를 3으로 두면 **정답 조각이 잘린다.** 2026-08-12 max 실측:
      //   「개인정보 유출되면 며칠 안에 신고해야 돼?」에서 **72시간이 든 조각이 4~5위**였다.
      //   win이 시드 origin을 고쳐 그 순위를 끌어올렸지만(2026-08-12), 재인입 전 저장소에서는
      //   여전히 밀린다. 법령은 **틀린 값을 자신 있게 말하면 가장 위험한 자리**라 넉넉히 본다.
      var hits = await g.queryMemory(q, 6);
      var arr = (Array.isArray(hits) ? hits : []).map(function (h) { return typeof h === "string" ? h : (h.text || ""); }).filter(Boolean);
      if (arr.length) 덩이.push('<div class="src">📘 제품에 들어 있는 규제 근거 문서</div>' +
        arr.map(function (t) { var c = 다듬기(t); return '<div class="hit">' + esc(c.slice(0, 800)) + (c.length > 800 ? " …" : "") + "</div>"; }).join(""));
    } catch (e) { 덩이.push('<div class="err">' + 오류문구(e, "번들 근거") + "</div>"); }

    // ② 켜져 있을 때만 바깥을 본다.
    if (켜짐) {
      try {
        var r = await g.lawSearch(q, undefined, 3);
        var list = Array.isArray(r) ? r : (r.results || r.items || []);
        덩이.push('<div class="src" style="margin-top:14px">🌐 국가법령정보센터</div>' + (list.length
          ? list.map(function (x) {
              var 제목 = x.title || x.name || x.법령명 || "";
              var 몸 = x.summary || x.content || x.조문내용 || "";
              return '<div class="hit"><b>' + esc(제목) + "</b>\n" + esc(String(몸).slice(0, 600)) + "</div>";
            }).join("")
          : '<div class="empty">바깥에서는 걸리는 것이 없었습니다.</div>'));
      } catch (e) { 덩이.push('<div class="err">' + 오류문구(e, "바깥 조회") + "</div>"); }
    }

    out.innerHTML = 덩이.length ? 덩이.join("") :
      '<div class="empty"><b>이 물음에 닿는 근거를 못 찾았습니다.</b><br>말을 조금 바꿔 보시거나, 바깥 조회를 켜면 원문까지 찾습니다.</div>';
    if (!켜짐) out.insertAdjacentHTML("beforeend",
      '<div class="note">⚠ 여기 나온 것은 <b>제품에 들어 있는 문서</b>입니다. 원문·최신 개정은 바깥 조회를 켜야 확인됩니다 — ' +
      "법적 판단이 걸린 자리에서는 원문을 보세요.</div>");
    btn.disabled = false;
  }

  function 시작() {
    document.getElementById("go").addEventListener("click", 찾기);
    document.getElementById("q").addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); 찾기(); } });
    상태();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", 시작);
  else 시작();
})();
</script>
</body>
</html>
