<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>GIJO AS — 처음 설정</title>
<!--
  첫 설치 화면 (2026-08-09 신설).

  왜 있나 — 실측으로 드러난 것: 배포본이 고객 기계에 **jyh / changeme** 를 만들고 있었다.
  users.ts의 computeInitialAdmin은 「운영이면 랜덤 비번을 만들어 콘솔에 1회 출력」하는데,
  그 갈래는 NODE_ENV==="production" 일 때만 돌고 Electron은 그 값을 설정하지 않는다.
  그래서 개발용 기본값이 그대로 나갔고, 고객 화면에 **개발자 이름**이 떴다.
  게다가 로그인 화면은 초기 계정을 알려주지 않으니 고객은 들어갈 방법이 없었다.

  ⚠ 랜덤 비번으로 바꾸는 것만으로는 **더 나빠진다** — 그 값이 찍히는 콘솔을 GUI 고객은
    볼 수 없어 아예 못 들어간다. 그래서 **고객이 직접 정하게** 한다:
    보관할 비밀도, 화면에 띄울 비밀도, 잃어버려 잠기는 경우도 없다.
-->
<style>
  :root {
    --navy: #262624; --blue: #5fa1ff; --teal: #1eb980;
    --text: #e9e7e2; --muted: #b3ada4; --muted2: #a49d95; --border: #3d3c38;
    --amber: #f0a020; --red: #f5928a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 30% 20%, #35342f 0%, var(--navy) 60%);
    font-family: "Pretendard", "Segoe UI", -apple-system, sans-serif;
    color: var(--text);
  }
  .card { width: 420px; max-width: calc(100vw - 40px); }
  .brand { font-size: 12px; font-weight: 800; letter-spacing: 2px; color: var(--muted2); margin-bottom: 6px; }
  h1 { font-size: 21px; margin: 0 0 6px; }
  .sub { font-size: 13px; color: var(--muted); line-height: 1.65; margin-bottom: 18px; }
  label { display: block; font-size: 12.5px; color: var(--muted); margin: 12px 0 5px; }
  input {
    width: 100%; background: #30302e; border: 1px solid var(--border); border-radius: 9px;
    color: var(--text); font-size: 14px; padding: 11px 13px; outline: none; font-family: inherit;
  }
  input:focus { border-color: var(--blue); }
  .hint { font-size: 12px; color: var(--muted2); margin-top: 5px; line-height: 1.6; }
  button {
    width: 100%; margin-top: 20px; background: var(--blue); color: #10233f; border: none;
    border-radius: 9px; font-size: 14px; font-weight: 800; padding: 12px; cursor: pointer; font-family: inherit;
  }
  button:disabled { opacity: .5; cursor: default; }
  .msg { margin-top: 12px; font-size: 12.5px; line-height: 1.6; min-height: 18px; }
  .msg.bad { color: var(--red); }
  .msg.busy { color: var(--muted); }
  .note {
    margin-top: 16px; padding: 10px 12px; border-left: 3px solid var(--amber);
    background: rgba(240,160,32,.07); border-radius: 8px; font-size: 12.25px; line-height: 1.7; color: var(--muted);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">AI SECURITY MANAGER</div>
    <h1>처음 설정 — 관리자 계정 만들기</h1>
    <div class="sub">이 기계에서 쓸 관리자 계정을 정하세요. 여기서 정한 값 외에 기본 비밀번호는 없습니다.</div>

    <label for="id">아이디</label>
    <input id="id" autocomplete="off" spellcheck="false" placeholder="admin" />
    <div class="hint">영문·숫자와 <code>. _ -</code> 로 3~32자</div>

    <label for="pw">비밀번호</label>
    <input id="pw" type="password" autocomplete="new-password" />
    <div class="hint">8자 이상(제품 최소). <b>12자 이상을 권합니다</b> — 이 계정은 모든 자산·취약점 정보를 봅니다.</div>

    <label for="pw2">비밀번호 확인</label>
    <input id="pw2" type="password" autocomplete="new-password" />

    <button id="go">계정 만들고 시작하기</button>
    <div class="msg" id="msg"></div>

    <div class="note">
      이 비밀번호는 <b>이 기계에만</b> 저장되고 공급사도 알 수 없습니다.
      잊으면 되돌릴 방법이 없어 데이터를 지우고 다시 설치해야 합니다.
    </div>
  </div>

<script>
  var id = document.getElementById("id");
  var pw = document.getElementById("pw");
  var pw2 = document.getElementById("pw2");
  var go = document.getElementById("go");
  var msg = document.getElementById("msg");

  function 알림(글, 종류) { msg.textContent = 글; msg.className = "msg" + (종류 ? " " + 종류 : ""); }

  async function 만들기() {
    // ⚠ 검사는 여기서도 하고 메인 프로세스에서도 한다. 다만 **여기가 더 엄해서는 안 된다** —
    //   화면이 막았는데 서버는 받는 값이 생기면 사람이 이유를 알 수 없다.
    var 아이디 = (id.value || "").trim();
    if (!/^[A-Za-z0-9._-]{3,32}$/.test(아이디)) return 알림("아이디는 영문·숫자와 . _ - 만 쓸 수 있고 3~32자입니다.", "bad");
    if ((pw.value || "").length < 8) return 알림("비밀번호는 8자 이상이어야 합니다.", "bad");
    if (pw.value !== pw2.value) return 알림("두 비밀번호가 다릅니다.", "bad");

    go.disabled = true;
    알림("계정을 만들고 서버를 시작합니다 — 처음이라 조금 걸립니다(수십 초).", "busy");
    var r;
    try { r = await window.gijo.setupCreateAdmin(아이디, pw.value); }
    catch (e) { r = { ok: false, error: e && e.message }; }

    if (!r || !r.ok) {
      go.disabled = false;
      return 알림((r && r.error) || "설정에 실패했습니다.", "bad");
    }
    // 값이 화면에 남지 않게 지우고 넘어간다.
    pw.value = ""; pw2.value = "";
    알림("완료 — 로그인 화면으로 갑니다.", "busy");
    location.href = "login.html";
  }

  go.addEventListener("click", 만들기);
  for (var el of [id, pw, pw2]) {
    el.addEventListener("keydown", function (e) { if (e.key === "Enter") 만들기(); });
  }
  id.focus();
</script>
</body>
</html>
