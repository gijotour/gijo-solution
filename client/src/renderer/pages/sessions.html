<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIJO AS — 작업 내역</title>
<style>
  :root{
    --bg:#262624;--panel:#30302e;--panel-2:#1f1e1d;--border:rgba(255,255,255,0.08);
    --border-strong:rgba(255,255,255,0.16);--blue:#3b82f6;--blue-light:#5fa1ff;--white:#ffffff;
    --text:#e9e7e2;--muted:#b3ada4;--muted-2:#a49d95;--red:#e2483d;--amber:#f0a020;--teal:#1eb980;--purple:#8b7cf0;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Pretendard","Malgun Gothic","Segoe UI",sans-serif;background:#1a1a19;color:var(--text);}
  .header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--bg);}
  .header-left{display:flex;align-items:center;gap:12px;}
  .header-left img{height:22px;}
  .app-title{font-size:15px;font-weight:800;color:#fff;}
  .clock{font-size:12.5px;color:var(--blue-light);font-weight:600;}
  .header-right{display:flex;align-items:center;gap:10px;}
  .status-pill{display:flex;align-items:center;gap:6px;background:rgba(30,185,128,0.15);border:1px solid rgba(30,185,128,0.4);color:var(--teal);padding:6px 14px;border-radius:20px;font-size:12px;font-weight:800;}
  .status-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);}
  .beta-tag{background:var(--teal);color:#06281c;font-size:11.25px;font-weight:800;padding:1px 6px;border-radius:4px;margin-left:2px;}
  .icon-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
  .icon-btn{width:32px;height:32px;border-radius:8px;background:var(--panel);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted);cursor:pointer;transition:background .12s,border-color .12s,color .12s;}
  .icon-btn:hover,.icon-btn.on{background:rgba(59,130,246,0.18);border-color:var(--blue);color:var(--blue-light);}
  .avatar-btn{width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;}

  .page-head{padding:16px 22px 4px;}
  .page-title{font-size:20px;font-weight:800;color:#fff;}
  .page-sub{font-size:12.5px;color:var(--muted);margin-top:3px;}

  .body-grid{display:grid;grid-template-columns:210px 260px 1fr;gap:12px;padding:14px 22px 22px;min-height:calc(100vh - 120px);}
  .col{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-height:0;}
  .colhead{padding:11px 14px;font-size:12.5px;font-weight:800;color:#fff;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
  .newbtn{background:var(--blue);color:#fff;border:0;border-radius:7px;font-size:12.5px;font-weight:700;padding:5px 11px;cursor:pointer;}
  .newbtn:hover{background:#2f6fd0;}

  /* 탐색기 — 4구획(접기) */
  .tree{padding:6px 6px 10px;overflow-y:auto;font-size:12.5px;}
  .sec{margin-top:3px;}
  .sechead{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:7px;font-weight:800;font-size:12px;color:var(--text);cursor:pointer;}
  .sechead:hover{background:var(--panel-2);}
  .sechead .car{font-size:11.75px;color:var(--muted-2);width:9px;}
  .sechead .c{margin-left:auto;font-size:11.75px;color:var(--muted-2);font-weight:700;}
  .runbtn{margin:5px 8px 3px;display:block;width:calc(100% - 16px);background:rgba(30,185,128,0.14);color:var(--teal);border:1px solid rgba(30,185,128,0.3);border-radius:7px;padding:7px;font-size:12.5px;font-weight:800;cursor:pointer;}
  .runbtn:hover{background:rgba(30,185,128,0.22);}
  .tree-leaf{display:flex;align-items:center;gap:6px;padding:6px 9px 6px 24px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border-radius:6px;}
  .tree-leaf:hover{color:#fff;background:var(--panel-2);}
  .tree-leaf.on{color:#fff;background:rgba(59,130,246,0.12);}
  .tree-empty{padding:4px 9px 4px 24px;color:var(--muted-2);font-size:12.25px;}
  .pri{font-size:11px;font-weight:900;padding:1px 5px;border-radius:4px;flex-shrink:0;}
  .pri.P0{color:#f5928a;background:rgba(226,72,61,0.16);}
  .pri.P1{color:var(--amber);background:rgba(240,160,32,0.14);}
  .pri.P2,.pri.P3{color:var(--muted-2);background:rgba(255,255,255,0.06);}
  /* 상태 카드(첫 assistant 턴) */
  .status-card{background:var(--panel-2);border:1px solid var(--border-strong);border-radius:10px;padding:11px 14px;margin-bottom:8px;}
  .status-card .h{font-weight:800;color:#fff;font-size:12.5px;margin-bottom:6px;}
  .status-card .l{font-size:12.5px;color:var(--muted);line-height:1.75;}
  .status-card .l b{color:var(--text);}
  /* 추천 다음 단계(시안 C) */
  .suggest{padding:2px 16px 12px;}
  .suggest .ask{font-size:12.5px;color:var(--blue-light);font-weight:700;margin:2px 0 8px;}
  .step{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--border);border-radius:9px;padding:9px 12px;margin-bottom:6px;cursor:pointer;}
  .step:hover{border-color:var(--blue);}
  .step .n{width:20px;height:20px;border-radius:50%;background:rgba(59,130,246,0.16);color:var(--blue-light);font-size:12.25px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .step .x{font-size:12px;color:var(--text);font-weight:600;}
  .step .x span{color:var(--muted-2);font-weight:400;font-size:12.25px;}

  /* 세션 목록 */
  .search{margin:9px 11px 4px;display:flex;align-items:center;gap:7px;background:var(--panel-2);border:1px solid var(--border-strong);border-radius:8px;padding:7px 11px;}
  .search input{flex:1;background:transparent;border:0;outline:none;color:var(--text);font-size:12px;}
  .search input::placeholder{color:var(--muted-2);}
  .slist{flex:1;overflow-y:auto;padding:4px 8px 10px;}
  .sitem{padding:9px 10px 9px 12px;border-radius:9px;cursor:pointer;margin-bottom:3px;border:1px solid transparent;display:flex;align-items:center;gap:8px;}
  .sitem:hover{background:var(--panel-2);}
  .sitem.on{background:rgba(59,130,246,0.1);border-color:rgba(59,130,246,0.3);}
  .sitem .t{flex:1;min-width:0;font-weight:700;font-size:12.5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sitem .sdel{flex-shrink:0;font-size:12px;color:var(--muted-2);opacity:0;cursor:pointer;padding:2px 4px;border-radius:5px;}
  .sitem:hover .sdel{opacity:.8;}
  .sitem .sdel:hover{opacity:1;color:#f5928a;background:rgba(226,72,61,0.12);}
  .tag{font-size:11.25px;font-weight:800;padding:2px 7px;border-radius:5px;flex-shrink:0;}
  .tag.active{color:var(--teal);background:rgba(30,185,128,0.14);}
  .tag.done{color:var(--muted-2);background:rgba(255,255,255,0.06);}
  .tag.ignored{color:var(--amber);background:rgba(240,160,32,0.12);}
  .list-empty{padding:22px 14px;color:var(--muted-2);font-size:12px;text-align:center;line-height:1.7;}

  /* 대화 */
  .conv-head{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .conv-head .t{font-weight:800;color:#fff;font-size:14px;}
  .conv-head .t input{background:var(--panel-2);border:1px solid var(--blue);border-radius:6px;padding:3px 8px;color:#fff;font-size:14px;font-weight:800;outline:none;width:320px;}
  .conv-head .m{font-size:12.25px;color:var(--muted);margin-top:3px;}
  .conv-acts{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .ca-btn{background:var(--panel-2);border:1px solid var(--border-strong);color:var(--muted);border-radius:7px;padding:5px 10px;font-size:12.25px;font-weight:700;cursor:pointer;}
  .ca-btn:hover{color:#fff;border-color:var(--blue);}
  .ca-sel{background:var(--panel-2);border:1px solid var(--border-strong);color:var(--text);border-radius:7px;padding:5px 8px;font-size:12.25px;font-weight:700;outline:none;cursor:pointer;}
  .conv{flex:1;overflow-y:auto;padding:16px;min-height:0;}
  .turn{margin-bottom:16px;}
  .you{background:var(--panel-2);border:1px solid var(--border);border-radius:9px;padding:9px 13px;font-size:12.5px;margin-bottom:7px;line-height:1.5;}
  .you b{color:var(--blue-light);}
  .ai{font-size:12.5px;color:var(--muted);line-height:1.7;padding-left:4px;white-space:pre-wrap;}
  .ai .tool{font-size:11.75px;font-weight:800;color:var(--teal);background:rgba(30,185,128,0.12);border-radius:4px;padding:1px 7px;margin-right:6px;}
  .ai.pending{color:var(--blue-light);}
  .conv-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted-2);font-size:13px;gap:10px;text-align:center;}
  .conv-empty .big{font-size:34px;opacity:.5;}
  .cin{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;}
  .cin input{flex:1;background:var(--panel-2);border:1px solid var(--border-strong);border-radius:9px;padding:11px 14px;color:var(--text);font-size:13px;outline:none;}
  .cin input:disabled{opacity:.5;}
  .cin button{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:0 20px;font-weight:800;font-size:13px;cursor:pointer;}
  .cin button:disabled{opacity:.5;cursor:default;}

  /* ── 시안 A(보안 분석 판박이) 레이아웃 ── */
  .app{display:grid;grid-template-columns:220px 1fr;}
  .sidebar{padding:22px 14px;border-right:1px solid var(--border);min-height:820px;}
  .nav-section{font-size:12px;font-weight:700;color:var(--muted-2);letter-spacing:1.2px;margin:16px 10px 8px;}
  .nav-section:first-child{margin-top:0;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:2px;cursor:pointer;}
  .nav-item .ic{width:18px;text-align:center;font-size:14px;}
  .nav-item.active{background:rgba(59,130,246,.12);color:var(--white);box-shadow:inset 3px 0 0 var(--blue);cursor:default;}
  .nav-item:hover:not(.active){background:rgba(255,255,255,.04);color:var(--white);}
  .v3-main{padding:22px 30px 40px;}
  .topbar-row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;gap:16px;}
  .page-sub{max-width:720px;line-height:1.6;}
  .v3-tools{display:flex;gap:8px;align-items:center;flex:none;}
  .btn-primary{background:var(--blue);color:#fff;border:none;padding:9px 15px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;}
  .btn-ghost{background:var(--panel);color:var(--text);border:1px solid var(--border-strong);padding:8px 12px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;outline:none;}
  .btn-danger{background:rgba(226,72,61,.14);color:#f5928a;border:1px solid #e2483d;padding:8px 12px;border-radius:8px;font-size:12px;font-weight:800;cursor:pointer;}
  .two{display:grid;grid-template-columns:1.15fr 1.4fr;gap:16px;align-items:start;}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:15px 17px;}
  .ph{font-size:13.5px;font-weight:800;color:#fff;margin-bottom:10px;}
  .filters{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap;}
  .fchip{font-size:12.5px;padding:5px 11px;border-radius:20px;background:var(--panel-2);border:1px solid var(--border);color:var(--muted);cursor:pointer;}
  .fchip.active{background:rgba(59,130,246,.12);border-color:rgba(59,130,246,.4);color:#fff;}
  /* ── 구분 축(승인 시안 2026-08-18) — 상태 칩(.fchip)과 **다른 모양**으로 둔다.
       같은 모양이면 「상태 필터가 왜 세 줄이지」로 읽힌다. 상태는 알약, 축은 각진 칩. */
  .axis-row{display:flex;align-items:center;gap:6px;margin:6px 0;flex-wrap:wrap;}
  .axis-label{font-size:11.5px;color:var(--muted-2);font-weight:700;min-width:30px;}
  .axis-chip{font-size:12px;padding:4px 9px;border-radius:7px;background:var(--panel-2);
    border:1px solid var(--border);color:var(--muted);cursor:pointer;user-select:none;}
  .axis-chip:hover{border-color:var(--blue,#3b82f6);}
  .axis-chip.on{background:rgba(59,130,246,.14);border-color:rgba(59,130,246,.5);color:#fff;font-weight:700;}
  .axis-chip b{font-weight:700;color:var(--muted-2);margin-left:3px;font-size:11.25px;}
  .axis-chip.on b{color:#cfe0ff;}
  .qa-toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer;}
  .qa-toggle input{accent-color:var(--blue,#3b82f6);cursor:pointer;}
  /* 감췄으면 감췄다고 보인다 — 이 줄이 없으면 「내 기록이 사라졌다」로 읽힌다. */
  .hidden-note{font-size:11.5px;color:var(--muted-2);background:var(--panel-2);
    border:1px dashed var(--border);border-radius:7px;padding:6px 9px;margin:6px 0;line-height:1.55;}
  /* 접힌 한 줄(State Folding) — 값을 이어붙인 것이라 **AI가 새로 쓴 문장이 아니다.** */
  .sr-fold{font-size:12.25px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sr-fold .fk{color:var(--muted-2);}
  .sr-fold .fv{color:var(--text);}
  .sr-ax{font-size:11.25px;color:var(--muted-2);flex:0 0 auto;}
  /* 조회는 시각적으로 낮은 값어치 — 줄이 작다(시안 축② 기본값 설명). */
  .srow.op-query .sr-title{font-weight:600;color:var(--muted);}
  .slist{max-height:756px;overflow-y:auto;} /* 실측 행높이 54px×14 — 대시보드 작업세션 패널과 통일(2026-07-22) */
  .srow{display:flex;align-items:center;gap:11px;padding:11px 6px;border-bottom:1px solid var(--border);cursor:pointer;}
  .srow:hover{background:var(--panel-2);}.srow.on{background:rgba(59,130,246,.08);}
  .sdot{width:8px;height:8px;border-radius:50%;flex:none;}
  .sdot.active{background:var(--teal);}.sdot.done{background:var(--muted-2);}.sdot.ignored{background:var(--muted-2);opacity:.5;}
  .sr-main{flex:1;min-width:0;}
  .sr-title{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sr-sub{font-size:12.25px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sr-meta{font-size:12px;color:var(--muted-2);flex:none;text-align:right;white-space:nowrap;}
  .sdel{color:var(--muted-2);font-size:12px;cursor:pointer;flex:none;padding:2px 4px;border-radius:4px;}
  .sdel:hover{color:#f5928a;background:rgba(226,72,61,.12);}
  .badge{font-size:11.75px;font-weight:800;padding:2px 8px;border-radius:20px;}
  .b-active{color:var(--teal);background:rgba(30,185,128,.14);}.b-done{color:var(--muted-2);background:rgba(255,255,255,.05);}.b-ignored{color:var(--muted-2);background:rgba(255,255,255,.04);}
  .v3-detail{display:flex;flex-direction:column;min-height:520px;padding:0;overflow:hidden;}
  .v3-detail .conv{flex:1;}
  .list-empty{padding:22px 8px;color:var(--muted-2);font-size:12px;text-align:center;line-height:1.7;}
  /* 요약 막대 — 통합 관제 .riskbar와 같은 꼴. 위험이 아니라 진행 상황이라 파랑 계열. */
  .ws-bar{background:linear-gradient(90deg,rgba(59,130,246,.10),transparent);border:1px solid rgba(59,130,246,.28);
    border-radius:12px;padding:12px 16px;margin-bottom:16px;}
  .ws-bar .wb-main{font-size:15px;font-weight:800;color:#fff;}
  .ws-bar .wb-main b{font-size:17px;}
  .ws-bar .wb-sub{font-size:12.5px;font-weight:600;color:var(--muted);margin-left:10px;}
  .ws-bar .wb-sub b{color:var(--text);font-weight:800;font-size:13px;}
  .ws-bar .wb-note{font-size:12.5px;color:var(--muted-2);margin-top:5px;}
</style>
<script src="viz.js"></script>
</head>
<body>
<!-- 상단 바는 공용이다 — titlebar.js가 그린다(분리창=공용 헤더, 탭 안=셸 탭줄). 화면마다 두던 사본 23개를 지웠다(2026-08-07). -->

<div class="app">
  <div class="sidebar" id="gijoNav"></div>

<div class="v3-main">
  <!-- 작업 세션 요약 — "지금 뭐가 돌고 있나"를 먼저 보여 준다(2026-07-27).
       값은 아래 목록 데이터로 계산한다(추가 서버 호출 없음). -->
  <!-- 목록은 서버가 최근 100건만 준다(2026-07-27). 그보다 오래된 세션은 지워진 게 아니라
       data/session-archive/ 아래 파일로 옮겨져 있다 — 아래 안내 줄이 그 사실을 말해 준다. -->
  <!-- ⚠ 예전엔 카드 3장 + 아래 타일 4장으로 **같은 숫자를 두 번** 크게 그렸다(2026-08-02 사용자
       지적: "내용이 너무 커, 통합 관제처럼 한두 줄로"). 통합 관제의 위험도 막대와 같은 꼴로
       한 자리에 모은다 — 숫자를 만드는 함수도 하나만 남긴다(둘이면 반드시 어긋난다). -->
  <div class="ws-bar" data-gijo-summary>
    <div class="wb-main">작업 내역 <b id="kTotal">-</b>건
      <span class="wb-sub">🟢 진행중 <b id="kActive">-</b> · 완료 <b id="kDone">-</b> · 오늘 생성 <b id="kToday">-</b></span>
    </div>
  </div>

  <!-- 쌓인 내역에서 뽑은 업무 패턴(2026-07-28 사용자 요청) — 나중에 참고할 자료로 둔다.
       ⚠ 여기 결과를 자동으로 어디에 먹이지 않는다. 대화를 그대로 지식으로 삼으면 잡담·오답이
         멀쩡한 문서를 밀어낸다(QA-M04에서 겪었다). 사람이 읽고 판단하는 자리다.
       ⚠ 예전 주석에 "기본은 접혀 있다"고 적혀 있었으나 **사실이 아니다**(2026-08-06 실측).
         접기 기본값은 2026-08-02 사용자 지시로 **펼침**으로 뒤집혔다("접기가 아니라 펼치기로
         하자 — 못 보는 부분이 있는 것 같다"). 담당자가 직접 접은 것만 접힌 채로 열린다.
         실측: 이 구역이 펼쳐진 채 541px을 쓰고, 그래서 그림 띠 y=769 · 목록 y=900이 된다
         (창 1125px 기준 목록이 225px만 보인다). 접힘 기억이 **없는데도** 그렇다.
         → 2026-08-06 사용자 승인(1~8 일괄 진행의 6번)으로 **이 구역만** data-gijo-fold-closed
           표식을 달아 기본 접힘으로 했다. 전역 기본(펼침)은 그대로다. 담당자가 직접 편

       어느 쪽이 무거운지 눈에 안 잡힌다 — 막대로 세운다. 누르면 아래 목록이 그 상태만 남고,

      <div id="pickBar" style="display:none;align-items:center;gap:8px;background:rgba(59,130,246,.10);border:1px solid var(--blue,#3b82f6);border-radius:8px;padding:6px 10px;margin:6px 0;font-size:12px">

        <button id="pickCancel" style="background:none;border:none;color:var(--muted-2);font-size:12px;cursor:pointer">취소</button>

           ⚠ 접힌 것은 **사라진 게 아니다** — 칩을 누르면 그 자리에서 펼쳐지고,

      <div class="axis-row"><span class="axis-label">주체</span>

        </div>

      <!--
        여기 있던 입력칸을 **대화창(지휘소)으로 잇는 버튼**으로 바꿨다(2026-08-01 사용자 결정 ①안).

        왜: 지시를 넣는 자리가 다섯 곳이었고, 이 자리에는 근거·결재판·체크칸·가서 하기가
        **하나도 없었다.** 담당자는 자리가 다른 걸 모르므로 "같은 말을 했는데 어떤 때는
        근거가 나오고 어떤 때는 안 나온다"가 되고, 그러면 근거 기능 자체를 안 믿게 된다.

        ★ 실사용을 세어 보고 정했다: 오늘 이전 작업 세션 47건 중 **3턴 이상이 0건** —
          「이어서 지시」가 한 번도 쓰이지 않았다. 부품을 여기 또 붙이는 것보다
          대화를 한 줄로 모으는 편이 낫다("아까 그거 담당자 바꿔줘"가 통하는 이유).

        ⚠ 빈 채로 두지 않는다 — 그냥 지우면 담당자는 기능이 사라진 줄 안다.
      -->
      <div class="cin">
        <button id="goConsoleBtn" disabled style="flex:1;justify-content:center">💬 대화창에서 이어서 지시하기</button>

<script src="session-explorer.js"></script>
<script>
  const sessionListEl = document.getElementById("sessionList");
  const convEl = document.getElementById("conv");
  const convHead = document.getElementById("convHead");
  const convEmpty = document.getElementById("convEmpty");
  const goConsoleBtn = document.getElementById("goConsoleBtn");
  const searchInput = document.getElementById("sessionSearch");

  /**
   * 이 작업을 이어서 하려면 **대화창(지휘소)으로 간다.**
   *
   * 여기서 바로 보내면 근거·결재판·체크칸이 없는 반쪽 답이 돌아온다(2026-08-01).
   * 셸 안이면 대화창은 이미 아래에 있으므로 지시만 채워 주고, 분리창이면 본창에 부탁한다.
   */
  function 지휘소로(지시) {
    var 글 = String(지시 || "").trim();
    // askConsole을 먼저 쓴다 — 대화창이 셸 아래에 있든 창으로 빠져 있든 **지금 보이는 쪽**으로
    // 간다. 셸에 postMessage하는 옛 `gijo:ask` 길은 대화창을 창으로 빼 두면 안 보이는
    // 도킹 자리에 답을 찍는다(2026-08-01 확인). 그 길은 구버전 대비 폴백으로만 남긴다.
    // ⚠ **지금 열어 둔 작업(currentId)을 함께 넘긴다.** 안 넘기면 대화창이 자기가 기억하던
    //   다른 세션에 붙여, 47번을 열고 「이어서 지시」를 눌러도 엉뚱한 곳에 기록된다 —
    //   버튼 이름이 거짓말이 된다(2026-08-01 검토 지적).
    if (window.gijo && window.gijo.askConsole) { window.gijo.askConsole(글, currentId || undefined); return; }
    try {
      if (window.parent !== window) { window.parent.postMessage({ type: "gijo:ask", text: 글 }, "*"); return; }
    } catch (e) {}
    if (window.gijo && window.gijo.openConsoleWindow) { window.gijo.openConsoleWindow(); return; }
    if (window.gijo && window.gijo.navigateTo) window.gijo.navigateTo("app.html");
  }

  const STATUS_LABEL = { active: "진행중", done: "완료", ignored: "무시" };
  const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  let sessions = [];        // 목록(요약)
  let currentId = null;     // 열린 세션 id
  let currentSession = null;// 열린 세션 전체(상태·contextRef 포함)
  let searchQuery = "";
  let statusFilter = "all"; // 전체/active/done/ignored

  function fmtTime(ms) {
    const d = new Date(ms); const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    const yday = new Date(now.getTime() - 864e5).toDateString() === d.toDateString();
    if (sameDay) return d.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", hour12: false });
    if (yday) return "어제";
    return `${d.getMonth() + 1}/${d.getDate()}`;
  }


  // 추천 다음 단계(contextRef 세션)를 위해 탐색기 데이터만 미리 로드(트리 렌더는 하지 않음 — 탐색기 화면 제거됨).
  async function loadExplorerData() {
    try { await window.gijoSessionExplorer.load(); } catch (e) { /* 없으면 추천만 비활성 */ }
  }

  // ── KPI 타일 ─────────────────────────────────────────────────────────
  // ── 세션 목록 ────────────────────────────────────────────────────────
  function sessionMatches(s, q) {
    if (q && !((s.title || "").toLowerCase().includes(q) || (s.lastPreview || "").toLowerCase().includes(q))) return false;
    // 상태가 비어 오면 **진행중**으로 본다 — 막대가 그렇게 세므로 목록도 같아야 한다.
    if (statusFilter !== "all" && (s.status || "active") !== statusFilter) return false;
    return true;
  }
  const STATUS_BADGE = { active: "b-active", done: "b-done", ignored: "b-ignored" };

  // ── State Folding — 대화를 **값으로** 접는다(승인 시안 2026-08-18) ──────────────
  // ⚠ **AI가 새로 쓰는 문장이 아니다.** worksessions.ts가 그때그때 기록해 둔 값
  //   (자산·대상·조치·결과 / 질문·답)을 그대로 이어붙인다 — 지어낼 수가 없는 조합이다.
  //   7B/14B 요약을 쓰면 지어냄이 섞이고, 그 오류가 되짚기 전체를 오염시킨다
  //   (worksessions.ts recentTurnsText 주석의 같은 판단).
  // 값이 하나도 없으면 **아무것도 안 그린다** — 빈 라벨만 늘어놓으면 없는 정보를 있는 척한다.
  function 접기(f) {
    if (!f || typeof f !== "object") return "";
    const 조각 = [];
    const 넣기 = (k, v) => { if (v != null && String(v).trim()) 조각.push(`<span class="fk">${k}</span> <span class="fv">${esc(String(v).trim())}</span>`); };
    if (f.q != null || f.a != null) { 넣기("물음", f.q); 넣기("답", f.a); }
    else { 넣기("자산", f.asset); 넣기("대상", f.target); 넣기("조치", f.act); 넣기("결과", f.result); }
    return 조각.length ? `<div class="sr-fold">${조각.join(' <span class="fk">·</span> ')}</div>` : "";
  }
  // 주체·종류를 제목 앞에 아이콘 하나로. **모르면 안 그린다**(구분 이전 기록에 아이콘을
  // 붙이면 모르는 것을 아는 척하는 셈이다).
  function 축표시(s) {
    const a = s.origin === "system" ? "🤖" : s.origin === "user" ? "👤" : "";
    const b = s.opKind === "action" ? "🔧" : s.opKind === "query" ? "🔍" : "";
    const qa = s.qa ? "🧪" : "";
    const t = (qa + a + b).trim();
    return t ? `<span class="sr-ax" title="${s.qa ? "QA·테스트 · " : ""}${s.origin === "system" ? "시스템이 한 일" : s.origin === "user" ? "내가 시킨 일" : "구분 이전"} · ${s.opKind === "action" ? "실행" : s.opKind === "query" ? "조회" : "구분 이전"}">${t}</span> ` : "";
  }
  // ── 그림 먼저(전-7 ①, 2026-08-05) ──────────────────────────────────────
  // 새 필터를 만들지 않고 **기존 상태 칩(statusFilter)을 그림으로 바꿔** 세운다.
  // ⚠ 막대는 검색어와 무관하게 **전체 내역**으로 센다 — 검색 중에 막대까지 줄면
  //   "우리 내역이 몇 건인가"를 어디서도 못 본다.
  const 상태색 = { active: "warn", done: "ok", ignored: "idle" };

  function 상태고르기(st) {
    statusFilter = st || "all";
    const 칸 = document.getElementById("statusFilters");
    if (칸) 칸.querySelectorAll(".fchip").forEach((x) => x.classList.toggle("active", (x.dataset.st || "all") === statusFilter));
    renderSessionList();
  }

  function 그림띠() {
    const 자리 = document.getElementById("vizStrip");
    if (!자리 || !window.gijoViz) return;
    const 셈 = {};
    sessions.forEach((s) => { const k = s.status || "active"; 셈[k] = (셈[k] || 0) + 1; });
    window.gijoViz.mount(자리, {
      title: "한눈에",
      hint: sessions.length ? "누르면 목록이 좁혀집니다" : "",
      parts: [{
        kind: "bars",
        segments: ["active", "done", "ignored"].map((k) => ({
          key: k, label: STATUS_LABEL[k] || k, value: 셈[k] || 0, color: 상태색[k],
        })),
        onPick: (key) => { 상태고르기(key); },
      }],
    });
    if (statusFilter !== "all") {
      const b = 자리.querySelector('.gviz-bar[data-key="' + statusFilter + '"]');
      if (b) b.classList.add("on");
    }
    필터띠();
  }

  function 필터띠() {
    if (!window.gijoViz) return;
    const el = document.getElementById("vizFilter");
    if (statusFilter === "all") { window.gijoViz.filterBar(el, null, null); return; }
    // ⚠ 목록과 **같은 조건**(sessionMatches: 검색어 + 상태)으로 센다 — 검색 중에 띠만
    //   다른 수를 말하면 무엇을 믿을지 알 수 없다(2026-08-05 검토 지적).
    const 보임 = sessions.filter((s) => sessionMatches(s, searchQuery)).length;
    const 상태뺀전체 = (() => { const 기억 = statusFilter; statusFilter = "all"; const n = sessions.filter((s) => sessionMatches(s, searchQuery)).length; statusFilter = 기억; return n; })();
    window.gijoViz.filterBar(el,

    const commit = async (save) => {

    const days = Number(document.getElementById("pruneDays").value);
    if (!days) return;
    if (!await gijoAsk(`${days}일 이전(마지막 활동 기준)의 작업 내역을 모두 삭제할까요? 대화까지 삭제되며 되돌릴 수 없습니다.`)) return;
    const btn = document.getElementById("pruneBtn");
    const orig = btn.textContent; btn.disabled = true; btn.textContent = "삭제 중…";
    try {
      const r = await window.gijo.pruneWorkSessions(days);
      await loadSessions(false); clearOpenIfGone();
      gijoTell(`${days}일 이전 작업 내역 ${r.deleted}건을 삭제했습니다.`);
    } catch (e) { gijoTell("일괄 삭제 실패: " + ((e && e.message) || e)); }
    finally { btn.disabled = false; btn.textContent = orig; }
  }
  async function deleteAll() {
    if (!await gijoAsk("모든 작업 내역을 삭제할까요? 대화까지 전부 삭제되며 되돌릴 수 없습니다.")) return;
    if (!await gijoAsk("정말 전체 삭제할까요? 이 작업은 되돌릴 수 없습니다.")) return; // 파괴적 — 2단계 확인
    try {
      const r = await window.gijo.deleteAllWorkSessions();
      await loadSessions(false); clearOpenIfGone();
      gijoTell(`작업 내역 ${r.deleted}건을 전부 삭제했습니다.`);
    } catch (e) { gijoTell("전체 삭제 실패: " + ((e && e.message) || e)); }
  }

  // ── 업무 패턴 요약 ───────────────────────────────────────────────────
  // 펼칠 때 한 번만 부른다 — 화면 열 때마다 계산하면 목록 뜨는 게 느려진다.
  let patLoaded = false;
  async function loadPatterns() {
    const box = document.getElementById("patBody");
    try {
      const r = await window.gijo.sessionPatterns(30);
      document.getElementById("patPeriod").textContent =
        `최근 ${r.기간일수}일 · 내역 ${r.총계.세션}건 · 지시 ${r.총계.지시}건`;
      const 줄 = (t) => `<div style="padding:4px 0">${esc(t)}</div>`;
      const 제목 = (t) => `<div style="font-weight:800;color:var(--text);margin:12px 0 4px">${t}</div>`;
      let h = "";

      h += 제목("자주 하는 지시");
      h += r.반복지시.length
        ? r.반복지시.slice(0, 8).map((x) =>
            `<div style="display:flex;gap:8px;padding:4px 0"><b style="color:var(--blue-light);min-width:34px">${x.횟수}회</b>` +
            `<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.대표문장)}</span></div>`).join("")
        : 줄("아직 두 번 이상 반복된 지시가 없습니다.");

      h += 제목("답을 못 준 질문 — 이 주제 문서를 올리면 다음부터 답합니다");
      h += r.지식공백.length
        ? r.지식공백.slice(0, 8).map((g) =>
            `<div style="display:flex;gap:8px;padding:4px 0"><span style="color:var(--amber);min-width:96px;font-size:12.25px">${esc(g.이유)}</span>` +
            `<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(g.질문)}</span></div>`).join("")
        : 줄("답을 못 준 질문이 없습니다.");

      h += 제목("무엇에 시간을 쓰나");
      h += r.주제분포.length
        ? `<div style="display:flex;flex-wrap:wrap;gap:6px;padding:2px 0">` +
          r.주제분포.map((t) =>
            `<span style="background:var(--panel-2);border:1px solid var(--border);border-radius:14px;padding:3px 10px;font-size:12.5px">` +
            `${esc(t.주제)} <b style="color:var(--text)">${t.건수}</b></span>`).join("") + `</div>`
        : 줄("집계할 지시가 없습니다.");
      if (r.잡담.건수) h += `<div style="padding:6px 0 0;color:var(--muted-2);font-size:12.25px">그 밖에 인사·잡담 ${r.잡담.건수}건(${r.잡담.비율}%)은 집계에서 뺐습니다.</div>`;

      if (r.비고.length) h += `<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--border);color:var(--muted-2);font-size:12.25px;line-height:1.8">` +
        r.비고.map((b) => `· ${esc(b)}`).join("<br>") + `</div>`;
      box.innerHTML = h;
    } catch (e) {
      box.innerHTML = '<div style="color:var(--muted-2)">패턴을 불러오지 못했습니다.</div>';
    }
  }

  async function init() {
    // 업무 패턴은 **펼칠 때** 불러온다(무거운 계산이라 접힌 채로는 부르지 않는다).
    // ⚠ 예전엔 <details>의 toggle 이벤트를 썼다 — 우리 접기로 바꾸면서 gijo:fold 알림으로 옮겼다.
    const pat = document.querySelector(".ws-pat");
    if (pat) pat.addEventListener("gijo:fold", (e) => { if (e.detail && e.detail.open && !patLoaded) { patLoaded = true; loadPatterns(); } });
    // ★ 2026-08-06 — **접혀 있어도 항상 부른다**(검토 #6이 잡은 교착 해소).
    //   이 구역이 기본 접힘이 되면서(위 data-gijo-fold-closed), "펼칠 때만 부른다"는 예전
    //   규칙과 맞물려 배지(기간)가 **영영 안 채워졌다** — 펼쳐야 값이 생기는데 기본이 접힘이라
    //   접기 원칙("접힌 줄에 핵심 숫자 배지")을 첫 적용 화면이 스스로 어기는 상태였다.
    //   패턴 계산은 결정적 SQL 집계라(초 미만) 항상 불러도 부담이 없고, 값이 채워지면
    //   fold.js watch()가 접힌 제목줄의 기간 배지를 그린다.
    //   (2026-08-04의 "펼쳐 둔 채 열면 영영 불러오는 중" 문제도 이 길로 함께 덮인다.)
    if (!patLoaded) { patLoaded = true; loadPatterns(); }
    await loadExplorerData();
    // 다른 화면에서 넘어온 딥링크(localStorage) — 특정 내역 열기.
    // 'gijo:sessions:new'(새 세션으로 시작) 갈래는 ＋ 새 세션과 함께 없앴다. 옛 앱이 남긴
    // 값이 있을 수 있으니 읽지는 않되 지우기는 한다.
    let openId = null;
    try {
      openId = localStorage.getItem("gijo:sessions:open");
      localStorage.removeItem("gijo:sessions:open");
      localStorage.removeItem("gijo:sessions:new");
    } catch (e) {}
    await loadSessions(!openId); // 딥링크 없을 때만 최근 내역 자동 선택
    if (openId && sessions.some((s) => s.id === openId)) openSession(openId);

    document.querySelectorAll(".header [data-page]").forEach((el) => el.addEventListener("click", () => (window.gijoOpenScreen ? window.gijoOpenScreen(el.dataset.page) : window.gijo.navigateTo(el.dataset.page))));
    document.getElementById("pruneBtn").addEventListener("click", pruneOld);
    document.getElementById("deleteAllBtn").addEventListener("click", deleteAll);
    document.getElementById("statusFilters").querySelectorAll(".fchip").forEach((c) => c.addEventListener("click", () => {
      statusFilter = c.dataset.st;
      document.getElementById("statusFilters").querySelectorAll(".fchip").forEach((x) => x.classList.toggle("active", x === c));
      renderSessionList();
    }));
    document.getElementById("renameBtn").addEventListener("click", startRename);
    document.getElementById("convTitle").addEventListener("click", startRename);
    document.getElementById("deleteBtn").addEventListener("click", deleteSession);
    document.getElementById("convStatus").addEventListener("change", changeStatus);
    // 이어서 지시하기 → 대화창(지휘소)으로. 여기서 직접 보내지 않는다(2026-08-01 ①안).
    // ⚠ 옛 send()는 아래에 남아 있지만 **아무도 안 부른다.** 지우다 옆 함수를 잘라 먹은
    //   사고가 오늘 있어서(console.js attachApproval) 호출만 끊고 코드는 둔다.
    goConsoleBtn.addEventListener("click", () => 지휘소로(""));
    searchInput.addEventListener("input", (e) => { searchQuery = e.target.value.trim().toLowerCase(); renderSessionList(); });
  }

  if (!window.gijo.isAuthenticated()) window.gijo.navigateTo("login.html");
  else init();

  // 오른쪽 자세히를 **누른 줄 바로 아래**로 (2026-08-02 사용자 지시, 본은 컴플라이언스 화면).
  // 목록이 가로를 다 쓰게 되어 이름이 잘리지 않고, 누른 줄과 내용이 붙어 있다.
  // ⚠ 목록을 다시 그리는 화면이라 **늦게** 건다 — 요소가 없으면 조용히 넘어간다.
  (function 줄아래자세히() {
    let 남은시도 = 20;
    const 걸기 = () => {
      if (typeof window.gijo자세히아래로 !== "function") return void (남은시도-- > 0 && setTimeout(걸기, 300));
      const 됐나 = window.gijo자세히아래로({
        칸: ".two", 목록: "#sessionList", 자세히: ".panel.v3-detail",
      });
      if (!됐나 && 남은시도-- > 0) setTimeout(걸기, 300);
    };
    걸기();
  })();
</script>
