<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIJO AS — 작업 세션</title>
<style>
  :root{
    --bg:#0a0e1a;--panel:#121a2e;--panel-2:#0e1526;--border:rgba(255,255,255,0.08);
    --border-strong:rgba(255,255,255,0.16);--blue:#3b82f6;--blue-light:#5fa1ff;--white:#ffffff;
    --text:#e7eaf3;--muted:#8b93ab;--muted-2:#5f6785;--red:#e2483d;--amber:#f0a020;--teal:#1eb980;--purple:#8b7cf0;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Pretendard","Malgun Gothic","Segoe UI",sans-serif;background:#05070d;color:var(--text);}
  .header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--bg);}
  .header-left{display:flex;align-items:center;gap:12px;}
  .header-left img{height:22px;}
  .app-title{font-size:15px;font-weight:800;color:#fff;}
  .clock{font-size:12.5px;color:var(--blue-light);font-weight:600;}
  .header-right{display:flex;align-items:center;gap:10px;}
  .status-pill{display:flex;align-items:center;gap:6px;background:rgba(30,185,128,0.15);border:1px solid rgba(30,185,128,0.4);color:var(--teal);padding:6px 14px;border-radius:20px;font-size:12px;font-weight:800;}
  .status-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);}
  .beta-tag{background:var(--teal);color:#06281c;font-size:9px;font-weight:800;padding:1px 6px;border-radius:4px;margin-left:2px;}
  .icon-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
  .icon-btn{width:32px;height:32px;border-radius:8px;background:var(--panel);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted);cursor:pointer;transition:background .12s,border-color .12s,color .12s;}
  .icon-btn:hover,.icon-btn.on{background:rgba(59,130,246,0.18);border-color:var(--blue);color:var(--blue-light);}
  .avatar-btn{width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;}

  .page-head{padding:16px 22px 4px;}
  .page-title{font-size:20px;font-weight:800;color:#fff;}
  .page-sub{font-size:12.5px;color:var(--muted);margin-top:3px;}

  .body-grid{display:grid;grid-template-columns:210px 260px 1fr;gap:12px;padding:14px 22px 22px;min-height:calc(100vh - 120px);}
  .col{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-height:0;}
  .colhead{padding:11px 14px;font-size:12.5px;font-weight:800;color:#fff;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
  .newbtn{background:var(--blue);color:#fff;border:0;border-radius:7px;font-size:11.5px;font-weight:700;padding:5px 11px;cursor:pointer;}
  .newbtn:hover{background:#2f6fd0;}

  /* 탐색기 — 4구획(접기) */
  .tree{padding:6px 6px 10px;overflow-y:auto;font-size:12.5px;}
  .sec{margin-top:3px;}
  .sechead{display:flex;align-items:center;gap:6px;padding:7px 8px;border-radius:7px;font-weight:800;font-size:12px;color:var(--text);cursor:pointer;}
  .sechead:hover{background:var(--panel-2);}
  .sechead .car{font-size:10px;color:var(--muted-2);width:9px;}
  .sechead .c{margin-left:auto;font-size:10px;color:var(--muted-2);font-weight:700;}
  .runbtn{margin:5px 8px 3px;display:block;width:calc(100% - 16px);background:rgba(30,185,128,0.14);color:var(--teal);border:1px solid rgba(30,185,128,0.3);border-radius:7px;padding:7px;font-size:11.5px;font-weight:800;cursor:pointer;}
  .runbtn:hover{background:rgba(30,185,128,0.22);}
  .tree-leaf{display:flex;align-items:center;gap:6px;padding:6px 9px 6px 24px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border-radius:6px;}
  .tree-leaf:hover{color:#fff;background:var(--panel-2);}
  .tree-leaf.on{color:#fff;background:rgba(59,130,246,0.12);}
  .tree-empty{padding:4px 9px 4px 24px;color:var(--muted-2);font-size:11px;}
  .pri{font-size:8.5px;font-weight:900;padding:1px 5px;border-radius:4px;flex-shrink:0;}
  .pri.P0{color:#f5928a;background:rgba(226,72,61,0.16);}
  .pri.P1{color:var(--amber);background:rgba(240,160,32,0.14);}
  .pri.P2,.pri.P3{color:var(--muted-2);background:rgba(255,255,255,0.06);}
  /* 상태 카드(첫 assistant 턴) */
  .status-card{background:var(--panel-2);border:1px solid var(--border-strong);border-radius:10px;padding:11px 14px;margin-bottom:8px;}
  .status-card .h{font-weight:800;color:#fff;font-size:12.5px;margin-bottom:6px;}
  .status-card .l{font-size:11.5px;color:var(--muted);line-height:1.75;}
  .status-card .l b{color:var(--text);}
  /* 추천 다음 단계(시안 C) */
  .suggest{padding:2px 16px 12px;}
  .suggest .ask{font-size:12.5px;color:var(--blue-light);font-weight:700;margin:2px 0 8px;}
  .step{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--border);border-radius:9px;padding:9px 12px;margin-bottom:6px;cursor:pointer;}
  .step:hover{border-color:var(--blue);}
  .step .n{width:20px;height:20px;border-radius:50%;background:rgba(59,130,246,0.16);color:var(--blue-light);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .step .x{font-size:12px;color:var(--text);font-weight:600;}
  .step .x span{color:var(--muted-2);font-weight:400;font-size:11px;}

  /* 세션 목록 */
  .search{margin:9px 11px 4px;display:flex;align-items:center;gap:7px;background:var(--panel-2);border:1px solid var(--border-strong);border-radius:8px;padding:7px 11px;}
  .search input{flex:1;background:transparent;border:0;outline:none;color:var(--text);font-size:12px;}
  .search input::placeholder{color:var(--muted-2);}
  .slist{flex:1;overflow-y:auto;padding:4px 8px 10px;}
  .sitem{padding:10px 12px;border-radius:9px;cursor:pointer;margin-bottom:4px;border:1px solid transparent;}
  .sitem:hover{background:var(--panel-2);}
  .sitem.on{background:rgba(59,130,246,0.1);border-color:rgba(59,130,246,0.3);}
  .sitem .t{font-weight:700;font-size:12.5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sitem .l{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sitem .m{font-size:10.5px;color:var(--muted-2);margin-top:5px;display:flex;justify-content:space-between;align-items:center;gap:6px;}
  .tag{font-size:9px;font-weight:800;padding:2px 7px;border-radius:5px;flex-shrink:0;}
  .tag.active{color:var(--teal);background:rgba(30,185,128,0.14);}
  .tag.done{color:var(--muted-2);background:rgba(255,255,255,0.06);}
  .tag.ignored{color:var(--amber);background:rgba(240,160,32,0.12);}
  .list-empty{padding:22px 14px;color:var(--muted-2);font-size:12px;text-align:center;line-height:1.7;}

  /* 대화 */
  .conv-head{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .conv-head .t{font-weight:800;color:#fff;font-size:14px;}
  .conv-head .t input{background:var(--panel-2);border:1px solid var(--blue);border-radius:6px;padding:3px 8px;color:#fff;font-size:14px;font-weight:800;outline:none;width:320px;}
  .conv-head .m{font-size:11px;color:var(--muted);margin-top:3px;}
  .conv-acts{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .ca-btn{background:var(--panel-2);border:1px solid var(--border-strong);color:var(--muted);border-radius:7px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;}
  .ca-btn:hover{color:#fff;border-color:var(--blue);}
  .ca-sel{background:var(--panel-2);border:1px solid var(--border-strong);color:var(--text);border-radius:7px;padding:5px 8px;font-size:11px;font-weight:700;outline:none;cursor:pointer;}
  .conv{flex:1;overflow-y:auto;padding:16px;min-height:0;}
  .turn{margin-bottom:16px;}
  .you{background:var(--panel-2);border:1px solid var(--border);border-radius:9px;padding:9px 13px;font-size:12.5px;margin-bottom:7px;line-height:1.5;}
  .you b{color:var(--blue-light);}
  .ai{font-size:12.5px;color:var(--muted);line-height:1.7;padding-left:4px;white-space:pre-wrap;}
  .ai .tool{font-size:10px;font-weight:800;color:var(--teal);background:rgba(30,185,128,0.12);border-radius:4px;padding:1px 7px;margin-right:6px;}
  .ai.pending{color:var(--blue-light);}
  .conv-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted-2);font-size:13px;gap:10px;text-align:center;}
  .conv-empty .big{font-size:34px;opacity:.5;}
  .cin{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;}
  .cin input{flex:1;background:var(--panel-2);border:1px solid var(--border-strong);border-radius:9px;padding:11px 14px;color:var(--text);font-size:13px;outline:none;}
  .cin input:disabled{opacity:.5;}
  .cin button{background:var(--blue);color:#fff;border:0;border-radius:9px;padding:0 20px;font-weight:800;font-size:13px;cursor:pointer;}
  .cin button:disabled{opacity:.5;cursor:default;}
</style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <span id="homeLink" data-page="dashboard.html" title="대시보드로 이동" style="display:flex;align-items:center;gap:12px;cursor:pointer"><img src="https://gijo.ai/_nuxt/logo_gijo_white.CCh2YXJe.svg" alt="GIJO">
    <div class="app-title">GIJO AS</div></span>
    <div class="clock" id="clockEl">-</div>
  </div>
  <div class="header-right">
    <div class="status-pill" id="statusPill"><span class="dot"></span>연결 확인 중<span class="beta-tag">LIVE</span></div>
    <div class="icon-row">
      <div class="icon-btn" data-page="dashboard.html" title="대시보드">◆</div>
      <div class="icon-btn on" data-page="sessions.html" title="작업 세션">💬</div>
      <div class="icon-btn" data-page="inventory.html" title="AI 자산">◇</div>
      <div class="icon-btn" data-page="vulnscan.html" title="취약점 관리">⊘</div>
      <div class="icon-btn" data-page="agent.html" title="AI 어시스턴트">◉</div>
      <div class="icon-btn" data-page="memory.html" title="AI 지식·모델">🧠</div>
      <div class="icon-btn" id="settingsBtn" title="설정">⚙</div>
    </div>
    <div class="avatar-btn" id="avatarBtn">-</div>
  </div>
</div>

<div class="page-head">
  <div class="page-title">작업 세션</div>
  <div class="page-sub">자산 탐색기에서 항목을 누르면 그 대상의 상태를 보여주는 대화 세션이 열립니다. 상태를 확인하고 추천 작업을 고르거나 직접 지시하세요.</div>
</div>

<div class="body-grid">
  <!-- 1) 자산 탐색기 -->
  <div class="col">
    <div class="colhead"><span>🗂 자산 탐색기</span><span class="tree-act" id="refreshExplorer" title="새로고침" style="cursor:pointer;color:var(--muted);font-size:13px">⟳</span></div>
    <div class="tree" id="explorerTree">불러오는 중…</div>
  </div>

  <!-- 2) 작업 세션 목록 -->
  <div class="col">
    <div class="colhead"><span>💬 작업 세션</span><button class="newbtn" id="newSessionBtn">＋ 새 세션</button></div>
    <div class="search">🔎<input id="sessionSearch" placeholder="세션 검색…"></div>
    <div class="slist" id="sessionList">불러오는 중…</div>
  </div>

  <!-- 3) 대화 -->
  <div class="col">
    <div class="conv-head" id="convHead" style="display:none">
      <div>
        <div class="t" id="convTitle">—</div>
        <div class="m" id="convMeta">—</div>
      </div>
      <div class="conv-acts">
        <select class="ca-sel" id="convStatus" title="세션 상태">
          <option value="active">진행중</option>
          <option value="done">완료</option>
          <option value="ignored">무시</option>
        </select>
        <button class="ca-btn" id="renameBtn" title="이름 변경">✎ 이름</button>
        <button class="ca-btn" id="deleteBtn" title="세션 삭제">🗑 삭제</button>
      </div>
    </div>
    <div class="conv" id="conv">
      <div class="conv-empty" id="convEmpty">
        <div class="big">💬</div>
        <div>왼쪽에서 세션을 고르거나 <b style="color:var(--blue-light)">＋ 새 세션</b>으로 시작하세요.<br>지시하면 이 세션의 대화로 기록됩니다.</div>
      </div>
    </div>
    <div class="cin">
      <input id="chatInput" placeholder="이 세션에 이어서 지시… (예: 오늘 제일 급한 취약점 뭐야?)" disabled>
      <button id="sendBtn" disabled>전송</button>
    </div>
  </div>
</div>

<script>
  const clockEl = document.getElementById("clockEl");
  const statusPill = document.getElementById("statusPill");
  const avatarBtn = document.getElementById("avatarBtn");
  const sessionListEl = document.getElementById("sessionList");
  const explorerTree = document.getElementById("explorerTree");
  const convEl = document.getElementById("conv");
  const convHead = document.getElementById("convHead");
  const convEmpty = document.getElementById("convEmpty");
  const chatInput = document.getElementById("chatInput");
  const sendBtn = document.getElementById("sendBtn");
  const searchInput = document.getElementById("sessionSearch");

  const STATUS_LABEL = { active: "진행중", done: "완료", ignored: "무시" };
  const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  let sessions = [];        // 목록(요약)
  let currentId = null;     // 열린 세션 id
  let currentSession = null;// 열린 세션 전체(상태·contextRef 포함)
  let searchQuery = "";
  // 탐색기 대상 데이터 캐시 — 클릭 시 상태 카드·추천 다음 단계를 이 캐시로 구성한다.
  let assetsCache = [], prioritiesCache = [], productsCache = [], todayCache = [];
  const collapsed = {}; // 구획 접기 상태

  function tick() {
    clockEl.textContent = new Date().toLocaleString("ko-KR", { hour: "2-digit", minute: "2-digit", hour12: true, year: "numeric", month: "2-digit", day: "2-digit" });
  }
  function fmtTime(ms) {
    const d = new Date(ms); const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    const yday = new Date(now.getTime() - 864e5).toDateString() === d.toDateString();
    if (sameDay) return d.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", hour12: false });
    if (yday) return "어제";
    return `${d.getMonth() + 1}/${d.getDate()}`;
  }

  async function loadHealth() {
    try { await window.gijo.checkServerHealth(); statusPill.innerHTML = '<span class="dot"></span>운영중<span class="beta-tag">LIVE</span>'; }
    catch (e) { statusPill.innerHTML = '<span class="dot" style="background:#e2483d"></span>서버 연결 끊김'; }
  }
  async function loadUser() {
    try { const u = await window.gijo.me(); avatarBtn.textContent = (u.displayName || u.username || "-").charAt(0); } catch (e) {}
  }

  // ── 자산 탐색기(4구획) — 항목 클릭 시 그 대상 상태 세션을 연다 ──────────
  // 4구획: ⦿오늘 확인할 항목(+운영시작) · 🎯오늘의 조치 우선순위 · ◆AI 자산·AI-BOM · 🧰보안제품 관리.
  async function loadExplorer() {
    try {
      const [assets, pri, products, tasks] = await Promise.all([
        window.gijo.listAssets().catch(() => []),
        window.gijo.listActionPriorities(6).then((r) => (r && r.items) || []).catch(() => []),
        window.gijo.listSecurityProducts().catch(() => []),
        window.gijo.listTasks().catch(() => []),
      ]);
      assetsCache = assets || [];
      prioritiesCache = pri || [];
      productsCache = products || [];
      todayCache = (tasks || []).filter((t) => !t.done);
      renderExplorer();
    } catch (e) {
      explorerTree.innerHTML = `<div class="tree-empty">자산을 불러오지 못했습니다</div>`;
    }
  }

  function priKey(p) { return `${p.assetId}|${p.findingKey}`; }
  function sevToPri(sev) { return sev === "critical" ? "P0" : sev === "high" ? "P1" : sev === "medium" ? "P2" : "P3"; }
  function sectionHtml(key, ic, label, count, leavesHtml, extra) {
    const open = !collapsed[key];
    return `<div class="sec">
      <div class="sechead" data-sec="${key}"><span class="car">${open ? "▾" : "▸"}</span>${ic} ${label}<span class="c">${count}</span></div>
      ${open ? `${extra || ""}${leavesHtml}` : ""}
    </div>`;
  }
  function renderExplorer() {
    const todayLeaves = todayCache.length
      ? todayCache.slice(0, 6).map((t) => `<div class="tree-leaf" data-type="today" data-id="${t.id}" title="${esc(t.text)}">${esc(t.text)}</div>`).join("")
      : `<div class="tree-empty">오늘 확인할 항목 없음</div>`;
    const priLeaves = prioritiesCache.length
      ? prioritiesCache.map((p) => {
          const pr = p.priority || sevToPri(p.finding && p.finding.severity);
          const name = (p.finding && p.finding.finding_type) || "취약점";
          return `<div class="tree-leaf" data-type="vuln" data-id="${esc(priKey(p))}" title="${esc(name)} · ${esc(p.assetId)}"><span class="pri ${pr}">${pr}</span>${esc(name)} · ${esc(p.assetId)}</div>`;
        }).join("")
      : `<div class="tree-empty">우선 조치 항목 없음</div>`;
    const assetLeaves = assetsCache.length
      ? assetsCache.map((a) => `<div class="tree-leaf" data-type="asset" data-id="${esc(a.id)}" title="${esc(a.name || a.id)}">◆ ${esc(a.name || a.id)}</div>`).join("")
      : `<div class="tree-empty">등록된 AI 자산 없음</div>`;
    const prodLeaves = productsCache.length
      ? productsCache.map((p) => `<div class="tree-leaf" data-type="product" data-id="${esc(p.id)}" title="${esc(p.name)}">${esc(p.name)}</div>`).join("")
      : `<div class="tree-empty">등록된 보안제품 없음</div>`;

    explorerTree.innerHTML =
      sectionHtml("today", "⦿", "오늘 확인할 항목", todayCache.length, todayLeaves, `<button class="runbtn" id="runOpsBtn">▶ 운영 시작 — 세션에서 판단</button>`) +
      sectionHtml("vuln", "🎯", "오늘의 조치 · 우선순위", prioritiesCache.length, priLeaves) +
      sectionHtml("asset", "◆", "AI 자산 · AI-BOM", assetsCache.length, assetLeaves) +
      sectionHtml("product", "🧰", "보안제품 관리", productsCache.length, prodLeaves);

    explorerTree.querySelectorAll(".sechead").forEach((el) => el.addEventListener("click", () => {
      const k = el.dataset.sec; collapsed[k] = !collapsed[k]; renderExplorer();
    }));
    explorerTree.querySelectorAll(".tree-leaf[data-type]").forEach((el) => el.addEventListener("click", () => openEntity(el.dataset.type, el.dataset.id)));
    const runBtn = document.getElementById("runOpsBtn");
    if (runBtn) runBtn.addEventListener("click", (e) => { e.stopPropagation(); openEntity("today", "all"); });
  }

  // ── 대상 → 상태 카드 + 추천 다음 단계 구성(결정적, LLM 불필요) ──────────
  const sevSummary = (findings) => {
    const c = { critical: 0, high: 0, medium: 0, low: 0 };
    (findings || []).forEach((f) => { if (c[f.severity] != null) c[f.severity]++; });
    return Object.entries(c).filter(([, n]) => n > 0).map(([k, n]) => `${k} ${n}`).join(" · ") || "없음";
  };
  function buildContext(type, id) {
    if (type === "asset") {
      const a = assetsCache.find((x) => x.id === id);
      if (!a) return { title: id, statusText: `${id} — 자산 정보를 찾을 수 없습니다.`, suggestions: [] };
      const bom = a.aibom || {};
      const model = (bom.model && (bom.model.name || bom.model.modelRef)) || (a.components && a.components[0] && a.components[0].name) || "-";
      const rob = bom.robustness && bom.robustness.score != null ? `${bom.robustness.score}점` : "미점검";
      const card = { kind: "card", title: `◆ ${a.name || a.id} (${a.id})`, lines: [
        `<b>취약점</b> ${sevSummary(a.findings)}`,
        `<b>최근 스캔</b> ${a.lastScannedAt ? new Date(a.lastScannedAt).toLocaleDateString("ko-KR") : "없음"}`,
        `<b>AI-BOM</b> ${esc(model)} · 견고성 ${rob}`,
        `<b>서비스</b> ${esc(a.service || "미지정")}`,
      ] };
      return {
        title: `${a.name || a.id} · 상태`,
        statusText: `◆ ${a.name || a.id} (${a.id})\n취약점 ${sevSummary(a.findings)} · 최근 스캔 ${a.lastScannedAt ? new Date(a.lastScannedAt).toLocaleDateString("ko-KR") : "없음"}\nAI-BOM ${model} · 견고성 ${rob} · 서비스 ${a.service || "미지정"}`,
        card,
        suggestions: [
          { label: "이 자산 재스캔", hint: "스캔→비교", instruction: `${a.name || a.id} 재스캔해줘` },
          { label: "가장 급한 취약점 담당자·기한 배정", hint: "결재판", instruction: `${a.name || a.id}의 가장 급한 취약점 담당자와 기한을 배정해줘` },
          { label: "취약점 조치 절차 안내", hint: "매뉴얼·온톨로지", instruction: `${a.name || a.id} 취약점 조치 절차 알려줘` },
          { label: "AI 견고성(레드팀) 점검", hint: "14 페이로드", instruction: `${a.name || a.id} 레드팀 점검해줘` },
        ],
      };
    }
    if (type === "vuln") {
      const p = prioritiesCache.find((x) => priKey(x) === id) || {};
      const f = p.finding || {};
      const pr = p.priority || sevToPri(f.severity);
      const name = f.finding_type || "취약점";
      const card = { kind: "card", title: `${pr} ${name}`, lines: [
        `<b>자산</b> ${esc(p.assetId || "-")}`,
        `<b>심각도</b> ${esc(f.severity || "-")}${f.kev ? " · KEV 등재" : ""}`,
        `<b>담당자</b> ${esc(p.assignee || "미배정")} · <b>기한</b> ${esc(p.dueDate || "없음")}`,
        `<b>상태</b> ${esc(p.status || "미검토")}`,
      ] };
      return {
        title: `${pr} ${name} · ${p.assetId || ""}`.trim(),
        statusText: `[${pr}] ${name} (${f.severity || "-"}) — ${p.assetId || "-"}\n담당자 ${p.assignee || "미배정"} · 기한 ${p.dueDate || "없음"} · 상태 ${p.status || "미검토"}`,
        card,
        suggestions: [
          { label: "담당자·기한 배정", hint: "결재판", instruction: `${p.assetId} ${name} 담당자와 기한 배정해줘` },
          { label: "조치 절차 안내", hint: "매뉴얼·온톨로지", instruction: `${p.assetId} ${name} 조치 절차 알려줘` },
          { label: "재스캔해서 해결됐는지 확인", hint: "스캔→비교", instruction: `${p.assetId} 재스캔해서 ${name} 해결됐는지 확인해줘` },
          { label: "오탐(무시)으로 처리", hint: "상태 변경", instruction: `${p.assetId} ${name} 오탐으로 무시 처리해줘` },
        ],
      };
    }
    if (type === "product") {
      const p = productsCache.find((x) => x.id === id);
      if (!p) return { title: id, statusText: `${id} — 제품 정보를 찾을 수 없습니다.`, suggestions: [] };
      const card = { kind: "card", title: `🧰 ${p.name} (${p.category})`, lines: [
        `<b>제조사</b> ${esc(p.vendor || "-")} · <b>모델</b> ${esc(p.model || "-")}`,
        `<b>연결 자산</b> ${esc(p.assetName || p.assetId || "없음")}`,
        `<b>문서</b> ${(p.docs && p.docs.length) || 0}건`,
      ] };
      return {
        title: `${p.name} · 보안제품`,
        statusText: `🧰 ${p.name} (${p.category})\n제조사 ${p.vendor || "-"} · 모델 ${p.model || "-"} · 연결자산 ${p.assetName || p.assetId || "없음"}\n문서 ${(p.docs && p.docs.length) || 0}건`,
        card,
        suggestions: [
          { label: "점검 일정 확인", hint: "유지보수", instruction: `${p.name} 점검 일정 알려줘` },
          { label: "매뉴얼 검색", hint: "RAG", instruction: `${p.name} 매뉴얼에서 로그 설정 방법 찾아줘` },
          { label: "최근 운영 이슈 요약", hint: "리포트", instruction: `${p.name} 최근 운영 이슈 요약해줘` },
        ],
      };
    }
    // today (운영 시작 또는 개별 오늘 항목)
    if (type === "today" && id !== "all") {
      const t = todayCache.find((x) => x.id === id);
      const text = t ? t.text : "오늘 항목";
      return {
        title: text.slice(0, 30),
        statusText: `⦿ 오늘 확인할 항목 — ${text}`,
        card: { kind: "card", title: "⦿ 오늘 확인할 항목", lines: [`<b>항목</b> ${esc(text)}`, `<b>우선순위</b> ${esc(t && t.priority || "-")}`] },
        suggestions: [
          { label: "이 항목 처리 방법 물어보기", hint: "판단", instruction: `"${text}" 어떻게 처리하면 될지 알려줘` },
          { label: "관련 취약점 정리", hint: "search", instruction: `"${text}" 관련 취약점 정리해줘` },
        ],
      };
    }
    const cnt = todayCache.length;
    return {
      title: "운영 시작 · 오늘 판단",
      statusText: `⦿ 오늘 확인할 항목 ${cnt}건\n` + todayCache.slice(0, 5).map((t) => `· ${t.text}`).join("\n"),
      card: { kind: "card", title: `⦿ 오늘 확인할 항목 ${cnt}건`, lines: todayCache.slice(0, 5).map((t) => `· ${esc(t.text)}`) },
      suggestions: [
        { label: "오늘 제일 급한 취약점 상위 3건", hint: "today", instruction: `오늘 제일 급한 취약점 상위 3건 정리해줘` },
        { label: "SLA 기한 임박·초과 알림", hint: "SLA", instruction: `SLA 기한이 임박하거나 초과한 조치 알려줘` },
        { label: "오늘 일일 브리핑 만들기", hint: "브리핑", instruction: `오늘 일일 브리핑 만들어줘` },
      ],
    };
  }

  // 대상 클릭 → contextRef 세션 생성 + 상태 카드를 첫 assistant 턴으로 기록 + 열기.
  async function openEntity(type, id) {
    const ctx = buildContext(type, id);
    try {
      const s = await window.gijo.createWorkSession(ctx.title, `${type}:${id}`);
      await window.gijo.addWorkSessionTurn(s.id, "assistant", ctx.statusText, "상태");
      await loadSessions(false);
      openSession(s.id);
    } catch (e) { alert("세션 생성 실패: " + (e && e.message || e)); }
  }

  // ── 세션 목록 ────────────────────────────────────────────────────────
  function sessionMatches(s, q) {
    if (!q) return true;
    return (s.title || "").toLowerCase().includes(q) || (s.lastPreview || "").toLowerCase().includes(q);
  }
  function renderSessionList() {
    const filtered = sessions.filter((s) => sessionMatches(s, searchQuery));
    if (!filtered.length) {
      sessionListEl.innerHTML = sessions.length
        ? `<div class="list-empty">검색 결과가 없습니다.</div>`
        : `<div class="list-empty">아직 세션이 없습니다.<br>＋ 새 세션으로 시작하세요.</div>`;
      return;
    }
    sessionListEl.innerHTML = filtered.map((s) => {
      const preview = s.lastPreview ? `${s.lastRole === "user" ? "" : "AI: "}${esc(s.lastPreview)}` : "새 대화 — 지시를 입력하세요";
      return `<div class="sitem ${s.id === currentId ? "on" : ""}" data-id="${s.id}">
        <div class="t">${esc(s.title)}</div>
        <div class="l">${preview}</div>
        <div class="m"><span>${fmtTime(s.updatedAt)} · ${s.turnCount}턴</span><span class="tag ${s.status}">${STATUS_LABEL[s.status] || s.status}</span></div>
      </div>`;
    }).join("");
    sessionListEl.querySelectorAll(".sitem").forEach((el) => el.addEventListener("click", () => openSession(el.dataset.id)));
  }
  async function loadSessions(selectFirst) {
    try {
      sessions = await window.gijo.listWorkSessions();
    } catch (e) {
      sessionListEl.innerHTML = `<div class="list-empty">세션을 불러오지 못했습니다.</div>`;
      return;
    }
    renderSessionList();
    if (selectFirst && !currentId && sessions.length) openSession(sessions[0].id);
  }

  // ── 대화(선택된 세션) ────────────────────────────────────────────────
  function turnHtml(t) {
    if (t.role === "user") return `<div class="turn"><div class="you"><b>나</b> — ${esc(t.content)}</div></div>`;
    // 대상에서 열린 세션의 첫 상태 요약은 상태 카드로(시안 C). 나머지는 일반 AI 답변.
    if (t.tool === "상태") {
      const lines = String(t.content).split("\n");
      const head = lines.shift() || "상태";
      return `<div class="turn"><div class="status-card"><div class="h">${esc(head)}</div><div class="l">${lines.map(esc).join("<br>")}</div></div></div>`;
    }
    const tag = t.tool ? `<span class="tool">${esc(t.tool)}</span>` : "";
    return `<div class="turn"><div class="ai">${tag}${esc(t.content)}</div></div>`;
  }
  // 추천 다음 단계(시안 C) — contextRef 세션이면 대화 아래에 클릭 가능한 단계 목록을 붙인다.
  function suggestionsHtml() {
    if (!currentSession || !currentSession.contextRef) return "";
    const [type, ...rest] = currentSession.contextRef.split(":");
    const ctx = buildContext(type, rest.join(":"));
    if (!ctx.suggestions || !ctx.suggestions.length) return "";
    const steps = ctx.suggestions
      .map((s, i) => `<div class="step" data-instr="${esc(s.instruction)}"><div class="n">${i + 1}</div><div class="x">${esc(s.label)}${s.hint ? ` <span>· ${esc(s.hint)}</span>` : ""}</div></div>`)
      .join("");
    return `<div class="suggest"><div class="ask">무엇을 도와드릴까요? 이런 작업을 할 수 있어요 —</div>${steps}</div>`;
  }
  function bindSuggestions() {
    convEl.querySelectorAll(".step[data-instr]").forEach((el) => el.addEventListener("click", () => { chatInput.value = el.dataset.instr; send(); }));
  }
  function renderConversation(turns) {
    if (!turns.length && !(currentSession && currentSession.contextRef)) {
      convEl.innerHTML = `<div class="conv-empty"><div class="big">🧭</div><div>새 세션입니다. 아래에 첫 지시를 입력하세요.</div></div>`;
      return;
    }
    convEl.innerHTML = turns.map(turnHtml).join("") + suggestionsHtml();
    bindSuggestions();
    convEl.scrollTop = convEl.scrollHeight;
  }
  async function openSession(id) {
    currentId = id;
    renderSessionList();
    convHead.style.display = "flex";
    convEmpty.style.display = "none";
    chatInput.disabled = false; sendBtn.disabled = false;
    convEl.innerHTML = `<div class="conv-empty"><div>불러오는 중…</div></div>`;
    try {
      const { session, turns } = await window.gijo.getWorkSession(id);
      currentSession = session;
      document.getElementById("convTitle").textContent = session.title;
      document.getElementById("convMeta").textContent = `오케스트레이터 · ${new Date(session.createdAt).toLocaleDateString("ko-KR")} 시작 · ${turns.length}턴`;
      document.getElementById("convStatus").value = session.status;
      renderConversation(turns);
      chatInput.focus();
    } catch (e) {
      convEl.innerHTML = `<div class="conv-empty"><div>대화를 불러오지 못했습니다.</div></div>`;
    }
  }

  async function newSession() {
    try {
      const s = await window.gijo.createWorkSession();
      await loadSessions(false);
      openSession(s.id);
    } catch (e) { alert("세션 생성 실패: " + (e && e.message || e)); }
  }

  async function send() {
    const text = chatInput.value.trim();
    if (!text || !currentId) return;
    chatInput.value = "";
    chatInput.disabled = true; sendBtn.disabled = true;
    // 낙관적 표시: 내 지시 + 처리중 인디케이터
    if (convEl.querySelector(".conv-empty")) convEl.innerHTML = "";
    convEl.insertAdjacentHTML("beforeend", `<div class="turn"><div class="you"><b>나</b> — ${esc(text)}</div></div>`);
    convEl.insertAdjacentHTML("beforeend", `<div class="turn" id="pendingTurn"><div class="ai pending">처리 중… 오케스트레이터가 작업하고 있습니다.</div></div>`);
    convEl.scrollTop = convEl.scrollHeight;
    try {
      await window.gijo.sendInstruction(text, currentId);
      // 서버에 기록된 실제 턴으로 대화·목록을 재동기화(도구 배지·자동 제목 반영).
      const { session, turns } = await window.gijo.getWorkSession(currentId);
      currentSession = session;
      document.getElementById("convTitle").textContent = session.title;
      document.getElementById("convMeta").textContent = `오케스트레이터 · ${new Date(session.createdAt).toLocaleDateString("ko-KR")} 시작 · ${turns.length}턴`;
      renderConversation(turns);
      await loadSessions(false);
    } catch (e) {
      const p = document.getElementById("pendingTurn");
      if (p) p.querySelector(".ai").innerHTML = `<span style="color:#f5928a">지시 처리 실패: ${esc(e && e.message || e)}</span>`;
    } finally {
      chatInput.disabled = false; sendBtn.disabled = false; chatInput.focus();
    }
  }

  // ── 세션 편집(이름·상태·삭제) ────────────────────────────────────────
  function startRename() {
    const titleEl = document.getElementById("convTitle");
    if (titleEl.querySelector("input")) return;
    const cur = titleEl.textContent;
    const input = document.createElement("input");
    input.value = cur;
    titleEl.innerHTML = ""; titleEl.appendChild(input); input.focus(); input.select();
    let done = false;
    const commit = async (save) => {
      if (done) return; done = true;
      if (save) {
        const nt = input.value.trim();
        try { if (nt && nt !== cur) await window.gijo.updateWorkSession(currentId, { title: nt }); } catch (e) { alert("이름 변경 실패: " + (e && e.message || e)); }
      }
      titleEl.textContent = save && input.value.trim() ? input.value.trim() : cur;
      await loadSessions(false);
    };
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); commit(true); } else if (e.key === "Escape") commit(false); });
    input.addEventListener("blur", () => commit(true));
  }
  async function changeStatus(e) {
    if (!currentId) return;
    try { await window.gijo.updateWorkSession(currentId, { status: e.target.value }); await loadSessions(false); }
    catch (err) { alert("상태 변경 실패: " + (err && err.message || err)); }
  }
  async function deleteSession() {
    if (!currentId) return;
    if (!confirm("이 세션과 대화를 삭제할까요? 되돌릴 수 없습니다.")) return;
    try {
      await window.gijo.deleteWorkSession(currentId);
      currentId = null; currentSession = null;
      convHead.style.display = "none";
      convEl.innerHTML = ""; convEl.appendChild(convEmpty); convEmpty.style.display = "flex";
      chatInput.disabled = true; sendBtn.disabled = true;
      await loadSessions(true);
    } catch (e) { alert("삭제 실패: " + (e && e.message || e)); }
  }

  async function init() {
    tick(); setInterval(tick, 30000);
    await loadUser(); await loadHealth();
    await loadExplorer();
    // 대시보드 세션 열에서 넘어온 딥링크(localStorage) — 특정 세션 열기 / 새 세션 시작.
    let openId = null, wantNew = false;
    try {
      openId = localStorage.getItem("gijo:sessions:open");
      wantNew = localStorage.getItem("gijo:sessions:new") === "1";
      localStorage.removeItem("gijo:sessions:open");
      localStorage.removeItem("gijo:sessions:new");
    } catch (e) {}
    await loadSessions(!openId && !wantNew); // 딥링크 없을 때만 최근 세션 자동 선택
    if (wantNew) await newSession();
    else if (openId && sessions.some((s) => s.id === openId)) openSession(openId);

    document.querySelectorAll(".header [data-page]").forEach((el) => el.addEventListener("click", () => window.gijo.navigateTo(el.dataset.page)));
    document.getElementById("settingsBtn").addEventListener("click", () => window.gijo.navigateTo("settings.html"));
    document.getElementById("newSessionBtn").addEventListener("click", newSession);
    document.getElementById("refreshExplorer").addEventListener("click", loadExplorer);
    document.getElementById("renameBtn").addEventListener("click", startRename);
    document.getElementById("convTitle").addEventListener("click", startRename);
    document.getElementById("deleteBtn").addEventListener("click", deleteSession);
    document.getElementById("convStatus").addEventListener("change", changeStatus);
    sendBtn.addEventListener("click", send);
    chatInput.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
    searchInput.addEventListener("input", (e) => { searchQuery = e.target.value.trim().toLowerCase(); renderSessionList(); });
  }

  if (!window.gijo.isAuthenticated()) window.gijo.navigateTo("login.html");
  else init();
</script>
</body>
</html>
