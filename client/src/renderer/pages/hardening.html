<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIJO AS — 원격 정기점검 관제</title>
<!-- 공용 디자인 시스템(시안 C) — 이 화면은 .g-* 컴포넌트를 채택한 파일럿이다. -->
<link rel="stylesheet" href="gijo-ui.css">
<style>
/* 색 토큰(공용 팔레트 — gijo-ui와 동일). 레이아웃·이 화면 고유 요소만 여기서 정의하고,
   버튼·카드·KPI·배지·입력·토글·모달은 gijo-ui.css의 .g-* 컴포넌트를 쓴다. */
:root{
  --bg:#262624;--panel:#30302e;--panel-2:#1f1e1d;--border:rgba(255,255,255,0.08);
  --border-strong:rgba(255,255,255,0.16);--blue:#3b82f6;--blue-light:#5fa1ff;
  --text:#e9e7e2;--muted:#b3ada4;--muted-2:#a49d95;--red:#e2483d;--amber:#f0a020;--teal:#1eb980;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Pretendard","Malgun Gothic","Segoe UI",sans-serif;background:var(--bg);color:var(--text);}
.app{display:grid;grid-template-columns:220px 1fr;}
.sidebar{padding:22px 14px;border-right:1px solid var(--border);min-height:900px;}
.main{padding:var(--g-s5) var(--g-s6) 48px;}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--panel-2);}
.header-left{display:flex;align-items:center;gap:12px;}.header-left img{height:22px;}
.app-title{font-size:15px;font-weight:800;color:#fff;}
.clock{font-size:12px;color:var(--blue-light);font-weight:600;}
.header-right{display:flex;align-items:center;gap:10px;}
.status-pill{display:flex;align-items:center;gap:6px;background:rgba(30,185,128,.15);border:1px solid rgba(30,185,128,.4);color:var(--teal);padding:6px 14px;border-radius:var(--g-r-pill);font-size:12px;font-weight:800;}
.status-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);}
.beta-tag{background:var(--teal);color:#06281c;font-size:11.25px;font-weight:800;padding:1px 6px;border-radius:4px;margin-left:2px;}
.avatar-btn{width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;}
.icon-btn{width:32px;height:32px;border-radius:var(--g-r-sm);background:var(--panel);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted);cursor:pointer;}
/* 페이지 고유 */
.page-title{font-size:var(--g-t-h1);font-weight:800;color:#fff;}
.page-sub{font-size:var(--g-t-sm);color:var(--muted);margin-top:var(--g-s1);max-width:920px;line-height:1.55;}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--g-s3);margin:var(--g-s5) 0 var(--g-s2);}
.sec{font-size:var(--g-t-h2);font-weight:800;color:#fff;margin:var(--g-s5) 0 var(--g-s3);display:flex;align-items:center;gap:var(--g-s2);}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--g-s3);}
/* 장비 카드 — g-card 규칙(표면1·라운드12·그림자) 기반 + 카드 내부 요소 */
.tcard{background:var(--g-surface-1);border:1px solid var(--border);border-radius:var(--g-r);padding:var(--g-s4);box-shadow:var(--g-shadow-1);}
.tcard.warn{border-color:rgba(226,72,61,.4);}
.tc-top{display:flex;align-items:center;gap:var(--g-s2);margin-bottom:var(--g-s2);}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto;}
.tc-name{color:#fff;font-size:var(--g-t-sm);font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tc-mid{display:flex;align-items:flex-end;gap:var(--g-s3);margin-bottom:var(--g-s2);}
.tc-rate{font-size:var(--g-t-kpi);font-weight:800;}
.tc-meta{display:flex;justify-content:space-between;font-size:var(--g-t-xs);color:var(--muted);border-top:1px solid var(--border);padding-top:var(--g-s2);font-family:Consolas,monospace;}
.tc-warn{margin-top:var(--g-s2);font-size:var(--g-t-xs);color:var(--red);font-weight:700;}
.tc-acts{margin-top:var(--g-s3);display:flex;gap:var(--g-s2);align-items:center;}
.tog-lbl{font-size:var(--g-t-xs);color:var(--muted);}
.empty{color:var(--muted);font-size:var(--g-t-sm);padding:36px;text-align:center;border:1px dashed var(--border-strong);border-radius:var(--g-r);}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:var(--g-s3);margin-bottom:var(--g-s3);}
.probe-res{font-size:var(--g-t-sm);margin-top:var(--g-s2);padding:8px 11px;border-radius:var(--g-r-sm);}
.toast{position:fixed;bottom:22px;right:22px;background:var(--panel);border:1px solid var(--border-strong);border-radius:var(--g-r);padding:11px 16px;font-size:var(--g-t-sm);color:#fff;z-index:60;max-width:420px;box-shadow:var(--g-shadow-2);display:none;}
.toast.show{display:block;}
.reg-guide{background:var(--panel-2,#1f1e1d);border:1px solid rgba(95,161,255,.25);border-radius:var(--g-r-sm);padding:11px 13px;font-size:var(--g-t-xs);color:var(--muted);line-height:1.75;margin-bottom:var(--g-s3);}
.reg-guide b{color:var(--blue-light,#5fa1ff);font-weight:700;}
.page-guide{background:var(--panel-2,#1f1e1d);border:1px solid var(--border);border-left:3px solid var(--blue,#3b82f6);border-radius:var(--g-r-sm);padding:10px 14px;font-size:var(--g-t-xs);color:var(--muted);line-height:1.7;margin:12px 0 16px;}
.page-guide b{color:#fff;font-weight:700;}
.page-guide .std{color:var(--blue-light,#5fa1ff);font-weight:700;}
</style>
<script src="viz.js"></script>
</head>
<body class="g-ui">

<!-- 상단 바는 공용이다 — titlebar.js가 그린다(분리창=공용 헤더, 탭 안=셸 탭줄). 화면마다 두던 사본 23개를 지웠다(2026-08-07). -->

<div class="app">
  <div class="sidebar" id="gijoNav"></div>
  <div class="main">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:16px">
      <div>
        <div class="page-title">🛡 원격 정기점검 관제</div>
      </div>
      <button class="g-btn g-primary" id="addBtn">＋ 대상 등록</button>
    </div>

    <div id="gijoChatWidget" data-prompts='["하드닝 점검해줘"]' style="max-width:640px;margin-bottom:16px;"></div>

    <!-- 설명은 화면에 늘어놓지 않고 챗봇(ⓘ '점검 방법')이 담당한다 — 2026-07-25 원칙. -->
    <div class="page-guide">읽기 전용 진단 명령만 실행합니다(설정 변경 없음).</div>

    <div class="kpis" id="kpiRow" data-gijo-summary></div>
    <!-- 그림 먼저(전-7 ①, 2026-08-05). 위 숫자는 평균 하나를 말한다 — 이 띠는 **어느 구간에
         몇 대가 몰려 있나**를 말한다(평균 80%여도 40%짜리 한 대가 숨어 있을 수 있다).
         누르면 아래 장비 카드가 그 구간만 남는다. -->
    <div id="vizStrip"></div>
    <div id="vizFilter" style="display:none"></div>

    <div class="sec">🖥 장비별 현황 <span id="cntLbl" style="color:var(--muted-2);font-weight:600;font-size:var(--g-t-xs)"></span></div>
    <div id="cardGrid" class="grid"></div>
  </div>
</div>

<!-- 대상 등록 모달 -->
<div class="g-modal-bg" id="regModal">
  <div class="g-modal" style="width:560px">
    <div class="mt">점검 대상(장비) 등록</div>
    <div class="reg-guide">연결 가능한 장비의 IP와 SSH 정보를 넣으면 그 장비에 접속해 점검합니다.</div>
    <div class="frow">
      <div class="g-field"><label>장비 이름</label><input class="g-input" id="rLabel" placeholder="경계 방화벽 (FW-01)"></div>
      <div class="g-field"><label>점검 기준(장비 유형)</label><select class="g-input" id="rStd"><option value="kisa">국내 CCE — 리눅스 서버 (U-시리즈)</option><option value="cis">CIS Benchmark (리눅스)</option><option value="kisa_pc">국내 CCE — Windows PC (PC-시리즈)</option><option value="kisa_net">국내 CCE — 네트워크 장비 (N-시리즈)</option></select></div>
    </div>
    <div class="frow">
      <div class="g-field"><label>인증 방식</label><select class="g-input" id="rAuth"><option value="key">SSH 키 (권장)</option><option value="password">비밀번호</option><option value="local">로컬(서버 자신)</option></select></div>
      <div class="g-field"></div>
    </div>
    <div class="frow">
      <div class="g-field"><label>호스트 / IP</label><input class="g-input" id="rHost" placeholder="10.10.1.5"></div>
      <div class="g-field"><label>포트</label><input class="g-input" id="rPort" value="22"></div>
    </div>
    <div class="frow" id="rCredRow">
      <div class="g-field"><label>계정</label><input class="g-input" id="rUser" placeholder="admin"></div>
      <div class="g-field"><label id="rSecLbl">개인키 경로</label><input class="g-input" id="rSecret" placeholder="/keys/id_ed25519"></div>
    </div>
    <div class="probe-res" id="rProbe" style="display:none"></div>
    <div class="macts">
      <button class="g-btn g-ghost" id="rCancel">취소</button>
      <button class="g-btn g-primary" id="rSubmit">등록 + 접속확인</button>
    </div>
  </div>
</div>

<!-- 스케줄 설정 모달 -->
<div class="g-modal-bg" id="schModal">
  <div class="g-modal" style="width:440px">
    <div class="mt" id="schTitle">정기점검 스케줄</div>
    <div class="frow">
      <div class="g-field"><label>점검 기준</label><select class="g-input" id="sStd"><option value="kisa">국내 CCE — 리눅스 서버 (KISA U-시리즈)</option><option value="cis">CIS Benchmark (리눅스)</option><option value="kisa_pc">국내 CCE — Windows PC (PC-시리즈)</option><option value="kisa_net">국내 CCE — 네트워크 장비 (N-시리즈)</option></select></div>
      <div class="g-field"><label>점검 주기(시간)</label><input class="g-input" id="sInterval" value="24"></div>
    </div>
    <div id="schExisting" style="font-size:var(--g-t-sm);color:var(--muted);margin-top:var(--g-s1)"></div>
    <div class="macts">
      <button class="g-btn g-ghost" id="sCancel">닫기</button>
      <button class="g-btn g-primary" id="sSubmit">스케줄 저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/</g, "&lt;");
  const rc = (r) => (r == null ? "#b3ada4" : r >= 80 ? "#1eb980" : r >= 60 ? "#f0a020" : "#e2483d");
  const authBadge = (a) => ({ key: "🔑 SSH 키", password: "🔒 비밀번호", local: "🖥 로컬" }[a] || a);
  let TARGETS = [], SCHEDULES = [], RUNS = [];

  function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 3500); }

  function spark(vals, w = 90, h = 26, color = "#5fa1ff") {
    if (!vals.length) return '<span style="color:var(--muted-2);font-size:11.75px">이력 없음</span>';
    if (vals.length === 1) vals = [vals[0], vals[0]];
    const min = Math.min(...vals, 0), max = Math.max(...vals, 100);
    const pts = vals.map((v, i) => `${(i / (vals.length - 1)) * w},${h - ((v - min) / (max - min || 1)) * h}`).join(" ");
    return `<svg width="${w}" height="${h}" style="vertical-align:middle"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2"/></svg>`;
  }

  // 대상별 파생값(최근 준수율·추세·스케줄·악화)
  function deriveTarget(t) {
    const runs = RUNS.filter((r) => r.targetId === t.id).sort((a, b) => a.at - b.at);
    const latest = runs[runs.length - 1] || null;
    const prev = runs[runs.length - 2] || null;
    const trend = runs.slice(-6).map((r) => r.rate);
    const worsening = latest && prev && latest.rate < prev.rate;
    const sched = SCHEDULES.find((s) => s.targetId === t.id) || null;
    return { runs, latest, trend, worsening, sched };
  }

  function renderKpis() {
    const derived = TARGETS.map(deriveTarget);
    const withRate = derived.filter((d) => d.latest);
    const avg = withRate.length ? Math.round(withRate.reduce((s, d) => s + d.latest.rate, 0) / withRate.length) : 0;
    const active = SCHEDULES.filter((s) => s.enabled).length;
    const worse = derived.filter((d) => d.worsening).length;
    $("kpiRow").innerHTML =
      `<div class="g-kpi"><div class="kv" style="color:#fff">${TARGETS.length}</div><div class="kl">등록 장비</div></div>` +
      `<div class="g-kpi"><div class="kv" style="color:#1eb980">${active}</div><div class="kl">활성 스케줄</div></div>` +
      `<div class="g-kpi"><div class="kv" style="color:${rc(withRate.length ? avg : null)}">${withRate.length ? avg + "%" : "—"}</div><div class="kl">평균 준수율</div></div>` +
      `<div class="g-kpi" ${worse ? 'style="border-color:rgba(226,72,61,.4)"' : ""}><div class="kv" style="color:${worse ? "#e2483d" : "#b3ada4"}">${worse}</div><div class="kl">악화 경고</div></div>`;
  }

  // ── 그림 먼저(전-7 ①, 2026-08-05) ──────────────────────────────────────
  // 구간 판정은 **rc()와 같은 경계**(80/60)를 쓴다 — 카드 색과 막대 구간이 어긋나면
  // "초록 카드인데 왜 보통에 세어졌지"가 된다. 판정은 한 곳에서만 한다.
  let 구간필터 = null;
  const 구간 = (r) => (r == null ? "none" : r >= 80 ? "good" : r >= 60 ? "fair" : "poor");
  const 구간한글 = { good: "양호 80%↑", fair: "보통 60~79%", poor: "위험 60%↓", none: "미점검" };

  function 그림띠() {
    const 자리 = $("vizStrip");
    if (!자리 || !window.gijoViz) return;
    const 셈 = { good: 0, fair: 0, poor: 0, none: 0 };
    TARGETS.forEach((t) => { const d = deriveTarget(t); 셈[구간(d.latest ? d.latest.rate : null)]++; });
    const 악화 = TARGETS.filter((t) => deriveTarget(t).worsening).length;

    window.gijoViz.mount(자리, {
      title: "한눈에",
      hint: TARGETS.length ? "누르면 목록이 좁혀집니다" : "",
      parts: [
        {
          kind: "bars",
          segments: [
            { key: "poor", label: "위험", value: 셈.poor, color: "bad" },
            { key: "fair", label: "보통", value: 셈.fair, color: "warn" },
            { key: "good", label: "양호", value: 셈.good, color: "ok" },
            { key: "none", label: "미점검", value: 셈.none, color: "idle" },
          ],
          onPick: (key) => { 구간필터 = key; 필터띠(); renderCards(); },
        },
        // 악화는 "지난번보다 나빠진 장비" — 0이면 그리지 않는다(없는 걱정을 만들지 않는다).
        악화 ? { kind: "donut", value: 악화, total: TARGETS.length, label: "악화", color: "bad", showRatio: true } : null,
      ],
    });
    if (구간필터) {
      const b = 자리.querySelector('.gviz-bar[data-key="' + 구간필터 + '"]');
      if (b) b.classList.add("on");
    }
    필터띠();
  }

  function 필터띠() {
    if (!window.gijoViz) return;
    const el = $("vizFilter");
    if (!구간필터) { window.gijoViz.filterBar(el, null, null); return; }
    const 보임 = TARGETS.filter((t) => 구간(deriveTarget(t).latest ? deriveTarget(t).latest.rate : null) === 구간필터).length;
    window.gijoViz.filterBar(el, { label: 구간한글[구간필터], 보임, 전체: TARGETS.length, 단위: "대" },
      () => {
        구간필터 = null;
        document.querySelectorAll("#vizStrip .gviz-bar").forEach((b) => b.classList.remove("on"));
        필터띠();
        renderCards();
      });
  }
  // ───────────────────────────────────────────────────────────────────────

  function renderCards() {
    그림띠();
    // ⚠ 「N대」는 **전체 대수**다 — 좁혀 보는 중에도 이 숫자는 안 줄어든다(위 KPI와 같은 규칙).
    $("cntLbl").textContent = `${TARGETS.length}대`;
    if (!TARGETS.length) { $("cardGrid").className = ""; $("cardGrid").innerHTML = '<div class="empty">등록된 점검 대상이 없습니다. 오른쪽 위 <b>＋ 대상 등록</b>으로 보안장비를 추가하세요.</div>'; return; }
    const 보일것 = 구간필터 ? TARGETS.filter((t) => 구간(deriveTarget(t).latest ? deriveTarget(t).latest.rate : null) === 구간필터) : TARGETS;
    if (!보일것.length) {
      $("cardGrid").className = "";
      $("cardGrid").innerHTML = '<div class="empty">고른 구간에 해당하는 장비가 없습니다 — 위 「✕ 해제」를 누르면 전체가 다시 보입니다.</div>';
      return;
    }
    $("cardGrid").className = "grid";
    $("cardGrid").innerHTML = 보일것.map((t) => {
      const d = deriveTarget(t);
      const rate = d.latest ? d.latest.rate : null;
      const stdLabel = STD_SHORT[stdFor(t)] || "리눅스";
      const nextTxt = d.sched && d.sched.enabled ? `⏱ ${d.sched.intervalHours}시간 · ${new Date(d.sched.nextRunAt).toLocaleString("ko-KR", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" })}` : "정기점검 미설정";
      const hostTxt = t.host === "local" ? "🖥 로컬" : `${t.host}:${t.port}`;
      return `<div class="tcard ${d.worsening ? "warn" : ""}">
        <div class="tc-top"><span class="dot" style="background:${d.sched && d.sched.enabled ? rc(rate) : "#a49d95"}"></span>
          <span class="tc-name" title="${esc(t.label)}">${esc(t.label)}</span><span class="g-badge g-b-med">${stdLabel}</span></div>
        <div class="tc-mid"><div class="tc-rate" style="color:${rc(rate)}">${rate == null ? "—" : rate + "%"}</div>
          <div style="flex:1;text-align:right">${spark(d.trend, 90, 26, rc(rate))}</div></div>
        <div class="tc-meta"><span>${esc(hostTxt)} · ${authBadge(t.authMethod)}</span><span>${nextTxt}</span></div>
        ${d.worsening ? `<div class="tc-warn">▼ 지난 점검 대비 악화(${d.runs[d.runs.length - 2].rate}% → ${rate}%) — 확인 필요</div>` : ""}
        <div class="tc-acts">
          ${d.sched ? `<span class="g-toggle ${d.sched.enabled ? "g-on" : ""}" data-toggle="${d.sched.id}" data-on="${d.sched.enabled ? 1 : 0}"><span class="k"></span></span><span class="tog-lbl">정기점검 ${d.sched.enabled ? "켜짐" : "꺼짐"}</span>` : `<span class="tog-lbl">정기점검 없음</span>`}
          <button class="g-btn g-sm g-ghost" data-sched="${t.id}" style="margin-left:auto">스케줄</button>
          <button class="g-btn g-sm g-primary" data-scan="${t.id}">점검</button>
          <button class="g-btn g-sm g-ghost" data-del="${t.id}" title="삭제">✕</button>
        </div></div>`;
    }).join("");
    // 이벤트 바인딩
    document.querySelectorAll("[data-scan]").forEach((b) => b.addEventListener("click", () => scanNow(b.dataset.scan)));
    document.querySelectorAll("[data-del]").forEach((b) => b.addEventListener("click", () => removeTarget(b.dataset.del)));
    document.querySelectorAll("[data-sched]").forEach((b) => b.addEventListener("click", () => openSched(b.dataset.sched)));
    document.querySelectorAll("[data-toggle]").forEach((el) => el.addEventListener("click", () => toggleSched(el.dataset.toggle, el.dataset.on !== "1")));
  }

  async function loadAll() {
    const [tg, sc, rn] = await Promise.all([window.gijo.hardeningTargets.list(), window.gijo.hardeningSchedules.list(), window.gijo.hardeningRuns()]);
    TARGETS = tg.targets || []; SCHEDULES = sc.schedules || []; RUNS = rn.runs || [];
    renderKpis(); renderCards();
  }

  // 대상별 점검 기준: 스케줄 있으면 그 기준, 없으면 대상 등록 시 정한 기본 기준(장비 유형), 그것도 없으면 kisa
  function stdFor(t) { const s = SCHEDULES.find((x) => x.targetId === t.id); return s ? s.standard : (t.standard || "kisa"); }
  const STD_SHORT = { kisa: "리눅스", cis: "CIS", kisa_pc: "PC", kisa_net: "네트워크" };

  async function scanNow(id) {
    const t = TARGETS.find((x) => x.id === id); if (!t) return;
    toast(`${t.label} 점검 실행 중…`);
    try { const r = await window.gijo.hardeningTargets.scan(id, stdFor(t)); toast(`${t.label} — 준수율 ${r.report.summary.rate}% · 취약 ${r.report.summary.fail}`); await loadAll(); }
    catch (e) { toast(`점검 실패: ${(e && e.message) || e}`); }
  }
  async function removeTarget(id) {
    const t = TARGETS.find((x) => x.id === id); if (!t) return;
    if (!await gijoAsk(`'${t.label}' 대상과 관련 스케줄을 삭제할까요? (점검 이력은 보존됩니다)`)) return;
    await window.gijo.hardeningTargets.remove(id); toast("대상 삭제됨"); await loadAll();
  }

  // 등록 모달
  function syncCred() {
    const a = $("rAuth").value;
    $("rCredRow").style.display = a === "local" ? "none" : "grid";
    $("rSecLbl").textContent = a === "password" ? "비밀번호" : "개인키 경로";
    $("rSecret").placeholder = a === "password" ? "••••••" : "/keys/id_ed25519";
    $("rSecret").type = a === "password" ? "password" : "text";
    if (a === "local") $("rHost").value = "local";
  }
  function openReg() { $("rProbe").style.display = "none"; $("regModal").classList.add("g-on"); }
  async function submitReg() {
    const authMethod = $("rAuth").value;
    const body = { label: $("rLabel").value.trim(), host: (authMethod === "local" ? "local" : $("rHost").value.trim()), port: Number($("rPort").value) || 22, username: $("rUser").value.trim(), authMethod, secret: $("rSecret").value, standard: $("rStd").value };
    if (!body.label || !body.host) { toast("장비 이름과 호스트를 입력하세요"); return; }
    $("rSubmit").disabled = true; $("rSubmit").textContent = "등록 중…";
    try {
      const { target } = await window.gijo.hardeningTargets.create(body);
      const pr = $("rProbe"); pr.style.display = "block";
      if (authMethod !== "local") {
        const p = await window.gijo.hardeningTargets.probe(target.id);
        pr.style.background = p.ok ? "rgba(30,185,128,.12)" : "rgba(226,72,61,.12)";
        pr.style.color = p.ok ? "#1eb980" : "#e2483d";
        pr.innerHTML = (p.ok ? "✅ 접속 확인 — " : "⚠ 접속 실패 — ") + esc(p.detail);
      }
      toast(`'${target.label}' 등록됨`); await loadAll();
      setTimeout(() => { $("regModal").classList.remove("g-on"); ["rLabel", "rHost", "rUser", "rSecret"].forEach((i) => ($(i).value = "")); $("rProbe").style.display = "none"; }, authMethod === "local" ? 200 : 1400);
    } catch (e) { toast(`등록 실패: ${(e && e.message) || e}`); }
    finally { $("rSubmit").disabled = false; $("rSubmit").textContent = "등록 + 접속확인"; }
  }

  // 스케줄 모달
  let schTargetId = null;
  function openSched(targetId) {
    const t = TARGETS.find((x) => x.id === targetId); if (!t) return;
    schTargetId = targetId;
    const s = SCHEDULES.find((x) => x.targetId === targetId);
    $("schTitle").textContent = `정기점검 스케줄 — ${t.label}`;
    $("sStd").value = s ? s.standard : "kisa";
    $("sInterval").value = s ? s.intervalHours : 24;
    $("schExisting").innerHTML = s ? `현재: ${s.standard.toUpperCase()} · ${s.intervalHours}시간마다 · ${s.enabled ? "활성" : "비활성"} · 다음 ${new Date(s.nextRunAt).toLocaleString("ko-KR")}` : "아직 스케줄이 없습니다. 저장하면 다음 점검 주기에 자동 실행됩니다.";
    $("schModal").classList.add("g-on");
  }
  async function submitSched() {
    if (!schTargetId) return;
    const std = $("sStd").value; const interval = Math.max(1, Number($("sInterval").value) || 24);
    const existing = SCHEDULES.find((x) => x.targetId === schTargetId);
    $("sSubmit").disabled = true;
    try {
      if (existing) await window.gijo.hardeningSchedules.remove(existing.id); // 재설정 = 기존 삭제 후 재생성
      await window.gijo.hardeningSchedules.create(schTargetId, std, interval);
      toast("스케줄 저장됨 — 다음 주기에 자동 점검"); $("schModal").classList.remove("g-on"); await loadAll();
    } catch (e) { toast(`스케줄 저장 실패: ${(e && e.message) || e}`); }
    finally { $("sSubmit").disabled = false; }
  }
  async function toggleSched(id, enabled) {
    await window.gijo.hardeningSchedules.toggle(id, enabled); toast(enabled ? "정기점검 켜짐" : "정기점검 꺼짐"); await loadAll();
  }

  async function init() {
    await loadAll();
    $("addBtn").addEventListener("click", openReg);
    $("rCancel").addEventListener("click", () => $("regModal").classList.remove("g-on"));
    $("rSubmit").addEventListener("click", submitReg);
    $("rAuth").addEventListener("change", syncCred); syncCred();
    $("sCancel").addEventListener("click", () => $("schModal").classList.remove("g-on"));
    $("sSubmit").addEventListener("click", submitSched);
    document.querySelectorAll("[data-page]").forEach((el) => el.addEventListener("click", () => window.gijo.navigateTo(el.dataset.page)));
    // 모달 배경 클릭 시 닫기
    document.querySelectorAll(".g-modal-bg").forEach((bg) => bg.addEventListener("click", (e) => { if (e.target === bg) bg.classList.remove("g-on"); }));
    setInterval(loadAll, 30000); // 정기점검이 백그라운드로 돌므로 주기적 새로고침
  }

  if (!window.gijo.isAuthenticated()) window.gijo.navigateTo("login.html");
  else init();
</script>
<script src="nav.js"></script>
<script src="workflowrail.js"></script>
<script src="progresscard.js"></script>
<script src="gijomd.js"></script>
<script src="chatparts.js"></script>
<script src="chatwidget.js"></script>
</body>
</html>
