<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIJO AS — 기능 안내</title>
<style>
:root{
  --bg:#0a0e1a;--panel:#121a2e;--panel-2:#0e1526;--border:rgba(255,255,255,0.08);
  --border-strong:rgba(255,255,255,0.16);--blue:#3b82f6;--blue-light:#5fa1ff;--white:#ffffff;
  --text:#e7eaf3;--muted:#8b93ab;--muted-2:#5f6785;--red:#e2483d;--amber:#f0a020;--teal:#1eb980;--purple:#8b7cf0;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Pretendard","Malgun Gothic","Segoe UI",sans-serif;background:var(--bg);color:var(--text);}
.app{display:grid;grid-template-columns:220px 1fr;}
.sidebar{padding:22px 14px;border-right:1px solid var(--border);min-height:900px;}
.main{padding:28px 32px 48px;}
.topbar-row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;}
.page-title{font-size:21px;font-weight:800;color:#fff;}
.page-sub{font-size:12.5px;color:var(--muted);margin-top:4px;max-width:960px;line-height:1.55;}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--panel-2);}
.header-left{display:flex;align-items:center;gap:12px;}
.header-left img{height:22px;}
.app-title{font-size:15px;font-weight:800;color:#fff;}
.clock{font-size:12px;color:var(--blue-light);font-weight:600;}
.header-right{display:flex;align-items:center;gap:10px;}
.status-pill{display:flex;align-items:center;gap:6px;background:rgba(30,185,128,0.15);border:1px solid rgba(30,185,128,0.4);color:var(--teal);padding:6px 14px;border-radius:20px;font-size:12px;font-weight:800;}
.status-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);}
.beta-tag{background:var(--teal);color:#06281c;font-size:9px;font-weight:800;padding:1px 6px;border-radius:4px;margin-left:2px;}
.avatar-btn{width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;}
.icon-btn{width:32px;height:32px;border-radius:8px;background:var(--panel);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted);cursor:pointer;}

.searchbar{background:var(--panel);border:1px solid var(--border-strong);border-radius:9px;padding:10px 14px;font-size:13px;color:var(--text);margin-bottom:16px;width:100%;max-width:1000px;outline:none;}
.cat{max-width:1000px;margin-bottom:22px;}
.cat-h{font-size:14px;font-weight:800;color:#fff;margin-bottom:10px;}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
th{text-align:left;font-size:10px;font-weight:700;color:var(--muted-2);text-transform:uppercase;letter-spacing:.5px;padding:9px 12px;border-bottom:1px solid var(--border);background:var(--panel-2);}
td{padding:11px 12px;border-bottom:1px solid var(--border);vertical-align:top;font-size:12px;}
tr:last-child td{border-bottom:none;}
.fn{font-weight:700;color:#fff;white-space:nowrap;}
.inputs{display:flex;gap:5px;flex-wrap:wrap;}
.chip{font-size:10.5px;padding:2px 8px;border-radius:5px;background:var(--panel-2);border:1px solid var(--border);color:var(--muted);}
.chip.req{border-color:rgba(226,72,61,.4);color:#f5928a;}
.chip.none{color:var(--muted-2);border-style:dashed;}
.go{font-size:11px;font-weight:800;color:var(--blue-light);cursor:pointer;white-space:nowrap;}
.go:hover{text-decoration:underline;}
.note{max-width:1000px;font-size:11px;color:var(--muted-2);line-height:1.6;margin-top:4px;}
.hidden{display:none;}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <span id="homeLink" data-page="dashboard.html" title="대시보드로 이동" style="display:flex;align-items:center;gap:12px;cursor:pointer"><img src="https://gijo.ai/_nuxt/logo_gijo_white.CCh2YXJe.svg" alt="GIJO">
    <div class="app-title">GIJO AS</div></span>
    <div class="clock" id="clockEl">-</div>
  </div>
  <div class="header-right">
    <div class="status-pill" id="statusPill"><span class="dot"></span>연결 확인 중<span class="beta-tag">LIVE</span></div>
    <div class="avatar-btn" id="avatarBtn">-</div>
    <div class="icon-btn" id="settingsBtn">⚙</div>
  </div>
</div>

<div class="app">
  <div class="sidebar" id="gijoNav"></div>
  <div class="main">
    <div class="topbar-row">
      <div>
        <div class="page-title">❓ 기능 안내</div>
      </div>
    </div>

    <input class="searchbar" id="searchBox" placeholder="🔎 기능·입력칸 검색 (예: 담당부서, CVE, SMTP, 터미널)" aria-label="기능·입력칸 검색">
    <div id="catWrap"></div>
    <div class="note">각 입력칸 목록은 제품 화면 기준으로 정리됩니다. 새 기능이 추가되면 이 표도 갱신됩니다.</div>
  </div>
</div>

<script>
  const clockEl = document.getElementById("clockEl");
  const statusPill = document.getElementById("statusPill");
  const avatarBtn = document.getElementById("avatarBtn");
  const esc = (s) => String(s == null ? "" : s).replace(/</g, "&lt;");

  // 대분류 → 기능 → 입력칸(리스트). req=필수, none=입력없음.
  const CATS = [
    { h: "🖥 관제·모니터링", fns: [
      { fn: "대시보드", page: "dashboard.html", inputs: [["지휘 콘솔 지시"]] },
      { fn: "보안 KPI", page: "kpi.html", inputs: [["입력 없음(조회)", "none"]] },
      { fn: "보안 분석", page: "analysis.html", inputs: [["로그·리포트 드롭존 업로드"]] },
      { fn: "작업 세션", page: "sessions.html", inputs: [["세션 검색"], ["이어서 지시"]] },
      { fn: "위협 인텔리전스", page: "threat.html", inputs: [["벤더 API 키"]] },
    ]},
    { h: "🛡 자산·취약점·대응", fns: [
      { fn: "자산 등록·목록", page: "inventory.html", inputs: [["자산 ID","req"],["이름","req"],["경로","req"],["담당부서"],["서비스"],["저장소 스캔(조직·토큰·BaseURL)"],["검색"]] },
      { fn: "AI-BOM 구성", page: "sbom.html", inputs: [["자산 검색"],["가중치 파일 경로"],["AI-BOM 5영역 값"]] },
      { fn: "취약점", page: "vulnscan.html", inputs: [["스캔 리포트 업로드"],["출처 라벨"],["취약점·CVE 검색"]] },
      { fn: "조치·승인", page: "approvals.html", inputs: [["담당자"],["기한"],["판정(오탐·완료)"]] },
      { fn: "보안제품", page: "products.html", inputs: [["제품명","req"],["종류"],["제조사"],["모델"],["매뉴얼 업로드"],["정형정보 9항목(펌웨어·IP·로그형식·EOL 등)"]] },
      { fn: "유지보수", page: "opsguide.html", inputs: [["점검 제목","req"],["대상 제품","req"],["점검일","req"],["점검 결과 메모"],["수신자 이메일"]] },
      { fn: "리포트", page: "report.html", inputs: [["유형(주간·분기·수시)"],["대상 자산"],["형식(docx·pdf)"]] },
      { fn: "컴플라이언스", page: "compliance.html", inputs: [["대응 상태"],["대응 근거·메모"]] },
    ]},
    { h: "🤖 AI", fns: [
      { fn: "에이전트 AI", page: "agent.html", inputs: [["팀 지시"],["HF 모델 검색"],["에이전트 이름(관리자)"],["모델 배정(관리자)"]] },
      { fn: "LLM 합성", page: "merge.html", inputs: [["모델 A·B 선택"]] },
      { fn: "기억·학습(RAG)", page: "memory.html", inputs: [["문서 경로/붙여넣기"],["scope"],["데이터셋 ID"],["질의"]] },
      { fn: "문서 보강", page: "docenrich.html", inputs: [["제품","req"],["섹션","req"],["증상·원인·해결"],["원문 붙여넣기"]] },
      { fn: "온톨로지", page: "ontology.html", inputs: [["주어","req"],["관계","req"],["목적어","req"],["출처"],["질의"]] },
      { fn: "학습 루프", page: "learnloop.html", inputs: [["베이스 모델"],["모델 접두어"],["데이터셋"]] },
      { fn: "레드팀·가드레일", page: "redteam.html", inputs: [["점검 대상 모델·자산"],["가드레일 모드"]] },
    ]},
    { h: "🛠 시스템", fns: [
      { fn: "로그", page: "logs.html", inputs: [["입력 없음(조회)","none"]] },
      { fn: "작업 기록(감사)", page: "audit.html", inputs: [["종류 필터·검색"],["CSV 내보내기"]] },
      { fn: "터미널(CLI)", page: "terminal.html", inputs: [["명령 입력(담당자 PC 실행)"],["챗봇에게 명령 요청(허용목록·승인)"]] },
      { fn: "설정", page: "settings.html", inputs: [["서버 주소"],["비밀번호 변경"],["계정(아이디·이름·비번)"],["기본 모델"],["SMTP(호스트·포트·발신)"],["클라우드(모델·API키)"]] },
    ]},
  ];

  function tick() { clockEl.textContent = new Date().toLocaleString("ko-KR", { hour: "2-digit", minute: "2-digit", hour12: true, year: "numeric", month: "2-digit", day: "2-digit" }); }
  async function loadHealth() { try { await window.gijo.checkServerHealth(); statusPill.innerHTML = '<span class="dot"></span>운영중<span class="beta-tag">LIVE</span>'; } catch (e) { statusPill.innerHTML = '<span class="dot" style="background:#e2483d"></span>서버 연결 끊김'; } }
  async function loadUser() { try { const u = await window.gijo.me(); avatarBtn.textContent = (u.displayName || u.username || "-").charAt(0); } catch (e) {} }

  function chipHtml(inp) { const cls = inp[1] ? " " + inp[1] : ""; return `<span class="chip${cls}">${esc(inp[0])}</span>`; }
  function render() {
    const wrap = document.getElementById("catWrap");
    wrap.innerHTML = CATS.map((c) =>
      `<div class="cat"><div class="cat-h">${esc(c.h)}</div><table>` +
      `<tr><th style="width:190px">기능</th><th>입력칸</th><th style="width:60px">이동</th></tr>` +
      c.fns.map((f) =>
        `<tr data-search="${esc((f.fn + " " + f.inputs.map(i=>i[0]).join(" ")).toLowerCase())}">` +
        `<td class="fn">${esc(f.fn)}</td>` +
        `<td><div class="inputs">${f.inputs.map(chipHtml).join("")}</div></td>` +
        `<td class="go" data-go="${f.page}">이동 →</td></tr>`
      ).join("") + `</table></div>`
    ).join("");
    wrap.querySelectorAll("[data-go]").forEach((el) => el.addEventListener("click", () => window.gijo.navigateTo(el.dataset.go)));
  }
  function applySearch() {
    const q = (document.getElementById("searchBox").value || "").toLowerCase();
    document.querySelectorAll("#catWrap tr[data-search]").forEach((tr) => {
      tr.classList.toggle("hidden", q && !tr.dataset.search.includes(q));
    });
    document.querySelectorAll("#catWrap .cat").forEach((cat) => {
      const anyVisible = [...cat.querySelectorAll("tr[data-search]")].some((tr) => !tr.classList.contains("hidden"));
      cat.classList.toggle("hidden", !anyVisible);
    });
  }

  async function init() {
    tick(); setInterval(tick, 30000);
    await loadUser(); loadHealth();
    render();
    document.getElementById("searchBox").addEventListener("input", applySearch);
    document.getElementById("settingsBtn").addEventListener("click", () => window.gijo.navigateTo("settings.html"));
    document.querySelectorAll("[data-page]").forEach((el) => el.addEventListener("click", () => window.gijo.navigateTo(el.dataset.page)));
  }
  if (!window.gijo.isAuthenticated()) window.gijo.navigateTo("login.html");
  else init();
</script>

<div id="gijoChatWidget" data-start="collapsed" data-prompts='["어떤 기능이 있어?"]'></div>
<script src="nav.js"></script>
<script src="chatwidget.js"></script>
</body>
</html>
