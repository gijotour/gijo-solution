<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIJO AS — 보안 로그 파일 분석</title>
<!--
  보안 로그 파일 분석 (추가 기능, 2026-08-09 사용자 지시 · mockups/log-analysis 추천안).
  "분석 결과를 보고, 절차를 그대로 따라 하면 일이 끝나는 자리."
  · 파일 올리기는 **대화창 ＋** (이 화면엔 업로드 없음 — 메뉴는 보기용 원칙)
  · 데이터는 분석 허브의 보안로그 이벤트(source="log")를 파일(ref) 단위로 묶은 것 — 새 파서 없음
  · 대응 절차는 서버 규칙(logguide.ts)이 결정적으로 준다 — LLM 지어냄이 절차에 섞이면 안 된다
  · [후속 작업으로 담기]는 오늘 계획(tasks)으로 이어진다 — 대시보드 담기와 같은 통로
-->
<style>
:root{
  --bg:#262624;--panel:#30302e;--panel-2:#1f1e1d;--border:rgba(255,255,255,0.08);
  --border-strong:rgba(255,255,255,0.16);--blue:#3b82f6;--blue-light:#5fa1ff;--white:#ffffff;
  --text:#e9e7e2;--muted:#b3ada4;--muted-2:#a49d95;--red:#e2483d;--amber:#f0a020;--teal:#1eb980;--purple:#8b7cf0;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Pretendard","Malgun Gothic","Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:13px;}
.app{display:grid;grid-template-columns:212px 1fr;min-height:100vh;}
.sidebar{border-right:1px solid var(--border);background:var(--panel-2);}
.main{padding:18px 22px 40px;max-width:1800px;}
.scr-id{font-size:12.5px;color:var(--muted);margin-bottom:12px;}
.scr-id b{color:var(--text);font-weight:800;}

.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:13px 15px;margin-bottom:12px;min-width:0;}
.ph{font-size:13px;font-weight:800;color:var(--text-strong, #fff);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
.ph .cnt{margin-left:auto;font-size:12px;color:var(--muted-2);font-weight:700;}

/* 파일 대장 — 줄 26px 밀도 */
.frow{display:flex;align-items:center;gap:10px;padding:5px 6px;border-top:1px solid rgba(255,255,255,.05);font-size:12.5px;cursor:pointer;min-width:0;}
.frow:hover{background:rgba(255,255,255,.03);}
.frow.sel{background:rgba(59,130,246,.09);}
.frow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);font-weight:700;}
.frow .m{flex:0 0 auto;color:var(--muted-2);font-size:12px;white-space:nowrap;}
.pri{flex:0 0 auto;font-size:11.5px;font-weight:800;padding:1px 7px;border-radius:9px;}
.pri.p0{color:var(--red);background:rgba(226,72,61,.14);}
.pri.p1{color:var(--amber-ink, #e8823c);background:rgba(232,130,60,.12);}

.cols{display:grid;grid-template-columns:58fr 42fr;gap:12px;align-items:start;}
@media (max-width:1000px){.cols{grid-template-columns:1fr;}}

/* 이벤트 목록 */
.erow{display:flex;align-items:center;gap:9px;padding:6px 6px;border-top:1px solid rgba(255,255,255,.05);font-size:12.5px;cursor:pointer;min-width:0;}
.erow:hover{background:rgba(255,255,255,.03);}
.erow.sel{background:rgba(59,130,246,.09);}
.etag{flex:0 0 auto;font-size:11.5px;font-weight:800;padding:1px 7px;border-radius:9px;color:var(--amber);background:rgba(240,160,32,.12);}
.etag.hot{color:var(--red);background:rgba(226,72,61,.12);}
.erow .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.erow.done .tx{color:var(--muted-2);text-decoration:line-through;}

/* 대응 절차 카드 */
.gd-t{font-size:13.5px;font-weight:800;color:var(--text-strong, #fff);}
.gd-basis{font-size:11.75px;color:var(--muted-2);margin:6px 0 10px;line-height:1.6;}
.step{display:flex;gap:9px;padding:6px 0;border-top:1px solid rgba(255,255,255,.05);font-size:12.5px;line-height:1.55;}
.step .n{flex:0 0 auto;width:18px;height:18px;border-radius:50%;background:rgba(59,130,246,.16);color:var(--blue-light);font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px;}
.gd-act{margin-top:11px;display:flex;align-items:center;gap:10px;}
.gd-btn{background:rgba(59,130,246,.14);border:1px solid rgba(59,130,246,.45);color:var(--blue-light);font-weight:800;font-size:12.5px;padding:8px 14px;border-radius:9px;cursor:pointer;font-family:inherit;}
.gd-btn:hover{background:rgba(59,130,246,.22);}
.gd-note{font-size:11.75px;color:var(--muted-2);}
.empty{font-size:12.5px;color:var(--muted-2);padding:10px 2px;line-height:1.7;}
</style>
</head>
<body data-screen="loganalysis"><!-- .frow 이름 충돌 회피용 표식(밀도 시안 2026-08-19) -->
<div class="app">
  <aside class="sidebar" id="gijoNav"></aside>
  <div class="main">
    <div class="scr-id"><b>보안 로그 파일 분석</b> — 올린 로그 파일이 어떤 자산으로 등록·연결됐는지 빠르게 확인하고, 대응 절차를 따라 합니다. 파일은 대화창 ＋로 올립니다.</div>

    <div class="panel">
      <div class="ph">📄 올린 파일 대장 <span class="cnt" id="fileCnt"></span></div>
      <div id="fileRows"><div class="empty">불러오는 중…</div></div>
      <!-- 파일→자산 연결 확인(2026-08-09 사용자 방향: "업로드 시 자산으로 등록·관리되는 것을
           빠르게 확인") — 선택 파일의 이벤트가 닿은 우리 자산과 등록 여부를 한 줄로 보여준다. -->
      <div id="assetStrip" style="display:none;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.06);font-size:12.5px;color:var(--muted);line-height:1.9"></div>
    </div>

    <div class="cols">
      <div class="panel">
        <div class="ph">🚨 이벤트 <span class="cnt" id="evCnt"></span></div>
        <div id="evRows"><div class="empty">위에서 파일을 고르세요.</div></div>
      </div>
      <div class="panel">
        <div class="ph">🧭 대응 절차</div>
        <div id="guideBox"><div class="empty">이벤트를 고르면 행동강령 기반 절차가 나옵니다.</div></div>
      </div>
    </div>
  </div>
</div>

<div id="gijoChatWidget"></div>

<script src="dialog.js"></script>
<script src="nav.js"></script>
<script src="selectnotify.js"></script>
<script src="gijomd.js"></script>
<script src="chatparts.js"></script>
<script src="chatwidget.js"></script>
<script src="titlebar.js"></script>
<script>
(function () {
  "use strict";
  if (!window.gijo || !window.gijo.isAuthenticated || !window.gijo.isAuthenticated()) { location.href = "login.html"; return; }

  var 파일들 = [];
  var 이벤트들 = [];   // 전체 log 이벤트(파일 선택 시 걸러 씀)
  var 선택파일 = null;
  var 선택이벤트 = null;

  var esc = function (s) { return String(s ?? "").replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var 때 = function (t) { try { return new Date(t).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; } };

  function renderFiles() {
    var box = document.getElementById("fileRows");
    document.getElementById("fileCnt").textContent = 파일들.length ? 파일들.length + "개 파일" : "";
    if (!파일들.length) {
      // 빈 상태에도 다음 걸음을 준다 — "왜 비었지"로 끝나면 담당자는 여기서 막힌다.
      box.innerHTML = '<div class="empty">아직 분석된 로그 파일이 없습니다.<br>대화창 ＋로 방화벽·서버 로그 파일을 올리면 자동으로 분석돼 여기 쌓입니다.</div>';
      return;
    }
    box.innerHTML = 파일들.map(function (f) {
      return '<div class="frow' + (선택파일 === f.ref ? " sel" : "") + '" data-ref="' + esc(f.ref) + '">' +
        '<span class="nm">' + esc(f.ref) + "</span>" +
        (f.p0 ? '<span class="pri p0">P0 ' + f.p0 + "</span>" : "") +
        (f.p1 ? '<span class="pri p1">P1 ' + f.p1 + "</span>" : "") +
        '<span class="m">이벤트 ' + f.events + " · 열림 " + f.open + "</span>" +
        '<span class="m">' + 때(f.latestAt) + "</span>" +
        // 삭제(2026-08-19 삭제 일관화 ① — 사장님 「올린 파일 삭제 메뉴 있을까?」): 이 파일의
        // 분석 이벤트를 지운다(서버가 스냅샷 후 삭제·감사 기록). 장기기억의 원문은 지식이라
        // 남는다 — 문서 삭제는 AI › 지식 판 또는 「○○ 문서 지워줘」가 맡는다.
        '<button class="lf-del" data-del="' + esc(f.ref) + '" title="이 파일의 분석 이벤트를 지웁니다(원문 지식은 남음)">🗑</button></div>';
    }).join("");
    box.querySelectorAll(".frow").forEach(function (r) {
      r.addEventListener("click", function () { 선택파일 = r.dataset.ref; 선택이벤트 = null; renderFiles(); renderEvents(); renderAssetStrip(); renderGuide(null, ""); });
    });
    box.querySelectorAll("[data-del]").forEach(function (b) {
      b.addEventListener("click", function (ev) {
        ev.stopPropagation(); // 행 선택과 분리
        var ref = b.getAttribute("data-del");
        window.gijoAsk("「" + ref + "」의 분석 이벤트를 전부 지울까요? (지우기 전 스냅샷이 남고, 장기기억의 원문은 남습니다)", { danger: true }).then(function (yes) {
          if (!yes) return;
          window.gijo.analysisRemoveFile(ref).then(function () {
            if (선택파일 === ref) { 선택파일 = null; 선택이벤트 = null; }
            불러오기();
          }).catch(function (e) { window.gijoTell("삭제 실패: " + ((e && e.message) || e)); });
        });
      });
    });
  }

  function renderEvents() {
    var box = document.getElementById("evRows");
    var rows = 이벤트들.filter(function (e) { return e.ref === 선택파일; });
    document.getElementById("evCnt").textContent = rows.length ? rows.length + "건" : "";
    if (!선택파일) { box.innerHTML = '<div class="empty">위에서 파일을 고르세요.</div>'; return; }
    if (!rows.length) { box.innerHTML = '<div class="empty">이 파일에서 위험 이벤트가 나오지 않았습니다.</div>'; return; }
    box.innerHTML = rows.map(function (e) {
      var done = e.status === "done" || e.status === "ignored";
      var hot = e.priority === "P0" || e.severity === "critical" || e.severity === "high";
      return '<div class="erow' + (선택이벤트 === e.id ? " sel" : "") + (done ? " done" : "") + '" data-id="' + esc(e.id) + '">' +
        '<span class="etag' + (hot ? " hot" : "") + '">' + esc(e.priority) + "</span>" +
        '<span class="tx"><b>' + esc(e.title) + "</b> · " + esc(e.entity) + "</span>" +
        '<span class="m" style="flex:0 0 auto;color:var(--muted-2);font-size:12px">' + 때(e.at) + "</span></div>";
    }).join("");
    box.querySelectorAll(".erow").forEach(function (r) {
      r.addEventListener("click", function () {
        선택이벤트 = r.dataset.id; renderEvents(); loadGuide(r.dataset.id);
        // 셸(대화창)에도 알린다(B16, 2026-08-19) — 렌더가 그린 실명 필드만 옮긴다.
        // 전송 규격(top 한 겹·팝업 릴레이·허용 키)은 공용 부품 selectnotify.js가 진다(2026-08-20 이관).
        var ev = 이벤트들.filter(function (x) { return x.id === r.dataset.id; })[0];
        if (ev && window.gijoSelectNotify) {
          window.gijoSelectNotify({
            label: String(ev.title || "").slice(0, 40),
            text: "로그 이벤트 " + (ev.entity ? ev.entity + " · " : "") + (ev.title || ""),
            fields: { asset: ev.entity || "", title: ev.title || "", severity: String(ev.priority || ev.severity || ""), status: ev.status || "open" },
          });
        }
      });
    });
  }

  function renderGuide(guide, message) {
    var box = document.getElementById("guideBox");
    if (!guide) {
      box.innerHTML = '<div class="empty">' + (message ? esc(message) : "이벤트를 고르면 행동강령 기반 절차가 나옵니다.") + "</div>";
      return;
    }
    box.innerHTML =
      '<div class="gd-t">' + esc(guide.title) + "</div>" +
      '<div class="gd-basis">근거: ' + esc(guide.basis) + "</div>" +
      guide.steps.map(function (s, i) {
        return '<div class="step"><span class="n">' + (i + 1) + "</span><span>" + esc(s) + "</span></div>";
      }).join("") +
      '<div class="gd-act"><button class="gd-btn" id="gdAdd">＋ 후속 작업으로 담기</button>' +
      '<span class="gd-note">오늘 계획(대시보드)에 들어갑니다</span></div>';
    document.getElementById("gdAdd").addEventListener("click", function () {
      var ev = 이벤트들.find(function (e) { return e.id === 선택이벤트; });
      var 문구 = guide.followup + (ev ? " — " + ev.entity + " (" + 선택파일 + ")" : "");
      window.gijo.addTask(문구).then(function () {
        if (window.gijoTell) window.gijoTell("오늘 계획에 담았습니다:\n" + 문구 + "\n\n대시보드 「오늘 내 계획」에서 볼 수 있습니다.");
      }).catch(function (e) {
        if (window.gijoTell) window.gijoTell("담지 못했습니다 — " + ((e && e.message) || e));
      });
    });
  }

  function loadGuide(eventId) {
    renderGuide(null, "절차를 불러오는 중…");
    window.gijo.logAnalysisGuide(eventId).then(function (r) {
      renderGuide(r && r.guide, r && r.message);
    }).catch(function (e) {
      renderGuide(null, "절차를 불러오지 못했습니다 — " + ((e && e.message) || e));
    });
  }

  // ── 파일→자산 연결 확인(사용자 방향: "업로드 시 자산 등록·관리를 빠르게 확인") ──
  var 자산들 = [];
  var 내부대역 = function (ip) { return /^10\.|^192\.168\.|^172\.(1[6-9]|2\d|3[01])\./.test(ip); };
  var 등록됐나 = function (키) {
    return 자산들.some(function (a) {
      return a.id === 키 || a.name === 키 || (a.path && String(a.path).indexOf(키) >= 0) || (a.host && a.host === 키);
    });
  };

  function renderAssetStrip() {
    var box = document.getElementById("assetStrip");
    if (!선택파일) { box.style.display = "none"; return; }
    var rows = 이벤트들.filter(function (e) { return e.ref === 선택파일; });
    // 등록 자산(peers) 합집합 + 내부 대역인데 미등록인 출발지(entity) = 등록 후보
    var 등록된 = [...new Set(rows.flatMap(function (e) { return e.peers || []; }))];
    var 후보 = [...new Set(rows.map(function (e) { return e.entity; }))]
      .filter(function (k) { return 내부대역(k) && !등록됐나(k); });
    box.style.display = "block";
    box.innerHTML =
      "🖥 <b style='color:var(--text)'>자산 연결</b> — 등록된 자산 " +
      (등록된.length ? 등록된.map(function (k) { return '<span style="color:var(--teal)">' + esc(k) + "</span>"; }).join(", ") : "없음") +
      (후보.length
        ? '<br>⚠ 내부 대역인데 <b style="color:var(--amber)">미등록</b>: ' +
          후보.map(function (k) { return '<label style="margin-right:10px;cursor:pointer"><input type="checkbox" class="regck" value="' + esc(k) + '" style="width:12px;height:12px;accent-color:var(--blue)"> ' + esc(k) + "</label>"; }).join("") +
          ' <button class="gd-btn" id="regBtn" style="padding:3px 10px;font-size:12px">체크한 것 자산으로 등록</button>'
        : "");
    var btn = document.getElementById("regBtn");
    if (btn) btn.addEventListener("click", function () {
      var 골람 = [...box.querySelectorAll(".regck:checked")].map(function (c) { return c.value; });
      if (!골람.length) { if (window.gijoTell) window.gijoTell("등록할 항목을 먼저 체크해 주세요."); return; }
      Promise.all(골람.map(function (ip) {
        return window.gijo.registerAsset({ id: ip, name: ip, path: ip, assetType: "infra-host" });
      })).then(function () {
        if (window.gijoTell) window.gijoTell("자산으로 등록했습니다: " + 골람.join(", ") + "\n자산 화면(발견·수집 > 자산 판)에서 관리됩니다.");
        return window.gijo.listAssets().then(function (a) { 자산들 = a || []; renderAssetStrip(); });
      }).catch(function (e) {
        if (window.gijoTell) window.gijoTell("등록하지 못했습니다 — " + ((e && e.message) || e));
      });
    });
  }

  function 불러오기() {
    return Promise.all([
      window.gijo.logAnalysisFiles().catch(function () { return { files: [] }; }),
      window.gijo.analysisEvents().catch(function () { return { events: [] }; }),
      window.gijo.listAssets().catch(function () { return []; }),
    ]).then(function (r) {
      파일들 = (r[0] && r[0].files) || [];
      이벤트들 = ((r[1] && r[1].events) || []).filter(function (e) { return e.source === "log"; });
      자산들 = r[2] || [];
      if (!선택파일 && 파일들.length) 선택파일 = 파일들[0].ref;
      renderFiles();
      renderEvents();
      renderAssetStrip();
    });
  }
  불러오기();
})();
</script>
</body>
</html>
