<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIJO AS — 작업 기록</title>
<style>
:root{
  --bg:#262624;--panel:#30302e;--panel-2:#1f1e1d;--border:rgba(255,255,255,0.08);
  --border-strong:rgba(255,255,255,0.16);--blue:#3b82f6;--blue-light:#5fa1ff;--white:#ffffff;
  --text:#e9e7e2;--muted:#b3ada4;--muted-2:#a49d95;--red:#e2483d;--amber:#f0a020;--teal:#1eb980;--purple:#8b7cf0;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Pretendard","Malgun Gothic","Segoe UI",sans-serif;background:var(--bg);color:var(--text);}
.app{display:grid;grid-template-columns:220px 1fr;}
.sidebar{padding:22px 14px;border-right:1px solid var(--border);min-height:900px;}
.nav-section{font-size:12px;font-weight:700;color:var(--muted-2);letter-spacing:1.2px;margin:18px 10px 8px;}
.nav-section:first-child{margin-top:0;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;margin-bottom:2px;}
.nav-item .ic{width:18px;text-align:center;font-size:14px;}
.nav-item.active{background:rgba(59,130,246,0.12);color:var(--white);box-shadow:inset 3px 0 0 var(--blue);cursor:default;}
.nav-item:hover:not(.active){background:rgba(255,255,255,0.04);color:var(--white);}
.main{padding:28px 32px 48px;}
.topbar-row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;}
.page-title{font-size:21px;font-weight:800;color:#fff;}
.page-sub{font-size:12.5px;color:var(--muted);margin-top:4px;max-width:900px;}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--panel-2);}
.header-left{display:flex;align-items:center;gap:12px;}
.header-left img{height:22px;}
.app-title{font-size:15px;font-weight:800;color:#fff;}
.clock{font-size:12px;color:var(--blue-light);font-weight:600;}
.header-right{display:flex;align-items:center;gap:10px;}
.status-pill{display:flex;align-items:center;gap:6px;background:rgba(30,185,128,0.15);border:1px solid rgba(30,185,128,0.4);color:var(--teal);padding:6px 14px;border-radius:20px;font-size:12px;font-weight:800;}
.status-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);}
.beta-tag{background:var(--teal);color:var(--fill-contrast,#06281c);font-size:11.25px;font-weight:800;padding:1px 6px;border-radius:4px;margin-left:2px;}
.avatar-btn{width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;}
.icon-btn{width:32px;height:32px;border-radius:8px;background:var(--panel);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted);cursor:pointer;}

.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.filters{display:flex;gap:8px;flex-wrap:wrap;}
/* 시스템 로그의 콘솔 상자와 같은 결 — 짙은 바탕·얇은 테두리·안에서만 스크롤(2026-08-02).
   ⚠ 글꼴은 고정폭으로 바꾸지 않는다. 시스템 로그는 명령·경로가 대부분이라 고정폭이 맞지만,
     여기는 한글 문장("승인 대기 3건을 배정")이 많아 고정폭이면 되레 읽기 어렵다.
     같게 할 것과 다르게 둘 것을 나눈다 — 통일은 모양이 아니라 **읽는 방식**을 맞추는 일이다. */
.log-box{background:#1a1a19;border:1px solid var(--border-strong);border-radius:8px;
  padding:4px 0;overflow-y:auto;min-height:360px;}
.log-box .aud{padding:7px 14px;}
.log-box .empty{padding:26px;text-align:center;color:var(--muted-2);font-size:12.5px;}
.filter-chip{background:var(--panel-2);border:1px solid var(--border-strong);color:var(--muted);padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;}
.filter-chip.active{background:rgba(59,130,246,0.15);border-color:var(--blue);color:var(--blue-light);}
.search{margin-left:auto;background:var(--panel-2);border:1px solid var(--border-strong);border-radius:8px;padding:7px 12px;font-size:12px;color:var(--text);outline:none;width:240px;}
.dl{background:transparent;border:1px solid var(--border-strong);color:var(--text);border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;}
.dl:hover{border-color:var(--teal);color:var(--teal);}

.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:6px 0;}
.aud{display:flex;gap:12px;align-items:flex-start;padding:11px 18px;border-bottom:1px solid var(--border);font-size:12.5px;}
.aud:last-child{border-bottom:none;}
/* 행 클릭 = 대화창 📌 선택(배선 계약 ⑤층, 2026-08-20) */
.aud{cursor:pointer;}
.aud:hover{background:rgba(59,130,246,.05);}
.aud.on{background:rgba(59,130,246,.09);}
.aud .tm{color:var(--muted-2);font-size:12.25px;white-space:nowrap;width:118px;flex:0 0 auto;}
.aud .kind{font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:5px;white-space:nowrap;flex:0 0 auto;}
.k-cli{background:rgba(30,185,128,.16);color:var(--teal);}
.k-approval{background:rgba(240,160,32,.16);color:var(--amber);}
.k-write{background:rgba(139,124,240,.16);color:var(--purple);}
.k-block{background:rgba(226,72,61,.16);color:#f5928a;}
.k-auth{background:rgba(59,130,246,.16);color:var(--blue-light);}
.k-config{background:rgba(255,255,255,.08);color:var(--muted);}
.aud .body{flex:1;min-width:0;}
.aud .act{color:var(--text);font-weight:600;}
.aud .tgt{color:var(--blue-light);font-size:12.25px;margin-left:6px;}
.aud .det{color:var(--muted-2);font-size:12.25px;margin-top:2px;white-space:pre-wrap;word-break:break-word;}
.aud .who{color:var(--muted-2);font-size:12.25px;white-space:nowrap;flex:0 0 auto;}
.aud .rz{font-size:11.5px;font-weight:800;padding:1px 6px;border-radius:4px;flex:0 0 auto;}
.rz-ok{color:var(--teal);}
.rz-blocked{background:rgba(226,72,61,.16);color:#f5928a;}
.rz-error{background:rgba(226,72,61,.16);color:#f5928a;}
.rz-pending{color:var(--amber);}
.empty{padding:30px;text-align:center;color:var(--muted-2);font-size:13px;}
.kpi{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.kpi-mini{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 16px;}
.kpi-mini .l{font-size:12px;color:var(--muted);}
.kpi-mini .v{font-size:18px;font-weight:800;color:#fff;}
.footer{margin-top:14px;padding:18px 0 0;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted-2);}
.footer img{height:16px;opacity:0.6;}
/* 「더 보기」 — 목록을 줄여 보여주되 있는 것을 숨기지 않는다는 표시(2026-08-01). */
  .more{display:block;width:100%;margin-top:10px;padding:10px;background:var(--panel-2);
    border:1px dashed var(--border-strong);border-radius:9px;color:var(--blue-light);
    font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;}
  .more:hover{border-style:solid;border-color:var(--blue-light);}
  .more .cnt{color:var(--muted-2);font-weight:600;margin-left:6px;}
  .more-end{margin-top:10px;padding:8px;text-align:center;font-size:12.5px;color:var(--muted-2);}
</style>
<script src="viz.js"></script>
</head>
<body>

<!-- 상단 바는 공용이다 — titlebar.js가 그린다(분리창=공용 헤더, 탭 안=셸 탭줄). 화면마다 두던 사본 23개를 지웠다(2026-08-07). -->

<div class="app">
  <div class="sidebar" id="gijoNav"></div>

  <div class="main">
    <div class="topbar-row">
      <div>
        <div class="page-title">📜 작업 기록 (감사 로그)</div>
      </div>
    </div>

    <div class="kpi" id="kpiRow" data-gijo-summary></div>

    <!-- 그림 먼저(전-7 ①, 2026-08-05). 위 숫자는 "얼마나 쌓였나"만 말한다 — 이 띠는 **언제
         움직였나**를 말한다(불러온 최근 기록 범위 안). 막대에 클릭을 달지 않았다: 날짜로
         좁히는 필터가 이 화면에 없어서, 눌러도 아무 일 없는 자리가 되기 때문이다. -->
    <div id="vizStrip"></div>

    <!-- 시스템 로그와 같은 모양으로 맞춘다(2026-08-02 사용자 지시) — 같은 성격(흐르는 기록)인데
         모양이 다르면 화면을 옮길 때마다 다시 배운다. 접기 제목 + 정체성 한 줄 + 콘솔형 상자. -->
    <div class="panel" data-gijo-fold="📜 작업 기록" data-gijo-fold-badges="kpiTotal:건">
    <div class="panel-sub">누가 언제 무엇을 했는지 그대로 남깁니다 — 지우거나 고칠 수 없습니다.</div>
    <div class="toolbar">
      <div class="filters" id="kindFilters">
        <div class="filter-chip active" data-kind="all">전체</div>
        <div class="filter-chip" data-kind="cli">CLI 실행</div>
        <div class="filter-chip" data-kind="approval">승인</div>
        <div class="filter-chip" data-kind="write">쓰기</div>
        <div class="filter-chip" data-kind="block">차단</div>
        <div class="filter-chip" data-kind="privacy">개인정보</div>
        <div class="filter-chip" data-kind="auth">로그인</div>
        <div class="filter-chip" data-kind="config">설정·메모</div>
      </div>
      <input class="search" id="searchBox" placeholder="🔎 내용 검색 (명령·대상·담당자)" aria-label="내용 검색">
      <button class="dl" id="dlBtn">⬇ 내보내기 (.csv)</button>
    </div>

    <div class="log-box" id="auditPanel" data-gijo-fit><div class="empty">불러오는 중…</div></div>
    </div><!-- /📜 작업 기록 접기 -->



    <div class="footer">
      <img src="gijo-symbol.svg" alt="GIJO">
      <span>© 2026 GIJO Technology · GIJO AS Platform · Confidential</span>
    </div>
  </div>
</div>

<script>
  const panel = document.getElementById("auditPanel");
  /**
   * 목록 높이를 창에 맞춘다 — **위 카드(전체·CLI·승인…)와 필터가 늘 보여야 한다.**
   * ⚠ 2026-08-02에 지시를 반대로 읽어 높이를 아예 풀었다가(화면째 내려가게) 되돌린 자리다.
   *   원하는 그림은 「위는 고정, 목록만 안에서 스크롤, 더 필요하면 ＋더 보기로 늘림」이다.
   *   고정 px도, calc(100vh - 상수)도 못 맞춘다 — 검색줄·필터가 줄바꿈되면 위 높이가 달라지고
   *   배율까지 곱해진다. 그래서 **제 위치를 재서** 남는 만큼만 쓴다.
   */
  function 목록높이맞추기() {
    if (!panel) return;
    // 계산은 공용 도우미 한 곳에만 둔다(nav.js gijoFitList) — 화면마다 베끼면 반드시 어긋난다.
    if (window.gijoFitList) window.gijoFitList(panel);
  }

  let activeKind = "all";
  let entries = [];
  const KIND_LABEL = { cli: "CLI", approval: "승인", write: "쓰기", block: "차단", privacy: "개인정보", auth: "로그인", config: "설정" };
  const esc = (s) => String(s == null ? "" : s).replace(/</g, "&lt;");


  function fmtTime(ms) {
    return new Date(ms).toLocaleString("ko-KR", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
  }
  function rowHtml(e) {
    const kc = "k-" + e.kind;
    const rz = "rz-" + e.result;
    const rzLabel = { ok: "완료", blocked: "차단", error: "실패", pending: "대기" }[e.result] || e.result;
    return (
      `<div class="aud" data-id="${esc(e.id)}" title="누르면 대화창에 「이거」로 담깁니다">` +
      `<span class="tm">${fmtTime(e.at)}</span>` +
      `<span class="kind ${kc}">${KIND_LABEL[e.kind] || e.kind}</span>` +
      `<div class="body"><span class="act">${esc(e.action)}</span>${e.target ? `<span class="tgt">${esc(e.target)}</span>` : ""}` +
      `${e.detail ? `<div class="det">${esc(e.detail)}</div>` : ""}</div>` +
      `<span class="rz ${rz}">${rzLabel}</span>` +
      `<span class="who">${esc(e.actor || "-")}</span>` +
      `</div>`
    );
  }

  // 한 번에 그리는 줄 수. 500건을 다 그리면 화면이 글자 3,100조각이 되어 무엇이 중요한지
  // 안 보인다(2026-08-01 실측). 기록은 **최근 것이 중요하고**, 옛것은 스크롤이 아니라
  // 검색·필터로 찾는다. ⚠ 줄여서 보여주되 **있는 것을 숨기지는 않는다** — 전체 건수를 늘 적고,
  // 눌러서 늘릴 수 있게 한다. 내보내기(.csv)는 화면에 그린 수와 무관하게 전건이다.
  const 한번에 = 50;
  let 보이는수 = 한번에;

  function render() {
    const q = (document.getElementById("searchBox").value || "").toLowerCase();
    let rows = entries;
    if (activeKind !== "all") rows = rows.filter((e) => e.kind === activeKind);
    if (q) rows = rows.filter((e) => `${e.action} ${e.target || ""} ${e.detail || ""} ${e.actor || ""}`.toLowerCase().includes(q));
    if (!rows.length) { panel.innerHTML = '<div class="empty">해당 조건의 작업 기록이 없습니다.</div>'; 목록높이맞추기(); return; }
    const 볼것 = rows.slice(0, 보이는수);
    const 남음 = rows.length - 볼것.length;
    panel.innerHTML = 볼것.map(rowHtml).join("") +
      (남음 > 0
        ? `<button class="more" id="moreBtn">＋ ${Math.min(한번에, 남음)}건 더 보기 <span class="cnt">(${볼것.length} / 전체 ${rows.length}건)</span></button>`
        : (rows.length > 한번에 ? `<div class="more-end">전체 ${rows.length}건을 다 보고 있습니다</div>` : ""));
    const b = document.getElementById("moreBtn");
    if (b) b.addEventListener("click", () => { 보이는수 += 한번에; render(); });
    하이라이트반영(); // 15초 자동 새로고침·필터가 innerHTML을 통째 갈아도 선택 표시가 남게
  }

  // ── 행 클릭 → 대화창 📌 선택(배선 계약 ⑤층, 2026-08-20) ──────────────────
  // fields는 싣지 않는다(1단계) — 감사 행은 자산·취약점이 아니라서 선택카드가
  // 「담당 미배정」 같은 거짓 줄을 그린다(console.js가 owner 없으면 그 줄을 채움).
  // label+text만 보내면 📌칩과 서버 선택 문구만 실린다 — 정직한 최소.
  let 선택행id = null;
  function 하이라이트반영() {
    panel.querySelectorAll(".aud.on").forEach((r) => r.classList.remove("on"));
    if (선택행id == null) return;
    const r = panel.querySelector(`.aud[data-id="${선택행id}"]`);
    if (r) r.classList.add("on");
  }
  panel.addEventListener("click", (ev) => {
    if (ev.target.closest(".more")) return; // ＋더 보기 버튼은 행이 아니다
    const 드래그 = window.getSelection && String(window.getSelection());
    if (드래그) return; // 상세(det) 글자 복사 중엔 선택으로 안 잡는다
    const row = ev.target.closest(".aud");
    if (!row || row.dataset.id == null) return;
    const e = entries.find((x) => String(x.id) === row.dataset.id);
    if (!e) return;
    선택행id = row.dataset.id;
    하이라이트반영();
    if (window.gijoSelectNotify) window.gijoSelectNotify({
      label: String(e.action || "작업 기록").slice(0, 40),
      text: "작업 기록 " + fmtTime(e.at) + " · " + (e.actor || "-") + " · " + (e.action || "") + (e.target ? " → " + e.target : ""),
    });
  });

  // 조건이 바뀌면 처음 50건부터 다시 — 앞 조건에서 늘려 둔 상태가 남으면 갑자기 500줄이 쏟아진다.
  function 다시처음부터() { 보이는수 = 한번에; render(); }

  // ── 그림 먼저(전-7 ①, 2026-08-05) ──────────────────────────────────────
  // 불러온 기록이 걸쳐 있는 **날짜 구간만** 그린다 — 없는 날을 0으로 채워 넣으면
  // "그날 아무 일도 없었다"가 되는데, 실제로는 500건 한도 밖일 뿐이다.
  function 그림띠() {
    const 자리 = document.getElementById("vizStrip");
    if (!자리 || !window.gijoViz || !entries.length) return;
    const 날짜별 = new Map();
    entries.forEach((e) => {
      const d = new Date(e.at);
      const k = `${d.getMonth() + 1}/${d.getDate()}`;
      날짜별.set(k, (날짜별.get(k) || 0) + 1);
    });
    // entries는 최신순이라 뒤집어야 왼쪽이 옛날이 된다.
    const 키들 = Array.from(날짜별.keys()).reverse().slice(-14);
    window.gijoViz.mount(자리, {
      title: "언제 움직였나",
      hint: `불러온 최근 ${entries.length.toLocaleString()}건 기준 · ${키들[0]} ~ ${키들[키들.length - 1]}`,
      parts: [{ kind: "spark", values: 키들.map((k) => 날짜별.get(k)), label: "하루당 기록 수" }],
    });
  }
  // ───────────────────────────────────────────────────────────────────────

  function renderKpi(summary, retention) {
    const el = document.getElementById("kpiRow");
    const order = ["cli", "approval", "write", "block", "privacy", "auth"];
    el.innerHTML = `<div class="kpi-mini"><div class="l">전체</div><div class="v" id="kpiTotal">${summary.total}</div></div>` +
      order.map((k) => `<div class="kpi-mini"><div class="l">${KIND_LABEL[k]}</div><div class="v">${summary.byKind[k] || 0}</div></div>`).join("") +
      // 보관 기간을 같이 보여준다 — 감사 대응 때 "옛날 기록이 왜 없나"를 여기서 바로 답한다.
      (retention ? `<div class="kpi-mini"><div class="l">보관 기간</div><div class="v" style="font-size:15px;">` +
        (retention.unlimited ? "무제한" : Math.round(retention.days / 365 * 10) / 10 + "년") + "</div></div>" : "");
  }

  async function load() {
    try {
      const r = await window.gijo.listAudit(undefined, 500);
      entries = r.entries || [];
      renderKpi(r.summary || { total: entries.length, byKind: {} }, r.retention);
      그림띠();
      render();
    } catch (e) {
      panel.innerHTML = `<div class="empty">불러오지 못했습니다: ${esc(e.message || e)}</div>`;
    }
  }

  function exportCsv() {
    const q = (s) => `"${String(s ?? "").replace(/"/g, '""')}"`;
    const header = "시각,종류,작업,대상,상세,결과,담당자";
    const lines = entries.map((e) => [fmtTime(e.at), KIND_LABEL[e.kind] || e.kind, e.action, e.target || "", e.detail || "", e.result, e.actor || ""].map(q).join(","));
    const csv = ["﻿" + header, ...lines].join("\r\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `작업기록_${new Date().toISOString().slice(0, 10)}.csv`;
    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
  }

  async function init() {

    await load();
    setInterval(load, 15000); // 15초마다 새 기록 반영

    document.querySelectorAll("[data-page]").forEach((el) => el.addEventListener("click", () => (window.gijoOpenScreen ? window.gijoOpenScreen(el.dataset.page) : window.gijo.navigateTo(el.dataset.page))));
    document.getElementById("kindFilters").addEventListener("click", (e) => {
      const chip = e.target.closest("[data-kind]"); if (!chip) return;
      document.querySelectorAll("#kindFilters .filter-chip").forEach((c) => c.classList.remove("active"));
      chip.classList.add("active"); activeKind = chip.dataset.kind; 다시처음부터();
    });
    document.getElementById("searchBox").addEventListener("input", 다시처음부터);
    document.getElementById("dlBtn").addEventListener("click", exportCsv);
  }

  if (!window.gijo.isAuthenticated()) window.gijo.navigateTo("login.html");
  else init();
</script>
