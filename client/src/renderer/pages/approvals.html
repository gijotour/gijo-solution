<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIJO AS — 승인 워크플로우</title>
<style>
:root{
  --bg:#0a0e1a;--panel:#121a2e;--panel-2:#0e1526;--border:rgba(255,255,255,0.08);
  --border-strong:rgba(255,255,255,0.16);--blue:#3b82f6;--blue-light:#5fa1ff;--white:#ffffff;
  --text:#e7eaf3;--muted:#8b93ab;--muted-2:#5f6785;--red:#e2483d;--amber:#f0a020;--teal:#1eb980;--purple:#8b7cf0;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Pretendard","Malgun Gothic","Segoe UI",sans-serif;background:var(--bg);color:var(--text);}
.app{display:grid;grid-template-columns:220px 1fr;}
.sidebar{padding:22px 14px;border-right:1px solid var(--border);min-height:900px;}
.nav-section{font-size:10.5px;font-weight:700;color:var(--muted-2);letter-spacing:1.2px;margin:18px 10px 8px;}
.nav-section:first-child{margin-top:0;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;margin-bottom:2px;}
.nav-item .ic{width:18px;text-align:center;font-size:14px;}
.nav-item.active{background:rgba(59,130,246,0.12);color:var(--white);box-shadow:inset 3px 0 0 var(--blue);cursor:default;}
.nav-item:hover:not(.active){background:rgba(255,255,255,0.04);color:var(--white);}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:800;padding:1px 6px;border-radius:20px;}
.main{padding:28px 32px 48px;}
.topbar-row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;}
.page-title{font-size:21px;font-weight:800;color:#fff;}
.page-sub{font-size:12.5px;color:var(--muted);margin-top:4px;}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px;}
.panel-title{font-size:14.5px;font-weight:800;color:#fff;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;}
.panel-sub{font-size:11.5px;color:var(--muted);margin-bottom:14px;}
.badge{display:inline-block;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:700;}
.b-amber{background:rgba(240,160,32,0.15);color:var(--amber);}
.footer{margin-top:8px;padding:18px 0 0;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--muted-2);}
.footer img{height:16px;opacity:0.6;}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--panel-2);}
.header-left{display:flex;align-items:center;gap:12px;}
.header-left img{height:22px;}
.app-title{font-size:15px;font-weight:800;color:#fff;}
.clock{font-size:12px;color:var(--blue-light);font-weight:600;}
.header-right{display:flex;align-items:center;gap:10px;}
.status-pill{display:flex;align-items:center;gap:6px;background:rgba(30,185,128,0.15);border:1px solid rgba(30,185,128,0.4);color:var(--teal);padding:6px 14px;border-radius:20px;font-size:12px;font-weight:800;}
.status-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);}
.beta-tag{background:var(--teal);color:#06281c;font-size:9px;font-weight:800;padding:1px 6px;border-radius:4px;margin-left:2px;}
.avatar-btn{width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;}
.icon-btn{width:32px;height:32px;border-radius:8px;background:var(--panel);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted);cursor:pointer;}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <span id="homeLink" data-page="dashboard.html" title="대시보드로 이동" style="display:flex;align-items:center;gap:12px;cursor:pointer"><img src="https://gijo.ai/_nuxt/logo_gijo_white.CCh2YXJe.svg" alt="GIJO">
    <div class="app-title">GIJO AS</div></span>
    <div class="clock" id="clockEl">-</div>
  </div>
  <div class="header-right">
    <div class="status-pill" id="statusPill"><span class="dot"></span>연결 확인 중<span class="beta-tag">LIVE</span></div>
    <div class="avatar-btn" id="avatarBtn">-</div>
    <div class="icon-btn" id="settingsBtn">⚙</div>
  </div>
</div>

<div class="app">
  <div class="sidebar" id="gijoNav"></div>

  <div class="main">
    <div class="topbar-row">
      <div>
        <div class="page-title">조치·승인 — Finding 검토 <i class="gijo-info" data-topic="조치·승인"></i></div>
      </div>
    </div>

    <div id="gijoChatWidget" data-prompts='["검토 대기 몇 건이야?","기한 지난 미조치 있어?"]' style="max-width:640px;margin-bottom:16px;"></div>

    <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:16px;max-width:960px;">
      <div class="panel" style="margin:0"><div class="panel-sub" style="margin:0 0 6px">미검토</div><div style="font-size:20px;font-weight:800;color:var(--amber)" id="kPending">-</div></div>
      <div class="panel" style="margin:0"><div class="panel-sub" style="margin:0 0 6px">진행중</div><div style="font-size:20px;font-weight:800;color:var(--blue-light)" id="kProg">-</div></div>
      <div class="panel" style="margin:0"><div class="panel-sub" style="margin:0 0 6px">검증</div><div style="font-size:20px;font-weight:800;color:var(--purple)" id="kVerify">-</div></div>
      <div class="panel" style="margin:0"><div class="panel-sub" style="margin:0 0 6px">완료</div><div style="font-size:20px;font-weight:800;color:var(--teal)" id="kApproved">-</div></div>
      <div class="panel" style="margin:0"><div class="panel-sub" style="margin:0 0 6px">반려</div><div style="font-size:20px;font-weight:800;color:var(--muted)" id="kRejected">-</div></div>
      <div class="panel" style="margin:0"><div class="panel-sub" style="margin:0 0 6px">지연</div><div style="font-size:20px;font-weight:800;color:#f5928a" id="kOverdue">-</div></div>
    </div>

    <div class="rv-wrap">
      <div class="rv-list-pane">
        <div class="rv-filt" id="rvFilt">
          <span class="fchip on" data-f="active">조치대상 <b id="fcActive">0</b></span>
          <span class="fchip" data-f="in_progress">진행중 <b id="fcProg">0</b></span>
          <span class="fchip" data-f="verifying">검증 <b id="fcVerify">0</b></span>
          <span class="fchip" data-f="rejected">반려 <b id="fcRejected">0</b></span>
          <span class="fchip" data-f="approved">완료 <b id="fcApproved">0</b></span>
          <span class="fchip" data-f="pending">미검토 <b id="fcPending">0</b></span>
        </div>
        <div id="rvList" class="rv-rows">불러오는 중...</div>
      </div>
      <div class="rv-detail" id="rvDetail"><div class="rv-empty">왼쪽에서 finding을 선택하세요.</div></div>
    </div>

    <div class="footer">
      <img src="https://gijo.ai/_nuxt/logo_gijo_only_white.ATZVOJtw.svg" alt="GIJO">
      <span>© 2026 GIJO Technology · GIJO AS Platform · Confidential</span>
    </div>
  </div>
</div>

<style>
  /* ── 마스터·디테일(시안 C) ── */
  .rv-wrap{display:grid;grid-template-columns:360px 1fr;gap:14px;}
  .rv-list-pane{background:var(--panel-2);border:1px solid var(--border);border-radius:12px;padding:10px;min-height:520px;}
  .rv-filt{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px;}
  .fchip{font-size:11px;padding:5px 10px;border-radius:20px;background:var(--panel);border:1px solid var(--border-strong);color:var(--muted);cursor:pointer;user-select:none;}
  .fchip b{margin-left:3px;color:var(--text);font-weight:800;}
  .fchip.on{background:var(--blue);border-color:var(--blue);color:#fff;}.fchip.on b{color:#fff;}
  .rv-rows{max-height:640px;overflow-y:auto;}
  .rv-row{display:flex;align-items:center;gap:9px;padding:10px;border-radius:9px;cursor:pointer;border:1px solid transparent;margin-bottom:3px;}
  .rv-row:hover{background:var(--panel);}
  .rv-row.on{background:var(--panel);border-color:rgba(59,130,246,.4);}
  .rv-dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .d-pending{background:var(--amber);}.d-in_progress{background:var(--blue);}.d-verifying{background:var(--purple);}.d-approved{background:var(--teal);}.d-rejected{background:var(--muted-2);}.d-over{background:var(--red);}
  .rv-rmain{flex:1;min-width:0;}
  .rv-rt{font-size:12.5px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rv-rs{font-size:10.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sev{font-size:9px;font-weight:800;padding:1px 6px;border-radius:5px;flex:none;}
  .sev-critical,.sev-high{color:#f5928a;background:rgba(226,72,61,.14);}
  .sev-medium{color:var(--amber);background:rgba(240,160,32,.14);}
  .sev-low{color:var(--blue-light);background:rgba(59,130,246,.14);}
  .rv-empty{padding:60px 20px;text-align:center;color:var(--muted-2);font-size:13px;}

  /* 상세 패널 */
  .rv-detail{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px 22px;min-height:520px;}
  .dt-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:6px;}
  .st{font-size:10.5px;font-weight:800;padding:2px 9px;border-radius:20px;}
  .st-pending{color:var(--amber);background:rgba(240,160,32,.15);}
  .st-in_progress{color:var(--blue-light);background:rgba(59,130,246,.15);}
  .st-verifying{color:var(--purple);background:rgba(139,124,240,.16);}
  .st-approved{color:var(--teal);background:rgba(30,185,128,.14);}
  .st-rejected{color:var(--muted);background:rgba(255,255,255,.06);}
  .rv-kev{color:#f5928a;background:rgba(226,72,61,.18);font-size:10px;font-weight:800;padding:2px 8px;border-radius:6px;}
  .dt-over{color:#f5928a;background:rgba(226,72,61,.18);font-size:10px;font-weight:800;padding:2px 8px;border-radius:6px;}
  .dt-title{font-size:17px;font-weight:800;color:#fff;}
  .dt-asset{font-size:12px;color:var(--purple);margin-bottom:14px;}
  .dt-evid{font-size:11.5px;color:var(--muted);background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;line-height:1.6;margin-bottom:16px;word-break:break-all;}
  .sec{margin-bottom:16px;}
  .sec-h{font-size:11px;font-weight:800;color:var(--muted-2);letter-spacing:.5px;margin-bottom:8px;text-transform:uppercase;}
  .frow{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;}
  .field{flex:1;min-width:150px;}
  .field label{font-size:10.5px;color:var(--muted-2);font-weight:700;display:block;margin-bottom:4px;}
  .inp{width:100%;background:var(--panel-2);border:1px solid var(--border-strong);border-radius:7px;padding:8px 10px;color:var(--text);font-size:12.5px;outline:none;}
  .inp:focus{border-color:var(--blue);}
  input.inp[type=date]{color-scheme:dark;}
  input.inp[type=date]::-webkit-calendar-picker-indicator{cursor:pointer;padding:2px;border-radius:4px;}
  input.inp[type=date]::-webkit-calendar-picker-indicator:hover{background:rgba(59,130,246,.25);}
  .hint{font-size:10px;color:var(--muted-2);margin-top:4px;}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .btn{font-size:12px;font-weight:700;border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--border-strong);background:var(--panel-2);color:var(--text);}
  .btn:hover{border-color:var(--blue);}
  .btn:disabled{opacity:.5;cursor:default;}
  .btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;}
  .btn.mail{border-color:rgba(59,130,246,.4);color:var(--blue-light);}
  .btn.verify{background:rgba(139,124,240,.14);border-color:rgba(139,124,240,.45);color:var(--purple);}
  .btn.done{background:var(--teal);border-color:var(--teal);color:#06281c;}
  .btn.reject{border-color:rgba(226,72,61,.4);color:#f5928a;}
  .verify-box{background:rgba(139,124,240,.08);border:1px solid rgba(139,124,240,.3);border-radius:10px;padding:13px 15px;margin-top:6px;}
  .verify-box .h{font-size:12px;font-weight:800;color:var(--purple);margin-bottom:6px;}
  .verify-box p{font-size:11.5px;color:var(--muted);line-height:1.6;}
  .reject-panel{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:13px 15px;margin-top:10px;}
  .rr-opt{display:flex;gap:8px;margin:8px 0;}
  .rr-opt label{flex:1;font-size:11.5px;color:var(--text);background:var(--panel);border:1px solid var(--border-strong);border-radius:8px;padding:8px 10px;cursor:pointer;display:flex;gap:7px;align-items:flex-start;}
  .rr-opt label:hover{border-color:var(--blue);}
  .rr-opt .desc{font-size:9.5px;color:var(--muted-2);margin-top:2px;}
  .timeline{border-left:2px solid var(--border);padding-left:14px;margin-left:4px;}
  .tl{position:relative;padding:0 0 11px;font-size:11.5px;color:var(--muted);}
  .tl::before{content:"";position:absolute;left:-20px;top:3px;width:8px;height:8px;border-radius:50%;background:var(--muted-2);}
  .tl.now::before{background:var(--blue);}
  .tl b{color:var(--text);}.tl .when{font-size:10px;color:var(--muted-2);}
  .reject-note{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:11px 13px;font-size:11.5px;color:var(--muted);line-height:1.6;}
</style>
<datalist id="gijoUserList"></datalist>

<script>
  const clockEl = document.getElementById("clockEl");
  const statusPill = document.getElementById("statusPill");
  const avatarBtn = document.getElementById("avatarBtn");
  const esc = (s) => String(s == null ? "" : s).replace(/</g, "&lt;");

  function tick() {
    clockEl.textContent = new Date().toLocaleString("ko-KR", {
      hour: "2-digit", minute: "2-digit", hour12: true, year: "numeric", month: "2-digit", day: "2-digit",
    });
  }

  const ST_LABEL = { pending: "미검토", in_progress: "진행중", verifying: "검증 대기", approved: "완료", rejected: "반려" };
  const REJ_LABEL = { false_positive: "오탐", compensating_control: "다른 보안으로 방어 중" };
  const SEV_ORD = { critical: 0, high: 1, medium: 2, low: 3 };
  const fmtDate = (ms) => ms ? new Date(ms).toLocaleString("ko-KR", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }) : "";

  let allReviews = [];
  let rvFilter = "active"; // active(미검토+진행중+검증) | in_progress | verifying | rejected | approved | pending
  let currentKey = null;   // "assetId\0findingKey"

  function keyOf(r) { return `${r.assetId}\0${r.findingKey}`; }
  function matchFilter(r) {
    switch (rvFilter) {
      case "active": return r.status === "pending" || r.status === "in_progress" || r.status === "verifying";
      case "in_progress": return r.status === "in_progress";
      case "verifying": return r.status === "verifying";
      case "rejected": return r.status === "rejected";
      case "approved": return r.status === "approved";
      case "pending": return r.status === "pending";
      default: return true;
    }
  }

  async function loadReviews(keepSelection = true) {
    const list = document.getElementById("rvList");
    try {
      const { reviews, summary } = await window.gijo.listApprovals();
      allReviews = reviews;
      // 요약 카드
      document.getElementById("kPending").textContent = summary.pending;
      document.getElementById("kProg").textContent = summary.in_progress ?? 0;
      document.getElementById("kVerify").textContent = summary.verifying ?? 0;
      document.getElementById("kApproved").textContent = summary.approved;
      document.getElementById("kRejected").textContent = summary.rejected;
      document.getElementById("kOverdue").textContent = summary.overdue ?? 0;
      // 필터 칩 카운트
      const cnt = (fn) => reviews.filter(fn).length;
      document.getElementById("fcActive").textContent = cnt((r) => ["pending", "in_progress", "verifying"].includes(r.status));
      document.getElementById("fcProg").textContent = summary.in_progress ?? 0;
      document.getElementById("fcVerify").textContent = summary.verifying ?? 0;
      document.getElementById("fcRejected").textContent = summary.rejected;
      document.getElementById("fcApproved").textContent = summary.approved;
      document.getElementById("fcPending").textContent = summary.pending;
      renderList();
      // 선택 유지 — 갱신 후에도 열려 있던 finding의 상세를 다시 그린다.
      if (keepSelection && currentKey) {
        const cur = allReviews.find((r) => keyOf(r) === currentKey);
        if (cur) renderDetail(cur); else clearDetail();
      }
    } catch (e) {
      list.innerHTML = '<div class="rv-empty" style="color:#f5928a">불러오지 못했습니다: ' + esc(e.message) + "</div>";
    }
  }

  function renderList() {
    const list = document.getElementById("rvList");
    const filtered = allReviews.filter(matchFilter).sort((a, b) => {
      if (a.overdue !== b.overdue) return a.overdue ? -1 : 1;
      return SEV_ORD[a.finding.severity] - SEV_ORD[b.finding.severity];
    });
    if (!filtered.length) {
      list.innerHTML = '<div class="rv-empty">' + (allReviews.length ? "이 상태의 finding이 없습니다." : "검토할 finding이 없습니다 — 자산 스캔을 먼저 실행하세요.") + "</div>";
      return;
    }
    list.innerHTML = filtered.map((r) => {
      const dot = r.overdue ? "d-over" : "d-" + r.status;
      const bits = [esc(r.assetName)];
      if (r.assignee) bits.push(esc(r.assignee));
      if (r.status === "verifying") bits.push("검증 대기");
      else if (r.status === "rejected") bits.push(REJ_LABEL[r.rejectReason] || "반려");
      else if (r.overdue) bits.push("⚠지연");
      else if (r.dueDate) bits.push("📅" + esc(r.dueDate.slice(5)));
      // 구분자(\0)는 HTML 속성에서 유실되므로 assetId·findingKey를 별도 data 속성으로 싣는다.
      return `<div class="rv-row${keyOf(r) === currentKey ? " on" : ""}" data-a="${esc(r.assetId)}" data-k="${esc(r.findingKey)}">
        <span class="rv-dot ${dot}"></span>
        <div class="rv-rmain"><div class="rv-rt">${esc(r.finding.finding_type)}</div><div class="rv-rs">${bits.join(" · ")}</div></div>
        <span class="sev sev-${esc(r.finding.severity)}">${esc(r.finding.severity)}</span>
      </div>`;
    }).join("");
    list.querySelectorAll(".rv-row").forEach((el) => el.addEventListener("click", () => {
      const r = allReviews.find((x) => x.assetId === el.dataset.a && x.findingKey === el.dataset.k);
      if (r) { currentKey = keyOf(r); renderList(); renderDetail(r); }
    }));
  }

  function clearDetail() { document.getElementById("rvDetail").innerHTML = '<div class="rv-empty">왼쪽에서 finding을 선택하세요.</div>'; }

  function renderDetail(r) {
    const f = r.finding;
    const a = esc(r.assetId), k = esc(r.findingKey);
    const flags = [f.kev ? '<span class="rv-kev">🚨 KEV</span>' : "", r.overdue ? `<span class="dt-over">⚠ 기한 초과</span>` : ""].filter(Boolean).join("");
    const metaLine = [f.epss != null ? `EPSS ${Math.round(f.epss * 100)}%` : "", f.vpr != null ? `VPR ${f.vpr}` : "", esc(f.source_tool)].filter(Boolean).join(" · ");

    // 배정 폼 — 반려/완료가 아닐 때만 편집 가능.
    const editable = r.status !== "rejected";
    const assignForm = editable ? `
      <div class="sec">
        <div class="sec-h">담당 배정</div>
        <div class="frow">
          <div class="field"><label>보안담당자 (감독·SLA 책임)</label><input class="inp" id="fOwner" value="${esc(r.securityOwner || "")}" placeholder="미배정" list="gijoUserList"></div>
          <div class="field"><label>실제 수행 담당자 (조치)</label><input class="inp" id="fAssignee" value="${esc(r.assignee || "")}" placeholder="미배정" list="gijoUserList"></div>
          <div class="field" style="max-width:170px"><label>조치 기한 (SLA)</label><input class="inp" type="date" id="fDue" value="${esc(r.dueDate || "")}"></div>
        </div>
        <div class="actions">
          <button class="btn primary" id="btnSaveAssign">저장</button>
          <button class="btn mail" id="btnMail"${r.assignee ? "" : " disabled title='실수행 담당자를 먼저 배정하세요'"}>✉ 배정 메일</button>
        </div>
      </div>` : "";

    // 상태별 진행 액션
    let stageActions = "";
    if (r.status === "pending") {
      stageActions = `<div class="actions"><button class="btn primary" data-set="in_progress">▶ 승인 · 조치 시작(진행중)</button><button class="btn reject" id="btnRejectOpen">🛡 반려 ▾</button></div>`;
    } else if (r.status === "in_progress") {
      stageActions = `<div class="actions"><button class="btn verify" data-set="verifying">🔁 조치 완료 → 검증 요청</button><button class="btn reject" id="btnRejectOpen">🛡 반려 ▾</button></div>`;
    } else if (r.status === "verifying") {
      stageActions = `
        <div class="verify-box"><div class="h">🔁 검증(재스캔)</div>
          <p>${r.verifyRequestedBy ? `<b>${esc(r.verifyRequestedBy)}</b>이(가) ${fmtDate(r.verifyRequestedAt)} 조치 완료 보고. ` : ""}이 자산을 재스캔해 같은 취약점이 사라졌는지 확인합니다 — 사라지면 <b style="color:var(--teal)">완료</b>로 자동 확정, 여전히 검출되면 <b style="color:#f5928a">재조치</b>로 되돌립니다.</p></div>
        <div class="actions"><button class="btn verify" id="btnRescan">🔁 지금 재스캔</button><button class="btn done" data-set="approved">✓ 해결 확인(수동 완료)</button><button class="btn" data-set="in_progress">↩ 진행중으로</button></div>`;
    } else if (r.status === "approved") {
      stageActions = `<div class="actions"><button class="btn" data-set="in_progress">↩ 진행중으로 되돌리기</button></div>`;
    } else if (r.status === "rejected") {
      stageActions = `<div class="reject-note">🛡 <b>${esc(REJ_LABEL[r.rejectReason] || "반려")}</b>${r.note ? " — " + esc(r.note) : ""}<br><span style="color:var(--muted-2)">반려: ${esc(r.reviewedBy || "-")} · ${r.reviewedAt ? new Date(r.reviewedAt).toLocaleDateString("ko-KR") : ""}</span></div>
        <div class="actions" style="margin-top:10px"><button class="btn" data-set="pending">↩ 검토 재개</button></div>`;
    }

    // 진행 이력 타임라인
    const tl = [];
    if (r.resolvedAt) tl.push(`<div class="tl now"><b>완료</b> — 재스캔 확인${r.gone ? "(취약점 사라짐)" : ""} <span class="when">${fmtDate(r.resolvedAt)}</span></div>`);
    if (r.verifyRequestedAt) tl.push(`<div class="tl"><b>검증 요청</b> — 조치 완료 보고 <span class="when">${esc(r.verifyRequestedBy || "")} · ${fmtDate(r.verifyRequestedAt)}</span></div>`);
    if (r.reviewedAt && r.status !== "rejected") tl.push(`<div class="tl"><b>${esc(ST_LABEL[r.status])}</b> — ${esc(r.reviewedBy || "-")} <span class="when">${fmtDate(r.reviewedAt)}</span></div>`);

    document.getElementById("rvDetail").innerHTML = `
      <div class="dt-top"><span class="st st-${r.status}">${esc(ST_LABEL[r.status])}</span>${flags}<span style="font-size:10px;color:var(--muted-2)">${metaLine}</span></div>
      <div class="dt-title">${esc(f.finding_type)}</div>
      <div class="dt-asset">${esc(r.assetName)}${r.gone ? " · (최신 스캔에 없음)" : ""}</div>
      <div class="dt-evid">${esc(f.evidence) || "(근거 없음)"}</div>
      ${assignForm}
      <div class="sec"><div class="sec-h">진행</div>${stageActions}
        <div class="reject-panel" id="rejectPanel" style="display:none">
          <div style="font-size:11.5px;font-weight:700;color:var(--text)">반려 사유 — 증거·승인자·날짜가 보존됩니다</div>
          <div class="rr-opt">
            <label><input type="radio" name="rr" value="false_positive" checked><div><b>오탐(false positive)</b><div class="desc">실제 취약점이 아님</div></div></label>
            <label><input type="radio" name="rr" value="compensating_control"><div><b>다른 보안으로 방어</b><div class="desc">보상통제로 위험 차단(내부망 격리·WAF 등)</div></div></label>
          </div>
          <input class="inp" id="rejectNote" placeholder="사유·근거를 적어주세요(권장)" style="margin-bottom:8px">
          <div class="actions"><button class="btn reject" id="btnRejectConfirm">반려 확정</button><button class="btn" id="btnRejectCancel">취소</button></div>
        </div>
      </div>
      ${tl.length ? `<div class="sec"><div class="sec-h">진행 이력</div><div class="timeline">${tl.join("")}</div></div>` : ""}`;

    wireDetail(r);
  }

  function wireDetail(r) {
    const a = r.assetId, k = r.findingKey;
    const $ = (id) => document.getElementById(id);
    // 상태 전이 버튼(data-set)
    document.querySelectorAll("#rvDetail [data-set]").forEach((b) => b.addEventListener("click", async () => {
      b.disabled = true;
      try { await window.gijo.setFindingReview(a, k, { status: b.dataset.set }); await loadReviews(); }
      catch (err) { alert("처리 실패: " + ((err && err.message) || err)); b.disabled = false; }
    }));
    // 배정 저장
    if ($("btnSaveAssign")) $("btnSaveAssign").addEventListener("click", async () => {
      const patch = { securityOwner: $("fOwner").value, assignee: $("fAssignee").value, dueDate: $("fDue").value };
      $("btnSaveAssign").disabled = true;
      try { await window.gijo.setFindingReview(a, k, patch); await loadReviews(); }
      catch (err) { alert("저장 실패: " + ((err && err.message) || err)); $("btnSaveAssign").disabled = false; }
    });
    // 메일
    if ($("btnMail")) $("btnMail").addEventListener("click", async () => {
      const btn = $("btnMail"); if (btn.disabled) return;
      const to = prompt("담당자에게 보낼 이메일 주소:"); if (!to) return;
      btn.disabled = true; const orig = btn.textContent; btn.textContent = "보내는 중…";
      try { await window.gijo.notifyAssignee(a, k, to.trim()); btn.textContent = "✓ 발송됨"; setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 2500); }
      catch (err) { alert("메일 발송 실패: " + ((err && err.message) || err)); btn.textContent = orig; btn.disabled = false; }
    });
    // 재스캔 — 실제로 자산을 재스캔한 뒤 목록 갱신(사라졌으면 서버가 완료로 자동 확정).
    if ($("btnRescan")) $("btnRescan").addEventListener("click", async () => {
      const btn = $("btnRescan"); btn.disabled = true; const orig = btn.textContent; btn.textContent = "재스캔 중…";
      try { await window.gijo.scanAsset(a); await loadReviews(); }
      catch (err) { alert("재스캔 실패: " + ((err && err.message) || err)); btn.textContent = orig; btn.disabled = false; }
    });
    // 반려 패널 열기/확정/취소
    if ($("btnRejectOpen")) $("btnRejectOpen").addEventListener("click", () => { $("rejectPanel").style.display = "block"; });
    if ($("btnRejectCancel")) $("btnRejectCancel").addEventListener("click", () => { $("rejectPanel").style.display = "none"; });
    if ($("btnRejectConfirm")) $("btnRejectConfirm").addEventListener("click", async () => {
      const reason = (document.querySelector('#rvDetail input[name=rr]:checked') || {}).value || "false_positive";
      const note = $("rejectNote").value;
      $("btnRejectConfirm").disabled = true;
      try { await window.gijo.setFindingReview(a, k, { status: "rejected", rejectReason: reason, note }); await loadReviews(); }
      catch (err) { alert("반려 실패: " + ((err && err.message) || err)); $("btnRejectConfirm").disabled = false; }
    });
  }

  async function loadUserSuggestions() {
    // 담당자 자동완성 — 내부 계정(개발자·시스템 담당자 포함) 중에서 고를 수 있어야 한다.
    // 예전엔 관리자 전용 /api/users를 썼는데, 이 화면을 쓰는 security_officer 계정은 403을 받아
    // 자동완성이 조용히 비어 있었다(2026-07-22 사용자 지적 — 실질적으로 순수 자유입력만 됐음).
    // /api/users/assignable은 인증만 되면 누구나 조회 가능(최소 정보만) — 이걸로 교체.
    try {
      const users = await window.gijo.listAssignableUsers();
      document.getElementById("gijoUserList").innerHTML = (users || [])
        .map((u) => `<option value="${esc(u.displayName)}">`).join("");
    } catch (e) {}
  }

  async function init() {
    tick();
    setInterval(tick, 30000);
    try {
      await window.gijo.checkServerHealth();
      statusPill.innerHTML = '<span class="dot"></span>운영중<span class="beta-tag">LIVE</span>';
    } catch (e) {
      statusPill.innerHTML = '<span class="dot" style="background:#e2483d"></span>서버 연결 끊김';
    }
    try {
      const user = await window.gijo.me();
      avatarBtn.textContent = (user.displayName || user.username || "-").charAt(0);
    } catch (e) {}
    loadReviews();
    loadUserSuggestions();
    // 상태 필터 — 클릭하면 그 상태만 목록에 보여준다(선택된 상세는 유지).
    document.getElementById("rvFilt").addEventListener("click", (e) => {
      const chip = e.target.closest(".fchip");
      if (!chip) return;
      rvFilter = chip.dataset.f;
      document.querySelectorAll("#rvFilt .fchip").forEach((c) => c.classList.toggle("on", c === chip));
      renderList();
    });
    document.getElementById("settingsBtn").addEventListener("click", () => window.gijo.navigateTo("settings.html"));
    document.querySelectorAll("[data-page]").forEach((el) => {
      el.addEventListener("click", () => window.gijo.navigateTo(el.dataset.page));
    });
  }

  if (!window.gijo.isAuthenticated()) {
    window.gijo.navigateTo("login.html");
  } else {
    init();
  }
</script>
