<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIJO AS — 승인 워크플로우</title>
<style>
:root{
  --bg:#262624;--panel:#30302e;--panel-2:#1f1e1d;--border:rgba(255,255,255,0.08);
  --border-strong:rgba(255,255,255,0.16);--blue:#3b82f6;--blue-light:#5fa1ff;--white:#ffffff;
  --text:#e9e7e2;--muted:#b3ada4;--muted-2:#a49d95;--red:#e2483d;--amber:#f0a020;--teal:#1eb980;--purple:#8b7cf0;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Pretendard","Malgun Gothic","Segoe UI",sans-serif;background:var(--bg);color:var(--text);}
.app{display:grid;grid-template-columns:220px 1fr;}
.sidebar{padding:22px 14px;border-right:1px solid var(--border);min-height:900px;}
.nav-section{font-size:12px;font-weight:700;color:var(--muted-2);letter-spacing:1.2px;margin:18px 10px 8px;}
.nav-section:first-child{margin-top:0;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;margin-bottom:2px;}
.nav-item .ic{width:18px;text-align:center;font-size:14px;}
.nav-item.active{background:rgba(59,130,246,0.12);color:var(--white);box-shadow:inset 3px 0 0 var(--blue);cursor:default;}
.nav-item:hover:not(.active){background:rgba(255,255,255,0.04);color:var(--white);}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:11.75px;font-weight:800;padding:1px 6px;border-radius:20px;}
.main{padding:28px 32px 48px;}
.topbar-row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;}
.page-title{font-size:21px;font-weight:800;color:var(--text-strong, #fff);}
.page-sub{font-size:12.5px;color:var(--muted);margin-top:4px;}
/* 카드 언어(2026-08-31 사장님 「2번째 이미지로」) — 공용 골격 .g-scard와 같은 값.
   판을 카드로: 여백 20 → 14/16, 제목 줄을 카드 머리(위 칸을 채우고 아래를 선으로 가름). */
.panel{background:var(--g-surface-1,var(--panel));border:1px solid var(--g-border,var(--border));border-radius:var(--g-r,12px);padding:14px 16px;margin-bottom:12px;}
.panel-title{font-size:12.75px;font-weight:800;color:var(--g-text,var(--text-strong,#fff));margin:-14px -16px 10px;padding:7px 12px;border-bottom:1px solid var(--g-border,var(--border));display:flex;justify-content:space-between;align-items:center;}
.panel-sub{font-size:12.5px;color:var(--muted);margin-bottom:14px;}
.badge{display:inline-block;padding:3px 10px;border-radius:6px;font-size:12.25px;font-weight:700;}
.b-amber{background:rgba(240,160,32,0.15);color:var(--amber);}
.footer{margin-top:8px;padding:18px 0 0;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted-2);}
.footer img{height:16px;opacity:0.6;}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--panel-2);}
.header-left{display:flex;align-items:center;gap:12px;}
.header-left img{height:22px;}
.app-title{font-size:15px;font-weight:800;color:var(--text-strong, #fff);}
.clock{font-size:12px;color:var(--blue-light);font-weight:600;}
.header-right{display:flex;align-items:center;gap:10px;}
.status-pill{display:flex;align-items:center;gap:6px;background:rgba(30,185,128,0.15);border:1px solid rgba(30,185,128,0.4);color:var(--teal);padding:6px 14px;border-radius:20px;font-size:12px;font-weight:800;}
.status-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);}
.beta-tag{background:var(--teal);color:var(--fill-contrast,#06281c);font-size:11.25px;font-weight:800;padding:1px 6px;border-radius:4px;margin-left:2px;}
.avatar-btn{width:32px;height:32px;border-radius:50%;background:var(--g-blue-fill, var(--blue));color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;}
.icon-btn{width:32px;height:32px;border-radius:8px;background:var(--panel);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted);cursor:pointer;}
</style>
<script src="viz.js"></script>
</head>
<body>

<!-- 상단 바는 공용이다 — titlebar.js가 그린다(분리창=공용 헤더, 탭 안=셸 탭줄). 화면마다 두던 사본 23개를 지웠다(2026-08-07). -->

<div class="app">
  <div class="sidebar" id="gijoNav"></div>

  <div class="main">
    <!-- ⚠ 제목줄(.topbar-row)을 없앴다 — 공용 CSS(.g-ui .page-title{display:none})가 제목을
         이미 숨기고 있어 **내용이 0인 채 margin-bottom:20px만 먹고 있었다**(2026-08-21 실측).
         빈 div만 남기면 여백이 그대로 남는다 — 줄 자체를 없앤다(작업 기록 740e1ea6과 같은 자리). -->
    <div id="gijoChatWidget" data-prompts='["검토 대기 몇 건이야?","기한 지난 미조치 있어?"]' style="max-width:640px;margin-bottom:16px;"></div>

    <!-- VEX 내보내기 — 지금 내보내면 어떤 상태로 나가는지 칩으로 미리 보여준다.
         '영향없음 0'이 보이면 반려 사유를 안 적었다는 신호이기도 하다. 설명은 ⓘ(대화창). -->
    <div class="vex-bar" data-gijo-summary>
      <span class="vex-lb">VEX 내보내기</span>
      <span id="vexChips" class="vex-chips"><span class="muted-s">집계 중…</span></span>
      <button class="btn vex-btn" id="btnVexExport">⬇ 파일 받기</button>
    </div>

    <div id="scanFailNote" style="display:none;max-width:1100px;margin-bottom:8px;padding:5px 12px;border:1px solid rgba(240,160,32,.35);background:rgba(240,160,32,.08);border-radius:9px;font-size:12.5px;color:var(--text)"></div>

    <!-- ⚠ 요약 카드 7장을 걷었다(2026-08-21 밀도 라운드 — 설계관 원천 대조).
         아래 목록의 상태 알약(#rvFilt)이 **같은 변수·같은 모집단으로 같은 숫자 7개를
         이미 보여주고 있었다** — 미검토·진행중·검증·완료·반려는 같은 식이고, 미배정은
         아예 같은 지역변수 하나(unassigned)를 둘이 나눠 쓰고 있었다. 같은 것을 두 곳에
         적으면 어긋난다. 알약에만 없던 「지연」은 알약 줄로 옮겼다(요약.overdue 그대로).
         절감 64px = 목록 2줄. -->


    <!-- 그림 먼저(전-7 ①, 2026-08-05). 위 카드·칩은 **상태**를 말하고, 이 막대는 위 어디에도
         없던 물음 — **어느 심각도가 밀려 있나**를 말한다. 누르면 아래 목록이 그 심각도만 남는다.
         (도넛은 넣지 않았다 — 이 화면은 이미 카드 7장이라 세로가 빡빡하다.) -->
    <div id="vizStrip" style="max-width:1100px"></div>
    <div id="vizFilter" style="display:none;max-width:1100px"></div>

    <div class="rv-wrap">
      <div class="rv-list-pane">
        <!-- 자산 좁히기 띠 — 다른 화면에서 "이 건" 을 눌러 들어왔을 때만 나타난다.
             무엇으로 좁혀져 있는지 안 보이면 "왜 몇 건밖에 없지?"가 된다(2026-07-31). -->
        <div class="rv-scope" id="rvScope" style="display:none">
          <span id="rvScopeText"></span>
          <span class="rv-scope-all" id="rvScopeAll">전체 보기 ✕</span>
        </div>
        <!-- 두 원장 스위치(2026-09-07 · 승인 시안 mockups/wrong-flag + fix-board 통합).
             ⚠ 칩줄에 갈래 칩을 **나란히 더하지 않았다** — 한 줄에서 두 원장을 고르면 matchFilter·
               ?status=·심각도 셈이 딴 원장 행을 만나 r.finding.severity에서 즉시 터진다.
               세그먼트로 갈면 취약점 코드가 지적 행을 **원리상 못 본다**.
             ⚠ 0건이어도 회색으로 그린다 — 「사라지는 조작」은 아무도 못 찾는다. -->
        <div class="rv-seg" id="rvSeg">
          <button class="seg on" type="button" data-seg="vuln" title="지금 조치해야 할 취약점 수">🔧 취약점 조치 <b id="segVuln">0</b></button>
          <button class="seg" type="button" data-seg="fix" title="담당자가 「이 답 이상해요」라고 한 것 중 아직 고칠 것">💬 답 지적 <b id="segFix">0</b></button>
        </div>
        <!-- 답 지적 모드의 갈래 칩 — #rvFilt와 **자리를 바꿔 선다**(같이 서지 않는다).
             라벨은 서버 fixboard.고칠것갈래라벨과 글자가 같다(두 곳에 적으면 어긋난다). -->
        <div class="rv-filt" id="fixFilt" style="display:none">
          <span class="fchip" data-fx="doc">자료 부족 <b id="fxDoc">0</b></span>
          <span class="fchip" data-fx="rule">사내 규정 <b id="fxRule">0</b></span>
          <span class="fchip" data-fx="prod">제품 <b id="fxProd">0</b></span>
          <span class="fchip" data-fx="unclassified">미분류 <b id="fxNone">0</b></span>
          <!-- ⚠ 숫자와 목록의 **모집단이 다르다**(2026-09-07 검토관 [낮음]): 숫자는 서버 fixboard의
               **열림**(open+promoted)이고 목록은 최근 30일 **전 상태**다. 그래서 다 닫힌 갈래는
               「제품 0」인데 눌러 보면 3줄이 뜬다 — 감독 화면은 같은 숫자에 「열림 기준」이라 적어
               두는데 여기만 안 적어 두면 담당자는 숫자가 틀린 줄 안다. -->
          <span class="muted-s" id="fixChipNote" style="align-self:center">숫자는 열림 기준(닫힌 것도 목록엔 보입니다) · 칩을 다시 누르면 전체</span>
        </div>
        <div class="rv-filt" id="rvFilt">
          <span class="fchip on" data-f="active">조치대상 <b id="fcActive">0</b></span>
          <span class="fchip" data-f="in_progress">진행중 <b id="fcProg">0</b></span>
          <span class="fchip" data-f="verifying">검증 <b id="fcVerify">0</b></span>
          <span class="fchip" data-f="rejected">반려 <b id="fcRejected">0</b></span>
          <span class="fchip" data-f="accepted">위험수용 <b id="fcAccepted">0</b></span>
          <span class="fchip" data-f="approved">완료 <b id="fcApproved">0</b></span>
          <span class="fchip" data-f="pending">미검토 <b id="fcPending">0</b></span>
          <span class="fchip" data-f="unassigned">미배정 <b id="fcUnassigned">0</b></span>
          <!-- 지연 — 옛 요약 카드 7장에서 **여기에만 없던 하나**라 옮겨 왔다(2026-08-21). -->
          <span class="fchip" data-f="overdue" title="기한이 지났는데 아직 안 끝난 건">지연 <b id="fcOverdue">0</b></span>
        </div>
        <!-- 일괄 배정 — 선택한 건이 있을 때만 나타난다(평소엔 목록을 가리지 않는다). -->
        <div class="bulk-bar" id="bulkBar" style="display:none">
          <b><span id="bulkCount">0</span>건 선택</b>
          <input class="inp bulk-in" id="bulkAssignee" placeholder="담당자" list="gijoUserList">
          <input class="inp bulk-in" type="date" id="bulkDue" style="max-width:132px">
          <button class="btn primary" id="btnBulkAssign">일괄 배정</button>
          <button class="btn" id="btnBulkClear">해제</button>
        </div>
        <div id="rvList" class="rv-rows scroll-list">불러오는 중...</div>
      </div>
      <!-- 빈 문구는 **한국어 + 다음 행동**이다(F4-06, 2026-09-02) — 「finding」은 담당자가 모르는 말이고,
           옛 문구가 가리키던 「자산 스캔 실행」 단추는 이 제품 어디에도 없다. -->
      <div class="rv-detail" id="rvDetail"><div class="rv-empty">왼쪽 목록에서 취약점을 고르면 여기에 자세히 나옵니다.</div></div>
    </div>

    <div class="footer">
      <img src="gijo-symbol.svg" alt="GIJO">
      <span>© 2026 GIJO Technology · GIJO AS Platform · Confidential</span>
    </div>
  </div>
</div>

<style>
  /* ── 마스터·디테일(시안 C) ── */
  .rv-wrap{display:grid;grid-template-columns:360px 1fr;gap:14px;}
  .rv-list-pane{background:var(--panel-2);border:1px solid var(--border);border-radius:12px;padding:7px 10px;min-height:520px;}
  .rv-filt{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px;}
  /* 두 원장 스위치 — 새 색을 만들지 않는다(알약 .fchip와 같은 값에 밑줄 강조만 다르다). */
  .rv-seg{display:flex;gap:4px;margin-bottom:6px;border-bottom:1px solid var(--border);}
  .rv-seg .seg{font-size:12.25px;font-weight:700;color:var(--muted);background:none;border:none;
    border-bottom:2px solid transparent;padding:5px 10px 6px;cursor:pointer;font-family:inherit;}
  .rv-seg .seg:hover{color:var(--text);}
  .rv-seg .seg.on{color:var(--text-strong,#fff);border-bottom-color:var(--blue);}
  .rv-seg .seg b{margin-left:3px;color:var(--text);font-weight:800;}
  /* 「고칠 것」 갈래 배지 — 심각도 배지(.sev)와 같은 규격, 색만 갈래별로 다르다. */
  .fx-k{font-size:11.25px;font-weight:800;padding:1px 6px;border-radius:5px;flex:none;white-space:nowrap;}
  .fx-doc{color:var(--amber);background:rgba(240,160,32,.14);}
  .fx-rule{color:var(--blue-light);background:rgba(59,130,246,.14);}
  .fx-prod{color:var(--purple);background:rgba(139,124,240,.16);}
  .fx-unclassified{color:var(--muted);background:rgba(255,255,255,.07);}
  /* 🤖 초안 상자 — 사람 글(메모·최종문)과 **눈에 띄게 달라야** 한다(누가 쓴 글인지). */
  .fx-draft{background:rgba(139,124,240,.06);border:1px solid rgba(139,124,240,.3);border-radius:10px;padding:11px 13px;margin-bottom:10px;}
  .fx-draft .h{font-size:12px;font-weight:800;color:var(--purple);margin-bottom:6px;}
  .fx-quote{border-left:3px solid rgba(59,130,246,.45);background:rgba(59,130,246,.05);padding:7px 10px;border-radius:0 6px 6px 0;margin-bottom:6px;font-size:12.25px;line-height:1.7;color:var(--muted);}
  .fx-quote .src{font-size:11.5px;color:var(--muted-2);margin-bottom:3px;}
  .fx-redacted{color:var(--amber);background:rgba(240,160,32,.14);font-size:11.75px;font-weight:800;padding:2px 8px;border-radius:6px;}
  textarea.inp{resize:vertical;min-height:56px;font-family:inherit;line-height:1.6;}
  /* 자산 좁히기 띠 — 눈에 띄어야 한다. 좁혀진 줄 모르면 "왜 이것밖에 없지?"가 된다. */
  .rv-scope{display:flex;align-items:center;gap:8px;background:rgba(59,130,246,.10);border:1px solid rgba(59,130,246,.32);
    border-radius:9px;padding:7px 11px;margin-bottom:9px;font-size:12px;color:var(--blue-light,#8fb8ff);}
  .rv-scope-all{margin-left:auto;font-size:12.25px;font-weight:700;color:var(--muted);cursor:pointer;
    border:1px solid rgba(255,255,255,.16);border-radius:7px;padding:3px 9px;}
  .rv-scope-all:hover{color:var(--text);border-color:rgba(255,255,255,.3);}
  /* VEX 내보내기 줄 — 상태 미리보기 + 파일 받기. */
  .vex-bar{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:5px 12px;margin-bottom:8px;max-width:1100px;flex-wrap:wrap;}
  .vex-lb{font-size:12px;font-weight:800;color:var(--text);display:flex;align-items:center;gap:5px;}
  .vex-chips{display:flex;gap:5px;flex-wrap:wrap;}
  .vex-chips .vc{font-size:11.75px;font-weight:800;padding:2px 8px;border-radius:20px;}
  .vc-under{color:var(--amber);background:rgba(240,160,32,.15);}
  .vc-aff{color:var(--red-ink, #f5928a);background:rgba(226,72,61,.15);}
  .vc-fix{color:var(--teal);background:rgba(30,185,128,.16);}
  .vc-not{color:var(--muted);background:rgba(255,255,255,.07);}
  /* ⚠ 이 단추 높이가 띠 전체 높이를 정한다(2026-08-21 실측: 36px 단추 + 여백 = 69px).
     공용 --g-btn-h를 내리면 전 화면 단추가 같이 낮아지므로 이 띠 안에서만 낮춘다. */
  .vex-btn{margin-left:auto;height:26px;padding:0 11px;font-size:11.75px;}
  .muted-s{font-size:12.25px;color:var(--muted-2);}
  /* 미배정 = 병목이라 다른 지표와 구분해 보이게 한다(2026-07-26 조치 검증). */
  .kpi-unassigned{border-color:rgba(240,160,32,.5) !important;background:rgba(240,160,32,.07) !important;}
  /* 일괄 배정 바 — 선택했을 때만 뜬다. */
  .bulk-bar{display:flex;align-items:center;gap:7px;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.35);border-radius:9px;padding:7px 10px;margin-bottom:8px;font-size:12.5px;flex-wrap:wrap;}
  .bulk-bar .bulk-in{padding:4px 8px;font-size:12.25px;max-width:130px;}
  .rv-row .rv-ck{flex:0 0 auto;width:13px;height:13px;margin-right:2px;cursor:pointer;}
  /* 조치 검증 결과 — 판정 배지 + 근거(실행한 명령·출력). 목록이 길어지면 내부 스크롤. */
  .vres{border:1px solid var(--border-strong);border-radius:10px;overflow:hidden;margin-top:10px;}
  .vres-h{background:var(--panel-2);padding:8px 12px;font-size:12.5px;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap;cursor:pointer;}
  .vres-b{max-height:300px;overflow-y:auto;}
  .vres.collapsed .vres-b{display:none;}
  .vrow{display:flex;gap:9px;padding:9px 12px;border-top:1px solid rgba(255,255,255,.05);align-items:flex-start;}
  .vbadge{flex:0 0 auto;font-size:11.5px;font-weight:800;padding:2px 7px;border-radius:6px;margin-top:1px;white-space:nowrap;}
  .v-PASS{color:var(--teal);background:rgba(30,185,128,.16);}

<script>
  const esc = (s) => String(s == null ? "" : s).replace(/</g, "&lt;");
  // findingplain의 `말`에 든 리터럴 **강조**를 <b>로(esc 다음에 적용). vulnscan과 같은 헬퍼.
  const boldify = (s) => String(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");


  const ST_LABEL = { pending: "미검토", in_progress: "진행중", verifying: "검증 대기", approved: "완료", rejected: "반려", accepted: "위험수용" };
  const REJ_LABEL = { false_positive: "오탐", compensating_control: "다른 보안으로 방어 중" };
  const SEV_ORD = { critical: 0, high: 1, medium: 2, low: 3 };
  const fmtDate = (ms) => ms ? new Date(ms).toLocaleString("ko-KR", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }) : "";

  let allReviews = [];
  // 취약점 원장을 못 읽은 이유. **지적 목록을 덮지 않고 여기 담아 둔다**(2026-09-07 검토관 [중간]).
  // 빈 문자열이면 정상 — 있으면 🔧 칸이 「—」가 되고, 🔧로 돌아올 때 이 글이 목록 자리에 선다.
  let vulnError = "";
  let rvFilter = "active"; // active | in_progress | verifying | rejected | approved | pending | unassigned
  let currentKey = null;   // "assetId\0findingKey"
  const selected = new Set(); // 일괄 배정용 선택(키 = assetId\0findingKey)

  function keyOf(r) { return `${r.assetId}\0${r.findingKey}`; }
  // 미배정 = 실수행 담당자가 없는 조치 대상. 검증은 배정된 건에만 실행되므로 병목이다.
  // ⚠ 식을 여기 다시 쓰지 않는다 — 사이드바 「③ 조치」 배지·✅ 판 배지·이 화면이 **같은 수**를
  //   말해야 한다. 원천은 서버 approvals.ts isUnassignedReview이고, 화면 쪽 단일 창구가
  //   preload의 isUnassignedApproval이다(clientglobals.test가 소스로 감시한다).
  //   옛 식은 허용목록형 ["pending","in_progress","verifying"]이라 상태가 하나 늘면 조용히
  //   빠뜨린다 — 실제로 accepted(위험수용)가 늘던 날 이 화면만 옛 잣대로 남을 뻔했다.
  function isUnassigned(r) {
    return window.gijo.isUnassignedApproval(r);
  }
  // 지연 = 기한이 지났는데 아직 안 끝난 건. ⚠ **서버 approvals.ts isOverdue와 같은 잣대**를
  // 쓴다 — 개수는 서버 요약(summary.overdue)이 주고 여기서는 「어느 줄이 그건가」만 고른다.
  // 둘이 어긋나면 알약 숫자와 걸러진 목록 길이가 달라져 바로 티가 난다.
  function isOverdue(r) {
    const d = new Date();
    const 오늘 = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    return !!r.dueDate && String(r.dueDate) < 오늘 && !["rejected", "approved", "accepted"].includes(r.status);
  }
  // 다른 화면에서 "이 건"을 눌러 들어왔을 때 좁혀 보는 자산(2026-07-31 사용자 지적:
  // "해당 IP나 호스트를 눌렀을 때 해당 취약점만 나와야 하는데 전체가 보인다").
  // ⚠ 상태 필터(rvFilter)와 **곱해서** 건다 — 자산으로 좁힌 뒤 상태 칩도 그대로 쓸 수 있어야 한다.
  let scopeAsset = null;
  // 그림 띠에서 고른 심각도(전-7 ①, 2026-08-05). 상태 필터·자산 좁히기와 **곱해서** 건다.
  let 심각도필터 = null;

  function matchFilter(r) {
    if (scopeAsset && r.assetId !== scopeAsset) return false;
    if (심각도필터 && r.finding.severity !== 심각도필터) return false;
    switch (rvFilter) {
      case "active": return r.status === "pending" || r.status === "in_progress" || r.status === "verifying";
      case "in_progress": return r.status === "in_progress";
      case "verifying": return r.status === "verifying";
      case "rejected": return r.status === "rejected";
      case "accepted": return r.status === "accepted";
      case "approved": return r.status === "approved";
      case "pending": return r.status === "pending";
      case "unassigned": return isUnassigned(r);
      case "overdue": return isOverdue(r);
      default: return true;
    }
  }

  async function loadReviews(keepSelection = true) {
    // (#rvList를 여기서 안 잡는다 — 목록을 지우는 일은 취약점오류그리기() 한 곳으로 모았다.
    //  잡아만 두고 안 쓰면 다음 사람이 「여기서도 지워도 되나 보다」로 읽는다.)
    try {
      const { reviews, summary } = await window.gijo.listApprovals();
      allReviews = reviews;
      vulnError = "";
      // 자산으로 좁혀 보는 중이면 **위 요약 카드와 칩 숫자도 그 자산 것**이어야 한다.
      // 목록은 3건인데 위에 46이라고 적혀 있으면 담당자는 무엇을 믿어야 할지 모른다.
      const scoped = scopeAsset ? reviews.filter((r) => r.assetId === scopeAsset) : reviews;
      const cnt = (fn) => scoped.filter(fn).length;
      const 요약 = scopeAsset
        ? {
            pending: cnt((r) => r.status === "pending"),
            in_progress: cnt((r) => r.status === "in_progress"),
            verifying: cnt((r) => r.status === "verifying"),
            approved: cnt((r) => r.status === "approved"),
            rejected: cnt((r) => r.status === "rejected"),
            accepted: cnt((r) => r.status === "accepted"),
            overdue: cnt((r) => r.overdue),
          }
        : summary;
      // 스캔이 안 된 자산 — 취약점이 아니라 **스캐너를 고칠 일**이다. 취약점 숫자에서 빼고
      // 여기서 따로 알린다(2026-08-01: 605건 중 602건이 스캔 오류라 "미검토 602건"으로 보였다).
      var 실패 = (summary && summary.scanFailed) || 0;
      var 알림 = document.getElementById("scanFailNote");
      if (실패 > 0 && 알림) {
        알림.style.display = "";
        알림.innerHTML = "🔧 <b>스캔이 안 된 자산 " + 실패 + "건</b> — 스캐너가 결과를 못 받은 것이라 " +
          "취약점 숫자에는 넣지 않았습니다. 접속 정보·권한을 확인해 주세요.";
      } else if (알림) {
        알림.style.display = "none";
      }
      // 요약 = 아래 상태 알약 한 줄이 전부다(2026-08-21 — 옛 카드 7장은 같은 숫자를
      // 두 번 그리고 있었다). 「지연」만 이 줄로 옮겨 왔다.
      document.getElementById("fcOverdue").textContent = 요약.overdue ?? 0;
      document.getElementById("fcActive").textContent = cnt((r) => ["pending", "in_progress", "verifying"].includes(r.status));
      document.getElementById("fcProg").textContent = 요약.in_progress ?? 0;
      document.getElementById("fcVerify").textContent = 요약.verifying ?? 0;
      document.getElementById("fcRejected").textContent = 요약.rejected;
      document.getElementById("fcAccepted").textContent = 요약.accepted ?? 0;
      document.getElementById("fcApproved").textContent = 요약.approved;
      document.getElementById("fcPending").textContent = 요약.pending;
      document.getElementById("fcUnassigned").textContent = cnt(isUnassigned);
      세그숫자();   // 🔧 칸의 숫자는 이 목록에서 온다(💬 칸은 서버 fixboard가 센다)
      그림띠();
      renderList();
      // 상태가 바뀌면 VEX로 나갈 값도 바뀐다 — 칩을 같이 갱신한다(선언과 화면이 어긋나지 않게).
      if (window.gijoRefreshVex) window.gijoRefreshVex();
      // 선택 유지 — 갱신 후에도 열려 있던 finding의 상세를 다시 그린다.
      if (keepSelection && currentKey) {
        const cur = allReviews.find((r) => keyOf(r) === currentKey);
        if (cur) renderDetail(cur); else clearDetail();
      }
    } catch (e) {
      vulnError = (e && e.message) || String(e);
      // ★ 답 지적을 보는 중이면 **딴 원장의 오류로 이 목록을 덮지 않는다**(2026-09-07 검토관 [중간]).
      //   renderList에는 같은 가드를 넣어 두고 여기만 빠뜨렸다 — 위 주석이 「목록을 지우는 자리가
      //   둘」이라고 경고한 바로 그 두 번째 자리다. ?fix= 딥링크(대화창 꼬리·감독 「🗔 결재판에서
      //   처리」)로 들어오면 loadFix가 먼저 끝나 지적 목록이 그려진 뒤 이 실패가 오므로,
      //   덮어쓰기는 예외가 아니라 **기본 경로**였다.
      //   ⚠ 조용히 삼키지 않는다 — 🔧 세그먼트 숫자를 「—」로 바꿔 저쪽이 지금 안 읽힌다고 말하고,
      //     🔧로 돌아올 때 아래 취약점오류그리기()가 이유를 그대로 보인다.
      if (segMode === "fix") { 세그숫자(); return; }
      취약점오류그리기();
      // ⚠ **여기서도 대화창의 보던 목록을 비운다**(2026-08-18 검토 지적). 위 주석이 「목록을 지우는
      //   자리가 둘」이라고 이미 적어 뒀는데 또 한 곳만 막았다. 안 비우면: 3건을 보다 서버 오류로
      //   재조회 실패 → 화면엔 "불러오지 못했습니다" → "이것들 전부 오탐" → **화면에 없는 옛 3건**에 걸린다.
      보는목록알림(null);
    }
  }

  /** 취약점 원장을 못 읽었다고 **목록 자리에** 적는다.
   *
   * 부르는 곳이 둘이다 — loadReviews의 catch(그때 🔧를 보고 있었을 때)와 setSeg(💬를 보다
   * 🔧로 돌아왔을 때). 두 번째가 없으면 빈 allReviews로 renderList가 돌아
   * 「아직 검토할 취약점이 없습니다」라는 **거짓 단언**이 된다(장애 ≠ 부재). */
  function 취약점오류그리기() {
    const list = document.getElementById("rvList");
    if (!list) return;
    상세칸구하기(list); // ⚠ 여기서 목록을 통째로 지운다 — renderList와 같은 파괴다
    list.innerHTML = '<div class="rv-empty" style="color:var(--red-ink, #f5928a)">불러오지 못했습니다: ' +
      esc(vulnError) + "</div>";
  }

  /** 목록을 `innerHTML`로 지우기 **전에** 자세히 칸을 원래 자리로 구해 낸다.
   *
   * ⚠ nav.js `gijo자세히아래로`가 #rvDetail을 **목록 안**(누른 줄 아래)으로 옮긴다.
   *   그 상태에서 목록을 지우면 칸이 같이 사라져 다음 renderDetail이 터졌다(2026-08-18 실사고).
   *   ⚠ **목록을 지우는 자리가 둘이다** — renderList와 loadReviews의 catch. 한 곳만 막으면
   *   서버 오류·네트워크 끊김 때 같은 결함이 그대로 난다(검토관 지적 2026-08-18).
   *   같은 노드를 옮기므로 nav.js가 잡고 있는 참조도 그대로 살아 있다. */
  function 상세칸구하기(list) {
    const 자세히 = list && list.querySelector("#rvDetail");
    if (!자세히) return;
    const wrap = document.querySelector(".rv-wrap");
    if (wrap) wrap.appendChild(자세히);
    else 자세히.remove();
  }

  // ── 그림 먼저(전-7 ①, 2026-08-05) ──────────────────────────────────────
  // 막대는 **조치 대상**(미검토·진행중·검증)만 센다 — 끝난 건까지 세우면 "얼마나 밀렸나"가
  // 안 보인다. 총계는 늘 전체로 내고, 눌러 좁혀도 위 카드 숫자는 그대로다.
  function 그림띠() {
    const 자리 = document.getElementById("vizStrip");
    if (!자리 || !window.gijoViz) return;
    // ⚠ 이 화면이 스스로 세운 규칙을 막대도 지킨다(2026-08-05 검토 지적):
    //   "자산으로 좁혀 보는 중이면 위 카드·칩 숫자도 그 자산 것이어야 한다."
    //   막대만 전체를 세면 카드는 3건인데 바로 밑 막대가 4,890을 세운다.
    const 범위 = scopeAsset ? allReviews.filter((r) => r.assetId === scopeAsset) : allReviews;
    const 열린것 = 범위.filter((r) => ["pending", "in_progress", "verifying"].includes(r.status));
    const 셈 = (k) => 열린것.filter((r) => r.finding.severity === k).length;
    window.gijoViz.mount(자리, {
      title: "조치 대상 — 심각도별",
      hint: "누르면 목록이 좁혀집니다",
      parts: [{
        kind: "bars",
        segments: [
          { key: "critical", label: "긴급", value: 셈("critical") },
          { key: "high", label: "높음", value: 셈("high") },
          { key: "medium", label: "보통", value: 셈("medium") },
          { key: "low", label: "낮음", value: 셈("low") },
        ],
        onPick: (key) => { 심각도필터 = key; 필터띠(); renderList(); },
      }],
    });
    if (심각도필터) {
      const b = 자리.querySelector('.gviz-bar[data-key="' + 심각도필터 + '"]');
      if (b) b.classList.add("on");
    }
    필터띠();   // 승인·반려로 목록이 바뀌면 띠 숫자도 따라 바뀌어야 한다
  }

  // 필터 띠 — 목록 단위(건)로, **지금 화면에 걸린 모든 조건**을 반영해 센다.
  const SEV_KO = { critical: "긴급", high: "높음", medium: "보통", low: "낮음" };
  function 필터띠() {
    if (!window.gijoViz) return;
    const el = document.getElementById("vizFilter");
    if (!심각도필터) { window.gijoViz.filterBar(el, null, null); return; }
    const 보임 = allReviews.filter(matchFilter).length;
    const 전체 = allReviews.filter((r) => (!scopeAsset || r.assetId === scopeAsset)).length;
    window.gijoViz.filterBar(el, { label: SEV_KO[심각도필터] || 심각도필터, 보임, 전체, 단위: "건" },
      () => {
        심각도필터 = null;
        document.querySelectorAll("#vizStrip .gviz-bar").forEach((b) => b.classList.remove("on"));
        필터띠();
        renderList();
      });
  }
  // ───────────────────────────────────────────────────────────────────────

  function renderList() {
    // ⚠ 답 지적 모드에서는 **아무것도 안 그린다.** 이 함수는 취약점 원장 전용인데, 갱신
    //   경로가 여럿이라(loadReviews·그림띠·필터띠·일괄배정) 막지 않으면 지적 목록을 조용히
    //   덮어쓴다 — 담당자에겐 「누르니까 목록이 바뀌었다」로만 보인다.
    if (segMode === "fix") return;
    const list = document.getElementById("rvList");
    상세칸구하기(list); // 아래 innerHTML이 자세히 칸까지 지우는 것을 막는다(위 함수 주석 참고)
    const filtered = allReviews.filter(matchFilter).sort((a, b) => {
      if (a.overdue !== b.overdue) return a.overdue ? -1 : 1;
      return SEV_ORD[a.finding.severity] - SEV_ORD[b.finding.severity];
    });
    if (!filtered.length) {
      list.innerHTML = '<div class="rv-empty">' +
        // ⚠ **다음 행동을 없는 자리로 안내하지 않는다**(F4-06, 2026-09-02). 옛 문구는 「자산 스캔을
        //   먼저 실행하세요」였는데 이 제품에는 스캔을 실행하는 단추가 없다 — 스캔 결과 **파일 인입**은
        //   대화창 ＋로 통일돼 있다(vulnscan.html:604 주석, 2026-07-27). 실제로 있는 자리를 가리킨다.
        (!allReviews.length ? "아직 검토할 취약점이 없습니다 — 아래 대화창 ＋로 스캔 결과 파일(Nessus 등)을 올리면 여기 쌓입니다."
          : 심각도필터 ? "고른 심각도에 해당하는 건이 없습니다 — 위 「✕ 해제」를 누르면 전체가 다시 보입니다."
          : "이 상태의 취약점이 없습니다.") + "</div>";
      // ⚠ 비었을 때도 **알린다.** 안 알리면 아까 목록이 대화창에 남아, 화면엔 아무것도 없는데
      //   「이것들 배정해줘」가 사라진 목록에 걸린다.
      보는목록알림(null);
      return;
    }
    list.innerHTML = filtered.map((r) => {
      const dot = r.overdue ? "d-over" : "d-" + r.status;
      const bits = [esc(r.assetName)];
      if (r.assignee) bits.push(esc(r.assignee));
      if (r.status === "verifying") bits.push("검증 대기");
      else if (r.status === "rejected") bits.push(REJ_LABEL[r.rejectReason] || "반려");
      else if (r.status === "accepted") {
        // 수용 기한이 지났으면 재검토 대상임을 행에서 바로 알린다 — 감춰지는 상태가 아니다.
        // 로컬(KST) 달력 비교 — UTC면 0~9시에 하루 어긋난다(검토관 중6).
        const t0 = new Date();
        const 만료 = r.acceptUntil && r.acceptUntil < new Date(t0.getTime() - t0.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
        bits.push(만료 ? "⚠수용 만료(재검토)" : "수용 ~" + esc((r.acceptUntil || "").slice(5)));
      }
      else if (r.overdue) bits.push("⚠지연");
      else if (r.dueDate) bits.push("📅" + esc(r.dueDate.slice(5)));
      if (isUnassigned(r)) bits.push("미배정");
      // 구분자(\0)는 HTML 속성에서 유실되므로 assetId·findingKey를 별도 data 속성으로 싣는다.
      const ck = r.status === "rejected" || r.status === "approved" ? "" :
        `<input type="checkbox" class="rv-ck" data-ck="1"${selected.has(keyOf(r)) ? " checked" : ""}>`;
      return `<div class="rv-row${keyOf(r) === currentKey ? " on" : ""}" data-a="${esc(r.assetId)}" data-k="${esc(r.findingKey)}">
        ${ck}<span class="rv-dot ${dot}"></span>
        <div class="rv-rmain"><div class="rv-rt">${esc(r.finding.finding_type)}</div><div class="rv-rs">${bits.join(" · ")}</div></div>
        <span class="sev sev-${esc(r.finding.severity)}">${esc(r.finding.severity)}</span>
      </div>`;
    }).join("");
    list.querySelectorAll(".rv-row").forEach((el) => el.addEventListener("click", (ev) => {
      const r = allReviews.find((x) => x.assetId === el.dataset.a && x.findingKey === el.dataset.k);
      if (!r) return;
      if (ev.target.dataset.ck) { // 체크박스는 선택 토글만(상세 열지 않음)
        ev.stopPropagation();
        const k = keyOf(r);
        if (ev.target.checked) selected.add(k); else selected.delete(k);
        renderBulkBar();
        return;
      }
      // ⚠ 알림을 **맨 앞에** 둔다(2026-08-18). 아래 renderList/renderDetail이 터져도
      //   대화창은 「이거」를 잡아야 한다 — 실제로 renderDetail이 터지는 길이 있었다(바로 아래 주석).
      대화창에알림(r);
      currentKey = keyOf(r); renderList(); renderDetail(r);
    }));
    renderBulkBar();
    보는목록알림(filtered);
  }

  // 일괄 배정 바 — 선택이 있을 때만 보인다(평소엔 목록을 가리지 않는다).
  function renderBulkBar() {
    const bar = document.getElementById("bulkBar");
    document.getElementById("bulkCount").textContent = selected.size;
    bar.style.display = selected.size ? "flex" : "none";
  }

  // ⚠ 118행 초기 문구와 **글자까지 같아야** 한다 — 같은 자리가 상황에 따라 다른 말을 하면
  //   담당자는 화면이 바뀐 줄 안다(F4-06, 2026-09-02).
  function clearDetail() { const d = 상세칸(); if (!d) return; d.innerHTML = '<div class="rv-empty">왼쪽 목록에서 취약점을 고르면 여기에 자세히 나옵니다.</div>'; }

  /* ══ 두 번째 원장 — 「고칠 것」(답 지적) ══════════════════════════════════════════
   *
   * ■ 왜 여기인가(2026-09-07 · 통합 설계관): 승인·반려를 하는 자리가 이 화면 하나다. 지적을
   *   처리하는 화면을 따로 만들면 담당자가 결재를 두 곳에서 하게 된다.
   *
   * ■ ★ 두 원장은 **서로를 안 본다.** allFix를 allReviews에 합치면 그 순간
   *   r.finding.severity에서 터지고, 합치지 않더라도 VEX·심각도 막대·SLA·미배정 숫자가
   *   딴 원장 행으로 오염된다. 그래서 배열도 필터도 그리는 함수도 **따로**다.
   *   짝 시험: server/test/answerflagui.test.ts ⑤.
   *
   * ■ 안 만든 것(정직하게)
   *   · 반려 **사유 칸**을 만들지 않았다 — 서버 answer_feedback에 그 값을 담을 자리가 없다.
   *     적게 해 놓고 아무 데도 안 남기면 「적었는데 사라졌다」가 된다(별건: 서버에 칸 신설).
   *   · 담당·기한(SLA)을 붙이지 않았다 — 없는 SLA를 흉내 내면 「지연 0건」이 거짓말이 된다.
   */
  // 라벨의 주인은 서버 fixboard.고칠것갈래라벨이다 — 글자가 어긋나면 같은 것이 두 이름이 된다.
  const FIX_LABEL = { doc: "자료 부족", rule: "사내 규정", prod: "제품", unclassified: "미분류" };
  // 상태 넷 — resolved만 「고쳤다」다. promoted는 옮겨 적은 것이지 고친 것이 아니다(서버 고칠것열림).
  const FIX_STATUS = { open: "열림", promoted: "편입(아직 고칠 것)", dismissed: "부적합으로 닫음", resolved: "고쳐서 닫음" };
  const FIX_ORDER = ["doc", "rule", "prod", "unclassified"];
  let allFix = [];        // ⚠ allReviews와 **절대** 합치지 않는다
  let fixBoard = null;    // 갈래별 집계 — 세는 곳은 서버 한 곳(고칠것요약)이다
  let fixFilter = null;   // null = 전체
  let fixKey = null;      // 고른 지적 id
  let fixError = "";      // 못 불러온 이유 — 빈 목록으로 「없습니다」라고 말하지 않는다
  let segMode = "vuln";   // vuln | fix
  const FIX_DAYS = 30;    // 「최근 30일」 = 오늘 포함 30일(로컬 달력 자정 기준 — 서버 기간시작)

  async function loadFix() {
    try {
      const r = await window.gijo.listAnswerFeedback(FIX_DAYS);
      allFix = (r && r.entries) || [];
      fixBoard = (r && r.fixboard) || null;
      fixError = "";
    } catch (e) {
      // ⚠ 이 창구는 **관리자 전용**이다 — 담당자 계정은 403을 받는다. 그때 0건으로 그리면
      //   「지적이 없습니다」라는 거짓 단언이 된다(정직 가드 계열). 이유를 그대로 보인다.
      allFix = []; fixBoard = null;
      fixError = (e && e.message) || String(e);
    }
    갈래칩숫자();
    세그숫자();
    if (segMode === "fix") renderFixList();
  }

  function 세그숫자() {
    const v = document.getElementById("segVuln");
    const f = document.getElementById("segFix");
    // 두 숫자 다 「지금 열린 일감」이다 — 뜻이 달라지면 나란히 세울 수 없다.
    // ⚠ 🔧는 **자산 좁히기를 탄다**(2026-09-07 검토관 [중간]). 안 태우면 바로 아래 「조치대상」
    //   알약(scoped로 셈)과 갈려, ?asset= 진입에서 세그먼트 3 / 알약 2가 한 화면에 선다 —
    //   이 파일이 스스로 「목록은 3건인데 위에 46이면 무엇을 믿나」라고 못 박은 그 규칙이다.
    // ⚠ 못 읽었으면 0이 아니라 「—」다. 0은 「없다」인데 사실은 「모른다」다(장애 ≠ 부재).
    const 범위 = scopeAsset ? allReviews.filter((r) => r.assetId === scopeAsset) : allReviews;
    if (v) v.textContent = vulnError ? "—" : 범위.filter((r) => ["pending", "in_progress", "verifying"].includes(r.status)).length;
    // ⚠ 「아직 고칠 것」은 **서버가 센다**(open+promoted). 화면이 다시 세면 감독 화면·주간 요약과
    //   숫자가 어긋나고, 목록은 200건에서 굳는다(「200 포화, 실제 1578」).
    if (f) f.textContent = fixError ? "—" : (fixBoard ? fixBoard.open : 0);
  }

  function 갈래칩숫자() {
    const 칸 = { doc: "fxDoc", rule: "fxRule", prod: "fxProd", unclassified: "fxNone" };
    const kinds = (fixBoard && fixBoard.kinds) || [];
    FIX_ORDER.forEach((k) => {
      const el = document.getElementById(칸[k]);
      if (!el) return;
      const row = kinds.filter((x) => x.fixkind === k)[0];
      el.textContent = fixError ? "—" : (row ? row.open : 0);
    });
  }

  function setSeg(mode) {
    segMode = mode === "fix" ? "fix" : "vuln";
    document.querySelectorAll("#rvSeg .seg").forEach((b) => b.classList.toggle("on", b.dataset.seg === segMode));
    const 보이기 = (id, on) => { const e = document.getElementById(id); if (e) e.style.display = on ? "" : "none"; };
    보이기("rvFilt", segMode === "vuln");
    보이기("fixFilt", segMode === "fix");
    // 그림 띠·VEX는 **취약점 원장의 말**이다 — 지적 목록 위에 세워 두면 딴 원장을 가리킨다.
    보이기("vizStrip", segMode === "vuln");
    보이기("vizFilter", segMode === "vuln" && !!심각도필터);
    const vex = document.querySelector(".vex-bar");
    if (vex) vex.style.display = segMode === "vuln" ? "" : "none";
    // 자산 좁히기 띠도 취약점 원장의 말이다 — 판정은 renderScope 한 곳이 한다(위 함수 주석).
    renderScope();
    selected.clear();
    renderBulkBar();
    // 원장이 바뀌면 대화창이 쥐고 있던 「이것들」은 뜻을 잃는다 — 안 비우면 없는 목록에 걸린다.
    보는목록알림(null);
    if (segMode === "fix") { clearDetail(); renderFixList(); return; }
    // 💬를 보는 동안 취약점 쪽이 실패해 있었다면(위 catch가 목록을 안 덮었다) 이유를 여기서 보인다.
    // 안 그러면 빈 allReviews로 renderList가 돌아 「아직 검토할 취약점이 없습니다」로 거짓말한다.
    if (vulnError) { clearDetail(); 취약점오류그리기(); return; }
    renderList();
    const cur = currentKey ? allReviews.find((r) => keyOf(r) === currentKey) : null;
    if (cur) renderDetail(cur); else clearDetail();
  }

  function renderFixList() {
    const list = document.getElementById("rvList");
    if (!list) return;
    상세칸구하기(list);   // 이 아래 innerHTML이 자세히 칸까지 지우는 것을 막는다(위 함수 주석)
    if (fixError) {
      list.innerHTML = '<div class="rv-empty">이 목록은 <b>관리자</b>만 볼 수 있습니다 — 답 본문과 사내 문서 조각이 함께 실리기 때문입니다.<br>' +
        '<span class="muted-s">' + esc(fixError) + "</span></div>";
      return;
    }
    const rows = allFix.filter((r) => !fixFilter || (fixFilter === "unclassified" ? !r.fixkind : r.fixkind === fixFilter));
    if (!rows.length) {
      list.innerHTML = '<div class="rv-empty">' +
        (!allFix.length
          ? "최근 " + FIX_DAYS + "일 접수된 답 지적이 없습니다 — 대화창 답 아래 「▶ 이 답 이상해요」로 남깁니다."
          : "이 갈래의 지적이 없습니다 — 칩을 다시 누르면 전체가 보입니다.") + "</div>";
      return;
    }
    list.innerHTML = rows.map((r) => {
      const k = r.fixkind || "unclassified";
      const bits = [FIX_STATUS[r.status] || esc(r.status)];
      if (r.actor) bits.push(esc(r.actor));
      bits.push(fmtDate(r.at));
      if (r.sameAnswer > 1) bits.push("같은 답 지적 " + r.sameAnswer + "건");
      if (r.redacted) bits.push("🔒 일부 가림");
      return `<div class="rv-row${r.id === fixKey ? " on" : ""}" data-fid="${esc(String(r.id))}">
        <span class="fx-k fx-${k}">${esc(FIX_LABEL[k])}</span>
        <div class="rv-rmain"><div class="rv-rt">${esc(r.question) || "(질문 없음)"}</div><div class="rv-rs">${bits.join(" · ")}</div></div>
      </div>`;
    }).join("");
    list.querySelectorAll(".rv-row").forEach((el) => el.addEventListener("click", () => {
      const r = rows.filter((x) => String(x.id) === el.dataset.fid)[0];
      if (!r) return;
      fixKey = r.id;
      renderFixList();
      renderFixDetail(r);
    }));
  }

  function renderFixDetail(r) {
    const 칸 = 상세칸();
    if (!칸) return;
    const k = r.fixkind || "unclassified";
    const 갈래칩 = FIX_ORDER.map((x) => `<span class="fchip${x === k ? " on" : ""}" data-setfx="${x}">${esc(FIX_LABEL[x])}</span>`).join("");
    const 인용 = (r.quotes || []).map((q) =>
      `<div class="fx-quote"><div class="src">📄 ${esc(q.title || q.documentId)}</div>${esc(q.text)}</div>`).join("");
    // 갈래마다 **닫는 길이 하나**다. 미분류에는 없다 — 무엇을 해야 닫히는지 아직 아무도 안 정했다.
    const 닫는버튼 = {
      doc: '<button class="btn primary" id="fxToChat">＋ 문서 올리기 — 대화창에 담기</button>',
      rule: '<button class="btn primary" id="fxResolve">✓ 승인 — 고쳐서 닫음</button>',
      prod: '<button class="btn primary" id="fxPromote">🛠 회귀 문항·개발 목록으로 편입</button>',
    }[k] || "";
    const 닫는설명 = {
      doc: "누르면 대화창에 문장만 <b>얹습니다</b>(보내지 않습니다) — 지시는 대화창에서 합니다. 자료를 올린 뒤 「승인」으로 닫습니다.",
      rule: "아래 최종문을 함께 저장하고 이 지적을 닫습니다.",
      prod: "편입하면 문항 후보 목록에서는 내려가고, 「아직 고칠 것」에는 <b>남습니다</b> — 옮겨 적은 것이지 고친 것이 아닙니다.",
    }[k] || "갈래를 먼저 골라 주세요 — 무엇을 해야 닫히는지가 정해져야 닫는 길이 생깁니다.";
    칸.innerHTML = `
      <div class="dt-top">
        <span class="fx-k fx-${k}">${esc(FIX_LABEL[k])}</span>
        <span class="st st-${r.status === "resolved" ? "approved" : r.status === "dismissed" ? "rejected" : "pending"}">${FIX_STATUS[r.status] || esc(r.status)}</span>
        ${r.redacted ? '<span class="fx-redacted">🔒 열람 등급이 달라 일부를 가렸습니다</span>' : ""}
        <span style="font-size:11.75px;color:var(--muted-2)">${esc(r.actor || "-")} · ${fmtDate(r.at)}${r.sameAnswer > 1 ? " · 같은 답 지적 " + r.sameAnswer + "건" : ""}</span>
      </div>
      <div class="dt-title">${esc(r.question) || "(질문 없음)"}</div>
      <div class="sec"><div class="sec-h">그때 나간 답</div><div class="dt-evid">${esc(r.answer) || "(답 없음)"}</div></div>
      ${r.note ? `<div class="sec"><div class="sec-h">담당자가 적은 것</div><div class="dt-evid">${esc(r.note)}</div></div>` : ""}
      ${인용 ? `<div class="sec"><div class="sec-h">그 답이 인용한 조각</div>${인용}</div>` : ""}
      <div class="sec"><div class="sec-h">갈래 — 사람만 바꿉니다</div><div class="rv-filt">${갈래칩}</div>
        <div class="hint">AI는 이 값을 못 바꿉니다. 접수 때 「사내 근거 없음」 표시가 있던 답만 자동으로 <b>자료 부족</b>이 됩니다.</div></div>
      <div class="sec"><div class="sec-h">🤖 수정 초안 — 누를 때만 만듭니다</div>
        <div id="fxDraftBox">${r.draft
          ? `<div class="fx-draft"><div class="h">🤖 초안 ${esc(r.draftModel || "")}</div><textarea class="inp" id="fxDraftText">${esc(r.draft)}</textarea>
             <div class="hint">사람이 고쳐서 씁니다. 이대로 반영되지 않습니다.</div></div>`
          : '<div class="hint">아직 만들지 않았습니다.</div>'}</div>
        <div class="actions"><button class="btn" id="fxDraftBtn">🤖 초안 만들기</button>
          ${r.draft ? '<button class="btn" id="fxDraftMove">↧ 최종문 칸으로 옮기기</button>' : ""}</div>
      </div>
      <div class="sec"><div class="sec-h">고친 최종문(정답)</div>
        <textarea class="inp" id="fxExpected" placeholder="이 질문에 나갔어야 할 답을 적어 주세요">${esc(r.expected || "")}</textarea>
        <div class="hint">여기 적은 글이 회귀 검사 문항의 정답이 됩니다 — 고쳐진 기록은 회귀 검사 문항 후보로 쌓입니다.</div>
        <div class="actions"><button class="btn" id="fxSaveExp">최종문만 저장</button></div>
      </div>
      <div class="sec"><div class="sec-h">닫기</div>
        <div class="actions">${닫는버튼}<button class="btn reject" id="fxDismiss">부적합으로 닫기</button></div>
        <div class="hint">${닫는설명}</div>
        <div class="hint">부적합으로 닫아도 <b>행은 남습니다</b> — 지적은 버리지 않습니다.
          (반려 사유를 적는 칸은 아직 없습니다 — 서버에 담을 자리가 없어 만들지 않았습니다.)</div>
      </div>`;
    wireFixDetail(r);
  }

  function wireFixDetail(r) {
    const 칸 = 상세칸();
    if (!칸) return;
    const 값 = (id) => { const e = 칸.querySelector("#" + id); return e ? e.value : ""; };
    const 다시 = async () => { await loadFix(); const cur = allFix.filter((x) => x.id === r.id)[0]; if (cur) renderFixDetail(cur); else clearDetail(); };
    const 누르면 = (id, fn) => { const b = 칸.querySelector("#" + id); if (b) b.addEventListener("click", fn); };

    칸.querySelectorAll("[data-setfx]").forEach((chip) => chip.addEventListener("click", async () => {
      const v = chip.dataset.setfx === "unclassified" ? null : chip.dataset.setfx;
      try { await window.gijo.setAnswerFeedbackKind(r.id, v); await 다시(); }
      catch (e) { gijoTell("갈래를 바꾸지 못했습니다: " + ((e && e.message) || e)); }
    }));

    누르면("fxDraftBtn", async () => {
      const b = 칸.querySelector("#fxDraftBtn");
      const box = 칸.querySelector("#fxDraftBox");
      b.disabled = true;
      const orig = b.textContent;
      // ⚠ 동기라 몇 초 걸린다 — 기다리는 동안 화면이 아무 말도 안 하면 사람은 안 눌린 줄 안다.
      b.textContent = "초안 만드는 중… (몇 초 걸립니다)";
      try {
        const res = await window.gijo.buildAnswerFeedbackDraft(r.id);
        if (res && res.draft) { await 다시(); return; }
        // 재료가 없거나 열람 등급에 막혔다 — 서버가 적어 준 사람 말을 **그대로** 보인다.
        if (box) box.innerHTML = '<div class="hint">' + esc((res && res.reason) || "초안을 만들지 못했습니다.") + "</div>";
      } catch (e) {
        if (box) box.innerHTML = '<div class="hint" style="color:var(--red-ink, #f5928a)">초안 실패: ' + esc((e && e.message) || String(e)) + "</div>";
      }
      b.disabled = false;
      b.textContent = orig;
    });

    누르면("fxDraftMove", () => {
      const d = 칸.querySelector("#fxDraftText");
      const t = 칸.querySelector("#fxExpected");
      if (d && t) t.value = d.value;
    });

    누르면("fxSaveExp", async () => {
      try { await window.gijo.setAnswerFeedbackExpected(r.id, 값("fxExpected") || null); await 다시(); gijoTell("최종문을 저장했습니다."); }
      catch (e) { gijoTell("저장하지 못했습니다: " + ((e && e.message) || e)); }
    });

    // 자료 부족 — **대화창에 문장만 얹는다**(보내지 않는다). 화면이 직접 지시하지 않는다.
    누르면("fxToChat", () => {
      const 글 = "문서 올리기: 「" + String(r.question || "").slice(0, 80) + "」에 답할 사내 자료를 넣으려고 합니다. ";
      const msg = { type: "gijo:prefill", text: 글 };
      // ★ **보낼 곳이 있을 때만** 담았다고 말한다(2026-09-07 검토관 [낮음] — 가짜 성공 금지).
      //   ⚠ 정직하게: 셸이 정말 **받아 얹었는지**까지는 여기서 못 안다(단방향이다). 아는 것은
      //     「보낼 상대가 있었나」뿐이라, 없을 때 「얹었습니다」라고 하지 않는 데까지가 이 수리다.
      //   분리창(openShellPopout)에서는 window.top이 **자기 자신**이라 예외도 안 나고 메시지도
      //   안 닿는다 — 예전 코드는 catch에 「아래 안내가 말한다」고 적어 두고 그 안내를 안 만들어,
      //   담당자는 「얹었습니다」를 읽고 대화창에 가서 **빈 입력칸**을 봤다.
      //   길은 chatparts.js 문서열기신호()와 같다: 분리창=bridgeToShell(IPC) · 도킹=top으로 postMessage.
      let 얹음 = false;
      try {
        if (window.top !== window.self) { window.top.postMessage(msg, "*"); 얹음 = true; }
        else if (window.gijo && window.gijo.bridgeToShell) { window.gijo.bridgeToShell(msg); 얹음 = true; }
      } catch (e) { 얹음 = false; }
      gijoTell(얹음
        ? "대화창에 문장을 얹었습니다 — 뒷말을 채워 보내시면 됩니다."
        : "대화창에 얹지 못했습니다 — 이 창은 대화창과 이어져 있지 않습니다. 앱 대화창에서 「문서 올리기」로 시작해 주세요.");
    });

    누르면("fxResolve", async () => {
      const exp = 값("fxExpected").trim();
      try { await window.gijo.setAnswerFeedbackStatus(r.id, "resolved", exp || undefined); await 다시(); }
      catch (e) { gijoTell("닫지 못했습니다: " + ((e && e.message) || e)); }
    });
    누르면("fxPromote", async () => {
      try { await window.gijo.setAnswerFeedbackStatus(r.id, "promoted"); await 다시(); }
      catch (e) { gijoTell("편입하지 못했습니다: " + ((e && e.message) || e)); }
    });
    누르면("fxDismiss", async () => {
      try { await window.gijo.setAnswerFeedbackStatus(r.id, "dismissed"); await 다시(); }
      catch (e) { gijoTell("닫지 못했습니다: " + ((e && e.message) || e)); }
    });
  }

  // ── 고른 항목을 대화창에 알린다 (2026-08-18, 「조치 항목 → 대화창 카드」 시안 승인분) ──
  //
  // 왜: 이 화면은 대화창과 **완전히 끊겨** 있었다(gijo:select 호출 0건 — 전수조사 실측).
  //   그래서 항목을 골라도 대화창에 "이거 반려해줘"라고 못 했다. 법령·판례는 이미
  //   고르면 대화창이 답하는데(lawlookup.html) 조치 화면만 안 됐다.
  //
  // ⚠ 두 가지를 함께 보낸다 — 쓰임이 다르다.
  //   · text   — **서버로 가는 선택 맥락.** dispatcher.ts:1536에서 한 줄로 눌려 200자에서 잘린다.
  //              사람이 읽는 말로 적는다(모델이 「이거」를 풀 때 쓴다).
  //   · fields — **화면이 그릴 값.** 대화창 상태 패널·카드가 읽는다. 서버로 안 간다.
  //              ⚠ app.html이 **아는 키만** 골라 문자열로 강제해 넘긴다(iframe 값을 그대로 믿지 않는다).
  //
  // ⚠ 여기서 `keyOf(r)`(구분자 \0)를 실어 보내지 않는다 — 위 427행이 적어 둔 그대로
  //   **\0은 HTML/DOM을 오가며 유실**된다. 대상은 assetId·findingKey로 따로 싣는다.
  const 상태말 = { pending: "미검토", in_progress: "진행중", verifying: "검증 대기", rejected: "반려", approved: "완료" };
  function 대화창에알림(r) {
    const f = r.finding || {};
    const 상태 = 상태말[r.status] || r.status || "";
    const text = [
      `자산 ${r.assetName || r.assetId}`,
      f.finding_type,
      f.severity,
      상태,
      r.assignee ? `담당 ${r.assignee}` : "미배정",
      r.overdue ? "기한 초과" : "",
    ].filter(Boolean).join(" · ");
    const fields = {
      asset: r.assetName || r.assetId || "",
      title: f.finding_type || "",
      severity: f.severity || "",
      status: 상태,
      owner: r.assignee || "",
      due: r.dueDate || "",
      plain: f.plain || "",          // 취약점 한글 한 줄(전-7③) — 카드가 그대로 재사용한다
      kev: f.kev ? "KEV" : "",
      assetId: r.assetId || "",
      findingKey: r.findingKey || "",
    };
    // 전송 규격(top 한 겹·허용 키·200자 컷)은 공용 부품 selectnotify.js가 진다(2026-08-20 이관).
    if (window.gijoSelectNotify) window.gijoSelectNotify({ label: f.finding_type || r.assetName || "선택", text: text, fields: fields });
  }

  // ── 배관: 「지금 보여 주고 있는 목록」을 대화창에 알린다(2026-08-18) ─────────────
  //
  // ⚠ 위 대화창에알림(gijo:select)과 **하는 일이 다르다** — 헷갈리기 쉬운 자리다:
  //   · gijo:select = 사람이 **누른 한 건**. 📌 칩이 되고 「이거」가 그걸 가리킨다.
  //   · gijo:view   = 지금 **떠 있는 여러 건**. 화면엔 아무것도 안 그린다. 평소엔 아무 일도
  //     하지 않고, 조건이 뜻을 잃었을 때만(「이것들 전부 정요한한테 배정해줘」) 대상이 된다.
  //
  // ⚠ 왜 필요한가 — 실측으로 증명한 구멍(2026-08-18): 서버는 「이것들」이라는 조건을 받으면
  //   아무것도 못 좁혀 **전건**을 잡았다("이것들" 3건 = 전체 3건). 이제 조건이 뜻을 잃으면
  //   ⓐ 보던 목록이 있으면 그것을, ⓑ 없으면 되묻는다. 이 함수가 ⓐ를 가능하게 하는 자리다.
  //
  // ⚠ 50건 상한 — 넘으면 **아무것도 안 보낸다**(잘라 보내지 않는다). 잘린 절반을 「보던 것」이라
  //   부르며 처리하면 담당자는 전부 바뀐 줄 안다. 서버도 같은 상한으로 한 번 더 막는다.
  const 보는목록_상한 = 50;
  function 보는목록알림(rows) {
    let ids = null;
    if (Array.isArray(rows) && rows.length && rows.length <= 보는목록_상한) {
      // ⚠ keyOf(구분자 \0)를 쓰지 않는다 — \0은 DOM·postMessage를 오가며 유실된다(427행).
      //   서버가 읽는 신원은 "assetId::findingKey"다.
      ids = rows
        .filter((r) => r && r.assetId && r.findingKey)
        .map((r) => `${r.assetId}::${r.findingKey}`);
      if (!ids.length) ids = null;
    }
    try {
      window.top.postMessage(
        ids ? { type: "gijo:view", screen: "approvals.html", label: `검토 목록 ${ids.length}건`, ids } : { type: "gijo:view" },
        "*"
      );
    } catch (e) { /* 셸 밖(단독 열람)에서는 조용히 없던 일로 */ }
  }

  // 검증 결과 렌더 — 판정 배지 + 근거(명령·출력). 접기 가능하고 목록은 내부 스크롤.
  // ⚠ PASS여도 '완료'로 자동 확정하지 않는다 — 사람이 [완료 처리]를 눌러야 끝난다.
  const V_LABEL = { PASS: "조치확인", FAIL: "미조치", NA: "수동확인", WARN: "확인필요" };
  function renderVerifyResult(box, res) {
    if (!res.results || !res.results.length) {
      box.innerHTML = '<div style="font-size:12.25px;color:var(--muted-2);padding:8px 2px">' + esc(res.note || "검증할 항목이 없습니다.") + "</div>";
      return;
    }
    const s = res.summary;
    box.innerHTML = `<div class="vres" id="vresBox">
      <div class="vres-h" id="vresHead" title="클릭하면 접기/펼치기">🔍 조치 검증 결과 — ${esc(res.assetName || res.assetId)}
        <span style="font-weight:600;color:var(--muted-2)">대상 ${esc(res.target)}</span>
        <span style="margin-left:auto">
          <span class="vbadge v-PASS">조치확인 ${s.fixed}</span>
          <span class="vbadge v-FAIL">미조치 ${s.still}</span>
          <span class="vbadge v-NA">수동확인 ${s.manual}</span>
        </span></div>
      <div class="vres-b">${res.results.map((x) => `
        <div class="vrow">
          <span class="vbadge v-${esc(x.status)}">${esc(V_LABEL[x.status] || x.status)}</span>
          <div class="vmain"><div class="vt">${esc(x.title)}</div><div class="vev">${esc(x.evidence)}</div>
            ${(x.basis || []).map((b) => `<div class="vbasis"><b>${esc(b.label)}</b><span class="vb-src">📄 ${esc(b.documentId)}</span><div class="vb-ex">${esc(b.excerpt)}</div></div>`).join("")}
            ${x.hint ? `<div class="vhint">💡 ${esc(x.hint.need)}</div>` : ""}
          </div>
          ${x.status === "PASS" ? `<button class="btn done" data-vdone="${esc(x.findingKey)}">완료 처리</button>` : ""}
        </div>`).join("")}</div>
    </div>`;
    document.getElementById("vresHead").addEventListener("click", () =>
      document.getElementById("vresBox").classList.toggle("collapsed"));
    // 사람이 누르는 완료 확정 — 기계 판정만으로 상태를 끝내지 않는다.
    box.querySelectorAll("[data-vdone]").forEach((b) => b.addEventListener("click", async () => {
      b.disabled = true;
      try { await window.gijo.setFindingReview(res.assetId, b.dataset.vdone, { status: "approved" }); await loadReviews(); }
      catch (err) { gijoTell("완료 처리 실패: " + ((err && err.message) || err)); b.disabled = false; }
    }));
  }

  /** 상세 칸을 되찾는다 — 없으면 다시 만든다.
   *
   * ⚠ **실사고(2026-08-18 실화면 CDP로 잡음)**: 항목을 두 번째로 누르면 상세가 안 열렸다.
   *   TypeError: Cannot set properties of null (setting 'innerHTML') at renderDetail
   *   뿌리 — nav.js의 `gijo자세히아래로`가 #rvDetail을 **누른 줄 아래(목록 안)로 옮기는데**,
   *   다음 클릭에서 renderList()가 `list.innerHTML = …`(418행)로 목록을 통째로 다시 써
   *   **그 안에 들어가 있던 #rvDetail이 같이 지워졌다.** 두 기능이 서로를 깨뜨리고 있었다.
   *   (nav.js:981 주석도 "화면이 자세히 칸을 innerHTML로 다시 그린다"를 알고 있었지만,
   *    닫기 버튼 재생성만 막고 **칸 자체가 사라지는 경우**는 안 봤다.)
   *   ⇒ 없으면 원래 자리(.rv-wrap)에 다시 만들어 준다. 옮기기는 nav.js가 다음 클릭에 또 한다. */
  function 상세칸() {
    // ⚠ **id로만 찾지 않는다.** 새로 만들면 같은 id가 둘이 되어 `getElementById`가
    //   어느 것을 줄지 어긋난다 — 2026-08-18에 실제로 그렇게 만들어 놓고 잡았다
    //   (하나는 목록 안 옛것, 하나는 새것. 상세가 옛 내용에 멈춰 보였다).
    //   위 renderList의 구해 내기가 1차 방어이고, 이건 그래도 없을 때의 마지막 수단이다.
    let el = document.getElementById("rvDetail") || document.querySelector(".rv-detail");
    if (el) { el.id = "rvDetail"; return el; }
    const wrap = document.querySelector(".rv-wrap");
    if (!wrap) return null;
    el = document.createElement("div");
    el.className = "rv-detail";
    el.id = "rvDetail";
    wrap.appendChild(el);
    return el;
  }

  function renderDetail(r) {
    const f = r.finding;
    const a = esc(r.assetId), k = esc(r.findingKey);
    const flags = [f.kev ? '<span class="rv-kev">🚨 KEV</span>' : "", r.overdue ? `<span class="dt-over">⚠ 기한 초과</span>` : ""].filter(Boolean).join("");
    // ⚠ EPSS 표기 규칙은 서버 tone.ts의 epss표기가 단일 출처다(2026-09-11 검토관 적발).
    //   클라는 서버 코드를 못 불러 **규칙만 옮겨 적은 사본**이다 — 저쪽을 고치면 여기도 고친다.
    //   0.5% 미만을 「0%」로 적으면 값이 실재하는데 없다고 단정하게 된다(실제 스캐너 EPSS는
    //   대다수가 0.01 미만이라 이 꼴이 흔하다). 0~1 밖의 값은 뜻을 못 읽으므로 안 싣는다.
    //   ⚠ 위쪽도 같다(2026-09-12 B13 검토관 상): Math.round만 쓰면 0.995~1 미만이 「100%」가 돼
    //   「반드시 악용된다」로 읽힌다 — 0.995 이상 1 미만은 「99% 초과」, 정확히 1만 「100%」다.
    //   서버(tone.epss값표기)가 위쪽 경계를 받은 날 이 사본이 안 따라와 같은 취약점이 대화에선
    //   「99% 초과」, 이 화면에선 「100%」로 갈렸다 — 짝은 tone.test.ts 「클라 사본」 감시가 잰다.
    const epss칸 = (typeof f.epss === "number" && isFinite(f.epss) && f.epss >= 0 && f.epss <= 1)
      ? `EPSS ${f.epss > 0 && f.epss < 0.005 ? "1% 미만" : (f.epss >= 0.995 && f.epss < 1 ? "99% 초과" : Math.round(f.epss * 100) + "%")}`
      : "";
    const metaLine = [epss칸, f.vpr != null ? `VPR ${f.vpr}` : "", esc(f.source_tool)].filter(Boolean).join(" · ");

    // 배정 폼 — 반려/완료가 아닐 때만 편집 가능.
    // accepted도 제외 — 수용 건에 SLA 기한 입력칸이 열려 있으면 「수용인데 지연」 충돌을 키운다(검토관 하2).
    const editable = r.status !== "rejected" && r.status !== "accepted";
    // 로컬(KST) 달력 오늘 — toISOString(UTC)은 0~9시에 어제가 된다(검토관 중6).
    function 오늘로컬() { var t = new Date(); return new Date(t.getTime() - t.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
    const assignForm = editable ? `
      <div class="sec">
        <div class="sec-h">담당 배정</div>
        <div class="frow">
          <div class="field"><label>보안담당자 (감독·SLA 책임)</label><input class="inp" id="fOwner" value="${esc(r.securityOwner || "")}" placeholder="미배정" list="gijoUserList"></div>
          <div class="field"><label>실제 수행 담당자 (조치)</label><input class="inp" id="fAssignee" value="${esc(r.assignee || "")}" placeholder="미배정" list="gijoUserList"></div>
          <div class="field" style="max-width:170px"><label>조치 기한 (SLA)</label><input class="inp" type="date" id="fDue" value="${esc(r.dueDate || "")}"></div>
        </div>
        <div class="actions">
          <button class="btn primary" id="btnSaveAssign">저장</button>
          <button class="btn mail" id="btnMail"${r.assignee ? "" : " disabled title='실수행 담당자를 먼저 배정하세요'"}>✉ 배정 메일</button>
        </div>
      </div>` : "";

    // 상태별 진행 액션
    let stageActions = "";
    if (r.status === "pending") {
      stageActions = `<div class="actions"><button class="btn primary" data-set="in_progress">▶ 승인 · 조치 시작(진행중)</button><button class="btn reject" id="btnRejectOpen">🛡 반려 ▾</button></div>`;
    } else if (r.status === "in_progress") {
      stageActions = `<div class="actions"><button class="btn verify" data-set="verifying">🔁 조치 완료 → 검증 요청</button><button class="btn verify" id="btnVerifyRun">🔍 조치 검증 실행</button><button class="btn reject" id="btnRejectOpen">🛡 반려 ▾</button></div>
        <div id="verifyOut"></div>`;
    } else if (r.status === "verifying") {
      stageActions = `
        <div class="verify-box"><div class="h">🔁 검증(재스캔)</div>
          <p>${r.verifyRequestedBy ? `<b>${esc(r.verifyRequestedBy)}</b>이(가) ${fmtDate(r.verifyRequestedAt)} 조치 완료 보고. ` : ""}이 자산을 재스캔해 같은 취약점이 사라졌는지 확인합니다 — 사라지면 <b style="color:var(--teal)">완료</b>로 자동 확정, 여전히 검출되면 <b style="color:var(--red-ink, #f5928a)">재조치</b>로 되돌립니다.</p></div>
        <div class="actions"><button class="btn verify" id="btnVerifyRun">🔍 조치 검증 실행</button><button class="btn verify" id="btnRescan">🔁 지금 재스캔</button><button class="btn done" data-set="approved">✓ 해결 확인(수동 완료)</button><button class="btn" data-set="in_progress">↩ 진행중으로</button></div>
        <div id="verifyOut"></div>`;
    } else if (r.status === "approved") {
      stageActions = `<div class="actions"><button class="btn" data-set="in_progress">↩ 진행중으로 되돌리기</button></div>`;
    } else if (r.status === "rejected") {
      stageActions = `<div class="reject-note">🛡 <b>${esc(REJ_LABEL[r.rejectReason] || "반려")}</b>${r.note ? " — " + esc(r.note) : ""}<br><span style="color:var(--muted-2)">반려: ${esc(r.reviewedBy || "-")} · ${r.reviewedAt ? new Date(r.reviewedAt).toLocaleDateString("ko-KR") : ""}</span></div>
        <div class="actions" style="margin-top:10px"><button class="btn" data-set="pending">↩ 검토 재개</button></div>`;
    } else if (r.status === "accepted") {
      // 감사 대응이 목적인 판정 — 사유·기한·처리자를 화면에서 바로 읽을 수 있어야 한다(검토관 하2).
      const 만료됨 = r.acceptUntil && r.acceptUntil < 오늘로컬();
      stageActions = `<div class="reject-note">⚖ <b>위험수용${만료됨 ? " — ⚠기한 만료(재검토 대상)" : ""}</b>${r.note ? " — " + esc(r.note) : ""}<br>
        <span style="color:var(--muted-2)">기한 ${esc(r.acceptUntil || "-")} · 수용: ${esc(r.acceptedBy || r.reviewedBy || "-")} · ${r.reviewedAt ? new Date(r.reviewedAt).toLocaleDateString("ko-KR") : ""}</span></div>
        <div class="actions" style="margin-top:10px"><button class="btn primary" data-set="in_progress">▶ 조치 시작(수용 해제)</button><button class="btn" data-set="pending">↩ 검토 재개</button></div>`;
    }

    // 진행 이력 타임라인
    const tl = [];
    if (r.resolvedAt) tl.push(`<div class="tl now"><b>완료</b> — 재스캔 확인${r.gone ? "(취약점 사라짐)" : ""} <span class="when">${fmtDate(r.resolvedAt)}</span></div>`);
    if (r.verifyRequestedAt) tl.push(`<div class="tl"><b>검증 요청</b> — 조치 완료 보고 <span class="when">${esc(r.verifyRequestedBy || "")} · ${fmtDate(r.verifyRequestedAt)}</span></div>`);
    if (r.reviewedAt && r.status !== "rejected") tl.push(`<div class="tl"><b>${esc(ST_LABEL[r.status])}</b> — ${esc(r.reviewedBy || "-")} <span class="when">${fmtDate(r.reviewedAt)}</span></div>`);

    const 칸 = 상세칸();
    if (!칸) return;
    칸.innerHTML = `
      <div class="dt-top"><span class="st st-${r.status}">${esc(ST_LABEL[r.status])}</span>${flags}<span style="font-size:11.75px;color:var(--muted-2)">${metaLine}</span></div>
      <div class="dt-title">${esc(f.finding_type)}</div>
      <div class="dt-asset">${esc(r.assetName)}${r.gone ? " · (최신 스캔에 없음)" : ""}</div>
      ${f.plain ? `<div class="dt-plain">→ ${boldify(esc(f.plain))}</div>` : ""}
      <div class="dt-evid">${esc(f.evidence) || "(근거 없음)"}</div>
      ${assignForm}
      <div class="sec"><div class="sec-h">진행</div>${stageActions}
        <div class="reject-panel" id="rejectPanel" style="display:none">
          <div style="font-size:12.5px;font-weight:700;color:var(--text)">반려 사유 — 증거·승인자·날짜가 보존됩니다</div>
          <div class="rr-opt">
            <label><input type="radio" name="rr" value="false_positive" checked><div><b>오탐(false positive)</b><div class="desc">실제 취약점이 아님</div></div></label>
            <label><input type="radio" name="rr" value="compensating_control"><div><b>다른 보안으로 방어</b><div class="desc">보상통제로 위험 차단(내부망 격리·WAF 등)</div></div></label>
          </div>
          <input class="inp" id="rejectNote" placeholder="사유·근거를 적어주세요(권장)" style="margin-bottom:8px">
          <div class="actions"><button class="btn reject" id="btnRejectConfirm">반려 확정</button><button class="btn" id="btnRejectCancel">취소</button></div>
        </div>
      </div>
      ${tl.length ? `<div class="sec"><div class="sec-h">진행 이력</div><div class="timeline">${tl.join("")}</div></div>` : ""}`;

    wireDetail(r);
  }

  function wireDetail(r) {
    const a = r.assetId, k = r.findingKey;
    const $ = (id) => document.getElementById(id);
    // 상태 전이 버튼(data-set)
    document.querySelectorAll("#rvDetail [data-set]").forEach((b) => b.addEventListener("click", async () => {
      b.disabled = true;
      try { await window.gijo.setFindingReview(a, k, { status: b.dataset.set }); await loadReviews(); }
      catch (err) { gijoTell("처리 실패: " + ((err && err.message) || err)); b.disabled = false; }
    }));
    // 배정 저장
    if ($("btnSaveAssign")) $("btnSaveAssign").addEventListener("click", async () => {
      const patch = { securityOwner: $("fOwner").value, assignee: $("fAssignee").value, dueDate: $("fDue").value };
      $("btnSaveAssign").disabled = true;
      try { await window.gijo.setFindingReview(a, k, patch); await loadReviews(); }
      catch (err) { gijoTell("저장 실패: " + ((err && err.message) || err)); $("btnSaveAssign").disabled = false; }
    });
    // 메일
    if ($("btnMail")) $("btnMail").addEventListener("click", async () => {
      const btn = $("btnMail"); if (btn.disabled) return;
      // prompt()도 confirm처럼 렌더러를 통째로 멈추는 네이티브 모달이다(2026-07-29 검토) — 화면 안 입력으로.
      const to = await gijoPrompt("담당자에게 보낼 이메일 주소:", { placeholder: "예: hong@company.co.kr", ok: "보내기" }); if (!to) return;
      btn.disabled = true; const orig = btn.textContent; btn.textContent = "보내는 중…";
      try { await window.gijo.notifyAssignee(a, k, to.trim()); btn.textContent = "✓ 발송됨"; setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 2500); }
      catch (err) { gijoTell("메일 발송 실패: " + ((err && err.message) || err)); btn.textContent = orig; btn.disabled = false; }
    });
    // 조치 검증 — 대상에 접속해 "정말 고쳐졌는지" 읽기 전용으로 확인한다(스캐너가 아니다).
    // 판정(PASS/FAIL/NA)과 함께 **실행한 명령·출력**을 그대로 보여준다 — 근거 없이는 못 믿는다.
    if ($("btnVerifyRun")) $("btnVerifyRun").addEventListener("click", async () => {
      const btn = $("btnVerifyRun"); const out = $("verifyOut");
      btn.disabled = true; const orig = btn.textContent; btn.textContent = "검증 중…";
      out.innerHTML = '<div style="font-size:12.25px;color:var(--muted-2);padding:8px 2px">대상에 접속해 확인하는 중…</div>';
      try {
        const res = await window.gijo.runVerify(a, k);
        renderVerifyResult(out, res);
        await loadReviews(); // PASS 건은 서버가 '검증 대기'로 올려둔다 — 목록 갱신
      } catch (err) {
        // 권한 거부(403)·대상 미등록(400)은 잘못이 아니라 안내다 — 다음에 뭘 할지 그대로 보여준다.
        const msg = (err && err.message) || String(err);
        const clean = msg.replace(/^GIJO AS 서버 오류 \d+ \S+ /, "").replace(/^\{"error":"?/, "").replace(/"?\}$/, "").replace(/\\n/g, "\n");
        out.innerHTML = '<div class="verify-deny">⛔ ' + esc(clean) + "</div>";
      } finally { btn.textContent = orig; btn.disabled = false; }
    });
    // 재스캔 — 실제로 자산을 재스캔한 뒤 목록 갱신(사라졌으면 서버가 완료로 자동 확정).
    if ($("btnRescan")) $("btnRescan").addEventListener("click", async () => {
      const btn = $("btnRescan"); btn.disabled = true; const orig = btn.textContent; btn.textContent = "재스캔 중…";
      try { await window.gijo.scanAsset(a); await loadReviews(); }
      catch (err) { gijoTell("재스캔 실패: " + ((err && err.message) || err)); btn.textContent = orig; btn.disabled = false; }
    });
    // 반려 패널 열기/확정/취소
    if ($("btnRejectOpen")) $("btnRejectOpen").addEventListener("click", () => { $("rejectPanel").style.display = "block"; });
    if ($("btnRejectCancel")) $("btnRejectCancel").addEventListener("click", () => { $("rejectPanel").style.display = "none"; });
    if ($("btnRejectConfirm")) $("btnRejectConfirm").addEventListener("click", async () => {
      const reason = (document.querySelector('#rvDetail input[name=rr]:checked') || {}).value || "false_positive";
      const note = $("rejectNote").value;
      $("btnRejectConfirm").disabled = true;
      try { await window.gijo.setFindingReview(a, k, { status: "rejected", rejectReason: reason, note }); await loadReviews(); }
      catch (err) { gijoTell("반려 실패: " + ((err && err.message) || err)); $("btnRejectConfirm").disabled = false; }
    });
  }

  async function loadUserSuggestions() {
    // 담당자 자동완성 — 내부 계정(개발자·시스템 담당자 포함) 중에서 고를 수 있어야 한다.
    // 예전엔 관리자 전용 /api/users를 썼는데, 이 화면을 쓰는 security_officer 계정은 403을 받아
    // 자동완성이 조용히 비어 있었다(2026-07-22 사용자 지적 — 실질적으로 순수 자유입력만 됐음).
    // /api/users/assignable은 인증만 되면 누구나 조회 가능(최소 정보만) — 이걸로 교체.
    try {
      const users = await window.gijo.listAssignableUsers();
      document.getElementById("gijoUserList").innerHTML = (users || [])
        .map((u) => `<option value="${esc(u.displayName)}">`).join("");
    } catch (e) {}
  }

  // 좁히기 띠를 다시 그린다. 좁혀진 줄 모르면 "왜 몇 건밖에 없지?"가 된다.
  function renderScope() {
    const bar = document.getElementById("rvScope");
    if (!bar) return;
    // ★ 이 띠는 **취약점 원장의 말**이다("…의 취약점만 보는 중"). 답 지적 목록 위에 세우면
    //   자산과 무관한 줄들을 자산으로 좁힌 것처럼 가리킨다(2026-09-07 검토관 [중간]).
    //   ⚠ 판정은 **여기 한 곳**이다 — setSeg에서 또 숨기면 표시 자리가 둘이 되고, 그때부터
    //     한쪽만 고치는 반쪽 수리가 난다(이 화면이 catch/renderList로 이미 겪은 부류).
    if (!scopeAsset || segMode !== "vuln") { bar.style.display = "none"; return; }
    const one = allReviews.find((r) => r.assetId === scopeAsset);
    const 이름 = one ? one.assetName : scopeAsset;
    const n = allReviews.filter((r) => r.assetId === scopeAsset).length;
    document.getElementById("rvScopeText").innerHTML =
      `🎯 <b>${esc(이름)}</b> 의 취약점만 보는 중 — ${n}건`;
    bar.style.display = "flex";
  }
  function clearScope() {
    scopeAsset = null;
    renderScope();
    loadReviews(false);
  }

  async function init() {
    // 다른 화면에서 "이 건"을 눌러 들어왔는가 — ?asset=<자산id>&finding=<키>
    // (2026-07-31: 취약점 화면에서 한 건을 눌렀는데 전체 목록이 열리던 것을 고침)
    try {
      const q = new URLSearchParams(location.search);
      scopeAsset = q.get("asset") || null;
      const wantKey = q.get("finding");
      if (wantKey && scopeAsset) currentKey = `${scopeAsset}\0${wantKey}`;
    } catch (e) { /* 주소가 이상해도 화면은 떠야 한다 */ }
    // 자산으로 좁혀 들어왔으면 상태 칩은 '전체'로 둔다 — 그 자산의 조치완료·반려까지 다 보여야
    // "이 호스트 상황"이 한눈에 들어온다(조치대상만 보이면 왜 몇 건뿐인지 또 헷갈린다).
    if (scopeAsset) {
      rvFilter = "all";
      document.querySelectorAll("#rvFilt .fchip").forEach((c) => c.classList.remove("on"));
    }
    // ✅ ?status= — ④ 검증 허브의 「검증 대기」 판이 이 주소로 연다(2026-09-02 F4-05).
    //   ⚠ **기존 진입을 안 깬다**: status가 없으면 아무것도 안 바꾼다(기본 칩이 그대로 산다).
    //   ⚠ **우선순위**: `?asset=`이 함께 오면 asset이 이긴다 — 「이 건을 눌러 들어왔다」가 더 구체적이고,
    //     asset 진입은 그 자산의 **전체 상황**을 보여야 해서 상태로 또 좁히면 왜 몇 건뿐인지 헷갈린다
    //     (바로 아래 「자산으로 좁혀 들어왔으면 전체로 둔다」와 같은 이유).
    //   ⚠ **화면에 실제로 있는 칩만** 받는다 — 없는 값을 넣으면 칩이 하나도 안 켜진 채 목록만
    //     조용히 비어, 담당자는 「건이 없다」로 읽는다(있는데 안 보이는 것이 더 나쁘다).
    try {
      const 상태 = new URLSearchParams(location.search).get("status");
      const 칩들 = [...document.querySelectorAll("#rvFilt .fchip")];
      const 아는것 = 칩들.map(function (c) { return c.dataset.f; });
      if (!scopeAsset && 상태 && 아는것.indexOf(상태) >= 0) {
        rvFilter = 상태;
        칩들.forEach(function (c) { c.classList.toggle("on", c.dataset.f === 상태); });
      }
    } catch (e) { /* 주소가 이상해도 화면은 떠야 한다 */ }

    // 💬 ?fix= — 대화창 꼬리의 「결재판 열기」·감독 화면의 「결재판에서 처리」가 이 주소로 연다
    //   (2026-09-07). ?status=와 **같은 꼴**이다: 없으면 아무것도 안 바꾸고, 화면에 실제로 있는
    //   값만 받는다. `open`은 「전체(갈래 안 좁힘)」라는 뜻으로만 쓴다 — 없는 칩을 켜지 않는다.
    //   ⚠ nav.js의 TAB_REDIRECT는 쿼리가 붙어 있으면 흡수하지 않는다(?asset= 딥링크의 선례).
    let 지적모드로 = false;
    try {
      const fx = new URLSearchParams(location.search).get("fix");
      const 아는갈래 = [...document.querySelectorAll("#fixFilt .fchip")].map((c) => c.dataset.fx);
      if (fx) {
        지적모드로 = true;
        if (아는갈래.indexOf(fx) >= 0) {
          fixFilter = fx;
          document.querySelectorAll("#fixFilt .fchip").forEach((c) => c.classList.toggle("on", c.dataset.fx === fx));
        }
      }
    } catch (e) { /* 주소가 이상해도 화면은 떠야 한다 */ }

    // 세그먼트 — 두 원장을 오간다. 답 지적은 목록을 따로 불러온다(창구도 다르다).
    document.getElementById("rvSeg").addEventListener("click", (e) => {
      const b = e.target.closest(".seg");
      if (b) setSeg(b.dataset.seg);
    });
    // 갈래 칩 — 같은 칩을 다시 누르면 전체로 돌아온다(칩 4개를 그대로 두려는 절충).
    document.getElementById("fixFilt").addEventListener("click", (e) => {
      const chip = e.target.closest(".fchip");
      if (!chip) return;
      fixFilter = fixFilter === chip.dataset.fx ? null : chip.dataset.fx;
      document.querySelectorAll("#fixFilt .fchip").forEach((c) => c.classList.toggle("on", c.dataset.fx === fixFilter));
      renderFixList();
    });
    loadFix().then(() => { if (지적모드로) setSeg("fix"); });

    // 🗂 지금 범위(2026-08-18 승인 시안) — 이 화면은 자산 좁히기가 **이미 있다**(scopeAsset).
    // 쿼리(?asset=)로만 받던 것을 범위와도 잇는다. 새 장치를 만들지 않는다.
    // ⚠ 쿼리로 들어온 값이 **먼저다** — 담당자가 「이 건」을 눌러 들어온 것이라 더 구체적이다.
    if (!scopeAsset && window.gijoScope && window.gijoScope.assetId()) {
      scopeAsset = window.gijoScope.assetId();
      rvFilter = "all";
      document.querySelectorAll("#rvFilt .fchip").forEach((c) => c.classList.remove("on"));
    }
    loadReviews().then(renderScope);
    // 범위가 바뀌면 따라간다. 쿼리로 들어온 경우엔 그대로 둔다(위와 같은 이유).
    if (window.gijoScope) {
      const 쿼리로왔나 = !!new URLSearchParams(location.search).get("asset");
      if (!쿼리로왔나) window.gijoScope.onChange((sc) => {
        const 새것 = sc && sc.kind === "asset" ? sc.id : null;
        if (새것 === scopeAsset) return;
        scopeAsset = 새것;
        renderList();
        renderScope();
      });
    }
    document.getElementById("rvScopeAll").addEventListener("click", clearScope);
    loadUserSuggestions();
    // 상태 필터 — 클릭하면 그 상태만 목록에 보여준다(선택된 상세는 유지).
    document.getElementById("rvFilt").addEventListener("click", (e) => {
      const chip = e.target.closest(".fchip");
      if (!chip) return;
      rvFilter = chip.dataset.f;
      document.querySelectorAll("#rvFilt .fchip").forEach((c) => c.classList.toggle("on", c === chip));
      renderList();
    });
    // VEX — 내보내기 전에 "지금 어떤 상태로 나가는지"를 먼저 보여준다.
    const VEX_LABEL = { under_investigation: ["조사중", "vc-under"], affected: ["영향있음", "vc-aff"], fixed: ["조치됨", "vc-fix"], not_affected: ["영향없음", "vc-not"] };
    async function loadVexSummary() {
      const box = document.getElementById("vexChips");
      try {
        const s = await window.gijo.vexSummary();
        const parts = Object.entries(VEX_LABEL).map(([k, [lb, cls]]) =>
          `<span class="vc ${cls}">${lb} ${s.byState?.[k] ?? 0}</span>`);
        // CVE 번호가 없는 건은 VEX에 담기지 않는다 — 왜 개수가 다른지 그 자리에서 알려준다.
        if (s.withoutCve > 0) parts.push(`<span class="muted-s">· CVE 없어 제외 ${s.withoutCve}건</span>`);
        box.innerHTML = parts.join("");
      } catch (e) { box.innerHTML = '<span class="muted-s">집계를 불러오지 못했습니다</span>'; }
    }
    window.gijoRefreshVex = loadVexSummary; // 목록이 갱신되면 칩도 다시 센다
    loadVexSummary();
    // 저장 결과를 화면에 남긴다 — "받았다는데 어디 있지?"가 되지 않게 경로와 [폴더 열기]를 준다.
    // (Electron은 저장 경로를 정해줘야 파일이 실제로 생긴다 — main.ts will-download)
    if (window.gijo.onDownloadDone) {
      window.gijo.onDownloadDone((info) => {
        const box = document.getElementById("vexChips");
        const btn = document.getElementById("btnVexExport");
        if (btn) { btn.textContent = "⬇ 파일 받기"; btn.disabled = false; }
        if (!box) return;
        if (info.ok) {
          box.innerHTML = `<span class="muted-s">✓ 저장됨: ${esc(info.filename)}</span>` +
            ` <span class="muted-s" id="vexReveal" style="cursor:pointer;text-decoration:underline">폴더 열기</span>`;
          const rv = document.getElementById("vexReveal");
          if (rv) rv.addEventListener("click", () => window.gijo.revealDownload(info.path));
          setTimeout(loadVexSummary, 6000); // 잠시 뒤 원래 칩으로
        } else {
          box.innerHTML = `<span class="muted-s" style="color:var(--red-ink, #f5928a)">저장 실패(${esc(info.state)})</span>`;
        }
      });
    }
    document.getElementById("btnVexExport").addEventListener("click", async () => {
      const btn = document.getElementById("btnVexExport");
      btn.disabled = true; const orig = btn.textContent; btn.textContent = "만드는 중…";
      try {
        const doc = await window.gijo.vexExport();
        const blob = new Blob([JSON.stringify(doc, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `gijo-vex-${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 8000);
        btn.textContent = "저장 중…"; // 실제 완료는 download:done이 알려준다
      } catch (e) {
        gijoTell("VEX 내보내기 실패: " + ((e && e.message) || e));
        btn.textContent = orig; btn.disabled = false;
      }
    });

    // ⚠ 옛 「미배정 카드 클릭」 배선을 걷었다(2026-08-21) — 카드 7장이 없어졌고,
    //   미배정 알약(#rvFilt [data-f=unassigned])이 같은 일을 이미 한다(:850 알약 배선).
    //   껍데기만 지우고 배선을 남기면 아무 요소도 못 잡는 죽은 코드가 된다.
    // 일괄 배정 — 한 건씩 배정은 건수가 늘면 현실적이지 않다.
    document.getElementById("btnBulkClear").addEventListener("click", () => { selected.clear(); renderList(); });
    document.getElementById("btnBulkAssign").addEventListener("click", async () => {
      const assignee = document.getElementById("bulkAssignee").value.trim();
      const dueDate = document.getElementById("bulkDue").value;
      if (!assignee && !dueDate) { gijoTell("담당자나 기한 중 하나는 입력하세요."); return; }
      const btn = document.getElementById("btnBulkAssign");
      btn.disabled = true; const orig = btn.textContent; btn.textContent = "배정 중…";
      const patch = { ...(assignee ? { assignee } : {}), ...(dueDate ? { dueDate } : {}) };
      let ok = 0; const fails = [];
      for (const key of Array.from(selected)) {
        const [aid, fkey] = key.split("\0");
        try { await window.gijo.setFindingReview(aid, fkey, patch); ok++; }
        catch (e) { fails.push((e && e.message) || String(e)); }
      }
      selected.clear();
      btn.textContent = orig; btn.disabled = false;
      await loadReviews();
      if (fails.length) gijoTell(`${ok}건 배정 완료 · ${fails.length}건 실패\n${fails[0]}`);
    });
    document.querySelectorAll("[data-page]").forEach((el) => {
      el.addEventListener("click", () => (window.gijoOpenScreen ? window.gijoOpenScreen(el.dataset.page) : window.gijo.navigateTo(el.dataset.page)));
    });
  }

  if (!window.gijo.isAuthenticated()) {
    window.gijo.navigateTo("login.html");
  } else {
    init();
  }

  // 오른쪽 자세히를 **누른 줄 바로 아래**로 (2026-08-02 사용자 지시, 본은 컴플라이언스 화면).
  // 목록이 가로를 다 쓰게 되어 이름이 잘리지 않고, 누른 줄과 내용이 붙어 있다.
  // ⚠ 목록을 다시 그리는 화면이라 **늦게** 건다 — 요소가 없으면 조용히 넘어간다.
  (function 줄아래자세히() {
    let 남은시도 = 20;
    const 걸기 = () => {
      if (typeof window.gijo자세히아래로 !== "function") return void (남은시도-- > 0 && setTimeout(걸기, 300));
      const 됐나 = window.gijo자세히아래로({
        칸: ".rv-wrap", 목록: "#rvList", 자세히: "#rvDetail",
      });
      if (!됐나 && 남은시도-- > 0) setTimeout(걸기, 300);
    };
    걸기();
  })();
</script>
