<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIJO AS — 컴플라이언스</title>
<style>
:root{
  --bg:#262624;--panel:#30302e;--panel-2:#1f1e1d;--border:rgba(255,255,255,0.08);
  --border-strong:rgba(255,255,255,0.16);--blue:#3b82f6;--blue-light:#5fa1ff;--white:#ffffff;
  --text:#e9e7e2;--muted:#b3ada4;--muted-2:#a49d95;--red:#e2483d;--amber:#f0a020;--teal:#1eb980;--purple:#8b7cf0;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Pretendard","Malgun Gothic","Segoe UI",sans-serif;background:var(--bg);color:var(--text);}
.app{display:grid;grid-template-columns:220px 1fr;}
.sidebar{padding:22px 14px;border-right:1px solid var(--border);min-height:900px;}
.nav-section{font-size:12px;font-weight:700;color:var(--muted-2);letter-spacing:1.2px;margin:18px 10px 8px;}
.nav-section:first-child{margin-top:0;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;margin-bottom:2px;}
.nav-item .ic{width:18px;text-align:center;font-size:14px;}
.nav-item.active{background:rgba(59,130,246,0.12);color:var(--white);box-shadow:inset 3px 0 0 var(--blue);cursor:default;}
.nav-item:hover:not(.active){background:rgba(255,255,255,0.04);color:var(--white);}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:11.75px;font-weight:800;padding:1px 6px;border-radius:20px;}
.main{padding:28px 32px 48px;}
.topbar-row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;}
.page-title{font-size:21px;font-weight:800;color:var(--text-strong, #fff);}
.page-sub{font-size:12.5px;color:var(--muted);margin-top:4px;}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px;}
.panel-title{font-size:14.5px;font-weight:800;color:var(--text-strong, #fff);margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;}
.panel-sub{font-size:12.5px;color:var(--muted);margin-bottom:14px;}
.badge{display:inline-block;padding:3px 10px;border-radius:6px;font-size:12.25px;font-weight:700;}
.b-amber{background:rgba(240,160,32,0.15);color:var(--amber);}
.footer{margin-top:8px;padding:18px 0 0;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted-2);}
.footer img{height:16px;opacity:0.6;}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--panel-2);}
.header-left{display:flex;align-items:center;gap:12px;}
.header-left img{height:22px;}
.app-title{font-size:15px;font-weight:800;color:var(--text-strong, #fff);}
.clock{font-size:12px;color:var(--blue-light);font-weight:600;}
.header-right{display:flex;align-items:center;gap:10px;}
.status-pill{display:flex;align-items:center;gap:6px;background:rgba(30,185,128,0.15);border:1px solid rgba(30,185,128,0.4);color:var(--teal);padding:6px 14px;border-radius:20px;font-size:12px;font-weight:800;}
.status-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);}
.beta-tag{background:var(--teal);color:var(--fill-contrast,#06281c);font-size:11.25px;font-weight:800;padding:1px 6px;border-radius:4px;margin-left:2px;}
.avatar-btn{width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;}
.icon-btn{width:32px;height:32px;border-radius:8px;background:var(--panel);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted);cursor:pointer;}
.ai-draft-btn{width:100%;margin-top:6px;background:var(--panel);border:1px solid var(--border-strong);color:var(--blue-light);border-radius:6px;padding:5px 8px;font-size:12.25px;font-weight:700;cursor:pointer;}
.ai-draft-btn:hover{border-color:var(--blue);}
.ai-draft-btn:disabled{opacity:0.6;cursor:default;}
  /* 요약 막대 — 규제 대응 현황이라 파랑 계열(위험 경고가 아니다). */
  /* 위험 갈래 접기 — 제목 줄만 남기고 접는다. 접혀도 미대응 건수는 보인다. */
  .cat-head{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none;margin-bottom:6px;}
  .cat-head .car{font-size:11px;color:var(--muted-2);width:11px;flex:0 0 auto;}
  .cat-head .nm{font-size:13.5px;font-weight:800;color:var(--text-strong, #fff);}
  .cat-head .cnt{font-size:12.25px;font-weight:600;color:var(--muted-2);}
  .cat-head .hot{font-size:11px;font-weight:800;padding:2px 8px;border-radius:20px;
    background:rgba(226,72,61,.16);color:var(--red, #f5928a);margin-left:auto;}
  .cat-head:hover .nm{color:var(--blue-light);}
</style>
<script src="viz.js"></script>
</head>
<body>

<!-- 상단 바는 공용이다 — titlebar.js가 그린다(분리창=공용 헤더, 탭 안=셸 탭줄). 화면마다 두던 사본 23개를 지웠다(2026-08-07). -->

<div class="app">
  <div class="sidebar" id="gijoNav"></div>

  <div class="main">
    <div class="topbar-row">
      <div>
        <div class="page-title">컴플라이언스</div>
      </div>
    </div>

    <div id="gijoChatWidget" data-prompts='["미이행 항목 뭐 있어?"]' style="max-width:640px;margin-bottom:16px;"></div>

    <!-- ⚠ 큰 카드 5장이 세로 80px을 먹고 있었다(2026-08-02 사용자 지시 "카드형 간단하게").
         숫자 다섯 개는 한 줄이면 충분하다 — 통합 관제·작업 내역과 같은 꼴로 맞춘다.
         id는 그대로 둔다: 채우는 코드가 이 이름으로 찾는다. -->
    <!-- ⚠ 요약 상자를 걷었다(2026-08-21 밀도 — 설계관 원천 대조). 아래 그림띠의 막대(누르면
         거른다)+도넛이 같은 4값을 이미 그렸고, 대응률은 도넛의 식과 완전히 같았다. 같은 숫자를
         두 곳에 그리면 어긋난다(승인 화면과 같은 수리). 총 건수는 그림띠 제목으로 옮겼다. -->

    <!-- 그림 먼저(전-7 ①) — 요약 띠에서 시작해 누르면 아래 목록이 그것만 남는다(overview-first drill-down).
         숫자는 아래 목록과 **같은 catalog 배열**에서 나온다 — 따로 세면 반드시 어긋난다. -->
    <div id="vizStrip"></div>
    <div id="vizFilter" style="display:none"></div>

    <div id="catalog"><div style="color:var(--muted)">불러오는 중...</div></div>

    <div class="footer">
      <img src="gijo-symbol.svg" alt="GIJO">
      <span>© 2026 GIJO Technology · GIJO AS Platform · Confidential</span>
    </div>
  </div>
</div>

<script>


  const STATUS_OPTS = [
    { v: "open", label: "미대응", color: "#f5928a" },
    { v: "partial", label: "부분 대응", color: "var(--amber)" },
    { v: "covered", label: "대응 완료", color: "var(--teal)" },
    { v: "na", label: "해당 없음", color: "var(--muted)" },
  ];
  const AREA_LABEL = { model: "모델", dataset: "데이터", prompt: "프롬프트", agentTool: "에이전트 도구", infrastructure: "인프라" };
  const CATEGORY_ORDER = ["data", "model", "agent", "supplychain", "highperf"];

  let catalog = [];
  // 접은 갈래만 기억한다 — **기본은 펼침**(2026-08-02 원칙). 이 PC에만 저장한다.
  const 접기키 = "gijo:compliance:closed";
  let 접힌갈래 = new Set();
  try { 접힌갈래 = new Set(JSON.parse(localStorage.getItem(접기키) || "[]")); } catch (e) {}
  const 접기저장 = () => { try { localStorage.setItem(접기키, JSON.stringify([...접힌갈래])); } catch (e) {} };

  function esc(s) { return String(s == null ? "" : s).replace(/</g, "&lt;"); }

  function fwBadges(items, cls) {
    return (items || []).map((x) => `<span style="display:inline-block;background:${cls};border-radius:4px;padding:1px 6px;font-size:11.75px;margin:1px 2px 1px 0;">${esc(x)}</span>`).join("");
  }

  const expanded = new Set();

  function critList(text) {
    // "• a • b" → 항목별 줄
    return String(text || "").split("•").map((s) => s.trim()).filter(Boolean)
      .map((s) => `<div style="padding:2px 0 2px 12px;text-indent:-8px;">· ${esc(s)}</div>`).join("") || '<div style="color:var(--muted-2)">기준 없음</div>';
  }

  function criteriaPanel(t) {
    const c = t.criteria || {};
    return `<div style="margin-top:10px;padding:12px 14px;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;font-size:12.5px;line-height:1.7;">
      <div style="color:var(--muted-2);font-weight:700;margin-bottom:3px;">영향</div>
      <div style="color:var(--text);margin-bottom:10px;">${critList(c.impact)}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div>
          <div style="color:var(--teal);font-weight:800;margin-bottom:3px;">✓ 양호 판정 기준</div>
          <div style="color:var(--text);">${critList(c.good)}</div>
        </div>
        <div>
          <div style="color:#f5928a;font-weight:800;margin-bottom:3px;">✕ 취약 판정 기준</div>
          <div style="color:var(--text);">${critList(c.weak)}</div>
        </div>
      </div>
      ${c.diagnosis ? `<div style="margin-top:10px;border-top:1px solid var(--border);padding-top:8px;"><div style="color:var(--blue-light);font-weight:800;margin-bottom:3px;">🔍 진단 방법 · 공격 예시</div><div style="color:var(--muted);white-space:pre-wrap;">${esc(c.diagnosis)}</div></div>` : ""}
      <div style="color:var(--muted-2);margin-top:10px;font-size:12px;">출처: KISA 「AI 보안 위협 대응 매뉴얼」(2026.7) 별첨2. 위 기준·진단 방법에 자사 환경을 대조해 대응 상태를 정하세요.</div>
    </div>`;
  }

  function threatRow(t) {
    const areas = t.aibomAreas.map((a) => `<span style="background:rgba(59,130,246,0.15);color:var(--blue-light);border-radius:4px;padding:1px 6px;font-size:11.75px;margin-right:3px;">${AREA_LABEL[a] || a}</span>`).join("");
    const opts = STATUS_OPTS.map((o) => `<option value="${o.v}" ${t.status === o.v ? "selected" : ""}>${o.label}</option>`).join("");
    const isOpen = expanded.has(t.code);
    return `<div class="cpl-row" style="border-bottom:1px solid var(--border);padding:12px 0;display:grid;grid-template-columns:64px 1fr 150px;gap:12px;align-items:start;">
      <div><span data-toggle="${t.code}" style="font-weight:800;color:var(--text-strong, #fff);font-size:13px;cursor:pointer;user-select:none;">${isOpen ? "▾" : "▸"} ${t.code}</span></div>
      <div>
        <div data-toggle="${t.code}" style="font-weight:700;color:var(--text-strong, #fff);font-size:13px;margin-bottom:4px;cursor:pointer;">${esc(t.name)} ${areas}</div>
        <div style="font-size:12.25px;color:var(--muted);line-height:1.9;">
          ${t.owasp.length ? `<b style="color:var(--muted-2)">OWASP</b> ${fwBadges(t.owasp, "rgba(139,124,240,0.15)")}` : ""}
          ${t.nist.length ? `<b style="color:var(--muted-2)">NIST</b> ${fwBadges(t.nist, "rgba(30,185,128,0.13)")}` : ""}
          ${t.mitre.length ? `<b style="color:var(--muted-2)">MITRE</b> ${fwBadges(t.mitre, "rgba(240,160,32,0.13)")}` : ""}
          ${!t.owasp.length && !t.nist.length && !t.mitre.length ? '<span style="color:var(--muted-2)">매핑된 국제 프레임워크 없음 (KISA 자체 분류)</span>' : ""}
        </div>
        ${isOpen ? criteriaPanel(t) : ""}
        <input data-note="${t.code}" value="${esc(t.note)}" placeholder="대응 근거·메모 (선택)"
          style="width:100%;margin-top:6px;background:var(--panel-2);border:1px solid var(--border);border-radius:6px;padding:5px 8px;color:var(--text);font-size:12.5px;outline:none;">
      </div>
      <div><select data-status="${t.code}" style="width:100%;background:var(--panel-2);border:1px solid var(--border-strong);border-radius:6px;padding:7px 8px;color:var(--text);font-size:12px;outline:none;cursor:pointer;">${opts}</select>
        <button data-draft="${t.code}" class="ai-draft-btn" title="AI가 양호/취약 기준과 우리 자산 현황으로 대응 상태 초안을 제안합니다">🤖 AI 초안</button>
      </div>
    </div>`;
  }

  // 그림에서 고른 상태(전-7 ①). null이면 전체 — 목록은 **사라지지 않고** 걸러질 뿐이다.
  let 상태필터 = null;
  const 상태한글 = { covered: "대응완료", partial: "부분", open: "미대응", na: "해당없음" };

  // 필터 띠 — 목록 단위(항목)로만 적는다. ⚠ 해제할 때 띠도 함께 지운다(안 지우면 "아직 걸러져
  // 있다"고 계속 말한다 — 2026-08-05 검토 지적).
  function 필터띠() {
    if (!window.gijoViz) return;
    const el = document.getElementById("vizFilter");
    if (!상태필터) { window.gijoViz.filterBar(el, null, null); return; }
    const 보임 = catalog.filter((t) => t.status === 상태필터).length;
    window.gijoViz.filterBar(el, { label: 상태한글[상태필터] || 상태필터, 보임, 전체: catalog.length, 단위: "항목" },
      () => { 상태필터 = null; render(); });
  }

  /**
   * 요약 그림 띠 — 상태 분포 막대 + 이행률 도넛.
   * ⚠ 숫자는 render()가 이미 센 값을 그대로 받는다. 여기서 다시 세면 목록과 어긋난다
   *   (지도에서 배운 것 — 같은 뜻의 숫자는 한 곳에서만 만든다).
   */
  function 그림띠(covered, partial, open, applicable) {
    const 자리 = document.getElementById("vizStrip");
    if (!자리 || !window.gijoViz) return;
    const na = catalog.length - applicable;
    window.gijoViz.mount(자리, {
      title: "한눈에 — KISA 위협 " + catalog.length + "건",
      hint: "누르면 목록이 좁혀집니다",
      parts: [
        {
          kind: "bars",
          segments: [
            { key: "covered", label: "대응완료", value: covered, color: "covered" },
            { key: "partial", label: "부분", value: partial, color: "partial" },
            { key: "open", label: "미대응", value: open, color: "open" },
            { key: "na", label: "해당없음", value: na, color: "na" },
          ],
          onPick: (key) => { 상태필터 = key; render(); },
        },
        { kind: "donut", value: covered, total: applicable, label: "이행률(해당분)" },
      ],
    });
    필터띠();   // 다시 그릴 때마다 띠 숫자도 새로 낸다(해제했는데 띠가 남아 있던 것을 고침)
    // 다시 그린 뒤에도 고른 조각이 눌린 채로 보이게 한다(누르면 목록이 바뀌는데 그림이 초기화되면 혼란).
    if (상태필터) {
      const b = 자리.querySelector('.gviz-bar[data-key="' + 상태필터 + '"]');
      if (b) b.classList.add("on");
    }
  }

  function render() {
    const covered = catalog.filter((t) => t.status === "covered").length;
    const partial = catalog.filter((t) => t.status === "partial").length;
    const open = catalog.filter((t) => t.status === "open").length;
    const applicable = catalog.filter((t) => t.status !== "na").length;

    그림띠(covered, partial, open, applicable);

    const cats = document.getElementById("catalog");
    cats.innerHTML = CATEGORY_ORDER.map((cat) => {
      const 갈래전체 = catalog.filter((t) => t.category === cat);
      const items = 갈래전체.filter((t) => !상태필터 || t.status === 상태필터);
      if (items.length === 0) return "";
      // 제목 줄을 눌러 갈래를 접었다 편다(2026-08-02 사용자 지시).
      // ⚠ 접혀도 **미대응 건수**는 남긴다 — 숫자 없이 접으면 "안에 뭐가 있는지 모르는 서랍"이 된다.
      // ⚠ 미대응은 **갈래 전체**로 센다(2026-08-05 검토 지적). 걸러진 목록으로 세면
      //   「대응완료」만 보는 순간 빨간 배지가 전부 사라져 미대응이 없는 것처럼 보인다.
      const 접힘 = 접힌갈래.has(cat);
      const 미대응 = 갈래전체.filter((t) => t.status === "open").length;
      return `<div style="background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 20px;margin-bottom:16px;">
        <div class="cat-head" data-cat="${cat}" role="button" tabindex="0">
          <span class="car">${접힘 ? "▶" : "▼"}</span>
          <span class="nm">${items[0].categoryLabel}</span>
          <span class="cnt">(${items.length})</span>
          ${미대응 ? `<span class="hot">미대응 ${미대응}</span>` : ""}
        </div>
        ${접힘 ? "" : items.map(threatRow).join("")}
      </div>`;
    }).join("");

    // 갈래 접기/펴기 — 제목 줄 전체가 누르는 자리다.
    cats.querySelectorAll(".cat-head").forEach((el) => {
      el.addEventListener("click", () => {
        const c = el.dataset.cat;
        if (접힌갈래.has(c)) 접힌갈래.delete(c); else 접힌갈래.add(c);
        접기저장();
        render();
      });
    });

    cats.querySelectorAll("[data-toggle]").forEach((el) => {
      el.addEventListener("click", () => {
        const code = el.dataset.toggle;
        var _t = catalog.find(function (x) { return x.code === code; });
        if (_t && !expanded.has(code) && window.gijoSelectNotify) window.gijoSelectNotify({ label: code + " " + _t.name, text: code + " " + _t.name, fields: { title: _t.name, status: String(_t.status || "") } });
        if (expanded.has(code)) expanded.delete(code); else expanded.add(code);
        render();
      });
    });
    cats.querySelectorAll("select[data-status]").forEach((sel) => {
      sel.addEventListener("change", async (e) => {
        const code = e.target.dataset.status;
        const note = cats.querySelector(`input[data-note="${code}"]`).value;
        try { await window.gijo.setComplianceStatus(code, e.target.value, note); catalog = await window.gijo.listCompliance(); render(); } catch (err) { gijoTell("저장 실패: " + err.message); }
      });
    });
    cats.querySelectorAll("input[data-note]").forEach((inp) => {
      inp.addEventListener("blur", async (e) => {
        const code = e.target.dataset.note;
        const t = catalog.find((x) => x.code === code);
        if (t && t.note === e.target.value) return;
        try { await window.gijo.setComplianceStatus(code, t.status, e.target.value); catalog = await window.gijo.listCompliance(); } catch (err) { gijoTell("저장 실패: " + err.message); }
      });
    });
    // AI 초안 — 위협의 양호/취약 기준 + 자산 현황으로 대응 상태 초안을 채운다(검토 후 조정 가능).
    cats.querySelectorAll("button[data-draft]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const code = btn.dataset.draft;
        const orig = btn.textContent;
        btn.disabled = true; btn.textContent = "AI 작성 중…";
        try {
          const { status, note } = await window.gijo.complianceDraft(code);
          await window.gijo.setComplianceStatus(code, status, note); // 초안 저장(note에 '🤖 AI 초안' 표식)
          catalog = await window.gijo.listCompliance();
          expanded.add(code); // 근거를 바로 볼 수 있게 펼침
          render();
        } catch (err) {
          gijoTell("AI 초안 실패: " + ((err && err.message) || err));
          btn.disabled = false; btn.textContent = orig;
        }
      });
    });
  }

  async function init() {
    try {
      catalog = await window.gijo.listCompliance();
      render();
    } catch (e) {
      document.getElementById("catalog").innerHTML = '<div style="color:#f5928a">위협 카탈로그를 불러오지 못했습니다: ' + e.message + "</div>";
    }
    document.querySelectorAll("[data-page]").forEach((el) => {
      el.addEventListener("click", () => (window.gijoOpenScreen ? window.gijoOpenScreen(el.dataset.page) : window.gijo.navigateTo(el.dataset.page)));
    });
  }

  if (!window.gijo.isAuthenticated()) {
    window.gijo.navigateTo("login.html");
  } else {
    init();
  }
</script>
