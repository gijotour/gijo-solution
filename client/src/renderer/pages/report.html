<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIJO AS — 내부 리포트</title>
<style>
:root{
  --bg:#262624;--panel:#30302e;--panel-2:#1f1e1d;--border:rgba(255,255,255,0.08);
  --border-strong:rgba(255,255,255,0.16);--blue:#3b82f6;--blue-light:#5fa1ff;--white:#ffffff;
  --text:#e9e7e2;--muted:#b3ada4;--muted-2:#a49d95;--red:#e2483d;--amber:#f0a020;--teal:#1eb980;--purple:#8b7cf0;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Pretendard","Malgun Gothic","Segoe UI",sans-serif;background:var(--bg);color:var(--text);}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 32px;background:var(--panel-2);border-bottom:1px solid var(--border);}
.brand{display:flex;align-items:center;gap:14px;}
.brand img{height:26px;width:auto;}
.brand-divider{width:1px;height:22px;background:var(--border-strong);}
.product-name{font-size:17px;font-weight:800;letter-spacing:0.3px;}
.product-name span{color:var(--blue-light);}
.product-tag{font-size:12px;color:var(--muted-2);font-weight:700;letter-spacing:1.4px;margin-top:1px;}
.topnav{display:flex;gap:28px;}
.topnav a{color:var(--muted);text-decoration:none;font-size:13.5px;font-weight:600;padding:6px 2px;border-bottom:2px solid transparent;}
.topnav a.active{color:var(--white);border-bottom-color:var(--blue);}
.user-chip{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;}
.app{display:grid;grid-template-columns:220px 1fr;}
.sidebar{padding:22px 14px;border-right:1px solid var(--border);min-height:900px;}
.nav-section{font-size:12px;font-weight:700;color:var(--muted-2);letter-spacing:1.2px;margin:18px 10px 8px;}
.nav-section:first-child{margin-top:0;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;margin-bottom:2px;}
.nav-item .ic{width:18px;text-align:center;font-size:14px;}
.nav-item.active{background:rgba(59,130,246,0.12);color:var(--white);box-shadow:inset 3px 0 0 var(--blue);}
.nav-item:hover:not(.active){background:rgba(255,255,255,0.04);color:var(--white);}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:11.75px;font-weight:800;padding:1px 6px;border-radius:20px;}
.main{padding:28px 32px 48px;}
.topbar-row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;}
.page-title{font-size:21px;font-weight:800;color:var(--text-strong, #fff);}
.page-sub{font-size:12.5px;color:var(--muted);margin-top:4px;}
.btn-primary{background:var(--blue);color:#fff;border:none;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;}
.btn-ghost{background:transparent;border:1px solid var(--border-strong);color:var(--text);padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;}
.kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
.kpi-strip.c5{grid-template-columns:repeat(5,1fr);}
.kpi-mini{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
.kpi-mini-label{font-size:12.25px;color:var(--muted);font-weight:600;margin-bottom:6px;}
.kpi-mini-value{font-size:19px;font-weight:800;color:var(--text-strong, #fff);}
.toolbar{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:12px 12px 0 0;padding:14px 18px;border-bottom:none;}
.search{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--border-strong);border-radius:8px;padding:8px 14px;width:280px;}
.search input{background:transparent;border:none;outline:none;color:var(--text);font-size:13px;width:100%;}
.search input::placeholder{color:var(--muted-2);}
.filters{display:flex;gap:8px;}
.filter-chip{background:var(--panel-2);border:1px solid var(--border-strong);color:var(--muted);padding:7px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;}
.filter-chip.active{background:rgba(59,130,246,0.15);border-color:var(--blue);color:var(--blue-light);}
.table-panel{background:var(--panel);border:1px solid var(--border);border-radius:0 0 12px 12px;padding:0 18px 10px;margin-bottom:16px;}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px;}
.panel-title{font-size:14.5px;font-weight:800;color:var(--text-strong, #fff);margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;}
.panel-sub{font-size:12.5px;color:var(--muted);margin-bottom:14px;}
.panel-link{font-size:12px;color:var(--blue-light);font-weight:700;cursor:pointer;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:12px;font-weight:700;padding:12px 10px;color:var(--muted-2);text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid var(--border);}
td{border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.asset-name{font-weight:700;color:var(--text-strong, #fff);}
.asset-sub{font-size:12.25px;color:var(--muted-2);margin-top:2px;}
.badge{display:inline-block;padding:3px 10px;border-radius:6px;font-size:12.25px;font-weight:700;}
.b-blue{background:rgba(59,130,246,0.15);color:var(--blue-light);}
.b-teal{background:rgba(30,185,128,0.15);color:var(--teal);}
.b-amber{background:rgba(240,160,32,0.15);color:var(--amber);}
.b-red{background:rgba(226,72,61,0.15);color:var(--red-ink, #f5928a);}
.b-purple{background:rgba(139,124,240,0.15);color:var(--purple);}
.row-actions{color:var(--blue-light);font-size:12px;font-weight:700;cursor:pointer;}
.pagination{display:flex;justify-content:space-between;align-items:center;padding:14px 4px 4px;font-size:12px;color:var(--muted);}
.page-btns{display:flex;gap:6px;}
.page-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--border-strong);background:var(--panel-2);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;}
.page-btn.active{background:var(--blue);border-color:var(--blue);color:#fff;}
.footer{margin-top:8px;padding:18px 0 0;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted-2);}
.footer img{height:16px;opacity:0.6;}
.progress-track{height:7px;border-radius:20px;background:rgba(255,255,255,0.08);overflow:hidden;margin-top:8px;}
.progress-fill{height:100%;border-radius:20px;}
.content-grid{display:grid;grid-template-columns:1fr;gap:16px;}

.titlebar{display:flex;align-items:center;justify-content:space-between;background:var(--panel-2);padding:6px 12px;border-bottom:1px solid var(--border);font-size:12.5px;color:var(--muted);}
.titlebar-left{display:flex;align-items:center;gap:8px;}
.titlebar-left img{height:14px;}
.win-dots{display:flex;gap:14px;color:var(--muted-2);font-size:13px;}
.menubar{display:flex;gap:18px;background:var(--bg);padding:6px 14px;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--panel-2);}
.header-left{display:flex;align-items:center;gap:12px;}
.header-left img{height:22px;}
.app-title{font-size:15px;font-weight:800;color:var(--text-strong, #fff);}
.clock{font-size:12px;color:var(--blue-light);font-weight:600;}
.header-right{display:flex;align-items:center;gap:10px;}
.status-pill{display:flex;align-items:center;gap:6px;background:rgba(30,185,128,0.15);border:1px solid rgba(30,185,128,0.4);color:var(--teal);padding:6px 14px;border-radius:20px;font-size:12px;font-weight:800;}
.status-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);}
.beta-tag{background:var(--teal);color:var(--fill-contrast,#06281c);font-size:11.25px;font-weight:800;padding:1px 6px;border-radius:4px;margin-left:2px;}
.icon-row{display:flex;gap:6px;}
.icon-btn{width:32px;height:32px;border-radius:8px;background:var(--panel);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted);cursor:pointer;}
.icon-btn.on{background:rgba(59,130,246,0.18);border-color:var(--blue);color:var(--blue-light);}
.avatar-btn{width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);align-items:center;justify-content:center;z-index:100;}
.modal-overlay.open{display:flex;}
.modal{width:420px;background:var(--panel);border:1px solid var(--border-strong);border-radius:14px;padding:24px;}
.modal-title{font-size:16px;font-weight:800;color:var(--text-strong, #fff);margin-bottom:18px;}
.modal label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600;}
.modal select{width:100%;background:var(--panel-2);border:1px solid var(--border-strong);border-radius:8px;padding:10px 12px;color:var(--text);font-size:13px;margin-bottom:14px;outline:none;}
.modal-checklist{max-height:160px;overflow-y:auto;background:var(--panel-2);border:1px solid var(--border-strong);border-radius:8px;padding:10px 12px;margin-bottom:14px;}
.modal-checklist label{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text);font-weight:400;margin-bottom:8px;}
.modal-err{font-size:12px;color:var(--red-ink, #f5928a);min-height:16px;margin-bottom:4px;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;}

.sched-item{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:11px 13px;margin-bottom:8px;cursor:pointer;}
.sched-item.active{border-color:var(--blue);background:rgba(59,130,246,0.08);}
.sched-item .t{font-size:12.5px;font-weight:800;color:var(--text-strong, #fff);display:flex;justify-content:space-between;gap:6px;}
.sched-item .m{font-size:12px;color:var(--muted);margin-top:4px;}
.chip-sm{font-size:11.5px;font-weight:800;padding:2px 7px;border-radius:5px;white-space:nowrap;border:none;cursor:pointer;font-family:inherit;}
.chip-on{background:rgba(30,185,128,0.15);color:var(--teal);}
.chip-off{background:rgba(139,147,171,0.15);color:var(--muted);}
.chip-warn{background:rgba(226,72,61,0.15);color:var(--red-ink, #f5928a);}
.sched-form label{display:block;font-size:12px;color:var(--muted-2);font-weight:700;margin:9px 0 4px;}
.sched-form select,.sched-form input[type=number]{width:100%;background:var(--panel-2);border:1px solid var(--border-strong);border-radius:7px;padding:7px 9px;color:var(--text);font-size:12px;outline:none;}
.sched-hist{width:100%;border-collapse:collapse;margin-top:6px;}
.sched-hist td{padding:6px 4px;border-bottom:1px solid var(--border);font-size:12.5px;}
.sched-checklist{max-height:110px;overflow-y:auto;background:var(--panel-2);border:1px solid var(--border-strong);border-radius:7px;padding:8px 10px;}
.sched-checklist label{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text);font-weight:400;margin-bottom:6px;}
  /* 대상 자산 칸 — 개수 요약이 기본이지만, 이름이 긴 자산이면 두 개만으로도 길어진다.
     ⚠ 3줄에서 자른다(2026-08-02 사용자 지시 "3줄 이상 안 나오게"). 전체는 툴팁에 있다. */
  .rep-target{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
    line-height:1.6;max-height:calc(1.6em * 3);}
</style>
<script src="viz.js"></script>
</head>
<body>




<!-- 상단 바는 공용이다 — titlebar.js가 그린다(분리창=공용 헤더, 탭 안=셸 탭줄). 화면마다 두던 사본 23개를 지웠다(2026-08-07). -->

<div class="app">
  <div class="sidebar" id="gijoNav"></div>

  <div class="main">
    <div class="topbar-row">
      <div>
        <div class="page-title">내부 리포트</div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="btn-ghost" id="templateBtn">템플릿 관리</button><button class="btn-primary" id="genReportBtn">+ 리포트 생성</button>
      </div>
    </div>

    <div id="gijoChatWidget" data-prompts='["다음 정기 리포트 언제야?","이번 주 리포트 스케줄 확인해줘"]' style="max-width:640px;margin-bottom:16px;"></div>


<div class="kpi-strip" data-gijo-summary>
  <div class="kpi-mini"><div class="kpi-mini-label">이번 세션 생성</div><div class="kpi-mini-value" id="kpiSessionCount">0</div></div>
  <div class="kpi-mini"><div class="kpi-mini-label">자동 생성 예약</div><div class="kpi-mini-value" id="kpiActiveSchedules">-</div></div>
  <div class="kpi-mini"><div class="kpi-mini-label">평균 생성 시간</div><div class="kpi-mini-value" id="kpiAvgTime">-</div></div>
  <div class="kpi-mini"><div class="kpi-mini-label">최근 생성</div><div class="kpi-mini-value" id="kpiLastGen">-</div></div>
</div>

<!-- 정기 리포트 스케줄 — 리포트 이력 **위**로 올렸다(2026-08-02 사용자 지시).
     "언제 자동으로 만들어지나"를 먼저 정하고, 그 결과인 이력을 아래에서 본다. -->
<div class="panel" data-gijo-fold="정기 리포트 스케줄">
  <div class="panel-title">정기 리포트 스케줄</div>
  <div style="display:grid;grid-template-columns:280px 1fr;gap:16px;margin-top:8px;">
    <div>
      <div id="schedList"><div style="color:var(--muted);font-size:12px">불러오는 중…</div></div>
      <button class="btn-ghost" id="schedAddBtn" style="width:100%;margin-top:4px">+ 새 스케줄</button>
    </div>
    <div id="schedDetail">
      <div style="color:var(--muted);font-size:12.5px">왼쪽에서 스케줄을 선택하거나 "+ 새 스케줄"로 추가하세요.</div>
    </div>
  </div>
</div>

<div class="content-grid">
  <div>
    <div class="panel">
      <div style="display:flex;align-items:flex-start;gap:12px;">
        <div style="flex:1;">
          <div class="panel-title">리포트 이력</div>
          <!-- 그림 먼저(전-7 ①, 2026-08-05). 이력이 쌓이면 어떤 리포트를 주로 쓰는지가
               표 스크롤 속에 묻힌다 — 유형별로 세워 두고 눌러서 그 유형만 본다. -->
          <div id="vizStrip" style="margin-top:8px"></div>
          <div id="vizFilter" style="display:none"></div>
        </div>
        <div style="display:flex;align-items:center;gap:6px;white-space:nowrap;padding-top:2px;">
          <span style="font-size:12.5px;color:var(--muted)">오래된 리포트 정리</span>
          <select id="pruneDays" style="font-size:12.5px;background:var(--panel-2);border:1px solid var(--border-strong);color:var(--text);border-radius:6px;padding:4px 7px;outline:none;">
            <option value="7">7일 이전</option>
            <option value="30" selected>30일 이전</option>
            <option value="90">90일 이전</option>
            <option value="180">180일 이전</option>
          </select>
          <button id="pruneBtn" style="font-size:12.5px;background:transparent;border:1px solid var(--red);color:var(--red-ink, #f5928a);border-radius:6px;padding:5px 10px;cursor:pointer;font-weight:700;">일괄 삭제</button>
          <button id="deleteAllBtn" style="font-size:12.5px;background:rgba(226,72,61,.14);border:1px solid var(--red);color:var(--red-ink, #f5928a);border-radius:6px;padding:5px 10px;cursor:pointer;font-weight:800;">🗑 전체 삭제</button>
        </div>
      </div>
      <table>
        <tr><th>유형</th><th>대상 자산</th><th>생성일시</th><th></th></tr>
        <tbody id="reportRows">
          <tr><td colspan="4" style="color:var(--muted)">불러오는 중…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>



    <div class="footer">
      <img src="gijo-symbol.svg" alt="GIJO">
      <span>© 2026 GIJO Technology · GIJO AS Platform · Confidential</span>
    </div>
  </div>
</div>

<div class="modal-overlay" id="genModal">
  <div class="modal">
    <div class="modal-title">리포트 생성</div>
    <label for="reportTypeInput">유형</label>
    <select id="reportTypeInput">
      <option value="ondemand">온디맨드</option>
      <option value="weekly">주간</option>
      <option value="quarterly">분기</option>
    </select>
    <label>용도 (독자에 따라 문체·구성이 달라집니다)</label>
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <label style="flex:1;display:flex;gap:7px;align-items:flex-start;background:var(--panel-2);border:1px solid var(--border-strong);border-radius:8px;padding:9px 11px;cursor:pointer;">
        <input type="radio" name="reportAudience" value="official" checked style="margin-top:2px;accent-color:var(--blue)">
        <span><b style="color:var(--text-strong, #fff);font-size:12.5px">📄 보고용</b><br><span style="font-size:12px;color:var(--muted)">경영진·감사용. 격식 문어체·거버넌스 강조</span></span>
      </label>
      <label style="flex:1;display:flex;gap:7px;align-items:flex-start;background:var(--panel-2);border:1px solid var(--border-strong);border-radius:8px;padding:9px 11px;cursor:pointer;">
        <input type="radio" name="reportAudience" value="internal" style="margin-top:2px;accent-color:var(--blue)">
        <span><b style="color:var(--text-strong, #fff);font-size:12.5px">🔍 내가 볼 것</b><br><span style="font-size:12px;color:var(--muted)">내부 검토용. 격식 없이 액션 중심</span></span>
      </label>
    </div>
    <label for="reportFormatInput">출력 형식</label>
    <select id="reportFormatInput">
      <option value="both">DOCX + PDF</option>
      <option value="docx">DOCX만</option>
      <option value="pdf">PDF만</option>
    </select>
    <label>대상 자산 (선택 안 하면 전체 자산 대상)</label>
    <div class="modal-checklist" id="assetChecklist"></div>
    <div class="modal-err" id="modalErr"></div>
    <div class="modal-actions">
      <button class="btn-ghost" id="modalCancelBtn">취소</button>
      <button class="btn-primary" id="modalSaveBtn">생성</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="viewModal">
  <div class="modal" style="max-width:920px;width:92vw;height:88vh;display:flex;flex-direction:column;">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
      <div class="modal-title" id="viewTitle" style="margin:0;flex:1;">리포트 미리보기</div>
      <button class="rep-dl" id="viewDownloadBtn" style="font-size:12.25px;background:var(--panel-2);border:1px solid var(--border-strong);color:var(--blue-light);border-radius:6px;padding:5px 10px;cursor:pointer;">📥 내려받기</button>
      <button class="btn-ghost" id="viewCloseBtn">닫기</button>
    </div>
    <div id="viewBody" style="flex:1;min-height:0;background:#fff;border:1px solid var(--border);border-radius:8px;overflow:auto;"></div>
    <div id="viewNote" style="font-size:12.25px;color:var(--muted-2);margin-top:8px;"></div>
  </div>
</div>

<script>
  const reportRows = document.getElementById("reportRows");
  const modal = document.getElementById("genModal");
  const modalErr = document.getElementById("modalErr");
  const assetChecklist = document.getElementById("assetChecklist");
  const modalSaveBtn = document.getElementById("modalSaveBtn");

  const sessionReports = [];
  let historyReports = []; // 서버에 저장된 과거 리포트까지 포함(재기동·다른 세션 포함)
  let allAssets = [];
  let schedules = []; // 정기 리포트(주간/분기) 자동 생성 스케줄
  let selectedScheduleId = null; // null=미선택, "new"=새 스케줄 작성 중
  const DOW_LABEL = ["일", "월", "화", "수", "목", "금", "토"];




  // answer = 오래 걸려 뒤에서 작성한 답(2026-07-26). ingest = 파일 인입 진행내역.
  // session = 작업 내역 종료 리포트(worksessions.ts) — 라벨은 화면 통일명 「작업 내역」(2026-07-28 개명).
  // daily·monthly(스케줄 정기)·work-progress(업무 진행)도 실제 생산자가 있다 — 키가 빠지면
  // 영문이 그대로 나간다(2026-08-21 검토관 ②). grouppanels TL·datacard.ts 사본과 글자까지 동일할 것.
  const TYPE_LABEL = { weekly: "정기 · 주간", quarterly: "정기 · 분기", ondemand: "온디맨드",
    daily: "정기 · 일일", monthly: "정기 · 매월", "work-progress": "업무 진행",
    answer: "AI 작성 자료", ingest: "파일 처리 내역", session: "작업 내역" };

  // 생성된 리포트 파일을 서버에서 받아(base64) blob으로 열기/저장. 서버가 다른 머신이어도 동작.
  async function downloadReport(name, btn) {
    const orig = btn ? btn.textContent : "";
    if (btn) btn.textContent = "받는 중…";
    try {
      const f = await window.gijo.downloadReportFile(name);
      const bytes = Uint8Array.from(atob(f.base64), (c) => c.charCodeAt(0));
      const blob = new Blob([bytes], { type: f.mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = f.name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      if (btn) btn.textContent = orig;
    } catch (e) {
      if (btn) btn.textContent = "실패";
    }
  }

  async function loadHistory() {
    try {
      historyReports = (await window.gijo.listReportHistory()) || [];
    } catch (e) {
      historyReports = [];
    }
  }

  // 뷰어 — 저장된 PDF를 그대로 화면에 띄운다. PDF가 없는 리포트는 저장된 요약을 보여준다(정직한 폴백).
  const viewModal = document.getElementById("viewModal");
  async function openViewer(base) {
    const entry = historyReports.find((r) => r.base === base);
    if (!entry) return;
      // 🎯 고른 항목을 대화창에(B16 완결 2026-08-19 — 공용 부품 규격은 selectnotify.js)
      if (window.gijoSelectNotify) window.gijoSelectNotify({ label: TYPE_LABEL[entry.type] || entry.type, text: "리포트 " + (TYPE_LABEL[entry.type] || entry.type), fields: { title: TYPE_LABEL[entry.type] || entry.type, owner: entry.createdBy || "" } });
    const body = document.getElementById("viewBody");
    const note = document.getElementById("viewNote");
    document.getElementById("viewTitle").textContent =
      `${TYPE_LABEL[entry.type] || entry.type} · ${entry.createdAt ? new Date(entry.createdAt).toLocaleString("ko-KR") : ""}`;
    document.getElementById("viewDownloadBtn").onclick = () => downloadReport(entry.pdf || entry.docx || entry.md);
    body.innerHTML = '<div style="color:#555;padding:22px">불러오는 중…</div>';
    note.textContent = "";
    viewModal.classList.add("open");
    if (entry.pdf) {
      try {
        const f = await window.gijo.downloadReportFile(entry.pdf);
        const bytes = Uint8Array.from(atob(f.base64), (c) => c.charCodeAt(0));
        const url = URL.createObjectURL(new Blob([bytes], { type: f.mime }));
        viewModal._url = url;
        body.innerHTML = `<iframe src="${url}" style="width:100%;height:100%;border:0;"></iframe>`;
        note.textContent = "저장된 PDF를 그대로 표시합니다.";
      } catch (e) {
        body.innerHTML = '<div style="color:#b00020;padding:22px">PDF를 불러오지 못했습니다: ' + esc(e.message) + "</div>";
      }
    } else if (entry.md) {
      // 마크다운 리포트(AI 작성 자료·파일 처리 내역)는 본문을 그대로 보여준다.
      // [2026-07-26 사용자 지적] 요약만 띄우는 바람에 "보고서 만들어줘" 한 줄만 나오고
      // 정작 AI가 작성한 내용이 안 보였다 — 본문이 있는데 안 읽던 것.
      try {
        const f = await window.gijo.downloadReportFile(entry.md);
        const text = new TextDecoder("utf-8").decode(Uint8Array.from(atob(f.base64), (c) => c.charCodeAt(0)));
        body.innerHTML = `<div style="padding:24px;color:#222;font-size:13px;line-height:1.9;white-space:pre-wrap;">${esc(text)}</div>`;
        note.textContent = "저장된 본문(마크다운)을 그대로 표시합니다.";
      } catch (e) {
        body.innerHTML = '<div style="color:#b00020;padding:22px">본문을 불러오지 못했습니다: ' + esc(e.message) + "</div>";
      }
    } else {
      body.innerHTML = `<div style="padding:24px;color:#222;font-size:13px;line-height:1.9;white-space:pre-wrap;">${esc(entry.summary || "저장된 요약이 없습니다. DOCX를 내려받아 확인하세요.")}</div>`;
      note.textContent = "이 리포트는 PDF가 없어 저장된 요약만 표시합니다. 전체 내용은 DOCX 내려받기로 확인하세요.";
    }
  }
  function closeViewer() {
    viewModal.classList.remove("open");
    document.getElementById("viewBody").innerHTML = ""; // iframe 정지
    if (viewModal._url) { URL.revokeObjectURL(viewModal._url); viewModal._url = null; }
  }

  async function pruneOld() {
    const days = Number(document.getElementById("pruneDays").value);
    if (!await gijoAsk(`${days}일 이전에 생성된 리포트를 모두 삭제할까요? DOCX·PDF·요약이 함께 삭제되며 되돌릴 수 없습니다.`)) return;
    const btn = document.getElementById("pruneBtn");
    const orig = btn.textContent;
    btn.disabled = true; btn.textContent = "삭제 중…";
    try {
      const r = await window.gijo.pruneReports(days);
      await loadHistory();
      renderReportRows();
      gijoTell(`${days}일 이전 리포트 ${r.deletedReports}건(파일 ${r.deletedFiles}개)을 삭제했습니다.`);
    } catch (e) {
      gijoTell("일괄 삭제 실패: " + ((e && e.message) || e));
    } finally {
      btn.disabled = false; btn.textContent = orig;
    }
  }

  async function deleteAllReports() {
    if (!await gijoAsk("저장된 모든 리포트를 삭제할까요? DOCX·PDF·요약이 전부 삭제되며 되돌릴 수 없습니다.")) return;
    if (!await gijoAsk("정말 전체 삭제할까요? 이 작업은 되돌릴 수 없습니다.")) return; // 파괴적 — 2단계 확인
    const btn = document.getElementById("deleteAllBtn");
    const orig = btn.textContent;
    btn.disabled = true; btn.textContent = "삭제 중…";
    try {
      const r = await window.gijo.deleteAllReports();
      await loadHistory();
      renderReportRows();
      gijoTell(`리포트 ${r.deletedReports}건(파일 ${r.deletedFiles}개)을 전부 삭제했습니다.`);
    } catch (e) {
      gijoTell("전체 삭제 실패: " + ((e && e.message) || e));
    } finally {
      btn.disabled = false; btn.textContent = orig;
    }
  }

  async function deleteReportRow(base, btn) {
    if (!await gijoAsk("이 리포트를 삭제할까요? DOCX·PDF·요약 파일이 함께 삭제되며 되돌릴 수 없습니다.")) return;
    if (btn) btn.disabled = true;
    try {
      await window.gijo.deleteReport(base);
      await loadHistory();
      renderReportRows();
    } catch (e) {
      gijoTell("삭제 실패: " + ((e && e.message) || e));
      if (btn) btn.disabled = false;
    }
  }

  function esc(s) { return String(s == null ? "" : s).replace(/[&<]/g, (c) => (c === "&" ? "&amp;" : "&lt;")); }

  // ── 그림 먼저(전-7 ①, 2026-08-05) ──────────────────────────────────────
  let 유형필터 = null;

  function 그림띠() {
    const 자리 = document.getElementById("vizStrip");
    if (!자리 || !window.gijoViz) return;
    const 유형별 = {};
    historyReports.forEach((r) => { 유형별[r.type] = (유형별[r.type] || 0) + 1; });
    const 키들 = Object.keys(유형별).sort((a, b) => 유형별[b] - 유형별[a]);
    window.gijoViz.mount(자리, {
      title: "무엇을 많이 만들었나",
      hint: 키들.length ? "누르면 목록이 좁혀집니다" : "",
      parts: [{
        kind: "bars",
        segments: 키들.map((t) => ({ key: t, label: (TYPE_LABEL[t] || t).replace("정기 · ", ""), value: 유형별[t], color: "blue" })),
        onPick: (key) => { 유형필터 = key; 필터띠(); 줄그리기(); },
      }],
    });
    if (유형필터) {
      const b = 자리.querySelector('.gviz-bar[data-key="' + 유형필터 + '"]');
      if (b) b.classList.add("on");
    }
    필터띠();
  }

  // 필터 띠 — 목록 단위(리포트)로만 적는다.
  function 필터띠() {
    if (!window.gijoViz) return;
    const el = document.getElementById("vizFilter");
    if (!유형필터) { window.gijoViz.filterBar(el, null, null); return; }
    const 보임 = historyReports.filter((r) => r.type === 유형필터).length;
    window.gijoViz.filterBar(el,
      { label: TYPE_LABEL[유형필터] || 유형필터, 보임, 전체: historyReports.length, 단위: "리포트" },
      () => {
        유형필터 = null;
        document.querySelectorAll("#vizStrip .gviz-bar").forEach((b) => b.classList.remove("on"));
        필터띠();
        줄그리기();
      });
  }
  // ───────────────────────────────────────────────────────────────────────

  function renderReportRows() {
    그림띠();
    줄그리기();
  }

  function 줄그리기() {
    const 유형뒤 = 유형필터 ? historyReports.filter((r) => r.type === 유형필터) : historyReports;
    // 🗂 지금 범위(2026-08-18 승인 시안).
    // ⚠ **전사 리포트(대상 자산이 빈 것)는 남긴다.** 그건 「전체 자산 대상」이라 그 자산도
    //   포함하기 때문이다(화면이 이미 「전체 자산」이라 적는다). 걸러 내면 「이 자산은 보고가
    //   없다」로 잘못 읽힌다 — 없는 사실을 만드는 셈이다.
    const 범위자산 = window.gijoScope ? window.gijoScope.assetId() : "";
    const 보일것 = 범위자산
      ? 유형뒤.filter((r) => !(r.assetIds || []).length || (r.assetIds || []).includes(범위자산))
      : 유형뒤;
    if (window.gijoScope) window.gijoScope.chip(보일것.length, 유형뒤.length);
    if (historyReports.length === 0) {
      reportRows.innerHTML = '<tr><td colspan="4" style="color:var(--muted)">아직 생성한 리포트가 없습니다 — "+ 리포트 생성"으로 만들어 보세요</td></tr>';
    } else if (보일것.length === 0) {
      reportRows.innerHTML = '<tr><td colspan="4" style="color:var(--muted)">고른 유형의 리포트가 없습니다 — 위 「✕ 해제」를 누르면 전체가 다시 보입니다.</td></tr>';
    } else {
      const dlBtn = (name) =>
        `<button class="rep-dl" data-name="${name}" style="font-size:12.25px;background:var(--panel-2);border:1px solid var(--border-strong);color:var(--blue-light);border-radius:6px;padding:4px 9px;cursor:pointer;margin-right:5px;">${/\.pdf$/i.test(name) ? "📄 PDF" : "📥 DOCX"}</button>`;
      const viewBtn = (base) =>
        `<button class="rep-view" data-base="${base}" style="font-size:12.25px;background:var(--teal);border:1px solid var(--teal);color:#04211d;border-radius:6px;padding:4px 9px;cursor:pointer;margin-right:5px;font-weight:700;">👁 보기</button>`;
      const delBtn = (base) =>
        `<button class="rep-del" data-base="${base}" title="삭제" style="font-size:12.25px;background:transparent;border:1px solid var(--red);color:var(--red-ink, #f5928a);border-radius:6px;padding:4px 9px;cursor:pointer;">🗑</button>`;
      // ⚠ 예전엔 대상 자산을 **전부** 이어 붙였다. 57개면 여덟 줄이 되어 한 줄이 200px을 먹고,
      //   정작 읽히지도 않았다(2026-08-02 사용자 지적). 이 칸에서 알아야 하는 것은
      //   "어느 IP가 들어갔나"가 아니라 **"얼마나 넓게 잡았나"**다 — 개수를 앞세우고 두 개만 보인다.
      //   전체 목록은 마우스를 올리면 뜨고, 리포트 안에는 그대로 다 들어 있다.
      const 대상요약 = (r) => {
        const 목록 = (r.assetNames && r.assetNames.length) ? r.assetNames
                   : (r.assetIds && r.assetIds.length ? r.assetIds : null);
        if (!목록) return { 글: "전체 자산", 전체: "리포트 생성 시 전체 자산을 대상으로 했습니다" };
        const 앞 = 목록.slice(0, 2).join(", ");
        const 나머지 = 목록.length - 2;
        return {
          글: 목록.length <= 2 ? `자산 ${목록.length}개 — ${앞}` : `자산 ${목록.length}개 — ${앞} 외 ${나머지}개`,
          전체: 목록.join(", "),
        };
      };
      reportRows.innerHTML = 보일것
        .map((r) => {
          const audLabel = r.audience === "internal" ? "🔍 내부용" : "📄 보고용";
          const target = 대상요약(r);
          const when = r.createdAt ? new Date(r.createdAt).toLocaleString("ko-KR") : "-";
          const who = r.createdBy ? `<br><span style="font-size:11.75px;color:var(--teal, #6fdcb5)" title="이 리포트를 만든 사람">👤 ${esc(r.createdBy)}</span>` : ""; // 작업 귀속(2026-07-25)
          const files = (r.docx ? dlBtn(r.docx) : "") + (r.pdf ? dlBtn(r.pdf) : "");
          return `<tr>
            <td><span class="badge b-blue">${TYPE_LABEL[r.type] || r.type}</span><br><span style="font-size:11.75px;color:var(--muted-2);white-space:nowrap">${audLabel}</span></td>
            <td class="rep-target" title="${esc(target.전체)}">${esc(target.글)}</td>
            <td>${when}${who}</td>
            <td class="row-actions" style="white-space:nowrap">${viewBtn(r.base)}${files}${delBtn(r.base)}</td>
          </tr>`;
        })
        .join("");
      reportRows.querySelectorAll(".rep-dl").forEach((b) => b.addEventListener("click", () => downloadReport(b.dataset.name, b)));
      reportRows.querySelectorAll(".rep-view").forEach((b) => b.addEventListener("click", () => openViewer(b.dataset.base)));
      reportRows.querySelectorAll(".rep-del").forEach((b) => b.addEventListener("click", () => deleteReportRow(b.dataset.base, b)));
    }

    // KPI — 생성 건수/최근 생성은 저장 이력 기준, 평균 생성 시간은 이번 세션 실측만 있음.
    document.getElementById("kpiSessionCount").textContent = historyReports.length;
    document.getElementById("kpiLastGen").textContent = historyReports.length && historyReports[0].createdAt
      ? new Date(historyReports[0].createdAt).toLocaleString("ko-KR", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" })
      : "-";
    if (sessionReports.length) {
      const avgMs = sessionReports.reduce((sum, r) => sum + r.durationMs, 0) / sessionReports.length;
      document.getElementById("kpiAvgTime").textContent = `${(avgMs / 1000).toFixed(1)}초`;
    }

  }

  function openModal() {
    modalErr.textContent = "";
    assetChecklist.innerHTML = allAssets.length
      ? allAssets
          .map((a) => `<label><input type="checkbox" value="${a.id}"> ${a.name}</label>`)
          .join("")
      : '<div style="color:var(--muted-2)">등록된 자산이 없습니다</div>';
    modal.classList.add("open");
  }

  function closeModal() {
    modal.classList.remove("open");
  }

  async function generate() {
    const type = document.getElementById("reportTypeInput").value;
    const audience = (document.querySelector('input[name="reportAudience"]:checked') || {}).value || "official";
    const format = document.getElementById("reportFormatInput").value;
    const assetIds = [...assetChecklist.querySelectorAll("input:checked")].map((el) => el.value);
    modalSaveBtn.disabled = true;
    modalSaveBtn.textContent = "생성 중...";
    const startedAt = Date.now();
    try {
      const result = await window.gijo.generateReport({ type, assetIds: assetIds.length ? assetIds : undefined, audience, format });
      sessionReports.unshift({
        type, audience, assetIds, filePath: result.filePath, pdfPath: result.pdfPath, executiveSummary: result.executiveSummary,
        at: Date.now(), durationMs: Date.now() - startedAt,
      });
      await loadHistory(); // 방금 저장된 리포트까지 서버 이력에서 다시 읽어 표에 반영
      renderReportRows();
      closeModal();
    } catch (e) {
      modalErr.textContent = "생성 실패: " + e.message;
    } finally {
      modalSaveBtn.disabled = false;
      modalSaveBtn.textContent = "생성";
    }
  }

  // ── 정기 리포트 스케줄(시안 B: 마스터-디테일) ──────────────────────────────
  const pad2 = (n) => String(n).padStart(2, "0");
  function fmtDT(ms) {
    if (!ms) return "-";
    return new Date(ms).toLocaleString("ko-KR", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
  }
  const SCHED_TYPE_LABEL = { ondemand: "요청", daily: "일일", weekly: "주간", monthly: "매월", quarterly: "분기" };
  function scheduleCadenceText(s) {
    const hm = `${pad2(s.hour)}:${pad2(s.minute)}`;
    if (s.type === "ondemand") return "자동 실행 없음(필요할 때 직접 실행)";
    if (s.type === "daily") return `매일 ${hm}`;
    if (s.type === "weekly") return `매주 ${DOW_LABEL[s.dayOfWeek ?? 1]} ${hm}`;
    if (s.type === "monthly") return `매월 1일(영업일) ${hm}`;
    return `분기 첫 영업일 ${hm}`;
  }

  async function loadSchedules() {
    try {
      const r = await window.gijo.reportSchedules.list();
      schedules = r.schedules || [];
    } catch (e) {
      schedules = [];
    }
    document.getElementById("kpiActiveSchedules").textContent = schedules.filter((s) => s.enabled).length;
  }

  function renderScheduleList() {
    const list = document.getElementById("schedList");
    if (!schedules.length) {
      list.innerHTML = '<div style="color:var(--muted);font-size:12px">등록된 스케줄이 없습니다</div>';
      return;
    }
    list.innerHTML = schedules
      .map((s) => {
        const scope = s.assetIds && s.assetIds.length ? `자산 ${s.assetIds.length}건` : "전체 자산";
        const statusChip = !s.enabled
          ? '<span class="chip-sm chip-off">꺼짐</span>'
          : s.lastResult === "fail"
          ? `<span class="chip-sm chip-warn" title="${esc(s.lastError || "지난 실행 실패 — 상세에서 이력 확인")}">주의</span>`
          : '<span class="chip-sm chip-on">켜짐</span>';
        const showNext = s.enabled && s.type !== "ondemand";
        return `<div class="sched-item${s.id === selectedScheduleId ? " active" : ""}" data-id="${s.id}">
          <div class="t"><span>${SCHED_TYPE_LABEL[s.type]} · ${esc(scope)}</span>${statusChip}</div>
          <div class="m">${esc(scheduleCadenceText(s))}${showNext ? ` · 다음 ${fmtDT(s.nextRunAt)}` : ""}</div>
        </div>`;
      })
      .join("");
    list.querySelectorAll(".sched-item").forEach((el) => el.addEventListener("click", () => selectSchedule(el.dataset.id)));
  }

  async function selectSchedule(id) {
    selectedScheduleId = id;
    renderScheduleList();
    await renderScheduleDetail();
  }

  async function renderNewScheduleForm() {
    selectedScheduleId = "new";
    renderScheduleList();
    await renderScheduleDetail();
  }

  async function backToScheduleList() {
    selectedScheduleId = null;
    renderScheduleList();
    await renderScheduleDetail();
  }

  async function renderScheduleDetail() {
    const detail = document.getElementById("schedDetail");
    if (!selectedScheduleId) {
      detail.innerHTML = '<div style="color:var(--muted);font-size:12.5px">왼쪽에서 스케줄을 선택하거나 "+ 새 스케줄"로 추가하세요.</div>';
      return;
    }
    const isNew = selectedScheduleId === "new";
    const s = isNew ? null : schedules.find((x) => x.id === selectedScheduleId);
    if (!isNew && !s) {
      detail.innerHTML = "";
      return;
    }

    const assetOptionsHtml = allAssets.length
      ? allAssets
          .map((a) => `<label><input type="checkbox" value="${a.id}" ${s && s.assetIds && s.assetIds.includes(a.id) ? "checked" : ""}> ${esc(a.name)}</label>`)
          .join("")
      : '<div style="color:var(--muted-2)">등록된 자산이 없습니다</div>';

    const curType = s ? s.type : "weekly";
    // 분기(quarterly)는 2026-07-21 이전 등록분과의 하위호환용 — 새로 만들 때는 고르지 않고,
    // 기존에 분기로 등록된 스케줄을 열었을 때만 선택지에 나타난다.
    const typeOptions = [
      ["ondemand", "요청"], ["daily", "일일"], ["weekly", "주간"], ["monthly", "매월"],
      ...(curType === "quarterly" ? [["quarterly", "분기(기존)"]] : []),
    ];

    detail.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <b style="color:var(--text-strong, #fff);font-size:13.5px">${isNew ? "새 스케줄" : SCHED_TYPE_LABEL[s.type] + " 리포트"}</b>
        ${!isNew ? `<button class="chip-sm ${s.enabled ? "chip-on" : "chip-off"}" id="schedToggleBtn">${s.enabled ? "켜짐" : "꺼짐"}</button>` : ""}
      </div>
      <div class="sched-form">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
          <div><label>유형</label><select id="schedType">
            ${typeOptions.map(([v, label]) => `<option value="${v}" ${curType === v ? "selected" : ""}>${label}</option>`).join("")}
          </select></div>
          <div id="schedDowWrap"><label>요일</label><select id="schedDow">
            ${DOW_LABEL.map((d, i) => `<option value="${i}" ${(s ? s.dayOfWeek : 1) === i ? "selected" : ""}>${d}요일</option>`).join("")}
          </select></div>
          <div id="schedTimeWrap"><label>시각</label><div style="display:flex;gap:6px;align-items:center;">
            <input type="number" id="schedHour" min="0" max="23" value="${s ? s.hour : 9}" style="width:64px">
            <span style="color:var(--muted)">:</span>
            <input type="number" id="schedMinute" min="0" max="59" value="${s ? s.minute : 0}" style="width:64px">
          </div></div>
          <div id="schedOndemandNote" style="grid-column:1/-1;font-size:12.25px;color:var(--muted-2);display:none">자동 실행 없음 — 등록해 두면 "지금 실행"으로 필요할 때 바로 생성합니다.</div>
          <div><label>형식</label><select id="schedFormat">
            <option value="both" ${!s || s.format === "both" ? "selected" : ""}>DOCX+PDF</option>
            <option value="docx" ${s && s.format === "docx" ? "selected" : ""}>DOCX만</option>
            <option value="pdf" ${s && s.format === "pdf" ? "selected" : ""}>PDF만</option>
          </select></div>
          <div style="grid-column:1/-1"><label>수신 대상</label><select id="schedAudience">
            <option value="official" ${!s || s.audience === "official" ? "selected" : ""}>official(보고용)</option>
            <option value="internal" ${s && s.audience === "internal" ? "selected" : ""}>internal(내부 검토용)</option>
          </select></div>
        </div>
        <label>대상 자산 (선택 안 하면 전체 자산)</label>
        <div class="sched-checklist" id="schedAssetChecklist">${assetOptionsHtml}</div>
      </div>
      <div class="modal-err" id="schedErr"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px;">
        <button class="btn-ghost" id="schedBackBtn">← 목록으로</button>
        ${!isNew ? '<button class="btn-ghost" id="schedDeleteBtn" style="color:var(--red-ink, #f5928a);border-color:var(--red)">삭제</button>' : ""}
        ${!isNew ? '<button class="btn-ghost" id="schedRunNowBtn">지금 실행</button>' : ""}
        <button class="btn-primary" id="schedSaveBtn">${isNew ? "스케줄 추가" : "저장"}</button>
      </div>
      ${
        !isNew
          ? `<div style="margin-top:14px;border-top:1px solid var(--border);padding-top:10px;">
        <b style="font-size:12px;color:var(--text-strong, #fff)">최근 실행 이력</b>
        <table class="sched-hist" id="schedHistTable"><tr><td style="color:var(--muted)">불러오는 중…</td></tr></table>
      </div>`
          : ""
      }
    `;

    const typeSel = document.getElementById("schedType");
    const dowWrap = document.getElementById("schedDowWrap");
    const timeWrap = document.getElementById("schedTimeWrap");
    const ondemandNote = document.getElementById("schedOndemandNote");
    const syncType = () => {
      dowWrap.style.display = typeSel.value === "weekly" ? "" : "none";
      const isOndemand = typeSel.value === "ondemand";
      timeWrap.style.display = isOndemand ? "none" : "";
      ondemandNote.style.display = isOndemand ? "" : "none";
    };
    syncType();
    typeSel.addEventListener("change", syncType);

    document.getElementById("schedBackBtn").addEventListener("click", () => backToScheduleList());
    document.getElementById("schedSaveBtn").addEventListener("click", () => saveSchedule(isNew));
    if (!isNew) {
      document.getElementById("schedToggleBtn").addEventListener("click", () => toggleSchedule(s));
      document.getElementById("schedDeleteBtn").addEventListener("click", () => deleteScheduleRow(s.id));
      document.getElementById("schedRunNowBtn").addEventListener("click", () => runScheduleNow(s.id));
      await loadScheduleRuns(s.id);
    }
  }

  function readScheduleForm() {
    const type = document.getElementById("schedType").value;
    const hour = Number(document.getElementById("schedHour").value);
    const minute = Number(document.getElementById("schedMinute").value);
    const format = document.getElementById("schedFormat").value;
    const audience = document.getElementById("schedAudience").value;
    const assetIds = [...document.querySelectorAll("#schedAssetChecklist input:checked")].map((el) => el.value);
    const input = { type, hour, minute, format, audience, assetIds: assetIds.length ? assetIds : null };
    if (type === "weekly") input.dayOfWeek = Number(document.getElementById("schedDow").value);
    return input;
  }

  async function saveSchedule(isNew) {
    const btn = document.getElementById("schedSaveBtn");
    const errEl = document.getElementById("schedErr");
    errEl.textContent = "";
    const input = readScheduleForm();
    btn.disabled = true;
    try {
      if (isNew) {
        const r = await window.gijo.reportSchedules.create(input);
        selectedScheduleId = r.schedule.id;
      } else {
        await window.gijo.reportSchedules.update(selectedScheduleId, input);
      }
      await loadSchedules();
      renderScheduleList();
      await renderScheduleDetail();
    } catch (e) {
      errEl.textContent = "저장 실패: " + ((e && e.message) || e);
    } finally {
      btn.disabled = false;
    }
  }

  async function toggleSchedule(s) {
    try {
      await window.gijo.reportSchedules.update(s.id, { enabled: !s.enabled });
      await loadSchedules();
      renderScheduleList();
      await renderScheduleDetail();
    } catch (e) {
      gijoTell("변경 실패: " + ((e && e.message) || e));
    }
  }

  async function deleteScheduleRow(id) {
    if (!await gijoAsk("이 스케줄을 삭제할까요? 이미 생성된 리포트는 그대로 남습니다.")) return;
    try {
      await window.gijo.reportSchedules.remove(id);
      selectedScheduleId = null;
      await loadSchedules();
      renderScheduleList();
      await renderScheduleDetail();
    } catch (e) {
      gijoTell("삭제 실패: " + ((e && e.message) || e));
    }
  }

  async function runScheduleNow(id) {
    const btn = document.getElementById("schedRunNowBtn");
    if (btn) { btn.disabled = true; btn.textContent = "실행 중…"; }
    try {
      await window.gijo.reportSchedules.runNow(id);
      await loadSchedules();
      await loadHistory(); // 방금 생성한 리포트를 리포트 이력에도 반영
      renderReportRows();
      renderScheduleList();
      await renderScheduleDetail();
    } catch (e) {
      gijoTell("실행 실패: " + ((e && e.message) || e));
    }
  }

  async function loadScheduleRuns(id) {
    const table = document.getElementById("schedHistTable");
    if (!table) return;
    try {
      const r = await window.gijo.reportSchedules.runs(id, 10);
      const runs = r.runs || [];
      table.innerHTML = runs.length
        ? runs
            .map(
              (run) =>
                `<tr><td>${fmtDT(run.at)}</td><td><span class="chip-sm ${run.result === "success" ? "chip-on" : "chip-warn"}">${run.result === "success" ? "성공" : "실패"}</span></td><td style="color:var(--muted)">${esc(run.detail || "-")}</td></tr>`
            )
            .join("")
        : '<tr><td style="color:var(--muted)">실행 이력이 없습니다</td></tr>';
    } catch (e) {
      table.innerHTML = '<tr><td style="color:var(--muted)">이력을 불러오지 못했습니다</td></tr>';
    }
  }

  async function init() {
    allAssets = await window.gijo.listAssets();
    await loadHistory();
    renderReportRows();
    await loadSchedules();
    renderScheduleList();

    document.querySelectorAll("[data-page]").forEach((el) => {
      el.addEventListener("click", () => (window.gijoOpenScreen ? window.gijoOpenScreen(el.dataset.page) : window.gijo.navigateTo(el.dataset.page)));
    });
    document.getElementById("genReportBtn").addEventListener("click", openModal);
    document.getElementById("modalCancelBtn").addEventListener("click", closeModal);
    modalSaveBtn.addEventListener("click", generate);
    modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });
    document.getElementById("viewCloseBtn").addEventListener("click", closeViewer);
    viewModal.addEventListener("click", (e) => { if (e.target === viewModal) closeViewer(); });
    document.getElementById("pruneBtn").addEventListener("click", pruneOld);
    document.getElementById("deleteAllBtn").addEventListener("click", deleteAllReports);
    document.getElementById("templateBtn").addEventListener("click", () => {
      gijoTell("템플릿 관리 기능은 아직 구현되지 않았습니다.");
    });
    document.getElementById("schedAddBtn").addEventListener("click", renderNewScheduleForm);
  }

  if (!window.gijo.isAuthenticated()) {
    window.gijo.navigateTo("login.html");
  } else {
    init();
  }
</script>
