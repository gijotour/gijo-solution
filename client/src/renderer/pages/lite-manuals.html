<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIJO AS Lite — 보안 장비 등록부</title>
<link rel="stylesheet" href="gijo-ui.css">
<!--
  lite-manuals.html — 라이트 「보안 장비 등록부」(메뉴 5).
  사장님 말: 「메뉴얼 등록해서 특정 내용 확인하기」

  ■ ⚠ **자산 관리가 아니다.** 자산 등록부로 읽으면 담당자 배정·조치 검증이 딸려 와 라이트를 넘는다.
    사장님 문장은 「매뉴얼 넣고 찾기」이고 그건 **문서함 + RAG**다 — 이미 있다.
    그래서 list_assets·register_asset을 안 쓴다.

  ■ 이미 `category = "장비운영"`이 쓰이고 있다(2026-08-12 실측: 7건).
    새 분류를 만들지 않고 그것을 그대로 쓴다.

  ■ 다리: listMemoryDocuments · setDocCategory · ingestMemoryFile · queryMemory · memoryDocumentChunks
-->
<style>
  :root{--bg:#262624;--panel:#30302e;--border:rgba(255,255,255,.09);--text:#e9e7e2;--muted:#b3ada4;--muted-2:#a49d95;--blue:#3b82f6;--teal:#1eb980;--red:#e2483d;--amber:#f0a020;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Pretendard","Malgun Gothic","Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:13px;overflow-y:auto}
  .wrap{padding:18px 22px 40px;display:flex;flex-direction:column;gap:14px;max-width:900px}
  .scr-id{font-size:12.5px;color:var(--muted)}
  .scr-id b{color:var(--text);font-weight:800}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
  .card h2{font-size:13px;font-weight:800;margin-bottom:4px}
  .card .sub{font-size:11.5px;color:var(--muted-2);margin-bottom:10px;line-height:1.6}
  .ask{display:flex;gap:8px;margin-bottom:6px}
  .ask input{flex:1;background:#262624;border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font:inherit}
  button{background:transparent;border:1px solid var(--border);border-radius:8px;padding:7px 13px;color:var(--text);font:inherit;font-size:12.5px;cursor:pointer}
  button.go{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
  button:disabled{opacity:.5;cursor:default}
  .doc{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--border)}
  .doc:last-child{border-bottom:0}
  .doc .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
  .doc .n:hover{color:var(--blue)}
  .doc .m{font-size:11.5px;color:var(--muted-2);flex:0 0 auto}
  .hit{padding:10px 0;border-bottom:1px solid var(--border);font-size:12.5px;line-height:1.75;white-space:pre-wrap}
  .hit:last-child{border-bottom:0}
  .read{font-size:12.5px;line-height:1.8;white-space:pre-wrap;max-height:52vh;overflow:auto;padding-right:6px}
  .empty{font-size:12.5px;color:var(--muted);line-height:1.75;padding:6px 2px}
  .empty b{color:var(--text)}
  .err{font-size:12.5px;color:var(--red);padding:6px 2px}
  .ok{font-size:12.5px;color:var(--teal);padding:6px 2px}
  .warn{font-size:11.5px;color:var(--amber);line-height:1.7;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="scr-id"><b>보안 장비 등록부</b> — 장비 매뉴얼을 넣어 두고, 필요할 때 그 안에서 찾습니다.</div>

  <section class="card">
    <h2>매뉴얼에서 찾기</h2>
    <div class="sub">장비 매뉴얼은 두껍습니다 — 목차를 뒤지지 말고 물어보세요.</div>
    <div class="ask">
      <input id="q" type="text" placeholder="예: 로그를 외부로 보내려면 어디를 만져야 돼?" aria-label="질문">
      <button class="go" id="askGo">찾기</button>
    </div>
    <div id="hits"></div>
  </section>

  <section class="card">
    <h2>매뉴얼 넣기</h2>
    <div class="sub">넣으면 바로 위에서 찾을 수 있습니다.</div>
    <div class="ask">
      <input id="file" type="file" accept=".md,.txt,.log,.csv" aria-label="매뉴얼 파일">
      <button id="upGo">넣기</button>
    </div>
    <div id="upMsg"></div>
    <div class="warn">⚠ 지금은 <b>글자 파일(.md · .txt 등)</b>만 됩니다. PDF·워드는 아직 이 화면에서 못 넣습니다 —
      넣는 길이 서로 다르고, 라이트에서 그 경로를 아직 확인하지 못했습니다. 확인하면 여기 열겠습니다.</div>
  </section>

  <section class="card">
    <h2>넣어 둔 매뉴얼 <span id="cnt" style="font-size:11.5px;color:var(--muted);font-weight:600"></span></h2>
    <div id="docs">불러오는 중…</div>
  </section>

  <section class="card" id="readCard" style="display:none">
    <h2 id="readTitle"></h2>
    <div class="read" id="readBody"></div>
  </section>
</div>

<script>
// lite-manuals — 다리는 window.gijo만. category "장비운영"을 그대로 쓴다(새 분류 안 만든다).
(function () {
  "use strict";
  var g = window.gijo || null;
  var 분류 = "장비운영";
  var esc = function (v) { return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  function 오류문구(e, 무엇) {
    var m = String((e && e.message) || e || "");
    if (/401|unauthorized/i.test(m)) return "로그인이 풀렸습니다 — 다시 로그인해 주세요.";
    if (/403|forbidden/i.test(m)) return "이 계정에는 권한이 없습니다.";
    if (/fetch|network|ECONN/i.test(m)) return "서버에 닿지 못했습니다 — 서버가 켜져 있는지 확인해 주세요.";
    return 무엇 + "을 못 했습니다 — " + esc(m);
  }
  if (!g) {
    document.getElementById("docs").innerHTML = '<div class="err">앱 밖에서 열려 있어 데이터를 못 읽습니다 — GIJO AS 앱에서 열어 주세요.</div>';
    return;
  }

  // ⚠ **조각을 날것으로 내보내면 못 읽는다.** 2026-08-12 갈무리에서 확인 —
  //   표 문법(`--|`, `| 🧱 방화벽 |`), `**굵게**`, 이미지 링크가 그대로 나왔다.
  //   조각은 문서 중간에서 잘려 오므로 표가 머리 없이 시작하기도 한다.
  //   마크다운 렌더러를 들이지 않고(공용 스크립트라 이 화면 몫이 아니다) **읽히게만** 다듬는다.
  function 다듬기(t) {
    return String(t || "")
      .split("\n")
      .filter(function (l) { return !/^!\[/.test(l.trim()); })            // 이미지 링크 줄
      .filter(function (l) { return !/^[\s|:-]+$/.test(l); })             // 표 구분선(--|, |:--|)
      .map(function (l) {
        var s = l.replace(/\*\*/g, "").replace(/^#{1,6}\s*/, "");        // 굵게·머리표
        if (/^\s*\|.*\|\s*$/.test(s)) {                                  // 표 한 줄 → 가운뎃점
          s = s.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|")
               .map(function (c) { return c.trim(); }).filter(Boolean).join(" · ");
        }
        return s;
      })
      .join("\n")
      .replace(/\n{3,}/g, "\n\n")
      .trim();
  }

  async function 목록() {
    var box = document.getElementById("docs");
    try {
      var all = await g.listMemoryDocuments();
      var arr = (Array.isArray(all) ? all : all.documents || []).filter(function (d) { return d.category === 분류; });
      document.getElementById("cnt").textContent = arr.length ? arr.length + "건" : "";
      if (!arr.length) {
        // ⚠ 「매뉴얼이 없습니다」로 끝내지 않는다 — 첫날 화면이 이것이다.
        box.innerHTML = '<div class="empty"><b>아직 넣은 매뉴얼이 없습니다.</b><br>' +
          "위에서 파일을 넣으면 여기 쌓이고, 그때부터 매뉴얼 안을 물어볼 수 있습니다.<br>" +
          "방화벽·EDR·백신처럼 <b>자주 들춰 보는 장비 문서</b>부터 넣어 두면 값이 큽니다.</div>";
        return;
      }
      box.innerHTML = arr.sort(function (a, b) { return String(b.ingestedAt).localeCompare(String(a.ingestedAt)); })
        .map(function (d) {
          return '<div class="doc"><span class="n" data-id="' + esc(d.documentId) + '">' + esc(d.documentId) + "</span>" +
            '<span class="m">' + esc(d.chunks || 0) + "조각 · " + esc(String(d.ingestedAt || "").slice(0, 10)) + "</span></div>";
        }).join("");
      box.querySelectorAll(".n").forEach(function (el) { el.addEventListener("click", function () { 읽기(el.dataset.id); }); });
    } catch (e) { box.innerHTML = '<div class="err">' + 오류문구(e, "매뉴얼 목록") + "</div>"; }
  }

  async function 읽기(id) {
    var card = document.getElementById("readCard");
    document.getElementById("readTitle").textContent = id;
    document.getElementById("readBody").textContent = "불러오는 중…";
    card.style.display = "";
    try {
      var ch = await g.memoryDocumentChunks(id, 40);
      var arr = Array.isArray(ch) ? ch : ch.chunks || [];
      document.getElementById("readBody").textContent = arr.length
        ? 다듬기(arr.map(function (c) { return typeof c === "string" ? c : (c.text || ""); }).join("\n\n"))
        : "이 문서는 조각이 없습니다 — 반입이 덜 끝났을 수 있습니다.";
    } catch (e) { document.getElementById("readBody").textContent = 오류문구(e, "문서"); }
    card.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  async function 찾기() {
    var q = String(document.getElementById("q").value || "").trim();
    var box = document.getElementById("hits"), btn = document.getElementById("askGo");
    if (!q) return;
    btn.disabled = true; box.innerHTML = '<div class="empty">찾는 중…</div>';
    try {
      var hits = await g.queryMemory(q, 4);
      var arr = (Array.isArray(hits) ? hits : []).map(function (h) { return typeof h === "string" ? h : (h.text || ""); }).filter(Boolean);
      box.innerHTML = arr.length
        ? arr.map(function (t) { var c = 다듬기(t); return '<div class="hit">' + esc(c.slice(0, 900)) + (c.length > 900 ? " …" : "") + "</div>"; }).join("")
        : '<div class="empty"><b>이 물음에 닿는 대목을 못 찾았습니다.</b><br>' +
          "매뉴얼을 아직 안 넣었거나, 말을 조금 바꾸면 닿을 수 있습니다.</div>";
    } catch (e) { box.innerHTML = '<div class="err">' + 오류문구(e, "찾기") + "</div>"; }
    btn.disabled = false;
  }

  async function 넣기() {
    var f = document.getElementById("file").files[0];
    var msg = document.getElementById("upMsg"), btn = document.getElementById("upGo");
    if (!f) { msg.innerHTML = '<div class="err">파일을 고르세요.</div>'; return; }
    btn.disabled = true; msg.innerHTML = '<div class="empty">넣는 중…</div>';
    try {
      var text = await f.text();
      await g.ingestMemoryFile(f.name, text, "global");
      // ⚠ 넣자마자 분류를 붙인다 — 안 붙이면 이 화면 목록에 안 나타난다.
      //   「넣었는데 안 보인다」가 가장 헷갈리는 실패다.
      try { await g.setDocCategory(f.name, 분류); } catch (e2) { /* 분류 실패는 아래에서 알린다 */ }
      var 붙었나 = false;
      try {
        var all = await g.listMemoryDocuments();
        붙었나 = (Array.isArray(all) ? all : all.documents || []).some(function (d) { return d.documentId === f.name && d.category === 분류; });
      } catch (e3) { /* 확인 실패는 무해 */ }
      msg.innerHTML = 붙었나
        ? '<div class="ok">넣었습니다 — 이제 위에서 찾을 수 있습니다.</div>'
        : '<div class="ok">넣었습니다.</div><div class="warn">⚠ 다만 「' + esc(분류) + '」 분류가 안 붙었습니다 — 아래 목록에 안 보일 수 있습니다.</div>';
      document.getElementById("file").value = "";
    } catch (e) { msg.innerHTML = '<div class="err">' + 오류문구(e, "매뉴얼 넣기") + "</div>"; }
    btn.disabled = false;
    목록();
  }

  function 시작() {
    document.getElementById("askGo").addEventListener("click", 찾기);
    document.getElementById("q").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); 찾기(); } });
    document.getElementById("upGo").addEventListener("click", 넣기);
    목록();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", 시작);
  else 시작();
})();
</script>
</body>
</html>
