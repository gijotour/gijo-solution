<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>GIJO AS — 우리 AI 팀 사무실</title>
<link rel="stylesheet" href="gijo-ui.css">
<style>
  /* 별도 창(시안 B) — 사이드바 없음. 사무실 뷰 + 오늘의 할일 + 팀 대화 피드 + 운영 시작 CTA.
     전부 실데이터: /api/agents 상태, /api/tasks, 협업 이벤트 WebSocket. 가짜 연출 없음. */
  :root {
    --bg: #0a0e1a; --panel: #121a2e; --panel-2: #0e1526;
    --border: rgba(255,255,255,.08); --border-strong: rgba(255,255,255,.16);
    --blue: #3b82f6; --blue-light: #5fa1ff; --teal: #1eb980; --amber: #f0a020; --red: #e2483d;
    --text: #e7eaf3; --muted: #8b93ab; --muted-2: #5f6785;
  }
  * { margin: 0; box-sizing: border-box; font-family: "Pretendard", "Malgun Gothic", "Segoe UI", sans-serif; }
  body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  .head { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px 8px; flex: 0 0 auto; }
  .h-title { font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--teal); font-weight: 700; }
  .live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--teal); animation: pulse 1.4s infinite; }
  .live.off { color: var(--red); } .live.off::before { background: var(--red); animation: none; }
  @keyframes pulse { 50% { opacity: .3; } }
  .h-right { display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: var(--muted); }
  .h-right b { color: var(--blue-light); }
  .pin { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel-2);
    color: var(--muted); cursor: pointer; font-size: 14px; }
  .pin.on { color: var(--teal); border-color: var(--teal); }
  /* 아트 무드 전환(코지/네온/딥블루) — 선택은 localStorage에 저장 */
  .theme-seg { display: flex; gap: 2px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
  .theme-seg button { width: 26px; height: 24px; border: none; border-radius: 6px; background: transparent; color: var(--muted);
    cursor: pointer; font-size: 12px; }
  .theme-seg button.on { background: rgba(59,130,246,.2); color: #fff; }

  /* A안: 방(캔버스)을 아래까지 꽉 채운다(피드 삭제). 오른쪽 할일은 슬림하게. */
  /* LIVE 로그 — 관제 로그답게 고정폭 글꼴, 한 줄 말줄임(2026-07-26). 전에는 글이 잘려 보였다. */
  .ol-feed .ol-line{display:flex;gap:8px;white-space:nowrap;font-family:"Consolas","D2Coding",monospace;font-size:11px;line-height:1.85;}
  .ol-line .ol-ts{color:#4a5570;flex:none;}
  .ol-line .ol-tag{flex:none;font-weight:700;}
  .ol-line .ol-tag.ok{color:#4fd39a}.ol-line .ol-tag.warn{color:var(--amber)}
  .ol-line .ol-tag.info{color:var(--blue-light)}.ol-line .ol-tag.crit{color:#ff7a6e}
  .ol-line .ol-msg{color:#9aa4bd;overflow:hidden;text-overflow:ellipsis;}
  .socbar{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--border);
    border-top:1px solid var(--border);border-bottom:1px solid var(--border);flex:0 0 auto;}
  .socbar .st{background:var(--panel-2);padding:7px 12px;}
  .socbar .l{font-size:10px;color:var(--muted-2);}
  .socbar .v{font-size:16px;font-weight:800;margin-top:1px;font-variant-numeric:tabular-nums;}
  .socbar .v small{font-size:10px;font-weight:600;color:var(--muted);margin-left:3px;}
  .socbar .v.red{color:#ff7a6e}.socbar .v.amber{color:var(--amber)}
  .socbar .v.teal{color:#4fd39a}.socbar .v.blue{color:var(--blue-light)}
  .body { display: grid; grid-template-columns: 236px minmax(0,1fr) 250px; grid-template-rows: minmax(0,1fr) 170px; gap: 10px; padding: 0 10px 10px; flex: 1 1 auto; min-height: 0; }
  .brief-col { grid-column: 3; grid-row: 1; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; min-height: 0; }
  .brief-col .bc-h { padding: 10px 12px 6px; font-size: 12px; font-weight: 800; color: #fff; flex: 0 0 auto; }
  .brief-col .bc-b { padding: 0 12px 10px; overflow-y: auto; overflow-x: hidden; min-height: 0; font-size: 12px; line-height: 1.7; color: var(--muted); }
  /* 창을 넓혀도 긴 단어·항목이 삐져나오지 않게 못박는다 — 잘린 글은 없느니만 못하다. */
  .brief-col .bc-b, .brief-col .bc-b * { max-width: 100%; overflow-wrap: anywhere; word-break: break-word; white-space: normal; }
  /* v5(2026-07-26): 할일=왼쪽, 오피스=중앙, LIVE 채팅=오른쪽(세션 팝업에서 이관) */
  .todo { order: 0; grid-column: 1; grid-row: 1; }
  .office-col { order: 1; grid-column: 2; grid-row: 1; } /* 위 화면 꽉 차게 */
  .olive { order: 2; grid-column: 1 / -1; grid-row: 2; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; min-height: 0; }
  .ol-h { padding: 10px 12px 6px; font-size: 12px; font-weight: 800; color: #fff; flex: 0 0 auto; }
  .ol-h .lv { font-size: 8.5px; font-weight: 800; color: #fff; background: #e2483d; border-radius: 8px; padding: 1px 6px; margin-left: 6px; letter-spacing: 1px; }
  .ol-feed { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 2px 12px 10px; }
  .ol-line { padding: 5px 0; border-bottom: 1px solid var(--border); }
  .ol-who { font-size: 10px; font-weight: 800; color: var(--blue-light, #7ab0ff); }
  .ol-msg { display: block; font-size: 11px; color: var(--muted); margin-top: 1px; line-height: 1.45; word-break: break-word; }
  .office-col { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  /* 사무실 그림은 창을 꽉 채운다(2026-07-26 사용자 지시: "여백없게").
     contain은 비율이 안 맞는 만큼 위아래·좌우에 검은 띠를 남겼다 — cover로 채우고 넘치는 만큼만 자른다
     (픽셀 그림은 늘리면 뭉개지므로 fill은 쓰지 않는다). */
  canvas { width: 100%; height: 100%; margin: 0; border-radius: 0; border: 0; background: #171f33; flex: 1 1 auto; min-height: 0; object-fit: contain; }

  /* 오른쪽: 오늘의 할일 (실 작업 큐 — /api/tasks) */
  .todo { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; min-height: 0; }
  .t-head { padding: 12px 14px 8px; font-weight: 800; font-size: 14px; display: flex; justify-content: space-between; align-items: baseline; }
  .t-cnt { color: var(--muted); font-weight: 400; font-size: 11.5px; }
  .t-add { display: flex; gap: 6px; padding: 0 12px 10px; }
  .t-add input { flex: 1; background: var(--bg); border: 1px solid var(--border-strong); border-radius: 8px; height: 34px;
    padding: 0 10px; color: var(--text); font-size: 12.5px; outline: none; min-width: 0; }
  .t-add input:focus { border-color: var(--teal); }
  .t-add button { width: 34px; height: 34px; border-radius: 8px; border: none; background: var(--teal); color: #04110b;
    font-weight: 800; font-size: 16px; cursor: pointer; flex: 0 0 auto; }
  .t-list { flex: 1 1 auto; overflow-y: auto; padding: 0 12px; min-height: 0; }
  /* ── 가이드형 브리핑 + 선택지(시안 C) ── 280px 폭 전제: 버튼을 가로로 늘어놓지 않는다. */
  .guide { margin: 8px 0 10px; }
  .g-brief { background: linear-gradient(180deg, rgba(59,130,246,.1), transparent);
             border: 1px solid var(--border-strong); border-radius: 9px; padding: 8px 10px;
             font-size: 11px; line-height: 1.6; margin-bottom: 7px; cursor: pointer; }
  .g-brief .g-by { display: block; font-size: 9.5px; font-weight: 800; color: var(--blue-light); margin-bottom: 3px; }
  /* 브리핑은 하단 접이식 참고 섹션 — 펼치면 전문을 줄임 없이 그대로 보여준다(글자 안 짤림). */
  .g-brief .g-txt { display: block; }
  /* 접이식: 기본은 한 줄(제목+배지)만. 펼쳐야 근거·대상·조치가 나온다.
     280px 패널에 5건을 다 펼쳐 놓으면 533px가 되어 브리핑이 밀려난다(실측). */
  .g-item { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
            margin-bottom: 4px; overflow: hidden; }
  .g-item.now { border-left: 3px solid var(--red); }
  .g-item.today { border-left: 3px solid var(--amber); }
  .g-head { display: flex; gap: 6px; align-items: center; padding: 6px 8px; cursor: pointer; }
  .g-head:hover { background: rgba(59,130,246,.07); }
  .g-num { width: 16px; height: 16px; border-radius: 5px; background: var(--blue); color: #fff;
           font-size: 9px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .g-t { font-size: 11px; font-weight: 700; line-height: 1.3; flex: 1; min-width: 0;
         overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .g-caret { font-size: 9px; color: var(--muted-2); flex: 0 0 auto; transition: transform .15s; }
  .g-item.open .g-caret { transform: rotate(90deg); }
  .g-item.open .g-t { white-space: normal; }
  .g-detail { display: none; padding: 0 8px 8px 30px; }
  .g-item.open .g-detail { display: block; }
  .g-s { font-size: 9.5px; color: var(--muted); word-break: break-all; }
  .g-w { font-size: 10px; color: var(--blue-light); margin-top: 3px; line-height: 1.45; }
  .g-a { font-size: 10px; color: var(--text); margin-top: 5px; line-height: 1.45; }
  .g-go { margin-top: 7px; width: 100%; background: var(--blue); color: #fff; border: none;
          border-radius: 6px; padding: 6px 10px; font-size: 10.5px; font-weight: 800; cursor: pointer; font-family: inherit; }
  .g-go:hover { filter: brightness(1.12); }
  .g-go:disabled { opacity: .5; cursor: default; }
  .g-bd { font-size: 8.5px; font-weight: 800; padding: 1px 5px; border-radius: 20px; flex: 0 0 auto;
          border: 1px solid var(--border-strong); color: var(--muted); }
  .g-bd.kev { color: #f5928a; border-color: rgba(226,72,61,.45); background: rgba(226,72,61,.12); }
  .g-more { font-size: 10px; color: var(--muted-2); text-align: center; padding: 5px;
            border: 1px dashed var(--border); border-radius: 7px; }
  /* 하단 접이식 "오늘 브리핑" — 참고용. 기본 접힘, 헤더를 누르면 전문이 펼쳐진다. */
  .brief-sec { border-top: 1px solid var(--border); margin-top: 8px; }
  .brief-toggle { display: flex; align-items: center; gap: 6px; padding: 9px 4px 8px; cursor: pointer;
                  font-size: 11.5px; font-weight: 800; color: var(--blue-light); }
  .brief-toggle .bt-hint { font-size: 9px; font-weight: 600; color: var(--muted-2); }
  .brief-toggle .bt-caret { margin-left: auto; font-size: 9px; color: var(--muted-2); transition: transform .15s; }
  .brief-sec.open .brief-toggle .bt-caret { transform: rotate(90deg); }
  .brief-body { display: none; padding-bottom: 8px; }
  .brief-sec.open .brief-body { display: block; }
  .my-h { font-size: 9.5px; font-weight: 800; color: var(--muted-2); padding: 6px 2px 2px; letter-spacing: .3px; }
  .t-item { display: flex; gap: 7px; align-items: flex-start; padding: 6px 2px; border-bottom: 1px solid var(--border); font-size: 12px; }
  .t-item input { margin-top: 2px; accent-color: var(--teal); cursor: pointer; }
  .t-item.done .t-text { opacity: .45; text-decoration: line-through; }
  .t-text { flex: 1; min-width: 0; cursor: default; word-break: break-all; }
  .t-meta { font-size: 10.5px; color: var(--muted-2); margin-top: 2px; display: flex; gap: 6px; flex-wrap: wrap; }
  .t-pri { font-weight: 800; }
  .t-pri.P0 { color: var(--red); } .t-pri.P1 { color: var(--amber); } .t-pri.P2 { color: var(--blue-light); } .t-pri.P3 { color: var(--muted-2); }
  .t-due-over { color: var(--red); font-weight: 700; }
  .t-due-today { color: var(--amber); font-weight: 700; }
  .t-del { color: var(--muted-2); cursor: pointer; font-size: 12px; padding: 0 2px; flex: 0 0 auto; }
  .t-del:hover { color: var(--red); }
  .t-empty { color: var(--muted); font-size: 12px; padding: 12px 4px; line-height: 1.6; }
  .t-more { text-align: center; color: var(--muted-2); font-size: 11px; padding: 8px 0; }

  .cta-row { padding: 10px 18px 16px; flex: 0 0 auto; }
  .cta { width: 100%; background: linear-gradient(135deg, #1eb980, #0f8f60); border: none; border-radius: 12px;
    height: 46px; color: #04110b; font-weight: 800; font-size: 14.5px; cursor: pointer;
    box-shadow: 0 4px 20px rgba(30,185,128,.3); }
  .cta:disabled { opacity: .5; cursor: wait; }
  .cta-hint { text-align: center; color: var(--muted-2); font-size: 10.5px; padding-top: 6px; }

  /* 서버 연결 실패 오버레이 */
  .dead { position: fixed; inset: 0; background: rgba(4,7,14,.85); display: none; align-items: center;
    justify-content: center; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.8; z-index: 50; }
  .dead.show { display: flex; }
</style>
</head>
<body class="g-ui">
<script>/* 대시보드 대형 팝업 임베드(2026-07-26): 자체 헤더를 숨겨 이중 타이틀 방지 */
if(location.search.indexOf("embed=1")>=0)document.documentElement.classList.add("office-embed");</script>
<style>.office-embed .head{display:none!important}</style>
  <div class="head">
    <div class="h-title">🏢 보안팀 사무실 <span class="live" id="liveBadge">LIVE</span></div>
    <div class="h-right">
      <span id="statLine">에이전트 불러오는 중…</span>
      <div class="theme-seg" id="themeSeg" title="사무실 무드">
        <button data-theme="cozy" title="코지 우드">☀</button>
        <button data-theme="neon" title="네온 SOC">🌃</button>
        <button data-theme="deep" title="딥 블루">🌊</button>
      </div>
    </div>
  </div>

  <!-- 관제 상태 띠(2026-07-26 재설계) — 보안 화면은 "지금 위험한가"가 먼저 보여야 한다. -->
  <div class="socbar" id="socBar">
    <div class="st"><div class="l">미조치 취약점</div><div class="v red" id="socOpen">-</div></div>
    <div class="st"><div class="l">실제 악용(KEV)</div><div class="v amber" id="socKev">-</div></div>
    <div class="st"><div class="l">오늘 처리</div><div class="v teal" id="socDone">-</div></div>
    <div class="st"><div class="l">AI 엔진</div><div class="v teal" id="socEngine">-</div></div>
    <div class="st"><div class="l">근무 중</div><div class="v blue" id="socStaff">-</div></div>
  </div>

  <div class="body">
    <div class="office-col">
      <!-- A안: 팀 대화 피드 삭제 — 대화는 캐릭터 말풍선 + 대시보드 실시간 세션에서 확인. 방을 아래까지 꽉. -->
      <canvas id="office"></canvas>
    </div>
    <!-- 오늘 브리핑 — 왼쪽 할일 패널 안에 접혀 있던 것을 오른쪽 열로 뺐다(2026-07-26 사용자 요청).
         자리가 넓어져 접지 않고 그대로 보여준다. -->
    <div class="brief-col">
      <div class="bc-h">🧭 오늘 브리핑</div>
      <div class="bc-b" id="guideBox" style="display:none">
        <div class="g-brief" id="guideBrief"></div>
        <div id="guideList"></div>
        <div class="g-more" id="guideMore" style="display:none"></div>
      </div>
      <div class="bc-b" id="guideEmpty" style="font-size:11.5px;color:var(--muted-2)">브리핑을 불러오는 중…</div>
    </div>
    <!-- 사무실 LIVE 채팅 — 작업 세션 팝업에서 이관(2026-07-26 사용자 결정) -->
    <div class="olive"><div class="ol-h">사무실 LIVE 채팅<span class="lv">LIVE</span></div>
      <div class="ol-feed" id="oliveFeed"><div style="font-size:11px;color:var(--muted-2);padding:6px 0">팀이 움직이면 대화가 여기 실시간으로 흐릅니다.</div></div></div>
    <div class="todo">
      <!-- ⚠ 읽기 전용이다(2026-07-31). 같은 목록을 대시보드·이 창·'내 업무' 세 군데서 각각
           적어 넣고 있었다(전부 /api/tasks). 적어 넣는 창구는 '내 업무' 하나로 모았다 —
           거기서는 적으면 그 일을 어떤 순서로 하는지까지 안내받는다. 여기는 팀이 뭘 하는지
           보는 창이므로 "지금 뭐가 남았나"만 보여준다. -->
      <div class="t-head">☑ 오늘의 할일 <span class="t-cnt" id="todoCnt"></span></div>
      <div class="t-add">
        <button id="todoOpenBtn" style="width:100%" title="내 업무 화면에서 적고 진행합니다">내 업무에서 열기 →</button>
      </div>
      <div class="t-list" id="todoList">
        <div id="myTasks"><div class="t-empty">불러오는 중…</div></div>
      </div>
    </div>
  </div>

  <div class="cta-row">
    <button class="cta" id="ctaBtn">▶ 운영 시작 — AI 팀에게 맡기기</button>
    <div class="cta-hint">할 일이 비어 있으면 AI가 오늘의 루틴을 채우고, 있으면 최우선 할 일을 오케스트레이터에게 지시합니다 (쓰기 작업은 결재판 승인 후에만 실행)</div>
  </div>

  <div class="dead" id="deadOverlay"><div>⚠ 서버에 연결할 수 없습니다.<br>메인 창에서 로그인 상태를 확인한 뒤 이 창을 다시 열어주세요.</div></div>

<script>
(function () {
  "use strict";
  const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  // ── 픽셀 사무실 렌더러 — 시안 B 목업(pixel-office)을 실데이터 구동형으로 옮김 ──
  // 상태 의미: working=타이핑+초록 모니터, watching=주황 모니터·정지, idle=자리 비움(배회).
  // 말풍선은 연출이 아니라 실제 협업 이벤트(collaboration:event)의 message를 띄운다.
  const PALETTE = ["#5fa1ff", "#1eb980", "#8b7cf0", "#f0a020", "#e2483d", "#7dd3c0"];
  const office = (function () {
    const canvas = document.getElementById("office");
    const ctx = canvas.getContext("2d");
    // 방 비율은 화면 칸 비율에 맞춰 "그때그때" 정한다(2026-07-26).
    // 고정 비율로 두면 옆에 패널이 하나 붙는 순간 다시 어긋난다 — 잘리거나(cover) 여백이 생긴다(contain).
    // 세로 칸 수는 고정하고 가로 칸 수만 칸 비율에서 계산한다.
    const ROWS = 18, S = 4;
    const H = ROWS * 8;
    function colsForBox() {
      const box = canvas.parentElement ? canvas.parentElement.getBoundingClientRect() : null;
      const ratio = box && box.height > 0 && box.width > 0 ? box.width / box.height : 40 / 18;
      return Math.max(22, Math.min(64, Math.round(ROWS * ratio)));
    }
    let COLS = colsForBox();
    let W = COLS * 8;
    canvas.width = W * S; canvas.height = H * S;
    canvas.style.imageRendering = "pixelated";
    // 창 크기가 바뀌면 방 가로 칸 수를 다시 계산한다(2026-07-26 사용자 지적: "가로세로 같이 맞춰야").
    // 한 번만 계산하면 창을 세로로 길게 늘였을 때 위·아래에 큰 빈 공간이 남는다.
    function fitRoom() {
      const next = colsForBox();
      if (next === COLS) return;
      COLS = next; W = COLS * 8;
      canvas.width = W * S; canvas.height = H * S;
      for (let i = 0; i < DESKS.length; i++) DESKS[i] = deskAt(i); // 자리도 새 폭에 맞춰 다시 편다
      for (const a of agents) if (a.x > W - 10) a.x = W - 10; // 폭이 줄면 밖에 있던 사람을 안으로
    }
    let fitTimer = null;
    window.addEventListener("resize", () => {
      clearTimeout(fitTimer);
      fitTimer = setTimeout(fitRoom, 120); // 드래그 중 매 프레임 다시 만들지 않게
    });

    const WALL_H = 14;
    // 중간 열을 위로 올려(6.6→5.4) 에이전트 서는 자리가 미팅룸(하단)과 겹치지 않게 한다(2026-07-23 정돈).
    // 왼쪽 = 보안담당자 업무존, 오른쪽 = 미팅룸으로 확실히 나눈다(2026-07-26 사용자 지시).
    // 방 폭이 달라져도 담당자 자리는 늘 왼쪽 구역(0~55%) 안에서 3열 2행으로 펴진다.
    // 좌우로 나누려면 폭이 있어야 한다 — 좁은 창에서 억지로 나누면 책상이 미팅룸을 침범한다(실측).
    // 넓으면 왼쪽=업무존/오른쪽=미팅룸, 좁으면 위=업무존/아래=미팅룸으로 자동 전환한다.
    const SIDE_BY_SIDE_MIN_W = 300;
    const sideBySide = () => W >= SIDE_BY_SIDE_MIN_W;
    const MEET_FRAC = 0.58;
    function deskAt(i) {
      if (sideBySide()) {
        const cols = 2, col = i % cols, row = Math.floor(i / cols);
        const left = 22, right = Math.round(W * MEET_FRAC) - 22;
        const stepX = (right - left) / cols;
        return { x: (left + stepX * (col + 0.5)) / 8, y: 2 + row * 4.6 };
      }
      const cols = 3, col = i % cols, row = Math.floor(i / cols);
      const stepX = Math.max(48, (W - 40) / cols);
      return { x: (20 + stepX * (col + 0.5)) / 8, y: 2 + row * 3.4 };
    }
    const DESKS = [0, 1, 2, 3, 4, 5].map(deskAt);
    // 방을 세로로 키운 만큼(ROWS 12→18) 앞쪽(하단) 요소는 아래로 내려 균형을 맞춘다 — 바닥이 넓어져 위·아래가 꽉 찬다.
    const COFFEE = { x: 156, y: 134 }; // 커피 코너(픽셀 좌표)
    const TABLE = { x: 78, y: 104 };   // 라운지 소파존(중앙 바닥을 채운다)
    // 미팅룸(2026-07-23) — 외부 방문자가 여기 앉아 보안총괄에게 지시하고, 보안총괄이 합석한다.
    // 유리 파티션으로 내부 업무존과 분리(외부인은 내부 책상에 직접 접근하지 않는다).
    // 오른쪽 빈 바닥에 배치한다(2026-07-26 사용자 요청: "외부 손님도 오른쪽에서 미팅하는 걸로").
    // 방을 가로로 넓히며 생긴 공간이고, 출입문도 오른쪽이라 동선이 자연스럽다.
    // 오른쪽 끝을 기준으로 잡는다 — 가로 칸 수가 달라져도 늘 오른쪽 자리에 있다.
    // 오른쪽 끝 기준 — 가로 칸 수(W)가 달라지면 함께 따라온다. 그래서 상수가 아니라 함수다.
    // 오른쪽 절반이 통째로 미팅룸 — 왼쪽 업무존과 확실히 나눈다(2026-07-26 사용자 지시).
    const ml = () => (sideBySide() ? Math.round(W * MEET_FRAC) : Math.max(20, W - 120));
    const mr = () => W - 8;
    const MEETING = {
      get x0() { return ml(); }, get y0() { return sideBySide() ? 22 : 92; },
      get x1() { return mr(); }, get y1() { return H - 12; },
    };
    const MTABLE = {
      get x() { return Math.round((ml() + mr()) / 2) - 14; },
      get y() { return Math.round((MEETING.y0 + MEETING.y1) / 2) - 6; }, w: 28, h: 12,
    };
    // 테이블 둘레로 차례대로 앉힌다.
    function meetingSeat(slot) {
      const cx = Math.round((ml() + mr()) / 2), cy = Math.round((MEETING.y0 + MEETING.y1) / 2);
      const seats = [
        { x: cx - 24, y: cy - 4 }, { x: cx + 16, y: cy - 4 },
        { x: cx - 24, y: cy + 14 }, { x: cx + 16, y: cy + 14 },
        { x: cx - 4, y: cy + 24 },
      ];
      return seats[slot % seats.length];
    }
    // 보안총괄 합석 위치 — 테이블 왼쪽 끝(2026-07-26 사용자 지적: 테이블 위 가운데면 방문자·말풍선과 겹쳤다).
    function meetingHost() { return { x: MTABLE.x - 14, y: MTABLE.y + 6 }; }
    // 외부 콘솔 접속자(클라이언트): 오른쪽 벽 출입문으로 걸어 들어와 보안총괄(오케스트레이터)
    // 책상 옆으로 가서 지시한다 — 회의 테이블 합석에서 "보안총괄에게 직접 지시" 구도로 변경(2026-07-22).
    const DOOR = { get x() { return W - 8; }, y: 46 };  // 오른쪽 벽 출입문 — 폭이 바뀌어도 따라온다
    let orchestratorIdx = 0; // 보안총괄 = 오케스트레이터 에이전트의 책상 인덱스(setAgents에서 갱신)
    // 보안총괄 책상 오른쪽에 줄지어 서는 지시 위치(여러 명이면 옆으로 늘어선다).
    function directingSpot(slot) {
      const d = DESKS[orchestratorIdx] || DESKS[0];
      const homeX = d.x * 8 + 8, homeY = d.y * 8 + 26;
      return { x: homeX + 16 + slot * 9, y: homeY };
    }
    const VISITOR_COLORS = ["#e2b0ff", "#ffd28a", "#9fe8ff", "#ffb3c1", "#c5f0a4"];
    // 팀은 남녀가 섞여 있고 생김새도 제각각이다(2026-07-26 사용자 지적 — 다섯이 다 똑같아 보였다).
    // 자리(desk 번호)마다 머리 모양·머리색·피부톤을 고정해 늘 같은 사람으로 보이게 한다.
    const LOOKS = [
      { hair: "short", col: "#2b2f45", skin: "#e8c39e" },
      { hair: "long",  col: "#4a3020", skin: "#f0d6b4" },
      { hair: "bun",   col: "#1e2230", skin: "#e8c39e" },
      { hair: "curly", col: "#4a3020", skin: "#d9ab7e" },
      { hair: "short", col: "#5a5a62", skin: "#e8c39e" },
      { hair: "long",  col: "#1e2230", skin: "#d9ab7e" },
    ];

    // 아트 무드 3종 — 사용자 전환(☀🌃🌊), 선택은 localStorage 저장. 레이아웃·동작은 동일.
    const THEMES = {
      cozy: { wallTop: "#2a2320", base: "#241d18", floorA: "#5a4632", floorB: "#514029", plank: "rgba(0,0,0,.18)", grid: null,
        rug: ["#1eb980", "#17a06e"], deskTop: "#7a5a3a", deskFace: "#5f4530", deskEdge: "#8f6c48",
        skyTop: "#7fb2e8", skyBottom: "#cfe3f5", sun: "#ffe9a8", sign: null, accent: "#f0a020", shaft: "rgba(255,236,180,.05)" },
      neon: { wallTop: "#0a0f1e", base: "#060a14", floorA: "#101828", floorB: "#0c1220", plank: null, grid: "rgba(64,220,255,.10)",
        rug: ["#12335a", "#0e2846"], deskTop: "#2a3a55", deskFace: "#1d2a40", deskEdge: "#3b5378",
        skyTop: "#0b1030", skyBottom: "#25164a", sun: "#cfd8ff", sign: "GIJO SOC", accent: "#40dcff", shaft: "rgba(64,220,255,.045)" },
      deep: { wallTop: "#0e1526", base: "#0a1120", floorA: "#1c2440", floorB: "#171e35", plank: null, grid: "rgba(255,255,255,.03)",
        rug: ["#31406e", "#283457"], deskTop: "#5a4632", deskFace: "#463626", deskEdge: "#6d563e",
        skyTop: "#1c2c55", skyBottom: "#3a2c66", sun: "#ffe9a8", sign: null, accent: "#5fa1ff", shaft: "rgba(160,190,255,.05)" },
    };
    let T = THEMES[localStorage.getItem("gijo:office:theme") || "neon"] || THEMES.neon;
    function setTheme(name) { if (THEMES[name]) { T = THEMES[name]; localStorage.setItem("gijo:office:theme", name); } }
    let agents = []; // {name, shortName, color, state, x, y, wanderT, desk, visit?, moving}
    let visitors = []; // {username, color, x, y, seat, phase: enter|seated|leave, moving}
    let bubble = null; // {agentIdx, msg, ttl}
    let sparkles = []; // 작업 완료 ✓ 파티클 {x, y, life}
    let steam = []; // 커피머신 김 {x, y, life}
    let doorOpenT = 0; // >0이면 문 열림 연출
    let t = 0;

    function px(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x * S), Math.round(y * S), w * S, h * S); }

    function setAgents(list) {
      agents = list.slice(0, 6).map((a, i) => {
        const prev = agents[i];
        return {
          name: a.name, shortName: shortName(a.name), color: PALETTE[i % PALETTE.length],
          state: a.status,
          x: prev ? prev.x : DESKS[i].x * 8 + 8,
          y: prev ? prev.y : DESKS[i].y * 8 + 26,
          wanderT: prev ? prev.wanderT : 0,
          desk: i,
        };
      });
      // 보안총괄(오케스트레이터) 캐릭터를 이름으로 찾는다 — 방문자가 이 책상 옆으로 가 지시한다.
      const oi = agents.findIndex((a) => /orchestr|총괄|지휘|chief|lead/i.test(a.name));
      orchestratorIdx = oi >= 0 ? oi : 0;
    }
    function shortName(name) {
      // "Security Orchestrator" → "Orchestrator" 같은 축약 — 캔버스 라벨용
      const s = String(name).replace(/\s*Agent$/i, "").replace(/^Security\s+/i, "");
      return s.length > 12 ? s.slice(0, 12) : s;
    }
    // 협업 이벤트 발신자 이름으로 캐릭터를 찾아 말풍선을 띄운다. 못 찾으면 무시(피드에는 남음).
    function agentIdxByName(name) {
      if (!name) return -1;
      const n = String(name).toLowerCase();
      return agents.findIndex((a) => a.name.toLowerCase() === n || n.indexOf(a.shortName.toLowerCase()) >= 0 || a.name.toLowerCase().indexOf(n) >= 0);
    }
    function showBubble(fromName, msg) {
      const idx = agentIdxByName(fromName);
      if (idx < 0) return;
      bubble = { agentIdx: idx, msg: String(msg).slice(0, 60), ttl: 260 };
    }
    // 협업 이벤트 from→to: from 캐릭터가 to 책상까지 걸어가 말풍선을 띄우고 잠시 머문 뒤 복귀한다.
    function collabMove(fromName, toName, msg) {
      const fi = agentIdxByName(fromName), ti = agentIdxByName(toName);
      if (fi < 0) { showBubble(fromName, msg); return; }
      if (ti < 0 || ti === fi) { showBubble(fromName, msg); return; }
      agents[fi].visit = { to: ti, phase: "go", holdT: 170 };
      bubble = { agentIdx: fi, msg: String(msg).slice(0, 60), ttl: 420 };
    }
    // 작업 완료 ✓ 파티클 — 지정 위치가 없으면 회의 테이블 위에서 터진다.
    function sparkle(x, y) {
      const cx = x == null ? 92 : x, cy = y == null ? 60 : y;
      for (let i = 0; i < 7; i++) sparkles.push({ x: cx + (Math.random() * 16 - 8), y: cy + (Math.random() * 8 - 4), life: 40 + Math.random() * 20 });
    }
    // 접속자 목록 반영: 새 접속자는 문에서 입장해 보안총괄 옆 지시 위치로, 사라진 접속자는 문으로 퇴장.
    function setVisitors(list) {
      const seen = new Set(list.map((v) => v.username));
      list.forEach((v) => {
        if (visitors.some((x) => x.username === v.username)) return;
        const used = new Set(visitors.map((x) => x.slot));
        let slot = 0; while (used.has(slot)) slot++; // 보안총괄 옆으로 줄지어 선다
        visitors.push({
          username: v.username,
          color: VISITOR_COLORS[visitors.length % VISITOR_COLORS.length],
          x: DOOR.x - 4, y: DOOR.y + 16, slot, phase: "enter", moving: true,
        });
        doorOpenT = 55;
      });
      visitors.forEach((v) => {
        if (!seen.has(v.username) && v.phase !== "leave") { v.phase = "leave"; doorOpenT = 55; }
      });
    }
    // 목표 지점으로 한 걸음 — 도착하면 true. moving 플래그로 걷기 애니메이션을 켠다.
    function walkTo(o, tx, ty, speed) {
      const dx = tx - o.x, dy = ty - o.y;
      if (Math.abs(dx) < speed && Math.abs(dy) < speed) { o.x = tx; o.y = ty; o.moving = false; return true; }
      o.x += Math.sign(dx) * Math.min(speed, Math.abs(dx));
      o.y += Math.sign(dy) * Math.min(speed, Math.abs(dy));
      o.moving = true;
      return false;
    }

    function plantAt(x, y) {
      px(x + 1, y - 8, 6, 8, "#2c7a4a"); px(x, y - 5, 3, 4, "#2c5a3a"); px(x + 5, y - 6, 3, 4, "#2c5a3a");
      px(x + 1, y, 6, 5, "#a06a3c"); px(x + 1, y, 6, 1, "#c08a52");
    }
    function drawRoom() {
      // 바닥(테마: 원목/네온그리드/딥)
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) px(c * 8, r * 8, 8, 8, (r + c) % 2 ? T.floorA : T.floorB);
      if (T.plank) for (let r = 2; r < ROWS; r++) px(0, r * 8, W, 0.5, T.plank);
      if (T.grid) for (let c = 0; c < COLS; c++) px(c * 8, WALL_H, 0.5, H - WALL_H, T.grid);
      // 벽 + 걸레받이
      px(0, 0, W, WALL_H - 2, T.wallTop); px(0, WALL_H - 2, W, 2, T.base);
      // 창문 3개 — 하늘 그라데이션 + 해/달 + 빛기둥
      for (let i = 0; i < 3; i++) {
        const wx = 16 + i * 52;
        px(wx - 1, 1, 26, 10, T.base);
        px(wx, 2, 24, 5, T.skyTop); px(wx, 7, 24, 3, T.skyBottom);
        px(wx + 18, 3, 3, 3, T.sun);
        px(wx + 11, 2, 1, 8, T.base);
        ctx.fillStyle = T.shaft; ctx.fillRect((wx - 2) * S, 11 * S, 28 * S, 30 * S);
      }
      // 벽 장식: 방패 로고·시계·(네온 테마) 사인
      px(4, 3, 8, 8, T.base); px(5, 4, 6, 5, T.accent); px(7, 5, 2, 4, "#fff");
      px(100, 3, 7, 7, "#e7eaf3"); px(102, 4, 1, 3, "#333"); px(103, 6, 2, 1, "#333"); px(100, 3, 7, 1, T.base);
      if (T.sign) { ctx.font = `bold ${4 * S}px monospace`; ctx.fillStyle = T.accent; ctx.shadowColor = T.accent; ctx.shadowBlur = 6; ctx.fillText(T.sign, 148 * S, 8 * S); ctx.shadowBlur = 0; }
      // 러그 + 회의 테이블(3톤 음영 + 서류)
      px(TABLE.x - 12, TABLE.y - 12, 52, 24, T.rug[0]); px(TABLE.x - 10, TABLE.y - 10, 48, 20, T.rug[1]);
      px(TABLE.x, TABLE.y - 2, 28, 4, T.deskEdge); px(TABLE.x, TABLE.y + 2, 28, 8, T.deskTop); px(TABLE.x, TABLE.y + 10, 28, 3, T.deskFace);
      px(TABLE.x + 4, TABLE.y + 3, 5, 3, "#e7eaf3"); px(TABLE.x + 18, TABLE.y + 4, 5, 3, "#cfd8ff");
      // 작업존 러그(위쪽 데스크 뱅크를 시각적으로 묶는다) — 존 분리(gather.town식 배치 참고)
      px(2, 22, 68, 30, "rgba(59,130,246,.05)"); px(2, 22, 68, 0.5, "rgba(95,161,255,.2)");
      // 서버랙(SOC 정체성) — 오른쪽 벽, 깜빡이는 LED 랙 2기
      for (let k = 0; k < 2; k++) {
        const rx = 150 + k * 12, ry = 22;
        px(rx, ry, 10, 30, "#0c1220"); px(rx, ry, 10, 1, "#2a3a55"); px(rx, ry, 1, 30, "#2a3a55"); px(rx + 9, ry, 1, 30, "#1a2740");
        for (let u = 0; u < 6; u++) {
          px(rx + 1, ry + 3 + u * 4, 8, 2, "#141c2e");
          const led = (t + k * 7 + u * 3) % 40 < 20 ? (u % 2 ? "#1eb980" : "#40dcff") : "#20304e";
          px(rx + 7, ry + 3 + u * 4, 1, 1, led);
        }
      }
      // 화분·책장·커피 코너 — 좌하단 화분은 넓어진 바닥 하단으로.
      plantAt(4, 130); plantAt(W - 10, 20);
      px(W - 26, 16, 14, 16, T.deskFace);
      for (let i = 0; i < 3; i++) px(W - 25, 18 + i * 5, 12, 3, ["#e2483d", "#5fa1ff", "#f0a020"][i]);
      px(COFFEE.x - 2, COFFEE.y - 12, 14, 16, T.deskFace);
      px(COFFEE.x, COFFEE.y - 10, 10, 12, "#3a4258");
      px(COFFEE.x + 2, COFFEE.y - 8, 6, 3, "#e2483d"); px(COFFEE.x + 3, COFFEE.y - 2, 3, 2, "#e7eaf3");
      // 미팅룸 — 유리 파티션 바닥 + 상판 유리벽 + 미팅 테이블 + 의자 + 라벨.
      const m = MEETING;
      ctx.fillStyle = "rgba(64,160,255,.06)"; ctx.fillRect(m.x0 * S, m.y0 * S, (m.x1 - m.x0) * S, (m.y1 - m.y0) * S);
      // 유리 파티션(상단·좌·우 라인, 문은 아래쪽에서 들어옴)
      px(m.x0, m.y0, m.x1 - m.x0, 0.6, "rgba(95,161,255,.5)");
      px(m.x0, m.y0, 0.6, m.y1 - m.y0, "rgba(95,161,255,.4)");
      px(m.x1 - 0.6, m.y0, 0.6, m.y1 - m.y0, "rgba(95,161,255,.4)");
      // 미팅 테이블(둥근 상판 느낌 + 서류)
      px(MTABLE.x - 1, MTABLE.y - 1, MTABLE.w + 2, 2, T.deskEdge);
      px(MTABLE.x, MTABLE.y + 1, MTABLE.w, MTABLE.h, T.deskTop);
      px(MTABLE.x, MTABLE.y + MTABLE.h + 1, MTABLE.w, 2, T.deskFace);
      px(MTABLE.x + 4, MTABLE.y + 2, 5, 3, "#e7eaf3"); px(MTABLE.x + 15, MTABLE.y + 2, 5, 3, "#cfd8ff");
      // 의자(상단 헤드=보안총괄, 하단=방문자)
      px(MTABLE.x + 5, MTABLE.y - 5, 4, 3, "#33405e");
      px(MTABLE.x + 4, MTABLE.y + MTABLE.h + 3, 4, 3, "#33405e"); px(MTABLE.x + 14, MTABLE.y + MTABLE.h + 3, 4, 3, "#33405e");
      // 라벨 — 방 상단 모서리(캐릭터·테이블과 겹치지 않게 작게)
      ctx.font = `bold ${2.6 * S}px 'Malgun Gothic',monospace`; ctx.fillStyle = "rgba(95,161,255,.75)";
      ctx.fillText("🔒 MEETING ROOM", (m.x0 + 2) * S, (m.y0 - 1.5) * S);

      // 출입문(프레임+명패) — 접속/퇴장 때 doorOpenT 동안 열린다
      px(DOOR.x - 1, DOOR.y - 1, 9, 18, T.deskEdge);
      if (doorOpenT > 0) { px(DOOR.x, DOOR.y, 8, 16, "#0d1322"); px(DOOR.x + 5, DOOR.y + 1, 2, 14, T.deskFace); }
      else { px(DOOR.x, DOOR.y, 8, 16, T.deskFace); px(DOOR.x + 1, DOOR.y + 7, 1, 2, "#f0a020"); }
      // 책상들(그림자·3톤·키보드·머그·서류·모니터 헤일로+스캔라인)
      DESKS.forEach((d, i) => {
        const a = agents[i];
        const dx = d.x * 8, dy = d.y * 8;
        ctx.fillStyle = "rgba(0,0,0,.22)"; ctx.fillRect(dx * S, (dy + 15) * S, 24 * S, 3 * S);
        px(dx, dy + 6, 24, 2, T.deskEdge); px(dx, dy + 8, 24, 6, T.deskTop); px(dx, dy + 14, 24, 2, T.deskFace);
        px(dx + 1, dy + 16, 3, 4, T.deskFace); px(dx + 20, dy + 16, 3, 4, T.deskFace);
        px(dx + 8, dy + 11, 7, 2, "#141a2b");
        px(dx + 18, dy + 9, 3, 3, "#e2483d");
        px(dx + 2, dy + 9, 4, 2, "#e7eaf3");
        const st = a ? a.state : "idle";
        const on = st !== "idle";
        const glow = st === "working" ? (Math.floor(t / 20) % 2 ? "#2ee6a0" : "#1eb980") : st === "watching" ? "#f0a020" : "#232c44";
        if (on) { ctx.fillStyle = st === "working" ? "rgba(46,230,160,.10)" : "rgba(240,160,32,.10)"; ctx.fillRect((dx + 5) * S, (dy - 4) * S, 14 * S, 12 * S); }
        px(dx + 7, dy - 2, 10, 8, "#05070d");
        px(dx + 8, dy - 1, 8, 6, glow);
        if (on && Math.floor(t / 30) % 3 === 0) px(dx + 9, dy, 4, 1, "rgba(255,255,255,.5)");
        px(dx + 11, dy + 6, 2, 2, "#39445f");
      });
    }

    // 걷는 중이면 두 다리를 엇갈리게 — 정지 시엔 다리 한 줄.
    function drawLegs(wx, wy, moving) {
      if (moving) {
        const ph = Math.floor(t / 6) % 2;
        px(wx + 1, wy + (ph ? 0 : 1), 2, ph ? 2 : 1, "#22263a");
        px(wx + 3, wy + (ph ? 1 : 0), 2, ph ? 1 : 2, "#22263a");
      } else {
        px(wx + 1, wy, 2, 1, "#22263a"); px(wx + 3, wy, 2, 1, "#22263a");
      }
    }
    function nameTag(text, cx, cy, color) {
      ctx.font = `${3 * S}px 'Malgun Gothic',sans-serif`;
      ctx.fillStyle = color;
      const tw = ctx.measureText(text).width;
      ctx.fillText(text, cx * S - tw / 2, cy * S);
    }
    // 공용 도트 캐릭터 — 외곽선·눈·셔츠 음영·팔·걷기 다리. (x,y)=발 기준.
    function drawChar(x, y, shirt, hair, o) {
      const bob = o.typing && !o.moving ? Math.floor(t / 12) % 2 : 0;
      px(x - 1, y - 15 + bob, 8, 15 - bob, "rgba(5,8,14,.55)"); // 외곽선
      drawLegs(x, y - 2, o.moving);
      px(x, y - 8 + bob, 7, 6, shirt); px(x + 5, y - 8 + bob, 2, 6, "rgba(0,0,0,.25)");
      px(x - 1, y - 7 + bob, 1, 4, shirt); px(x + 7, y - 7 + bob, 1, 4, shirt); // 팔
      if (o.typing && !o.moving) px(x - 1 + (bob ? 1 : 0), y - 4, 2, 2, "#e8c39e");
      const skin = o.skin || "#e8c39e";
      px(x + 1, y - 13 + bob, 5, 5, skin); // 얼굴
      px(x + 2, y - 11 + bob, 1, 1, "#1c1f2b"); px(x + 4, y - 11 + bob, 1, 1, "#1c1f2b"); // 눈
      // 머리 모양 — short(짧은) · long(긴) · bun(묶은) · curly(곱슬)
      const hs = o.hairStyle || "short";
      px(x, y - 15 + bob, 7, 3, hair);
      if (hs === "long") {
        px(x - 1, y - 13 + bob, 2, 6, hair); px(x + 6, y - 13 + bob, 2, 6, hair);
      } else if (hs === "bun") {
        px(x, y - 13 + bob, 1, 2, hair); px(x + 6, y - 13 + bob, 1, 2, hair);
        px(x + 2, y - 17 + bob, 3, 2, hair);
      } else if (hs === "curly") {
        px(x, y - 13 + bob, 1, 3, hair); px(x + 6, y - 13 + bob, 1, 3, hair);
        px(x, y - 16 + bob, 2, 1, hair); px(x + 5, y - 16 + bob, 2, 1, hair);
      } else {
        px(x, y - 13 + bob, 1, 2, hair); px(x + 6, y - 13 + bob, 1, 2, hair);
      }
      // 헤드셋 — 관제 요원임을 드러낸다(머리 모양을 가리지 않게 바깥쪽에만).
      px(x - 1, y - 13 + bob, 1, 3, "#4a5878"); px(x + 7, y - 13 + bob, 1, 3, "#4a5878");
      px(x, y - 16 + bob, 7, 1, "#4a5878");
      if (o.typing) px(x - 1, y - 10 + bob, 1, 1, "#2ee6a0"); // 마이크 불(작업 중)
      if (o.dot) px(x + 3, y - 18, 2, 2, o.dot);
      if (o.tag) nameTag(o.tag, x + 3.5, y + 5, o.tagColor || "rgba(231,234,243,.8)");
    }
    function drawAgent(a) {
      const wy = a.y + (a.state === "idle" && !a.moving ? Math.sin(t / 30 + a.desk) * 1.5 : 0);
      const dot = a.state === "working" ? "#2ee6a0" : a.state === "watching" ? "#f0a020" : "#5f6785";
      const look = LOOKS[a.desk % LOOKS.length];
      drawChar(a.x, wy, a.color, look.col, {
        typing: a.state === "working", moving: a.moving, dot, tag: a.shortName,
        hairStyle: look.hair, skin: look.skin,
      });
    }
    // 외부 콘솔 접속자(클라이언트) — 셔츠는 개인색, 머리는 갈색, 이름표는 노란빛(사람임을 구분).
    // 지시 중이면 이름 앞에 🧑을 붙이고, 보안총괄 쪽으로 "지시" 말풍선을 띄운다.
    function drawVisitor(v) {
      // 지시 연출은 없앴다(2026-07-26) — 앉아 있으면 살짝 흔들리는 정도만 남긴다.
      const seated = v.phase === "seated";
      const wy = v.y + (seated ? Math.sin(t / 40 + v.slot) * 1 : 0);
      const tag = v.username;
      drawChar(v.x, wy, v.color, "#4a3020", { moving: v.moving, tag, tagColor: "#ffe9a8" });

    }
    // 방문자 머리 위 "지시 ▸" 말풍선 — 보안총괄에게 업무를 지시하는 중임을 나타낸다.
    function drawDirectBubble(x, y) {
      const msg = "지시 ▸";
      ctx.font = `${3 * S}px 'Malgun Gothic',sans-serif`;
      const tw = ctx.measureText(msg).width;
      const w = tw + 3 * S, h = 5 * S;
      const bx = Math.max(1 * S, (x + 3.5) * S - w / 2);
      const by = (y - 26) * S;
      ctx.fillStyle = "#ffe9a8";
      ctx.fillRect(bx, by, w, h);
      ctx.fillRect((x + 2) * S, by + h, 2 * S, 2 * S); // 꼬리
      ctx.fillStyle = "#3a2c00";
      ctx.fillText(msg, bx + 1.5 * S, by + 3.7 * S);
    }
    function drawParticles() {
      // 커피 김 — 위로 올라가며 옅어진다
      steam.forEach((s) => { ctx.fillStyle = `rgba(200,210,230,${s.life / 90})`; ctx.fillRect(Math.round(s.x * S), Math.round(s.y * S), S, S); });
      // 작업 완료 ✓ — 초록 반짝이
      sparkles.forEach((p) => {
        ctx.fillStyle = `rgba(30,185,128,${Math.min(1, p.life / 30)})`;
        ctx.fillRect(Math.round(p.x * S), Math.round(p.y * S), S, S);
        if (p.life > 20) { ctx.fillRect(Math.round((p.x - 1) * S), Math.round(p.y * S), S, S); ctx.fillRect(Math.round((p.x + 1) * S), Math.round(p.y * S), S, S); }
      });
    }

    function drawBubble() {
      if (!bubble || bubble.ttl <= 0) return;
      const a = agents[bubble.agentIdx];
      if (!a) return;
      ctx.font = `${3.4 * S}px 'Malgun Gothic',sans-serif`;
      const tw = ctx.measureText(bubble.msg).width;
      const w = Math.min(tw + 4 * S, (W - 8) * S);
      const bx = Math.max(2 * S, Math.min((a.x + 3.5) * S - w / 2, (W - 2) * S - w));
      const by = (a.y - 28) * S;
      ctx.fillStyle = "#f4f6fb";
      ctx.fillRect(bx, by, w, 6 * S);
      ctx.fillRect((a.x + 3) * S, by + 6 * S, 2 * S, 2 * S);
      ctx.fillStyle = "#0a0e1a";
      ctx.fillText(bubble.msg, bx + 2 * S, by + 4.4 * S);
    }

    function step() {
      t++;
      if (bubble) bubble.ttl--;
      if (doorOpenT > 0) doorOpenT--;
      // 커피 김 — 주기적으로 피어오른다
      if (t % 26 === 0) steam.push({ x: COFFEE.x + 3 + Math.random() * 3, y: COFFEE.y - 12, life: 90 });
      steam.forEach((s) => { s.y -= 0.18; s.x += Math.sin(t / 10 + s.life) * 0.08; s.life--; });
      steam = steam.filter((s) => s.life > 0);
      sparkles.forEach((p) => { p.y -= 0.25; p.life--; });
      sparkles = sparkles.filter((p) => p.life > 0);

      // 미팅룸에 방문자가 지시 중이면 보안총괄이 합석 위치로 간다(회의 참석).
      const meetingActive = false; // 합석 없음(2026-07-26) — 담당자는 자기 자리에서 일한다
      agents.forEach((a, ai) => {
        const hx = DESKS[a.desk].x * 8 + 8, hy = DESKS[a.desk].y * 8 + 26;
        // 보안총괄(오케스트레이터)은 미팅 중이면 미팅 테이블 헤드로 이동해 지시를 받는다.
        if (ai === orchestratorIdx && meetingActive && !a.visit) {
          const h = meetingHost();
          walkTo(a, h.x, h.y, 0.6);
          return;
        }
        // 협업 이벤트 방문(from→to) — 상대 책상 옆까지 걸어가 머문 뒤 복귀
        if (a.visit) {
          const target = agents[a.visit.to];
          if (a.visit.phase === "go") {
            if (walkTo(a, DESKS[target.desk].x * 8 + 19, DESKS[target.desk].y * 8 + 26, 0.7)) a.visit.phase = "hold";
          } else if (a.visit.phase === "hold") {
            if (--a.visit.holdT <= 0) a.visit.phase = "back";
          } else if (walkTo(a, hx, hy, 0.7)) {
            a.visit = null;
          }
          return;
        }
        if (a.state !== "idle") { walkTo(a, hx, hy, 0.4); return; }
        // 대기 배회 — 전원이 커피머신에 몰리지 않게 책상별로 다른 지점(커피/화분/창가)을 돌고, 주기도 어긋나게.
        a.wanderT++;
        const SPOTS = [ { x: COFFEE.x - 8, y: COFFEE.y - 2 }, { x: 12, y: 84 }, { x: 20, y: 30 } ];
        const goal = Math.floor((a.wanderT + a.desk * 97) / 300) % 2 ? SPOTS[a.desk % 3] : { x: hx, y: hy };
        walkTo(a, goal.x, goal.y, 0.3);
      });

      // 접속자: 입장 → 미팅룸 좌석으로 → 착석·지시(directing), 퇴장 → 문에서 소멸
      visitors = visitors.filter((v) => {
        // 외부 접속자는 오른쪽 미팅룸으로 들어와 차례대로 앉는다. 담당자에게 요청하는 연출은 뺐다
        // (2026-07-26 사용자 지시) — 실제로 지시가 오가는 내용은 아래 LIVE 로그에서 본다.
        if (v.phase === "enter") {
          const spot = meetingSeat(v.slot);
          if (walkTo(v, spot.x, spot.y, 0.6)) { v.phase = "seated"; }
          return true;
        }
        if (v.phase === "leave") return !walkTo(v, DOOR.x - 4, DOOR.y + 16, 0.7);
        return true;
      });

      ctx.clearRect(0, 0, W * S, H * S);
      drawRoom();
      const people = agents.map((a) => ({ y: a.y, draw: () => drawAgent(a) }))
        .concat(visitors.map((v) => ({ y: v.y, draw: () => drawVisitor(v) })));
      people.sort((p, q) => p.y - q.y).forEach((p) => p.draw());
      drawParticles();
      drawBubble();
      requestAnimationFrame(step);
    }
    step();
    const api = { setAgents, setVisitors, showBubble, collabMove, sparkle, setTheme };
    window.__office = api; // e2e·디버깅용 훅(협업 이동/파티클을 코드로 유발해 육안 확인)
    return api;
  })();

  // ── 실데이터 연동 ──────────────────────────────────────────────────
  const liveBadge = document.getElementById("liveBadge");
  const statLine = document.getElementById("statLine");
  const feedEl = document.getElementById("feed");

  // 사무실 LIVE 채팅(v5) — 캐릭터 말풍선과 같은 협업 이벤트를 오른쪽 열에도 흘린다.
  const OLIVE_MAX = 60;
  function appendOlive(from, to, message) {
    const feed = document.getElementById("oliveFeed");
    if (!feed || !message) return;
    const first = feed.firstElementChild;
    if (first && !first.classList.contains("ol-line")) feed.removeChild(first); // 빈 안내 제거
    // SOC 로그 형식(2026-07-26 재설계): 시각 · 심각도 태그 · 내용.
    // 전에는 "orchestrator → orchestrator / 작업 할당: ." 처럼 내부 용어가 그대로 나와
    // 무슨 일이 일어나는지 읽히지 않았다. 한 줄로 자르고 태그로 구분한다.
    const msg = String(message).replace(/\s+/g, " ").trim();
    const tag = /KEV|실제 악용|critical|치명/i.test(msg) ? ["crit", "[KEV]"]
      : /^(작업 |실행 |부연 |단계 \d+ )?완료|성공|통과/.test(msg) ? ["ok", "[완료]"]
      : /승인|대기|필요/.test(msg) ? ["warn", "[대기]"]
      : /인입|수집|업로드|스캔/.test(msg) ? ["info", "[수집]"]
      : ["info", "[진행]"];
    const line = document.createElement("div");
    line.className = "ol-line";
    line.innerHTML = '<span class="ol-ts"></span><span class="ol-tag"></span><span class="ol-msg"></span>';
    line.querySelector(".ol-ts").textContent = new Date().toLocaleTimeString("ko-KR", { hour12: false });
    const tg = line.querySelector(".ol-tag");
    tg.textContent = tag[1]; tg.className = "ol-tag " + tag[0];
    line.querySelector(".ol-msg").textContent = (from && from !== "orchestrator" ? from + " · " : "") + msg;
    feed.appendChild(line);
    while (feed.childElementCount > OLIVE_MAX) feed.removeChild(feed.firstChild);
    feed.scrollTop = feed.scrollHeight;
  }

  const todoList = document.getElementById("todoList");
  const todoCnt = document.getElementById("todoCnt");
  const ctaBtn = document.getElementById("ctaBtn");

  const guideBrief = document.getElementById("guideBrief");

  const AGENT_COLOR = {}; // name → color (피드 색상, 캔버스 팔레트와 동일 순서)

  let agentCounts = { working: 0, watching: 0, idle: 0 };
  let visitorCount = 0;
  function renderStat() {
    statLine.innerHTML = `작업중 <b>${agentCounts.working}</b> · 주시 <b>${agentCounts.watching}</b> · 대기 <b>${agentCounts.idle}</b> · 🧑 지시자 <b>${visitorCount}</b>`;
  }

  async function loadAgents() {
    const agents = await window.gijo.listAgents();
    office.setAgents(agents);
    agents.slice(0, 6).forEach((a, i) => { AGENT_COLOR[a.name] = PALETTE[i % PALETTE.length]; });
    const c = { working: 0, watching: 0, idle: 0 };
    agents.forEach((a) => { c[a.status] = (c[a.status] || 0) + 1; });

  // 외부 콘솔 접속자(서버에 로그인한 클라이언트) — presence는 최근 활동(lastSeenAt) 기준.
  // refresh token은 7일 살아 있으므로 "로그인만 해두고 떠난" 세션은 접속으로 치지 않는다.
  const ONLINE_WINDOW_MS = 3 * 60 * 1000;
  let knownVisitors = null; // null=첫 로드(입장 피드 생략), 이후 Set<username>
  async function loadSessions() {
    const sessions = await window.gijo.listActiveSessions();
    const online = (sessions || []).filter((s) => Date.now() - s.lastSeenAt < ONLINE_WINDOW_MS);
    const names = new Set(online.map((s) => s.username));
    if (knownVisitors) {
      for (const n of names) if (!knownVisitors.has(n)) feedLine("🧑 지시", `${n} 님이 미팅룸에서 보안총괄에게 지시합니다`, "#ffe9a8");
      for (const n of knownVisitors) if (!names.has(n)) feedLine("🚪 퇴장", `${n} 님의 접속이 종료되었습니다`, "var(--muted)");
    }
    knownVisitors = names;
    visitorCount = online.length;
    office.setVisitors(online.map((s) => ({ username: s.username })));
    renderStat();
  }

  function feedLine(from, msg, color) {
    // A안: 팀 대화 피드 패널을 없앴다 — 대화는 캐릭터 말풍선(office.collabMove)과
    // 대시보드 "실시간 세션"에서 확인한다. 피드 요소가 없으면 조용히 무시(호출부는 그대로 둠).
    if (!feedEl) return;
    const div = document.createElement("div");
    div.className = "f-line";
    // 장문 LLM 응답이 피드를 도배하지 않게 잘라서 표시(전문은 에이전트 AI 페이지 협업 로그에서).
    const short = String(msg).length > 180 ? String(msg).slice(0, 180) + "…" : String(msg);
    div.innerHTML = `<span class="f-who" style="color:${color || "var(--blue-light)"}">${esc(from)}</span><span class="f-msg">${esc(short)}</span>`;
    feedEl.appendChild(div);
    while (feedEl.children.length > 40) feedEl.removeChild(feedEl.children[1]); // f-note 다음부터 정리
    feedEl.scrollTop = feedEl.scrollHeight;
  }

  function onCollabEvent(evt) {
    if (!evt || !evt.message) return;
    const from = evt.from || "팀";
    feedLine(from + (evt.to ? " → " + evt.to : ""), evt.message, AGENT_COLOR[from]);
    // from 캐릭터가 to 책상까지 걸어가 말풍선 — to가 없으면 제자리 말풍선
    office.collabMove(from, evt.to, evt.message);
    appendOlive(from, evt.to, evt.message); // LIVE 채팅 열(v5)
    if (/작업 완료|완료:/.test(evt.message)) office.sparkle();
  }

  // ── 오늘의 할일: 실 작업 큐에서 "오늘 처리할 것"만 큐레이션 ──
  // 기준: 미완료 중 (기한 초과 | 오늘 기한 | 오늘 생성 | P0). 그 외 미완료는 "이후 할일 N건"으로 접음.
  let allTasks = [];
  function endOfToday() { const d = new Date(); d.setHours(23, 59, 59, 999); return d.getTime(); }
  function startOfToday() { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); }

  function isToday(task) {
    if (task.dueAt && task.dueAt <= endOfToday()) return true;
    if (task.createdAt >= startOfToday()) return true;
    return task.priority === "P0";
  }

  function dueLabel(task) {
    if (!task.dueAt) return "";
    const now = Date.now();
    if (task.dueAt < now) return '<span class="t-due-over">기한 초과</span>';
    if (task.dueAt <= endOfToday()) return '<span class="t-due-today">오늘 기한</span>';
    return `<span>~${new Date(task.dueAt).toLocaleDateString("ko-KR", { month: "numeric", day: "numeric" })}</span>`;
  }

  function renderTasks() {
    const open = allTasks.filter((t) => !t.done);
    const today = open.filter(isToday).sort((a, b) => {
      const oa = a.dueAt && a.dueAt < Date.now() ? 0 : 1, ob = b.dueAt && b.dueAt < Date.now() ? 0 : 1;
      if (oa !== ob) return oa - ob;
      if (a.priority !== b.priority) return String(a.priority).localeCompare(String(b.priority));
      return (a.dueAt || Infinity) - (b.dueAt || Infinity);
    });
    const later = open.length - today.length;
    myTaskCount = today.length;
    updateTodoCount();
    if (!today.length) {
      myTasks.innerHTML = '<div class="t-empty">오늘 처리할 일이 없어요 — 위에 직접 추가하거나, 아래 <b>운영 시작</b>을 누르면 AI 팀이 오늘의 루틴으로 채워줘요 📌</div>'
        + (later > 0 ? `<div class="t-more">이후 기한 할일 ${later}건은 에이전트 AI 페이지에서</div>` : "");
      return;
    }
    // 위 구획(시스템이 데이터에서 찾아낸 조치 대상)과 구분한다 — 이건 담당자가 직접 담거나
    // AI 지시로 생긴 작업 큐이고, 체크박스로 직접 지워야 사라진다. 이름과 기능을 일치시킨다.
    myTasks.innerHTML = '<div class="my-h">☑ 내 체크리스트</div>' + today.map((t) => `
      <div class="t-item${t.done ? " done" : ""}" data-id="${esc(t.id)}">
        <input type="checkbox" ${t.done ? "checked" : ""} title="완료 처리">
        <div class="t-text">${esc(t.text)}
          <div class="t-meta">
            <span class="t-pri ${esc(t.priority)}">${esc(t.priority)}</span>
            ${dueLabel(t)}
            ${t.assignee ? `<span>👤 ${esc(t.assignee)}</span>` : ""}
          </div>
        </div>
        <span class="t-del" title="삭제">✕</span>
      </div>`).join("")
      + (later > 0 ? `<div class="t-more">이후 기한 할일 ${later}건은 에이전트 AI 페이지에서</div>` : "");
  }

  async function loadTasks() {
    allTasks = await window.gijo.listTasks();
    renderTasks();
  }

  // ── 가이드형 브리핑 + 선택지 ────────────────────────────────────────────
  // 서버가 취약점(이벤트)·정기점검(주기)·유지보수를 합쳐 계산해 내려준다. 화면은 판단하지 않고
  // 받은 그대로 렌더한다 — 숫자·우선순위·추천 조치는 전부 서버에서 규칙으로 계산된 값이다.
  //
  // 2단 로딩: 먼저 brief=false로 즉답(목록만)을 받아 화면을 채우고, 그 다음 LLM 브리핑 문장만
  // 갈아 끼운다. LLM이 5~10초 걸려도 담당자는 목록을 바로 본다.
  let guideItems = [];
  let guideFirstRender = true;
  // 헤더 건수는 두 구획(오늘 브리핑 + 내 체크리스트)의 합이다. 한쪽만 세면 화면과 숫자가 어긋난다.
  let myTaskCount = 0;
  function updateTodoCount() {
    const n = guideItems.length + myTaskCount;
    todoCnt.textContent = n ? `${n}건` : "";
  }

  function renderGuide(data) {
    guideItems = data.items || [];
    updateTodoCount();
    if (!guideItems.length) { guideBox.style.display = "none"; return; }
    guideBox.style.display = ""; { const ge = document.getElementById("guideEmpty"); if (ge) ge.style.display = "none"; }

    // 브리핑 출처를 정직하게 구분 — LLM 문장인지 규칙 요약인지 담당자가 알 수 있어야 한다.
    // 브리핑 출처를 정직하게 구분 — LLM 문장인지 규칙 요약인지 담당자가 알 수 있어야 한다.
    // "AI 제안"이라고 쓰지 않는다: 항목들은 AI가 제안한 게 아니라 규칙으로 계산된 사실
    // (KEV 등재·기한 초과·점검 주기 도래)이다. AI가 쓴 건 이 문장 하나뿐이라, "AI 제안"으로
    // 묶으면 확정 사실의 신뢰도를 오히려 낮춰 전달하게 된다.
    const byLabel = data.briefBy === "llm" ? "🧭 오늘 브리핑" : "🧭 오늘 브리핑 (자동 요약)";
    guideBrief.innerHTML = `<span class="g-by">${byLabel}</span><span class="g-txt">${esc(data.brief || "")}</span>`;

    // 접힌 상태에서는 번호·제목·핵심 배지 한 줄만. 펼치면 대상·근거·추천 조치가 나온다.
    // 배지는 접힌 줄에 하나만(KEV 우선) — 여러 개를 늘어놓으면 제목이 밀린다.
    guideList.innerHTML = guideItems.map((it, n) => {
      const badges = it.badges || [];
      const lead = badges.find((b) => b === "KEV") || badges[0];
      return `
      <div class="g-item ${it.urgency === "now" ? "now" : "today"}" data-idx="${n}">
        <div class="g-head">
          <div class="g-num">${n + 1}</div>
          <div class="g-t">${esc(it.title)}</div>
          ${lead ? `<span class="g-bd${lead === "KEV" ? " kev" : ""}">${esc(lead)}</span>` : ""}
          <span class="g-caret">▶</span>
        </div>
        <div class="g-detail">
          <div class="g-s">${esc(it.subtitle)}</div>
          <div class="g-w">${esc(it.why)}</div>
          <div class="g-a">→ ${esc(it.action)}</div>
          <button class="g-go" data-go="${n}">▶ AI 팀에 맡기기</button>
        </div>
      </div>`;
    }).join("");

    const c = data.counts || {};
    const rest = (c.now || 0) + (c.today || 0) - guideItems.length;
    guideMore.style.display = rest > 0 ? "" : "none";
    if (rest > 0) guideMore.textContent = `그 외 ${rest}건 — 취약점 화면에서 전체 보기`;

    // 창을 열면 브리핑부터 보여야 한다(실측: 렌더 후 스크롤이 506px 내려가 브리핑이 가려졌다).
    // 초기 로딩(즉답 + 브리핑 2단) 동안만 올린다 — 담당자가 아래를 보는 중에 갱신이 오면 위치를 뺏지 않는다.
    if (guideFirstRender) todoList.scrollTop = 0;
  }

  async function loadGuide() {
    try {
      renderGuide(await window.gijo.getToday(false)); // ① 즉답(LLM 미호출)
      renderGuide(await window.gijo.getToday(true));  // ② 브리핑 문장 갱신
      guideFirstRender = false; // 초기 2단이 끝났다 — 이후 갱신은 스크롤을 건드리지 않는다
    } catch (err) {
      guideBox.style.display = "none"; // 실패해도 아래 "내 할일"은 그대로 뜬다
      feedLine("시스템", "오늘 브리핑을 불러오지 못했습니다: " + (err && err.message || err), "var(--amber)");
    }
  }

  guideBrief.addEventListener("click", () => guideBrief.classList.toggle("open"));
  // 하단 "오늘 브리핑" 접이식 — 헤더를 누르면 참고용 전문이 펼쳐진다(기본 접힘).
  // 브리핑은 오른쪽 열로 나가면서 접이식이 아니게 됐다(자리가 넓어졌다) — 토글은 없앤다.

  // 줄을 누르면 펼치기만 한다(아코디언 — 한 번에 하나). 실행은 펼친 뒤 버튼으로.
  // 처음엔 줄 클릭이 곧바로 지시를 보냈는데, 확인 없이 실행되는 건 위험하다 — 근거를 보고
  // 누르도록 한 단계를 뒀다.
  guideList.addEventListener("click", async (e) => {
    const row = e.target.closest(".g-item");
    if (!row) return;

    const goBtn = e.target.closest(".g-go");
    if (!goBtn) { // 헤더 클릭 → 펼치기/접기
      const wasOpen = row.classList.contains("open");
      guideList.querySelectorAll(".g-item.open").forEach((r) => r.classList.remove("open"));
      if (!wasOpen) row.classList.add("open");
      return;
    }

    const it = guideItems[Number(row.dataset.idx)];
    if (!it) return;
    const instruction = it.axis === "device"
      ? `${it.subtitle}의 ${it.title}을 진행해줘. (${it.why})`
      : `${it.subtitle} 자산의 ${it.title} 조치를 진행해줘. 근거: ${it.why}`;
    feedLine("나", instruction, "var(--blue-light)");
    goBtn.disabled = true;
    goBtn.textContent = "AI 팀에 전달 중…";
    try {
      // 맡긴 항목은 체크리스트에도 남아야 한다 — 안 그러면 지시만 나가고 "맡겼는데 어디 갔지?"가
      // 된다(사용자 지적, 2026-07-22). 미완료로 등록해 두고, 처리 여부는 담당자가 체크리스트에서
      // 직접 완료 처리한다(자동완료는 결재 대기 등 실제 완료가 아닐 수 있어 안 함).
      await window.gijo.addTask(instruction, { ref: "brief:" + it.id });
      await window.gijo.sendInstruction(instruction);
      await loadGuide();
      await loadTasks();
    } catch (err) {
      feedLine("시스템", "지시 실패: " + (err && err.message || err), "var(--red)");
      goBtn.disabled = false;
      goBtn.textContent = "▶ AI 팀에 맡기기";
    }
  });

  todoList.addEventListener("click", async (e) => {
    const item = e.target.closest(".t-item");
    if (!item) return;
    const id = item.dataset.id;
    try {
      if (e.target.matches("input[type=checkbox]")) {
        await window.gijo.toggleTask(id, e.target.checked);
        if (e.target.checked) office.sparkle(); // 완료 ✓ 반짝이
        await loadTasks();
      } else if (e.target.matches(".t-del")) {
        await window.gijo.deleteTask(id);
        await loadTasks();
      }
    } catch (err) { feedLine("시스템", "할일 처리 실패: " + (err && err.message || err), "var(--red)"); }
  });

  // 적어 넣기는 '내 업무' 화면으로 보낸다(2026-07-31) — 거기서는 적으면 그 일을 어떤 순서로
  // 하는지까지 안내받는다.
  // ⚠ navigateTo를 쓰면 안 된다 — 이 창은 별도 창이지만 그 명령은 **본창을 통째로 갈아치워**
  //   담당자가 본창에 열어 둔 탭이 전부 사라진다(preload의 탭 안 보정도 여기엔 안 닿는다,
  //   이 창은 embed가 아니다). 대화창과 같은 통로로 **탭 하나만 더** 연다.
  document.getElementById("todoOpenBtn").addEventListener("click", () => {
    if (window.gijo && window.gijo.openTabInShell) window.gijo.openTabInShell("mywork.html", "내 업무");
    else if (window.gijo && window.gijo.navigateTo) window.gijo.navigateTo("mywork.html");
  });

  // ── 운영 시작 CTA ──
  // 비어 있으면: 루틴 추천으로 오늘의 할일을 채운다. 있으면: 최우선 할일을 오케스트레이터에게 지시.
  ctaBtn.addEventListener("click", async () => {
    ctaBtn.disabled = true;
    const orig = ctaBtn.textContent;
    try {
      const open = allTasks.filter((t) => !t.done && isToday(t));
      if (!open.length) {
        ctaBtn.textContent = "루틴 추천 불러오는 중…";
        const sugg = await window.gijo.getRoutineSuggestions();
        const daily = (sugg || []).filter((s) => s.cadence === "daily").slice(0, 5);
        if (!daily.length) { feedLine("시스템", "추천할 루틴이 아직 없어요 — 할 일을 직접 추가해 보세요"); return; }
        for (const s of daily) await window.gijo.addTask(s.text, { ref: "routine:" + s.source });
        await loadTasks();
        feedLine("AI 팀", `오늘의 루틴 ${daily.length}건을 할일에 채웠어요`);
      } else {
        const top = open[0];
        ctaBtn.textContent = "오케스트레이터에게 지시 중…";
        feedLine("나 → Orchestrator", top.text, "var(--text)");
        const result = await window.gijo.sendInstruction(top.text);
        const summary = result && (result.summary || result.reply || result.message);
        if (summary) feedLine("Orchestrator", String(summary).slice(0, 300), AGENT_COLOR["Security Orchestrator"]);
      }
    } catch (err) {
      feedLine("시스템", "운영 시작 실패: " + (err && err.message || err), "var(--red)");
    } finally {
      ctaBtn.disabled = false;
      ctaBtn.textContent = orig;
    }
  });

  // ── 아트 무드 전환(코지/네온/딥블루) ──
  const themeSeg = document.getElementById("themeSeg");
  function markTheme() {
    const cur = localStorage.getItem("gijo:office:theme") || "neon";
    themeSeg.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.theme === cur));
  }
  themeSeg.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-theme]");
    if (!btn) return;
    office.setTheme(btn.dataset.theme);
    markTheme();
  });
  markTheme();

  // ── 부팅 ──
  // 관제 상태 띠 — 실데이터만 채운다(없으면 "-" 그대로 둔다, 가짜 숫자 금지).
  async function loadSocBar() {
    const set = (id, html, cls) => {
      const e = document.getElementById(id); if (!e) return;
      e.innerHTML = html; if (cls) e.className = "v " + cls;
    };
    try {
      const { items } = await window.gijo.listActionPriorities(50);
      const open = (items || []).length;
      const kev = (items || []).filter((r) => r.finding && r.finding.kev).length;
      set("socOpen", open + '<small>건</small>', open ? "red" : "teal");
      set("socKev", kev + '<small>건</small>', kev ? "amber" : "teal");
    } catch (e) { /* 조회 실패는 "-"로 남긴다 */ }
    try {
      const st = await window.gijo.getLocalEngineStatus();
      const alive = st && st.running ? 1 : 0;
      set("socEngine", (st && st.modelId ? "가동" : alive ? "가동" : "중지"), alive || (st && st.modelId) ? "teal" : "amber");
    } catch (e) {}
    try {
      // 오늘 처리 = 완료된 작업 수(실데이터). 없으면 "-" 그대로 둔다.
      const tasks = await window.gijo.listTasks();
      const done = (tasks || []).filter((t) => t.status === "done").length;
      set("socDone", done + '<small>건</small>', "teal");
    } catch (e) {}
    const st2 = document.getElementById("socStaff");
    if (st2) st2.innerHTML = (agentCounts.working + agentCounts.watching + agentCounts.idle) + '<small>명</small>';
  }

  (async function boot() {
    try {
      await window.gijo.checkServerHealth();
    } catch (e) {
      liveBadge.textContent = "연결 끊김"; liveBadge.classList.add("off");
      document.getElementById("deadOverlay").classList.add("show");
      return;
    }
    try {
      // loadGuide는 실패해도 나머지를 막지 않는다(내부에서 자체 처리) — Promise.all에 함께 둔다.
      await Promise.all([loadAgents(), loadTasks(), loadSessions(), loadGuide(), loadSocBar()]);
      setInterval(loadSocBar, 60000); // 관제 상태 띠 갱신(1분)
      const history = await window.gijo.listCollaborationHistory();
      (history || []).slice(-40).forEach((e) => appendOlive(e.from, e.to, e.message)); // LIVE 채팅 초기 채움(v5)
      (history || []).slice(-8).forEach((evt) => feedLine(evt.from + (evt.to ? " → " + evt.to : ""), evt.message, AGENT_COLOR[evt.from]));
      if (window.gijoRealtime) window.gijoRealtime.connect();
      window.gijo.onCollaborationEvent(onCollabEvent);
      setInterval(loadAgents, 20000);  // 상태는 휘발성 라이브 신호 — 주기 폴링으로 갱신
      setInterval(loadSessions, 15000); // 외부 콘솔 접속자 presence
      setInterval(loadTasks, 60000);
    } catch (e) {
      feedLine("시스템", "초기화 실패: " + (e && e.message || e), "var(--red)");
    }
  })();
})();
</script>
</body>
</html>
