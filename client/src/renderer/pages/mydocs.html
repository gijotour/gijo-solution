<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIJO AS — 내 문서</title>
<!--
  내 문서 = 문서·지식·학습 통합 허브 (2026-08-20 사장님 — 「내문서에 지식 학습 내문서 다
  통합하고 … 엑셀처럼 촘촘하게 쉽게 많이 보이게」). 승인 시안: mockups/docs-hub-v2/시안.html
  (mockups/docs-single-entry 승계 — 격리·업로드 창구·반입=영수증 결정 그대로).

  ■ 탭 4: 👤 내 것(personal_docs CRUD) · 🏢 회사 지식(RAG 지식창고 열람) · 🎓 학습(수집 내역
    열람 — **조작 없음**, 학습 실행·승인은 learnloop.html 몫) · 🩹 반입(＋로 올린 문서의 기록).
  ■ 격리가 이 화면의 전부다: 내 것 목록은 서버가 **내 것만** 준다(personaldocs — 남의 것은
    404). 회사 지식 목록도 서버 라우트가 남의 개인 문서를 걸러 준다(memory 라우트).
  ■ 「보기·올리기는 창구, 위험한 관리는 전용 화면」 — 회사 지식의 삭제·등급 변경은 AI 지식
    화면, 학습 승인·실행은 학습 화면. 여기는 바로가기만 잇는다.
  ■ 자유 텍스트 입력칸 0(지시는 대화창) — 검색칸은 필터 전용, 파일 가져오기(대화상자)만 있다.
  ■ 위키링크·백링크·그래프뷰는 만들지 않는다(확정 경계).
-->
<style>
:root{
  --bg:#262624;--panel:#30302e;--panel-2:#1f1e1d;--border:rgba(255,255,255,0.08);
  --border-strong:rgba(255,255,255,0.16);--blue:#3b82f6;--blue-light:#5fa1ff;--white:#ffffff;
  --text:#e9e7e2;--muted:#b3ada4;--muted-2:#a49d95;--red:#e2483d;--amber:#f0a020;--teal:#1eb980;--purple:#8b7cf0;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Pretendard","Malgun Gothic","Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:13px;}
.main{padding:20px 24px 40px;max-width:1180px;margin:0 auto;}
.head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:12px;gap:12px;flex-wrap:wrap;}
.page-title{font-size:19px;font-weight:800;color:var(--text-strong, #fff);}
.page-sub{font-size:12.5px;color:var(--muted);margin-top:4px;}
.acts{display:flex;gap:8px;}
.btn{background:var(--panel-2);border:1px solid var(--border-strong);color:var(--text);
  padding:8px 14px;border-radius:8px;font-size:12.75px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.tabs button{background:var(--panel-2);border:1px solid var(--border-strong);color:var(--muted);
  padding:6px 14px;border-radius:18px;font-size:12.25px;font-weight:700;cursor:pointer;font-family:inherit;}
.tabs button.on{background:rgba(59,130,246,.15);border-color:var(--blue);color:var(--blue-light);}
.tabs button .n{font-weight:800;margin-left:4px;}
.filter{width:100%;background:var(--panel);border:1px solid var(--border-strong);border-radius:8px;color:var(--text);
  font-size:12.5px;padding:7px 11px;outline:none;margin-bottom:8px;}
.filter:focus{border-color:var(--blue);}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;align-items:start;}
.cols.full{grid-template-columns:1fr;}
.cols.full .detail{display:none;} /* 전폭 탭(학습)에선 상세를 숨긴다(검토관 중4 — 안 숨기면 이전 탭 문구가 목록 아래 남는다) */
/* 등급·보조 글자색 — .g-rows 밖(상세 패널)에서도 먹게 이 화면 범위로 정의(검토관 하2) */
.gtxt-C{color:var(--red);font-weight:800;} .gtxt-S{color:var(--amber);font-weight:800;} .gtxt-O{color:var(--muted);font-weight:700;}
.gm2{color:var(--muted-2);}
.mineseg{display:flex;gap:6px;margin:0 0 8px;}
.mineseg button{background:var(--panel-2);border:1px solid var(--border-strong);color:var(--muted);
  padding:4px 12px;border-radius:14px;font-size:11.75px;font-weight:700;cursor:pointer;font-family:inherit;}
.mineseg button.on{background:rgba(59,130,246,.15);border-color:var(--blue);color:var(--blue-light);}
.detail{border:1px solid var(--border);border-radius:9px;background:var(--panel);padding:12px 14px;position:sticky;top:12px;font-size:12.5px;}
.detail .dn{font-weight:800;font-size:13.5px;margin-bottom:4px;word-break:break-all;}
.detail .dm{color:var(--muted);line-height:1.6;}
.detail .dbt{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.detail .dbt button{background:transparent;border:1px solid var(--border-strong);color:var(--muted);
  padding:4px 10px;border-radius:7px;font-size:11.75px;font-weight:700;cursor:pointer;font-family:inherit;}
.detail .dbt button:hover{color:var(--text-strong, #fff);border-color:var(--blue);}
.detail .dbt button.warn:hover{color:#f5928a;border-color:var(--red);}
.go{background:transparent;border:1px solid var(--border-strong);color:var(--muted);border-radius:7px;
  padding:4px 10px;font-size:11.75px;font-weight:700;cursor:pointer;font-family:inherit;}
.go:hover{color:var(--text-strong, #fff);border-color:var(--blue);}
.topics{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px;}
.topic{border:1px solid var(--border);border-radius:8px;background:var(--panel);padding:7px 11px;font-size:12px;}
.topic b{font-size:14px;color:var(--text-strong, #fff);margin-left:5px;}
.gtxt-rag{color:var(--teal);font-weight:700;}
.gtxt-share{color:var(--amber);font-weight:700;}
.gtxt-up{color:var(--teal);font-weight:700;} .gtxt-down{color:var(--red);font-weight:700;}
.empty{padding:28px 16px;text-align:center;color:var(--muted-2);font-size:12.75px;}
.note{font-size:11.75px;color:var(--muted-2);margin-top:10px;line-height:1.6;}
</style>
</head>
<body class="g-ui">
<div class="main">
  <div class="head">
    <div>
      <div class="page-title">내 문서</div>
      <div class="page-sub">개인 메모 · 회사 지식 · 학습 재료 · 반입 기록 — 문서의 정문입니다. 개인 문서는 <b>내 질문에만</b> 근거로 나옵니다.</div>
    </div>
    <div class="acts" id="acts">
      <button class="btn primary" id="btnWrite" title="Smart MD Studio(문서 작성 창)를 엽니다 — 다듬은 .md는 「가져오기」로 여기에 담습니다">✍ Smart MD로 쓰기</button>
      <button class="btn" id="btnImport" title=".md/.txt 파일을 내 문서로 가져옵니다">📥 .md 가져오기</button>
      <input type="file" id="fileIn" accept=".md,.txt,.markdown" style="display:none">
    </div>
  </div>
  <div class="tabs" id="tabs">
    <button data-t="mine" class="on">👤 내 것<span class="n" id="nMine"></span></button>
    <button data-t="know">🏢 회사 지식<span class="n" id="nKnow"></span></button>
    <button data-t="learn">🎓 학습<span class="n" id="nLearn"></span></button>
    <button data-t="ingest">🩹 반입<span class="n" id="nIngest"></span></button>
  </div>
  <input class="filter" id="q" placeholder="제목·이름으로 좁히기… (필터 전용 — 지시가 아닙니다)" aria-label="목록 좁히기">
  <div class="mineseg" id="mineSeg" style="display:none">
    <button data-f="all" class="on">전부</button>
    <button data-f="personal">👤 개인만</button>
    <button data-f="shared">🏢 공유만</button>
  </div>
  <div id="learnTop" class="topics" style="display:none"></div>
  <div class="cols" id="cols">
    <div class="g-rows" id="rowsBox">
      <div class="g-rows-scroll" id="list" style="--gr-maxh:max(300px, calc(100vh - 320px))"><div class="empty">불러오는 중…</div></div>
    </div>
    <div class="detail" id="detail"><div class="dm">행을 누르면 여기서 내용·조작을 봅니다.</div></div>
  </div>
  <div class="note" id="note">개인 문서는 내 질문에만 근거로 나옵니다 — 「AI 포함」과 「공유」의 차이는 ⓘ로 보세요.</div>
</div>
<script>
(function () {
  "use strict";
  var 탭 = "mine";
  var mine = [], know = [], learn = [], learnTopics = [], learnKpis = null;
  var 오류 = { mine: null, know: null, learn: null }; // 불러오기 실패는 「없음」과 다르다(검토관 상4)
  var mineFilter = "all";
  var 선택 = null; // { 탭, id }
  // 회사 지식·반입에서 개인 문서(personal:*)는 뺀다(검토관 중3 — 서버 반입 소식도 같은 제외).
  // 개인 문서의 자리는 👤 내 것 탭이고, personal: id는 사람이 못 읽는 uuid다.
  var 회사문서만 = function () { return know.filter(function (d) { return String(d.documentId).indexOf("personal:") !== 0; }); };

  // ⚠ 따옴표까지 막는다(검토관 상5) — 남의 자유 텍스트(학습 문답·파일명)가 title 속성에
  //   들어가는 화면이라, textContent 직렬화(&<>만)로는 속성 탈출 주입이 열린다.
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  var 날짜 = function (t) {
    if (!t) return "—";
    var d = new Date(t);
    var mmdd = String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    // 다른 해면 연도를 붙인다(검토관 하5 — 작년 문서와 오늘 문서가 같은 날짜로 보이면 안 된다)
    return d.getFullYear() === new Date().getFullYear() ? mmdd : String(d.getFullYear() % 100).padStart(2, "0") + "-" + mmdd;
  };
  function 알림(라벨, 글) {
    if (!window.gijoSelectNotify) return;
    window.gijoSelectNotify(라벨 ? { label: String(라벨).slice(0, 40), text: 글 } : undefined);
  }
  function 화면열기(page, label) {
    try { window.top.postMessage({ type: "gijo:openTab", page: page, label: label }, "*"); } catch (e) { }
  }
  // 열람 등급 — memory.html과 같은 글자색 언어(gtxt-C/S/O, gijo-ui.css 부품)
  var GRADE = { O: "공개", S: "민감", C: "기밀" };
  function 등급글자(g) {
    var 이름 = Object.prototype.hasOwnProperty.call(GRADE, g) ? GRADE[g] : null;
    return 이름 ? '<span class="gtxt-' + g + '" title="열람 등급: ' + 이름 + '">' + g + " " + 이름 + "</span>"
      : '<span class="gm2" title="열람 등급 미지정">? 미지정</span>';
  }

  // ── 탭별 그리기(전부 .g-rows — 승인 시안 docs-hub-v2: 새 시각 언어 금지) ──────
  function 그리기() {
    var q = (document.getElementById("q").value || "").toLowerCase().trim();
    var list = document.getElementById("list");
    var 걸림 = function (s) { return !q || String(s).toLowerCase().indexOf(q) >= 0; };
    document.getElementById("learnTop").style.display = 탭 === "learn" ? "flex" : "none";
    document.getElementById("acts").style.display = 탭 === "mine" ? "flex" : "none";
    document.getElementById("mineSeg").style.display = 탭 === "mine" ? "flex" : "none";
    document.getElementById("cols").classList.toggle("full", 탭 === "learn");
    document.getElementById("rowsBox").className = "g-rows g-rows--hub-" + 탭;

    // 불러오기 실패는 「없습니다」가 아니다(검토관 상4) — 그 탭의 원천이 죽었으면 그렇게 말한다.
    var 탭오류 = 탭 === "mine" ? 오류.mine : 탭 === "learn" ? 오류.learn : 오류.know;
    if (탭오류) {
      list.innerHTML = '<div class="empty">불러오기 실패 — ' + esc(탭오류) + "<br>서버 연결을 확인하고 새로고침해 주세요.</div>";
      탭수그리기(); 상세초기화();
      return;
    }

    if (탭 === "mine") {
      var rows = mine.filter(function (d) {
        if (mineFilter === "shared" && !d.shared) return false;
        if (mineFilter === "personal" && d.shared) return false;
        return 걸림(d.title);
      });
      list.innerHTML = '<div class="g-rows-head" style="grid-template-columns:1fr 64px 64px 44px;gap:8px"><span>제목</span><span>AI</span><span>공유</span><span class="ta-r">수정</span></div>' +
        (rows.length ? '<div class="g-rows-flat">' + rows.map(function (d) {
          return '<div class="g-rows-r" data-id="' + esc(d.id) + '" style="grid-template-columns:1fr 64px 64px 44px;gap:8px">' +
            '<span class="trunc" title="' + esc(d.title) + '">' + esc(d.title) + "</span>" +
            '<span>' + (d.ragOptIn ? '<span class="gtxt-rag">AI 포함</span>' : '<span class="gm2">—</span>') + "</span>" +
            '<span>' + (d.shared ? '<span class="gtxt-share">🏢 공유</span>' : '<span class="gm2">개인</span>') + "</span>" +
            '<span class="ta-r gm2">' + 날짜(d.updatedAt) + "</span></div>";
        }).join("") + "</div>"
        : '<div class="empty">' + (mine.length ? "검색과 맞는 문서가 없습니다." : "아직 문서가 없습니다 — ✍ Smart MD로 쓰거나 📥 .md를 가져오세요.") + "</div>");
    } else if (탭 === "know") {
      // 영역(category)별 그룹 — 분류 논리는 서버 값 그대로(재발명 금지). 개인 문서 제외(중3).
      var byCat = {};
      회사문서만().filter(function (d) { return 걸림(d.documentId); }).forEach(function (d) {
        var c = d.category || "일반";
        (byCat[c] = byCat[c] || []).push(d);
      });
      var cats = Object.keys(byCat).sort();
      list.innerHTML = '<div class="g-rows-head" style="grid-template-columns:1fr 74px 52px 44px;gap:8px"><span>문서</span><span>등급</span><span class="ta-r">조각</span><span class="ta-r">반입</span></div>' +
        (cats.length ? cats.map(function (c) {
          var folded = 접힘.has(c);
          return '<div class="g-rows-gh" data-cat="' + esc(c) + '" style="top:26px"><span class="tri">' + (folded ? "▸" : "▾") + '</span>🗂 ' + esc(c) + '<span class="cnt">' + byCat[c].length + "개</span></div>" +
            '<div class="g-rows-body' + (folded ? " folded" : "") + '">' + byCat[c].map(function (d) {
              return '<div class="g-rows-r" data-id="' + esc(d.documentId) + '" style="grid-template-columns:1fr 74px 52px 44px;gap:8px">' +
                '<span class="trunc" title="' + esc(d.documentId) + '">' + esc(d.documentId) + "</span>" +
                등급글자(d.grade) +
                '<span class="ta-r gm">' + (d.chunks || 0) + "</span>" +
                '<span class="ta-r gm2">' + 날짜(d.ingestedAt) + "</span></div>";
            }).join("") + "</div>";
        }).join("") : '<div class="empty">회사 지식 문서가 없습니다.</div>');
    } else if (탭 === "learn") {
      var lr = learn.filter(function (g) { return 걸림(g.question || ""); });
      var 총 = (learnKpis && learnKpis.total) || learn.length;
      // 원천 정직(검토관 중2): 이 목록은 수집된 대화 **전량**이다(고른 후보함은 학습 화면 몫).
      // 상한 정직(중1): 100건까지만 조회하므로 더 있으면 그렇게 말한다.
      list.innerHTML = '<div class="g-rows-head" style="grid-template-columns:1fr 70px 64px 44px;gap:8px"><span>수집된 대화(전량 — 배울 후보 고르기·승인은 학습 화면)</span><span>평가</span><span>주제</span><span class="ta-r">수집</span></div>' +
        (lr.length ? '<div class="g-rows-flat">' + lr.map(function (g) {
          var 평 = g.rating === 1 ? '<span class="gtxt-up">👍</span>' : g.rating === -1 ? '<span class="gtxt-down">👎</span>' : '<span class="gm2">미평가</span>';
          return '<div class="g-rows-r" style="grid-template-columns:1fr 70px 64px 44px;gap:8px;cursor:default">' +
            '<span class="trunc" title="' + esc(g.question || "") + '">' + esc(g.question || "(질문 없음)") + "</span>" +
            "<span>" + 평 + "</span>" +
            '<span class="gm2 trunc">' + esc(g.topic || "—") + "</span>" +
            '<span class="ta-r gm2">' + 날짜(g.createdAt) + "</span></div>";
        }).join("") + "</div>" + (총 > learn.length ? '<div class="empty" style="padding:10px">앞 ' + learn.length + "건 표시 — 전체 " + 총 + "건은 🗔 학습 화면에서.</div>" : "")
        : '<div class="empty">수집된 대화가 없습니다 — 대화가 쌓이면 여기 보입니다.</div>');
    } else { // ingest — ＋로 올린 문서의 반입 기록(영수증). 개인 문서 제외(중3 — 서버 반입 소식과 같은 잣대)
      var ing = 회사문서만().filter(function (d) { return d.uploadedBy && 걸림(d.documentId); })
        .sort(function (a, b) { return String(b.ingestedAt || "").localeCompare(String(a.ingestedAt || "")); });
      list.innerHTML = '<div class="g-rows-head" style="grid-template-columns:1fr 90px 74px 44px;gap:8px"><span>올린 문서</span><span>올린 이</span><span>영역</span><span class="ta-r">반입</span></div>' +
        (ing.length ? '<div class="g-rows-flat">' + ing.map(function (d) {
          return '<div class="g-rows-r" data-id="' + esc(d.documentId) + '" style="grid-template-columns:1fr 90px 74px 44px;gap:8px">' +
            '<span class="trunc" title="' + esc(d.documentId) + '">' + esc(d.documentId) + "</span>" +
            '<span class="gm2 trunc">' + esc(d.uploadedBy) + "</span>" +
            '<span class="gm2 trunc">' + esc(d.category || "일반") + "</span>" +
            '<span class="ta-r gm2">' + 날짜(d.ingestedAt) + "</span></div>";
        }).join("") + "</div>" : '<div class="empty">＋로 올린 문서의 반입 기록이 여기 쌓입니다.<br><span class="gm2">스캐너 결과·보안 로그 반입은 ① 발견·수집 화면에서 봅니다.</span></div>');
    }
    탭수그리기();
    상세초기화();
  }

  function 탭수그리기() {
    document.getElementById("nMine").textContent = mine.length || "";
    document.getElementById("nKnow").textContent = 회사문서만().length || "";
    // 학습 총계는 kpis(진짜 총계)로 — 조회 상한(100)을 총계처럼 말하면 거짓이다(중1)
    document.getElementById("nLearn").textContent = (learnKpis && learnKpis.total) || learn.length || "";
    document.getElementById("nIngest").textContent = 회사문서만().filter(function (d) { return d.uploadedBy; }).length || "";
  }

  function 상세초기화() {
    // 화면의 .sel이 사라지면 대화창의 🎯도 함께 푼다(검토관 중5 — supervision 하6 규격).
    // ⚠ 단, **이 화면이 걸었던 선택이 있을 때만** — 무조건 부르면 첫 로드에서 다른 화면이
    //   걸어 둔 선택까지 지운다(선택 스톰프).
    if (선택) 알림();
    선택 = null;
    var d = document.getElementById("detail");
    if (탭 === "know") d.innerHTML = '<div class="dm">행을 누르면 문서 정보를 봅니다.<div class="dbt"><button class="go" data-go="memory.html" data-lb="AI 지식">🗔 AI 지식에서 관리(삭제·영역·등급)</button></div></div>';
    else if (탭 === "ingest") d.innerHTML = '<div class="dm">＋로 올린 문서가 어디로 갔는지의 기록입니다.<div class="dbt"><button class="go" data-go="analysis.html" data-lb="발견·수집">🗔 발견·수집(스캐너·로그 반입)</button></div></div>';
    else if (탭 === "mine") d.innerHTML = '<div class="dm">행을 누르면 여기서 내용·조작(AI 포함·공유·내려받기·삭제)을 봅니다.</div>';
    else d.innerHTML = ""; // learn — 전폭이라 숨겨져 있지만 이전 탭 문구를 남기지 않는다(중4)
  }

  function 학습띠그리기() {
    // 실형태: listLearnloopTopics() → { 목표승인건수, 주제:[{topic, approved}] }.
    // ⚠ 개시선은 **주제별** 300이다(검토관 상3 — 서버 게이트가 주제 하나 기준. 합산으로
    //   보여주면 4주제 각 75건일 때 「300/300」 거짓 약속이 된다). learnloop.html과 같은 표기.
    var el = document.getElementById("learnTop");
    var 목표 = (learnTopics && learnTopics.목표승인건수) || 300;
    var 주제들 = (learnTopics && learnTopics.주제) || [];
    el.innerHTML = 주제들.filter(function (t) { return t.topic !== "(미분류)"; }).map(function (t) {
      var 됨 = (t.approved || 0) >= 목표;
      return '<span class="topic" title="이 주제 승인 ' + (t.approved || 0) + "/" + 목표 + (됨 ? " — 어댑터 학습 가능" : "") + '">' +
        esc(t.topic) + "<b>" + (t.approved || 0) + "/" + 목표 + (됨 ? " ✓" : "") + "</b></span>";
    }).join("") +
      '<button class="go" data-go="learnloop.html" data-lb="학습">🗔 학습 화면에서 승인·실행</button>';
  }

  // ── 데이터 ── 실패는 실패로 기록한다(검토관 상4 — 빈 배열로 삼키면 「문서가 지워졌다」로 읽힌다)
  var 접힘 = new Set();
  async function 불러오기() {
    try { mine = ((await window.gijo.personalDocsList()) || {}).documents || []; 오류.mine = null; }
    catch (e) { mine = []; 오류.mine = (e && e.message) || "오류"; }
    try { know = (await window.gijo.listMemoryDocuments()) || []; 오류.know = null; }
    catch (e) { know = []; 오류.know = (e && e.message) || "오류"; }
    try {
      var r = await window.gijo.listLearnloopLogs(100, 0);
      learn = (r && r.logs) || [];
      learnKpis = (r && r.kpis) || null;
      오류.learn = null;
    } catch (e) { learn = []; learnKpis = null; 오류.learn = (e && e.message) || "오류"; }
    try { learnTopics = (await window.gijo.listLearnloopTopics()) || []; } catch (e) { learnTopics = []; }
    학습띠그리기();
    그리기();
  }

  // ── 배선 ─────────────────────────────────────────────────────────────
  document.getElementById("tabs").addEventListener("click", function (ev) {
    var b = ev.target.closest("button");
    if (!b) return;
    Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function (x) { x.classList.remove("on"); });
    b.classList.add("on");
    탭 = b.getAttribute("data-t") || "mine";
    알림(); // 탭을 바꾸면 가리키던 것도 없다
    그리기();
  });
  document.getElementById("q").addEventListener("input", 그리기);
  document.getElementById("mineSeg").addEventListener("click", function (ev) {
    var b = ev.target.closest("button");
    if (!b) return;
    Array.prototype.forEach.call(document.querySelectorAll("#mineSeg button"), function (x) { x.classList.remove("on"); });
    b.classList.add("on");
    mineFilter = b.getAttribute("data-f") || "all";
    그리기();
  });
  document.addEventListener("click", function (ev) {
    var g = ev.target.closest("[data-go]");
    if (g) 화면열기(g.getAttribute("data-go"), g.getAttribute("data-lb") || "");
  });

  document.getElementById("btnWrite").addEventListener("click", async function () {
    if (!(window.gijo && window.gijo.openSmartMd)) return;
    var r = await window.gijo.openSmartMd();
    if (r && r.ok === false && r.error && window.gijoTell) window.gijoTell(r.error);
  });
  document.getElementById("btnImport").addEventListener("click", function () { document.getElementById("fileIn").click(); });
  document.getElementById("fileIn").addEventListener("change", async function (ev) {
    var f = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if (!f || !window.gijo || !window.gijo.personalDocsCreate) return;
    var text = await f.text();
    var title = f.name.replace(/\.(md|txt|markdown)$/i, "").slice(0, 120) || "가져온 문서";
    try {
      var 잘림 = text.length > 200000;
      var made = await window.gijo.personalDocsCreate({ title: title, body: text.slice(0, 200000) });
      // 조용한 절단·조용한 비밀 무시 금지(검토관 중10) — 잘렸으면 잘렸다고, 비밀이 보이면 보인다고.
      var 알릴 = [];
      if (잘림) 알릴.push("⚠ 내용이 20만 자를 넘어 뒷부분이 잘렸습니다(" + text.length.toLocaleString() + "자 중).");
      if (made && made.warnings && made.warnings.length) {
        알릴.push("⚠ 비밀번호·계정 정보로 보이는 것이 " + made.warnings.length + "곳 있습니다 — 장비 접속 정보는 보안제품 등록부(암호화 보관)에 두세요.");
      }
      if (알릴.length && window.gijoTell) window.gijoTell(알릴.join("\n"));
      불러오기();
    } catch (e) { if (window.gijoTell) window.gijoTell("가져오기 실패 — " + ((e && e.message) || "오류")); }
  });

  // 행 클릭 — 탭별 상세(조작은 내 것 탭에서만: 「위험한 관리는 전용 화면」 경계)
  document.getElementById("list").addEventListener("click", function (ev) {
    // 회사 지식 그룹 접기(검토관 중10 — ▾를 그려 놓고 배선이 없으면 죽은 조작)
    var gh = ev.target.closest(".g-rows-gh");
    if (gh) {
      var c = gh.getAttribute("data-cat");
      if (c) { if (접힘.has(c)) 접힘.delete(c); else 접힘.add(c); 그리기(); }
      return;
    }
    if (탭 === "learn") return; // 열람 전용 — 고를 것도 상세도 없다(검토관 하6)
    var row = ev.target.closest(".g-rows-r");
    if (!row) return;
    Array.prototype.forEach.call(document.querySelectorAll(".g-rows-r.sel"), function (x) { x.classList.remove("sel"); });
    row.classList.add("sel");
    var id = row.getAttribute("data-id");
    var d = document.getElementById("detail");
    if (탭 === "mine") {
      var doc = mine.find(function (x) { return x.id === id; });
      if (!doc) return;
      선택 = { 탭: "mine", id: id };
      알림(doc.title, "내 문서 「" + doc.title + "」 · " + (doc.shared ? "회사 공유" : "개인") + " · 수정 " + new Date(doc.updatedAt).toLocaleDateString("ko-KR"));
      d.innerHTML = '<div class="dn">' + esc(doc.title) + "</div>" +
        '<div class="dm">' + (doc.shared ? "🏢 회사 공유 — 전 담당자의 근거가 될 수 있습니다" : "👤 개인 — 내 질문에만 근거로 나옵니다") +
        "<br>" + (doc.ragOptIn ? '<span class="gtxt-rag">AI 포함</span> — 내 AI가 이 문서를 읽습니다' : "AI 제외 — 대화 검색에 안 나옵니다") +
        "<br>수정 " + new Date(doc.updatedAt).toLocaleString("ko-KR") + "</div>" +
        '<div class="dbt">' +
        '<button data-act="rag">' + (doc.ragOptIn ? "AI 제외" : "AI 포함") + "</button>" +
        '<button data-act="share">' + (doc.shared ? "공유 해제" : "🏢 공유") + "</button>" +
        '<button data-act="down">⬇ .md 내려받기</button>' +
        '<button data-act="del" class="warn">✕ 삭제</button>' +
        "</div>";
    } else if (탭 === "know" || 탭 === "ingest") {
      var kd = know.find(function (x) { return x.documentId === id; });
      if (!kd) return;
      알림(kd.documentId, "지식 문서 " + kd.documentId + " · " + (kd.category || "일반") + " · 조각 " + (kd.chunks || 0));
      d.innerHTML = '<div class="dn">' + esc(kd.documentId) + "</div>" +
        '<div class="dm">영역 ' + esc(kd.category || "일반") + " · " + 등급글자(kd.grade) + " · 조각 " + (kd.chunks || 0) +
        (kd.uploadedBy ? "<br>올린 이 " + esc(kd.uploadedBy) : "") +
        (kd.ingestedAt ? "<br>반입 " + new Date(kd.ingestedAt).toLocaleString("ko-KR") : "") + "</div>" +
        '<div class="dbt"><button class="go" data-go="memory.html" data-lb="AI 지식">🗔 AI 지식에서 관리</button></div>';
    }
  });

  // 내 것 탭 조작(상세 패널) — 기존 계약 그대로(삭제=회수 확인·다운로드 관례·조용한 실패 금지)
  document.getElementById("detail").addEventListener("click", async function (ev) {
    var b = ev.target.closest("button[data-act]");
    if (!b || !선택 || 선택.탭 !== "mine") return;
    var doc = mine.find(function (x) { return x.id === 선택.id; });
    if (!doc) return;
    var act = b.getAttribute("data-act");
    try {
      if (act === "rag") { await window.gijo.personalDocsRag(doc.id, !doc.ragOptIn); }
      else if (act === "share") { await window.gijo.personalDocsShare(doc.id, !doc.shared); }
      else if (act === "down") {
        // 저장소 다운로드 관례(approvals·docbox와 동일 — 검토관 중9): appendChild→click→remove,
        // revoke는 8초 뒤(같은 틱이면 브라우저가 URL을 못 읽는 경합), 완료를 사람에게 알림.
        var full = await window.gijo.personalDocsRead(doc.id);
        var blob = new Blob([full.body || ""], { type: "text/markdown" });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url; a.download = (doc.title || "문서") + ".md";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 8000);
        if (window.gijoTell) window.gijoTell("「" + doc.title + ".md」를 내려받습니다 — 다운로드 폴더를 확인하세요.\nSmart MD에서 다듬은 뒤 📥 가져오기로 되담으면 됩니다.");
        return;
      } else if (act === "del") {
        var ok = window.gijoAsk ? await window.gijoAsk("「" + doc.title + "」을 삭제할까요?\nAI 지식에 실려 있으면 함께 회수됩니다.") : false;
        if (!ok) return;
        await window.gijo.personalDocsDelete(doc.id);
      }
      불러오기();
    } catch (e) { if (window.gijoTell) window.gijoTell("처리 실패 — " + ((e && e.message) || "오류")); }
  });

  불러오기();
})();
</script>
<script src="nav.js"></script>
<script src="selectnotify.js"></script>
</body>
</html>
