<html lang="ko">
<head>
<meta charset="UTF-8">

<title>GIJO AS — 내 문서</title>
<!--
  내 문서 = 문서·지식·학습 통합 허브 (2026-08-20 사장님 — 「내문서에 지식 학습 내문서 다
  통합하고 … 엑셀처럼 촘촘하게 쉽게 많이 보이게」). 승인 시안: mockups/docs-hub-v2/시안.html
  (mockups/docs-single-entry 승계 — 격리·업로드 창구·반입=영수증 결정 그대로).

  ■ v3 (2026-08-20 사장님 — 「내문서에서 모든 파일 통제 및 관리 그리고 수정까지 하나로」·
    「업무용 템플릿도 많이 넣어서 실사용하게」·「모든 문서는 여기서」. 승인 시안:
    mockups/docs-hub-v3/시안.html):
    · 📘 제품 안내 탭 신설 — 문서함(별도 창, docbox.html)을 흡수했다. 제품 매뉴얼 12건
      읽기(docboxList/Read)와 「📝 요청 만들기」(docRequestBuild)가 이 화면으로 왔다.
      문서함 창과 이 화면이 personalDocsList()를 **이중 호출**하던 중복도 함께 없앴다.
    · 👤 내 것 탭에 **전폭 편집 스테이지** — ＋ 새 문서·✏ 고치기. 업무 템플릿 7종(코드
      상수 — LLM이 짓지 않는다)·원문/분할/미리보기. 저장은 personalDocsUpdate/Create
      **이미 있던 라우트** 그대로(서버 신설 0건 — 시안 §5 대응표).
    · ~~Smart MD Studio 창은 그대로 둔다~~ → **2026-08-22에 그 창을 없앴다**(사장님
      「내문서에서 문서작성을 할꺼니 팝업은 필요없어」). 문서 작성은 전부 이 화면 안이다:
      아래 ✏ 문서 편집 스테이지가 그 일을 받았다(붙여넣기 그림·/ 명령·판 이력·첨부·내보내기).
    · 신고 시한 연계 계약(시안 §6): {type:"gijo:newDocFromTemplate", templateId, prefill}
      메시지를 받으면 내 것 탭·편집 스테이지를 열고 템플릿 골격을 채운다. 발신자는
      부모 셸(window.parent)만 믿는다 — 발신자 검증 계약(5.37.0)과 같은 잣대.
      (지금 발신자는 아직 없다 — 신고 시한 카운트다운 카드가 생기면 이 계약으로 들어온다.)
  ■ v4 (2026-08-21 사장님 — 「문서함을 커서나 노션처럼 만들어주면 안돼?」·「지금 디자인 방식이
    너무 화면을 많이 잡아먹고 있어」. 승인 시안: mockups/docs-hub-v4-workspace/시안.html):
    · **작업공간 3단** — 왼쪽 사이드바(옛 제목·부제·탭줄·개인/공유 세그가 한자리로) · 가운데
      목록 · 오른쪽 문서창. 편집·열람·요청이 **문서창 안에서** 열려 목록이 사라지지 않는다
      (옛 전폭 스테이지의 「목록으로 돌아가기」 왕복이 없어졌다).
    · 세로 껍데기 실측 355 → 목록이 위로 올라온다. 📘 제품 안내는 **행을 누르면 바로 본문**.
    · ⚠ 폭 계약(설계관 지적) — 200+400 3단은 약 820px부터 성립한다. 세로 모니터(1080)·표준
      셸(대화창 옆 380)·팝업 최소폭(700)이 전부 그 아래라, 1000px 미만이면 사이드바가 접히고
      820px 미만이면 문서창이 목록을 덮는다. 「좁으면 깨진다」를 그냥 두지 않는다.
    · ⚠ .g-rows-scroll의 --gr-maxh를 none으로 — gijo-ui.css:353의 540px 상한을 그대로 두면
      껍데기를 걷어 번 자리가 빈칸이 된다.
    · 서버·IPC 신설 0건. 게시 관문(publish-gate-ui ③‴)은 같은 커밋에서 v4 자리로 옮겼다.
  ■ v5 (2026-08-22 사장님 — 「연락처도 내 문서에」·「보안제품 비교·소개도 내 문서함에」·
    「내문서에서 문서작성을 할꺼니 팝업은 필요없어」·「사용자가 넣는 파일 내문서에서 다
    확인 가능해야해 취약점파일도」):
    · **사이드바 8갈래**(5+1 → 8): 👤 내 것(personal_docs CRUD) · 🏢 회사 지식(RAG 열람) ·
      📞 연락처(테리토리×제품 표 — **이 PC 저장**, 관리는 lite-contacts.html을 문서창에 품는다) ·
      📘 GIJO AS 안내(출하 문서 읽기전용+요청 만들기 — 옛 이름 「제품 안내」) ·
      📦 보안제품 자료(도입 **검토 중인 타사** 카탈로그 — intro.html 흡수) ·
      🎓 학습(수집 내역 열람 — **조작 없음**) · 🩹 반입(＋로 올린 **모든 파일**의 영수증) ·
      🗂 산출물(예약 자리 — 눌러도 예약 안내만, 데이터인 척 안 한다).
    · **문서 편집이 이 화면의 일이 됐다** — Smart MD 별도 창 폐지. 캡처 붙여넣기·업무 템플릿
      7종·판 이력 20판·그림 첨부 10장·네 형식 내보내기(.md/HTML/PDF/워드)가 편집 스테이지 안.
    · ⚠ 🩹 반입은 **등급·소유자를 건다**(검토관 [높음] 수리) — 서버가 「내가 올린 것 + 내가
      볼 수 있는 것」만 준다. 파일명 자체가 내용이다(퇴사자명단.xlsx).
    · ⚠ 📞 연락처의 전화·이메일은 **대화창 선택으로 보내지 않는다**(검토관 [높음] 수리) —
      선택 맥락은 서버 dispatch로 가므로, 바로 옆 「서버로 보내지 않습니다」 약속이 깨진다.
  ■ 격리가 이 화면의 전부다: 내 것 목록은 서버가 **내 것만** 준다(personaldocs — 남의 것은
    404). 회사 지식 목록도 서버 라우트가 남의 개인 문서를 걸러 준다(memory 라우트).
    반입 영수증도 같은 잣대(열람불가공용)를 지난다.
  ■ 「보기·올리기는 창구, 위험한 관리는 전용 화면」 — 회사 지식의 삭제·등급 변경은 AI 지식
    화면, 학습 승인·실행은 학습 화면. 여기는 바로가기만 잇는다. GIJO AS 안내는 읽기전용 —
    편집(✏·＋)은 👤 내 것 탭에서만 나온다.
  ■ 자유 텍스트 입력칸 0(지시는 대화창) — 단 **편집기·요청 만들기는 예외**다: 본문 작성
    자리는 저작 행위이지 지시가 아니다(옛 Smart MD 창이 갖던 지위를 이 화면이 받았다 —
    시안 §4 자가점검). 검색칸은
    필터 전용.
  ■ 위키링크·백링크·그래프뷰는 만들지 않는다(확정 경계).
-->
<style>
:root{
  --bg:#262624;--panel:#30302e;--panel-2:#1f1e1d;--border:rgba(255,255,255,0.08);
  --border-strong:rgba(255,255,255,0.16);--blue:#3b82f6;--blue-light:#5fa1ff;--white:#ffffff;
  --text:#e9e7e2;--muted:#b3ada4;--muted-2:#a49d95;--red:#e2483d;--amber:#f0a020;--teal:#1eb980;--purple:#8b7cf0;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Pretendard","Malgun Gothic","Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:13px;}
/* ── v4 작업공간 껍데기 ─────────────────────────────────────────────────
   ⚠ nav.js:1389가 임베드에서 `.main{padding-top:16px!important}`을 주입한다. 그대로 두면
   전폭 3단 위에 16px이 얹혀 껍데기가 도로 늘어난다 — 같은 !important를 더 센 선택자로 이긴다
   (설계관 지적). 억지가 아니라 「이 화면은 자기 여백을 스스로 0으로 정한다」는 선언이다. */
body.g-ui .main.v4wrap{padding:0 !important;max-width:none;margin:0;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
.acts{display:flex;gap:6px;}
.btn{background:var(--panel-2);border:1px solid var(--border-strong);color:var(--text);
  padding:0 10px;height:26px;border-radius:7px;font-size:11.75px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;}
/* 📎 첨부(노트북형) — 30px 행 안에 드는 압축 단추. 11px = uireadability 하한.
   ⚠ .btn 블록 **밖**에 둔다 — 블록 안에 넣었다가 CSS 중첩 해석으로 .btn 선언 절반과 이 규칙이
   통째로 죽었다(검토관 4갈래 동시 적발 — 규칙을 넣을 땐 블록 경계부터 본다). */
.wattach{height:20px;padding:0 7px;font-size:11px;border:1px solid var(--border-strong);background:var(--panel-2);color:var(--text);border-radius:6px;cursor:pointer;white-space:nowrap}
.wattach:hover{border-color:var(--ok,#3fa66a);color:var(--ok,#3fa66a)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff;}
.btn:hover{border-color:var(--blue);}
.v4root{flex:1 1 auto;min-height:0;display:flex;}
/* 왼쪽 사이드바 = 옛 탭줄·제목·부제·개인/공유 세그가 한자리로 모인 것 */
.v4sidebar{flex:0 0 200px;width:200px;display:flex;flex-direction:column;background:var(--panel-2);
  border-right:1px solid var(--border-strong);overflow:hidden;}
.v4sidebar.collapsed{flex:0 0 44px;width:44px;}
.v4sh{flex:0 0 36px;height:36px;border-bottom:1px solid var(--border);display:flex;align-items:center;
  gap:6px;padding:0 8px;font-size:12px;font-weight:800;color:var(--text);}
.v4sh .lbl{flex:1 1 auto;overflow:hidden;white-space:nowrap;}
.v4sidebar.collapsed .v4sh .lbl{display:none;}
.v4collapse{background:transparent;border:1px solid var(--border-strong);color:var(--muted);border-radius:6px;
  width:22px;height:22px;font-size:11px;cursor:pointer;font-family:inherit;flex:0 0 auto;line-height:1;}
.v4collapse:hover{border-color:var(--blue);color:var(--text);}
.v4tree{flex:1 1 auto;overflow-y:auto;padding:5px;}
.v4node{display:flex;align-items:center;gap:6px;width:100%;padding:5px 8px;border:none;background:transparent;
  border-radius:6px;font-size:12px;font-weight:700;color:var(--text);cursor:pointer;font-family:inherit;
  white-space:nowrap;overflow:hidden;text-align:left;}
.v4node:hover{background:rgba(255,255,255,.05);}
.v4node.on{background:rgba(59,130,246,.16);color:var(--blue-light);}
.v4node .cnt{margin-left:auto;color:var(--muted-2);font-size:11px;font-weight:700;}
.v4node.on .cnt{color:var(--blue-light);}
.v4node.future{opacity:.6;border:1px dashed var(--border-strong);}
.v4node.future .cnt{color:var(--amber);}
.v4subs{padding-left:16px;}
.v4sub{display:block;width:100%;background:transparent;border:none;text-align:left;font-family:inherit;
  font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer;padding:4px 8px;border-radius:6px;
  white-space:nowrap;overflow:hidden;}
.v4sub:hover{background:rgba(255,255,255,.04);color:var(--text);}
.v4sub.on{color:var(--blue-light);background:rgba(59,130,246,.1);}
.v4grouplbl{font-size:11px;letter-spacing:.4px;color:var(--muted-2);padding:8px 8px 2px;font-weight:800;}
.v4sidebar.collapsed .v4subs,.v4sidebar.collapsed .v4grouplbl{display:none;}
.v4sidebar.collapsed .v4node{justify-content:center;padding:5px 0;}
.v4sidebar.collapsed .v4node .txt,.v4sidebar.collapsed .v4node .cnt{display:none;}
.v4main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;}
.v4toolbar{flex:0 0 38px;height:38px;border-bottom:1px solid var(--border);display:flex;align-items:center;
  gap:8px;padding:0 10px;}
.filter{flex:1 1 auto;min-width:100px;background:var(--panel);border:1px solid var(--border-strong);border-radius:7px;
  color:var(--text);font-size:12px;padding:0 10px;height:26px;outline:none;font-family:inherit;}
.filter:focus{border-color:var(--blue);}
/* 목록 | 문서창 — 좁아지면 문서창이 목록을 덮는다(아래 .narrow) */
.v4content{flex:1 1 auto;min-height:0;display:flex;position:relative;}
.v4list{flex:0 0 400px;width:400px;display:flex;flex-direction:column;border-right:1px solid var(--border);min-height:0;}
.v4list .g-rows{border:none;border-radius:0;flex:1 1 auto;min-height:0;}
.v4docpane{flex:1 1 auto;min-width:0;overflow-y:auto;padding:12px 16px;position:relative;}
.v4content.full .v4docpane{display:none;}
.v4content.full .v4list{flex:1 1 auto;width:auto;border-right:none;}
/* ⚠ 좁은 자리 계약(설계관 ③) — 200+400 3단은 약 820px부터 성립한다. 세로 모니터(1080)·
   표준 셸(대화창 옆 380)·팝업 최소폭(700)이 전부 그 아래라, 그때는 문서창을 목록 위로 덮는다.
   숨기는 게 아니라 겹치는 것이라 「고른 것을 못 본다」가 생기지 않는다. */
.v4content.narrow .v4list{flex:1 1 auto;width:auto;border-right:none;}
.v4content.narrow .v4docpane{position:absolute;inset:0;z-index:6;background:var(--bg);display:none;}
/* ✕ 자리를 비워 둔다 — 안 비우면 편집기 첫 줄 오른쪽 끝 단추(💾 저장)가 ✕에 먹힌다. */
.v4content.narrow.showdoc .v4docpane{display:block;padding-top:36px;}
.v4close{display:none;position:absolute;top:8px;right:10px;z-index:7;width:24px;height:24px;padding:0;
  border-radius:6px;border:1px solid var(--border-strong);background:var(--panel-2);color:var(--muted);
  font-size:12px;cursor:pointer;font-family:inherit;line-height:1;}
.v4content.narrow .v4close{display:block;}
.v4close:hover{border-color:var(--red);color:var(--red-ink, #f5928a);}
/* 등급·보조 글자색 — .g-rows 밖(상세 패널)에서도 먹게 이 화면 범위로 정의(검토관 하2) */
.gtxt-C{color:var(--red);font-weight:800;} .gtxt-S{color:var(--amber);font-weight:800;} .gtxt-O{color:var(--muted);font-weight:700;}
.gm2{color:var(--muted-2);}
.detail{font-size:12.5px;}
/* 문서창이 스테이지(편집·열람·요청)를 품으면 상세는 비킨다 — 단 📖 열람은 위에 남는다
   (무엇을 읽고 있는지가 사라지면 「내가 뭘 눌렀더라」가 다시 생긴다). */
.v4docpane.staged:not(.read) .detail{display:none;}
.v4docpane.staged.read .detail{margin-bottom:10px;}
.detail .dn{font-weight:800;font-size:13.5px;margin-bottom:4px;word-break:break-all;}
.detail .dm{color:var(--muted);line-height:1.6;}
.detail .dbt{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.detail .dbt button{background:transparent;border:1px solid var(--border-strong);color:var(--muted);
  padding:4px 10px;border-radius:7px;font-size:11.75px;font-weight:700;cursor:pointer;font-family:inherit;}
.detail .dbt button:hover{color:var(--text-strong, #fff);border-color:var(--blue);}
.detail .dbt button.warn:hover{color:var(--red-ink, #f5928a);border-color:var(--red);}
.go{background:transparent;border:1px solid var(--border-strong);color:var(--muted);border-radius:7px;
  padding:4px 10px;font-size:11.75px;font-weight:700;cursor:pointer;font-family:inherit;}
.go:hover{color:var(--text-strong, #fff);border-color:var(--blue);}
.topics{display:flex;gap:7px;flex-wrap:wrap;padding:6px 10px;border-bottom:1px solid var(--border);flex:0 0 auto;}
.topic{border:1px solid var(--border);border-radius:7px;background:var(--panel);padding:3px 9px;font-size:11.5px;}
.topic b{font-size:12.5px;color:var(--text-strong, #fff);margin-left:5px;}
.gtxt-rag{color:var(--teal);font-weight:700;}
.gtxt-share{color:var(--amber);font-weight:700;}
.gtxt-up{color:var(--teal);font-weight:700;} .gtxt-down{color:var(--red);font-weight:700;}
.empty{padding:28px 16px;text-align:center;color:var(--muted-2);font-size:12.75px;}
/* 📞 연락처 — 담당 매트릭스. 라이트 화면에서 옮겨 왔다(치수 그대로).
   ⚠ 글자색은 **잉크 토큰**을 쓴다: 원래 값(#7fe3bf 등)은 다크 배경 전제라 프로 흰 바탕에서
     거의 안 보인다. themecolors 감시는 denylist라 새 hex를 못 잡아 **시험은 초록인데 화면만 깨진다** —
     그래서 --red-ink와 같은 장치로 간다(다크=폴백, 흰 테마=pro-white.css가 정의). */
.cx-kpi{display:flex;gap:22px;padding:10px 14px 12px;flex-wrap:wrap;}
.cx-kpi .b{font-size:18px;font-weight:800;color:var(--text);line-height:1.15;}
.cx-kpi .b.gap{color:var(--cov-gap-ink,#e88a82);}
.cx-kpi .l{font-size:11px;color:var(--muted-2);}
table.mx{border-collapse:separate;border-spacing:5px;margin:2px 10px 6px;}
table.mx th{font-size:11px;color:var(--muted);font-weight:600;padding:0 4px;text-align:center;}
table.mx th.rowh{text-align:right;white-space:nowrap;min-width:64px;}
table.mx td{width:74px;height:46px;border-radius:8px;text-align:center;vertical-align:middle;cursor:pointer;font-size:11px;font-weight:700;border:1px solid transparent;transition:transform .06s;}
table.mx td:hover{transform:scale(1.04);border-color:var(--border-strong);}
td.cov-in{background:rgba(30,185,128,.18);color:var(--cov-in-ink,#7fe3bf);border-color:rgba(30,185,128,.4);}
td.cov-ven{background:rgba(240,160,32,.16);color:var(--cov-ven-ink,#f3c06a);border-color:rgba(240,160,32,.38);}
td.cov-gap{background:rgba(226,72,61,.13);color:var(--cov-gap-ink,#e88a82);border-color:rgba(226,72,61,.32);}
table.mx td .cnt{font-size:11px;color:var(--muted-2);font-weight:600;}
.cx-note{padding:8px 14px 14px;font-size:11px;color:var(--muted-2);}
/* 눌러도 열 것이 없는 줄 — 손가락 커서를 주지 않는다. 「눌렀는데 아무 일도 안 난다」는
   이 저장소가 반복해 겪은 결함이라, 없는 조작은 **없어 보이게** 한다(2026-08-22 검토관). */
.g-rows-r.noclick{cursor:default}
.g-rows-r.noclick:hover{background:transparent}
/* 반입 목록의 파일명 칸 — **파일명은 잘리고 올린 이는 안 잘린다**(2026-08-22 4라운드 [중]).
   같은 말줄임 상자에 이어 붙이면 꼬리(올린 이)가 먼저 잘려, 남이 올린 줄이
   「내가 올린 것」으로 읽힌다. 안쪽 그리드로 나눠 짧은 쪽을 지킨다. */
.ing-name{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px;align-items:baseline;min-width:0}
.ing-name .trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ing-by{white-space:nowrap;flex:0 0 auto}
/* 첨부·이력 줄 — 엑셀형 한 줄(30px). 큰 썸네일 격자로 늘어놓지 않는다(밀도 원칙). */
.att-bar,.ver-bar{flex:0 0 auto;border-top:1px solid var(--border);padding:0 12px;font-size:11.5px;color:var(--muted-2);}
.att-bar:empty,.ver-bar:empty{display:none;}
.att-row,.ver-row{display:flex;align-items:center;gap:8px;height:30px;}
.att-row .nm,.ver-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.att-row img{height:20px;width:28px;object-fit:cover;border-radius:3px;border:1px solid var(--border);}
.att-row button,.ver-row button{background:transparent;border:1px solid var(--border);border-radius:5px;color:var(--muted);font:inherit;font-size:11px;padding:2px 7px;cursor:pointer;}
.att-row button:hover,.ver-row button:hover{border-color:var(--border-strong);color:var(--text);}
/* / 명령 메뉴 — 노션 방식. 서랍을 열러 가지 않고 쓰던 자리에서 고른다. */
.slash-menu{display:none;position:absolute;z-index:40;background:var(--panel);border:1px solid var(--border-strong);border-radius:8px;box-shadow:0 10px 26px rgba(0,0,0,.4);min-width:230px;max-height:236px;overflow:auto;}
.slash-menu.on{display:block;}
.slash-menu .si{padding:0 10px;height:28px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text);cursor:pointer;}
.slash-menu .si.on,.slash-menu .si:hover{background:rgba(255,255,255,.07);}
.slash-menu .si .k{color:var(--muted-2);font-size:11px;}
.note{flex:0 0 auto;font-size:11.5px;color:var(--muted-2);line-height:1.5;padding:5px 12px;
  border-top:1px solid var(--border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ── 스테이지(편집·열람·요청) — v4에서는 **문서창 안에서** 열린다.
   목록이 사라지지 않으므로 「목록으로 돌아가기」 왕복이 없다(사장님: 커서·노션처럼).
   ⚠ 상자를 겹으로 두르지 않는다 — 문서창이 이미 바탕·여백을 갖고 있다. */
.stage{display:none;}
.stage.on{display:block;}
.st-top{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.st-top .back{background:transparent;border:1px solid var(--border-strong);color:var(--muted);border-radius:7px;
  padding:6px 12px;font-size:12.25px;font-weight:700;cursor:pointer;font-family:inherit;}
.st-top .back:hover{color:var(--text-strong, #fff);border-color:var(--blue);}
.st-title-in{flex:1;min-width:220px;background:var(--panel-2);border:1px solid var(--border-strong);border-radius:8px;
  color:var(--text);font-size:13.5px;font-weight:700;padding:8px 12px;outline:none;font-family:inherit;}
.st-title-in:focus{border-color:var(--blue);}
.st-btn{background:var(--panel-2);border:1px solid var(--border-strong);color:var(--text);border-radius:8px;
  padding:7px 13px;font-size:12.25px;font-weight:700;cursor:pointer;font-family:inherit;}
.st-btn.save{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:800;}
.st-btn.on{border-color:var(--blue);color:var(--blue-light);}
.viewseg{display:flex;gap:0;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;}
.viewseg button{background:var(--panel-2);border:none;color:var(--muted);padding:7px 11px;font-size:12px;
  font-weight:700;cursor:pointer;font-family:inherit;}
.viewseg button.on{background:rgba(59,130,246,.18);color:var(--blue-light);}
.st-hook{display:none;border-left:3px solid var(--blue);background:rgba(59,130,246,.08);border-radius:8px;
  padding:8px 11px;font-size:12.25px;line-height:1.6;margin-bottom:8px;color:var(--text);}
.st-hook.on{display:block;}
.st-warn{border-left:3px solid var(--amber);background:rgba(240,160,32,.07);border-radius:8px;
  padding:8px 11px;font-size:12px;line-height:1.7;margin-bottom:8px;color:var(--muted);}
.st-warn b{color:var(--amber);}
.tpl-drawer{display:none;border:1px solid var(--border);border-radius:9px;background:var(--panel-2);
  padding:10px 12px;margin-bottom:8px;}
.tpl-drawer.on{display:block;}
.tpl-lead{font-size:11.75px;color:var(--muted-2);margin-bottom:8px;line-height:1.6;}
.tpl-chip{display:inline-flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--panel);
  border:1px solid var(--border-strong);color:var(--text);border-radius:9px;padding:7px 11px;margin:0 6px 6px 0;
  font-size:12.25px;font-weight:700;cursor:pointer;font-family:inherit;text-align:left;max-width:280px;}
.tpl-chip:hover{border-color:var(--blue);}
.tpl-chip .tag{font-size:11px;font-weight:800;color:var(--teal);}
.tpl-chip .ov{font-size:11px;font-weight:400;color:var(--muted-2);line-height:1.4;}
/* 분할 편집 — 문서창 폭이 좁으면(≈520px 미만) 두 칸이 각 200px 밑으로 떨어져 못 쓴다.
   그때는 자동으로 한 칸으로 눕힌다(.thin — JS가 문서창 폭을 재서 붙인다). */
.edit-split{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-height:300px;}
.edit-split.mode-src,.edit-split.thin{grid-template-columns:1fr;}
.edit-split.mode-src .edit-prev,.edit-split.thin .edit-prev{display:none;}
.edit-split.mode-prev{grid-template-columns:1fr;} .edit-split.mode-prev .edit-src{display:none;}
.edit-split.thin.mode-prev .edit-prev{display:block;}
.edit-src textarea{width:100%;height:100%;min-height:300px;background:var(--panel-2);border:1px solid var(--border-strong);
  border-radius:8px;color:var(--text);font:12px/1.7 Consolas,"Cascadia Mono","Malgun Gothic",monospace;
  padding:11px 13px;outline:none;resize:vertical;}
.edit-src textarea:focus{border-color:var(--blue);}
.edit-prev{border:1px solid var(--border);border-radius:8px;background:var(--panel-2);padding:12px 14px;
  overflow-y:auto;max-height:70vh;min-height:300px;}
/* 마크다운 렌더(gijomd 출력) — docbox의 .md 규격을 축약 승계(공용 렌더러라 클래스 결이 같다) */
.md h1{font-size:18px;margin:0 0 12px;color:var(--text-strong, #fff);line-height:1.4;}
.md h2{font-size:14.5px;margin:18px 0 8px;color:var(--text-strong, #fff);padding-bottom:5px;border-bottom:1px solid var(--border);line-height:1.4;}
.md h3{font-size:13.25px;margin:14px 0 6px;color:var(--blue-light);}
.md p{color:var(--text);line-height:1.85;margin-bottom:9px;font-size:12.5px;}
.md ul,.md ol{margin:0 0 11px 20px;color:var(--text);line-height:1.85;font-size:12.5px;}
.md li{margin-bottom:3px;}
.md table{border-collapse:collapse;width:100%;margin:9px 0 14px;font-size:12px;display:block;overflow-x:auto;}
.md th{background:var(--panel-2);color:var(--muted);text-align:left;padding:6px 9px;border:1px solid var(--border);font-weight:700;white-space:nowrap;}
.md td{padding:6px 9px;border:1px solid var(--border);color:var(--text);}
.md pre{background:#1a1a19;border:1px solid var(--border-strong);border-radius:8px;padding:11px;
  overflow-x:auto;font:11.5px/1.6 Consolas,"Cascadia Mono",monospace;color:#b3ada4;margin-bottom:11px;} /* 어두운 상자 고정 — 토큰 금지(2026-08-21) */
.md code{background:rgba(255,255,255,.06);border-radius:4px;padding:1px 5px;font:11.5px Consolas,monospace;color:var(--blue-light,#a7d3ff);}
.md pre code{background:none;padding:0;color:inherit;}
.md blockquote{border-left:3px solid var(--border-strong);padding:2px 0 2px 12px;margin:0 0 11px;color:var(--muted);}
.md hr{border:none;border-top:1px solid var(--border);margin:16px 0;}
.md a{color:var(--blue-light);}
.md strong{color:var(--text-strong, #fff);}
.md img{max-width:100%;border-radius:8px;border:1px solid var(--border);}
/* 요청 만들기(문서함에서 자리 이전 — docbox.html의 규격 승계) */
.cx-chips{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap;}
.cx-chip{background:var(--panel-2);border:1px solid var(--border-strong);color:var(--muted);
  padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;}
.cx-chip.on{background:rgba(59,130,246,.15);border-color:var(--blue);color:var(--blue-light);}
.cx-fld{margin-bottom:11px;}
.cx-fld label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:700;}
.cx-fld .hint{color:var(--muted-2);font-weight:400;}
.cx-fld input,.cx-fld textarea{width:100%;background:var(--panel-2);border:1px solid var(--border-strong);
  border-radius:8px;padding:9px 11px;color:var(--text);font-size:12.5px;font-family:inherit;outline:none;}
.cx-fld input:focus,.cx-fld textarea:focus{border-color:var(--blue);}
.cx-fld textarea{min-height:90px;resize:vertical;line-height:1.7;}
.shots{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px;}
.shot{width:104px;height:68px;border:1px solid var(--border-strong);border-radius:7px;position:relative;
  overflow:hidden;background:var(--panel-2);}
.shot img{width:100%;height:100%;object-fit:cover;}
.shot .x{position:absolute;top:2px;right:5px;color:#fff;background:rgba(0,0,0,.6);border-radius:50%;
  width:16px;height:16px;line-height:16px;text-align:center;font-size:12.25px;cursor:pointer;}
.drop{border:1px dashed var(--border-strong);border-radius:8px;padding:12px;text-align:center;
  font-size:12.5px;color:var(--muted-2);}
.drop.over{border-color:var(--teal);color:var(--teal-ink, #6ee7a0);background:rgba(30,185,128,.06);}
.auto{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;
  font-size:12.5px;color:var(--muted);line-height:1.8;margin-bottom:10px;}
.auto b{color:var(--text);}
.cx-status{font-size:12.25px;color:var(--muted-2);margin-top:8px;min-height:16px;}
.mask{display:inline-block;background:rgba(240,160,32,.14);color:var(--amber);font-size:12px;
  font-weight:800;padding:1px 8px;border-radius:10px;}
</style>
</head>

 <div class="v4root" id="v4root">

(function () {

  // 📊 비교 항목 표(2026-08-29) — 상세 패널에서 「이 제품에 대해 무엇이 확정됐나」를 보인다.
  //

    //   라이트는 서버=내 PC라 「경로는 서버 기계의 폴더」 마찰이 없어 오히려 값어치가 크다(조사 결론).
    ["learn", "future", "vendor"].forEach(function (t) {
      var n = document.querySelector('#tabs .v4node[data-t="' + t + '"]');
      if (n) n.style.display = "none";
    });
    var 기록라벨 = document.querySelectorAll("#tabs .v4grouplbl");
    // 「기록」 묶음은 🩹 반입 하나만 남으므로 라벨은 그대로 둔다(빈 묶음이 아니다).
    void 기록라벨;
  }

  // ?tab= 딥링크 — 문서함(창)을 흡수하며 옛 진입로(하단 📚·설정의 가이드 링크)가
  // 「제품 안내 탭이 선택된 내 문서」로 바로 오게 한다(승인 시안 §7 대응표).
  var 첫탭 = new URLSearchParams(location.search).get("tab");
  if (첫탭 && ["mine", "know", "guide", "learn", "ingest", "vendor", "contacts", "work", "watch", "req"].indexOf(첫탭) >= 0) {
    탭 = 첫탭;
    Array.prototype.forEach.call(document.querySelectorAll("#tabs .v4node"), function (x) {
      x.classList.toggle("on", x.getAttribute("data-t") === 첫탭);
    });
  }

  // ── v4 껍데기 배선 ────────────────────────────────────────────────────
  document.getElementById("v4collapse").addEventListener("click", function () {
    손으로접음 = true;   // 손으로 정한 뒤에는 폭이 바뀌어도 자동으로 되돌리지 않는다
    document.getElementById("v4side").classList.toggle("collapsed");
  });
  // 좁은 자리에서 목록으로 돌아가는 문. 쓰던 글이 있으면 되묻는다(탭 이동과 같은 잣대).
  document.getElementById("v4close").addEventListener("click", async function () {
    if (!(await 쓰던글확인())) return;
    Array.prototype.forEach.call(document.querySelectorAll(".g-rows-r.sel"), function (x) { x.classList.remove("sel"); });
    목록으로();
  });
  폭맞추기();
  if (window.ResizeObserver) {
    try { new ResizeObserver(폭맞추기).observe(document.getElementById("v4root")); } catch (e) { }
  }
  window.addEventListener("resize", 폭맞추기);

  불러오기();
})();
</script>
