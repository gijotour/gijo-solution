<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>GIJO AS — 로그인</title>
<style>
  :root {
    --navy: #262624;
    --navy2: #0c2c6b;
    --orange: #dd5a1c;
    --blue: #5fa1ff;
    --text: #e9e7e2;
    --muted: #b3ada4;
    --border: #3d3c38;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 30% 20%, #35342f 0%, var(--navy) 60%);
    font-family: "Pretendard", "Segoe UI", -apple-system, sans-serif;
    color: var(--text);
  }
  .card {
    width: 380px;
    background: rgba(14, 20, 36, 0.85);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 36px 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
  }
  .logo { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  .logo img { height: 26px; }
  .logo span { font-size: 13px; color: var(--muted); letter-spacing: 0.04em; }
  h1 { font-size: 19px; margin: 0 0 6px; }
  p.sub { color: var(--muted); font-size: 13px; margin: 0 0 24px; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  input {
    width: 100%;
    background: #1f1e1d;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 14px;
    margin-bottom: 16px;
    outline: none;
  }
  input:focus { border-color: var(--blue); }
  .server-row { display: flex; gap: 8px; align-items: center; margin-bottom: 18px; }
  .server-row input { margin-bottom: 0; font-size: 12px; color: var(--muted); }
  button {
    width: 100%;
    background: var(--orange);
    border: none;
    border-radius: 8px;
    padding: 11px;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .err {
    margin-top: 12px;
    font-size: 12.5px;
    color: #ff8080;
    min-height: 16px;
  }
  /* 중복 로그인 확인 — 화면 안에서 묻는다(네이티브 모달은 렌더러를 멈춘다) */
  .dup { margin-top: 12px; padding: 12px 14px; border: 1px solid rgba(240,160,32,.45);
    background: rgba(240,160,32,.10); border-radius: 10px; }
  .dup-t { font-size: 12.5px; font-weight: 800; color: #f0a020; }
  .dup-d { margin-top: 5px; font-size: 12.5px; color: var(--muted); line-height: 1.6; }
  .dup-a { display: flex; gap: 8px; margin-top: 10px; }
  .dup-ok, .dup-no { font-size: 12px; font-weight: 700; border-radius: 8px; padding: 7px 13px; cursor: pointer; }
  .dup-ok { background: #f0a020; color: #21160a; border: 0; }
  .dup-no { background: transparent; color: var(--muted); border: 1px solid rgba(255,255,255,.16); }
  .dup-no:hover { color: #fff; }
  /* 로그인 2단계(2차 인증) */
  .mfa { margin-top: 12px; padding: 14px; border: 1px solid rgba(59,130,246,.4);
    background: rgba(59,130,246,.08); border-radius: 10px; }
  .mfa-t { font-size: 12.5px; font-weight: 700; color: var(--muted); margin-bottom: 7px; }
  .mfa-code { letter-spacing: 9px; text-align: center; font-size: 20px; font-weight: 700;
    font-variant-numeric: tabular-nums; }
  .mfa-reco { letter-spacing: 3px; text-align: center; font-weight: 700; }
  .mfa-d { margin-top: 8px; font-size: 12.25px; color: var(--muted); line-height: 1.6; }
  .mfa-alt { margin-top: 10px; background: transparent; border: 1px solid rgba(255,255,255,.16);
    color: var(--muted); font-size: 12.5px; font-weight: 700; }
  .mfa-alt:hover { color: #fff; }
  /* 2단계에 들어가면 1단계 입력을 치운다 — 안 치우면 담당자가 위 '로그인'을 다시 눌러
     방금 받은 인증 대기를 스스로 무효로 만든다(2026-07-30 실화면 확인). */
  body.mfa-step #recentBox, body.mfa-step .server-row, body.mfa-step #username,
  body.mfa-step #password, body.mfa-step #savePwRow, body.mfa-step #loginBtn,
  body.mfa-step label[for="username"], body.mfa-step label[for="password"] { display: none !important; }
  .mfa-who { font-size: 12.5px; color: var(--muted); margin-bottom: 10px; }
  .mfa-who b { color: var(--text); }
  .hint { margin-top: 18px; font-size: 12.5px; color: var(--muted); line-height: 1.5; }
  .ver { margin-top: 14px; font-size: 12px; color: var(--muted); text-align: center; opacity: .8; }
  /* 최근 로그인 빠른 선택 */
  .recent { margin-bottom: 16px; }
  .recent-t { font-size: 12.25px; color: var(--muted); margin-bottom: 7px; }
  .rc { display: flex; align-items: center; gap: 8px; background: #1f1e1d; border: 1px solid var(--border); border-radius: 8px;
        padding: 8px 10px; margin-bottom: 6px; cursor: pointer; }
  .rc:hover { border-color: var(--blue); }
  .rc-main { min-width: 0; flex: 1; }
  .rc-id { font-size: 13px; color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rc-srv { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rc-key { font-size: 11.5px; color: var(--blue); flex: 0 0 auto; }
  .rc-x { flex: 0 0 auto; color: var(--muted); font-size: 13px; padding: 0 3px; }
  .rc-x:hover { color: #ff8080; }
  .savepw { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); margin: -4px 0 16px; cursor: pointer; }
  .savepw input { width: auto; margin: 0; cursor: pointer; }
  .savepw.dim { opacity: .5; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="gijo-wordmark.svg" alt="GIJO.AI" />
      <span>AI SECURITY MANAGER</span>
    </div>
    <h1>GIJO AS 로그인</h1>
    <p class="sub">보안담당자 계정으로 서버에 연결합니다.</p>

    <div class="recent" id="recentBox" style="display:none">
      <div class="recent-t">최근 로그인 — 눌러서 빠르게 채우기</div>
      <div id="recentList"></div>
    </div>

    <div class="server-row">
      <!-- ⚠ 포트 숫자를 여기 적지 않는다(2026-08-13). 포트는 에디션이 정하고(라이트 7445 ·
           스탠다드/프로 7446) 단일 출처는 main.ts의 서버포트()다. 안내문에 숫자를 박아 두면
           에디션이 바뀔 때마다 여기가 낡고, 담당자는 **틀린 주소를 손으로 입력한다.**
           비워 두면 앱이 자기 에디션에 맞는 주소를 쓴다(main이 auth:getState로 seed). -->
      <input id="serverUrl" placeholder="서버 주소 (이 PC에 동봉된 서버면 비워 두세요)" / aria-label="서버 주소">
    </div>

    <label for="username">아이디</label>
    <input id="username" placeholder="아이디" autocomplete="username" />

    <label for="password">비밀번호</label>
    <input id="password" type="password" placeholder="비밀번호" autocomplete="current-password" />

    <label class="savepw" id="savePwRow"><input type="checkbox" id="savePw" checked /> 이 PC에 로그인 정보 저장(서버·아이디·비밀번호)</label>

    <button id="loginBtn">로그인</button>
    <div class="err" id="errMsg"></div>
    <!-- 중복 로그인 확인 — 화면 안에서 묻는다(4.1.0).
         예전엔 window.confirm을 썼는데, Electron에서는 그게 **OS 네이티브 모달**이라
         렌더러가 통째로 멈춘다. 사람이 직접 누르기 전까지 아무것도 못 하고, 자동화는
         닫지도 못한다(Playwright: "No dialog is showing") — 우리 QA가 로그인을 통과
         못 하던 진짜 이유였다. 화면 안에서 물으면 앱과 어울리고 검사도 통과한다. -->
    <div class="dup" id="dupBox" style="display:none">
      <div class="dup-t">이미 다른 곳에서 로그인 중입니다</div>
      <div class="dup-d">강제로 로그인하면 그 세션은 로그아웃됩니다. 계속할까요?</div>
      <div class="dup-a">
        <button id="dupForce" class="dup-ok">강제 로그인</button>
        <button id="dupCancel" class="dup-no">취소</button>
      </div>
    </div>
    <!-- 로그인 2단계(2차 인증) — 비밀번호는 맞았고 인증앱의 6자리만 남은 상태.
         여기서도 OS 네이티브 모달을 쓰지 않는다(위 중복 로그인 주석과 같은 이유). -->
    <div class="mfa" id="mfaBox" style="display:none">
      <div class="mfa-who" id="mfaWho"></div>
      <div class="mfa-t">인증앱의 6자리 숫자</div>
      <input id="mfaCode" class="mfa-code" inputmode="numeric" maxlength="7" placeholder="000000" autocomplete="one-time-code" aria-label="인증앱 6자리 숫자" />
      <button id="mfaBtn">확인</button>
      <div class="mfa-d" id="mfaTimeLine"></div>
      <button id="mfaRecoToggle" class="mfa-alt">휴대폰을 못 쓰는 경우</button>
      <div id="mfaRecoWrap" style="display:none">
        <div class="mfa-t" style="margin-top:12px">복구 코드 한 개</div>
        <input id="mfaReco" class="mfa-reco" maxlength="12" placeholder="XXXX-XXXX" aria-label="복구 코드" />
        <button id="mfaRecoBtn">복구 코드로 로그인</button>
        <div class="mfa-d">복구 코드는 한 번 쓰면 사라집니다. 다 썼으면 관리자에게 2차 인증 해제를 요청하세요.</div>
      </div>
      <button id="mfaCancel" class="mfa-alt">← 다른 계정으로 로그인</button>
    </div>
    <div class="hint">
      단일 데스크톱 모드: 서버가 이 PC에 동봉되어 있다면 <b>비워 두세요</b> — 앱이 알아서 맞춥니다.<br />
      분산 모드: 사내망 GPU 서버 주소를 입력하세요.
    </div>
    <div class="ver" id="verLine">버전 확인 중…</div>
  </div>

  <script>
    const serverInput = document.getElementById("serverUrl");
    const userInput = document.getElementById("username");
    const passInput = document.getElementById("password");
    const btn = document.getElementById("loginBtn");
    const errMsg = document.getElementById("errMsg");
    const savePw = document.getElementById("savePw");
    const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

    serverInput.value = window.gijo.getServerUrl();

    // 지금 적용된(설치된) 클라이언트 버전 표시.
    (async () => {
      try { const v = await window.gijo.update.currentVersion(); document.getElementById("verLine").textContent = "GIJO AS 클라이언트 v" + v; }
      catch (e) { document.getElementById("verLine").textContent = ""; }
    })();

    // 비밀번호 저장 지원 여부(OS 키체인) — 미지원이면 체크박스 문구를 낮추고 서버·ID만 저장.
    let pwSupported = true;
    (async () => {
      try { pwSupported = await window.gijo.creds.pwSupported(); } catch (e) { pwSupported = false; }
      if (!pwSupported) {
        savePw.checked = false;
        document.getElementById("savePwRow").innerHTML = '<input type="checkbox" id="savePw" checked disabled style="opacity:.4"> 이 PC에 서버·아이디 저장(비밀번호는 이 OS에서 안전 저장 미지원)';
        document.getElementById("savePwRow").classList.add("dim");
      }
    })();

    // 최근 로그인 히스토리 렌더 — 누르면 서버·ID·PW 자동 채움.
    async function loadRecent() {
      let list = [];
      try { list = await window.gijo.creds.list(); } catch (e) { return; }
      const box = document.getElementById("recentBox");
      const ul = document.getElementById("recentList");
      if (!list.length) { box.style.display = "none"; return; }
      box.style.display = "";
      ul.innerHTML = list.map((e, i) =>
        '<div class="rc" data-i="' + i + '"><div class="rc-main"><div class="rc-id">' + esc(e.username) + "</div>" +
        '<div class="rc-srv">' + esc(e.serverUrl) + "</div></div>" +
        (e.hasPw ? '<span class="rc-key" title="비밀번호 저장됨">🔑</span>' : "") +
        '<span class="rc-x" data-del="' + i + '" title="삭제">✕</span></div>'
      ).join("");
      ul.querySelectorAll(".rc").forEach((el) => el.addEventListener("click", async (ev) => {
        if (ev.target.closest("[data-del]")) {
          ev.stopPropagation();
          const e = list[Number(ev.target.closest("[data-del]").dataset.del)];
          await window.gijo.creds.remove(e.serverUrl, e.username);
          loadRecent();
          return;
        }
        const e = list[Number(el.dataset.i)];
        serverInput.value = e.serverUrl;
        userInput.value = e.username;
        window.gijo.setServerUrl(e.serverUrl);
        passInput.value = e.hasPw ? (await window.gijo.creds.getPassword(e.serverUrl, e.username)) : "";
        (passInput.value ? btn : passInput).focus();
      }));
    }
    loadRecent();

    const dupBox = document.getElementById("dupBox");
    document.getElementById("dupForce").addEventListener("click", () => { dupBox.style.display = "none"; doLogin(true); });
    document.getElementById("dupCancel").addEventListener("click", () => { dupBox.style.display = "none"; });

    // ── 로그인 2단계(2차 인증) ────────────────────────────────────────────────
    // 비밀번호는 맞았고 인증앱의 6자리만 남은 상태를 이 안에서 처리한다.
    const mfaBox = document.getElementById("mfaBox");
    const mfaCode = document.getElementById("mfaCode");
    const mfaBtn = document.getElementById("mfaBtn");
    const mfaReco = document.getElementById("mfaReco");
    const mfaRecoBtn = document.getElementById("mfaRecoBtn");
    const mfaRecoWrap = document.getElementById("mfaRecoWrap");
    const mfaTimeLine = document.getElementById("mfaTimeLine");
    let mfaToken = null;

    document.getElementById("mfaRecoToggle").addEventListener("click", () => {
      const on = mfaRecoWrap.style.display === "none";
      mfaRecoWrap.style.display = on ? "block" : "none";
      if (on) mfaReco.focus();
    });

    // 2단계 화면 켜기/끄기 — 1단계 입력을 감춰(body.mfa-step) 실수로 다시 누르지 못하게 한다.
    function setMfaStep(on, who) {
      document.body.classList.toggle("mfa-step", !!on);
      mfaBox.style.display = on ? "block" : "none";
      if (!on) { mfaToken = null; mfaRecoWrap.style.display = "none"; mfaCode.value = ""; mfaReco.value = ""; }
      else if (who) document.getElementById("mfaWho").innerHTML = "<b>" + who + "</b> 계정의 2차 인증";
    }
    document.getElementById("mfaCancel").addEventListener("click", () => {
      setMfaStep(false);
      errMsg.textContent = "";
      resetBtn();
      passInput.value = "";
      userInput.focus();
    });

    // 이 방식은 시계로 숫자를 만든다 — 서버와 이 PC의 시각이 크게 어긋나면 원인이 그것이다.
    // 무인증 health 응답의 serverTime과 비교해 미리 알려 준다(추측하게 두지 않는다).
    async function showClockHint() {
      mfaTimeLine.textContent = "";
      try {
        const h = await window.gijo.checkServerHealth();
        if (!h || !h.serverTime) return;
        const diffSec = Math.round((h.serverTime - Date.now()) / 1000);
        const serverClock = new Date(h.serverTime).toLocaleTimeString("ko-KR");
        mfaTimeLine.textContent = Math.abs(diffSec) >= 30
          ? `⚠ 서버 시각 ${serverClock} — 이 PC와 ${Math.abs(diffSec)}초 차이. 휴대폰 시각을 자동으로 맞춰 주세요.`
          : `서버 시각 ${serverClock} · 30초마다 숫자가 바뀝니다`;
      } catch (e) { /* 시각 안내는 부가 정보라 실패해도 로그인을 막지 않는다 */ }
    }

    // 로그인 성공 뒤 공통 마무리 — 1단계로 끝난 경우와 2단계까지 간 경우가 같아야 한다.
    async function finishLogin() {
      // 접근 서버·ID·PW를 이 PC에 저장(체크 시). PW는 메인 프로세스가 암호화.
      try { await window.gijo.creds.save(serverInput.value.trim(), userInput.value.trim(), passInput.value, savePw.checked); } catch (e) {}
      window.gijoRealtime.connect();
      // 4.0.0 — 앱의 집은 탭 셸이다. 대시보드는 셸이 처음 여는 탭 중 하나일 뿐.
      await window.gijo.navigateTo("app.html");
    }

    async function submitMfa(value, isRecovery) {
      if (!mfaToken) return;
      const code = String(value ?? "").trim();
      if (!code) { errMsg.textContent = isRecovery ? "복구 코드를 넣으세요." : "6자리 숫자를 넣으세요."; return; }
      errMsg.textContent = "";
      mfaBtn.disabled = true; mfaRecoBtn.disabled = true;
      try {
        const r = await window.gijo.loginMfa(mfaToken, code, isRecovery);
        if (r.ok) {
          if (r.recoveryUsed) {
            // 복구 코드를 썼다면 남은 개수를 알려야 한다 — 다 쓰면 관리자 해제밖에 남지 않는다.
            try { window.localStorage.setItem("gijo:recoveryRemaining", String(r.recoveryRemaining ?? "")); } catch (e) {}
          }
          await finishLogin();
          return;
        }
        if (r.code === "already_logged_in") {
          // 코드를 넣는 동안 다른 곳에서 로그인됐다 — 처음부터 강제 로그인으로 다시 한다.
          setMfaStep(false);
          dupBox.style.display = "block";
          return;
        }
        errMsg.textContent = r.message || "인증에 실패했습니다.";
        if (r.code === "invalid_credentials" && !r.message) errMsg.textContent = "숫자가 맞지 않습니다.";
        // 중간 토큰이 만료됐으면 처음부터 다시 — 6자리만 계속 넣어도 통하지 않는다.
        if (/다시 로그인/.test(r.message || "")) { setMfaStep(false); resetBtn(); }
      } finally {
        mfaBtn.disabled = false; mfaRecoBtn.disabled = false;
      }
    }
    mfaBtn.addEventListener("click", () => submitMfa(mfaCode.value, false));
    mfaCode.addEventListener("keydown", (e) => { if (e.key === "Enter") submitMfa(mfaCode.value, false); });
    mfaRecoBtn.addEventListener("click", () => submitMfa(mfaReco.value, true));
    mfaReco.addEventListener("keydown", (e) => { if (e.key === "Enter") submitMfa(mfaReco.value, true); });

    function resetBtn() { btn.disabled = false; btn.textContent = "로그인"; }

    async function doLogin(force) {
      errMsg.textContent = "";
      dupBox.style.display = "none";
      setMfaStep(false);
      btn.disabled = true;
      btn.textContent = "연결 중...";
      try {
        if (serverInput.value.trim()) window.gijo.setServerUrl(serverInput.value.trim());
        const result = await window.gijo.login(userInput.value.trim(), passInput.value, force);
        if (result.ok) {
          await finishLogin();
          return;
        }
        // 2차 인증이 켜진 계정 — 아직 로그인이 끝나지 않았다. 6자리를 받는다.
        if (result.code === "mfa_required") {
          mfaToken = result.mfaToken;
          setMfaStep(true, (result.user && result.user.displayName) || userInput.value.trim());
          mfaCode.focus();
          resetBtn();
          showClockHint();
          return;
        }
        if (result.code === "already_logged_in") {
          // ⚠ window.confirm을 쓰지 않는다 — Electron에서는 OS 네이티브 모달이라 렌더러가
          //   통째로 멈춘다. 사람이 직접 누르기 전까지 아무것도 못 하고, 자동화는 닫지도
          //   못한다(2026-07-29 실측: Playwright가 "No dialog is showing"으로 실패).
          //   화면 안에서 물으면 앱과 어울리고 검사도 통과한다.
          dupBox.style.display = "block";
          btn.disabled = false;
          btn.textContent = "로그인";
          return;
        }
        errMsg.textContent = result.code === "locked"
          ? result.message
          : "로그인 실패: 아이디/비밀번호 또는 서버 주소를 확인하세요.";
        btn.disabled = false;
        btn.textContent = "로그인";
      } catch (e) {
        errMsg.textContent = "로그인 실패: 아이디/비밀번호 또는 서버 주소를 확인하세요.";
        btn.disabled = false;
        btn.textContent = "로그인";
      }
    }

    btn.addEventListener("click", () => doLogin(false));
    passInput.addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(false); });
  </script>
<script src="titlebar.js"></script>
<script src="footbar.js"></script>
</body>
</html>
