<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIJO AS Lite — 로그파일 분석</title>
<link rel="stylesheet" href="gijo-ui.css">
<!--
  lite-loganalysis.html — 라이트 「로그파일 분석」(메뉴 3).
  사장님 말: 「첨부된 자산 메뉴의 내용으로 확인하고 공격경로 분석 가능하게 · Graphify 이용할 수 있으면 이용」

  ■ 본(loganalysis.html)은 listAssets·registerAsset을 쓴다 — **라이트엔 자산 등록부가 없다.**
    그래서 여기서는 그 둘을 안 쓰고, 넣은 로그 파일 자체를 그릇으로 삼는다
    (스캐너에서 「첨부를 그릇으로」를 쓴 것과 같은 요령).

  ■ 공격경로: 본 제품은 analysisAttackPaths(자산 간 경로)를 쓰는데 그건 자산이 있어야 돈다.
    라이트에서는 **로그에서 읽은 것과 지식을 잇는 것**까지가 정직한 범위다.
    ⚠ 못 하는 것을 할 수 있는 것처럼 보이지 않는다 — 자산 기반 경로는 없다고 적는다.

  ■ 다리: analysisIngest · analysisEvents · analysisAnalyze · logAnalysisFiles · queryMemory
-->
<style>
  :root{--bg:#262624;--panel:#30302e;--border:rgba(255,255,255,.09);--text:#e9e7e2;--muted:#b3ada4;--muted-2:#a49d95;--blue:#3b82f6;--teal:#1eb980;--red:#e2483d;--amber:#f0a020;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Pretendard","Malgun Gothic","Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:13px;overflow-y:auto}
  .wrap{padding:18px 22px 40px;display:flex;flex-direction:column;gap:14px;max-width:900px}
  .scr-id{font-size:12.5px;color:var(--muted)}
  .scr-id b{color:var(--text);font-weight:800}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
  .card h2{font-size:13px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:8px}
  .card .sub{font-size:11.5px;color:var(--muted-2);margin-bottom:10px;line-height:1.6}
  .ask{display:flex;gap:8px;margin-bottom:6px}
  .ask input{flex:1;background:#262624;border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font:inherit}
  button{background:transparent;border:1px solid var(--border);border-radius:8px;padding:7px 13px;color:var(--text);font:inherit;font-size:12.5px;cursor:pointer}
  button.go{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
  button:disabled{opacity:.5;cursor:default}
  .ev{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--border)}
  .ev:last-child{border-bottom:0}
  .ev .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ev .m{font-size:11.5px;color:var(--muted-2);flex:0 0 auto}
  .pill{font-size:11px;padding:1px 8px;border-radius:999px}
  .pill.hi{background:rgba(226,72,61,.16);color:var(--red)}
  .pill.mid{background:rgba(240,160,32,.16);color:var(--amber)}
  .pill.lo{background:rgba(30,185,128,.16);color:var(--teal)}
  .hit{padding:10px 0;border-bottom:1px solid var(--border);font-size:12.5px;line-height:1.75;white-space:pre-wrap}
  .hit:last-child{border-bottom:0}
  .res{font-size:12.5px;line-height:1.8;white-space:pre-wrap;max-height:40vh;overflow:auto;padding-right:6px;margin-top:8px}
  .empty{font-size:12.5px;color:var(--muted);line-height:1.75;padding:6px 2px}
  .empty b{color:var(--text)}
  .err{font-size:12.5px;color:var(--red);padding:6px 2px}
  .ok{font-size:12.5px;color:var(--teal);padding:6px 2px}
  .warn{font-size:11.5px;color:var(--amber);line-height:1.7;margin-top:10px;border-top:1px solid var(--border);padding-top:10px}
  .warn b{color:var(--text)}
</style>
</head>
<body>
<div class="wrap">
  <div class="scr-id"><b>로그파일 분석</b> — 로그를 넣으면 무슨 일이 있었는지 읽어 줍니다.</div>

  <section class="card">
    <h2>로그 넣기</h2>
    <div class="sub">방화벽·EDR·서버 로그를 그대로 넣으세요. 넣은 파일이 그대로 근거가 됩니다.</div>
    <div class="ask">
      <input id="file" type="file" accept=".log,.txt,.csv,.json,.nessus" aria-label="로그 파일">
      <button class="go" id="upGo">넣고 분석</button>
    </div>
    <div id="upMsg"></div>
    <div class="res" id="res"></div>
  </section>

  <section class="card">
    <h2>읽어 낸 것 <span id="cnt" style="font-size:11.5px;color:var(--muted);font-weight:600"></span></h2>
    <div id="events">불러오는 중…</div>
  </section>

  <section class="card">
    <h2>이게 무슨 뜻인지 찾기</h2>
    <div class="sub">로그에서 본 낱말을 그대로 물어보세요 — 제품 자료와 내가 넣은 자료에서 찾습니다.</div>
    <div class="ask">
      <input id="q" type="text" placeholder="예: 445 포트로 나가는 트래픽이 갑자기 늘었는데" aria-label="질문">
      <button id="askGo">찾기</button>
    </div>
    <div id="hits"></div>
    <div class="warn">⚠ <b>자산 기반 공격경로는 라이트에 없습니다.</b> 본 제품은 등록된 자산 사이의 경로를 그리는데,
      담당자 PC 1인용에는 그 등록부가 없습니다. 여기서는 <b>로그에서 읽은 것 + 지식</b>까지가 정직한 범위입니다.</div>
  </section>
</div>

<script>
// lite-loganalysis — 자산 등록부(listAssets·registerAsset)를 쓰지 않는다. 라이트엔 없다.
(function () {
  "use strict";
  var g = window.gijo || null;
  var esc = function (v) { return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  function 오류문구(e, 무엇) {
    var m = String((e && e.message) || e || "");
    if (/401|unauthorized/i.test(m)) return "로그인이 풀렸습니다 — 다시 로그인해 주세요.";
    if (/403|forbidden/i.test(m)) return "이 계정에는 권한이 없습니다.";
    if (/fetch|network|ECONN/i.test(m)) return "서버에 닿지 못했습니다 — 서버가 켜져 있는지 확인해 주세요.";
    return 무엇 + "을 못 했습니다 — " + esc(m);
  }
  function 다듬기(t) {
    return String(t || "").split("\n")
      .filter(function (l) { return !/^!\[/.test(l.trim()); })
      .filter(function (l) { return !/^[\s|:-]+$/.test(l); })
      .map(function (l) {
        var s = l.replace(/\*\*/g, "").replace(/^#{1,6}\s*/, "");
        if (/^\s*\|.*\|\s*$/.test(s)) s = s.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|")
          .map(function (c) { return c.trim(); }).filter(Boolean).join(" · ");
        return s;
      }).join("\n").replace(/\n{3,}/g, "\n\n").trim();
  }
  function 심각도(v) {
    var s = String(v || "").toLowerCase();
    if (/critical|high|심각|높/.test(s)) return "hi";
    if (/medium|중/.test(s)) return "mid";
    return "lo";
  }
  if (!g) {
    document.getElementById("events").innerHTML = '<div class="err">앱 밖에서 열려 있어 데이터를 못 읽습니다 — GIJO AS 앱에서 열어 주세요.</div>';
    return;
  }

  async function 목록() {
    var box = document.getElementById("events");
    try {
      var ev = await g.analysisEvents();
      var arr = Array.isArray(ev) ? ev : (ev && (ev.events || ev.items)) || [];
      document.getElementById("cnt").textContent = arr.length ? arr.length + "건" : "";
      if (!arr.length) {
        box.innerHTML = '<div class="empty"><b>아직 넣은 로그가 없습니다.</b><br>' +
          "위에서 로그 파일을 넣으면 읽어 낸 것이 여기 쌓입니다.<br>" +
          "방화벽 차단 로그·EDR 탐지 로그처럼 <b>이상해 보여서 열어 본 파일</b>부터 넣어 보세요.</div>";
        return;
      }
      box.innerHTML = arr.slice(0, 20).map(function (e) {
        var t = e.title || e.summary || e.name || e.id || "";
        return '<div class="ev"><span class="n" title="' + esc(t) + '">' + esc(t) + "</span>" +
          '<span class="pill ' + 심각도(e.severity || e.level) + '">' + esc(e.severity || e.level || "확인") + "</span>" +
          '<span class="m">' + esc(String(e.at || e.createdAt || "").slice(0, 10)) + "</span></div>";
      }).join("") + (arr.length > 20 ? '<div class="empty">외 ' + (arr.length - 20) + "건</div>" : "");
    } catch (e) { box.innerHTML = '<div class="err">' + 오류문구(e, "읽어 낸 것") + "</div>"; }
  }

  async function 넣기() {
    var f = document.getElementById("file").files[0];
    var msg = document.getElementById("upMsg"), res = document.getElementById("res"), btn = document.getElementById("upGo");
    if (!f) { msg.innerHTML = '<div class="err">파일을 고르세요.</div>'; return; }
    // ⚠ .nessus는 로그가 아니라 **취약점 스캔 결과**다 — 로그로 넣으면 25MB XML을 로그로 읽어
    //   쓰레기가 된다(서버 analysishub.ts:876도 「.nessus는 취약점 업로드가 담당」이라 명시).
    //   라이트엔 취약점 등록부가 없다(그건 스탠다드). 대신 **읽기 전용 확인**만 해 준다 —
    //   심각도별 개수·호스트 수만 센다(전체 파싱·자산 등록 없음). 사장님 「라이트라고 너무 빼지 말자」.
    if (/\.nessus$/i.test(f.name)) { await 취약점확인(f); return; }
    btn.disabled = true; res.textContent = "";
    msg.innerHTML = '<div class="empty">넣고 읽는 중입니다 — 로그가 길면 <b>수십 초</b> 걸릴 수 있습니다.</div>';
    try {
      var text = await f.text();
      var r = await g.analysisIngest(f.name, text);
      var evId = r && (r.eventId || r.id || (r.event && r.event.id));
      msg.innerHTML = '<div class="ok">넣었습니다.</div>';
      if (evId && g.analysisAnalyze) {
        msg.innerHTML = '<div class="empty">읽는 중…</div>';
        try {
          var a = await g.analysisAnalyze(evId);
          res.textContent = 다듬기(a && (a.markdown || a.summary || a.text) || "") || "(읽어 낸 내용이 비어 있습니다)";
          msg.innerHTML = '<div class="ok">다 읽었습니다.</div>';
        } catch (e2) {
          // ⚠ 넣기는 됐는데 읽기가 실패한 것과, 아예 안 들어간 것은 다르다 — 갈라 말한다.
          msg.innerHTML = '<div class="ok">넣었습니다.</div><div class="err">다만 읽어 내지 못했습니다 — ' + esc(String(e2 && e2.message || e2)) + "</div>";
        }
      }
      document.getElementById("file").value = "";
    } catch (e) { msg.innerHTML = '<div class="err">' + 오류문구(e, "로그 넣기") + "</div>"; }
    btn.disabled = false;
    목록();
  }

  // 취약점 스캔(.nessus) **읽기 전용 확인** — 개수만 센다. 전체 파싱·자산 등록은 하지 않는다.
  //   severity 속성(0~4)만 정규식으로 센다: 4=긴급 3=높음 2=중간 1=낮음 0=정보.
  //   ⚠ 서버의 parseNessusXml을 복제하지 않는다 — 그건 「분석」이고 이건 「확인」이다(개수 세기뿐).
  async function 취약점확인(f) {
    var msg = document.getElementById("upMsg"), res = document.getElementById("res"), btn = document.getElementById("upGo");
    btn.disabled = true; res.textContent = "";
    msg.innerHTML = '<div class="empty">취약점 스캔을 확인하는 중입니다 — 파일이 크면 <b>몇 초</b> 걸립니다.</div>';
    try {
      var text = await f.text();
      var 등급 = { 4: 0, 3: 0, 2: 0, 1: 0, 0: 0 };
      var m, re = /<ReportItem\b[^>]*\bseverity=["'](\d)["']/gi;
      while ((m = re.exec(text))) { var s = Number(m[1]); if (s in 등급) 등급[s]++; }
      var 호스트 = new Set(); var hm, hre = /<ReportHost\b[^>]*\bname=["']([^"']+)["']/gi;
      while ((hm = hre.exec(text))) 호스트.add(hm[1]);
      var 총 = 등급[4] + 등급[3] + 등급[2] + 등급[1] + 등급[0];
      if (!총 && !호스트.size) {
        msg.innerHTML = '<div class="err">이 파일에서 취약점 항목을 찾지 못했습니다 — .nessus(XML) 원본이 맞는지 확인해 주세요.</div>';
        btn.disabled = false; return;
      }
      var 칸 = function (라벨, n, 색) {
        return '<div class="run"><span class="t" style="color:' + 색 + '">' + 라벨 + '</span><span class="m" style="font-weight:800;color:' + 색 + '">' + n + '건</span></div>';
      };
      msg.innerHTML = '<div class="ok">확인했습니다 — ' + esc(f.name) + '</div>';
      res.innerHTML =
        '<div class="sub" style="margin:4px 0 8px"><b>' + 호스트.size + '개 호스트</b> · 취약점 <b>' + 총 + '건</b> (심각도별)</div>' +
        칸("긴급 (Critical)", 등급[4], "var(--red)") +
        칸("높음 (High)", 등급[3], "var(--amber)") +
        칸("중간 (Medium)", 등급[2], "var(--muted)") +
        칸("낮음 (Low)", 등급[1], "var(--muted-2)") +
        칸("정보 (Info)", 등급[0], "var(--muted-2)") +
        '<div class="guard" style="margin-top:10px">⚠ 이건 <b>읽기 전용 확인</b>입니다 — 개수만 셌습니다. ' +
        '자산별 위험 우선순위·소스 겹침·조치 배정 같은 <b>취약점 운영</b>은 스탠다드 기능입니다. ' +
        '라이트는 이 스캔을 <b>넣어 두지도, 자산으로 등록하지도 않습니다</b>(이 확인은 저장되지 않습니다).</div>';
      document.getElementById("file").value = "";
    } catch (e) { msg.innerHTML = '<div class="err">' + 오류문구(e, "취약점 스캔 확인") + "</div>"; }
    btn.disabled = false;
  }

  async function 찾기() {
    var q = String(document.getElementById("q").value || "").trim();
    var box = document.getElementById("hits"), btn = document.getElementById("askGo");
    if (!q) return;
    btn.disabled = true; box.innerHTML = '<div class="empty">찾는 중…</div>';
    try {
      var hits = await g.queryMemory(q, 5);
      var arr = (Array.isArray(hits) ? hits : []).map(function (h) { return typeof h === "string" ? h : (h.text || ""); }).filter(Boolean);
      box.innerHTML = arr.length
        ? arr.map(function (t) { var c = 다듬기(t); return '<div class="hit">' + esc(c.slice(0, 800)) + (c.length > 800 ? " …" : "") + "</div>"; }).join("")
        : '<div class="empty"><b>이 물음에 닿는 대목을 못 찾았습니다.</b><br>' +
          "로그에 나온 낱말을 그대로 넣어 보시거나(포트 번호·규칙 이름), 말을 조금 바꿔 보세요.</div>";
    } catch (e) { box.innerHTML = '<div class="err">' + 오류문구(e, "찾기") + "</div>"; }
    btn.disabled = false;
  }

  function 시작() {
    document.getElementById("upGo").addEventListener("click", 넣기);
    document.getElementById("askGo").addEventListener("click", 찾기);
    document.getElementById("q").addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); 찾기(); } });
    목록();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", 시작);
  else 시작();
})();
</script>
</body>
</html>
