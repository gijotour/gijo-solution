<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIJO AS — 터미널 (CLI)</title>
<style>
:root{
  --bg:#0a0e1a;--panel:#121a2e;--panel-2:#0e1526;--border:rgba(255,255,255,0.08);
  --border-strong:rgba(255,255,255,0.16);--blue:#3b82f6;--blue-light:#5fa1ff;--white:#ffffff;
  --text:#e7eaf3;--muted:#8b93ab;--muted-2:#5f6785;--red:#e2483d;--amber:#f0a020;--teal:#1eb980;--purple:#8b7cf0;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Pretendard","Malgun Gothic","Segoe UI",sans-serif;background:var(--bg);color:var(--text);}
.app{display:grid;grid-template-columns:220px 1fr;}
.sidebar{padding:22px 14px;border-right:1px solid var(--border);min-height:900px;}
.nav-section{font-size:10.5px;font-weight:700;color:var(--muted-2);letter-spacing:1.2px;margin:18px 10px 8px;}
.nav-section:first-child{margin-top:0;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;margin-bottom:2px;}
.nav-item .ic{width:18px;text-align:center;font-size:14px;}
.nav-item.active{background:rgba(59,130,246,0.12);color:var(--white);box-shadow:inset 3px 0 0 var(--blue);cursor:default;}
.nav-item:hover:not(.active){background:rgba(255,255,255,0.04);color:var(--white);}
.main{padding:28px 32px 40px;}
.topbar-row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;}
.page-title{font-size:21px;font-weight:800;color:#fff;}
.page-sub{font-size:12.5px;color:var(--muted);margin-top:4px;max-width:920px;line-height:1.55;}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--panel-2);}
.header-left{display:flex;align-items:center;gap:12px;}
.header-left img{height:22px;}
.app-title{font-size:15px;font-weight:800;color:#fff;}
.clock{font-size:12px;color:var(--blue-light);font-weight:600;}
.header-right{display:flex;align-items:center;gap:10px;}
.status-pill{display:flex;align-items:center;gap:6px;background:rgba(30,185,128,0.15);border:1px solid rgba(30,185,128,0.4);color:var(--teal);padding:6px 14px;border-radius:20px;font-size:12px;font-weight:800;}
.status-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);}
.beta-tag{background:var(--teal);color:#06281c;font-size:9px;font-weight:800;padding:1px 6px;border-radius:4px;margin-left:2px;}
.avatar-btn{width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;}
.icon-btn{width:32px;height:32px;border-radius:8px;background:var(--panel);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted);cursor:pointer;}

.warn{background:rgba(240,160,32,.08);border:1px solid rgba(240,160,32,.35);border-radius:9px;padding:9px 13px;font-size:11.5px;color:var(--amber);margin-bottom:12px;line-height:1.55;}
.warn b{color:#fff;}

/* 챗봇 명령 요청 */
.askbar{display:flex;gap:8px;margin-bottom:10px;}
.askbar input{flex:1;background:var(--panel-2);border:1px solid var(--border-strong);border-radius:8px;padding:9px 12px;color:var(--text);font-size:12.5px;outline:none;}
.askbar button{background:var(--purple);color:#fff;border:0;border-radius:8px;padding:0 16px;font-size:12.5px;font-weight:800;cursor:pointer;}
.askbar button:disabled{opacity:.5;cursor:default;}

/* 빠른 점검 칩 */
.chips{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.chips .chip-lbl{font-size:11px;color:var(--muted-2);font-weight:700;}
.chip{background:var(--panel-2);border:1px solid var(--border-strong);color:var(--text);border-radius:16px;padding:5px 13px;font-size:11.5px;font-weight:700;cursor:pointer;}
.chip:hover{border-color:var(--blue);color:#fff;}
.chip:disabled{opacity:.5;cursor:default;}

/* 하드닝 점검 리포트 카드 */
.report{background:var(--panel-2);border:1px solid var(--border-strong);border-radius:10px;padding:14px 16px;margin-bottom:12px;font-size:12px;}
.report h4{font-size:14px;color:#fff;margin-bottom:3px;}
.report .meta{font-size:11px;color:var(--muted);margin-bottom:10px;line-height:1.5;}
.report .score{font-size:22px;font-weight:800;}
.report .sumline{display:flex;gap:14px;align-items:baseline;margin-bottom:10px;flex-wrap:wrap;}
.report .tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px;}
.report table{width:100%;border-collapse:collapse;font-size:11.5px;}
.report th,.report td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top;}
.report th{color:var(--muted-2);font-size:10.5px;font-weight:700;text-transform:none;}
.report td.st{white-space:nowrap;font-weight:700;}
.report .ev{color:var(--muted);font-size:11px;}
.report .rc{margin-top:10px;font-size:11.5px;line-height:1.6;}
.report .rc b{color:#fff;}
.report .close{float:right;background:transparent;border:1px solid var(--border-strong);color:var(--muted);border-radius:6px;padding:3px 10px;font-size:11px;cursor:pointer;}
/* 시안 A — 분류별 섹션 그룹 */
.report .glabel{font-size:11px;color:var(--muted-2);font-weight:700;margin-bottom:2px;}
.report .grp{margin-top:14px;border-left:3px solid var(--teal);padding-left:12px;}
.report .ghead{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.report .gname{font-size:13px;font-weight:800;color:#fff;}
.report .gcount{color:var(--muted-2);font-size:11px;}
.report .gbadges{margin-left:auto;display:flex;gap:5px;flex-wrap:wrap;}
.report .gbadge{font-size:9.5px;font-weight:800;padding:1px 7px;border-radius:5px;}
.report .gbadge.ok{background:rgba(30,185,128,.15);color:#1eb980;}
.report .gbadge.bad{background:rgba(226,72,61,.15);color:#e2483d;}
.report .gbadge.warn{background:rgba(240,160,32,.15);color:#f0a020;}
.report .gbadge.na{background:rgba(139,147,171,.15);color:#8b93ab;}
.report .gid{width:52px;color:var(--muted-2);font-weight:700;}

/* 챗봇 제안(승인 카드) */
.propose{background:rgba(240,160,32,.08);border:1px solid rgba(240,160,32,.4);border-radius:9px;padding:10px 13px;margin-bottom:10px;font-size:12px;}
.propose .pc{font-family:Consolas,monospace;color:#8fd6a8;background:#05070d;border:1px solid var(--border);border-radius:6px;padding:6px 9px;margin:6px 0;display:inline-block;}
.propose .pr{color:var(--amber);font-size:11px;}
.propose .pr.blocked{color:#f5928a;}
.propose .acts{margin-top:8px;display:flex;gap:8px;}
.propose .ok{background:var(--teal);color:#06281c;border:0;border-radius:6px;padding:5px 14px;font-size:11.5px;font-weight:800;cursor:pointer;}
.propose .no{background:transparent;border:1px solid var(--border-strong);color:var(--muted);border-radius:6px;padding:5px 14px;font-size:11.5px;font-weight:700;cursor:pointer;}

.term-wrap{background:#05070d;border:1px solid var(--border-strong);border-radius:10px;overflow:hidden;}
.term-bar{display:flex;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--border);font-size:11.5px;color:var(--muted);}
.term-bar .tt{font-weight:800;color:var(--teal);}
.term-bar .badge{font-size:9px;font-weight:800;padding:1px 7px;border-radius:4px;background:rgba(30,185,128,.16);color:var(--teal);}
.term-bar .loc{margin-left:auto;font-size:10.5px;color:var(--muted-2);}
.term-out{height:calc(100vh - 400px);min-height:300px;overflow-y:auto;padding:10px 13px;font-family:"Consolas","Cascadia Mono",monospace;font-size:12px;line-height:1.55;white-space:pre-wrap;word-break:break-word;color:#cfe8d6;}
.term-out .in{color:var(--blue-light);}
.term-out .blk{color:#f5928a;}
.term-in{display:flex;align-items:center;gap:8px;border-top:1px solid var(--border);padding:8px 12px;}
.term-in .ps{color:var(--blue-light);font-family:Consolas,monospace;font-size:12px;}
.term-in input{flex:1;background:transparent;border:0;color:#cfe8d6;font-family:Consolas,monospace;font-size:12.5px;outline:none;}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <span id="homeLink" data-page="dashboard.html" title="대시보드로 이동" style="display:flex;align-items:center;gap:12px;cursor:pointer"><img src="https://gijo.ai/_nuxt/logo_gijo_white.CCh2YXJe.svg" alt="GIJO">
    <div class="app-title">GIJO AS</div></span>
    <div class="clock" id="clockEl">-</div>
  </div>
  <div class="header-right">
    <div class="status-pill" id="statusPill"><span class="dot"></span>연결 확인 중<span class="beta-tag">LIVE</span></div>
    <div class="avatar-btn" id="avatarBtn">-</div>
    <div class="icon-btn" id="settingsBtn">⚙</div>
  </div>
</div>

<div class="app">
  <div class="sidebar" id="gijoNav"></div>

  <div class="main">
    <div class="topbar-row">
      <div>
        <div class="page-title">&gt;_ 터미널 (CLI) <i class="gijo-info" data-topic="터미널 (CLI)"></i></div>
      </div>
    </div>

    <div class="warn">⚠ 이 터미널은 담당자 본인 PC에서 명령을 실행합니다. 원격 대상 작업은 직접 입력한 명령(ssh 등) 안에서만 이뤄집니다 — 앱이 원격에 직접 붙지 않습니다.</div>

    <!-- ④ 챗봇에게 명령 요청 → 허용목록 판정 → 승인 후 실행 / 또는 "점검해줘" → 하드닝 점검 실행 -->
    <div class="askbar">
      <input id="askInput" placeholder="챗봇에게 명령 요청 (예: 10.0.0.5 포트 스캔해줘 / 이 장비 하드닝 점검해줘)" aria-label="챗봇에게 명령 요청">
      <button id="askBtn">🤖 명령 제안 받기</button>
    </div>
    <div class="chips">
      <span class="chip-lbl">빠른 점검:</span>
      <button class="chip" data-scan="kisa">🛡 국내 CCE 점검 (리눅스)</button>
      <button class="chip" data-scan="cis">🌐 CIS Benchmark 점검</button>
      <button class="chip" data-scan="kisa_pc">💻 PC 점검 (Windows)</button>
      <button class="chip" data-scan="kisa_net">🔀 네트워크 장비 점검</button>
    </div>
    <div id="proposeSlot"></div>

    <div class="term-wrap">
      <div class="term-bar"><span class="tt">&gt;_ 터미널</span><span class="badge" id="shellBadge">담당자 PC</span><span class="loc" id="termLoc">셸 시작 중…</span></div>
      <div class="term-out" id="termOut"></div>
      <div class="term-in"><span class="ps">PS&gt;</span><input id="termInput" placeholder="명령 입력 후 Enter" autocomplete="off" spellcheck="false" aria-label="명령 입력 후 Enter"></div>
    </div>
  </div>
</div>

<script>
  const clockEl = document.getElementById("clockEl");
  const statusPill = document.getElementById("statusPill");
  const avatarBtn = document.getElementById("avatarBtn");
  const termOut = document.getElementById("termOut");
  const termInput = document.getElementById("termInput");
  const esc = (s) => String(s == null ? "" : s).replace(/</g, "&lt;");

  function tick() { clockEl.textContent = new Date().toLocaleString("ko-KR", { hour: "2-digit", minute: "2-digit", hour12: true, year: "numeric", month: "2-digit", day: "2-digit" }); }
  async function loadHealth() { try { await window.gijo.checkServerHealth(); statusPill.innerHTML = '<span class="dot"></span>운영중<span class="beta-tag">LIVE</span>'; } catch (e) { statusPill.innerHTML = '<span class="dot" style="background:#e2483d"></span>서버 연결 끊김'; } }
  async function loadUser() { try { const u = await window.gijo.me(); avatarBtn.textContent = (u.displayName || u.username || "-").charAt(0); } catch (e) {} }

  function append(text, cls) {
    const span = document.createElement("span");
    if (cls) span.className = cls;
    span.textContent = text;
    termOut.appendChild(span);
    termOut.scrollTop = termOut.scrollHeight;
  }

  // 실제 실행(수동/챗봇 공통) — 위험이면 차단, 아니면 실행. 실행·차단을 작업기록에 남긴다.
  async function runCommand(cmd, source) {
    const line = cmd.trim();
    if (!line) return;
    append(`\nPS> ${line}\n`, "in");
    const r = await window.gijo.terminal.exec(line);
    if (r && r.blocked) {
      append(`🚫 차단됨 — ${r.reason}\n`, "blk");
      window.gijo.recordAudit(`CLI 차단: ${line}`, source || "manual", r.reason, "block", "blocked").catch(() => {});
      return;
    }
    window.gijo.recordAudit(`CLI 실행: ${line}`, source || "manual", null, "cli", "ok").catch(() => {});
  }

  // "점검해줘" 계열은 단일 명령 제안이 아니라 표준 기준 하드닝 점검을 실제로 실행한다(결정적 인텐트).
  const SCAN_INTENT = /하드닝|보안\s*설정\s*점검|설정\s*점검|CCE|CIS|취약점\s*진단|기준\s*점검|보안\s*점검|장비.{0,6}점검/i;

  // ④ 챗봇에게 명령 제안 받기 → 정책 판정 → 승인 카드 / 점검 요청이면 하드닝 점검 실행
  async function askChatbot() {
    const q = document.getElementById("askInput").value.trim();
    if (!q) return;
    if (SCAN_INTENT.test(q)) {
      const std = /\bcis\b|국제/i.test(q) ? "cis" : /\bpc\b|피시|윈도우|windows/i.test(q) ? "kisa_pc" : /네트워크\s*장비|스위치|라우터|cisco/i.test(q) ? "kisa_net" : "kisa";
      runHardeningFromChat(std, q); return;
    }
    const btn = document.getElementById("askBtn");
    btn.disabled = true; btn.textContent = "🤖 생각 중…";
    try {
      const r = await window.gijo.suggestCommand(q);
      renderPropose(r.command, r.explanation);
    } catch (e) {
      renderPropose(null, "명령 제안을 받지 못했습니다: " + ((e && e.message) || e));
    } finally {
      btn.disabled = false; btn.textContent = "🤖 명령 제안 받기";
    }
  }

  const MARK = { PASS: "✅ 양호", FAIL: "❌ 취약", WARN: "⚠️ 확인필요", NA: "➖ 해당없음" };
  const MARK_COLOR = { PASS: "#1eb980", FAIL: "#e2483d", WARN: "#f0a020", NA: "#8b93ab" };

  // 챗봇 명령 → 대상 장비 CLI에서 표준 기준 하드닝 점검 실행 → 리포트 렌더 (실제 동작)
  async function runHardeningFromChat(standard, q) {
    const label = standard === "cis" ? "CIS Benchmark" : "국내 CCE (KISA 주요정보통신기반시설)";
    const btn = document.getElementById("askBtn");
    const chips = document.querySelectorAll(".chip");
    btn.disabled = true; btn.textContent = "🛡 점검 중…"; chips.forEach((c) => (c.disabled = true));
    append(`\n[챗봇] ${label} 기준 보안장비 하드닝 점검을 시작합니다…\n`, "in");
    try {
      const res = await window.gijo.hardeningScan(standard);
      renderScanReport(res.report);
      append(res.summary + "\n");
    } catch (e) {
      append(`[점검 실패] ${(e && e.message) || e}\n`, "blk");
    } finally {
      btn.disabled = false; btn.textContent = "🤖 명령 제안 받기"; chips.forEach((c) => (c.disabled = false));
    }
  }

  // 시안 A — 분류(카테고리)별 섹션 그룹. 그룹 헤더에 소계 배지 + 좌측 색 바(취약 있으면 빨강).
  function renderScanReport(rep) {
    const s = rep.summary;
    const verdictColor = s.fail === 0 ? "#1eb980" : s.fail <= 2 ? "#f0a020" : "#e2483d";
    const cats = [];
    rep.items.forEach((i) => { if (!cats.includes(i.cat)) cats.push(i.cat); });
    const groups = cats.map((cat) => {
      const items = rep.items.filter((i) => i.cat === cat);
      const c = { PASS: 0, FAIL: 0, WARN: 0, NA: 0 };
      items.forEach((i) => c[i.status]++);
      const bar = c.FAIL > 0 ? "#e2483d" : c.WARN > 0 ? "#f0a020" : "#1eb980";
      const badges =
        (c.PASS ? `<span class="gbadge ok">양호 ${c.PASS}</span>` : "") +
        (c.FAIL ? `<span class="gbadge bad">취약 ${c.FAIL}</span>` : "") +
        (c.WARN ? `<span class="gbadge warn">확인 ${c.WARN}</span>` : "") +
        (c.NA ? `<span class="gbadge na">해당없음 ${c.NA}</span>` : "");
      const rows = items.map((i) =>
        `<tr><td class="gid">${esc(i.id)}</td><td>${esc(i.title)}</td>` +
        `<td class="st" style="color:${MARK_COLOR[i.status]};width:88px">${MARK[i.status]}</td>` +
        `<td class="ev">${esc(i.evidence)}</td></tr>`
      ).join("");
      return `<div class="grp" style="border-left-color:${bar}">` +
        `<div class="ghead"><span class="gname">${esc(cat)}</span><span class="gcount">${items.length}항목</span>` +
        `<span class="gbadges">${badges}</span></div>` +
        `<table><tbody>${rows}</tbody></table></div>`;
    }).join("");
    document.getElementById("proposeSlot").innerHTML =
      `<div class="report">` +
      `<button class="close" onclick="this.closest('.report').remove()">닫기</button>` +
      `<h4>🛡 보안장비 하드닝 점검 리포트</h4>` +
      `<div class="meta">대상: ${esc(rep.target)} · 기준: ${esc(rep.standardLabel)}<br>점검 방식: 장비 CLI 실 명령 실행·실측 · ${(rep.durationMs / 1000).toFixed(1)}초 소요</div>` +
      `<div class="sumline"><span class="score" style="color:${verdictColor}">${s.rate}%</span>` +
      `<span style="color:${verdictColor};font-weight:800">${esc(s.verdict)}</span>` +
      `<span style="color:var(--muted)">✅ ${s.pass} · ❌ ${s.fail} · ⚠️ ${s.warn} · ➖ ${s.na} (총 ${s.total})</span></div>` +
      `<div class="glabel">분류별 점검 결과</div>${groups}</div>`;
  }
  function renderPropose(command, explanation) {
    const slot = document.getElementById("proposeSlot");
    if (!command) { slot.innerHTML = `<div class="propose"><div class="pr">${esc(explanation)}</div></div>`; return; }
    const cls = window.gijo.classifyCommand(command); // {decision, inList, reason}
    const blocked = cls.decision === "blocked";
    slot.innerHTML =
      `<div class="propose"><div>🤖 제안: ${esc(explanation || "")}</div>` +
      `<div class="pc">${esc(command)}</div>` +
      `<div class="pr ${blocked ? "blocked" : ""}">${blocked ? "🚫 위험 명령 — 실행할 수 없습니다: " + esc(cls.reason) : (cls.inList ? "✓ 허용목록 명령 — 승인 후 실행" : "⚠ 허용목록 밖 — 승인 시에만 실행")}</div>` +
      (blocked ? "" : `<div class="acts"><button class="ok" id="proposeOk">승인·실행</button><button class="no" id="proposeNo">거부</button></div>`) +
      `</div>`;
    if (!blocked) {
      document.getElementById("proposeOk").addEventListener("click", () => {
        window.gijo.recordAudit(`챗봇 명령 승인: ${command}`, "chatbot", explanation || null, "cli", "ok").catch(() => {});
        runCommand(command, "chatbot");
        slot.innerHTML = "";
      });
      document.getElementById("proposeNo").addEventListener("click", () => { slot.innerHTML = ""; });
    }
  }

  async function init() {
    tick(); setInterval(tick, 30000);
    await loadUser();
    loadHealth();

    // 담당자 PC 셸 시작 + 출력 스트리밍 구독
    window.gijo.terminal.onData((d) => append(d));
    try {
      const s = await window.gijo.terminal.start();
      document.getElementById("termLoc").textContent = `${s.shell} · ${s.cwd}`;
      document.getElementById("shellBadge").textContent = `담당자 PC · ${s.shell}`;
    } catch (e) { append("[셸을 시작하지 못했습니다]\n", "blk"); }

    // 대시보드 자산 탐색기의 "🖥 터미널 연결"에서 넘어온 프리필(ssh 명령)을 채워 둔다(검토 후 Enter로 실행).
    try {
      const pf = localStorage.getItem("gijo.terminal.prefill");
      localStorage.removeItem("gijo.terminal.prefill");
      if (pf) { termInput.value = pf; append(`\n[자산 탐색기] 연결 명령을 준비했습니다 — 검토 후 Enter로 실행하세요.\n`, "in"); setTimeout(() => termInput.focus(), 50); }
    } catch (e) {}

    termInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { const v = termInput.value; termInput.value = ""; runCommand(v, "manual"); }
    });
    document.getElementById("askBtn").addEventListener("click", askChatbot);
    document.getElementById("askInput").addEventListener("keydown", (e) => { if (e.key === "Enter") askChatbot(); });
    document.querySelectorAll(".chip[data-scan]").forEach((c) => c.addEventListener("click", () => runHardeningFromChat(c.dataset.scan, c.dataset.scan)));

    document.getElementById("settingsBtn").addEventListener("click", () => window.gijo.navigateTo("settings.html"));
    document.querySelectorAll("[data-page]").forEach((el) => el.addEventListener("click", () => window.gijo.navigateTo(el.dataset.page)));
  }

  if (!window.gijo.isAuthenticated()) window.gijo.navigateTo("login.html");
  else init();
</script>

<div id="gijoChatWidget" data-start="collapsed" data-prompts='["점검 명령 추천해줘"]'></div>
<script src="nav.js"></script>
<script src="chatwidget.js"></script>
</body>
</html>
