<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIJO AS — 유지보수 점검</title>
<!--
  유지보수 점검(maintenance) 전용 화면 — 2026-08-01 신설.

  왜 만들었나: /api/maintenance에 점검 10건(그중 기한 초과 6건)이 들어 있는데
  **이걸 보여주는 화면이 하나도 없었다.** 보안 KPI는 "지연 5건"이라고 세어 주면서
  누르면 갈 곳이 없었고, 대화창으로만 물어볼 수 있었다. 지표가 있는데 손댈 자리가
  없는 것이 이 제품에서 반복된 결함이라 그 마지막 구멍을 메운다.
-->
<style>
:root{
  --bg:#262624;--panel:#30302e;--panel-2:#1f1e1d;--border:rgba(255,255,255,0.08);
  --border-strong:rgba(255,255,255,0.16);--blue:#3b82f6;--blue-light:#5fa1ff;--white:#ffffff;
  --text:#e9e7e2;--muted:#b3ada4;--muted-2:#a49d95;--red:#e2483d;--amber:#f0a020;--teal:#1eb980;--purple:#8b7cf0;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Pretendard","Malgun Gothic","Segoe UI",sans-serif;background:var(--bg);color:var(--text);}
.app{display:grid;grid-template-columns:220px 1fr;}
.sidebar{padding:22px 14px;border-right:1px solid var(--border);min-height:100vh;}
.main{padding:20px 26px 48px;}
.page-title{font-size:16px;font-weight:800;}

.ident{font-size:12.5px;color:var(--muted);margin-bottom:16px;max-width:1040px;}
.ident b{color:var(--text);}
.ident .warn{color:#f5928a;font-weight:700;}

/* 요약 카드 = 필터. 다른 화면과 같은 방식이라 새로 배울 게 없다. */
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:1040px;margin-bottom:18px;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px;cursor:pointer;transition:border-color .12s,background .12s;}
.card:hover{border-color:var(--border-strong);}
.card.on{border-color:var(--blue);background:rgba(59,130,246,.08);}
.card .l{font-size:12.5px;color:var(--muted);font-weight:700;}
.card .v{font-size:30px;font-weight:900;line-height:1.15;margin-top:2px;}
.card .s{font-size:11.75px;color:var(--muted-2);margin-top:2px;}

/* 지금 손댈 일 — 보안 KPI와 같은 결(숫자에서 곧장 할 일로) */
.todo{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px;max-width:1040px;margin-bottom:18px;}
.todo .t{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:10px;}
.trow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--border);}
.trow:first-of-type{border-top:0;}
.trow .w{flex:1;min-width:0;font-size:12.5px;}
.trow .w .sub{display:block;font-size:12px;color:var(--muted-2);margin-top:2px;}
.todo-none{font-size:12px;color:var(--muted-2);}

.btn{flex:none;font-size:12.25px;font-weight:700;padding:5px 11px;border-radius:7px;border:1px solid var(--border-strong);background:transparent;color:var(--text);cursor:pointer;font-family:inherit;}
.btn:hover{background:rgba(255,255,255,.06);}
.btn.prim{border-color:rgba(59,130,246,.5);color:var(--blue-light);}
.btn[disabled]{opacity:.55;cursor:default;}

.tbl{width:100%;max-width:1040px;border-collapse:collapse;background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.tbl th{text-align:left;font-size:12.25px;color:var(--muted);font-weight:700;padding:10px 12px;background:var(--panel-2);border-bottom:1px solid var(--border);}
.tbl td{font-size:12.5px;padding:11px 12px;border-top:1px solid var(--border);vertical-align:middle;}
.tbl tr.late td{background:rgba(226,72,61,.06);}
.pill{display:inline-block;font-size:12px;font-weight:800;padding:2px 8px;border-radius:20px;white-space:nowrap;}
.p-late{background:rgba(226,72,61,.16);color:#f5928a;}
.p-sched{background:rgba(139,147,171,.16);color:var(--muted);}
.p-rep{background:rgba(240,160,32,.16);color:#f7c777;}
.p-app{background:rgba(30,185,128,.16);color:#6fdcb5;}
.p-rej{background:rgba(226,72,61,.16);color:#f5928a;}
.soon{color:var(--amber);font-weight:700;font-size:12.25px;}
.dim{color:var(--muted-2);font-size:12.25px;}
.acts{display:flex;gap:6px;justify-content:flex-end;}
.empty{padding:28px;text-align:center;color:var(--muted-2);font-size:12.5px;}

/* ── 제품 유지보수(옛 화면) 통합 — 2026-08-02 ───────────────────────────────
   두 화면이 **같은 서버 기능**을 불렀고(listMaintenance·approveMaintenance·점검 이력)
   이름도 「제품 유지보수」/「유지보수 점검」이라 구분이 안 됐다. 기능은 그대로 옮겼다. */
.cat{margin-bottom:28px;max-width:1000px;}
.cat-head{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;}
.cat-title{font-size:16px;font-weight:800;color:#fff;}
.cat-intro{font-size:12.5px;color:var(--muted);margin-bottom:14px;line-height:1.6;max-width:840px;}
.kb-row{display:flex;gap:10px;align-items:center;margin-bottom:6px;flex-wrap:wrap;}
.kb-row input[type=file]{flex:1;min-width:220px;font-size:12px;color:var(--muted);}
.ops-btn-secondary{background:var(--panel);border:1px solid var(--border-strong);color:var(--text);border-radius:8px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;}
.ops-btn-secondary:disabled{opacity:.55;cursor:default;}
.ops-hint{font-size:12.5px;color:var(--muted);min-height:14px;margin-bottom:14px;}
.kb-search-row{display:flex;gap:8px;margin-bottom:8px;}
.kb-search-row input{flex:1;background:var(--panel);border:1px solid var(--border-strong);border-radius:10px;padding:11px 14px;color:var(--text);font-size:13px;outline:none;}
.kb-search-row button{background:var(--blue);color:#fff;border:none;border-radius:10px;padding:0 22px;font-size:13px;font-weight:800;cursor:pointer;}
.docsearch-results{margin-top:6px;max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;}
.docsearch-results .chunk{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--text);line-height:1.7;}
.maint-form{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.maint-form input,.maint-form select{background:var(--panel);border:1px solid var(--border-strong);border-radius:8px;padding:9px 12px;color:var(--text);font-size:12.5px;outline:none;}
.maint-form input:not([type]),.maint-form input[type=text]{flex:1;min-width:160px;}
.maint-form button{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:0 16px;font-size:12.5px;font-weight:800;cursor:pointer;}
.maint-list{display:flex;flex-direction:column;gap:8px;}
.maint-item{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;}
.maint-main{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.maint-badge{font-size:11.75px;font-weight:800;padding:3px 8px;border-radius:6px;white-space:nowrap;}
.maint-badge.sched{color:var(--blue-light);background:rgba(59,130,246,0.14);}
.maint-badge.rep{color:var(--amber);background:rgba(240,160,32,0.14);}
.maint-badge.appr{color:var(--teal);background:rgba(30,185,128,0.14);}
.maint-badge.rej{color:#f5928a;background:rgba(226,72,61,0.14);}
.maint-title{font-size:13px;font-weight:800;color:#fff;}
.maint-product{font-size:12.5px;color:var(--muted);}
.maint-asset{font-size:12px;font-weight:700;color:var(--purple);background:rgba(139,124,240,0.14);padding:2px 8px;border-radius:6px;}
.maint-date{font-size:12.5px;color:var(--muted-2);margin-left:auto;}
.maint-date.overdue{color:#f5928a;font-weight:800;}
.maint-actions{display:flex;gap:6px;}
.maint-btn{background:var(--panel-2);border:1px solid var(--border-strong);color:var(--text);border-radius:7px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer;}
.maint-btn:disabled{opacity:.55;cursor:default;}
.maint-btn.ok{background:var(--teal);border-color:var(--teal);color:#06281c;}
.maint-btn.danger{background:transparent;border-color:#e2483d;color:#f5928a;}
.maint-note{font-size:12.5px;color:var(--muted);margin-top:6px;padding-left:2px;}
.maint-note.ok{color:var(--teal);}
.maint-note.rej{color:#f5928a;}
.maint-report-form{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.maint-report-form textarea{flex:1;min-width:200px;min-height:50px;background:var(--panel-2);border:1px solid var(--border-strong);border-radius:8px;padding:8px 10px;color:var(--text);font-size:12px;font-family:inherit;resize:vertical;}
.maint-report-form input[type=file]{font-size:12.25px;color:var(--muted);max-width:220px;}
.maint-report-form button{background:var(--blue);color:#fff;border:none;border-radius:7px;padding:0 14px;font-size:12.5px;font-weight:800;cursor:pointer;}
.maint-timeline{margin-top:12px;padding-left:6px;border-left:2px solid var(--border);display:flex;flex-direction:column;gap:12px;}
</style>
<script src="viz.js"></script>
</head>
<body>
<div class="app">
  <div class="sidebar" id="gijoNav"></div>

  <div class="main">
    <div class="page-title">유지보수 점검</div>

    <div class="ident" id="ident">
      🔧 <b>유지보수 점검</b> — 보안장비·AI 자산의 정기 점검을 <b>기한 순으로</b> 챙기는 곳입니다.
    </div>

    <div id="gijoChatWidget" data-prompts='["기한 지난 점검 알려줘","이번 달 점검 일정 뭐야?"]' style="max-width:640px;margin-bottom:16px;"></div>

    <div class="sum" id="sumCards" data-gijo-summary></div>

    <!-- 그림 먼저(전-7 ①, 2026-08-05). 위 카드는 "무엇부터"고, 이 띠는 **어느 제품이 밀렸나**다
         — 예전엔 글줄로 늘어놓던 제품별 미완료를 막대로 세운다. 막대를 누르면 그 제품만 남는다. -->
    <div id="vizStrip"></div>
    <div id="vizFilter" style="display:none"></div>
    <div id="todoWrap"></div>

    <table class="tbl">
      <thead><tr>
        <th style="width:104px">기한</th><th>점검 항목</th><th style="width:190px">대상</th>
        <th style="width:96px">상태</th><th style="width:74px">주기</th><th style="width:180px"></th>
      </tr></thead>
      <tbody id="rows"><tr><td colspan="6" class="empty">불러오는 중…</td></tr></tbody>
    </table>

    <div class="cat" data-gijo-fold="지식베이스 — 매뉴얼·케이스·에러로그">
      <div class="cat-head"><span style="font-size:18px">📚</span><span class="cat-title">① 지식베이스 — 매뉴얼 · 케이스 · 에러로그</span></div>
      <div class="cat-intro">보안제품 매뉴얼, 장애 대응 케이스, 에러로그(.log)를 올려두면 아래 검색으로 바로 찾을 수 있습니다. 빈 상태로 시작하고 싶지 않다면 "샘플 문서 추가"로 감을 잡아보세요.</div>

      <div class="kb-row">
        <button id="kbSampleBtn" class="ops-btn-secondary">샘플 문서 추가</button>
      </div>
      <div id="kbUploadStatus" class="ops-hint"></div>

      <div class="kb-search-row">
        <!-- 질문형 placeholder를 검색형으로(2026-08-19) — 여기는 문서 조각 검색이지 AI 질의창이 아니다.
             질문처럼 보이면 대화창과 경쟁하는 「미니 챗봇」으로 오해된다. -->
        <input id="kbQueryInput" placeholder="문서 안에서 낱말 찾기 (예: 방화벽 정책)">
        <button id="kbQueryBtn">검색</button>
      </div>
      <div id="kbQueryResults" class="docsearch-results" style="display:none"></div>
    </div>

    <!-- ② 이중 렌더 제거(2026-08-19 결함 수리) — 옛 화면의 점검 카드 목록·KPI 5칸·제품 좁히기 띠가
         위의 새 표와 **같은 데이터를 두 번** 그리고 있었다(08-02 통합 미완). 승인·반려·점검서·기록은
         위 표가 전부 하므로 옛 목록을 걷어냈다. 남긴 것: 일정 추가 폼·지연 메일(이 구역만의 기능). -->
    <div class="cat" data-gijo-fold="점검 일정 추가 · 지연 알림">
      <div class="cat-head"><span style="font-size:18px">🔧</span><span class="cat-title">② 점검 일정 추가 · 지연 알림</span></div>
      <div class="cat-intro">여기서 일정을 추가하면 위 목록에 바로 나타납니다. 점검서 제출·승인·반려는 위 목록의 단추로 합니다.</div>

      <!-- 지연/마감 점검 이메일 알림 — 기존 SMTP 설정(설정 화면) 재사용. -->
      <div style="background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <span style="font-size:12px;font-weight:700;color:var(--text);">📧 지연 점검 알림</span>
        <input id="notifyEmails" placeholder="수신자 이메일(쉼표로 구분)" style="flex:1;min-width:200px;background:var(--panel-2);border:1px solid var(--border-strong);border-radius:8px;padding:8px 12px;color:var(--text);font-size:12.5px;outline:none;" aria-label="수신자 이메일">
        <button id="notifyBtn" class="ops-btn-secondary" type="button">지연 점검 메일 보내기</button>
        <span id="notifyLine" style="font-size:12.5px;color:var(--muted);"></span>
      </div>

      <form id="maintForm" class="maint-form">
        <input id="mTitle" type="text" placeholder="점검 제목 (예: 방화벽 정책 점검)" required aria-label="점검 제목">
        <input id="mProduct" type="text" placeholder="대상 제품/자산 (예: FW-01)" list="productOptions" required aria-label="대상 제품/자산">
        <datalist id="productOptions"></datalist>
        <select id="mAsset" title="등록된 AI 자산과 연결(선택)"><option value="">AI 자산 연결 안 함</option></select>
        <input id="mDate" type="date" required title="점검일" aria-label="점검일">
        <select id="mInterval">
          <option value="">반복 없음</option>
          <option value="30">30일마다</option>
          <option value="90">90일마다</option>
          <option value="365">365일마다</option>
        </select>
        <button type="submit">+ 일정 추가</button>
      </form>

    </div>
  </div>
</div>

<script>
  var 항목 = [];
  var 관리자 = false;
  var 고른상태 = "all";
  var 오늘 = new Date().toISOString().slice(0, 10);

  // 지연 판정은 **한 곳에서만** 한다 — 카드·띠·표가 서로 다르게 세면 담당자가 숫자를 못 믿는다.
  function 지연인가(m) { return m.scheduleDate < 오늘 && m.status !== "approved"; }
  function 지난날수(d) { return Math.max(0, Math.round((new Date(오늘) - new Date(d)) / 86400000)); }
  function 남은날수(d) { return Math.max(0, Math.round((new Date(d) - new Date(오늘)) / 86400000)); }

  var 상태이름 = { scheduled: "예정", reported: "검토 대기", approved: "승인됨", rejected: "반려됨" };
  var 상태색 = { scheduled: "p-sched", reported: "p-rep", approved: "p-app", rejected: "p-rej" };

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  function 집계() {
    var 지연 = 항목.filter(지연인가).length;
    var 검토 = 항목.filter(function (m) { return m.status === "reported"; }).length;
    var 이번달 = 항목.filter(function (m) { return m.scheduleDate.slice(0, 7) === 오늘.slice(0, 7) && !지연인가(m); }).length;
    return { 전체: 항목.length, 지연: 지연, 검토: 검토, 이번달: 이번달 };
  }

  function 카드그리기() {
    var c = 집계();
    var 목 = [
      { key: "all", l: "전체", v: c.전체, s: "등록된 점검", col: "" },
      { key: "late", l: "⚠ 기한 지남", v: c.지연, s: "가장 먼저 볼 것", col: "#f5928a" },
      { key: "reported", l: "보고서 검토 대기", v: c.검토, s: "관리자 승인 필요", col: "var(--amber)" },
      { key: "month", l: "이번 달 예정", v: c.이번달, s: "아직 기한 전", col: "var(--blue-light)" },
    ];
    document.getElementById("sumCards").innerHTML = 목.map(function (t) {
      return '<div class="card' + (고른상태 === t.key ? " on" : "") + '" data-filter="' + t.key + '">' +
        '<div class="l">' + t.l + '</div><div class="v"' + (t.col ? ' style="color:' + t.col + '"' : "") + ">" + t.v + "</div>" +
        '<div class="s">' + t.s + "</div></div>";
    }).join("");
    // 정체성 줄의 ⚠경고는 실제 숫자와 맞춘다 — 화면에 두는 유일한 안내다.
    var id = document.getElementById("ident");
    var 기존 = id.querySelector(".warn");
    if (기존) 기존.remove();
    if (c.지연 > 0) {
      var w = document.createElement("span");
      w.className = "warn";
      w.textContent = " ⚠ 기한 지남 " + c.지연 + "건";
      id.appendChild(w);
    }
  }

  // 🎯 지금 손댈 일 — 0이면 줄을 만들지 않는다(없는 일을 있는 척하면 목록을 안 믿게 된다).
  function 할일그리기() {
    var c = 집계();
    var 늦은것 = 항목.filter(지연인가).sort(function (a, b) { return a.scheduleDate < b.scheduleDate ? -1 : 1; })[0];
    var 줄 = [];
    if (c.지연 > 0) {
      줄.push({
        t: "기한 지난 점검 <b>" + c.지연 + "건</b>",
        sub: "가장 오래된 것은 <b>" + 지난날수(늦은것.scheduleDate) + "일</b> 지났습니다 — " + esc(늦은것.title),
        task: "기한 지난 유지보수 점검 " + c.지연 + "건 수행", p: "P1", filter: "late",
      });
    }
    if (c.검토 > 0) {
      줄.push({
        t: "검토 대기 <b>" + c.검토 + "건</b>",
        sub: "담당자가 점검서를 올렸는데 아직 승인·반려가 안 됐습니다",
        task: "점검 보고서 " + c.검토 + "건 검토", p: "P2", filter: "reported",
      });
    }
    할일그리기.items = 줄;
    var w = document.getElementById("todoWrap");
    if (!줄.length) {

  (function 제품유지보수구역() {

  // 문서 인입은 대시보드 ＋로 통일(2026-07-27). 여기 남는 건 검색과 샘플 문서 추가뿐이다.

  // 실제 수집 경로(ingestMemoryFile)를 그대로 타는 데모 데이터 — 하드코딩된 화면이 아니다.
  const SAMPLE_DOCS = [
    {
      name: "샘플_방화벽_정책_점검_절차.txt",
      text: "방화벽 정책 정기 점검 절차: ① 정책 백업 → ② 90일 이상 무적중 룰 식별 → ③ 최소권한 원칙 위반 룰 표시 → ④ 변경 전 담당자 승인 → ⑤ 적용 후 24시간 트래픽 모니터링. 장애 발생 시 즉시 이전 정책으로 롤백한다.",
    },
    {
      name: "샘플_IPS_오탐_대응_사례.txt",
      text: "IPS 오탐 대응 사례: 증상은 특정 사내 API 호출이 IPS에서 반복 차단됨. 원인은 신규 시그니처가 정상 페이로드 패턴을 오탐 처리한 것. 조치: 해당 시그니처 ID를 예외 처리 등록하고 24시간 모니터링 후 오탐 재발이 없으면 정식 튜닝에 반영한다.",
    },
  ];
  async function addSampleDocs() {
    const statusEl = document.getElementById("kbUploadStatus");
    const btn = document.getElementById("kbSampleBtn");
    btn.disabled = true;
    for (const doc of SAMPLE_DOCS) {
      statusEl.textContent = `샘플 추가 중… ${doc.name}`;
      try {
        await window.gijo.ingestMemoryFile(doc.name, utf8ToBase64(doc.text), "global");
      } catch (err) {
        statusEl.textContent = "✗ 샘플 추가 실패: " + ((err && err.message) || err);
        btn.disabled = false;
        return;
      }
    }
    statusEl.textContent = "✓ 샘플 문서 2건이 지식베이스에 추가되었습니다 — 아래에서 검색해보세요.";
    btn.disabled = false;
  }

  async function kbQuery() {
    const question = document.getElementById("kbQueryInput").value.trim();
    const box = document.getElementById("kbQueryResults");
    if (!question) { box.style.display = "block"; box.innerHTML = '<div style="color:var(--muted);font-size:12px">먼저 찾을 내용을 적어 주세요.</div>'; document.getElementById("kbQueryInput").focus(); return; }
    box.style.display = "block";
    box.innerHTML = '<div style="color:var(--muted);font-size:12px">검색 중...</div>';
    try {
      const results = await window.gijo.queryMemory(question, 5);
      box.innerHTML = results.length
        ? results.map((r) => `<div class="chunk">${esc(r)}</div>`).join("")
        : '<div style="color:var(--muted);font-size:12px">관련 문서가 없습니다 — 위에서 문서를 올리거나 샘플 문서를 추가해보세요.</div>';
    } catch (e) {
      box.innerHTML = '<div style="color:#f87171;font-size:12px">검색 실패: ' + e.message + "</div>";
    }
  }

  // 등록된 AI 자산을 점검 연결 드롭다운에 채운다. 자산이 없으면 기본 옵션만 남는다.
  async function loadAssetOptions() {
    try {
      const assets = await window.gijo.listAssets();
      const sel = document.getElementById("mAsset");
      for (const a of assets) {
        sel.insertAdjacentHTML("beforeend", `<option value="${esc(a.id)}">${esc(a.name)} (${esc(a.assetType)})</option>`);
      }
    } catch (e) {}
  }

  // 보안제품 등록부의 제품명을 자동완성으로 제안한다 — 등록부 이름 그대로 고르면 점검이
  // 그 제품에 자동 연결되어(서버의 이름 매칭) 보안제품 관리 화면에서 점검 현황이 보인다.
  async function loadProductOptions() {
    try {
      const products = await window.gijo.listSecurityProducts();
      document.getElementById("productOptions").innerHTML = products
        .map((p) => `<option value="${esc(p.name)}">`)
        .join("");
    } catch (e) {}
  }

  async function onMaintSubmit(e) {
    e.preventDefault();
    const title = document.getElementById("mTitle").value.trim();
    const productName = document.getElementById("mProduct").value.trim();
    const scheduleDate = document.getElementById("mDate").value;
    const intervalRaw = document.getElementById("mInterval").value;
    const assetId = document.getElementById("mAsset").value || undefined;
    if (!title || !productName || !scheduleDate) return;
    try {
      await window.gijo.createMaintenance({
        title,
        productName,
        scheduleDate,
        intervalDays: intervalRaw ? Number(intervalRaw) : undefined,
        assetId,
      });
      e.target.reset();
      document.getElementById("mDate").value = todayStr();
      // 목록은 위(새 표) 스크립트가 그린다 — IIFE가 갈라져 있어 이벤트로 새로고침을 부탁한다.
      window.dispatchEvent(new CustomEvent("gijo:maint-refresh"));
    } catch (err) {
      gijoTell("등록 실패: " + ((err && err.message) || err));
    }
  }

  // 저장된 수신자를 미리 채우고 현재 지연 건수를 버튼 옆에 안내한다.
  async function loadNotify() {
    try {
      const { recipients, dueCount } = await window.gijo.getMaintenanceNotify();
      document.getElementById("notifyEmails").value = (recipients || []).join(", ");
      document.getElementById("notifyLine").textContent = dueCount ? `현재 지연/마감 ${dueCount}건` : "지연/마감 점검 없음";
    } catch (e) {}
  }

  async function sendNotify() {
    const btn = document.getElementById("notifyBtn");
    const line = document.getElementById("notifyLine");
    const to = document.getElementById("notifyEmails").value.split(/[,\s]+/).map((s) => s.trim()).filter(Boolean);
    if (to.length === 0) { line.textContent = "수신자 이메일을 입력하세요"; return; }
    btn.disabled = true;
    line.textContent = "발송 중...";
    try {
      const r = await window.gijo.sendMaintenanceNotify(to);
      line.textContent = r.sent ? `✓ ${r.count}건 알림 발송됨` : "지연/마감 점검이 없어 발송하지 않았습니다";
    } catch (err) {
      let msg = (err && err.message) || String(err);
      const brace = msg.indexOf("{");
      if (brace >= 0) { try { const j = JSON.parse(msg.slice(brace)); if (j.error) msg = j.error; } catch (_) {} }
      line.textContent = "✗ " + msg;
    }
    btn.disabled = false;
  }

  async function init() {
    document.getElementById("mDate").value = todayStr();
    loadAssetOptions();
    loadProductOptions();
    loadNotify();

    document.querySelectorAll("[data-page]").forEach((el) => {
      el.addEventListener("click", () => (window.gijoOpenScreen ? window.gijoOpenScreen(el.dataset.page) : window.gijo.navigateTo(el.dataset.page)));
    });

    document.getElementById("kbSampleBtn").addEventListener("click", addSampleDocs);
    document.getElementById("kbQueryBtn").addEventListener("click", kbQuery);
    document.getElementById("kbQueryInput").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) kbQuery(); });

    document.getElementById("maintForm").addEventListener("submit", onMaintSubmit);
    document.getElementById("notifyBtn").addEventListener("click", sendNotify);
  }

  if (!window.gijo.isAuthenticated()) {
    window.gijo.navigateTo("login.html");
  } else {
    init();
  }

  })();
</script>
