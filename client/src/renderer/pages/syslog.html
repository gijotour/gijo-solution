<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIJO AS — 시스템 로그</title>
<style>
:root{
  --bg:#262624;--panel:#30302e;--panel-2:#1f1e1d;--border:rgba(255,255,255,0.08);
  --border-strong:rgba(255,255,255,0.16);--blue:#3b82f6;--blue-light:#5fa1ff;--white:#ffffff;
  --text:#e9e7e2;--muted:#b3ada4;--muted-2:#a49d95;--red:#e2483d;--amber:#f0a020;--teal:#1eb980;--purple:#8b7cf0;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Pretendard","Malgun Gothic","Segoe UI",sans-serif;background:var(--bg);color:var(--text);}
.app{display:grid;grid-template-columns:220px 1fr;}
.sidebar{padding:22px 14px;border-right:1px solid var(--border);min-height:900px;}
.nav-section{font-size:12px;font-weight:700;color:var(--muted-2);letter-spacing:1.2px;margin:18px 10px 8px;}
.nav-section:first-child{margin-top:0;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;margin-bottom:2px;}
.nav-item .ic{width:18px;text-align:center;font-size:14px;}
.nav-item.active{background:rgba(59,130,246,0.12);color:var(--white);box-shadow:inset 3px 0 0 var(--blue);cursor:default;}
.nav-item:hover:not(.active){background:rgba(255,255,255,0.04);color:var(--white);}
.main{padding:28px 32px 48px;}
.topbar-row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;}
.page-title{font-size:21px;font-weight:800;color:var(--text-strong, #fff);}
.page-sub{font-size:12.5px;color:var(--muted);margin-top:4px;max-width:900px;}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--panel-2);}
.header-left{display:flex;align-items:center;gap:12px;}
.header-left img{height:22px;}
.app-title{font-size:15px;font-weight:800;color:var(--text-strong, #fff);}
.clock{font-size:12px;color:var(--blue-light);font-weight:600;}
.header-right{display:flex;align-items:center;gap:10px;}
.status-pill{display:flex;align-items:center;gap:6px;background:rgba(30,185,128,0.15);border:1px solid rgba(30,185,128,0.4);color:var(--teal);padding:6px 14px;border-radius:20px;font-size:12px;font-weight:800;}
.status-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);}
.beta-tag{background:var(--teal);color:var(--fill-contrast,#06281c);font-size:11.25px;font-weight:800;padding:1px 6px;border-radius:4px;margin-left:2px;}
.avatar-btn{width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;}
.icon-btn{width:32px;height:32px;border-radius:8px;background:var(--panel);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted);cursor:pointer;}

.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.filters{display:flex;gap:8px;flex-wrap:wrap;}
.filter-chip{background:var(--panel-2);border:1px solid var(--border-strong);color:var(--muted);padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;}
.filter-chip.active{background:rgba(59,130,246,0.15);border-color:var(--blue);color:var(--blue-light);}
.search{margin-left:auto;background:var(--panel-2);border:1px solid var(--border-strong);border-radius:8px;padding:7px 12px;font-size:12px;color:var(--text);outline:none;width:240px;}
.dl{background:transparent;border:1px solid var(--border-strong);color:var(--text);border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;cursor:pointer;}
.dl:hover{border-color:var(--teal);color:var(--teal);}

.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:6px 0;}
.aud{display:flex;gap:12px;align-items:flex-start;padding:11px 18px;border-bottom:1px solid var(--border);font-size:12.5px;}
.aud:last-child{border-bottom:none;}
.aud .tm{color:var(--muted-2);font-size:12.25px;white-space:nowrap;width:118px;flex:0 0 auto;}
.aud .kind{font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:5px;white-space:nowrap;flex:0 0 auto;}
.k-cli{background:rgba(30,185,128,.16);color:var(--teal);}
.k-approval{background:rgba(240,160,32,.16);color:var(--amber);}
.k-write{background:rgba(139,124,240,.16);color:var(--purple);}
.k-block{background:rgba(226,72,61,.16);color:#f5928a;}
.k-auth{background:rgba(59,130,246,.16);color:var(--blue-light);}
.k-config{background:rgba(255,255,255,.08);color:var(--muted);}
.aud .body{flex:1;min-width:0;}
.aud .act{color:var(--text);font-weight:600;}
.aud .tgt{color:var(--blue-light);font-size:12.25px;margin-left:6px;}
.aud .det{color:var(--muted-2);font-size:12.25px;margin-top:2px;white-space:pre-wrap;word-break:break-word;}
.aud .who{color:var(--muted-2);font-size:12.25px;white-space:nowrap;flex:0 0 auto;}
.aud .rz{font-size:11.5px;font-weight:800;padding:1px 6px;border-radius:4px;flex:0 0 auto;}
.rz-ok{color:var(--teal);}
.rz-blocked{background:rgba(226,72,61,.16);color:#f5928a;}
.rz-error{background:rgba(226,72,61,.16);color:#f5928a;}
.rz-pending{color:var(--amber);}
.empty{padding:30px;text-align:center;color:var(--muted-2);font-size:13px;}
.kpi{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.kpi-mini{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 16px;}
.kpi-mini .l{font-size:12px;color:var(--muted);}
.kpi-mini .v{font-size:18px;font-weight:800;color:var(--text-strong, #fff);}
.footer{margin-top:14px;padding:18px 0 0;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted-2);}
.footer img{height:16px;opacity:0.6;}
/* 「더 보기」 — 목록을 줄여 보여주되 있는 것을 숨기지 않는다는 표시(2026-08-01). */
  .more{display:block;width:100%;margin-top:10px;padding:10px;background:var(--panel-2);
    border:1px dashed var(--border-strong);border-radius:9px;color:var(--blue-light);
    font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;}
  .more:hover{border-style:solid;border-color:var(--blue-light);}
  .more .cnt{color:var(--muted-2);font-weight:600;margin-left:6px;}
  .more-end{margin-top:10px;padding:8px;text-align:center;font-size:12.5px;color:var(--muted-2);}
/* 시스템 로그 — logs.html에서 이관(2026-07-28) */
.topbar-row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.filter-chip{background:var(--panel-2);border:1px solid var(--border-strong);color:var(--muted);padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;}
.filter-chip.active{background:rgba(59,130,246,0.15);border-color:var(--blue);color:var(--blue-light);}
.log-console{background:#1a1a19;border:1px solid var(--border-strong);border-radius:8px;padding:10px 12px;height:calc(100vh - 320px);min-height:360px;overflow-y:auto;font-family:"Consolas","Cascadia Mono",monospace;font-size:12.5px;line-height:1.65;}
.log-line{white-space:pre-wrap;word-break:break-all;}
.log-line.log-warn{color:var(--amber);}
.log-line.log-error{color:#f5928a;}
.log-ts{color:var(--muted-2);margin-right:6px;}
.log-src{display:inline-block;min-width:88px;margin-right:8px;padding:0 6px;border-radius:4px;font-size:11.75px;font-weight:800;text-align:center;background:rgba(255,255,255,0.06);color:var(--muted);}
.log-src.s-console{color:var(--muted-2);}
.log-src.s-modelscan{background:rgba(139,124,240,0.15);color:var(--purple);}
.log-src.s-reposcan{background:rgba(59,130,246,0.15);color:var(--blue-light);}
.log-src.s-extract-doc{background:rgba(30,185,128,0.13);color:var(--teal);}
.log-src.s-finetune{background:rgba(240,160,32,0.15);color:var(--amber);}
.log-src.s-hf-download{background:rgba(30,185,128,0.15);color:var(--teal);}
    .kpi{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .kpi-mini{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 16px;}
  .kpi-mini .l{font-size:12px;color:var(--muted);}
  .kpi-mini .v{font-size:18px;font-weight:800;color:var(--text-strong, #fff);}
</style>
<script src="viz.js"></script>
</head>
<body>

<!-- 상단 바는 공용이다 — titlebar.js가 그린다(분리창=공용 헤더, 탭 안=셸 탭줄). 화면마다 두던 사본 23개를 지웠다(2026-08-07). -->

<div class="app">
  <div class="sidebar" id="gijoNav"></div>

  <div class="main">
    <div class="topbar-row">
      <div><div class="page-title">🖥 시스템 로그</div></div>
    </div>

    <!-- 요약 한 줄 — 표식만 달면 공용 변환기(nav.js)가 막대로 바꾼다. 화면마다 새로 짜지 않는다. -->
    <div class="kpi" id="logKpi" data-gijo-summary></div>

    <!-- 그림 먼저(전-7 ①, 2026-08-05). 위 한 줄은 「얼마나 쌓였나」고, 이 띠는 **어디서 나왔나**다.
         막대를 누르면 아래 로그가 그 갈래만 남는다 — 기존 갈래 칩과 같은 필터를 쓴다. -->
    <div id="vizStrip"></div>
    <div id="vizFilter" style="display:none"></div>

    <!-- 화면엔 정체성 한 줄만 — 사용법·주의사항은 챗봇(screenguide)에 있다(우리 규약). -->
    <!-- 시스템 로그 — logs.html 화면에서 이관(2026-07-28). 작업 기록이 '누가 무엇을 했나'라면
         이쪽은 '서버가 무엇을 했나'다. 같은 탭에서 위아래로 대조할 수 있어야 한다. -->
    <!-- ⚠ 접힌 구역에는 **배지가 필수**다. 오류가 있는데 숫자 없이 접혀 있으면 그냥 지나친다
         (2026-08-01: 배지가 참조하는 요소를 안 만들어 두어 아예 안 뜬 사고를 겪었다 —
         그래서 이번엔 요소를 함께 만든다). hot이면 저장값과 무관하게 펼쳐진다. -->
    <div class="panel" data-gijo-fold="시스템 로그" data-gijo-fold-badges="logErrCount:오류:hot" data-gijo-fold-open>
      <div class="panel-title">시스템 로그<span id="logErrCount" style="display:none">0</span></div>
      <div class="panel-sub">서버와 도구가 실제로 무엇을 했는지 흐르는 그대로 보여줍니다.</div>
      <div class="filters" id="sourceFilters">
        <div class="filter-chip active" data-src="all">전체</div>
        <div class="filter-chip" data-src="console">서버 콘솔</div>
        <div class="filter-chip" data-src="modelscan">모델 스캔</div>
        <div class="filter-chip" data-src="reposcan">저장소 스캔</div>
        <div class="filter-chip" data-src="extract-doc">문서 추출</div>
        <div class="filter-chip" data-src="finetune">파인튜닝</div>
        <div class="filter-chip" data-src="hf-download">모델 다운로드</div>
      </div>
      <div class="log-console" id="logConsole" data-gijo-fit></div>
    </div>

    <div class="footer">
      <img src="gijo-symbol.svg" alt="GIJO">
      <span>GIJO Technology</span>
    </div>
  </div>
</div>

<script>
  // ── 시스템 로그 (2026-07-28 logs.html에서 이관) ──────────────────────
  // 시계·헤더·사용자 표시는 이 화면(작업 기록)에 이미 있다 — 가져오지 않는다.
  const logConsole = document.getElementById("logConsole");
  let activeFilter = "all";
  let logEntries = [];

  function lineHtml(entry) {
    const src = entry.source || "console";
    const cls = "log-line" + (entry.level === "warn" ? " log-warn" : entry.level === "error" ? " log-error" : "");
    const time = new Date(entry.timestamp).toLocaleTimeString("ko-KR", { hour12: false });
    const srcClass = "log-src s-" + src.replace(/[^a-z0-9-]/gi, "");
    return `<div class="${cls}"><span class="log-ts">${time}</span><span class="${srcClass}">${src}</span>${String(entry.message).replace(/</g, "&lt;")}</div>`;
  }

  // ── 그림 먼저(전-7 ①, 2026-08-05) ──────────────────────────────────────
  // 이 화면엔 이미 갈래 칩이 있다 — 새 필터를 만들지 않고 **그 칩을 그림으로 바꿔** 세운다.
  // 그래야 칩과 막대가 서로 다른 상태를 가리키는 일이 생기지 않는다.
  // ⚠ 이름표를 **칩에서 읽는다** — 표를 따로 적었더니 칩에는 「파인튜닝」인데 막대는 finetune으로
  //   나오고, 표에만 있던 train·merge는 어디에도 없는 키였다(2026-08-05 검토 지적).
  //   같은 뜻의 이름은 한 곳에서만 정한다.
  function 갈래이름(src) {
    const chip = document.querySelector('#sourceFilters .filter-chip[data-src="' + src + '"]');
    return chip ? chip.textContent.trim() : src;
  }

  function 갈래고르기(src) {
    activeFilter = src || "all";
    document.querySelectorAll("#sourceFilters .filter-chip").forEach((c) => {
      c.classList.toggle("active", (c.dataset.src || "all") === activeFilter);
    });
    renderLogs();
  }

  function 그림띠() {
    const 자리 = document.getElementById("vizStrip");
    if (!자리 || !window.gijoViz) return;
    const 갈래별 = {};
    logEntries.forEach((e) => { const k = e.source || "console"; 갈래별[k] = (갈래별[k] || 0) + 1; });
    const 키들 = Object.keys(갈래별).sort((a, b) => 갈래별[b] - 갈래별[a]).slice(0, 6);
    const 오류 = logEntries.filter((e) => /error|err|fail|실패|오류/i.test(String(e.level || "") + " " + String(e.message || ""))).length;

    window.gijoViz.mount(자리, {
      title: "한눈에",
      hint: 키들.length ? "누르면 목록이 좁혀집니다" : "",
      parts: [
        {
          kind: "bars",
          segments: 키들.map((k) => ({
            key: k, label: 갈래이름(k), value: 갈래별[k],
            // 오류가 섞인 갈래는 붉게 — 어디서 터졌는지가 이 화면의 첫 물음이다.
            color: logEntries.some((e) => (e.source || "console") === k && /error|err|fail|실패|오류/i.test(String(e.level || "") + " " + String(e.message || ""))) ? "bad" : "blue",
          })),
          onPick: (key) => { 갈래고르기(key); 필터띠(); },
        },
        { kind: "donut", value: 오류, total: logEntries.length, label: "오류", showRatio: true, color: 오류 ? "bad" : "ok" },
      ],
    });
    if (activeFilter !== "all") {
      const b = 자리.querySelector('.gviz-bar[data-key="' + activeFilter + '"]');
      if (b) b.classList.add("on");
    }
    필터띠();
  }

  function 필터띠() {
    if (!window.gijoViz) return;
    const el = document.getElementById("vizFilter");
    if (activeFilter === "all") { window.gijoViz.filterBar(el, null, null); return; }
    const 보임 = logEntries.filter((e) => (e.source || "console") === activeFilter).length;
    window.gijoViz.filterBar(el,
      { label: 갈래이름(activeFilter), 보임, 전체: logEntries.length, 단위: "줄" },
      () => {
        갈래고르기(null);
        document.querySelectorAll("#vizStrip .gviz-bar").forEach((b) => b.classList.remove("on"));
        필터띠();
      });
  }
  // ───────────────────────────────────────────────────────────────────────

  function renderLogs() {
    그림띠();
    const shown = activeFilter === "all" ? logEntries : logEntries.filter((e) => (e.source || "console") === activeFilter);
    logConsole.innerHTML = shown.map(lineHtml).join("") || '<div style="color:var(--muted)">표시할 로그가 없습니다.</div>';
    logConsole.scrollTop = logConsole.scrollHeight;
    // 접힌 채로도 "지금 열어야 하나"를 알 수 있게 오류 수를 배지에 적는다.
    const 오류 = logEntries.filter((e) => /error|err|fail|실패|오류/i.test(String(e.level || "") + " " + String(e.message || ""))).length;
    const 셈 = document.getElementById("logErrCount");
    if (셈) 셈.textContent = String(오류);
    if (window.gijoFold) window.gijoFold.refresh();
    // ★ 2026-08-05: 요약채우기가 **어디에서도 안 불리고 있었다** — 위 한 줄(#logKpi)이 늘 빈
    //   채였는데, 이번에 붙인 화면 안내는 그 자리를 설명하고 있었다(없는 것을 설명함).
    //   함수만 만들어 두고 부르지 않은 자리는 시험도 스윕도 못 잡는다 — 여기서 부른다.
    요약채우기(오류);
  }

  /**
   * 요약 한 줄 — 「지금 로그가 어떤 상태인가」를 숫자로.
   * ⚠ 카드를 **매번 새로 만들지 않는다**(첫 번만 만든다). 공용 변환기가 이미 막대로 바꿔 놨는데
   *   다시 그리면 그 막대를 부수고, 변환기가 또 바꾸는 일이 무한히 반복된다.
   */
  function 요약채우기(오류) {
    const box = document.getElementById("logKpi");
    if (!box) return;
    const 갈래 = new Set(logEntries.map((e) => e.source || "console")).size;
    const 마지막 = logEntries.length ? logEntries[logEntries.length - 1] : null;
    // ⚠ 자료의 시각 칸은 `timestamp`다(apiClient LogEntry) — `at`은 없는 칸이라 늘 "-"였다.
    //   함수가 안 불리던 동안 아무도 몰랐고, 2026-08-05에 부르기 시작하자 화면에 드러났다.
    //   같은 파일 lineHtml은 처음부터 timestamp를 옳게 쓰고 있었다(한 파일 안에서 갈렸다).
    const 시각 = 마지막 && 마지막.timestamp
      ? new Date(마지막.timestamp).toLocaleTimeString("ko-KR", { hour12: false }) : "-";
    const 값 = [
      ["로그 줄", String(logEntries.length), ""],
      ["오류", String(오류), 오류 ? "#f5928a" : ""],
      ["갈래", String(갈래), ""],
      ["마지막", 시각, ""],
      ["보관", "최근 500줄", ""],
    ];
    if (!box.querySelector(".kpi-mini") && box.dataset.gijoSum !== "1") {
      box.innerHTML = 값.map(([l, v, c]) =>
        '<div class="kpi-mini"><div class="l">' + l + '</div><div class="v"' +
        (c ? ' style="color:' + c + '"' : "") + ' data-k="' + l + '">' + v + "</div></div>").join("");
      return;   // 처음 그렸다 — 변환기가 곧 막대로 바꾼다
    }
    // 이미 있으면 **값만** 갈아 끼운다(막대가 되어 있어도 같은 요소를 그대로 쓴다).
    값.forEach(([l, v, c]) => {
      const el = box.querySelector('[data-k="' + l + '"]');
      if (el) { el.textContent = v; if (c) el.style.color = c; }
    });
  }

  function appendLogEntry(entry) {
    logEntries.push(entry);
    if (logEntries.length > 500) logEntries.shift();
    // 현재 필터에 맞으면 append + 스크롤 (전체 재렌더 비용 절감)
    if (activeFilter === "all" || (entry.source || "console") === activeFilter) {
      logConsole.insertAdjacentHTML("beforeend", lineHtml(entry));
      while (logConsole.childElementCount > 500) logConsole.removeChild(logConsole.firstChild);
      logConsole.scrollTop = logConsole.scrollHeight;
    }
    // 로그는 흘러들어오는데 그림이 그대로면 **띠가 낡은 숫자를 말한다**. 다만 줄마다 다시 그리면
    // 로그가 쏟아질 때 화면이 버벅인다 — 2초에 한 번만 새로 낸다.
    if (!appendLogEntry.타이머) {
      appendLogEntry.타이머 = setTimeout(function () { appendLogEntry.타이머 = null; 그림띠(); }, 2000);
    }
  }

  async function loadLogs() {
    try {
      logEntries = await window.gijo.listLogs();
      renderLogs();
    } catch (e) {
      logConsole.textContent = "로그를 불러오지 못했습니다: " + e.message;
    }
  }



  async function init() {
    document.getElementById("sourceFilters").addEventListener("click", (e) => {
      const chip = e.target.closest(".filter-chip");
      if (!chip) return;
      document.querySelectorAll("#sourceFilters .filter-chip").forEach((c) => c.classList.remove("active"));
      chip.classList.add("active");
      activeFilter = chip.dataset.src;
      renderLogs();
    });
    window.gijo.onLogEvent(appendLogEntry);
    loadLogs().catch(() => {});
  }

  if (!window.gijo.isAuthenticated()) window.gijo.navigateTo("login.html");
  else init();
</script>
