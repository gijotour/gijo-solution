<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIJO AS — 공급망 점검</title>
<link rel="stylesheet" href="gijo-ui.css">
<!--
  supplychain.html — 「공급망 점검」(타사 SBOM 라이선스 검수).

  ■ 왜 (2026-08-22 사장님 지시 · 계획서 중-7 확장)
    우리가 PyMuPDF(AGPL)를 설치본에 동봉했다가 게시 직전에 걸렸다.
    「우리가 겪은 이 문제를 고객사도 겪는다 → 타사 제품 SBOM을 우리가 직접 점검하게 하고
    메인 메뉴로 빼자」 — 결과에 **실제로 받게 되는 요구**(소스 공개·상용 구매)가 나와야 한다.

  ■ 제품 원칙 지킴
    · **입력칸 없음** — 파일은 대화창 ＋의 「📦 타사 SBOM」 유형으로 넣는다(인입 창구는 한 곳).
    · 화면엔 **정체성 한 줄과 ⚠경고만** — 사용법·용어 풀이는 screenguide(ⓘ)가 진다.
    · 행 목록은 공용 부품 .g-rows(엑셀형, 행 30px) — 부품이 수백~수천이라 카드형은 안 맞는다.
    · 선택 → 대화창은 공용 부품 selectnotify.js가 진다(배선 계약).

  ■ 다리: /api/sbom-review/list · /:id · /:id/delete
-->
<style>
:root{
  --bg:#262624;--panel:#30302e;--panel-2:#1f1e1d;--border:rgba(255,255,255,0.08);
  --border-strong:rgba(255,255,255,0.16);--blue:#3b82f6;--blue-light:#5fa1ff;--white:#ffffff;
  --text:#e9e7e2;--muted:#b3ada4;--muted-2:#a49d95;--red:#e2483d;--amber:#f0a020;--teal:#1eb980;--purple:#8b7cf0;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Pretendard","Malgun Gothic","Segoe UI",sans-serif;background:var(--bg);color:var(--text);}
.app{display:grid;grid-template-columns:220px 1fr;}
.sidebar{padding:22px 14px;border-right:1px solid var(--border);min-height:900px;}
.main{padding:28px 32px 48px;}
.topbar-row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;}
.page-title{font-size:21px;font-weight:800;color:var(--text-strong, #fff);}
.scr-id{font-size:12.5px;color:var(--muted);margin-top:4px;max-width:900px;line-height:1.6;}
.notice{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:12px 16px;
  font-size:12px;color:var(--muted);line-height:1.7;max-width:1180px;margin-bottom:16px;}
.notice b{color:var(--amber);}

/* 등급 요약 — 「무엇을 요구받나」를 크게. 누르면 그 등급만 남는다. */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;max-width:1180px;margin-bottom:16px;}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:11px 13px;cursor:pointer;}
.kpi:hover{border-color:var(--border-strong);}
.kpi.on{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue);}
.kpi .n{font-size:20px;font-weight:800;line-height:1.2;}
.kpi .l{font-size:11.5px;color:var(--muted-2);margin-top:3px;line-height:1.4;}
.kpi.t4 .n{color:var(--red);} .kpi.t3 .n{color:var(--amber);} .kpi.t2 .n{color:var(--purple);}
.kpi.t1 .n{color:var(--teal);} .kpi.t0 .n{color:var(--muted);}

/* 엑셀형 열 폭 — 한 곳 선언(.g-rows--이름 관례, gijo-ui.css). 머리·행이 같이 따른다. */
.g-rows--sbomrev{max-width:1180px;}
.g-rows--sbomrev .g-rows-head,.g-rows--sbomrev .g-rows-r{grid-template-columns:1fr 96px 108px 300px 22px;gap:8px;}
.g-rows--sbomlist{max-width:1180px;}
.g-rows--sbomlist .g-rows-head,.g-rows--sbomlist .g-rows-r{grid-template-columns:1fr 120px 84px 96px 84px;gap:8px;}

.tier{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;white-space:nowrap;}
.tier.t4{background:rgba(226,72,61,.18);color:var(--red-ink, #ff8a80);}
.tier.t3{background:rgba(240,160,32,.16);color:var(--amber-ink, #f4b350);}
.tier.t2{background:rgba(139,124,240,.16);color:var(--purple-ink, #b0a4ff);}
.tier.t1{background:rgba(30,185,128,.14);color:var(--teal-ink, #5fd4a6);}
.tier.t0{background:rgba(255,255,255,.06);color:var(--muted-2);}
.tier.tq{background:rgba(255,255,255,.06);color:var(--amber);}
.need{color:var(--amber);font-size:11px;margin-left:5px;}
.req{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row-chev{justify-self:end;width:22px;height:22px;display:flex;align-items:center;justify-content:center;
  border:1px solid transparent;border-radius:6px;color:var(--muted-2);cursor:pointer;font-size:11px;}
.row-chev:hover{border-color:var(--border-strong);color:var(--text);}
.g-rows-r.on .row-chev{color:var(--blue-light);}
.det{grid-column:1/-1;background:var(--panel-2);border-radius:8px;padding:10px 12px;margin:2px 0 6px;
  font-size:11.5px;color:var(--muted);line-height:1.7;}
.det b{color:var(--text);}
.det .raw{color:var(--text);word-break:break-all;}
.empty{font-size:12.5px;color:var(--muted);line-height:1.8;padding:16px 2px;max-width:900px;}
.empty b{color:var(--text);}
.sec{font-size:13px;font-weight:800;margin:20px 0 8px;color:var(--text-strong, #fff);}
.sec .sub{font-size:11.5px;font-weight:600;color:var(--muted-2);margin-left:8px;}
.disc{font-size:11.5px;color:var(--muted-2);line-height:1.7;max-width:1180px;margin-top:14px;
  border-top:1px solid var(--border);padding-top:10px;}
.back{font-size:12px;color:var(--blue-light);cursor:pointer;margin-bottom:10px;display:inline-block;}
.back:hover{text-decoration:underline;}
</style>
</head>
<body>

<div class="app">
  <div class="sidebar" id="gijoNav"></div>

  <div class="main">
    <div class="topbar-row">
      <div>
        <div class="page-title">📦 공급망 점검</div>
        <!-- 정체성 한 줄 — 사용법은 ⓘ(screenguide)가 진다. -->
        <div class="scr-id">납품받을 제품의 <b>부품표(SBOM)</b>를 읽어 <b>어떤 라이선스 의무를 지게 되는지</b> 봅니다.</div>
      </div>
    </div>

    <div class="notice">
      ⚠ <b>이 판정은 법률 자문이 아닙니다</b> — 법무 검토의 출발점입니다.
      같은 라이선스라도 어떻게 쓰느냐(고쳤나·링크만 했나·배포하나·서비스만 하나)에 따라 결론이 달라집니다.
    </div>

    <div id="body">불러오는 중…</div>

    <div class="disc" id="disc"></div>
  </div>
</div>

<script src="nav.js"></script>
<script src="selectnotify.js"></script>
<script src="progresscard.js"></script>
<script src="gijomd.js"></script>
<script src="chatparts.js"></script>
<script src="chatwidget.js"></script>
<script>
(function () {
  var g = window.gijo || {};
  var 몸 = document.getElementById("body");
  var 면책자리 = document.getElementById("disc");
  // ⚠ **여섯 칸이다** — 안내(screenguide)가 말하는 5등급 + 판정불가.
  //   처음엔 「의무없음」을 빼고 5칸으로 뒀는데, 그러면 ① 안내와 화면이 다른 집합을 말하고
  //   ② KPI 합이 「부품 N개」와 안 맞으며 ③ 그 등급만 골라 보기가 원리상 불가능했다(검토관 [높음]).
  var 등급순 = ["서비스도공개", "전체소스공개", "고친파일공개", "고지만", "의무없음", "판정불가"];
  var 등급칸 = { 서비스도공개: "t4", 전체소스공개: "t3", 고친파일공개: "t2", 고지만: "t1", 의무없음: "t0", 판정불가: "tq" };
  var 등급말 = {
    서비스도공개: "서비스만 해도 공개",
    전체소스공개: "제품 전체 공개",
    고친파일공개: "고친 파일만",
    고지만: "고지만",
    의무없음: "의무 없음",
    판정불가: "판정 불가",
  };
  var 고른등급 = null;

  function 안전(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // ── 목록 ────────────────────────────────────────────────────────────────
  function 목록그리기() {
    고른등급 = null;
    g.listSbomReviews().then(function (j) {
      var 것들 = (j && j.items) || [];
      면책자리.textContent = (j && j.면책) || "";
      if (!것들.length) {
        몸.innerHTML =
          '<div class="empty">아직 검수한 부품표가 없습니다.<br><br>' +
          '넣는 법: <b>대화창의 ＋</b>로 SBOM 파일을 올리고 유형에서 <b>📦 타사 SBOM(부품표)</b>을 고르세요.<br>' +
          'SPDX(<code>.spdx.json</code>)와 CycloneDX(<code>.json</code>) 두 형식의 <b>JSON</b>을 읽습니다.<br><br>' +
          '<span style="color:var(--muted-2)">SBOM이 뭔지, 무엇을 요구받는지는 대화창에 물어보세요 — ' +
          '예: “AGPL 부품을 넣으면 무슨 의무가 생겨?”</span></div>';
        return;
      }
      var h = '<div class="sec">검수한 부품표 <span class="sub">' + 것들.length + "건</span></div>";
      h += '<div class="g-rows g-rows--sbomlist"><div class="g-rows-head">' +
        "<div>무엇을 검수했나</div><div>공급사</div><div>형식</div><div>부품</div><div>검수일</div></div>";
      것들.forEach(function (it) {
        var s = it.summary || {};
        var 무거움 = (s.서비스도공개 || 0) + (s.전체소스공개 || 0);
        h += '<div class="g-rows-r" data-id="' + 안전(it.id) + '" tabindex="0">' +
          "<div>" + 안전(it.name) +
            (무거움 ? ' <span class="tier t4">소스 공개 요구 ' + 무거움 + "</span>" : "") +
            (s.판정불가 ? ' <span class="tier tq">모름 ' + s.판정불가 + "</span>" : "") +
          "</div>" +
          "<div>" + 안전(it.vendor || "-") + "</div>" +
          "<div>" + 안전(it.format) + "</div>" +
          "<div>" + it.componentCount + "</div>" +
          "<div>" + 안전(String(it.reviewedAt).slice(0, 10)) + "</div>" +
          "</div>";
      });
      h += "</div>";
      몸.innerHTML = h;
      몸.querySelectorAll(".g-rows-r").forEach(function (r) {
        r.addEventListener("click", function () { 상세그리기(r.getAttribute("data-id")); });
        r.addEventListener("keydown", function (e) { if (e.key === "Enter") 상세그리기(r.getAttribute("data-id")); }); // 조합무관: 표 행 열기(키보드 접근성) — 글자를 받는 칸이 아니라 조합이 일어나지 않는다
      });
    }).catch(function (e) {
      몸.innerHTML = '<div class="empty">목록을 불러오지 못했습니다 — ' + 안전(String(e)) + "</div>";
    });
  }

  // ── 상세 ────────────────────────────────────────────────────────────────
  function 상세그리기(id) {
    g.getSbomReview(id).then(function (j) {
      if (!j || !j.요약) { 몸.innerHTML = '<div class="empty">그 검수 기록이 없습니다.</div>'; return; }
      면책자리.textContent = j.면책 || "";
      var 요 = j.요약, s = 요.summary || {}, 부품 = j.부품 || [];
      var h = '<span class="back" id="back">← 검수 목록</span>';
      h += '<div class="sec">' + 안전(요.name) +
        ' <span class="sub">' + 안전(요.format) + (요.formatVersion ? " " + 안전(요.formatVersion) : "") +
        " · 부품 " + 요.componentCount + "개 · 검수 " + 안전(String(요.reviewedAt).slice(0, 10)) + "</span></div>";

      // 등급 요약 — 누르면 그 등급만 남는다.
      h += '<div class="kpis">';
      등급순.forEach(function (t) {
        h += '<div class="kpi ' + 등급칸[t] + (고른등급 === t ? " on" : "") + '" data-t="' + t + '">' +
          '<div class="n">' + (s[t] || 0) + "</div>" +
          '<div class="l">' + 등급말[t] + "</div></div>";
      });
      h += "</div>";

      if (요.notes && 요.notes.length) {
        h += '<div class="notice">⚠ <b>못 읽은 것</b><br>' +
          요.notes.map(function (n) { return "· " + 안전(n); }).join("<br>") + "</div>";
      }

      var 보일것 = 고른등급 ? 부품.filter(function (c) { return c.tier === 고른등급; }) : 부품;
      h += '<div class="g-rows g-rows--sbomrev"><div class="g-rows-head">' +
        "<div>부품</div><div>판</div><div>등급</div><div>실제로 받게 되는 요구</div><div></div></div>";
      보일것.forEach(function (c, i) {
        h += '<div class="g-rows-r" data-i="' + i + '" tabindex="0">' +
          "<div>" + 안전(c.name) + "</div>" +
          "<div>" + 안전(c.version || "-") + "</div>" +
          '<div><span class="tier ' + (등급칸[c.tier] || "t0") + '">' + 안전(등급말[c.tier] || c.tier) + "</span>" +
            (c.needsCheck ? '<span class="need" title="사람이 확인해야 합니다">확인</span>' : "") + "</div>" +
          '<div class="req" title="' + 안전(c.받게되는요구) + '">' + 안전(c.받게되는요구.replace(/\*\*/g, "")) + "</div>" +
          '<div class="row-chev">▸</div>' +
          "</div>";
      });
      h += "</div>";
      몸.innerHTML = h;
      면책자리.textContent = j.면책 || "";

      document.getElementById("back").addEventListener("click", 목록그리기);
      몸.querySelectorAll(".kpi").forEach(function (k) {
        k.addEventListener("click", function () {
          var t = k.getAttribute("data-t");
          고른등급 = (고른등급 === t) ? null : t;
          상세그리기(id);
        });
      });
      몸.querySelectorAll(".g-rows-r").forEach(function (r) {
        r.addEventListener("click", function () { 펼치기(r, 보일것[Number(r.getAttribute("data-i"))]); });
        r.addEventListener("keydown", function (e) { if (e.key === "Enter") 펼치기(r, 보일것[Number(r.getAttribute("data-i"))]); }); // 조합무관: 표 행 펼치기 — 글자를 받는 칸이 아니다
      });
    }).catch(function (e) {
      몸.innerHTML = '<div class="empty">불러오지 못했습니다 — ' + 안전(String(e)) + "</div>";
    });
  }

  function 펼치기(행, c) {
    if (!c) return;
    var 다음 = 행.nextElementSibling;
    if (다음 && 다음.classList.contains("det")) { 다음.remove(); 행.classList.remove("on"); return; }
    var d = document.createElement("div");
    d.className = "det";
    d.innerHTML =
      "<b>라이선스 원문</b><br><span class=\"raw\">" + 안전(c.license || "(적혀 있지 않음)") + "</span><br><br>" +
      "<b>어디서 읽었나</b> " + 안전((c.licenseFrom || []).join(" · ") || "(못 읽음)") + "<br>" +
      "<b>왜 이 등급인가</b> " + 안전(c.근거.replace(/\*\*/g, "")) +
      (c.purl ? "<br><b>부품 주소</b> " + 안전(c.purl) : "") +
      (c.supplier ? "<br><b>공급사</b> " + 안전(c.supplier) : "");
    행.classList.add("on");
    행.parentNode.insertBefore(d, 행.nextSibling);
    // 선택 → 대화창 (공용 부품이 전송 규격을 진다)
    // ⚠ 규격은 **{label, text, fields}**다 — `text`가 없으면 공용 부품이 이것을 **해제**로 보내
    //   조금 전 다른 화면에서 골라 둔 📌 선택까지 지운다(2026-08-22 검토관 [높음]).
    //   처음에 {screen, kind, detail}로 보냈는데 그 키들은 허용 목록에 없어 통째로 버려졌고,
    //   시험(wiringcontract)은 `gijoSelectNotify(` **문자열 존재만** 보므로 초록이었다 —
    //   「부품 로드 누락 5화면 = 거짓 초록」의 다음 판이다.
    // ⚠ fields는 허용키만 쓴다(asset·title·severity·status·owner·due·plain·kev·assetId·findingKey).
    if (window.gijoSelectNotify) {
      var 이름판 = c.name + (c.version ? "@" + c.version : "");
      window.gijoSelectNotify({
        label: 이름판,
        text: "부품 " + 이름판 + " (" + (등급말[c.tier] || c.tier) + ")",
        fields: {
          title: 이름판 + " · " + (등급말[c.tier] || c.tier),
          status: c.받게되는요구.replace(/\*\*/g, ""),
          plain: "라이선스 " + (c.license || "표기 없음") + (c.needsCheck ? " · 사람 확인 필요" : ""),
        },
      });
    }
  }

  목록그리기();
})();
</script>
</body>
</html>
