<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIJO AS — 보안 KPI 대시보드</title>
<style>
:root{
  --bg:#262624;--panel:#30302e;--panel-2:#1f1e1d;--border:rgba(255,255,255,0.08);
  --border-strong:rgba(255,255,255,0.16);--blue:#3b82f6;--blue-light:#5fa1ff;--white:#ffffff;
  --text:#e9e7e2;--muted:#b3ada4;--muted-2:#a49d95;--red:#e2483d;--amber:#f0a020;--teal:#1eb980;--purple:#8b7cf0;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Pretendard","Malgun Gothic","Segoe UI",sans-serif;background:var(--bg);color:var(--text);}
.app{display:grid;grid-template-columns:220px 1fr;}
.sidebar{padding:22px 14px;border-right:1px solid var(--border);min-height:900px;}
.nav-section{font-size:12px;font-weight:700;color:var(--muted-2);letter-spacing:1.2px;margin:18px 10px 8px;}
.nav-section:first-child{margin-top:0;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;margin-bottom:2px;}
.nav-item .ic{width:18px;text-align:center;font-size:14px;}
.nav-item.active{background:rgba(59,130,246,0.12);color:var(--white);box-shadow:inset 3px 0 0 var(--blue);cursor:default;}
.nav-item:hover:not(.active){background:rgba(255,255,255,0.04);color:var(--white);}
.main{padding:28px 32px 48px;}
.topbar-row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;}
.page-title{font-size:21px;font-weight:800;color:var(--text-strong, #fff);}
.page-sub{font-size:12.5px;color:var(--muted);margin-top:4px;max-width:860px;line-height:1.6;}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--panel-2);}
.header-left{display:flex;align-items:center;gap:12px;}
.header-left img{height:22px;}
.app-title{font-size:15px;font-weight:800;color:var(--text-strong, #fff);}
.clock{font-size:12px;color:var(--blue-light);font-weight:600;}
.header-right{display:flex;align-items:center;gap:10px;}
.status-pill{display:flex;align-items:center;gap:6px;background:rgba(30,185,128,0.15);border:1px solid rgba(30,185,128,0.4);color:var(--teal);padding:6px 14px;border-radius:20px;font-size:12px;font-weight:800;}
.status-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);}
.beta-tag{background:var(--teal);color:var(--fill-contrast,#06281c);font-size:11.25px;font-weight:800;padding:1px 6px;border-radius:4px;margin-left:2px;}
.avatar-btn{width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;}
.icon-btn{width:32px;height:32px;border-radius:8px;background:var(--panel);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted);cursor:pointer;}

.cat{margin-bottom:24px;max-width:1040px;}
.cat-title{font-size:14px;font-weight:800;color:var(--text-strong, #fff);margin-bottom:10px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;}
.cat-title:hover{color:var(--blue-light);}
/* 접이식 — 제목 클릭으로 섹션 접기(카드가 너무 많아 기본은 첫 섹션만 펼침). */
.cat.collapsed{margin-bottom:8px;}
.cat.collapsed > :not(.cat-title){display:none;}
.kcar{color:var(--blue-light);font-size:12.25px;font-weight:900;width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;background:rgba(59,130,246,.14);border:1px solid rgba(59,130,246,.35);flex:0 0 auto;}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
/* 상세 지표 한 줄(2026-08-02) — 큰 타일 31장(약 1,900px)을 구역당 한 줄로 줄인다.
   ⚠ 색은 그대로 살린다. 훑어서 알던 것을 하나씩 읽게 만들면 줄인 뜻이 없다. */
.krow{display:flex;align-items:baseline;gap:12px;margin-bottom:0;padding:7px 2px;
  border-bottom:1px solid rgba(255,255,255,.05);max-width:1040px;}
.krow:last-of-type{border-bottom:0;}
.krow .cat-title{margin-bottom:0;flex:0 0 auto;min-width:150px;font-size:13px;gap:6px;}
.krow .kvals{display:flex;flex-wrap:wrap;gap:2px 13px;font-size:12.5px;color:var(--muted);min-width:0;flex:1;}
.krow .kv{white-space:nowrap;}
.krow .kv b{color:var(--text-strong, #fff);font-weight:800;font-size:13.5px;margin-left:2px;}
.krow .cat-link{flex:0 0 auto;}
.krow:hover{background:rgba(59,130,246,.05);}
.tile{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
.tile .t-label{font-size:12.25px;color:var(--muted);margin-bottom:6px;}
.tile .t-value{font-size:22px;font-weight:800;color:var(--text-strong, #fff);}
.footer{margin-top:20px;padding:18px 0 0;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted-2);max-width:1040px;}
.footer img{height:16px;opacity:0.6;}

/* 숫자 다음에 올 것 — "그래서 뭘 하지". 숫자만 있고 손이 갈 곳이 없던 화면을 고친다(2026-08-01 사용점검). */

/* 종합 태세 히어로 + 임원 헤드라인 (인터넷 모범사례: 한 줄 대표 점수 + 7~8 핵심 지표) */
.hero{display:grid;grid-template-columns:300px 1fr;gap:14px;max-width:1040px;margin-bottom:22px;}
.posture{background:linear-gradient(180deg,rgba(59,130,246,.1),transparent);border:1px solid var(--border-strong);border-radius:14px;padding:18px;display:flex;flex-direction:column;}
.posture .pl{font-size:12px;font-weight:800;color:var(--muted);}
.posture .pscore{display:flex;align-items:baseline;gap:8px;margin:6px 0 4px;}
.posture .pv{font-size:52px;font-weight:900;line-height:1;}
.posture .pb{font-size:13px;font-weight:800;padding:3px 10px;border-radius:20px;}
.pb.good{background:rgba(30,185,128,.16);color:var(--teal, #6fdcb5);} .pb.fair{background:rgba(240,160,32,.16);color:var(--amber, #f7c777);} .pb.poor{background:rgba(226,72,61,.16);color:var(--red-ink, #f5928a);}
.posture .pf{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:12px;}
.pf-row{display:flex;align-items:center;gap:8px;font-size:12.25px;} .pf-row .l{width:120px;color:var(--muted);flex-shrink:0;}
.pf-row .tr{flex:1;height:6px;background:var(--panel-2);border-radius:20px;overflow:hidden;} .pf-row .fl{height:100%;border-radius:20px;} .pf-row .vv{width:34px;text-align:right;font-weight:700;flex-shrink:0;}
.headline{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
.hcard{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;justify-content:center;}
.hcard .hl{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:5px;}
.hcard .hv{font-size:28px;font-weight:800;margin-top:6px;line-height:1;}
.hcard .hd{font-size:12.25px;font-weight:700;margin-top:5px;}
.hd.up{color:var(--red-ink, #f5928a);} .hd.down{color:var(--teal, #6fdcb5);} .hd.flat{color:var(--muted-2);}
.hcard .hsub{font-size:11.75px;color:var(--muted-2);margin-top:3px;}
/* 클릭 가능한 카드/타일 — 상단 KPI는 리포트 출력, AI 보안 타일은 화면 이동 */
.hcard.clk{cursor:pointer;transition:border-color .12s,transform .12s;}
.hcard.clk:hover{border-color:var(--blue);transform:translateY(-1px);}
.tile.clk{cursor:pointer;transition:border-color .12s,transform .12s;}
.tile.clk:hover{border-color:var(--purple);transform:translateY(-1px);}
.trend-card.clk{cursor:pointer;transition:border-color .12s,transform .12s;}
.trend-card.clk:hover{border-color:var(--blue);transform:translateY(-1px);}
.cat-link{margin-left:auto;font-size:12px;font-weight:700;color:var(--blue-light);cursor:pointer;}
.cat-link:hover{text-decoration:underline;}

/* ⏱ AI가 아낀 시간(중-2) — 승인된 시안(mockups/kpi-time-saved) 그대로.
   배치 근거: 위험도 히어로에 섞으면 "클수록 좋다"로 읽히므로 AI 보안 아래·상세 지표 위 별도 카드.
   신뢰 장치: 단일 숫자 대신 범위(보수 하한 먼저) + '추정' 배지 + 근거 표 + 한계 문구 상시 노출. */
/* 제목 줄을 접기 제목이 대신하므로, 기준시간 조정 링크는 본문 첫 줄 오른쪽으로 옮긴다. */
.tsv-adminrow{display:flex;justify-content:flex-end;margin-bottom:6px;}
.tsv-hero{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px 18px;}
.tsv-range{font-size:30px;font-weight:900;color:var(--teal);line-height:1.1;}
.tsv-range small{font-size:14px;font-weight:700;color:var(--muted);}
.tsv-badge{display:inline-block;font-size:11.75px;font-weight:800;color:var(--amber);border:1px solid rgba(245,158,11,.4);background:rgba(245,158,11,.10);border-radius:999px;padding:2px 8px;vertical-align:middle;margin-left:8px;}
.tsv-sub{font-size:12.25px;color:var(--muted-2);margin-top:6px;}
.tsv-warn{margin-top:10px;font-size:12.5px;color:var(--amber);background:rgba(245,158,11,.08);border-left:3px solid var(--amber);border-radius:0 6px 6px 0;padding:8px 12px;}
.tsv-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px;}
.tsv-table th{text-align:left;font-size:12px;font-weight:700;color:var(--muted-2);padding:6px 10px;border-bottom:1px solid var(--border);}
.tsv-table th.num,.tsv-table td.num{text-align:right;}
.tsv-table td{padding:9px 10px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:top;}
.tsv-table tr:last-child td{border-bottom:none;}
/* 근거 설명을 아랫줄이 아니라 **이름 옆**에 잇는다 — 한 종류가 한 줄을 쓴다(2026-08-02).
   길면 …으로 자르고 마우스를 올리면 전문이 뜬다(title). 지운 것이 아니라 접은 것이다. */
.tsv-src{font-size:11.75px;color:var(--muted-2);min-width:0;flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
/* 이름 칸은 [이름][근거]가 한 줄에 나란히 — 이름이 길어도 줄이 늘지 않게 근거만 …으로 줄인다. */
.tsv-table td:first-child{display:flex;align-items:baseline;gap:8px;}
/* 숫자 칸은 절대 접지 않는다 — "85건"이 "85 / 건"으로 갈라져 두 줄이 됐다. */
.tsv-table th.num,.tsv-table td.num{white-space:nowrap;}
.tsv-own{display:inline-block;font-size:11.5px;font-weight:700;color:var(--blue-light);border:1px solid rgba(59,130,246,.35);border-radius:999px;padding:1px 6px;margin-left:6px;}
.tsv-sum td{font-weight:800;color:var(--text-strong, #fff);border-top:1px solid var(--border-strong);}
.tsv-note{margin-top:12px;font-size:12.25px;line-height:1.7;color:var(--muted);background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;}
.tsv-note b{color:var(--text);}
.tsv-admin{margin-left:auto;font-size:12px;font-weight:700;color:var(--blue-light);cursor:pointer;}
.tsv-admin:hover{text-decoration:underline;}
.tsv-edit{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;margin-top:12px;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;}
.tsv-edit label{font-size:12.5px;color:var(--text);}
.tsv-edit input{width:80px;background:var(--panel);border:1px solid var(--border-strong);border-radius:6px;padding:5px 8px;color:var(--text);font-size:12px;text-align:right;}
.tsv-empty{font-size:12px;color:var(--muted);padding:14px 2px;}

/* 📂 상세 지표 — 임원 요약 아래 전체 세부 지표를 접이식 한 판으로 통합(기본 펼침, 2026-08-02) */
.detail-panel{max-width:1040px;margin-bottom:24px;border:1px solid var(--border);border-radius:12px;background:var(--panel-2);overflow:hidden;}
.detail-body{padding:8px 18px 18px;}
.detail-panel .cat{max-width:none;margin-bottom:20px;}

/* 추세 */
.trend-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:1040px;}
.trend-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
.trend-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
.trend-name{font-size:12.5px;font-weight:700;color:var(--text);}
.trend-now{font-size:16px;font-weight:800;}
.trend-note{font-size:12.25px;color:var(--muted-2);margin-top:6px;}
/* ⚠ 세로 모니터 대응(2026-08-19 QA 실측). 세로 1080px 주모니터에서 허브 무대 폭이 644px인데
   .hero의 300px 고정열 + .headline 3열이 그대로 버텨 **가로로 넘쳤다**(kpiRoot·hero·headline).
   이 화면엔 @media가 하나도 없었다 — 좁으면 세로로 쌓는다. */
@media (max-width:900px){
  .hero{grid-template-columns:1fr;}
  .headline{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<!-- 상단 바는 공용이다 — titlebar.js가 그린다(분리창=공용 헤더, 탭 안=셸 탭줄). 화면마다 두던 사본 23개를 지웠다(2026-08-07). -->

<div class="app">
  <div class="sidebar" id="gijoNav"></div>

  <div class="main">
    <div class="topbar-row">
      <div>
        <div class="page-title">📊 보안 KPI 대시보드</div>
      </div>
    </div>

    <div id="gijoChatWidget" data-start="collapsed" data-prompts='["보안 KPI 현황 알려줘"]'></div>

    <div id="kpiRoot"><div style="color:var(--muted)">불러오는 중...</div></div>

    <div class="footer">
      <img src="gijo-symbol.svg" alt="GIJO">
      <span>© 2026 GIJO Technology · GIJO AS Platform · Confidential</span>
    </div>
  </div>
</div>

<script>


  /**
   * 지표 한 칸 — 큰 타일 대신 **한 줄 안의 작은 짝**으로 그린다(2026-08-02 사용자 지시
   * "상세 지표는 간단하게 엑셀 표처럼 작게 정리해 주고").
   * ⚠ 색은 그대로 살린다 — 고위험 빨강·양호 초록이 사라지면 훑어서 알던 것을 하나씩 읽어야 한다.
   */
  function kv(label, value, color) {
    return `<span class="kv">${label} <b${color ? ` style="color:${color}"` : ""}>${value}</b></span>`;
  }
  /** 구역 한 줄 — [이름][값들][→ 열기]. 이름·구조는 그대로 둔다(화면 연결이 .cat-title로 찾는다). */
  function krow(title, vals) {
    return `<div class="cat krow"><div class="cat-title">${title}</div><div class="kvals">${vals}</div></div>`;
  }

  function tile(label, value, color) {
    return `<div class="tile"><div class="t-label">${label}</div><div class="t-value"${color ? ` style="color:${color}"` : ""}>${value}</div></div>`;
  }

  // 값 배열 → 미니 스파크라인 SVG. 값이 1개뿐이면 점 하나로 표시.
  function sparkline(values, color) {
    const w = 220, h = 40, pad = 3;
    if (!values.length) return "";
    const max = Math.max(...values, 1), min = Math.min(...values, 0);
    const span = max - min || 1;
    const x = (i) => pad + (values.length === 1 ? w / 2 : (i * (w - 2 * pad)) / (values.length - 1));
    const y = (v) => h - pad - ((v - min) / span) * (h - 2 * pad);
    if (values.length === 1) {
      return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}"><circle cx="${x(0)}" cy="${y(values[0])}" r="3" fill="${color}"/></svg>`;
    }
    const pts = values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(values.length - 1)}" cy="${y(values[values.length - 1])}" r="2.6" fill="${color}"/></svg>`;
  }

  function trendCard(name, values, color, unit) {
    const now = values.length ? values[values.length - 1] : 0;
    const note = values.length <= 1 ? "추세는 매일 스냅샷이 쌓이며 나타납니다 (현재 " + values.length + "일)" : `최근 ${values.length}일`;
    return `<div class="trend-card"><div class="trend-head"><span class="trend-name">${name}</span><span class="trend-now" style="color:${color}">${now}${unit || ""}</span></div>${sparkline(values, color)}<div class="trend-note">${note}</div></div>`;
  }

  const fmtD = (ms) => { const d = new Date(ms); return `${d.getMonth() + 1}/${d.getDate()}`; };

  // 스캔 기반 취약점 번다운 — 매 스캔 시점의 열린 취약점(빨강)·KEV(진빨강)를 실제 저장 이력에서
  // 재구성한 시계열. 일일 스냅샷과 달리 재스캔을 거듭한 실제 감소 궤적을 보여준다.
  function burndownChart(points) {
    if (!points || !points.length) return "";
    const W = 640, H = 172, padL = 34, padR = 12, padT = 12, padB = 24;
    const iw = W - padL - padR, ih = H - padT - padB, n = points.length;
    const maxV = Math.max(1, ...points.map((p) => p.active));
    const x = (i) => padL + (n === 1 ? iw / 2 : (i * iw) / (n - 1));
    const y = (v) => padT + ih - (v / maxV) * ih;
    const line = (key, color, width) => {
      if (n === 1) return `<circle cx="${x(0)}" cy="${y(points[0][key])}" r="3.4" fill="${color}"/>`;
      const pts = points.map((p, i) => `${x(i).toFixed(1)},${y(p[key]).toFixed(1)}`).join(" ");
      return `<polyline points="${pts}" fill="none" stroke="${color}" stroke-width="${width}" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(n - 1)}" cy="${y(points[n - 1][key])}" r="3" fill="${color}"/>`;
    };
    const grid = [0, Math.round(maxV / 2), maxV]
      .filter((g, i, a) => a.indexOf(g) === i)
      .map((g) => `<line x1="${padL}" y1="${y(g)}" x2="${W - padR}" y2="${y(g)}" stroke="var(--border)" stroke-width="1"/><text x="${padL - 6}" y="${y(g) + 3}" text-anchor="end" font-size="9" fill="var(--muted-2)">${g}</text>`)
      .join("");
    const xl = `<text x="${x(0)}" y="${H - 7}" text-anchor="start" font-size="9" fill="var(--muted-2)">${fmtD(points[0].at)}</text>` +
      (n > 1 ? `<text x="${x(n - 1)}" y="${H - 7}" text-anchor="end" font-size="9" fill="var(--muted-2)">${fmtD(points[n - 1].at)}</text>` : "");
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px">${grid}${line("active", "#f5928a", 2.2)}${line("kev", "#ff5a4d", 2)}${xl}</svg>`;
  }

  // 임원 헤드라인 카드 — 값 + 기간 대비 증감(delta). down=좋아짐(초록), up=나빠짐(빨강).
  // betterWhenDown: 값이 줄어드는 게 좋은 지표(취약점·KEV·기한초과)면 true.
  function headlineCard(label, value, unit, series, betterWhenDown, sub) {
    var arr = (series || []).filter(function (x) { return typeof x === "number"; });
    var delta = arr.length >= 2 ? arr[arr.length - 1] - arr[arr.length - 2] : null;
    var dHtml = "";
    if (delta != null && delta !== 0) {
      var improved = betterWhenDown ? delta < 0 : delta > 0;
      dHtml = '<div class="hd ' + (improved ? "down" : "up") + '">' + (delta > 0 ? "▲" : "▼") + Math.abs(delta) + (unit || "") + " (전일 대비)</div>";
    } else if (delta === 0) {
      dHtml = '<div class="hd flat">— 전일과 동일</div>';
    } else {
      dHtml = '<div class="hd flat">추세 누적 중</div>';
    }
    return '<div class="hcard"><div class="hl">' + label + '</div><div class="hv">' + value + (unit || "") + "</div>" + dHtml + (sub ? '<div class="hsub">' + sub + "</div>" : "") + "</div>";
  }

  function heroBlock(c, v, rem, series) {
    var p = c.posture || { score: 0, band: "poor", factors: [] };
    var pfBar = function (f) {
      var col = f.value >= 80 ? "var(--teal)" : f.value >= 55 ? "var(--amber)" : "#f5928a";
      return '<div class="pf-row"><span class="l">' + f.label + '</span><div class="tr"><div class="fl" style="width:' + Math.min(100, f.value) + "%;background:" + col + '"></div></div><span class="vv" style="color:' + col + '">' + f.value + "%</span></div>";
    };
    var pcol = p.band === "good" ? "#6fdcb5" : p.band === "fair" ? "#f7c777" : "#f5928a";
    var bandTxt = p.band === "good" ? "양호" : p.band === "fair" ? "보통" : "취약";
    var mttr = c.mttrDays == null ? '<span style="color:var(--muted-2)">집계 중</span>' : c.mttrDays + "일";
    var mttrSub = c.mttrDays == null ? "조치 완료건 3건↑ 쌓이면 표시" : "조치 태스크 완료 평균";
    // 이 화면은 전부 지표라 "요약 카드"를 새로 만들 게 아니라, 임원 요약(히어로)이 곧 요약이다.
    // 팝업은 여기까지만 열리고 상세 지표는 스크롤로 본다(2026-07-27).
    return (
      '<div class="hero" data-gijo-summary>' +
      '<div class="posture"><div class="pl">🛡 종합 보안태세</div>' +
      '<div class="pscore"><span class="pv" style="color:' + pcol + '">' + p.score + '</span><span class="pb ' + p.band + '">' + bandTxt + "</span></div>" +
      '<div style="font-size:12px;color:var(--muted-2)">100점 만점 · 실지표 가중 합성(악용·기한초과·고위험자산 감점)</div>' +
      '<div class="pf">' + p.factors.map(pfBar).join("") + "</div></div>" +
      '<div class="headline">' +
      // ⚠ 「열린 취약점 0건」이 안전을 뜻하지 않을 수 있다 — 점검 자체가 실패했으면 아직 안 본
      //   것이다(2026-08-01: 602건이 전부 스캔 오류인데 "활성 46건"으로 보고했다). 그래서
      //   실패 건수를 부제에 함께 적는다. 임원이 이 카드 하나만 보고 판단하기 때문이다.
      headlineCard("🔴 열린 취약점", v.active, "건", series("vulnerabilities.active"), true,
        v.scanFailed ? `⚠ 점검 실패 ${v.scanFailed}건은 아직 안 본 것` : "fixed 제외 현재 노출") +
      headlineCard("🚨 실제 악용(KEV)", v.kev, "건", series("vulnerabilities.kev"), true, "CISA KEV 등재 — 최우선") +
      headlineCard("⏱ MTTR", mttr, "", null, true, mttrSub) +
      headlineCard("📋 SLA 준수율", rem.slaCompliance, "%", series("remediation.slaCompliance"), false, "조치 기한 준수 비율") +
      headlineCard("✓ 취약점 조치율", v.remediationRate, "%", null, false, "고쳐짐/(열림+고쳐짐)") +
      headlineCard("📕 컴플라이언스 대응률", c.compliance.coverageRate, "%", series("compliance.coverageRate"), false, "KISA 위협 대응") +
      "</div></div>"
    );
  }

  // ⚠ 「지금 손댈 일」 줄은 **대화창으로 옮겼다**(2026-08-02 사용자 지시 —
  //   "대화창에서 가이드할 수 있게 하고 메뉴 화면에서는 숨기거나 삭제").
  //   서버 도구 urgent_todo가 같은 규칙으로 만든다. 화면과 대화창이 규칙을 두 벌 가지면
  //   한쪽만 고쳐진다 — 실제로 화면에만 있던 "0이면 줄을 만들지 않는다"가 그런 자리였다.
  // 🤖 AI 보안 (OWASP LLM) — 제품 차별점. 자산 허브 도출을 KPI로 요약, 보라 강조.
  function aiSecurityBlock(c) {
    var a = c.aiSecurity;
    if (!a) return "";
    var bomRate = a.aiAssets ? Math.round((a.aibomComplete / a.aiAssets) * 100) : 0;
    var robust = a.avgRobustness == null ? '<span style="color:var(--muted-2);font-size:16px">미점검</span>' : a.avgRobustness + "점";
    var robustCol = a.avgRobustness == null ? "var(--muted)" : a.avgRobustness >= 70 ? "var(--teal)" : a.avgRobustness >= 40 ? "var(--amber)" : "#f5928a";
    var top = a.topRisk ? a.topRisk.code + " " + a.topRisk.title + " (" + a.topRisk.count + ")" : "미대응 없음";
    // 타일 클릭 → 관련 화면으로 이동(page). 마지막 인자에 이동 대상 화면을 지정.
    var aiTile = function (label, value, color, sub, page) {
      var attr = page ? ' data-page="' + page + '" class="tile clk"' : ' class="tile"';
      var hint = page ? '<div style="font-size:11.5px;color:var(--blue-light);margin-top:4px">→ 자세히 보기</div>' : "";
      return '<div' + attr + ' style="border-color:rgba(139,124,240,.28)"><div class="t-label">' + label + '</div><div class="t-value"' + (color ? ' style="color:' + color + '"' : "") + ">" + value + "</div>" + (sub ? '<div style="font-size:11.75px;color:var(--muted-2);margin-top:4px">' + sub + "</div>" : "") + hint + "</div>";
    };
    return (
      '<div class="cat"><div class="cat-title">🤖 AI 보안 (OWASP LLM Top 10)</div>' +
      '<div class="tiles">' +
      aiTile("AI 자산", a.aiAssets, "#c9b8ff", "LLM·모델 자산", "inventory.html") +
      aiTile("OWASP LLM 미대응", a.owaspOpen, a.owaspOpen ? "#f5928a" : "var(--teal)", top, "inventory.html") +
      aiTile("AI-BOM 생성률", bomRate + "%", bomRate >= 80 ? "var(--teal)" : bomRate >= 40 ? "var(--amber)" : "#f5928a", a.aibomComplete + "/" + a.aiAssets + " 자산", "sbom.html") +
      aiTile("레드팀 견고성", robust, robustCol, a.redteamTested + "/" + a.aiAssets + " 점검됨", "redteam.html") +
      "</div></div>"
    );
  }

  // ⏱ AI가 아낀 시간(중-2) — 서버가 이미 보수 조정한 값을 그대로 보여준다(화면이 다시 계산하지 않는다).
  // 1시간 미만은 분으로, 그 이상은 소수 1자리 — 서버 fmtDuration과 같은 규칙(숫자가 두 곳에서 달라 보이면 못 믿는다).
  function tsvDur(minutes) {
    if (minutes < 60) return Math.round(minutes) + "분";
    return Math.round((minutes / 60) * 10) / 10 + "시간";
  }

  function timeSavedBlock(t) {
    if (!t || !t.rows || t.rows.length === 0) {
      return (
        '<div class="cat" data-gijo-summary><div class="cat-title">⏱ AI가 아낀 시간</div>' +
        '<div class="tsv-empty">아직 집계할 자동화 기록이 없습니다 — AI가 일을 처리하면 여기에 쌓입니다.</div></div>'
      );
    }
    const cases = t.rows.reduce((s, r) => s + r.count, 0);
    const lo = tsvDur(t.totalMinutes * (1 - t.riskAdjustment));
    const hi = tsvDur(t.totalMinutes);
    const warn = t.coversWholePeriod || !t.ledgerStart ? "" :
      '<div class="tsv-warn">⚠ 기록은 <b>' + new Date(t.ledgerStart).toLocaleDateString("ko-KR") +
      '</b>부터 쌓였습니다 — 그 이전 기간은 이번 집계에 들어 있지 않습니다.</div>';
    // 한 종류가 두 줄(이름 + 근거 설명)을 쓰던 것을 **한 줄**로 합친다(2026-08-02 사용자 지시).
    // 근거는 지우지 않고 이름 옆에 잇는다 — "자체 추정"이라는 사실을 감추면 숫자가 사실처럼 읽힌다.
    const rows = t.rows.map((r) =>
      "<tr><td>" + r.label + (r.custom ? '<span class="tsv-own">우리 조직 설정</span>' : "") +
      '<span class="tsv-src" title="' + String(r.source).replace(/"/g, "&quot;").replace(/</g, "&lt;") + '">' +
      String(r.source).replace(/</g, "&lt;") + "</span></td>" +
      '<td class="num">' + r.count + "건</td>" +
      '<td class="num">' + r.minutesEach + "분</td>" +
      '<td class="num" style="color:var(--teal)">' + tsvDur(r.minutes) + "</td></tr>"
    ).join("");
    return (
      '<div class="cat" data-gijo-summary data-gijo-fold="⏱ AI가 아낀 시간">' +
      '<div class="tsv-adminrow"><span class="tsv-admin" id="tsvAdminBtn">⚙ 기준시간 조정 (관리자)</span></div>' +
      '<div class="tsv-hero"><div>' +
      '<div class="tsv-range">약 ' + lo + " ~ " + hi + '<span class="tsv-badge">추정</span></div>' +
      '<div class="tsv-sub">최근 ' + t.days + "일 · AI가 대신 처리한 일 " + cases + "건 · 앞의 값은 보수 조정(20%↓) 적용값</div>" +
      "</div></div>" + warn +
      '<table class="tsv-table"><thead><tr><th>작업 종류</th><th class="num">건수</th><th class="num">기준시간</th><th class="num">절감 환산</th></tr></thead>' +
      "<tbody>" + rows +
      '<tr class="tsv-sum"><td>합계</td><td class="num">' + cases + '건</td><td class="num">—</td><td class="num">' + hi + " → 보수 조정 " + lo + "</td></tr>" +
      "</tbody></table>" +
      '<div class="tsv-note">' + String(t.note).replace(/</g, "&lt;").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>") + "</div>" +
      '<div class="tsv-edit" id="tsvEdit" hidden></div>' +
      "</div>"
    );
  }

  // 기준시간 조정 — 관리자만 성공한다(서버가 판단한다). 실패하면 이유를 그대로 보여준다.
  function wireTimeSaved(t) {
    const btn = document.getElementById("tsvAdminBtn");
    const box = document.getElementById("tsvEdit");
    if (!btn || !box || !t) return;
    btn.onclick = () => {
      if (!box.hidden) { box.hidden = true; return; }
      const all = t.baselines || {};
      box.innerHTML =
        '<div style="grid-column:1/-1;font-size:12.25px;color:var(--amber)">⚠ 이 값을 바꾸면 조직 전체의 절감 보고 수치가 함께 바뀝니다. 0분으로 두면 그 작업은 아예 세지 않습니다.</div>' +
        Object.keys(all).map((k) => {
          const label = (t.rows.find((r) => r.kind === k) || {}).label || k;
          const cur = (t.custom && t.custom[k] != null) ? t.custom[k] : all[k].minutes;
          return '<label for="tsv-' + k + '">' + label + "</label>" +
            '<input id="tsv-' + k + '" type="number" min="0" max="600" value="' + cur + '" data-kind="' + k + '">';
        }).join("");
      box.hidden = false;
      box.querySelectorAll("input").forEach((el) => {
        el.onchange = async () => {
          try {
            await window.gijo.setTimeSavedBaseline(el.dataset.kind, Number(el.value));
            load(); // 바뀐 값으로 다시 그린다 — 화면과 저장값이 어긋나지 않게
          } catch (e) {
            await window.gijoTell("기준시간을 바꾸지 못했습니다: " + (e.message || e));
          }
        };
      });
    };
  }

  async function load() {
    const root = document.getElementById("kpiRoot");
    try {
      const { current, trend, burndown } = await window.gijo.getSecurityKpi();
      const c = current;
      // 경로 중간이 없으면(옛 스냅샷에 vulnerabilities 없음) 0으로 — 추세가 끊기지 않게.
      const series = (path) => trend.map((s) => path.split(".").reduce((o, k) => (o == null ? undefined : o[k]), s) ?? 0);
      const v = c.vulnerabilities || { hosts: 0, active: 0, critical: 0, high: 0, medium: 0, low: 0, kev: 0, newCount: 0, resurfaced: 0, newlyFixed: 0, remediationRate: 0 };
      const rem = c.remediation || { tasks: 0, open: 0, done: 0, overdue: 0, dueSoon: 0, slaCompliance: 100 };

      // 세부 지표는 임원 요약(히어로·AI 보안) 아래 '📂 상세 지표' 한 판으로 묶는다(기본 펼침).
      const detailSections =
        krow("🖥 자산 위험도",
          kv("전체", c.assets.total) + kv("고위험", c.assets.highRisk, "#f5928a") +
          kv("중위험", c.assets.midRisk, "var(--amber)") + kv("저위험", c.assets.lowRisk, "var(--teal)")) +

        krow("🔎 취약점 승인 (finding)",
          kv("전체", c.findings.total) + kv("미검토", c.findings.pending, "var(--amber)") +
          kv("승인", c.findings.approved, "var(--teal)") + kv("반려(오탐)", c.findings.rejected, "#f5928a")) +

        krow("🔧 유지보수 점검 거버넌스",
          kv("전체", c.inspections.total) + kv("지연", c.inspections.overdue, "#f5928a") +
          kv("승인 대기", c.inspections.pendingApproval, "var(--amber)") + kv("승인됨", c.inspections.approved, "var(--teal)")) +

        krow("🎯 CTI 위협 · 자산 영향",
          kv("수집", c.cti.totalFindings) + kv("자산 매칭", c.cti.matchedFindings, "var(--amber)") +
          kv("영향 자산", c.cti.affectedAssets, "#f5928a") + kv("긴급", c.cti.criticalMatches, "#f5928a")) +

        krow("🛡 취약점 조치 현황",
          kv("열림", v.active, v.active ? "#f5928a" : "var(--teal)") +
          kv("🔴 KEV", v.kev, v.kev ? "#ff8a80" : "var(--muted)") +
          kv("조치율", v.remediationRate + "%", "var(--teal)") +
          kv("스캔 호스트", v.hosts, "var(--blue-light)") +
          kv("Critical", v.critical, "#f5928a") + kv("High", v.high, "#f7a86a") +
          kv("🆕 신규", v.newCount, "var(--blue-light)") + kv("✓ 고쳐짐", v.newlyFixed, "var(--teal)")) +

        krow("📋 조치 항목 · SLA",
          kv("항목", rem.tasks) + kv("기한 초과", rem.overdue, rem.overdue ? "#f5928a" : "var(--teal)") +
          kv("임박(3일↓)", rem.dueSoon, rem.dueSoon ? "var(--amber)" : "var(--muted)") +
          kv("SLA 준수율", rem.slaCompliance + "%", rem.slaCompliance >= 90 ? "var(--teal)" : rem.slaCompliance >= 70 ? "var(--amber)" : "#f5928a")) +

        krow("✓ 컴플라이언스 · 🔄 AI 학습",
          kv("KISA 위협", c.compliance.total) + kv("대응 완료", c.compliance.covered, "var(--teal)") +
          kv("대응률", c.compliance.coverageRate + "%", "var(--blue-light)") +
          kv("배포 학습 모델", c.learning.deployedModels, "var(--purple)")) ;


      // "AI가 아낀 시간"은 서버가 아직 없는 구버전에서도 화면이 죽지 않아야 한다 — 실패하면 빈 값.
      // 그래프는 **손대지 않고 자리만** 올린다(2026-08-02 사용자 지시 "그래프는 변경 안 해도
      // 되는데 위치 잘 잡아줘"). 추세가 낱개 숫자보다 앞선다 — "늘고 있나 줄고 있나"가 먼저다.
      const 그래프묶음 =
        (() => {
          const bd = burndown || [];
          const n = bd.length;
          const first = n ? bd[0].active : 0, last = n ? bd[n - 1].active : 0, delta = last - first;
          const net = n < 2
            ? `<span style="color:var(--muted)">스캔 ${n}회</span>`
            : `<span style="color:var(--muted-2)">${first}</span> → <span class="trend-now" style="color:${last <= first ? "var(--teal)" : "#f5928a"}">${last}</span> <span style="color:${delta <= 0 ? "var(--teal)" : "#f5928a"};font-weight:800">${delta <= 0 ? "▼" : "▲"}${Math.abs(delta)}</span>`;
          const chart = burndownChart(bd);
          const body = n === 0
            ? `<div class="trend-note">아직 스캔 이력이 없습니다. 취약점 리포트를 업로드하면 재스캔마다 번다운이 그려집니다.</div>`
            : chart + `<div class="trend-note"><span style="color:#f5928a">●</span> 열린 취약점 &nbsp; <span style="color:#ff5a4d">●</span> 실제 악용(KEV) &nbsp;·&nbsp; ${n < 2 ? "재스캔이 쌓이면 감소 궤적이 나타납니다" : `${n}개 스캔 시점 기준 — 실제 저장된 스캔 이력에서 재구성`}</div>`;
          return `<div class="cat" data-gijo-fold="📉 취약점 번다운 (실제 스캔 이력)"><div class="trend-card" style="max-width:680px"><div class="trend-head"><span class="trend-name">열린 취약점 — 재스캔마다 재구성 (줄수록 좋음)</span><span class="trend-now">${net}</span></div>${body}</div></div>`;
        })() +

        `<div class="cat" data-gijo-fold="📈 추세 · 조치 번다운 (일일 스냅샷)"><div class="trend-grid">` +
        trendCard("열린 취약점 (번다운 — 줄수록 좋음)", series("vulnerabilities.active"), "#f5928a", "건") +
        trendCard("실제 악용(KEV)", series("vulnerabilities.kev"), "#ff8a80", "건") +
        trendCard("SLA 준수율", series("remediation.slaCompliance"), "var(--teal)", "%") +
        trendCard("조치 기한 초과", series("remediation.overdue"), "#f5928a", "건") +
        `</div></div>`;

      const timeSaved = await window.gijo.timeSaved(30).catch(() => null);

      root.innerHTML =
        heroBlock(c, v, rem, series) +
        aiSecurityBlock(c) +
        timeSavedBlock(timeSaved) +
        그래프묶음 +
        // 이 화면만 쓰던 자체 접기를 **공용 접기**로 바꿨다(2026-08-02 사용자 지시 "공용 접기 해 줘").
        // 화면마다 접는 모양이 다르면 담당자는 화면을 옮길 때마다 다시 배운다.
        `<div class="detail-panel detail-body" id="detailPanel" data-gijo-fold="📂 상세 지표">` +
        detailSections + `</div>`;
      wireKpi();
      wireTimeSaved(timeSaved);
    } catch (e) {
      root.innerHTML = '<div style="color:#f5928a">KPI를 불러오지 못했습니다: ' + String(e.message || e).replace(/</g, "&lt;") + "</div>";
    }
  }

  // 렌더 후 상호작용 배선 — ① 상세 지표 아코디언(기본 펼침) ② 상단 KPI 카드 → 리포트 출력
  // ③ AI 보안 타일 → 관련 화면 이동. (data-page 배선은 kpiRoot가 async로 채워지므로 여기서 다시 건다.)
  function wireKpi() {
    const root = document.getElementById("kpiRoot");
    // 상단 임원 KPI 카드 — 클릭하면 리포트 출력 여부를 묻는다.
    root.querySelectorAll(".hero .hcard").forEach((card) => {
      card.classList.add("clk");
      card.title = "클릭하면 현재 지표로 종합 보안 리포트를 생성합니다";
      card.addEventListener("click", askReport);
    });
    // 📂 상세 지표 아코디언(기본 펼침) — 접은 적이 있을 때만 접힌 채로 연다.
    // ⚠ 이 블록은 2026-08-02에 「지금 손댈 일」 줄을 걷다가 **함께 잘렸다.** panel 선언이 사라져
    //   아래 배선이 `panel is not defined`로 터졌고, 화면 전체가 "불러오지 못했습니다"가 됐다.
    //   지울 때 **바로 아래 코드까지 딸려 가는지** 반드시 보고 지울 것(같은 실수 두 번째다).
    const panel = document.getElementById("detailPanel");
    // 접기 제목 줄은 공용 fold.js가 끼워 넣는다. 이 화면은 자료를 받은 뒤에 그리므로
    // 첫 훑기(DOMContentLoaded)에는 이 구역이 없다 — 그려진 뒤에 한 번 더 훑게 한다.
    if (panel && window.gijoFold) window.gijoFold.scan();

    // 상세 지표 각 섹션 → 관련 화면 연결(타일·추세카드·제목 링크 모두 이동).
    // 제목의 고유 토큰으로 대상 화면을 판별한다(개별 tile 호출을 건드리지 않는 방식).
    const SECTION_PAGE = [
      { key: "자산 위험도", page: "inventory.html" },   // 🖥 → 자산 허브
      { key: "취약점 승인", page: "approvals.html" },   // 🔎 → 조치·승인
      { key: "유지보수", page: "products.html" },       // 🔧 → 보안제품 등록부
      { key: "CTI", page: "threat.html" },              // 🎯 → 위협 인텔
      { key: "조치 현황", page: "vulnscan.html" },      // 🛡 → 취약점
      { key: "조치 항목", page: "approvals.html" },     // 📋 → 조치·승인
      { key: "컴플라이언스", page: "compliance.html" }, // ✓ → 컴플라이언스
      { key: "취약점 번다운", page: "vulnscan.html" },  // 📉 → 취약점
      { key: "추세", page: "vulnscan.html" },           // 📈 → 취약점
    ];
    panel && panel.querySelectorAll(".cat").forEach((cat) => {
      const title = cat.querySelector(".cat-title");
      if (!title) return;
      const m = SECTION_PAGE.find((s) => title.textContent.indexOf(s.key) >= 0);
      if (!m) return;
      cat.querySelectorAll(".tile, .trend-card, .kv").forEach((el) => {
        el.classList.add("clk");
        el.addEventListener("click", () => (window.gijoOpenScreen ? window.gijoOpenScreen(m.page) : window.gijo.navigateTo(m.page)));
      });
      const link = document.createElement("span");
      link.className = "cat-link";
      link.textContent = "→ 화면 열기";
      link.addEventListener("click", () => (window.gijoOpenScreen ? window.gijoOpenScreen(m.page) : window.gijo.navigateTo(m.page)));
      title.appendChild(link);
    });
    // AI 보안 타일 등 data-page 요소 → 해당 화면으로 이동.
    root.querySelectorAll("[data-page]").forEach((el) => {
      el.addEventListener("click", () => (window.gijoOpenScreen ? window.gijoOpenScreen(el.dataset.page) : window.gijo.navigateTo(el.dataset.page)));
    });
  }

  let reportBusy = false;
  async function askReport() {
    if (reportBusy) return;
    if (!await gijoAsk("리포트를 출력할까요?\n현재 보안 지표로 종합 리포트(온디맨드)를 생성합니다.")) return;
    reportBusy = true;
    toast("📄 종합 보안 리포트 생성 중… (수십 초 걸릴 수 있습니다)");
    try {
      await window.gijo.generateReport({ type: "ondemand", format: "both" });
      toast("✅ 리포트 생성 완료 — 리포트 화면으로 이동합니다", 1500);
      setTimeout(() => (window.gijoOpenScreen ? window.gijoOpenScreen("report.html", "보고") : window.gijo.navigateTo("report.html")), 700);
    } catch (e) {
      toast("⚠ 리포트 생성 실패: " + String((e && e.message) || e), 4000);
    } finally {
      reportBusy = false;
    }
  }

  function toast(msg, ms) {
    let t = document.getElementById("kpiToast");
    if (!t) {
      t = document.createElement("div");
      t.id = "kpiToast";
      t.style.cssText = "position:fixed;right:24px;bottom:24px;background:var(--panel);border:1px solid var(--border-strong);color:var(--text);padding:12px 18px;border-radius:10px;font-size:13px;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:340px;line-height:1.5;";
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.display = "block";
    clearTimeout(t._h);
    if (ms) t._h = setTimeout(() => { t.style.display = "none"; }, ms);
  }

  function init() {
    load();
    document.querySelectorAll("[data-page]").forEach((el) => {
      el.addEventListener("click", () => (window.gijoOpenScreen ? window.gijoOpenScreen(el.dataset.page) : window.gijo.navigateTo(el.dataset.page)));
    });
  }

  if (!window.gijo.isAuthenticated()) {
    window.gijo.navigateTo("login.html");
  } else {
    init();
  }
</script>

// 🗂 지금 범위가 걸려 있어도 **이 화면은 자산으로 나눌 수 없다**(2026-08-18 조사).
//   조용히 무시하면 담당자는 걸린 줄 알고 그 숫자를 믿는다 — 그러니 화면이 밝힌다.
(function () {
  if (!window.gijoScope) return;
  window.gijoScope.onChange(function () { window.gijoScope.없음("보안 지표는 전사 합계 하나로 계산됩니다"); });
})();
</script>
