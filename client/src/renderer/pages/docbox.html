<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIJO AS — 문서함</title>
<style>
/* 우리 제품 토큰 그대로(settings.html·audit.html과 동일) — 시안 mockups/docbox 승인본 */
:root{
  --bg:#262624;--panel:#30302e;--panel-2:#1f1e1d;--border:rgba(255,255,255,0.08);
  --border-strong:rgba(255,255,255,0.16);--blue:#3b82f6;--blue-light:#5fa1ff;
  --text:#e9e7e2;--muted:#b3ada4;--muted-2:#a49d95;--red:#e2483d;--amber:#f0a020;
  --teal:#1eb980;--purple:#8b7cf0;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:"Pretendard","Malgun Gothic","Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:13px;display:flex;flex-direction:column;}

.head{padding:14px 18px 10px;border-bottom:1px solid var(--border);flex:0 0 auto;}
.ident{font-size:12.5px;color:var(--muted);}
.search{margin-top:9px;width:100%;background:var(--panel-2);border:1px solid var(--border-strong);
        border-radius:8px;padding:8px 12px;font-size:12.5px;color:var(--text);outline:none;}
.search::placeholder{color:var(--muted-2);}
.search:focus{border-color:var(--blue);}

.body{display:grid;grid-template-columns:250px 1fr;flex:1 1 auto;min-height:0;}

/* 왼쪽 목차 — 자산 화면 카테고리 트리와 같은 결 */
.toc{border-right:1px solid var(--border);padding:12px 10px;display:flex;flex-direction:column;overflow-y:auto;}
.grp{margin-bottom:6px;}
.grp-h{display:flex;align-items:center;gap:7px;padding:7px 9px;font-size:12.5px;font-weight:800;
       color:var(--muted);cursor:pointer;border-radius:7px;user-select:none;}
.grp-h:hover{background:rgba(255,255,255,.03);}
.grp-h .ar{font-size:11.25px;color:var(--muted-2);width:9px;}
.badge{margin-left:auto;background:rgba(255,255,255,.07);color:var(--muted);font-size:11.75px;
       font-weight:800;padding:1px 7px;border-radius:10px;}
.grp.closed .doc{display:none;}
.doc{padding:7px 9px 7px 26px;font-size:12.5px;color:var(--muted);cursor:pointer;border-radius:7px;line-height:1.45;}
.doc:hover{background:rgba(255,255,255,.04);color:var(--text);}
.doc.on{background:rgba(59,130,246,.12);color:#fff;box-shadow:inset 3px 0 0 var(--blue);}
.doc .hit{color:var(--amber);font-size:12px;font-weight:800;margin-left:5px;}
.toc-foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--border);}
.btn-req{width:100%;background:rgba(30,185,128,.10);border:1px solid var(--teal);color:#6ee7a0;
         border-radius:8px;padding:9px;font-size:12.5px;font-weight:800;cursor:pointer;}
.btn-req:hover{background:rgba(30,185,128,.18);}

/* 오른쪽 본문 — 내부 스크롤 */
.view{padding:20px 26px 40px;overflow-y:auto;min-height:0;}
.view .empty{color:var(--muted-2);font-size:13px;padding:40px 0;text-align:center;}
.md h1{font-size:19px;margin:0 0 14px;color:#fff;line-height:1.4;}
.md h2{font-size:15px;margin:22px 0 9px;color:#fff;padding-bottom:5px;border-bottom:1px solid var(--border);line-height:1.4;}
.md h3{font-size:13.5px;margin:16px 0 7px;color:var(--blue-light);}
.md p{color:var(--text);line-height:1.85;margin-bottom:10px;font-size:12.5px;}
.md ul,.md ol{margin:0 0 12px 20px;color:var(--text);line-height:1.85;font-size:12.5px;}
.md li{margin-bottom:3px;}
.md table{border-collapse:collapse;width:100%;margin:10px 0 16px;font-size:12px;display:block;overflow-x:auto;}
.md th{background:var(--panel-2);color:var(--muted);text-align:left;padding:7px 10px;border:1px solid var(--border);font-weight:700;white-space:nowrap;}
.md td{padding:7px 10px;border:1px solid var(--border);color:var(--text);}
.md pre{background:#1a1a19;border:1px solid var(--border-strong);border-radius:8px;padding:12px;
        overflow-x:auto;font:11.5px/1.6 Consolas,"Cascadia Mono",monospace;color:var(--muted);margin-bottom:12px;}
.md code{background:rgba(255,255,255,.06);border-radius:4px;padding:1px 5px;font:11.5px Consolas,monospace;color:#a7d3ff;}
.md pre code{background:none;padding:0;color:inherit;}
.md blockquote{border-left:3px solid var(--border-strong);padding:2px 0 2px 12px;margin:0 0 12px;color:var(--muted);}
.md hr{border:none;border-top:1px solid var(--border);margin:18px 0;}
.md a{color:var(--blue-light);}
.md strong{color:#fff;}
.md img{max-width:100%;border-radius:8px;border:1px solid var(--border);}
.md mark{background:rgba(240,160,32,.28);color:#fff;border-radius:3px;padding:0 2px;}

/* ── 작성 모드 (시안 mockups/docbox) ── */
.chips{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap;}
.chip{background:var(--panel-2);border:1px solid var(--border-strong);color:var(--muted);
      padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;}
.chip.on{background:rgba(59,130,246,.15);border-color:var(--blue);color:var(--blue-light);}
.fld{margin-bottom:12px;}
.fld label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px;font-weight:700;}
.fld .hint{color:var(--muted-2);font-weight:400;}
.fld input,.fld textarea{width:100%;background:var(--panel-2);border:1px solid var(--border-strong);
      border-radius:8px;padding:9px 11px;color:var(--text);font-size:12.5px;font-family:inherit;outline:none;}
.fld input:focus,.fld textarea:focus{border-color:var(--blue);}
.fld textarea{min-height:100px;resize:vertical;line-height:1.7;}
.shots{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px;}
.shot{width:104px;height:68px;border:1px solid var(--border-strong);border-radius:7px;position:relative;
      overflow:hidden;background:var(--panel-2);}
.shot img{width:100%;height:100%;object-fit:cover;}
.shot .x{position:absolute;top:2px;right:5px;color:#fff;background:rgba(0,0,0,.6);border-radius:50%;
         width:16px;height:16px;line-height:16px;text-align:center;font-size:12.25px;cursor:pointer;}
.drop{border:1px dashed var(--border-strong);border-radius:8px;padding:14px;text-align:center;
      font-size:12.5px;color:var(--muted-2);}
.drop.over{border-color:var(--teal);color:#6ee7a0;background:rgba(30,185,128,.06);}
.auto{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:11px 13px;
      font-size:12.5px;color:var(--muted);line-height:1.8;}
.auto b{color:var(--text);}
.warnbox{border-left:3px solid var(--amber);background:rgba(240,160,32,.07);border-radius:8px;
         padding:10px 12px;font-size:12px;line-height:1.75;margin:14px 0;}
.warnbox b{color:var(--amber);}
.mask{display:inline-block;background:rgba(240,160,32,.14);color:var(--amber);font-size:12px;
      font-weight:800;padding:1px 8px;border-radius:10px;}
.acts{display:flex;gap:8px;margin-top:14px;align-items:center;flex-wrap:wrap;}
.acts .g{background:rgba(30,185,128,.16);border:1px solid var(--teal);color:#6ee7a0;
      border-radius:8px;padding:9px 16px;font-size:12.5px;font-weight:800;cursor:pointer;}
.acts .n{background:var(--panel-2);border:1px solid var(--border-strong);color:var(--text);
      border-radius:8px;padding:9px 16px;font-size:12.5px;font-weight:700;cursor:pointer;}
.acts .sz{margin-left:auto;font-size:12.25px;color:var(--muted-2);}
.sec-title{font-size:12px;font-weight:800;color:var(--muted);margin:16px 0 7px;}
.status{padding:8px 18px;border-top:1px solid var(--border);font-size:12.25px;color:var(--muted-2);flex:0 0 auto;}
</style>
</head>
<body>

<!-- 화면엔 정체성 한 줄만 — 사용법·주의사항은 챗봇(screenguide)에 있다(우리 규약) -->
<div class="head">
  <div class="ident">가이드를 읽고, 개발팀에 보낼 요청을 만듭니다.</div>
  <input class="search" id="q" placeholder="🔍 문서 검색 — 제목·본문에서 찾습니다" autocomplete="off">
</div>

<div class="body">
  <div class="toc" id="toc"><div style="color:var(--muted-2);font-size:12px;padding:8px">불러오는 중…</div></div>
  <div class="view" id="view"><div class="empty">왼쪽에서 문서를 고르면 여기에 열립니다.</div></div>
</div>

<div class="status" id="status"></div>

<!-- 공용 마크다운 렌더러 — ⚠ 이 줄이 빠져 있어 window.gijoMd가 undefined였고, 목록은 나오는데
     **모든 문서 열기가 TypeError로 죽었다**(2026-08-07 사용자 신고 "문서함 문서열려?" 실체).
     이 화면이 gijoMd를 쓰는 유일한 별도 창이라 대화창 쪽 스윕에 안 걸렸다. -->
<script src="gijomd.js"></script>
<!-- ⚠ **dialog.js를 반드시 싣는다**(2026-08-18). 이 화면은 nav.js를 안 실어서 gijoAsk/gijoTell이
     저절로 오지 않는다(표준 화면은 nav.js loadDialog()가 동적으로 실어 준다). 안 실으면
     TypeError로 **버튼이 조용히 죽는다** — 네이티브 창을 없애려다 버튼을 없애는 꼴이 된다. -->
<script src="dialog.js"></script>
<script>
(function () {
  var api = window.gijo;
  var docs = [];
  var current = null;
  var searchTerm = "";
  var searchHits = null;   // 검색 결과 히트 수 — open()이 목차를 다시 그려도 유지되게 보관한다

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // ── 마크다운 렌더러 ──────────────────────────────────────────────────────
  // 외부 라이브러리를 쓰지 않는다: 폐쇄망이라 CDN이 없고, 우리 문서는 우리가 쓴 것이라
  // 문법 범위가 좁다(제목·표·목록·코드·인용·강조·링크). 필요한 만큼만 직접 그린다.
  // ⚠ 모든 텍스트는 esc()를 먼저 지난다 — 문서에 <script>가 들어 있어도 실행되지 않는다.
  // 마크다운 렌더는 **공용**(gijomd.js) — 문서함과 대화창이 같은 것을 쓴다.
  var renderMd = function (s) { return window.gijoMd.render(s); };
  var inline = function (s) { return window.gijoMd.inline(s); };

  // 검색어를 본문에서 눈에 띄게 — 렌더된 HTML의 **텍스트 노드만** 건드린다(태그가 깨지지 않게).
  function highlight(container, term) {
    if (!term || term.length < 2) return;
    var re = new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
    var walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, null);
    var targets = [];
    var n;
    while ((n = walker.nextNode())) if (re.test(n.nodeValue)) targets.push(n);
    targets.forEach(function (node) {
      var span = document.createElement("span");
      span.innerHTML = esc(node.nodeValue).replace(re, function (m) { return "<mark>" + m + "</mark>"; });
      node.parentNode.replaceChild(span, node);
    });
  }

  // ── 목차 ────────────────────────────────────────────────────────────────
  var GROUP = {
    mine: { icon: "📝", label: "내 문서" },        // 담당자가 만든 것 — 자기만 본다
    guide: { icon: "📚", label: "사용 안내" },
    policy: { icon: "📐", label: "업무 지침" },
  };
  var GROUP_ORDER = ["mine", "guide", "policy"];   // 내 것이 먼저 — 매일 여는 것이 위에 있어야 한다

  function renderToc(hits) {
    if (hits !== undefined) searchHits = hits;   // 인자를 안 주면 지금 것을 유지한다
    var el = document.getElementById("toc");
    var byGroup = { mine: [], guide: [], policy: [] };
    docs.forEach(function (d) { (byGroup[d.group] || byGroup.policy).push(d); });

    var html = "";
    GROUP_ORDER.forEach(function (g) {
      var list = byGroup[g];
      var hitsNow = searchHits;
      if (!list.length) return;
      html +=
        '<div class="grp" data-grp="' + g + '">' +
        '<div class="grp-h"><span class="ar">▼</span>' + GROUP[g].icon + " " + GROUP[g].label +
        '<span class="badge">' + list.length + "</span></div>" +
        list.map(function (d) {
          var h = hitsNow && hitsNow[d.id];
          return '<div class="doc' + (current === d.id ? " on" : "") + '" data-id="' + esc(d.id) + '">' +
            esc(d.title) + (h ? '<span class="hit">' + h + "</span>" : "") + "</div>";
        }).join("") +
        "</div>";
    });
    // 접기는 배지가 필수(우리 규약) — 위에서 배지를 항상 붙였다
    html += ""; // 요청 버튼은 아래 고정 영역에
    el.innerHTML = html +
      '<div class="toc-foot"><button class="btn-req" id="btnReq">✏ 요청 만들기</button></div>';

    el.querySelectorAll(".grp-h").forEach(function (h) {
      h.addEventListener("click", function () {
        var g = h.parentNode;
        g.classList.toggle("closed");
        h.querySelector(".ar").textContent = g.classList.contains("closed") ? "▶" : "▼";
      });
    });
    el.querySelectorAll(".doc").forEach(function (d) {
      d.addEventListener("click", function () { open(d.getAttribute("data-id")); });
    });
    document.getElementById("btnReq").addEventListener("click", openCompose);
  }

  async function open(id) {
    current = id;
    renderToc(undefined);  // 배지 유지 — 검색 중에 문서를 열어도 히트 수가 남아야 한다
    var view = document.getElementById("view");
    view.innerHTML = '<div class="empty">여는 중…</div>';
    try {
      // 개인 문서(mine:…)는 다른 곳에서 온다 — 제품 문서 읽기 경로를 타면 404가 난다.
      if (id.indexOf("mine:") === 0) { await openMine(id.slice(5)); return; }
      var doc = await api.docboxRead(id);
      view.innerHTML = '<div class="md">' + renderMd(doc.markdown) + "</div>";
      view.scrollTop = 0;
      highlight(view, searchTerm);
      document.getElementById("status").textContent = doc.title + " · " + doc.markdown.length.toLocaleString() + "자";
    } catch (e) {
      // 본문 열기도 같은 막다른 길이 있다 — 세션이 풀렸으면 원인을 말하고 재시도를 준다.
      var m = String((e && e.message) || e);
      view.innerHTML = '<div class="empty">' +
        (/unauthorized|401/i.test(m)
          ? "로그인이 풀려 문서를 못 열었습니다.<br>본창에서 다시 로그인한 뒤 왼쪽 목록에서 다시 누르세요."
          : "문서를 열지 못했습니다 — " + esc(m)) + "</div>";
    }
  }

  async function load() {
    try {
      // 제품 문서와 개인 문서를 **함께** 부른다. 개인 것이 없어도 제품 문서는 보여야 하므로
      // 개인 쪽 실패는 삼킨다(둘을 한 덩어리로 묶으면 하나가 죽을 때 화면이 통째로 빈다).
      var r = await api.docboxList();
      var mine = { documents: [] };
      try { mine = await window.gijo.personalDocsList(); } catch (e) {}
      docs = (mine.documents || []).map(function (d) {
        return { id: "mine:" + d.id, title: d.title, group: "mine", mine: true,
                 ragOptIn: d.ragOptIn, updatedAt: d.updatedAt };
      }).concat(r.documents || []);
      renderToc(null);
      document.getElementById("status").textContent = "문서 " + docs.length + "건";
      if (docs.length) open(docs[0].id);
    } catch (e) {
      // ⚠ 막다른 길 금지(2026-08-07 사용자 신고 "문서함 문서열려?"): 세션이 풀리면(어제처럼
      //   서버 열쇠 교체·중복 로그인) 이 창은 별도 창이라 **로그인 화면으로 돌아가지 않는다.**
      //   재로그인해도 이미 열린 이 창은 영영 빈 채였다 — 원인과 다음 걸음, 다시 시도할 단추를 준다.
      var msg = String((e && e.message) || e);
      var 세션 = /unauthorized|401/i.test(msg);
      document.getElementById("toc").innerHTML =
        '<div style="color:var(--muted-2);font-size:12px;padding:8px;line-height:1.6">' +
        (세션
          ? "로그인이 풀려 목록을 못 불러왔습니다.<br>본창에서 다시 로그인한 뒤 아래를 누르세요."
          : "목록을 불러오지 못했습니다.") +
        '<br><button id="btnRetry" style="margin-top:8px;padding:4px 10px;cursor:pointer">다시 불러오기</button></div>';
      document.getElementById("btnRetry").addEventListener("click", load);
      document.getElementById("status").textContent = msg;
    }
  }

  // 창을 다시 볼 때(재로그인하고 돌아왔을 때) 목록이 비어 있으면 스스로 다시 불러온다 —
  // 단추를 못 찾는 사람도 창 클릭만으로 살아나게.
  window.addEventListener("focus", function () { if (!docs.length) load(); });

  // ── 검색 ────────────────────────────────────────────────────────────────
  var timer = null;
  document.getElementById("q").addEventListener("input", function (e) {
    clearTimeout(timer);
    var v = e.target.value.trim();
    timer = setTimeout(async function () {
      searchTerm = v;
      if (v.length < 2) { renderToc(null); document.getElementById("status").textContent = "문서 " + docs.length + "건"; return; }
      try {
        var r = await api.docboxSearch(v);
        var hits = {};
        (r.results || []).forEach(function (x) { hits[x.id] = x.hits; });
        renderToc(hits);
        var n = (r.results || []).length;
        document.getElementById("status").textContent =
          n ? '"' + v + '" — 문서 ' + n + "건에서 발견" : '"' + v + '" — 찾지 못했습니다';
        if (n) { await open(r.results[0].id); document.getElementById("status").textContent = '"' + v + '" — 문서 ' + n + "건에서 발견"; }
      } catch (e2) { /* 검색 실패는 조용히 — 목록은 그대로 */ }
    }, 250);
  });


  // ── 작성 모드 ─────────────────────────────────────────────────────────────
  // 시안 mockups/docbox 승인본. 창을 또 띄우지 않고 **오른쪽만** 바뀐다.
  // 전달은 파일 저장뿐이다(사용자 결정 2026-07-30) — 메일 발송 기능은 없다.
  var KINDS = [
    { id: "bug", label: "🐞 버그", tried: "무엇을 하려고 했는지 적어 주세요.", happened: "무슨 일이 일어났는지 적어 주세요. 화면을 캡처해 Ctrl+V로 붙여넣으면 좋습니다." },
    { id: "feature", label: "✨ 기능 요청", tried: "지금은 이 일을 어떻게 하고 계신가요?", happened: "어떤 기능이 있으면 좋겠는지, 그게 왜 필요한지 적어 주세요." },
    { id: "ui", label: "🎨 화면·사용성", tried: "어느 화면에서 무엇을 하려 하셨나요?", happened: "무엇이 불편했는지 적어 주세요. 캡처가 있으면 훨씬 빨리 고칩니다." },
    { id: "etc", label: "💬 기타", tried: "", happened: "" }
  ];
  var compose = null; // { kind, images: [dataUrl], clientVersion, platform }


  // 지금 입력란의 내용을 compose에 담아둔다 — 화면을 다시 그려도 글이 날아가지 않게.
  // 실측(2026-07-31): 미리보기 후 '계속 쓰기'를 누르면 본문이 '(적지 않음)'으로 비었다.
  // 담당자가 쓴 글을 날리는 것은 이 기능을 아무도 안 쓰게 만드는 가장 빠른 길이다.
  function stashDraft() {
    if (!compose) return;
    var t = document.getElementById("cTitle"), a = document.getElementById("cTried"), b = document.getElementById("cHappened");
    if (t) compose.title = t.value;
    if (a) compose.tried = a.value;
    if (b) compose.happened = b.value;
  }
  function restoreDraft() {
    var t = document.getElementById("cTitle"), a = document.getElementById("cTried"), b = document.getElementById("cHappened");
    if (t) t.value = compose.title || "";
    if (a) a.value = compose.tried || "";
    if (b) b.value = compose.happened || "";
  }


  // ── 개인 문서 ─────────────────────────────────────────────────────────
  // 담당자가 만든 것. **자기만 본다**(서버가 userId로 거른다 — 화면은 거르지 않는다).
  var mineEditing = null; // 지금 고치는 중인 개인 문서 id(새 문서면 "")

  async function openMine(id) {
    var view = document.getElementById("view");
    try {
      var d = await window.gijo.personalDocsRead(id);
      mineEditing = null;
      view.innerHTML =
        '<div class="mine-head"><h2>' + esc(d.title) + '</h2><span class="mine-tag">내 것</span>' +
        '<span class="mine-acts">' +
        '<button class="n" id="mEdit">✏ 고치기</button>' +
        '<button class="n" id="mRag">' + (d.ragOptIn ? "AI 참고 끄기" : "AI도 참고하게") + "</button>" +
        '<button class="n mdel" id="mDel">지우기</button></span></div>' +
        '<div class="mine-meta">' + new Date(d.updatedAt).toLocaleString("ko-KR") + " 고침 · 나만 볼 수 있습니다" +
        (d.ragOptIn ? ' · <b style="color:var(--amber)">AI가 이 문서를 답변 근거로 씁니다</b>' : "") + "</div>" +
        '<div class="md">' + renderMd(d.body) + "</div>";
      view.scrollTop = 0;
      document.getElementById("mEdit").addEventListener("click", function () { editMine(d); });
      document.getElementById("mDel").addEventListener("click", function () { askDeleteMine(d); });
      document.getElementById("mRag").addEventListener("click", function () { toggleRag(d); });
    } catch (e) {
      view.innerHTML = '<div class="empty">문서를 열지 못했습니다. ' + esc((e && e.message) || "") + "</div>";
    }
  }

  // AI 연결 — **켜면 개인용이 아니게 된다.** 그 사실을 켜기 전에 분명히 말한다.
  function toggleRag(d) {
    if (d.ragOptIn) { doRag(d, false); return; }
    var view = document.getElementById("view");
    var box = document.createElement("div");
    box.className = "warn";
    box.innerHTML =
      "<b>이 문서를 AI가 참고하게 할까요?</b><br>" +
      "내가 적은 절차로 답하게 되어 편해집니다. 다만 <b>더 이상 개인용이 아닙니다</b> — " +
      "다른 담당자가 물어도 이 내용이 근거로 나올 수 있습니다.<br>" +
      '<div class="acts" style="margin-top:9px"><button class="n" id="ragYes">그래도 켜기</button>' +
      '<button class="n" id="ragNo">취소</button></div>';
    view.insertBefore(box, view.firstChild);
    document.getElementById("ragYes").addEventListener("click", function () { doRag(d, true); });
    document.getElementById("ragNo").addEventListener("click", function () { box.remove(); });
  }
  async function doRag(d, on) {
    try { await window.gijo.personalDocsRag(d.id, on); } catch (e) {}
    await load();
    open("mine:" + d.id);
  }

  function askDeleteMine(d) {
    // 확인은 화면 안에서 묻는다 — Electron에서 window.confirm은 앱을 통째로 멈춘다.
    var view = document.getElementById("view");
    var box = document.createElement("div");
    box.className = "warn";
    box.innerHTML = "<b>이 문서를 지울까요?</b> 되돌릴 수 없습니다." +
      (d.ragOptIn ? "<br>AI 지식에서도 함께 지웁니다." : "") +
      '<div class="acts" style="margin-top:9px"><button class="n mdel" id="delYes">지우기</button>' +
      '<button class="n" id="delNo">취소</button></div>';
    view.insertBefore(box, view.firstChild);
    document.getElementById("delYes").addEventListener("click", async function () {
      try { await window.gijo.personalDocsDelete(d.id); } catch (e) {}
      await load();
    });
    document.getElementById("delNo").addEventListener("click", function () { box.remove(); });
  }

  function editMine(d) {
    mineEditing = d ? d.id : "";
    var view = document.getElementById("view");
    view.innerHTML =
      '<div class="mine-head"><h2>' + (d ? "문서 고치기" : "새 문서") + "</h2>" +
      '<span class="mine-acts"><button class="n" id="mCancel">취소</button>' +
      '<button class="n pri" id="mSave">저장</button></span></div>' +
      '<div class="warn"><b>⚠ 비밀번호·계정 정보는 넣지 마세요.</b><br>' +
      "저장할 때 자동으로 살펴보고 그런 것이 보이면 알려 드립니다. 장비 접속 정보가 필요하면 " +
      "<b>보안제품 등록부</b>에 두세요 — 거기는 암호화되어 보관됩니다.</div>" +
      '<div class="fld"><label>제목</label><input id="mTitle" maxlength="120" value="' + esc(d ? d.title : "") + '"></div>' +
      '<div class="fld"><label>내용</label><textarea id="mBody">' + esc(d ? d.body : "") + "</textarea>" +
      '<div class="tips">제목에 <code>###</code>, 목록에 <code>-</code> 를 쓰면 보기 좋게 정리됩니다.</div></div>';
    view.scrollTop = 0;
    document.getElementById("mCancel").addEventListener("click", function () {
      if (d) open("mine:" + d.id); else load();
    });
    document.getElementById("mSave").addEventListener("click", saveMine);
  }

  async function saveMine() {
    var title = document.getElementById("mTitle").value.trim();
    var body = document.getElementById("mBody").value;
    if (!title) { document.getElementById("mTitle").focus(); return; }
    var btn = document.getElementById("mSave");
    btn.disabled = true; btn.textContent = "저장 중…";
    try {
      var saved = mineEditing
        ? await window.gijo.personalDocsUpdate(mineEditing, { title: title, body: body })
        : await window.gijo.personalDocsCreate({ title: title, body: body });
      await load();
      await open("mine:" + saved.id);
      // 비밀번호로 보이는 것이 있으면 저장 뒤에 알린다(막지는 않는다 — 오탐도 있고,
      // 막으면 담당자는 포스트잇에 적는다).
      if (saved.warnings && saved.warnings.length) {
        var view = document.getElementById("view");
        var box = document.createElement("div");
        box.className = "warn";
        box.innerHTML = "<b>⚠ 비밀번호로 보이는 것이 " + saved.warnings.length + "곳 있습니다</b><br>" +
          saved.warnings.map(function (w) { return esc(w.kind) + " — " + esc(w.masked); }).join("<br>") +
          "<br>장비 접속 정보는 <b>보안제품 등록부</b>에 두세요.";
        view.insertBefore(box, view.firstChild);
      }
    } catch (e) {
      btn.disabled = false; btn.textContent = "저장";
      gijoTell("저장하지 못했습니다: " + ((e && e.message) || e));
    }
  }

  function openCompose() {
    compose = { kind: "bug", images: [], title: "", tried: "", happened: "" };
    renderCompose();
  }

  function renderCompose() {
    var k = KINDS.filter(function (x) { return x.id === compose.kind; })[0] || KINDS[0];
    var v = document.getElementById("view");
    v.innerHTML =
      '<div class="chips">' +
      KINDS.map(function (x) {
        return '<span class="chip' + (x.id === compose.kind ? " on" : "") + '" data-k="' + x.id + '">' + x.label + "</span>";
      }).join("") + "</div>" +
      '<div class="fld"><label>제목</label><input id="cTitle" placeholder="한 줄로 요약해 주세요 (예: 설정 화면에서 저장이 안 됨)"></div>' +
      '<div class="fld"><label>무엇을 하려 했나</label><textarea id="cTried" placeholder="' + esc(k.tried) + '"></textarea></div>' +
      '<div class="fld"><label>무슨 일이 일어났나 <span class="hint">— 화면을 캡처하고 Ctrl+V로 붙여넣으세요</span></label>' +
      '<textarea id="cHappened" placeholder="' + esc(k.happened) + '"></textarea>' +
      '<div class="shots" id="cShots"></div>' +
      '<div class="drop" id="cDrop">여기에 이미지를 끌어다 놓거나 <b>Ctrl + V</b>로 붙여넣기</div></div>' +
      '<div class="sec-title">자동으로 함께 담기는 정보 <span class="hint" style="font-weight:400">— 적지 않으셔도 됩니다</span></div>' +
      '<div class="auto" id="cAuto">확인 중…</div>' +
      '<div class="warnbox"><b>⚠ 파일로 저장하기 전에 확인하세요</b><br>' +
      '글에 섞인 비밀번호·API 키는 <b>자동으로 가립니다</b>.<br>' +
      '<b>그림 속 내용은 자동으로 가릴 수 없습니다.</b> 자산명·IP·담당자 이름이 찍혔는지 직접 확인해 주세요.</div>' +
      '<div class="acts"><button class="g" id="cSave">📄 파일로 저장</button>' +
      '<button class="n" id="cPreview">미리보기</button>' +
      '<button class="n" id="cCancel">취소</button>' +
      '<span class="sz" id="cSize"></span></div>';
    v.scrollTop = 0;

    v.querySelectorAll(".chip").forEach(function (c) {
      c.addEventListener("click", function () {
        // 유형을 바꿔도 적던 글은 지킨다 — 다시 쓰게 하면 아무도 안 쓴다
        stashDraft();
        compose.kind = c.getAttribute("data-k");
        renderCompose();
      });
    });
    document.getElementById("cCancel").addEventListener("click", function () {
      compose = null;
      document.removeEventListener("paste", onPaste);
      if (current) open(current); else load();
    });
    document.getElementById("cPreview").addEventListener("click", function () { doBuild(true); });
    document.getElementById("cSave").addEventListener("click", function () { doBuild(false); });

    // Ctrl+V / 드래그&드롭 — Base64로 바꿔 문서에 내장한다(폐쇄망이라 이미지 서버가 없다)
    var drop = document.getElementById("cDrop");
    document.removeEventListener("paste", onPaste);
    document.addEventListener("paste", onPaste);
    ["dragenter", "dragover"].forEach(function (e) {
      drop.addEventListener(e, function (ev) { ev.preventDefault(); drop.classList.add("over"); });
    });
    ["dragleave", "drop"].forEach(function (e) {
      drop.addEventListener(e, function (ev) { ev.preventDefault(); drop.classList.remove("over"); });
    });
    drop.addEventListener("drop", function (ev) {
      var files = (ev.dataTransfer && ev.dataTransfer.files) || [];
      for (var i = 0; i < files.length; i++) addImage(files[i]);
    });
    restoreDraft();   // 화면을 다시 그린 뒤 쓰던 글을 되살린다
    renderShots();
    fillAuto();
  }

  function onPaste(e) {
    if (!compose) { document.removeEventListener("paste", onPaste); return; }
    var items = (e.clipboardData || window.clipboardData).items || [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].type.indexOf("image") !== -1) { addImage(items[i].getAsFile()); e.preventDefault(); break; }
    }
  }

  function addImage(file) {
    if (!file || !/^image\//.test(file.type)) return;
    if (compose.images.length >= 10) {
      document.getElementById("status").textContent = "이미지는 10장까지 담을 수 있습니다.";
      return;
    }
    var r = new FileReader();
    r.onload = function (ev) { compose.images.push(ev.target.result); renderShots(); };
    r.readAsDataURL(file);
  }

  function renderShots() {
    var box = document.getElementById("cShots");
    if (!box) return;
    // 썸네일로 보여준다 — 본문에 거대한 Base64가 그대로 보이면 담당자가 놀란다
    box.innerHTML = compose.images.map(function (src, i) {
      return '<div class="shot"><img src="' + src + '"><span class="x" data-i="' + i + '">✕</span></div>';
    }).join("");
    box.querySelectorAll(".x").forEach(function (x) {
      x.addEventListener("click", function () {
        compose.images.splice(Number(x.getAttribute("data-i")), 1);
        renderShots();
      });
    });
  }

  async function fillAuto() {
    var el = document.getElementById("cAuto");
    try {
      var info = await api.getAppInfo();
      compose.clientVersion = info.version;
      compose.platform = info.platform + " " + info.osRelease + " / Electron " + info.electron;
      el.innerHTML =
        "<b>클라 버전</b> " + esc(info.version) + " &nbsp;·&nbsp; <b>환경</b> " + esc(compose.platform) + "<br>" +
        "<b>보낸 사람</b>·<b>서버 커밋</b>·<b>발생 시각</b>·<b>최근 오류</b>·<b>자가 진단</b>은 저장할 때 함께 담깁니다.";
    } catch (e) {
      el.textContent = "환경 정보를 확인하지 못했습니다 — 저장은 됩니다.";
    }
  }

  async function doBuild(previewOnly) {
    stashDraft();
    var title = (document.getElementById("cTitle").value || "").trim();
    if (!title) {
      document.getElementById("status").textContent = "제목을 적어 주세요.";
      document.getElementById("cTitle").focus();
      return;
    }
    var btn = document.getElementById(previewOnly ? "cPreview" : "cSave");
    if (btn) btn.disabled = true;
    try {
      var r = await api.docRequestBuild({
        kind: compose.kind,
        title: title,
        tried: document.getElementById("cTried").value || "",
        happened: document.getElementById("cHappened").value || "",
        images: compose.images,
        screen: "문서함",
        clientVersion: compose.clientVersion,
        platform: compose.platform
      });
      var sizeText = (r.sizeBytes > 1048576 ? (r.sizeBytes / 1048576).toFixed(1) + "MB" : Math.round(r.sizeBytes / 1024) + "KB") + " · " + r.fileName;

      if (previewOnly) {
        // 미리보기는 **읽기와 같은 렌더러**로 — 저장될 모습 그대로 본다
        var v = document.getElementById("view");
        v.innerHTML =
          '<div class="warnbox"><b>미리보기</b> — 아래가 파일에 담길 내용입니다. ' + esc(sizeText) +
          (r.maskedCount ? ' <span class="mask">가려짐 ' + r.maskedCount + "곳</span>" : "") +
          '<br><button class="n" id="cBack" style="margin-top:8px">← 계속 쓰기</button></div>' +
          '<div class="md">' + renderMd(r.markdown) + "</div>";
        v.scrollTop = 0;
        document.getElementById("cBack").addEventListener("click", function () {
          renderCompose();   // stashDraft로 담아둔 제목·본문·이미지가 그대로 되살아난다
        });
        document.getElementById("status").textContent = "미리보기 — 아직 저장하지 않았습니다.";
        return;
      }

      // 파일로 저장 — 담당자 PC에 떨어지고 여기서 끝난다. 밖으로 낼지는 담당자가 정한다.
      var blob = new Blob([r.markdown], { type: "text/markdown;charset=utf-8" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = r.fileName;
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      document.getElementById("status").textContent =
        "저장했습니다 — " + r.fileName + (r.maskedCount ? " (자격증명 " + r.maskedCount + "곳 가림)" : "") + ". 이 파일을 개발팀에 전달해 주세요.";
      compose = null;
      document.removeEventListener("paste", onPaste);
      if (current) open(current);
    } catch (e) {
      document.getElementById("status").textContent = "만들지 못했습니다: " + ((e && e.message) || e);
    } finally {
      if (btn) btn.disabled = false;
    }
  }

  load();
})();
</script>
<script src="footbar.js"></script>
</body>
</html>
