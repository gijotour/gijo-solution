<title>GIJO AS — AI 팀 감독</title>
<!--
  AI 팀 감독(2026-08-20 사장님 승인 ② — 「에이전트 감독도 필요할 것 같은데」).
  승인 시안: mockups/agent-supervision/시안.html — 카드(대화창 요약)+이 무대 화면(상세) 2단.
  ■ 숫자 원천은 llm_activity_daily 하나다(도입일 2026-08-20부터 축적 — 그 전 기간은 0/"-"가
    정직). chat_logs로 세지 않는다: 학습 자동수집 스위치를 끄면 전 팀원이 거짓 0이 된다(검토관 중7).
  ■ 화면에 입력칸 없음(지시는 대화창) — 조작은 기간 전환과 행 선택(📌)뿐.
  ■ ✂ 사유 줄은 「못 뗌」·「통째교체」가 있으면 **저절로 펼쳐진다**(2026-09-06 사장님 승인 N5).
    fold.js 계약 「위험 신호는 접어서 가리지 않는다」의 같은 적용이다 — 통째교체는 답이 통째로
    안내로 바뀐 센 사건이라, 접어 두면 그 일이 있었다는 사실이 토글 뒤로 사라진다.
    ⚠ 두 값을 **배지 N에서 빼는 규약은 그대로다** — 「펼치는 조건」과 「세는 것」은 별개다.
  ■ 폴백(모델 미배정) 경고는 두지 않는다 — 기본 설계가 기반 두뇌 1개+전문성(2026-08-08)이라
    미배정=기본 두뇌 사용이 정상이다(배정 UI는 남아 있으나 예외 경로 — 경고 대상이 아니다).
-->
<style>
:root{
  --bg:#262624;--panel:#30302e;--panel-2:#1f1e1d;--border:rgba(255,255,255,0.08);
  --border-strong:rgba(255,255,255,0.16);--blue:#3b82f6;--blue-light:#5fa1ff;--white:#ffffff;
  --text:#e9e7e2;--muted:#b3ada4;--muted-2:#a49d95;--red:#e2483d;--amber:#f0a020;--teal:#1eb980;--purple:#8b7cf0;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Pretendard","Malgun Gothic","Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:13px;}
.main{padding:20px 24px 40px;max-width:1180px;margin:0 auto;}
.head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:14px;}
.page-title{font-size:19px;font-weight:800;color:var(--text-strong, #fff);}
.page-sub{font-size:12.5px;color:var(--muted);margin-top:4px;}
.range{display:flex;gap:6px;}
.range button{background:var(--panel-2);border:1px solid var(--border-strong);color:var(--muted);
  padding:6px 14px;border-radius:18px;font-size:12.25px;font-weight:700;cursor:pointer;font-family:inherit;}
.range button.on{background:rgba(59,130,246,.15);border-color:var(--blue);color:var(--blue-light);}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;}
.kpi b{display:block;font-size:19px;font-weight:800;color:var(--text-strong, #fff);margin-top:4px;}
.kpi span{font-size:12.25px;color:var(--muted);font-weight:600;}
.kpi b.warn{color:var(--amber);} .kpi b.bad{color:var(--red);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px;margin-bottom:16px;}
.ag{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;cursor:pointer;}
.ag:hover{border-color:var(--border-strong);} .ag.on{border-color:var(--blue);}
.ag-h{display:flex;align-items:baseline;gap:8px;margin-bottom:2px;}
.ag-abbr{font-size:11.75px;font-weight:800;color:var(--blue-light);}
.ag-name{font-size:14px;font-weight:800;color:var(--text-strong, #fff);}
.ag-role{font-size:12px;color:var(--muted-2);margin-left:auto;}
.ag-nums{display:flex;gap:14px;margin:8px 0 6px;font-size:12.5px;color:var(--muted);}
.ag-nums b{color:var(--text);font-weight:700;}
.ag-nums .err b{color:var(--red);}
.bars{display:flex;align-items:flex-end;gap:3px;height:34px;margin-top:4px;}
.bars i{flex:1 1 auto;background:rgba(95,161,255,.45);border-radius:2px 2px 0 0;min-height:2px;}
.bars i.zero{background:rgba(255,255,255,.08);}
.ag-err{font-size:11.75px;color:var(--muted-2);margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ag-err.has{color:var(--amber);}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
.panel h2{font-size:14px;font-weight:800;color:var(--text-strong, #fff);margin-bottom:10px;}
.sup-line{display:flex;gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--border);font-size:12.75px;}
.sup-line:last-child{border-bottom:0;}
.sup-line .tag{flex:0 0 auto;font-size:11.75px;font-weight:800;padding:1px 8px;border-radius:10px;}
.tag.idle{background:rgba(255,255,255,.08);color:var(--muted);}
.tag.err{background:rgba(226,72,61,.16);color:var(--red-ink, #f5928a);}
.tag.ok{background:rgba(30,185,128,.14);color:var(--teal);}
/* ✂ 인용 제거(2026-09-05) — 기존 tag 3종과 같은 꼴, 잉크 폴백은 .tag.err 관례 그대로 */
.tag.cite{background:rgba(139,124,240,.18);color:var(--purple-ink, #b6a9ff);}
/* ✂ 사유 토글(2026-09-06 · 승인 시안 mockups/cite-reasons). 새 색 토큰 없음 — .tag.cite의
   --purple-ink를 그대로 쓴다. 접힘 상태 줄 높이 증가 +0px(시안 ⑦ 실측 31.0 → 31.0px):
   글자 크기·줄 간격이 기존 한 줄 안에 들어가고, 늘어난 것은 「(뗀 건수는 팀 활동 기록에)」를
   토글로 **바꾼 것**뿐이다. 펼치면 .cite-reasons 한 줄(16px + margin 3px = 19px)이 는다. */
.sup-line .cite-why{background:transparent;border:0;padding:0 0 0 9px;margin:0;font:inherit;font-size:11.75px;
  font-weight:700;color:var(--purple-ink, #b6a9ff);cursor:pointer;text-decoration:underline dotted;text-underline-offset:2px;}
.sup-line .cite-reasons{margin-top:3px;font-size:12px;color:var(--muted-2);}
.sup-line .cite-reasons b{color:var(--text);font-weight:700;}
.sup-line .dim{color:var(--muted-2);}
.note{font-size:11.75px;color:var(--muted-2);margin-top:10px;}
</style>

<body class="g-ui">
<div class="main">
  <div class="head">
    <div>
      <div class="page-title">AI 팀 감독 · 안전</div>
      <div class="page-sub">누가 얼마나 일하고 어디서 막히는지, 그리고 안전장치가 잘 서 있는지 — 숫자는 전부 실측 기록입니다. 지시는 대화창에서 합니다.</div>
    </div>
    <div class="range" id="range">
      <button data-d="1" class="on">오늘</button>
      <button data-d="7">7일</button>
      <button data-d="30">30일</button>
    </div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="grid" id="grid"></div>
  <div class="panel">
    <h2>감독 관점 — 규칙 계산(AI 문장 아님)</h2>
    <div id="sup"></div>
    <div class="note">응답 시간·오류는 2026-08-20(감독 도입일)부터 쌓입니다 — 그 전 기간은 "-"로 보입니다. 최근 오류 문구는 서버가 켜진 뒤의 것만 보입니다(개수는 영속 집계).</div>
  </div>
  <!-- 🛡 안전장치(2026-08-20 사장님 「AI팀 메뉴에 안전장치 통합」 — 승인 시안 aiteam-guard-merge).
       여기는 **읽기 전용 요약**이다 — 레드팀 실행·가드레일 모드 변경은 안전장치 화면 몫(바로가기).
       hub=1: 리다이렉트 우회(안 붙이면 redteam.html이 허브로 되돌아 영영 못 간다 — inventory 전례). -->
  <div class="panel">
    <h2>🛡 안전장치 — 지금 상태(읽기 전용)</h2>
    <div id="safety"><div class="note">불러오는 중…</div></div>
    <div class="note">레드팀 <b>실행</b>·가드레일 모드 <b>변경</b>은
      <button class="go" id="goRedteam" style="background:transparent;border:1px solid var(--border-strong);color:var(--muted);border-radius:7px;padding:3px 9px;font-size:11.75px;font-weight:700;cursor:pointer;font-family:inherit">🗔 안전장치 실행 화면</button>
      에서 합니다 — 쓰기 지시는 항상 결재판을 거칩니다.</div>
  </div>
</div>
<script>
(function () {
  "use strict";
  var days = 1;
  var 선택행 = null;

  function esc(s) { var d = document.createElement("i"); d.textContent = String(s == null ? "" : s); return d.innerHTML; }

  /* ✂ 사유 줄 계산 — **순수 함수**다(짝 시험 server/test/citereasons.test.ts가 이 소스를
     그대로 떼어 잰다. 시험에 셈을 베껴 적으면 제품과 시험이 따로 늙는다).
     ⚠ 「못 뗌」은 뗀 것이 아니라 **못 뗀 자리**라 배지 N에서 뺀다 — 없던 제거를 있다고 세면
       감독 숫자가 거짓이 된다(승인 시안 ⑧③).
     ⚠ 「통째교체」도 뺀다(2026-09-06 검토관) — 그 답의 인용은 이미 위 사유들로 세었고
       통째교체는 **그 결과**다. 더하면 인용 하나짜리 답이 「사유 2건」으로 보인다.
     ⚠ 0인 사유는 버린다 — 「겹침없음 0」 여덟 줄은 정보가 아니라 소음이다.
     ⚠ 같은 사유가 (날짜 × 팀원)으로 여러 줄 오므로 **반드시 합산**한다(7·30일에서 갈린다). */
  /* ⚠ 이름 상수는 **함수 안에** 둔다 — 짝 시험이 이 함수만 통째로 떼어 돌리므로, 밖에 두면
     시험이 ReferenceError로 죽거나(다행) 딴 값을 보고 헛돈다(불행). 자체완결로 유지한다. */
  function 사유줄계산(rows) {
    var 못뗌이름 = "못 뗌";
    var 통째이름 = "통째교체";
    /* 경로 가드(metaleak)가 붙이는 두 이름 — 서버 llm.ts 가드사유()가 정하는 글자와 같아야 한다.
       인용을 뗀 것이 **아니라서** 앞 문장을 가를 때 쓴다. ⚠ .js와 .ts라 상수를 함께 못 쓰므로
       짝 시험이 글자로 대조한다(실적수치제외_RE와 같은 방식). */
    var 경로이름들 = ["내부 경로", "내부 메타"];
    /* 「사유 N건」의 N에 **안 들어가는** 이름 — 뗀 자리의 수가 아니라 그 답에 일어난 일이다. */
    var 배지제외 = [통째이름, 못뗌이름];
    var 합 = {};
    (rows || []).forEach(function (r) {
      if (!r || !r.reason) return;
      합[r.reason] = (합[r.reason] || 0) + (Number(r.count) || 0);
    });
    // 차례: 뗀 사유들(큰 순) → 통째교체 → 못 뗌. 안 세는 둘은 **늘 맨 뒤**다
    // (시안 ② hot 판의 차례 그대로 — 뗀 사유들 다음에 결과와 ⚠가 온다).
    var 뒷자리 = function (k) { var i = 배지제외.indexOf(k); return i < 0 ? 0 : i + 1; };
    var 항목 = Object.keys(합).filter(function (k) { return 합[k] > 0; })
      .sort(function (x, y) {
        if (뒷자리(x) !== 뒷자리(y)) return 뒷자리(x) - 뒷자리(y);
        return 합[y] - 합[x] || (x < y ? -1 : 1);
      })
      // 「못 뗌」인지·「안 세는 것」인지를 **여기서 한 번** 표시한다 — 그리는 쪽에도 적으면 두 곳이 된다.
      .map(function (k) {
        return { reason: k, count: 합[k], 못뗌: k === 못뗌이름, 안셈: 배지제외.indexOf(k) >= 0 };
      });
    var 값 = function (k) { return 합[k] > 0 ? 합[k] : 0; };
    var 배지 = 항목.reduce(function (s, it) { return s + (it.안셈 ? 0 : it.count); }, 0);
    var 경로 = 경로이름들.reduce(function (s, k) { return s + 값(k); }, 0);
    // 인용 = 배지에서 경로 몫을 뺀 것 — 「근거 없는 인용을 뗐다」고 말해도 되는 유일한 근거다.
    return { 항목: 항목, 배지: 배지, 못뗌: 값(못뗌이름), 통째: 값(통째이름), 경로: 경로, 인용: 배지 - 경로 };
  }

  /* 사유가 **비어 있는 날**의 수 — 「답은 있는데 사유가 없는 날」을 데이터로 센다(순수 함수).
     ⚠ 날짜 상수(2026-09-06)로 재지 않는다: 달력이 지나면 판정이 저절로 뒤집혀, 섞인 기간을
       말하던 안내가 어느 날 소리 없이 사라진다. 데이터로 세면 그런 일이 없다.
     왜 필요한가: 도입일이 낀 7·30일 보기에서 「답 M개」는 기간 전체를, 「사유 N건」은 도입 뒤
     며칠만 센다. 그 사실을 안 적으면 사람이 M−N을 「사유 없는 제거」로 읽는다(시안 ⑩). */
  function 사유빈날(daily, rows) {
    var 있는날 = {};
    (rows || []).forEach(function (r) { if (r && r.day) 있는날[r.day] = 1; });
    var 빈날 = {};
    (daily || []).forEach(function (d) {
      if (!d || d.kind !== "cite" || !(d.calls > 0) || 있는날[d.day]) return;
      빈날[d.day] = 1;
    });
    return Object.keys(빈날).length;
  }

  /* ✂ 줄의 **앞 문장** — 그 기간에 실제로 일어난 일만 말한다(2026-09-06 검토관 count 3건).
     ⚠ 「근거 없는 인용을 뗐습니다」를 조건 없이 적으면 거짓이 된다:
       · 못 뗌만 있는 기간 = 아무것도 안 뗐다(답이 통째로 내부 메타라 원문을 그대로 내보냈다).
       · 경로 가드만 운 답 = 인용이 아니라 내부 메타 줄을 뗐다.
       · 통째교체와 못 뗌이 **같이** 있는 기간 = 어떤 답은 바뀌었고 어떤 답은 그대로다 — 둘 다 말한다
         (한쪽만 고르면 나머지 답을 거짓으로 말하게 된다 · 2026-09-06 검토관 contract).
     ⚠ 사유가 통째로 없는 옛 기간은 종전 문장 그대로다 — 그때는 인용 가드밖에 없었다. */
  function 인용문장(뗀답, 사유) {
    var 인용뗌 = "답 " + 뗀답 + "개에서 근거 없는 인용을 뗐습니다";
    if (!사유 || !사유.항목.length) return 인용뗌;
    if (사유.인용 > 0) return 인용뗌;
    if (사유.경로 > 0) return "답 " + 뗀답 + "개에서 내부 메타 줄을 뗐습니다(인용 제거는 0건)";
    // ⚠ 「통째교체」와 「못 뗌」이 한 기간에 같이 있으면 **서로 다른 답**에 다른 일이 난 것이다 —
    //   한쪽만 골라 단정하면 나머지 답을 거짓으로 말한다(2026-09-06 검토관 contract: 앞 문장
    //   「바꿨습니다」와 펼친 꼬리 「그대로 뒀습니다」가 한 줄 안에서 서로를 부정했다).
    //   둘은 서로 다른 가드에서 온다(통째교체=citeguard, 못 뗌=metaleak 보류)라 7·30일에서 겹친다.
    if (사유.통째 > 0 && 사유.못뗌 > 0) return "답 " + 뗀답 + "개는 근거가 없어 통째로 안내로 바꾸거나 원문을 그대로 뒀습니다";
    if (사유.통째 > 0) return "답 " + 뗀답 + "개는 근거가 없어 통째로 안내로 바꿨습니다";
    return "답 " + 뗀답 + "개는 통째로 내부 메타라 원문을 그대로 뒀습니다";
  }

  /* 펼침 기억은 **그 PC에만** — fold.js의 gijo:fold: 이름 공간은 쓰지 않는다(그 부품이 관리하는
     구역이 아닌데 끼면 나중에 fold.js가 있지도 않은 구역을 찾는다). 사생활 모드·저장 차단에서
     던지므로 읽기·쓰기 모두 try/catch로 감싼다. */
  var 펼침키 = "gijo:cite-reasons-open";
  function 펼침읽기() { try { return localStorage.getItem(펼침키) === "1"; } catch (e) { return false; } }
  function 펼침쓰기(on) { try { localStorage.setItem(펼침키, on ? "1" : "0"); } catch (e) { /* 저장 차단 */ } }

  function 알림(라벨, 글) {
    if (!window.gijoSelectNotify) return; // 부품 미로드면 조용히 없던 일로
    window.gijoSelectNotify({ label: String(라벨).slice(0, 40), text: 글 });
  }

  async function load() {
    if (!window.gijo || !window.gijo.listAgents || !window.gijo.aiteamSupervision) return;
    var agents, sup;
    try {
      agents = (await window.gijo.listAgents()) || [];
      sup = await window.gijo.aiteamSupervision(days);
    } catch (e) {
      document.getElementById("kpis").innerHTML = '<div class="kpi"><span>불러오기 실패</span><b>' + esc((e && e.message) || "오류") + "</b></div>";
      return;
    }
    var calls = sup.calls || {};
    var daily = (sup.daily || []).filter(function (d) { return d.kind === "chat"; });
    var recentErrors = sup.recentErrors || {};

    // ✂ 인용 검증(2026-09-05) — 원천은 위와 **같은** llm_activity_daily(kind=cite). 새 API·새 계수기 없음.
    // ⚠ daily 행은 (날짜 × 에이전트)라 7·30일에서는 같은 팀원이 여러 줄로 온다 — 반드시 **합산**한다.
    //   위 daily가 chat만 남기고 버리므로 **원본 sup.daily를 다시 훑는다**(거른 것을 다시 안 쓴다).
    // ⚠ calls는 「뗀 **답**의 수」다 — 답 하나에 이벤트 하나만 실린다(llm.ts). 「건수」라 쓰면 거짓이다.
    //   **건수와 사유는 이 화면에도 있다**(2026-09-06 · 아래 ✂ 줄의 「사유 N건 ▸」) — 원천이 다르다:
    //   답 개수는 llm_activity_daily(kind=cite), 사유 건수는 cite_reason_daily다. 더하지도 나누지도
    //   못하는 **다른 잣대**라 화면이 그 사실을 스스로 말한다. 실시간 한 줄은 종전대로 「팀 활동 —
    //   실동작 기록」의 ✂ detail이다(그건 답 하나짜리, 이건 기간 합계).
    var 뗀답 = 0, 인용별 = {};
    (sup.daily || []).forEach(function (d) {
      if (d.kind !== "cite") return;
      뗀답 += d.calls || 0;
      인용별[d.agent] = (인용별[d.agent] || 0) + (d.calls || 0);
    });

    // 에이전트별 합산(기간 전체) — 평균 응답 = latency 합 / 건수.
    var byAgent = {};
    daily.forEach(function (d) {
      var a = byAgent[d.agent] || (byAgent[d.agent] = { calls: 0, errors: 0, lat: 0, byDay: {} });
      a.calls += d.calls; a.errors += d.errors; a.lat += d.latencyMsSum;
      a.byDay[d.day] = (a.byDay[d.day] || 0) + d.calls;
    });

    var 총호출 = agents.reduce(function (s, a) { return s + (calls[a.id] || 0); }, 0);
    var 총오류 = agents.reduce(function (s, a) { return s + ((byAgent[a.id] || {}).errors || 0); }, 0);
    var 무호출 = agents.filter(function (a) { return !(calls[a.id] > 0); });
    var 응답있는 = agents.map(function (a) { return byAgent[a.id]; }).filter(function (x) { return x && x.calls > 0; });
    var 평균응답 = 응답있는.length
      ? (응답있는.reduce(function (s, x) { return s + x.lat / x.calls; }, 0) / 응답있는.length / 1000).toFixed(1) + "s" : "-";

    document.getElementById("kpis").innerHTML =
      '<div class="kpi"><span>호출(' + (days === 1 ? "오늘" : days + "일") + ')</span><b>' + 총호출 + "</b></div>" +
      '<div class="kpi"><span>평균 응답</span><b>' + esc(평균응답) + "</b></div>" +
      '<div class="kpi"><span>오류</span><b class="' + (총오류 ? "warn" : "") + '">' + 총오류 + "</b></div>" +
      '<div class="kpi"><span>무호출 팀원</span><b>' + 무호출.length + "</b></div>";

    // 일별 미니 막대 — 최근 N일 축(빈 날은 0). 최대값 기준 상대 높이(실측 상대 비교용).
    // ⚠ 로컬(KST) 달력으로 — toISOString은 UTC라 0~9시에 「오늘」이 어제가 된다(검토관 중6).
    var 날들 = [];
    for (var i = days - 1; i >= 0; i--) {
      var t = new Date(Date.now() - i * 86400000);
      날들.push(new Date(t.getTime() - t.getTimezoneOffset() * 60000).toISOString().slice(0, 10));
    }

    document.getElementById("grid").innerHTML = agents.map(function (a) {
      var m = byAgent[a.id] || { calls: 0, errors: 0, lat: 0, byDay: {} };
      var 평균 = m.calls ? (m.lat / m.calls / 1000).toFixed(1) + "s" : "-";
      var vals = 날들.map(function (d) { return m.byDay[d] || 0; });
      var max = Math.max.apply(null, vals.concat([1]));
      var bars = days === 1 ? "" :
        '<div class="bars">' + vals.map(function (v) {
          return '<i class="' + (v ? "" : "zero") + '" style="height:' + Math.max(6, Math.round(v / max * 100)) + '%" title="' + v + '건"></i>';
        }).join("") + "</div>";
      var err = recentErrors[a.id];
      return '<div class="ag" data-id="' + esc(a.id) + '" data-name="' + esc(a.name) + '">' +
        '<div class="ag-h"><span class="ag-abbr">[' + esc(a.abbr || "-") + ']</span><span class="ag-name">' + esc(a.name) + '</span>' +
        '<span class="ag-role">' + esc(a.role || "") + "</span></div>" +
        '<div class="ag-nums"><span>호출 <b>' + (calls[a.id] || 0) + "</b></span><span>평균 <b>" + esc(평균) + "</b></span>" +
        '<span class="err">오류 <b>' + m.errors + "</b></span></div>" + bars +
        '<div class="ag-err' + (err ? " has" : "") + '">' + (err ? "⚠ " + esc(err.detail) : "최근 오류 없음") + "</div></div>";
    }).join("");

    // 감독 관점 — 전부 규칙 계산이다(무호출·오류율 상위). LLM이 쓰는 문장이 아니다.
    var lines = [];
    if (무호출.length) lines.push('<div class="sup-line"><span class="tag idle">무호출</span><span>' +
      무호출.map(function (a) { return esc(a.name); }).join(" · ") + " — 이 기간 대화 호출이 없었습니다(구성 재검토 후보)</span></div>");
    var 오류상위 = agents.map(function (a) { var m = byAgent[a.id]; return { a: a, e: (m && m.errors) || 0, c: (m && m.calls) || 0 }; })
      .filter(function (x) { return x.e > 0; }).sort(function (x, y) { return y.e - x.e; }).slice(0, 3);
    if (오류상위.length) lines.push('<div class="sup-line"><span class="tag err">오류 상위</span><span>' +
      오류상위.map(function (x) { return esc(x.a.name) + " " + x.e + "건" + (x.c ? "(" + Math.round(x.e / (x.e + x.c) * 100) + "%)" : ""); }).join(" · ") + "</span></div>");
    // ★ 「정상」 판정은 **무호출·오류만** 본다 — 아래 ✂ 줄은 늘 서므로 lines.length로 재면
    //   「정상」이 영영 안 뜬다(시안이 미리 짚은 자리).
    if (!무호출.length && !오류상위.length) lines.push('<div class="sup-line"><span class="tag ok">정상</span><span>이 기간 무호출·오류 특이사항이 없습니다.</span></div>');
    // ✂ 줄은 **0일 때도 숨기지 않는다.** 숨기면 「가드가 안 도는 것」과 「뗄 것이 없었던 것」이
    //   화면에서 똑같아 보인다 — 이 저장소의 「장애 ≠ 부재」가 그대로 재발하는 자리다.
    var 누가 = Object.keys(인용별).sort(function (x, y) { return 인용별[y] - 인용별[x]; }).slice(0, 3)
      .map(function (id) {
        var a = agents.filter(function (x) { return x.id === id; })[0];
        return esc((a && a.name) || (id === "-" ? "미지정" : id)) + " " + 인용별[id];
      }).join(" · ");
    // ✂ 사유(2026-09-06 · 승인 시안 mockups/cite-reasons) — 원천은 **같은 API의 새 칸**
    //   citeReasons(cite_reason_daily). 위 뗀답(답 개수)과 **다른 잣대**라 더하지도 나누지도
    //   않는다 — 그 사실을 화면이 스스로 말한다(사람이 추측하게 두지 않는다).
    // ⚠ 「못 뗌」·「통째교체」가 있으면 **자동으로 펼친다**(fold.js 계약: 위험 신호는 접어서
    //   가리지 않는다). 통째교체 = 답이 통째로 안내로 바뀐 **센 사건**이라 못 뗌과 같은 규칙으로
    //   편다(2026-09-06 사장님 승인 N5 — 승인 시안 mockups/cite-reasons의 못 뗌 자동 펼침과
    //   같은 패턴이라 새 요소·새 색은 만들지 않는다. 있는 흐린 표시 그대로다).
    // ⚠ 펼치는 조건이 **세는 규약을 안 건드린다** — 통째교체·못 뗌은 배지 N에서 여전히 뺀다
    //   (위 사유줄계산의 배지제외). 짝 시험: server/test/supervisioncite.test.ts ⓔ①~⑤.
    var 사유 = 사유줄계산(sup.citeReasons);
    var 빈날 = 사유빈날(sup.daily, sup.citeReasons);
    var 사유줄 = "";
    if (뗀답 && 사유.항목.length) {
      var 펼침 = 사유.못뗌 > 0 || 사유.통째 > 0 || 펼침읽기();
      var 목록 = 사유.항목.map(function (it) {
        // ⚠ 색으로 갈래를 말한다 — 못 뗌은 ⚠(amber), 안 세는 것(통째교체)은 흐리게.
        var 색 = it.못뗌 ? "var(--amber)" : it.안셈 ? "var(--muted-2)" : "";
        return "<b" + (색 ? ' style="color:' + 색 + '"' : "") + ">" + esc(it.reason) + " " + it.count + "</b>";
      }).join(" · ");
      // 꼬리는 **라벨을 이름으로 불러** 설명한다 — 「— 답이 …그대로 뒀습니다」처럼 주어 없이 적으면
      //   앞 문장이 「뗐습니다」·「바꿨습니다」인 기간에서 그 줄이 **기간 전체를 부정하는 말**로 읽힌다
      //   (2026-09-06 검토관 contract — 못 뗌+통째교체, 못 뗌+인용 두 조합에서 실제로 그랬다).
      // ⚠ 「뗀 건수입니다」는 배지가 **실제로 건수를 셀 때만** 맞는 말이다 — 배지가 0이라
      //   「통째교체 N건」·「⚠ 못 뗌 N건」으로 바뀐 기간에 그대로 적으면 또 딴말이 된다.
      var 꼬리조각 = [];
      if (사유.못뗌 > 0) 꼬리조각.push("「못 뗌」은 답이 통째로 내부 메타라 원문을 그대로 둔 경우입니다");
      else if (사유.배지 > 0) 꼬리조각.push("뗀 「건수」입니다(위 답 개수와 다릅니다)");
      if (사유.통째 > 0) 꼬리조각.push("「통째교체」는 그 답을 안내로 바꾼 결과라 건수에 안 넣습니다");
      if (빈날 > 0) 꼬리조각.push("이 기간 중 " + 빈날 + "일은 사유를 안 남기던 때(2026-09-06 이전)입니다");
      var 꼬리 = 꼬리조각.length ? "— " + 꼬리조각.join(" · ") : "";
      // 배지 글자 — 뗀 것이 하나도 없으면 「사유 0건」이라 적지 않는다. 그렇게 적으면 바로 아래
      //   「못 뗌 1」·「통째교체 1」과 한 줄 안에서 서로를 부정한다(검토관 2026-09-06 · 통째교체는
      //   못 뗌에서 이미 고친 것과 **같은 모양을 되풀이한** 자리다).
      // ⚠ 배지 **N의 셈**은 안 건드린다 — 둘 다 여전히 배지제외다. 여기서 바꾸는 것은 N이 0일 때
      //   무엇이 있었는지 말하는 **글자**뿐이다(펼침 조건과 마찬가지로 「세는 것」과는 별개의 규약).
      var 배지글 = 사유.배지 > 0 ? "사유 " + 사유.배지 + "건"
        : 사유.못뗌 > 0 ? "⚠ 못 뗌 " + 사유.못뗌 + "건"
        : 사유.통째 > 0 ? "통째교체 " + 사유.통째 + "건"
        : "사유 0건";
      사유줄 = '<button class="cite-why" aria-expanded="' + (펼침 ? "true" : "false") + '">' +
        배지글 + " " + (펼침 ? "▾" : "▸") + "</button>" +
        // 섞인 기간은 **접힌 채로도** 보여야 한다 — 두 숫자가 다른 날들을 센다는 사실을
        //   토글 뒤에 숨기면 사람은 M−N을 「사유 없는 제거」로 읽는다(시안 ⑩ · 검토관 promise).
        (빈날 > 0 ? ' <span class="dim">· 이 중 ' + 빈날 + "일은 사유 기록 전</span>" : "") +
        '<div class="cite-reasons"' + (펼침 ? "" : ' style="display:none"') + ">" + 목록 +
        ' <span class="dim">' + 꼬리 + "</span></div>";
    } else if (뗀답) {
      // 답은 있는데 사유가 하나도 없는 기간 = 이 기능을 붙이기 **전**이다. 빈칸을 침묵으로 두지 않는다.
      사유줄 = ' <span class="dim">(사유 기록은 2026-09-06부터 쌓입니다)</span>';
    }
    lines.push('<div class="sup-line"><span class="tag cite">✂ 인용 제거</span><span>' +
      (뗀답
        ? 인용문장(뗀답, 사유) + " — " + 누가 + 사유줄
        : "0개 — 이 기간에 뗀 인용이 없습니다") + "</span></div>");
    document.getElementById("sup").innerHTML = lines.join("");

    // 사유 토글 — 이 줄 하나의 상세만 여닫는다(구역 접기가 아니다. fold.js를 안 쓰는 이유는
    //   시안 ②의 경고 상자에 적혀 있다: 32px 헤더가 더 생겨 밀도가 오히려 나빠진다).
    var 왜버튼 = document.querySelector("#sup .cite-why");
    if (왜버튼) {
      왜버튼.addEventListener("click", function () {
        var box = 왜버튼.parentNode.querySelector(".cite-reasons");
        if (!box) return;
        var on = 왜버튼.getAttribute("aria-expanded") === "true";
        왜버튼.setAttribute("aria-expanded", on ? "false" : "true");
        box.style.display = on ? "none" : "";
        왜버튼.textContent = 왜버튼.textContent.replace(on ? "▾" : "▸", on ? "▸" : "▾");
        펼침쓰기(!on);
      });
    }

    // 행(카드) 선택 → 📌 (일반형 — 지시는 대화창에서)
    Array.prototype.forEach.call(document.querySelectorAll(".ag"), function (el) {
      el.addEventListener("click", function () {
        if (선택행) 선택행.classList.remove("on");
        선택행 = el; el.classList.add("on");
        var id = el.getAttribute("data-id"), name = el.getAttribute("data-name");
        var m = byAgent[id] || { calls: 0, errors: 0 };
        알림(name, "에이전트 " + name + " · 호출 " + (calls[id] || 0) + "건 · 오류 " + m.errors + "건 (" + (days === 1 ? "오늘" : days + "일") + ")");
      });
    });
  }

  document.getElementById("range").addEventListener("click", function (ev) {
    var b = ev.target.closest("button");
    if (!b) return;
    Array.prototype.forEach.call(document.querySelectorAll("#range button"), function (x) { x.classList.remove("on"); });
    b.classList.add("on");
    days = Number(b.getAttribute("data-d")) || 1;
    // 다시 그리면 화면의 📌 표시가 사라진다 — 대화창의 선택도 함께 해제해 어긋남을 막는다
    // (검토관 하6 — 무인자 호출이 해제 규격).
    if (선택행 && window.gijoSelectNotify) { try { window.gijoSelectNotify(); } catch (e) { } }
    선택행 = null;
    load();
  });

  // 🛡 안전 요약 — 판(grouppanels safety)과 같은 원천을 읽되 rows로 조금 더 편다(읽기 전용).
  async function 안전그리기() {
    var el = document.getElementById("safety");
    if (!el || !window.gijo) return;
    var g = null, rt = null, eff = null;
    try { g = await window.gijo.guardrailStatus(); } catch (e) { }
    try { rt = await window.gijo.lastRedTeam(); } catch (e) { }
    try { eff = window.gijo.redteamEffectiveLast ? await window.gijo.redteamEffectiveLast() : null; } catch (e) { }
    var MODE = { off: "꺼짐", flag: "기록만", block: "차단" };
    var 줄 = function (k, v) {
      return '<div class="sup-line"><span style="flex:1">' + k + '</span><b>' + v + "</b></div>";
    };
    // 실필드(검토관 상2): RedTeamReport = total·vulnerable·errored·robustnessScore(blocked 없음),
    // EffectiveReport = effectiveScore(score 없음). 없는 필드를 읽으면 「쟀는데 못 읽었다」가
    // 「안 쟀다」로 보인다 — 폴백을 정상 출력처럼 쓰는 부류.
    el.innerHTML =
      줄("가드레일(서버 기동 후)", g ? esc(MODE[g.mode] || g.mode) + " 모드 · 막음 " + (g.blockedCount || 0) + "건" : "—") +
      줄("모의 공격 견고성(최근)", rt && rt.robustnessScore != null ? esc(String(rt.robustnessScore)) + "/100 · 취약 " + esc(String(rt.vulnerable != null ? rt.vulnerable : "-")) + "/" + esc(String(rt.total != null ? rt.total : "-")) : "아직 실행 기록 없음") +
      줄("제품 경로 실효 견고성(최근)", eff && eff.effectiveScore != null ? esc(String(eff.effectiveScore)) + "/100" : "—");
  }
  document.getElementById("goRedteam").addEventListener("click", function () {
    try { window.top.postMessage({ type: "gijo:openTab", page: "redteam.html?hub=1", label: "안전장치" }, "*"); } catch (e) { }
  });

  load();
  안전그리기();
})();
</script>
