<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>내 문서 — GIJO AS Lite</title>
<!--
  lite-mydocs.html — **화면이 아니라 이름표다.**

  ■ 왜 이 파일이 있나 (2026-08-22, 사장님 「라이트를 별도 제품 취급 말고 프로처럼」)
    라이트 셸은 화면 파일 이름을 **강제로 조립한다**(lite-app.html: `"lite-" + id + ".html"`).
    그리고 라이트 화면 id는 `lite-` 접두사여야 한다는 시험(lite-edition-shell.test.ts)과
    본체 창의 문지기(main.ts 라이트에서열수있나)가 겹쳐 있다.
    그래서 프로의 「내 문서」를 라이트에서 그대로 쓰려면 **이 이름의 파일이 하나 필요하다.**

  ■ 왜 화면을 새로 안 짜나
    「내 문서」를 라이트용으로 한 벌 더 만들면 그 순간 포크가 된다 — 프로에서 고친 것이
    라이트에 안 오고, 그 어긋남이 이 저장소가 반복해 겪은 결함의 뿌리다(작업경계 §4의
    「화면은 새로 만든다」 방침은 **회사 데이터 위젯을 떼야 했을 때**의 이야기이고,
    문서 관리는 뗄 위젯이 아니라 라이트에도 그대로 필요한 기능이다).
    그래서 여기서는 아무것도 그리지 않고 **본체 화면으로 넘긴다.** 로직 중복 0.

  ■ 왜 iframe이 아니라 location.replace 인가
    한 겹 더 감싸면 프레임이 늘어 `window.top`이 달라진다. 「내 문서」가 바깥에 보내는 신호
    (화면 열기·선택 알림)는 전부 top으로 가므로, 중간에 낀 창은 그걸 가로챌 수 없다.
    자리를 바꿔치기하면 부모가 그대로 라이트 셸이라 신호가 제대로 닿고 발신자 검증도 성립한다.
    같은 방식이 프로 사이드바(nav.js)에도 이미 있다 — 흡수된 화면을 이렇게 넘긴다.

  ■ edition=lite 가 하는 일
    라이트에는 회사도, 학습 파이프라인도 없다. 그 신호를 받아 본체 화면이 **자기 스스로**
    해당 자리를 접는다(부모가 자식 DOM을 손대는 방식은 쓰지 않는다 — 그건 되는지조차 확인된 적 없다).
-->
<style>
  html, body { margin: 0; height: 100%; background: #262624; }
</style>
</head>
<body>
<script>
  (function () {
    // 넘어갈 때 원래 붙어 온 값(?tab= 딥링크 등)은 그대로 이어 준다 — 나중에 라이트 셸이
    // 특정 탭으로 바로 보내고 싶을 때 이 파일을 다시 손댈 일이 없게.
    var q = new URLSearchParams(location.search);
    q.set("embed", "1");
    q.set("edition", "lite");
    location.replace("mydocs.html?" + q.toString());
  })();
</script>
</body>
</html>
