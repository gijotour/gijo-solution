<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIJO AS Lite — 대시보드</title>
<link rel="stylesheet" href="gijo-ui.css">
<!--
  lite-dashboard.html — 라이트 「대시보드」(메뉴 1).

  ■ ⚠ **9개 중 유일하게 새로 짜는 화면이다.** 본 제품 대시보드는 회사 자산·취약점 집계인데
    혼자 쓰는 PC엔 그 데이터가 없다. 여기 놓는 것은 **내 것**이다:
    지금 돌고 있나 · 내 할 일 · 내 문서 · 최근에 뭘 했나.

  ■ 맨 위가 「지금 돌고 있나」인 이유: 라이트는 서버 관리자가 없다.
    모델이 안 떠 있으면 무엇을 물어도 답이 안 나오는데, 그걸 **여기서 먼저 알려야** 한다.

  ■ 새 다리를 안 쓴다 — 다른 화면들이 쓰는 것을 모았을 뿐이다.
    getLocalEngineStatus · listTasks · listMemoryDocuments · listWorkSessions
-->
<style>
  :root{--bg:#262624;--panel:#30302e;--border:rgba(255,255,255,.09);--text:#e9e7e2;--muted:#b3ada4;--muted-2:#a49d95;--blue:#3b82f6;--teal:#1eb980;--red:#e2483d;--amber:#f0a020;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Pretendard","Malgun Gothic","Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:13px;overflow-y:auto}
  .wrap{padding:18px 22px 40px;display:flex;flex-direction:column;gap:14px;max-width:900px}
  .scr-id{font-size:12.5px;color:var(--muted)}
  .scr-id b{color:var(--text);font-weight:800}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
  .card h2{font-size:13px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:8px}
  .card .sub{font-size:11.5px;color:var(--muted-2);margin-bottom:10px;line-height:1.6}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .tile{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:13px 15px}
  .tile .k{font-size:11.5px;color:var(--muted);font-weight:700}
  .tile .v{font-size:23px;font-weight:800;margin:6px 0 2px;font-variant-numeric:tabular-nums}
  .tile .d{font-size:11.5px;color:var(--muted-2);line-height:1.6}
  /* ④ 내 지식창고 시각화 */
  .kb-kpi{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:12px}
  .kb-t .v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
  .kb-t .k{font-size:11.5px;color:var(--muted);font-weight:700}
  .kb-t .d{font-size:11px;color:var(--muted-2);margin-top:2px}
  .kb-bars-h{font-size:11.5px;color:var(--muted);font-weight:700;margin:4px 0 8px}
  .kb-bar{display:flex;align-items:center;gap:10px;margin:5px 0}
  .kb-bar .lbl{flex:0 0 100px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .kb-bar .track{flex:1;height:14px;background:rgba(255,255,255,.06);border-radius:7px;overflow:hidden}
  .kb-bar .fill{display:block;height:100%;background:linear-gradient(90deg,#3b82f6,#1eb980);border-radius:7px;min-width:2px}
  .kb-bar .num{flex:0 0 auto;font-size:11.5px;color:var(--muted-2);font-variant-numeric:tabular-nums;min-width:96px;text-align:right}
  .kb-bar .num .u{font-size:10.5px;opacity:.75}
  .kb-meta{font-size:11.5px;color:var(--muted-2);margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}
  .kb-meta b{color:var(--text)}
  .pill{font-size:11px;padding:1px 8px;border-radius:999px}
  .pill.on{background:rgba(30,185,128,.16);color:var(--teal)}
  .pill.off{background:rgba(226,72,61,.16);color:var(--red)}
  .pill.warn{background:rgba(240,160,32,.16);color:var(--amber)}
  ul{list-style:none}
  li{display:flex;gap:9px;align-items:baseline;padding:6px 2px;border-bottom:1px solid var(--border);font-size:12.5px}
  li:last-child{border-bottom:0}
  li .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  li .m{font-size:11.5px;color:var(--muted-2);flex:0 0 auto}
  .empty{font-size:12.5px;color:var(--muted);line-height:1.75;padding:6px 2px}
  .empty b{color:var(--text)}
  .err{font-size:12.5px;color:var(--red);padding:6px 2px}
  button.go{background:var(--blue);border:1px solid var(--blue);color:#fff;font:inherit;font-size:12.5px;font-weight:700;
    border-radius:8px;padding:8px 14px;cursor:pointer}
  button.go:hover{filter:brightness(1.08)}
</style>
</head>
<body>
<div class="wrap">
  <div class="scr-id"><b>대시보드</b> — 지금 어떤 상태인지, 내가 뭘 하다 말았는지 봅니다.</div>

  <section class="card">
    <h2>지금 돌고 있나 <span class="pill" id="engPill">확인 중</span></h2>
    <!-- ⚠ 이 줄은 원격 모드에서 스크립트가 바꾼다(관문 H-1) — 원격 카드 두 줄 위에서
         「이 PC 안에서 답을 만듭니다」가 그대로 떠 한 카드 안에서 자기모순이었다. -->
    <div class="sub" id="engSub">라이트는 이 PC 안에서 답을 만듭니다 — 모델이 멈춰 있으면 무엇을 물어도 답이 안 나옵니다.</div>
    <div id="engBox">불러오는 중…</div>
  </section>

  <!-- ④ 재편: 메뉴 중복 타일(할 일·문서·내역) 대신 「내 지식창고」 시각화 — 얼마나 쌓였나 한눈. -->
  <section class="card">
    <h2>내 지식창고 <span class="pill" id="kbPill">불러오는 중</span></h2>
    <div class="sub">넣은 자료가 얼마나 쌓였나 — 이게 AI 답의 근거입니다. 「넣기 → 쌓임 → 물어보기」</div>
    <div class="kb-kpi" id="kbKpi"></div>
    <div id="kbBars"></div>
    <div class="kb-meta" id="kbMeta"></div>
  </section>

  <section class="card">
    <h2>최근에 한 것</h2>
    <div id="recentBox">불러오는 중…</div>
  </section>
</div>

<script>
// lite-dashboard — 다른 화면들이 쓰는 다리를 모았을 뿐이다. 새 다리 없음.
// ⚠ 규칙: 0건을 「없다」로 말하지 않는다 · 401을 「서버 오류」라 하지 않는다.
(function () {
  "use strict";
  var g = window.gijo || null;
  var esc = function (v) { return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  function 오류문구(e, 무엇) {
    var m = String((e && e.message) || e || "");
    if (/401|unauthorized/i.test(m)) return "로그인이 풀렸습니다 — 다시 로그인해 주세요.";
    if (/403|forbidden/i.test(m)) return "이 계정에는 열람 권한이 없습니다.";
    if (/fetch|network|ECONN/i.test(m)) return "서버에 닿지 못했습니다 — 서버가 켜져 있는지 확인해 주세요.";
    return 무엇 + "을 못 읽었습니다 — " + esc(m);
  }
  function 날짜(v) {
    if (!v) return "";
    var d = new Date(typeof v === "number" ? v : String(v));
    if (isNaN(d.getTime())) return "";
    return (d.getMonth() + 1) + "/" + d.getDate();
  }
  if (!g) {
    ["engBox","todoBox","recentBox"].forEach(function (b) {
      var e = document.getElementById(b); if (e) e.innerHTML = '<div class="err">앱 밖에서 열려 있어 데이터를 못 읽습니다 — GIJO AS 앱에서 열어 주세요.</div>';
    });
    return;
  }

  // ── 지금 돌고 있나 ─────────────────────────────────────────────────
  // 화면(iframe) 안에서 설정을 여는 다리 — 셸의 gijoOpenScreen(설정도 연다, 2026-08-13).
  function 설정으로() {
    try { (window.parent && window.parent.gijoOpenScreen ? window.parent : window).gijoOpenScreen("lite-settings"); }
    catch (e) { /* 셸 밖이면 조용히 */ }
  }
  window.__liteGoSettings = 설정으로;

  async function 엔진() {
    try {
      var pill = document.getElementById("engPill");
      // ★ 원격 GPU가 켜져 있으면 **그것부터 말한다**(2026-08-15, 사장님 실사용이 잡음).
      //   이 카드는 로컬 모델만 봐서, 원격으로 멀쩡히 답하는 중에도 「모델 없음 — 등록하러
      //   가라」를 띄웠다. 답은 되는데 화면이 안 된다고 말하는 정직성 결함이다.
      //   (max의 원래 인계에도 「켜지면 이 카드가 원격 상태를 보이게」가 적혀 있었다 — 그때
      //   설정 카드만 만들고 이 카드를 빠뜨린 것이 오늘 실사용에서 드러났다.)
      try {
        var w = await g.remoteLlmWhere();
        if (w && w.remote) {
          pill.textContent = "원격 GPU"; pill.className = "pill on";
          // ⚠ 「답하고 있습니다」라고 **단언하지 않는다**(관문 M-1) — 이 갈래는 설정값만 본다.
          //   어젯밤 실제로 원격이 켜진 채 VPN 경로가 끊겨 타임아웃이 났는데, 그때 이 카드가
          //   초록으로 「답하고 있다」고 말하면 거짓이다. 아는 것(설정돼 있다)만 말한다.
          document.getElementById("engBox").innerHTML =
            '<div class="empty"><b>🖧 원격 GPU를 쓰도록 설정돼 있습니다</b> — 질문이 VPN으로 그 기계에 전송됩니다.<br>' +
            "이 PC에 챗 모델을 두지 않아도 대화가 됩니다. 원격이 로컬(7~8B)보다 <b>답이 오래 걸릴 수 있습니다</b>(더 큰 모델을 먼 기계에서 돌립니다).<br>" +
            '연결이 실제로 되는지는 ⚙ 설정의 <b>[연결 테스트]</b>가 확인해 줍니다 — <button class="go" style="margin-top:10px" id="goRgpu">⚙ 원격 GPU 설정</button></div>';
          // 원격 카드 두 줄 위의 정체성 한 줄도 함께 바꾼다(관문 H-1 — 안 바꾸면 한 카드 안에서 자기모순).
          var sub = document.getElementById("engSub");
          if (sub) sub.textContent = "지금은 VPN 안의 원격 GPU가 답을 만듭니다 — 이 PC에 모델이 없어도 대화가 됩니다.";
          var br = document.getElementById("goRgpu"); if (br) br.addEventListener("click", 설정으로);
          return;
        }
      } catch (e) { /* 옛 서버면 다리가 없다 — 로컬 판정으로 진행 */ }
      var st = await g.getLocalEngineStatus();
      var 적재 = (st.loaded || []).filter(function (l) { return l.ready; });
      if (적재.length) {
        pill.textContent = "돌고 있음"; pill.className = "pill on";
        document.getElementById("engBox").innerHTML =
          '<div class="empty">' + esc(적재.map(function (l) { return l.modelId; }).join(" · ")) + " 가 올라와 있습니다.</div>";
        return;
      }
      // ⚠ 두 상태를 가른다(2026-08-13, 챗 모델은 고객 등록으로 바뀜):
      //   ① 등록된 챗 모델이 아예 없다 → **등록하러 가라**(첫 실행의 기본 상태다).
      //   ② 모델은 있는데 안 올라왔다 → **올려라**.
      //   예전엔 늘 「올리면 됩니다」였는데, 동봉을 뺀 뒤로는 올릴 것이 없는 게 첫날 기본이다.
      var models = [];
      try { var m = await g.listModels(); models = Array.isArray(m) ? m : (m && m.models) || []; } catch (e) { /* 목록 실패는 아래서 일반 안내 */ }
      pill.textContent = models.length ? "멈춰 있음" : "모델 없음"; pill.className = "pill off";
      if (!models.length) {
        document.getElementById("engBox").innerHTML =
          '<div class="empty"><b>아직 챗 모델이 없습니다.</b><br>' +
          "라이트는 챗 모델을 <b>고객이 등록</b>합니다 — 파일을 넣거나 받으면 됩니다. " +
          "검색·임베딩은 이미 됩니다.<br>" +
          '<button class="go" style="margin-top:10px" id="goReg">⚙ 챗 모델 등록하러 가기</button></div>';
        var b = document.getElementById("goReg"); if (b) b.addEventListener("click", 설정으로);
      } else {
        document.getElementById("engBox").innerHTML =
          '<div class="empty"><b>지금은 모델이 안 올라와 있습니다.</b><br>' +
          "<b>⚙ 설정 → 모델·엔진</b>에서 「올리기」를 누르면 됩니다. 올리는 데 30초쯤 걸립니다.<br>" +
          '<button class="go" style="margin-top:10px" id="goEng">⚙ 설정 열기</button></div>';
        var b2 = document.getElementById("goEng"); if (b2) b2.addEventListener("click", 설정으로);
      }
    } catch (e) { document.getElementById("engBox").innerHTML = '<div class="err">' + 오류문구(e, "엔진 상태") + "</div>"; }
  }

  // ── ④ 내 지식창고 시각화 + 최근에 한 것 ────────────────────────────
  function kpi(n, l, d) { return '<div class="kb-t"><div class="v">' + n + '</div><div class="k">' + esc(l) + '</div>' + (d ? '<div class="d">' + esc(d) + '</div>' : '') + '</div>'; }
  function 시각(v) { var d = new Date(v); if (isNaN(d.getTime())) return ""; return (d.getMonth()+1) + "/" + d.getDate() + " " + String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0"); }

  async function 나머지() {
    var docs = [], sess = [];
    try { var dd = await g.listMemoryDocuments(); docs = Array.isArray(dd) ? dd : (dd && dd.documents) || []; }
    catch (e) { document.getElementById("kbKpi").innerHTML = '<div class="err">' + 오류문구(e, "지식창고") + "</div>"; }
    try { sess = await g.listWorkSessions(); } catch (e) { /* 최근 목록만 못 그린다 */ }
    if (!Array.isArray(sess)) sess = [];

    // ⚠ 제품이 넣은 것과 내가 넣은 것을 가른다(2026-08-13 실측: 첫날 「문서 19」가 전부 제품이었다).
    var 번들 = new Set();
    try {
      var st2 = await g.knowledgeBundleStatus();
      ((st2 && st2.docs && st2.docs.fingerprints) || []).forEach(function (x) { 번들.add(String(x.file || "").split("/").pop()); });
    } catch (e) { /* 못 받으면 합계만 말한다 */ }
    var 제품수 = 번들.size ? docs.filter(function (d) { return 번들.has(String(d.documentId || "")); }).length : 0;
    var 내것수 = 번들.size ? docs.length - 제품수 : docs.length;
    var 청크 = docs.reduce(function (s, d) { return s + (Number(d.chunks) || 0); }, 0);

    var pill = document.getElementById("kbPill");
    if (pill) { pill.textContent = docs.length ? docs.length + "개 문서" : "비어 있음"; pill.className = "pill " + (docs.length ? "on" : "off"); }
    var kbKpi = document.getElementById("kbKpi");
    if (kbKpi) kbKpi.innerHTML =
      kpi(docs.length, "총 문서", 번들.size ? "제품 " + 제품수 + " · 내가 넣은 " + 내것수 : "") +
      kpi(청크, "검색 조각(청크)", "AI가 찾아보는 단위") +
      kpi(내것수, "내가 넣은 문서", "내 지식");

    // 분류(category)별 막대 — 로그 화면 「한눈에 보기」 막대 패턴 재사용.
    var cats = {};
    docs.forEach(function (d) { var c = d.category || "미분류"; if (!cats[c]) cats[c] = { d: 0, k: 0 }; cats[c].d++; cats[c].k += (Number(d.chunks) || 0); });
    var rows = Object.keys(cats).map(function (c) { return { c: c, d: cats[c].d, k: cats[c].k }; }).sort(function (a, b) { return b.k - a.k; });
    var maxK = rows.reduce(function (m, r) { return r.k > m ? r.k : m; }, 1);
    var kbBars = document.getElementById("kbBars");
    if (kbBars) kbBars.innerHTML = rows.length
      ? '<div class="kb-bars-h">분류별 조각</div>' + rows.map(function (r) {
          return '<div class="kb-bar"><span class="lbl" title="' + esc(r.c) + '">' + esc(r.c) + '</span>' +
            '<span class="track"><span class="fill" style="width:' + Math.round(r.k / maxK * 100) + '%"></span></span>' +
            '<span class="num">' + r.k + ' <span class="u">조각 · ' + r.d + '문서</span></span></div>';
        }).join("")
      : '<div class="empty"><b>아직 넣은 자료가 없습니다.</b><br>「나만의 자료」에서 문서를 넣으면 여기 쌓임이 보이고, AI가 그걸 근거로 답합니다.</div>';

    // 임베딩 모델 · 마지막 반입
    var emb = (docs.find(function (d) { return d.embeddingModel; }) || {}).embeddingModel || "";
    var last = docs.reduce(function (m, d) { var t = new Date(d.ingestedAt || 0).getTime(); return t > m ? t : m; }, 0);
    var kbMeta = document.getElementById("kbMeta");
    if (kbMeta) kbMeta.innerHTML =
      (emb ? '임베딩 모델 <b>' + esc(emb) + '</b>' : '') +
      (last ? (emb ? ' · ' : '') + '마지막 반입 <b>' + esc(시각(last)) + '</b>' : '');

    var 최근 = sess.slice().sort(function (a, b) { return (b.updatedAt || 0) - (a.updatedAt || 0); }).slice(0, 6);
    document.getElementById("recentBox").innerHTML = 최근.length
      ? "<ul>" + 최근.map(function (s) {
          return "<li><span class='t' title='" + esc(s.title) + "'>" + esc(s.title) + "</span><span class='m'>" + esc(날짜(s.updatedAt || s.createdAt)) + "</span></li>";
        }).join("") + "</ul>"
      : '<div class="empty"><b>아직 나눈 대화가 없습니다.</b><br>무언가 물어보면 그 대화가 여기 한 건으로 남습니다 — 나중에 「그때 뭐라고 했더라」를 찾는 자리입니다.</div>';
  }

  function 시작() { 엔진(); 나머지(); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", 시작);
  else 시작();
})();
</script>
</body>
</html>
