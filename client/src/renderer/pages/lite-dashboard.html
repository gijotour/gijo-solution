<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIJO AS Lite — 대시보드</title>
<link rel="stylesheet" href="gijo-ui.css">
<!--
  lite-dashboard.html — 라이트 「대시보드」(메뉴 1).

  ■ ⚠ **9개 중 유일하게 새로 짜는 화면이다.** 본 제품 대시보드는 회사 자산·취약점 집계인데
    혼자 쓰는 PC엔 그 데이터가 없다. 여기 놓는 것은 **내 것**이다:
    지금 돌고 있나 · 내 할 일 · 내 문서 · 최근에 뭘 했나.

  ■ 맨 위가 「지금 돌고 있나」인 이유: 라이트는 서버 관리자가 없다.
    모델이 안 떠 있으면 무엇을 물어도 답이 안 나오는데, 그걸 **여기서 먼저 알려야** 한다.

  ■ 새 다리를 안 쓴다 — 다른 화면들이 쓰는 것을 모았을 뿐이다.
    getLocalEngineStatus · listTasks · listMemoryDocuments · listWorkSessions
-->
<style>
  :root{--bg:#262624;--panel:#30302e;--border:rgba(255,255,255,.09);--text:#e9e7e2;--muted:#b3ada4;--muted-2:#a49d95;--blue:#3b82f6;--teal:#1eb980;--red:#e2483d;--amber:#f0a020;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Pretendard","Malgun Gothic","Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:13px;overflow-y:auto}
  .wrap{padding:18px 22px 40px;display:flex;flex-direction:column;gap:14px;max-width:900px}
  .scr-id{font-size:12.5px;color:var(--muted)}
  .scr-id b{color:var(--text);font-weight:800}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
  .card h2{font-size:13px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:8px}
  .card .sub{font-size:11.5px;color:var(--muted-2);margin-bottom:10px;line-height:1.6}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .tile{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:13px 15px}
  .tile .k{font-size:11.5px;color:var(--muted);font-weight:700}
  .tile .v{font-size:23px;font-weight:800;margin:6px 0 2px;font-variant-numeric:tabular-nums}
  .tile .d{font-size:11.5px;color:var(--muted-2);line-height:1.6}
  .pill{font-size:11px;padding:1px 8px;border-radius:999px}
  .pill.on{background:rgba(30,185,128,.16);color:var(--teal)}
  .pill.off{background:rgba(226,72,61,.16);color:var(--red)}
  .pill.warn{background:rgba(240,160,32,.16);color:var(--amber)}
  ul{list-style:none}
  li{display:flex;gap:9px;align-items:baseline;padding:6px 2px;border-bottom:1px solid var(--border);font-size:12.5px}
  li:last-child{border-bottom:0}
  li .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  li .m{font-size:11.5px;color:var(--muted-2);flex:0 0 auto}
  .empty{font-size:12.5px;color:var(--muted);line-height:1.75;padding:6px 2px}
  .empty b{color:var(--text)}
  .err{font-size:12.5px;color:var(--red);padding:6px 2px}
</style>
</head>
<body>
<div class="wrap">
  <div class="scr-id"><b>대시보드</b> — 지금 어떤 상태인지, 내가 뭘 하다 말았는지 봅니다.</div>

  <section class="card">
    <h2>지금 돌고 있나 <span class="pill" id="engPill">확인 중</span></h2>
    <div class="sub">라이트는 이 PC 안에서 답을 만듭니다 — 모델이 멈춰 있으면 무엇을 물어도 답이 안 나옵니다.</div>
    <div id="engBox">불러오는 중…</div>
  </section>

  <div class="grid" id="tiles">
    <div class="tile"><div class="k">내 할 일</div><div class="v" id="tTask">…</div><div class="d" id="dTask"></div></div>
    <div class="tile"><div class="k">내 문서</div><div class="v" id="tDoc">…</div><div class="d" id="dDoc"></div></div>
    <div class="tile"><div class="k">작업 내역</div><div class="v" id="tSess">…</div><div class="d" id="dSess"></div></div>
  </div>

  <section class="card">
    <h2>아직 안 끝낸 일</h2>
    <div id="todoBox">불러오는 중…</div>
  </section>

  <section class="card">
    <h2>최근에 한 것</h2>
    <div id="recentBox">불러오는 중…</div>
  </section>
</div>

<script>
// lite-dashboard — 다른 화면들이 쓰는 다리를 모았을 뿐이다. 새 다리 없음.
// ⚠ 규칙: 0건을 「없다」로 말하지 않는다 · 401을 「서버 오류」라 하지 않는다.
(function () {
  "use strict";
  var g = window.gijo || null;
  var esc = function (v) { return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  function 오류문구(e, 무엇) {
    var m = String((e && e.message) || e || "");
    if (/401|unauthorized/i.test(m)) return "로그인이 풀렸습니다 — 다시 로그인해 주세요.";
    if (/403|forbidden/i.test(m)) return "이 계정에는 열람 권한이 없습니다.";
    if (/fetch|network|ECONN/i.test(m)) return "서버에 닿지 못했습니다 — 서버가 켜져 있는지 확인해 주세요.";
    return 무엇 + "을 못 읽었습니다 — " + esc(m);
  }
  function 날짜(v) {
    if (!v) return "";
    var d = new Date(typeof v === "number" ? v : String(v));
    if (isNaN(d.getTime())) return "";
    return (d.getMonth() + 1) + "/" + d.getDate();
  }
  if (!g) {
    ["engBox","todoBox","recentBox"].forEach(function (b) {
      var e = document.getElementById(b); if (e) e.innerHTML = '<div class="err">앱 밖에서 열려 있어 데이터를 못 읽습니다 — GIJO AS 앱에서 열어 주세요.</div>';
    });
    return;
  }

  // ── 지금 돌고 있나 ─────────────────────────────────────────────────
  async function 엔진() {
    try {
      var st = await g.getLocalEngineStatus();
      var 적재 = (st.loaded || []).filter(function (l) { return l.ready; });
      var pill = document.getElementById("engPill");
      if (적재.length) {
        pill.textContent = "돌고 있음"; pill.className = "pill on";
        document.getElementById("engBox").innerHTML =
          '<div class="empty">' + esc(적재.map(function (l) { return l.modelId; }).join(" · ")) + " 가 올라와 있습니다.</div>";
      } else {
        // ⚠ 「멈춰 있습니다」로 끝내지 않는다 — 어디로 가야 하는지 적는다.
        pill.textContent = "멈춰 있음"; pill.className = "pill off";
        document.getElementById("engBox").innerHTML =
          '<div class="empty"><b>지금은 모델이 안 올라와 있습니다.</b><br>' +
          "왼쪽 아래 <b>⚙ 설정 → 모델·엔진</b>에서 올리면 됩니다. 올리는 데 30초쯤 걸립니다.</div>";
      }
    } catch (e) { document.getElementById("engBox").innerHTML = '<div class="err">' + 오류문구(e, "엔진 상태") + "</div>"; }
  }

  // ── 숫자 셋 + 목록 둘 ──────────────────────────────────────────────
  async function 나머지() {
    var tasks = [], docs = [], sess = [];
    var 실패 = [];
    try { tasks = await g.listTasks(); } catch (e) { 실패.push(["할 일", e]); }
    try { var dd = await g.listMemoryDocuments(); docs = Array.isArray(dd) ? dd : dd.documents || []; } catch (e) { 실패.push(["문서", e]); }
    try { sess = await g.listWorkSessions(); } catch (e) { 실패.push(["작업 내역", e]); }
    if (!Array.isArray(tasks)) tasks = [];
    if (!Array.isArray(sess)) sess = [];

    // ⚠ 2026-08-13 첫 실행 실측: 막 설치한 기계에서 이 칸이 **「내 문서 19」**로 떴다.
    //   19건은 전부 제품이 함께 넣어 준 것이고 고객이 넣은 것은 0이다.
    //   「나만의 기억」 화면은 같은 순간 「1건」이라고 말했다 — **두 화면이 다른 숫자를 말했다.**
    //   제품이 정확한 목록을 준다(knowledge-bundle/status의 docs.fingerprints[].file).
    var 번들 = new Set();
    try {
      var st2 = await g.knowledgeBundleStatus();
      // ⚠ 지문은 경로가 붙어 온다(knowledge/…). 장기기억은 파일명만 쓴다 — 떼고 맞춘다.
      ((st2 && st2.docs && st2.docs.fingerprints) || []).forEach(function (x) { 번들.add(String(x.file || "").split("/").pop()); });
    } catch (e) { /* 못 받으면 아래에서 전부 「내 것」으로 세지 않고 그냥 합계만 말한다 */ }
    var 내것 = 번들.size ? docs.filter(function (d) { return !번들.has(String(d.documentId || "")); }) : null;

    // ⚠ 하나가 실패해도 나머지는 그린다 — 화면 전체가 빈칸이 되면 무엇이 문제인지 안 보인다.
    if (실패.length) {
      document.getElementById("todoBox").innerHTML =
        실패.map(function (f) { return '<div class="err">' + 오류문구(f[1], f[0]) + "</div>"; }).join("");
    }

    var 안끝난것 = tasks.filter(function (t) { return !t.done; });
    document.getElementById("tTask").textContent = 안끝난것.length;
    document.getElementById("dTask").textContent = tasks.length ? "전체 " + tasks.length + "건 중" : "아직 담은 것 없음";
    // 내가 넣은 것을 센다. 제품 자료는 아래 줄에 따로 밝힌다 — 합쳐서 세면 첫날부터 19가 뜬다.
    document.getElementById("tDoc").textContent = 내것 ? 내것.length : docs.length;
    document.getElementById("dDoc").textContent = 내것
      ? (내것.length ? "지식으로 쓰입니다 · 제품 자료 " + (docs.length - 내것.length) + "건 별도"
                     : (docs.length ? "제품 자료 " + docs.length + "건은 이미 쓰입니다" : "아직 넣은 것 없음"))
      : (docs.length ? "지식으로 쓰입니다" : "아직 넣은 것 없음");
    document.getElementById("tSess").textContent = sess.length;
    document.getElementById("dSess").textContent = sess.length ? "지금까지 나눈 대화" : "아직 없음";

    if (!실패.length) {
      document.getElementById("todoBox").innerHTML = 안끝난것.length
        ? "<ul>" + 안끝난것.slice(0, 6).map(function (t) {
            return "<li><span class='t' title='" + esc(t.text) + "'>" + esc(t.text) + "</span><span class='m'>" + esc(날짜(t.createdAt)) + "</span></li>";
          }).join("") + "</ul>" + (안끝난것.length > 6 ? '<div class="empty">외 ' + (안끝난것.length - 6) + "건 — 「작업 내역」에서 봅니다.</div>" : "")
        : '<div class="empty"><b>아직 담은 할 일이 없습니다.</b><br>「작업 내역」 화면에서 적거나, 대화창에서 「할 일 담기: …」라고 말하면 여기 쌓입니다.</div>';
    }

    var 최근 = sess.slice().sort(function (a, b) { return (b.updatedAt || 0) - (a.updatedAt || 0); }).slice(0, 6);
    document.getElementById("recentBox").innerHTML = 최근.length
      ? "<ul>" + 최근.map(function (s) {
          return "<li><span class='t' title='" + esc(s.title) + "'>" + esc(s.title) + "</span><span class='m'>" + esc(날짜(s.updatedAt || s.createdAt)) + "</span></li>";
        }).join("") + "</ul>"
      : '<div class="empty"><b>아직 나눈 대화가 없습니다.</b><br>무언가 물어보면 그 대화가 여기 한 건으로 남습니다 — 나중에 「그때 뭐라고 했더라」를 찾는 자리입니다.</div>';
  }

  function 시작() { 엔진(); 나머지(); }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", 시작);
  else 시작();
})();
</script>
</body>
</html>
