<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<title>GIJO AS — 자산 허브</title>
<link rel="stylesheet" href="gijo-ui.css">
<style>
  :root{--bg:#080c16;--panel:#121a2e;--panel-2:#0e1526;--border:rgba(255,255,255,.08);--border-strong:rgba(255,255,255,.16);
    --text:#e7eaf3;--muted:#8b93ab;--muted-2:#5f6785;--blue:#3b82f6;--blue-light:#5fa1ff;--purple:#8b7cf0;--teal:#1eb980;--amber:#f0a020;--red:#e2483d;}
  *{box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);}
  .header{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-bottom:1px solid var(--border);}
  .header-left{display:flex;align-items:center;gap:14px;} .app-title{font-weight:900;font-size:15px;}
  .clock{font-size:11.5px;color:var(--muted);} .header-right{display:flex;align-items:center;gap:10px;}
  .status-pill{font-size:10.5px;color:var(--teal);display:flex;align-items:center;gap:5px;} .status-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);}
  .beta-tag{font-size:8.5px;background:rgba(30,185,128,.16);padding:1px 5px;border-radius:4px;}
  .avatar-btn,.icon-btn{width:30px;height:30px;border-radius:8px;background:var(--panel-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);cursor:pointer;}
  .app{display:flex;} .sidebar{flex-shrink:0;} .main{flex:1;min-width:0;padding:16px 22px;height:calc(100vh - 51px);overflow-y:auto;}
  .page-title{font-size:19px;font-weight:800;display:flex;align-items:center;gap:9px;}
  .ai-badge{background:linear-gradient(90deg,#8b7cf0,#5fa1ff);color:#fff;font-size:9px;font-weight:800;padding:2px 8px;border-radius:20px;}
  .page-sub{font-size:12px;color:var(--muted);margin-top:3px;}
  /* 상단 노출요약 3패널 (시안 C) */
  .expo{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:12px;margin:14px 0 16px;}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:13px 15px;}
  .ph{font-size:12px;font-weight:800;margin-bottom:9px;display:flex;align-items:center;gap:6px;}
  .ph .hint{margin-left:auto;font-size:9px;color:var(--muted-2);font-weight:600;}
  .score{display:flex;align-items:baseline;gap:8px;} .score .big{font-size:34px;font-weight:900;} .score .u{font-size:11.5px;color:var(--muted);}
  .bars{margin-top:9px;display:flex;flex-direction:column;gap:6px;}
  .bar{display:flex;align-items:center;gap:8px;font-size:10.5px;} .bar .lb{width:78px;color:var(--muted);flex-shrink:0;}
  .bar .tr{flex:1;height:7px;background:var(--panel-2);border-radius:20px;overflow:hidden;} .bar .fl{height:100%;border-radius:20px;} .bar .vv{width:30px;text-align:right;font-weight:700;flex-shrink:0;}
  .ai-risk-list{display:flex;flex-direction:column;gap:6px;} .arl{display:flex;align-items:center;gap:8px;font-size:11px;}
  .arl .code{font-size:9px;font-weight:800;color:#c9b8ff;background:rgba(139,124,240,.14);padding:2px 6px;border-radius:5px;flex-shrink:0;width:50px;text-align:center;}
  .arl .n{margin-left:auto;font-weight:800;} .arl.empty{color:var(--muted-2);font-size:10.5px;}
  /* 파일별 보기(2026-07-25) — 설명은 ⓘ(챗봇)에 있고 화면엔 최소 텍스트만 둔다 */
  .hub-seg{display:flex;background:#0a1120;border:1px solid var(--border-strong);border-radius:9px;padding:3px;gap:3px;margin-bottom:10px;width:max-content;}
  .hub-seg span{padding:5px 13px;border-radius:7px;font-size:11px;font-weight:800;color:var(--muted);cursor:pointer;border:1px solid transparent;}
  .hub-seg span.on{background:rgba(59,130,246,.22);color:#fff;border-color:rgba(59,130,246,.5);}
  .fgrp{margin-bottom:8px;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--panel-2);}
  .fhd{display:flex;align-items:center;gap:8px;padding:9px 11px;cursor:pointer;}
  .fhd.on{background:rgba(59,130,246,.13);box-shadow:inset 3px 0 0 var(--blue);}
  .fhd .nm{flex:1;min-width:0;font-size:11.5px;font-weight:800;color:#dfe6ff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .fhd .cnt2{font-size:9px;font-weight:800;color:var(--blue-light);background:rgba(59,130,246,.16);border-radius:20px;padding:1px 7px;flex:0 0 auto;}
  .fmeta{padding:0 11px 7px 32px;font-size:9.5px;color:var(--muted-2);}
  .fchild{border-top:1px solid var(--border);}
  .arow{display:flex;align-items:center;gap:8px;padding:7px 11px 7px 28px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.04);}
  .arow:last-child{border-bottom:none;} .arow.sel{background:rgba(59,130,246,.1);}
  .arow .an{flex:1;min-width:0;font-size:11px;font-weight:700;color:#cfd6ea;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sd{font-size:8.5px;font-weight:800;padding:1px 5px;border-radius:4px;flex:0 0 auto;}
  .sd.c{background:rgba(226,72,61,.18);color:#f5928a;} .sd.h{background:rgba(240,160,32,.18);color:#f7c777;}
  .sd.m{background:rgba(59,130,246,.18);color:#8fb8ff;} .sd.l{background:rgba(30,185,128,.16);color:#6fdcb5;}
  .alias{display:inline-block;font-size:8.5px;font-weight:800;padding:1px 6px;border-radius:5px;background:rgba(139,124,240,.16);border:1px solid rgba(139,124,240,.4);color:#b3a6ff;}
  .rn{background:rgba(139,124,240,.07);border:1px solid rgba(139,124,240,.35);border-radius:9px;padding:10px 12px;margin:10px 0;}
  .rn .row{display:flex;gap:7px;align-items:center;}
  .rn input{flex:1;background:var(--panel-2);border:1px solid var(--border-strong);border-radius:7px;padding:6px 10px;color:var(--text);font-size:12px;outline:none;}
  .btn-s{font-size:11px;font-weight:700;padding:6px 11px;border-radius:7px;cursor:pointer;border:1px solid var(--border-strong);background:var(--panel-2);color:var(--text);}
  .btn-s.p{background:rgba(59,130,246,.16);border-color:rgba(59,130,246,.5);color:#cfe0ff;}
  .btn-s:hover{filter:brightness(1.15);}
  .src-line{font-size:10px;color:var(--muted-2);margin-top:3px;}
  .src-line b{color:#8fb8ff;font-weight:700;}
  /* 마스터·디테일 (시안 A) */
  .body{display:flex;gap:14px;min-height:0;}
  .master{width:330px;flex-shrink:0;}
  .sec-h{font-size:11px;font-weight:800;color:var(--muted-2);letter-spacing:.3px;margin:2px 4px 8px;display:flex;align-items:center;gap:6px;}
  .sec-h .cnt{margin-left:auto;color:var(--muted);}
  .acard{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:11px;margin-bottom:8px;cursor:pointer;}
  .acard.ai{border-color:rgba(139,124,240,.35);background:linear-gradient(180deg,rgba(139,124,240,.07),transparent);}
  .acard.sel{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue);}
  .ac-top{display:flex;align-items:center;gap:7px;}
  .ac-ic{width:26px;height:26px;border-radius:7px;background:var(--panel-2);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
  .ac-nm{font-size:12.5px;font-weight:700;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;} .ac-sub{font-size:10px;color:var(--muted);}
  .risk{margin-left:auto;font-size:9.5px;font-weight:800;padding:2px 8px;border-radius:20px;flex-shrink:0;}
  .r-critical{background:rgba(226,72,61,.16);color:#f5928a;} .r-high{background:rgba(240,160,32,.16);color:#f7c777;}
  .r-medium{background:rgba(59,130,246,.16);color:#8fb8ff;} .r-ok{background:rgba(30,185,128,.16);color:#6fdcb5;}
  .ac-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px;}
  .tag{font-size:9px;padding:2px 6px;border-radius:5px;background:var(--panel-2);border:1px solid var(--border);color:var(--muted);}
  .tag.llm{color:#c9b8ff;border-color:rgba(139,124,240,.3);}
  .detail{flex:1;min-width:0;}
  .d-empty{color:var(--muted);font-size:12.5px;padding:40px;text-align:center;border:1px dashed var(--border-strong);border-radius:12px;}
  .d-head{display:flex;align-items:center;gap:11px;margin-bottom:5px;flex-wrap:wrap;} .d-nm{font-size:19px;font-weight:800;}
  .d-sub{font-size:11.5px;color:var(--muted);margin-bottom:13px;}
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:13px;}
  .tab{padding:8px 14px;font-size:12px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
  .tab.on{color:#fff;font-weight:700;border-bottom-color:var(--blue);} .tab .b{font-size:9px;background:var(--red);color:#fff;padding:1px 6px;border-radius:20px;margin-left:5px;}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
  .kc{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:11px;} .kc .l{font-size:10px;color:var(--muted);} .kc .v{font-size:19px;font-weight:800;margin-top:3px;}
  .block{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:13px 15px;margin-bottom:13px;}
  .bh{font-size:12.5px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:6px;} .bh .link{margin-left:auto;color:var(--blue-light);font-size:11px;cursor:pointer;}
  .bom-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .bom{background:var(--panel-2);border:1px solid var(--border);border-radius:9px;padding:9px;text-align:center;} .bom .ic{font-size:17px;} .bom .nm{font-size:10px;color:var(--muted);margin-top:4px;} .bom .n{font-size:14px;font-weight:800;margin-top:2px;}
  .owasp{display:flex;flex-direction:column;gap:6px;}
  .ow{display:flex;align-items:center;gap:9px;padding:8px 10px;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;}
  .ow .code{font-size:9px;font-weight:800;color:#c9b8ff;background:rgba(139,124,240,.14);padding:2px 6px;border-radius:5px;flex-shrink:0;}
  .ow .txt{font-size:11px;min-width:0;} .ow .txt b{color:#fff;} .ow .ev{font-size:9.5px;color:var(--muted-2);margin-top:1px;}
  .ow .st{margin-left:auto;font-size:9px;font-weight:800;padding:2px 8px;border-radius:20px;flex-shrink:0;}
  .st.open{background:rgba(226,72,61,.16);color:#f5928a;} .st.covered{background:rgba(30,185,128,.16);color:#6fdcb5;} .st.na{background:var(--panel);color:var(--muted-2);}
  table{width:100%;border-collapse:collapse;font-size:11.5px;} th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);} th{color:var(--muted);font-weight:700;font-size:10.5px;}
  .sev{font-weight:800;} .sev.critical{color:#f5928a;} .sev.high{color:#f7c777;} .sev.medium{color:#8fb8ff;} .sev.low{color:var(--muted);}
  .kev-b{font-size:8.5px;font-weight:800;color:#f5928a;background:rgba(226,72,61,.14);padding:1px 5px;border-radius:4px;margin-left:5px;}
  .note{font-size:10px;color:var(--muted-2);margin-top:8px;line-height:1.5;}
  .empty-line{color:var(--muted);font-size:11.5px;padding:10px 2px;}
</style></head>
<body class="g-ui">
<div class="header">
  <div class="header-left"><span id="homeLink" data-page="dashboard.html" style="display:flex;align-items:center;gap:10px;cursor:pointer"><img src="https://gijo.ai/_nuxt/logo_gijo_white.CCh2YXJe.svg" alt="GIJO" style="height:20px"><div class="app-title">GIJO AS</div></span><div class="clock" id="clockEl">-</div></div>
  <div class="header-right"><div class="status-pill" id="statusPill"><span class="dot"></span>연결 확인 중<span class="beta-tag">LIVE</span></div><div class="avatar-btn" id="avatarBtn">-</div><div class="icon-btn" id="settingsBtn">⚙</div></div>
</div>
<div class="app">
  <div class="sidebar" id="gijoNav"></div>
  <div class="main">
    <div>
      <div class="page-title">🛡 자산 허브 <span class="ai-badge">AI 자산 우선</span></div>
    </div>

    <div id="gijoChatWidget" data-start="collapsed" data-prompts='["AI 자산 위험 현황 알려줘","미조치 취약점 몇 건이야?"]'></div>

    <!-- 상단 노출요약 3패널 -->
    <div class="expo">
      <div class="panel">
        <div class="ph">📊 종합 노출도 <span class="hint">취약점·AI위험·외부노출 가중</span></div>
        <div class="score"><div class="big" id="exBig">-</div><div class="u" id="exBand"></div></div>
        <div class="bars" id="exBars"></div>
      </div>
      <div class="panel">
        <div class="ph">🤖 AI 위험 (OWASP LLM) <span class="hint">미대응 노출</span></div>
        <div class="ai-risk-list" id="owaspList"></div>
      </div>
      <div class="panel">
        <div class="ph">🩹 취약점 처리 <span class="hint">KEV 우선</span></div>
        <div class="score"><div class="big" id="vulnBig" style="font-size:28px">-</div><div class="u" id="vulnSub"></div></div>
        <div class="bars" id="vulnBars"></div>
      </div>
    </div>

    <!-- Shadow AI 배너는 AI-BOM 화면으로 이관(2026-07-26) — 통합 뷰는 전체 자산 관제에 집중 -->

    <!-- 마스터·디테일 -->
    <div class="hub-seg" id="hubSeg"><span data-mode="asset" class="on">🗂 자산별</span><span data-mode="file">📄 파일별</span></div>
    <div class="body">
      <div class="master" id="master"><div class="empty-line">불러오는 중…</div></div>
      <div class="detail" id="detail"><div class="d-empty">왼쪽에서 자산을 선택하면 구성·취약점·AI 위험을 한 자리에서 봅니다.</div></div>
    </div>
  </div>
</div>
<script>
(function(){
  "use strict";
  const $=(id)=>document.getElementById(id);
  const esc=(s)=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const bandColor={critical:"#e2483d",high:"#f0a020",medium:"#3b82f6",ok:"#1eb980"};
  const bandLabel={critical:"🔴 매우높음",high:"🟠 높음",medium:"🔵 보통",ok:"🟢 양호"};
  let OVERVIEW=null, selId=null, curTab="overview";
  // 목록 보기 모드 — asset(자산별) | file(파일별). 설명은 ⓘ(screenguide '파일별 보기')에 있다.
  let listMode=(()=>{ try{ return localStorage.getItem("gijo:assethub:mode")||"asset"; }catch(e){ return "asset"; } })();

  function tick(){ $("clockEl").textContent=new Date().toLocaleString("ko-KR",{hour:"2-digit",minute:"2-digit",hour12:true,month:"2-digit",day:"2-digit"}); }
  async function loadHealth(){ try{ await window.gijo.checkServerHealth(); $("statusPill").innerHTML='<span class="dot"></span>운영중<span class="beta-tag">LIVE</span>'; }catch(e){ $("statusPill").innerHTML='<span class="dot" style="background:#e2483d"></span>연결 끊김'; } }
  async function loadUser(){ try{ const u=await window.gijo.me(); $("avatarBtn").textContent=(u.displayName||u.username||"-").charAt(0);}catch(e){} }

  function renderSummary(s){
    $("exBig").textContent=s.overallExposure;
    $("exBig").style.color=s.overallExposure>=45?"#f5928a":s.overallExposure>=18?"#8fb8ff":"#6fdcb5";
    $("exBand").textContent="/ 100 · "+(s.overallExposure>=45?"높음":s.overallExposure>=18?"보통":"양호");
    const barRow=(lb,v,color)=>`<div class="bar"><span class="lb">${lb}</span><div class="tr"><div class="fl" style="width:${Math.min(100,v)}%;background:${color}"></div></div><span class="vv" style="color:${color}">${v}</span></div>`;
    $("exBars").innerHTML=barRow("🤖 AI 자산",s.bands.aiAssetAvg,"#8b7cf0")+barRow("외부 노출",s.bands.externalAvg,"#f0a020")+barRow("내부 인프라",s.bands.internalAvg,"#1eb980");
    // OWASP 미대응
    const ow=s.owaspOpenByCode||[];
    $("owaspList").innerHTML=ow.length? ow.slice(0,5).map(o=>`<div class="arl"><span class="code">${esc(o.code)}</span>${esc(o.title)}<span class="n" style="color:${o.count>=3?"#f5928a":"#f7c777"}">${o.count}</span></div>`).join("")
      : '<div class="arl empty">AI 자산의 미대응 OWASP LLM 위험이 없습니다 👍</div>';
    // 취약점
    $("vulnBig").textContent=s.vuln.open;
    $("vulnBig").style.color=s.vuln.critical>0?"#f5928a":s.vuln.open>0?"#f7c777":"#6fdcb5";
    $("vulnSub").textContent="미조치 · KEV "+s.vuln.kev+"건";
    $("vulnBars").innerHTML=barRow("Critical",s.vuln.critical,"#e2483d")+barRow("High",s.vuln.high,"#f0a020")+barRow("Medium",s.vuln.medium,"#3b82f6");
  }

  function assetIcon(r){ return r.isAi?"🧠":(/web|웹/i.test(r.assetType)?"🌐":/db|데이터베이스/i.test(r.assetType)?"🗄":/vpn|방화|fw/i.test(r.assetType)?"🧱":"🖥"); }
  function cardHtml(r){
    const tags=[];
    if(r.isAi){ (r.owaspTopCodes||[]).slice(0,2).forEach(c=>tags.push(`<span class="tag llm">${esc(c)}</span>`)); }
    if(r.vuln.open) tags.push(`<span class="tag">취약점 ${r.vuln.open}</span>`);
    if(r.vuln.kev) tags.push(`<span class="tag" style="color:#f5928a">KEV ${r.vuln.kev}</span>`);
    if(r.isAi && r.sbomGenerated) tags.push('<span class="tag">SBOM ✓</span>');
    return `<div class="acard ${r.isAi?"ai":""} ${r.id===selId?"sel":""}" data-id="${esc(r.id)}">
      <div class="ac-top"><div class="ac-ic">${assetIcon(r)}</div>
        <div style="min-width:0"><div class="ac-nm">${esc(shownName(r))}${r.displayName?' <span class="alias">별칭</span>':""}</div><div class="ac-sub">${esc(r.assetType)}${r.host?" · "+esc(r.host):""}</div></div>
        <span class="risk r-${r.riskBand}">위험 ${r.exposureScore}</span></div>
      ${tags.length?`<div class="ac-tags">${tags.join("")}</div>`:""}
    </div>`;
  }
  // 화면에 보여줄 이름 — 별칭(displayName)이 있으면 그것, 없으면 원래 이름.
  function shownName(r){ return r.displayName || r.name; }
  function sevDots(v){
    const out=[];
    if(v.critical) out.push(`<span class="sd c">치명${v.critical}</span>`);
    if(v.high) out.push(`<span class="sd h">상${v.high}</span>`);
    if(v.medium) out.push(`<span class="sd m">중${v.medium}</span>`);
    if(v.low) out.push(`<span class="sd l">하${v.low}</span>`);
    return out.join("");
  }

  // 파일(출처) 기준 목록 — 파일 → 그 파일로 등록된 자산 → (클릭 시) 취약점.
  function renderMasterByFile(){
    const groups=OVERVIEW.sourceGroups||[];
    const byId=new Map(OVERVIEW.rows.map(r=>[r.id,r]));
    if(!groups.length){ $("master").innerHTML='<div class="empty-line">등록된 자산이 없습니다.</div>'; return; }
    $("master").innerHTML=groups.map(g=>{
      const rows=g.assetIds.map(id=>byId.get(id)).filter(Boolean);
      const when=g.lastScannedAt? new Date(g.lastScannedAt).toLocaleDateString("ko-KR") : null;
      const meta=[g.sourceFile? "파일 등록":"화면·챗봇 직접 등록", when? `최근 점검 ${when}`:null, g.vuln.open? `취약점 ${g.vuln.open}건`:"취약점 없음"].filter(Boolean).join(" · ");
      return `<div class="fgrp">
        <div class="fhd" data-src="${esc(g.sourceFile||"")}"><span>${g.sourceFile?"📄":"🤖"}</span><span class="nm" title="${esc(g.label)}">${esc(g.label)}</span><span class="cnt2">자산 ${g.assetCount}</span></div>
        <div class="fmeta">${esc(meta)}</div>
        <div class="fchild">${rows.map(r=>`<div class="arow ${r.id===selId?"sel":""}" data-id="${esc(r.id)}">
          <span class="an">${esc(shownName(r))}${r.displayName?' <span class="alias">별칭</span>':""}</span>${sevDots(r.vuln)}</div>`).join("")}</div>
      </div>`;
    }).join("");
    $("master").querySelectorAll(".arow").forEach(el=>el.addEventListener("click",()=>selectAsset(el.dataset.id)));
    $("master").querySelectorAll(".fhd").forEach(el=>el.addEventListener("click",()=>{
      // 파일 헤더 클릭 = 그 파일의 첫 자산 선택(파일 요약은 상세의 '출처 파일' 구역에 있다)
      const g=(OVERVIEW.sourceGroups||[]).find(x=>(x.sourceFile||"")===el.dataset.src);
      if(g&&g.assetIds.length) selectAsset(g.assetIds[0]);
    }));
  }

  function renderMaster(){
    if(listMode==="file") return renderMasterByFile();
    const rows=OVERVIEW.rows;
    const ai=rows.filter(r=>r.isAi), it=rows.filter(r=>!r.isAi);
    let html="";
    html+=`<div class="sec-h">🤖 AI 자산 <span class="ai-badge">중점관리</span><span class="cnt">${ai.length}</span></div>`;
    html+= ai.length? ai.map(cardHtml).join("") : '<div class="empty-line">AI 자산이 없습니다.</div>';
    html+=`<div class="sec-h" style="margin-top:14px">🖥 일반 IT 자산 <span class="cnt">${it.length}</span></div>`;
    html+= it.length? it.map(cardHtml).join("") : '<div class="empty-line">IT 자산이 없습니다.</div>';
    $("master").innerHTML=html;
    $("master").querySelectorAll(".acard").forEach(el=>el.addEventListener("click",()=>selectAsset(el.dataset.id)));
  }

  const OW_MITI="OWASP LLM Top 10(2025) 기준을 자산의 AI-BOM 기재 상태·레드팀 견고성으로 자동 도출한 값입니다(별도 침투테스트 아님).";
  async function selectAsset(id){
    selId=id;
    $("master").querySelectorAll(".acard").forEach(el=>el.classList.toggle("sel",el.dataset.id===id));
    $("detail").innerHTML='<div class="d-empty">불러오는 중…</div>';
    let d; try{ d=await window.gijo.assetHubDetail(id); }catch(e){ $("detail").innerHTML='<div class="d-empty">상세를 불러오지 못했습니다: '+esc(e&&e.message||e)+'</div>'; return; }
    renderDetail(d);
  }
  function renderDetail(d){
    const r=d.row, b=r.bomAreas;
    const owOpen=d.owasp.filter(o=>o.status==="open").length;
    const head=`<div class="d-head"><span style="font-size:24px">${assetIcon(r)}</span><div class="d-nm">${esc(shownName(r))}${r.displayName?' <span class="alias">별칭</span>':""}</div>
      <span class="risk r-${r.riskBand}" style="font-size:10.5px">위험 ${r.exposureScore} · ${bandLabel[r.riskBand]}</span>
      ${r.isAi?'<span class="ai-badge">AI 자산</span>':""}
      <button class="btn-s p" id="renameBtn" style="margin-left:auto">✎ 이름 변경</button></div>
      <div class="d-sub">${esc(r.assetType)}${r.owner?" · 소유: "+esc(r.owner):""}${r.host?" · "+esc(r.host):""}${r.service?" · 서비스: "+esc(r.service):""}</div>
      ${r.displayName?`<div class="src-line">원래 이름 ${esc(r.name)} · ID ${esc(r.id)}</div>`:`<div class="src-line">ID ${esc(r.id)}</div>`}
      ${r.sourceFile?`<div class="src-line">출처 파일 <b>${esc(r.sourceFile)}</b></div>`:""}
      <div class="rn" id="renameBox" style="display:none">
        <div class="row"><input id="renameInput" maxlength="120" placeholder="보기 쉬운 이름"><button class="btn-s p" id="renameSave">저장</button><button class="btn-s" id="renameReset">원래대로</button></div>
      </div>`;
    const tabs=`<div class="tabs">
      <div class="tab ${curTab==="overview"?"on":""}" data-tab="overview">개요</div>
      <div class="tab ${curTab==="bom"?"on":""}" data-tab="bom">AI-BOM 구성</div>
      <div class="tab ${curTab==="vuln"?"on":""}" data-tab="vuln">취약점${r.vuln.open?` <span class="b">${r.vuln.open}</span>`:""}</div>
      ${r.isAi?`<div class="tab ${curTab==="ai"?"on":""}" data-tab="ai">AI 위험 (OWASP LLM)${owOpen?` <span class="b">${owOpen}</span>`:""}</div>`:""}
    </div>`;
    let body="";
    if(curTab==="overview"){
      body=`<div class="cards">
        <div class="kc"><div class="l">종합 위험도</div><div class="v" style="color:${r.exposureScore>=45?"#f5928a":"#8fb8ff"}">${r.exposureScore}</div></div>
        <div class="kc"><div class="l">미조치 취약점</div><div class="v" style="color:${r.vuln.open?"#f7c777":"#6fdcb5"}">${r.vuln.open}</div></div>
        <div class="kc"><div class="l">AI-BOM 기재</div><div class="v">${b.total}</div></div>
        <div class="kc"><div class="l">${r.isAi?"OWASP LLM 노출":"KEV"}</div><div class="v" style="color:${r.isAi?"#c9b8ff":"#f5928a"}">${r.isAi?owOpen:r.vuln.kev}</div></div>
      </div>`;
      // AI-BOM 5영역 블록 제거(2026-07-26) — AI 자산이면 전용 화면 링크만. 값 없는 "0" 나열을 없앤다.
      if(r.isAi) body+=`<div class="block"><div class="bh">🧠 AI 구성(AI-BOM) <span class="link" data-page="sbom.html" style="cursor:pointer">AI-BOM에서 보기 →</span></div><div class="note">파운데이션 모델·파인튜닝 이력·데이터 출처·벡터DB·가드레일은 AI-BOM 화면에서 관리합니다.</div></div>`;
      if(r.isAi) body+=`<div class="block"><div class="bh">⚠ AI 위험 요약 <span class="link" data-tab-jump="ai">전체 보기 →</span></div>${owaspRows(d.owasp.filter(o=>o.status==="open").slice(0,3),true)||'<div class="empty-line">미대응 AI 위험이 없습니다 👍</div>'}</div>`;
      body+=`<div class="block"><div class="bh">🩹 취약점 <span class="link" data-tab-jump="vuln">전체 보기 →</span></div>${vulnTable(d.findings.slice(0,3))}</div>`;
      // 출처 파일 요약 — 같은 파일로 들어온 다른 자산까지 한자리에서 본다(파일 기준 정리).
      if(r.sourceFile){
        const g=(OVERVIEW&&OVERVIEW.sourceGroups||[]).find(x=>x.sourceFile===r.sourceFile);
        const byId=new Map((OVERVIEW&&OVERVIEW.rows||[]).map(x=>[x.id,x]));
        const sibs=g? g.assetIds.map(id=>byId.get(id)).filter(Boolean) : [];
        body+=`<div class="block"><div class="bh">📄 출처 파일</div>
          <div style="font-size:12px;color:#dfe6ff;font-weight:700;margin-bottom:5px">${esc(r.sourceFile)}</div>
          <div style="font-size:11px;color:var(--muted);line-height:1.75">
            이 파일의 자산 ${sibs.length}개 · 취약점 ${g?g.vuln.open:0}건${g&&g.lastScannedAt?` · 최근 점검 ${new Date(g.lastScannedAt).toLocaleDateString("ko-KR")}`:""}<br>
            ${sibs.map(x=>`<span class="link" data-jump-asset="${esc(x.id)}">${esc(shownName(x))}</span>(${x.vuln.open})`).join(" · ")}
          </div></div>`;
      }
    } else if(curTab==="bom"){
      // 5영역 상세는 AI-BOM 화면으로 일원화(2026-07-26) — 여기선 안내만.
      body=`<div class="block"><div class="bh">🧠 AI 구성(AI-BOM)</div><div class="note">파운데이션 모델·파인튜닝 이력·데이터 출처·벡터DB·가드레일 명세는 <span class="link" data-page="sbom.html" style="cursor:pointer;color:var(--blue-light)">AI-BOM 화면</span>에서 관리합니다.</div></div>`;
    } else if(curTab==="vuln"){
      body=`<div class="block"><div class="bh">🩹 취약점 ${r.host?`<span style="font-size:10px;color:var(--muted-2);font-weight:600">(${esc(r.host)} 연결)</span>`:""}</div>${vulnTable(d.findings)}<div class="note">취약점 반입·재스캔은 <span class="link" data-page="vulnscan.html" style="cursor:pointer;color:var(--blue-light)">취약점 화면</span>에서.</div></div>`;
    } else if(curTab==="ai"){
      body=`<div class="block"><div class="bh">⚠ AI 위험 — OWASP LLM Top 10 (2025)</div>${owaspRows(d.owasp,false)}<div class="note">${OW_MITI}</div></div>`;
    }
    $("detail").innerHTML=head+tabs+body;
    $("detail").querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{curTab=t.dataset.tab;renderDetail(d);}));
    $("detail").querySelectorAll("[data-tab-jump]").forEach(el=>el.addEventListener("click",()=>{curTab=el.dataset.tabJump;renderDetail(d);}));
    $("detail").querySelectorAll("[data-page]").forEach(el=>el.addEventListener("click",()=>window.gijo.navigateTo(el.dataset.page)));
    $("detail").querySelectorAll("[data-jump-asset]").forEach(el=>el.addEventListener("click",()=>selectAsset(el.dataset.jumpAsset)));
    // 표시 이름(별칭) 변경 — 원래 이름·ID는 서버가 보존한다(설명은 ⓘ '표시 이름').
    const rb=$("renameBtn"), box=$("renameBox"), inp=$("renameInput");
    if(rb&&box&&inp){
      rb.addEventListener("click",()=>{ const open=box.style.display!=="none"; box.style.display=open?"none":"block"; if(!open){ inp.value=r.displayName||r.name; inp.focus(); } });
      const apply=async(val)=>{
        try{
          await window.gijo.setAssetDisplayName(r.id,val);
          OVERVIEW=await window.gijo.assetHub();   // 목록·묶음 라벨 즉시 갱신
          renderMaster();
          await selectAsset(r.id);
        }catch(e){ alert("이름 변경 실패: "+e.message); }
      };
      $("renameSave").addEventListener("click",()=>apply(inp.value.trim()));
      $("renameReset").addEventListener("click",()=>apply(null));
      inp.addEventListener("keydown",(e)=>{ if(e.key==="Enter") apply(inp.value.trim()); });
    }
  }
  function bomGrid(b){
    const cell=(ic,nm,n)=>`<div class="bom"><div class="ic">${ic}</div><div class="nm">${nm}</div><div class="n" style="color:${n?"#e7eaf3":"#5f6785"}">${n}</div></div>`;
    return `<div class="bom-grid">${cell("🧠","모델",b.model)}${cell("📊","데이터셋",b.dataset)}${cell("💬","프롬프트",b.prompt)}${cell("🔧","에이전트 도구",b.agentTool)}${cell("☁","인프라",b.infrastructure)}</div>`;
  }
  function bomDetail(bom){
    const row=(lb,v)=>`<tr><td style="color:var(--muted);width:130px">${lb}</td><td>${v&&v.trim()?esc(v):'<span style="color:var(--muted-2)">미기재</span>'}</td></tr>`;
    return `<div class="block"><div class="bh">📋 AI-BOM 상세</div><table>
      ${row("파운데이션 모델",bom.model.foundationModel)}${row("파인튜닝 이력",bom.model.finetuneHistory)}${row("데이터 출처",bom.dataset.sources)}
      ${row("벡터DB",bom.dataset.vectorDbLocation)}${row("가드레일",bom.prompt.guardrails)}${row("에이전트 API",bom.agentTool.apis)}${row("호스팅",bom.infrastructure.hostingProvider)}
    </table></div>`;
  }
  function owaspRows(list,compact){
    if(!list.length) return "";
    return `<div class="owasp">${list.map(o=>`<div class="ow"><span class="code">${esc(o.code)}</span>
      <div class="txt"><b>${esc(o.title)}</b>${compact?"":`<div class="ev">${esc(o.evidence)}</div>`}</div>
      <span class="st ${o.status}">${o.status==="open"?"미대응":o.status==="covered"?"대응":"해당없음"}</span></div>`).join("")}</div>`;
  }
  function vulnTable(findings){
    if(!findings.length) return '<div class="empty-line">미조치 취약점이 없습니다 👍</div>';
    return `<table><tr><th>취약점</th><th>심각도</th><th>상태</th></tr>${findings.map(f=>`<tr>
      <td>${esc(f.title)}${f.kev?'<span class="kev-b">KEV</span>':""}</td>
      <td class="sev ${esc(f.severity)}">${f.severity}</td><td>${esc(f.state)}</td></tr>`).join("")}</table>`;
  }

  async function boot(){
    tick(); setInterval(tick,30000); loadHealth(); loadUser();
    // 목록 보기 전환(자산별 ↔ 파일별) — 선택은 기억한다.
    $("hubSeg").querySelectorAll("span").forEach(el=>el.addEventListener("click",()=>{
      listMode=el.dataset.mode;
      try{ localStorage.setItem("gijo:assethub:mode",listMode); }catch(e){}
      $("hubSeg").querySelectorAll("span").forEach(x=>x.classList.toggle("on",x.dataset.mode===listMode));
      if(OVERVIEW) renderMaster();
    }));
    $("hubSeg").querySelectorAll("span").forEach(x=>x.classList.toggle("on",x.dataset.mode===listMode));
    try{
      OVERVIEW=await window.gijo.assetHub();
      renderSummary(OVERVIEW.summary);
      renderMaster();
      if(OVERVIEW.rows.length) selectAsset(OVERVIEW.rows[0].id); // 첫 자산(최고위험 AI) 자동 선택
    }catch(e){
      $("master").innerHTML='<div class="empty-line">자산 허브를 불러오지 못했습니다: '+esc(e&&e.message||e)+'</div>';
    }
    loadShadowAi();
  }

  // ② Shadow AI — 미등록 AI 모델이 있으면 상단 배너로 경고(없으면 숨김).
  async function loadShadowAi(){
    try{
      var r=await window.gijo.shadowAi();
      if(!r||!r.shadow||!r.shadow.length) return;
      if(!$("shadowAiCount")) return; // 이관됨(2026-07-26)
      $("shadowAiCount").textContent=r.shadow.length+"개 발견";
      $("shadowAiList").innerHTML=r.shadow.map(function(s){
        var tag=s.severity==="high"?'<span style="color:#f5928a;font-weight:800">⚠사용 중</span>':'<span style="color:var(--muted-2)">배치만</span>';
        var used=s.usedByAgents&&s.usedByAgents.length?" · 사용: "+esc(s.usedByAgents.join(", ")):"";
        return "• "+tag+" <b style=\"color:#fff\">"+esc(s.modelId)+"</b> <span style=\"color:var(--muted-2)\">("+esc(s.sources.join(", "))+used+")</span>";
      }).join("<br>");
      if($("shadowAiBanner")) $("shadowAiBanner").style.display="block"; // 배너는 AI-BOM으로 이관 — 요소 없으면 무시
    }catch(e){/* 미지원·조회 실패는 조용히 무시 — 배너만 안 뜬다 */}
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot); else boot();
})();
</script>
<script src="nav.js"></script>
<script src="chatwidget.js"></script>
</body></html>
