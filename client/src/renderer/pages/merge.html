<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIJO AS — 보안 LLM 합성</title>
<style>
:root{
  --bg:#0a0e1a;--panel:#121a2e;--panel-2:#0e1526;--border:rgba(255,255,255,0.08);
  --border-strong:rgba(255,255,255,0.16);--blue:#3b82f6;--blue-light:#5fa1ff;--white:#ffffff;
  --text:#e7eaf3;--muted:#8b93ab;--muted-2:#5f6785;--red:#e2483d;--amber:#f0a020;--teal:#1eb980;--purple:#8b7cf0;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Pretendard","Malgun Gothic","Segoe UI",sans-serif;background:var(--bg);color:var(--text);}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 32px;background:var(--panel-2);border-bottom:1px solid var(--border);}
.brand{display:flex;align-items:center;gap:14px;}
.brand img{height:26px;width:auto;}
.brand-divider{width:1px;height:22px;background:var(--border-strong);}
.product-name{font-size:17px;font-weight:800;letter-spacing:0.3px;}
.product-name span{color:var(--blue-light);}
.product-tag{font-size:10.5px;color:var(--muted-2);font-weight:700;letter-spacing:1.4px;margin-top:1px;}
.topnav{display:flex;gap:28px;}
.topnav a{color:var(--muted);text-decoration:none;font-size:13.5px;font-weight:600;padding:6px 2px;border-bottom:2px solid transparent;}
.topnav a.active{color:var(--white);border-bottom-color:var(--blue);}
.user-chip{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;}
.app{display:grid;grid-template-columns:220px 1fr;}
.sidebar{padding:22px 14px;border-right:1px solid var(--border);min-height:900px;}
.nav-section{font-size:10.5px;font-weight:700;color:var(--muted-2);letter-spacing:1.2px;margin:18px 10px 8px;}
.nav-section:first-child{margin-top:0;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;margin-bottom:2px;}
.nav-item .ic{width:18px;text-align:center;font-size:14px;}
.nav-item.active{background:rgba(59,130,246,0.12);color:var(--white);box-shadow:inset 3px 0 0 var(--blue);}
.nav-item:hover:not(.active){background:rgba(255,255,255,0.04);color:var(--white);}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:10px;font-weight:800;padding:1px 6px;border-radius:20px;}
.main{padding:28px 32px 48px;}
.topbar-row{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;}
.page-title{font-size:21px;font-weight:800;color:#fff;}
.page-sub{font-size:12.5px;color:var(--muted);margin-top:4px;}
.btn-primary{background:var(--blue);color:#fff;border:none;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;}
.btn-ghost{background:transparent;border:1px solid var(--border-strong);color:var(--text);padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;}
.kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
.kpi-strip.c5{grid-template-columns:repeat(5,1fr);}
.kpi-mini{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
.kpi-mini-label{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:6px;}
.kpi-mini-value{font-size:19px;font-weight:800;color:#fff;}
.toolbar{display:flex;justify-content:space-between;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:12px 12px 0 0;padding:14px 18px;border-bottom:none;}
.search{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:1px solid var(--border-strong);border-radius:8px;padding:8px 14px;width:280px;}
.search input{background:transparent;border:none;outline:none;color:var(--text);font-size:13px;width:100%;}
.search input::placeholder{color:var(--muted-2);}
.filters{display:flex;gap:8px;}
.filter-chip{background:var(--panel-2);border:1px solid var(--border-strong);color:var(--muted);padding:7px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;}
.filter-chip.active{background:rgba(59,130,246,0.15);border-color:var(--blue);color:var(--blue-light);}
.table-panel{background:var(--panel);border:1px solid var(--border);border-radius:0 0 12px 12px;padding:0 18px 10px;margin-bottom:16px;}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px;}
.panel-title{font-size:14.5px;font-weight:800;color:#fff;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;}
.panel-sub{font-size:11.5px;color:var(--muted);margin-bottom:14px;}
.panel-link{font-size:12px;color:var(--blue-light);font-weight:700;cursor:pointer;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;font-size:10.5px;font-weight:700;padding:12px 10px;color:var(--muted-2);text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid var(--border);}
td{padding:13px 10px;border-bottom:1px solid var(--border);color:var(--text);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.asset-name{font-weight:700;color:#fff;}
.asset-sub{font-size:11px;color:var(--muted-2);margin-top:2px;}
.badge{display:inline-block;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:700;}
.b-blue{background:rgba(59,130,246,0.15);color:var(--blue-light);}
.b-teal{background:rgba(30,185,128,0.15);color:var(--teal);}
.b-amber{background:rgba(240,160,32,0.15);color:var(--amber);}
.b-red{background:rgba(226,72,61,0.15);color:#f5928a;}
.b-purple{background:rgba(139,124,240,0.15);color:var(--purple);}
.row-actions{color:var(--blue-light);font-size:12px;font-weight:700;cursor:pointer;}
.pagination{display:flex;justify-content:space-between;align-items:center;padding:14px 4px 4px;font-size:12px;color:var(--muted);}
.page-btns{display:flex;gap:6px;}
.page-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--border-strong);background:var(--panel-2);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;}
.page-btn.active{background:var(--blue);border-color:var(--blue);color:#fff;}
.footer{margin-top:8px;padding:18px 0 0;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--muted-2);}
.footer img{height:16px;opacity:0.6;}
.progress-track{height:7px;border-radius:20px;background:rgba(255,255,255,0.08);overflow:hidden;margin-top:8px;}
.progress-fill{height:100%;border-radius:20px;}
.content-grid{display:grid;grid-template-columns:1.7fr 1fr;gap:16px;}

.titlebar{display:flex;align-items:center;justify-content:space-between;background:#0d1220;padding:6px 12px;border-bottom:1px solid var(--border);font-size:11.5px;color:var(--muted);}
.titlebar-left{display:flex;align-items:center;gap:8px;}
.titlebar-left img{height:14px;}
.win-dots{display:flex;gap:14px;color:var(--muted-2);font-size:13px;}
.menubar{display:flex;gap:18px;background:#0a0e1a;padding:6px 14px;border-bottom:1px solid var(--border);font-size:12px;color:var(--muted);}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--panel-2);}
.header-left{display:flex;align-items:center;gap:12px;}
.header-left img{height:22px;}
.app-title{font-size:15px;font-weight:800;color:#fff;}
.clock{font-size:12px;color:var(--blue-light);font-weight:600;}
.header-right{display:flex;align-items:center;gap:10px;}
.status-pill{display:flex;align-items:center;gap:6px;background:rgba(30,185,128,0.15);border:1px solid rgba(30,185,128,0.4);color:var(--teal);padding:6px 14px;border-radius:20px;font-size:12px;font-weight:800;}
.status-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);}
.beta-tag{background:var(--teal);color:#06281c;font-size:9px;font-weight:800;padding:1px 6px;border-radius:4px;margin-left:2px;}
.icon-row{display:flex;gap:6px;}
.icon-btn{width:32px;height:32px;border-radius:8px;background:var(--panel);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted);cursor:pointer;}
.icon-btn.on{background:rgba(59,130,246,0.18);border-color:var(--blue);color:var(--blue-light);}
.avatar-btn{width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;}
</style>
</head>
<body>




<div class="header">
  <div class="header-left">
    <span id="homeLink" data-page="dashboard.html" title="대시보드로 이동" style="display:flex;align-items:center;gap:12px;cursor:pointer"><img src="gijo-wordmark.svg" alt="GIJO">
    <div class="app-title">GIJO AS</div></span>
    <div class="clock" id="clockEl">-</div>
  </div>
  <div class="header-right">
    <div class="status-pill" id="statusPill"><span class="dot"></span>연결 확인 중<span class="beta-tag">LIVE</span></div>
    <div class="icon-row">
      <div class="icon-btn">▤</div>
      <div class="icon-btn">▢</div>
      <div class="icon-btn">●</div>
      <div class="icon-btn">◉</div>
      <div class="icon-btn">⬡</div>
      <div class="icon-btn">$</div>
      <div class="icon-btn">+</div>
    </div>
    <div class="avatar-btn" id="avatarBtn">-</div>
    <div class="icon-btn" id="settingsBtn">⚙</div>
  </div>
</div>

<div class="app">
  <div class="sidebar" id="gijoNav"></div>

  <div class="main">
    <div class="topbar-row">
      <div>
        <div class="page-title">보안 LLM 합성</div>
      </div>
    </div>

    <div class="panel" data-gijo-fold="보안 특화 LLM 도감">
      <div class="panel-title" style="display:block;margin-bottom:2px;">📖 보안 특화 LLM 도감</div>
      <div class="panel-sub">실제 공개된 보안 전용 LLM만 모았습니다. 같은 <b>아키텍처·크기</b>끼리(같은 색 그룹) 합성 가능합니다.</div>
      <div id="dexBody"><div style="color:var(--muted)">불러오는 중...</div></div>
    </div>

    <div class="panel">
      <div class="panel-title" style="display:block;">🧬 합성하기 <span class="badge b-amber" style="margin-left:6px;">SLERP · R&D</span></div>
      <div class="panel-sub">설정(YAML)·실행 명령을 생성합니다.</div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px;">
        <select id="modelA" style="flex:1;min-width:200px;background:var(--panel-2);border:1px solid var(--border-strong);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13px;"></select>
        <span style="color:var(--blue-light);font-weight:800;">+</span>
        <select id="modelB" style="flex:1;min-width:200px;background:var(--panel-2);border:1px solid var(--border-strong);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13px;"></select>
        <button class="btn-primary" id="planBtn">합성 계획</button>
      </div>
      <div id="planResult" style="font-size:12.5px;margin-top:12px;"></div>
    </div>


    <div class="footer">
      <img src="gijo-symbol.svg" alt="GIJO">
      <span>© 2026 GIJO Technology · GIJO AS Platform · Confidential</span>
    </div>
  </div>
</div>

<script>
  const clockEl = document.getElementById("clockEl");
  const statusPill = document.getElementById("statusPill");
  const avatarBtn = document.getElementById("avatarBtn");

  function tick() {
    clockEl.textContent = new Date().toLocaleString("ko-KR", {
      hour: "2-digit", minute: "2-digit", hour12: true, year: "numeric", month: "2-digit", day: "2-digit",
    });
  }

  const ARCH_COLOR = { mistral: "rgba(139,124,240,0.14)", llama: "rgba(59,130,246,0.14)", qwen2: "rgba(30,185,128,0.14)", other: "rgba(139,147,171,0.12)" };
  const ARCH_TEXT = { mistral: "var(--purple)", llama: "var(--blue-light)", qwen2: "var(--teal)", other: "var(--muted)" };
  let dexModels = [];

  function esc(s) { return String(s == null ? "" : s).replace(/</g, "&lt;"); }

  function modelCard(m) {
    const c = ARCH_COLOR[m.arch] || ARCH_COLOR.other, t = ARCH_TEXT[m.arch] || ARCH_TEXT.other;
    return `<div style="background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:13px 15px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
        <div style="font-weight:800;color:#fff;font-size:13px;">${esc(m.name)}${m.note ? ` <span style="font-size:10px;color:var(--teal);font-weight:700;">· ${esc(m.note)}</span>` : ""}</div>
        <span style="background:${c};color:${t};border-radius:5px;padding:1px 7px;font-size:10px;font-weight:800;white-space:nowrap;">${esc(m.arch)} · ${esc(m.size)}</span>
      </div>
      <div style="font-size:11.5px;color:var(--text);margin:5px 0;">${esc(m.focus)}</div>
      <div style="font-size:10.5px;color:var(--muted-2);">기반: ${esc(m.base)} · 언어: ${esc(m.lang)} · <span style="color:var(--blue-light);">${esc(m.id)}</span></div>
    </div>`;
  }

  async function loadDex() {
    const body = document.getElementById("dexBody");
    try {
      const { models, groups } = await window.gijo.listModelDex();
      dexModels = models;
      body.innerHTML = groups.map((g) => {
        const compat = g.models.length > 1 ? `<span style="color:var(--teal);font-size:10.5px;">✓ 그룹 내 합성 가능</span>` : `<span style="color:var(--muted-2);font-size:10.5px;">합성하려면 같은 구조 모델 필요</span>`;
        return `<div style="margin-bottom:14px;">
          <div style="font-size:11px;color:var(--muted);font-weight:700;margin-bottom:6px;">${g.arch} 계열 (${g.models.length}) &nbsp;${compat}</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">${g.models.map(modelCard).join("")}</div>
        </div>`;
      }).join("");
      // 합성 셀렉트 채우기
      const opts = ['<option value="">모델 선택...</option>'].concat(models.map((m) => `<option value="${m.id}" data-arch="${m.arch}" data-size="${m.size}">${esc(m.name)} (${m.arch}·${m.size})</option>`)).join("");
      document.getElementById("modelA").innerHTML = opts;
      document.getElementById("modelB").innerHTML = opts;
    } catch (e) {
      body.innerHTML = '<div style="color:#f5928a">도감을 불러오지 못했습니다: ' + e.message + "</div>";
    }
  }

  async function planSynthesis() {
    const idA = document.getElementById("modelA").value;
    const idB = document.getElementById("modelB").value;
    const r = document.getElementById("planResult");
    if (!idA || !idB) { r.innerHTML = '<span style="color:var(--amber)">두 모델을 모두 선택하세요.</span>'; return; }
    r.innerHTML = '<span style="color:var(--muted)">합성 설정 생성 중...</span>';
    try {
      // 서버가 호환성 검증 + mergekit 설정(YAML) 생성 + 실행 명령을 돌려준다. 준비물도 함께 점검.
      const [plan, pf] = await Promise.all([
        window.gijo.planMerge(idA, idB),
        window.gijo.mergePreflight(idA, idB).catch(() => null),
      ]);
      if (!plan.ok) {
        r.innerHTML = `<span style="color:#f5928a">✕ 합성 불가 — ${esc(plan.reason || "")}</span>`;
        return;
      }
      const a = plan.modelA, b = plan.modelB;
      const pfHtml = pf
        ? `<div style="margin-top:10px;font-size:11.5px;">준비물 점검: ` +
          pf.checks.map((c) => `<span style="color:${c.ok ? "var(--teal)" : (c.required ? "#f5928a" : "var(--amber)")}">${c.ok ? "✓" : "✗"} ${esc(c.label)}${!c.ok && c.hint ? ` <span style="color:var(--muted-2)">(${esc(c.hint)})</span>` : ""}</span>`).join(" &nbsp; ") +
          `<div style="color:${pf.ready ? "var(--teal)" : "var(--amber)"};margin-top:4px;font-weight:700;">${pf.ready ? "✓ 실행 준비 완료 — 아래 명령을 GPU 머신에서 실행하세요." : "⚠ 빠진 준비물이 있습니다 — 위 힌트대로 갖춘 뒤 실행하세요."}</div></div>`
        : "";
      r.innerHTML = `<div style="background:var(--panel-2);border:1px solid rgba(30,185,128,0.35);border-radius:8px;padding:12px 14px;">
        <div style="color:var(--teal);font-weight:800;margin-bottom:6px;">✓ 합성 가능 → 설정 생성됨</div>
        <div style="color:var(--text);line-height:1.8;">
          <b>${esc(a.name)}</b> + <b>${esc(b.name)}</b> → <b style="color:var(--blue-light)">${esc(plan.outputModelId)}</b><br>
          방식: SLERP (구면 선형 보간, t=0.5) · 구조: ${esc(a.arch)} · ${esc(a.size)}<br>
          결합 강점: ${esc(a.focus)} <span style="color:var(--muted-2)">+</span> ${esc(b.focus)}
        </div>
        <div style="margin-top:10px;font-size:11px;color:var(--muted);">설정 저장됨: <span style="color:var(--blue-light)">${esc(plan.configPath)}</span></div>
        <div style="margin-top:6px;font-size:10.5px;color:var(--muted);font-weight:700;">mergekit 설정 (YAML)</div>
        <pre style="background:#05070d;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:10.5px;color:#8fd6a8;overflow-x:auto;white-space:pre;margin-top:4px;">${esc(plan.config)}</pre>
        <div style="margin-top:8px;font-size:10.5px;color:var(--muted);font-weight:700;">실행 명령 (GPU 머신)</div>
        <pre style="background:#05070d;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:10.5px;color:var(--blue-light);overflow-x:auto;white-space:pre;margin-top:4px;">${esc((plan.commands || []).join("\n"))}</pre>
        ${pfHtml}
      </div>`;
    } catch (e) {
      r.innerHTML = '<span style="color:#f5928a">합성 계획 생성 실패: ' + esc(e.message) + '</span>';
    }
  }

  async function init() {
    tick();
    setInterval(tick, 30000);
    try {
      await window.gijo.checkServerHealth();
      statusPill.innerHTML = '<span class="dot"></span>운영중<span class="beta-tag">LIVE</span>';
    } catch (e) {
      statusPill.innerHTML = '<span class="dot" style="background:#e2483d"></span>서버 연결 끊김';
    }
    try {
      const user = await window.gijo.me();
      avatarBtn.textContent = (user.displayName || user.username || "-").charAt(0);
    } catch (e) {}
    await loadDex();
    document.getElementById("planBtn").addEventListener("click", planSynthesis);
    document.getElementById("settingsBtn").addEventListener("click", () => window.gijo.navigateTo("settings.html"));
    document.querySelectorAll("[data-page]").forEach((el) => {
      el.addEventListener("click", () => window.gijo.navigateTo(el.dataset.page));
    });
  }

  if (!window.gijo.isAuthenticated()) {
    window.gijo.navigateTo("login.html");
  } else {
    init();
  }
</script>



<div id="gijoChatWidget" data-prompts='["합성 가능한 모델 조합 알려줘"]'></div>
<script src="nav.js"></script>
<script src="chatwidget.js"></script>
</body>
</html>
