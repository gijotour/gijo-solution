<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIJO AS — 내 업무</title>
<style>
  :root{
    --bg:#0a0e1a;--panel:#121a2e;--panel-2:#0e1526;--border:rgba(255,255,255,0.08);
    --border-strong:rgba(255,255,255,0.16);--blue:#3b82f6;--blue-light:#5fa1ff;--white:#ffffff;
    --text:#e7eaf3;--muted:#8b93ab;--muted-2:#5f6785;--red:#e2483d;--amber:#f0a020;--teal:#1eb980;--purple:#8b7cf0;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Pretendard","Malgun Gothic","Segoe UI",sans-serif;background:#05070d;color:var(--text);}
  .header{display:flex;justify-content:space-between;align-items:center;padding:12px 22px;border-bottom:1px solid var(--border);background:var(--bg);}
  .header-left,.header-right{display:flex;align-items:center;gap:14px;}
  .header img{height:22px;}
  .app-title{font-size:14px;font-weight:800;color:#fff;}
  .clock{font-size:12px;color:var(--muted);}
  .status-pill{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--teal);background:rgba(30,185,128,0.1);border:1px solid rgba(30,185,128,0.25);border-radius:20px;padding:5px 12px;}
  .status-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--teal);}
  .beta-tag{font-size:9px;font-weight:800;color:var(--muted-2);letter-spacing:.5px;}
  .avatar-btn{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;}
  .icon-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;}
  .app{display:flex;min-height:calc(100vh - 55px);background:var(--bg);}
  .sidebar{border-right:1px solid var(--border);background:#0b1020;}
  .mw-main{flex:1;padding:16px 20px 34px;min-width:0;max-width:1100px;}

  .scr-id{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:11px;flex-wrap:wrap;}
  .scr-id b{color:var(--text);font-weight:800;}
  .scr-id .ask{color:var(--blue-light);cursor:pointer;font-weight:700;}
  .scr-id .ask:hover{text-decoration:underline;}
  .legend{display:flex;gap:13px;flex-wrap:wrap;font-size:10.5px;color:var(--muted);margin-bottom:12px;}
  .legend i{display:inline-block;width:3px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;}

  /* ① 지금 이거 — 들어오자마자 가장 급한 일이 이미 펼쳐져 있다(고르는 판단을 없앤다) */
  .now{background:linear-gradient(135deg,rgba(226,72,61,.10),rgba(18,26,46,.7));border:1px solid rgba(226,72,61,.4);
    border-radius:14px;overflow:hidden;margin-bottom:14px;}
  .now.ok{background:linear-gradient(135deg,rgba(30,185,128,.09),rgba(18,26,46,.7));border-color:rgba(30,185,128,.35);}
  .now.calm{background:linear-gradient(135deg,rgba(59,130,246,.09),rgba(18,26,46,.7));border-color:rgba(59,130,246,.32);}
  .now-h{padding:14px 18px 12px;}
  .now-k{font-size:10.5px;font-weight:800;letter-spacing:.4px;color:var(--red);margin-bottom:6px;}
  .now.calm .now-k{color:var(--blue-light);}
  .now.ok .now-k{color:var(--teal);}
  .now-t{font-size:19px;font-weight:800;color:#fff;letter-spacing:-.3px;}
  .now-w{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6;}
  .now-w b{color:var(--amber);font-weight:700;}
  .now-bar{display:flex;align-items:center;gap:9px;margin-top:12px;}
  .trk{flex:1;height:5px;background:rgba(0,0,0,.35);border-radius:3px;overflow:hidden;}
  .trk i{display:block;height:100%;background:var(--teal);width:0%;transition:width .2s;}
  .now-cnt{font-size:11px;color:var(--teal);font-weight:800;white-space:nowrap;}

  /* 다음 한 걸음만 크게 — 나머지는 접어 둔다(점진적 공개) */
  .step-now{margin:0 18px 12px;background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.4);
    border-radius:11px;padding:13px 15px;display:flex;align-items:center;gap:13px;flex-wrap:wrap;}
  .step-n{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;
    font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;}
  .step-b{flex:1;min-width:150px;}
  .step-t{font-size:14px;font-weight:800;color:#fff;}
  .step-d{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.6;}
  .step-d .q{color:var(--blue-light);}
  .big{background:var(--blue);border:none;border-radius:9px;color:#fff;font-size:13px;font-weight:800;
    padding:10px 20px;cursor:pointer;font-family:inherit;white-space:nowrap;}
  .rest{margin:0 18px 12px;font-size:11.5px;color:var(--muted-2);cursor:pointer;user-select:none;}
  .rest:hover{color:var(--blue-light);}
  .rest-open{margin:0 18px 12px;}
  .rs{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-top:1px solid rgba(255,255,255,.05);}
  .rs-n{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--panel-2);border:1px solid var(--border-strong);
    color:var(--muted);font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .rs.done .rs-n{background:rgba(30,185,128,.2);border-color:transparent;color:var(--teal);}
  .rs-b{flex:1;min-width:0;}
  .rs-t{font-size:12px;font-weight:700;}
  .rs.done .rs-t{color:var(--muted);}
  .rs-d{font-size:11px;color:var(--muted-2);margin-top:2px;}
  .rs-go{flex:0 0 auto;background:transparent;border:1px solid var(--border-strong);border-radius:7px;color:var(--muted);
    font-size:11px;padding:5px 10px;cursor:pointer;font-family:inherit;}
  .now-f{padding:10px 18px;background:rgba(0,0,0,.2);border-top:1px solid var(--border);
    display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted);}
  .mini{background:transparent;border:1px solid var(--border-strong);border-radius:7px;color:var(--muted);
    font-size:11px;padding:5px 11px;cursor:pointer;font-family:inherit;}

  /* ② 나머지 — 가로로 넓게. 빈 구역은 아예 안 그린다 */
  .rows{background:var(--panel);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:12px;}
  .rh{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--border);}
  .rh h3{font-size:12.5px;font-weight:800;color:#fff;}
  .rh .n{font-size:10.5px;color:var(--muted-2);font-weight:700;}
  .rh .r{margin-left:auto;font-size:10.5px;color:var(--muted-2);}
  .it{display:flex;align-items:center;gap:11px;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.04);
    cursor:pointer;position:relative;}
  .it:last-child{border-bottom:none;}
  .it:hover{background:rgba(59,130,246,.06);}
  .it::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;}
  .it.ai::before{background:var(--purple);}
  .it.rep::before{background:var(--blue);}
  .it.over::before{background:var(--red);}
  .it.done .it-t{color:var(--muted-2);text-decoration:line-through;}
  .ck{width:15px;height:15px;flex:0 0 auto;accent-color:var(--teal);cursor:pointer;}
  .it-t{flex:1;min-width:0;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tag{font-size:9px;font-weight:800;border-radius:4px;padding:1px 5px;flex:0 0 auto;}
  .t-ai{color:var(--purple);background:rgba(139,124,240,.16);}
  .t-me{color:var(--muted);background:rgba(255,255,255,.07);}
  .t-rep{color:var(--blue-light);background:rgba(59,130,246,.16);}
  .due{font-size:10.5px;flex:0 0 auto;white-space:nowrap;color:var(--muted-2);}
  .due.over{color:var(--red);font-weight:700;}
  .due.today{color:var(--amber);font-weight:700;}
  .prog{font-size:10px;color:var(--teal);font-weight:800;flex:0 0 auto;min-width:28px;text-align:right;}
  .go{background:transparent;border:1px solid var(--border-strong);border-radius:7px;color:var(--blue-light);
    font-size:11px;font-weight:700;padding:5px 11px;cursor:pointer;font-family:inherit;flex:0 0 auto;}

  .add{display:flex;gap:7px;padding:11px 14px;background:var(--panel-2);border-top:1px solid var(--border);flex-wrap:wrap;}
  .add input{flex:1;min-width:150px;background:var(--bg);border:1px solid var(--border-strong);border-radius:8px;
    padding:8px 11px;color:var(--text);font-size:12.5px;outline:none;font-family:inherit;}
  .add select{background:var(--bg);border:1px solid var(--border-strong);border-radius:8px;padding:8px 8px;
    color:var(--text);font-size:12px;outline:none;font-family:inherit;}
  .add button{background:var(--blue);border:none;border-radius:8px;color:#fff;font-size:12.5px;font-weight:700;
    padding:8px 16px;cursor:pointer;font-family:inherit;}

  /* 접힌 구역 — 자주 하는 업무·다 한 일은 매일 보는 것이 아니다 */
  .fold{background:var(--panel);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;}
  .fold-h{padding:11px 14px;display:flex;align-items:center;gap:9px;cursor:pointer;font-size:12.5px;}
  .fold-h .car{color:var(--muted-2);font-size:10px;transition:transform .15s;}
  .fold.open .fold-h .car{transform:rotate(90deg);}
  .fold-h b{font-weight:800;color:#fff;}
  .fold-h .n{margin-left:auto;font-size:10.5px;color:var(--muted-2);}
  .fold-b{display:none;border-top:1px solid var(--border);}
  .fold.open .fold-b{display:block;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;padding:11px 14px;}
  .chip{background:var(--panel-2);border:1px solid var(--border-strong);border-radius:16px;padding:5px 11px;
    font-size:11px;color:var(--text);cursor:pointer;}
  .chip:hover{border-color:var(--blue);color:var(--blue-light);}
  .empty{padding:14px;font-size:12px;color:var(--muted-2);line-height:1.7;}
  .footer{margin-top:22px;display:flex;align-items:center;gap:9px;font-size:11px;color:var(--muted-2);}
  .footer img{height:15px;opacity:.65;}
</style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <span id="homeLink" data-page="dashboard.html" title="대시보드로 이동" style="display:flex;align-items:center;gap:12px;cursor:pointer"><img src="gijo-wordmark.svg" alt="GIJO">
    <div class="app-title">GIJO AS</div></span>
    <div class="clock" id="clockEl">-</div>
  </div>
  <div class="header-right">
    <div class="status-pill" id="statusPill"><span class="dot"></span>연결 확인 중<span class="beta-tag">LIVE</span></div>
    <div class="avatar-btn" id="avatarBtn">-</div>
    <div class="icon-btn" id="settingsBtn" title="설정">⚙</div>
  </div>
</div>

<div class="app">
  <div class="sidebar" id="gijoNav"></div>
  <div class="mw-main">
    <!-- 정체성 한 줄 — 사용법·용어 풀이는 ⓘ로 챗봇에서(프로젝트 원칙) -->
    <div class="scr-id">☑ <b>내 업무</b> — 지금 할 일과 그 순서를 알려 드립니다.
      <span class="ask" id="askScreen">· 이 화면 설명 듣기</span></div>
    <div class="legend">
      <span><i style="background:var(--purple)"></i>AI가 찾음</span>
      <span><i style="background:rgba(255,255,255,.15)"></i>내가 적음</span>
      <span><i style="background:var(--blue)"></i>반복</span>
      <span><i style="background:var(--red)"></i>기한 지남</span>
    </div>

    <!-- ① 지금 이거 — 고르지 않아도 이미 열려 있다 -->
    <div id="nowBox"><div class="empty">불러오는 중…</div></div>

    <!-- ② 나머지 -->
    <div id="restBox"></div>

    <!-- ③ 가끔 보는 것 -->
    <div class="fold" id="foldRoutines">
      <div class="fold-h"><span class="car">▶</span><b>자주 하는 업무</b>
        <span style="color:var(--muted)">눌러서 담기</span><span class="n" id="cntRoutines">-</span></div>
      <div class="fold-b" id="routines"><div class="empty">불러오는 중…</div></div>
    </div>
    <div class="fold" id="foldDone">
      <div class="fold-h"><span class="car">▶</span><b>다 한 일</b><span class="n" id="cntDone">-</span></div>
      <div class="fold-b" id="listDone"><div class="empty">-</div></div>
    </div>

    <div class="footer"><img src="gijo-symbol.svg" alt="GIJO"><span>© 2026 GIJO Technology · GIJO AS Platform · Confidential</span></div>
  </div>
</div>

<div id="gijoChatWidget"></div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  var DAY = 24 * 3600000;
  var data = null;      // /api/mywork 응답
  var selId = null;     // 지금 펼쳐 둔 업무
  var guideCache = {};  // key → 가이드(결정적이라 캐시해도 안전)
  var restOpen = false; // 남은 단계 펼침 여부

  function tick(){ $("clockEl").textContent = new Date().toLocaleString("ko-KR",{hour:"2-digit",minute:"2-digit",hour12:true,year:"numeric",month:"2-digit",day:"2-digit"}); }
  async function loadHealth(){ try{ await window.gijo.checkServerHealth(); $("statusPill").innerHTML='<span class="dot"></span>서버 연결상태 양호'; }catch(e){ $("statusPill").innerHTML='<span class="dot" style="background:#e2483d"></span>서버 연결상태 불량'; } }
  async function loadUser(){ try{ var u=await window.gijo.me(); $("avatarBtn").textContent=(u.displayName||u.username||"-").charAt(0); }catch(e){} }

  function openScreen(page){
    if (window.gijoOpenScreen) window.gijoOpenScreen(page);
    else if (window.gijo && window.gijo.navigateTo) window.gijo.navigateTo(page);
  }
  function askAI(q){
    // ⚠ 옛 길(`gijo:ask`)은 셸에게 보냈다 — 대화창을 창으로 빼 두면 접힌 자리에 답이 쌓여
    //   **눌러도 아무 일이 없어 보인다**(2026-08-01 검토). 지금 보이는 대화창으로 보낸다.
    if (window.gijo && window.gijo.askConsole) { window.gijo.askConsole(q); return; }
    try { window.parent.postMessage({ type: "gijo:ask", text: q }, "*"); } catch (e) {} // 구버전 대비
  }
  // 질문 속 {업무}를 실제 업무 이름으로 바꾼다.
  // ⚠ 안 바꾸면 AI가 "무엇을 확인해야 할까요?"라고 되묻기만 한다(2026-07-31 실측).
  function fillQuestion(q, t){
    return String(q || "").replace(/\{업무\}/g, (t && t.text) ? t.text : "");
  }

  function dueLabel(t){
    if (t.overdue) {
      if (t.dueAt == null) return { cls:"over", tx:"지금" };
      var d = Math.max(1, Math.round((Date.now() - t.dueAt) / DAY));
      return { cls:"over", tx: d + "일 초과" };
    }
    if (t.dueAt == null) return { cls:"", tx:"기한 없음" };
    if (t.dueAt - Date.now() <= DAY) return { cls:"today", tx:"오늘" };
    return { cls:"", tx: new Date(t.dueAt).toLocaleDateString("ko-KR",{month:"2-digit",day:"2-digit"}) };
  }

  function findItem(id){
    if (!data) return null;
    var all = [].concat(data.today || [], data.week || [], data.later || [], data.done || []);
    for (var i = 0; i < all.length; i++) if (all[i].id === id) return all[i];
    return null;
  }

  /**
   * 지금 할 일을 고른다 — **담당자가 고르지 않아도 되게.**
   * 서버가 이미 급한 순서(기한 초과 → 우선순위 → 기한)로 정렬해 주므로 맨 앞을 쓴다.
   * 손대던 것이 있으면(진행 중) 그것을 우선한다 — 하던 일을 잃지 않는 게 먼저다.
   */
  function pickNow(){
    var t = selId ? findItem(selId) : null;
    if (t && !t.done) return t;
    var open = (data && data.today) || [];
    var 진행중 = open.filter(function (x) { return x.guideDoneCount > 0 && x.guideDoneCount < x.guideTotal; });
    return 진행중[0] || open[0] || (data && data.week && data.week[0]) || null;
  }

  // ── ① 지금 이거 ─────────────────────────────────────────────────────
  async function renderNow(){
    var box = $("nowBox");
    var t = pickNow();
    if (!t) {
      box.innerHTML = '<div class="now ok"><div class="now-h">' +
        '<div class="now-k">✓ 오늘 할 일을 다 했습니다</div>' +
        '<div class="now-t">지금 급한 일이 없습니다</div>' +
        '<div class="now-w">새 일이 생기면 여기 먼저 뜹니다. 아래에 직접 적거나 <b>자주 하는 업무</b>에서 담으세요.</div>' +
        "</div></div>";
      return;
    }
    selId = t.id;
    var due = dueLabel(t);
    var 급함 = t.overdue;
    var cls = "now" + (급함 ? "" : " calm");
    var 머리 = 급함 ? ("🔴 지금 이것부터 — 기한 " + due.tx) : ("▶ 지금 이것부터 — " + due.tx);

    // 가이드가 없으면 순서를 지어내지 않는다 — 솔직히 말하고 대화창으로 보낸다.
    if (!t.guideKey) {
      box.innerHTML =
        '<div class="' + cls + '"><div class="now-h"><div class="now-k">' + esc(머리) + "</div>" +
        '<div class="now-t">' + esc(t.text) + "</div>" +
        (t.why ? '<div class="now-w"><b>왜 지금:</b> ' + esc(t.why) + "</div>" : "") + "</div>" +
        '<div class="empty" style="margin:0 18px 12px">이 업무에는 정해진 순서가 없습니다. 아래 대화창에 물어보시면 AI가 방법을 알려 드립니다.' +
        (t.saved ? "" : "<br>시작하시면 <b>내 업무에 담깁니다</b>.") + "</div>" +
        '<div class="now-f"><button class="big" id="nowAsk">AI에게 물어보기</button>' +
        '<span style="margin-left:auto;display:flex;gap:7px">' +
        (t.saved ? '<button class="mini" id="nowDone">이 업무 완료</button>' : '<button class="mini" id="nowAdopt">내 업무에 담기</button>') +
        '<button class="mini" id="nowSkip">다른 일 먼저</button></span></div></div>';
      wireNow(t, null, []);
      return;
    }

    var guide = guideCache[t.guideKey];
    if (!guide) {
      // 받아오는 동안 **직전 업무의 단계가 남으면 안 된다** — 머리글부터 즉시 바꾼다.
      box.innerHTML = '<div class="' + cls + '"><div class="now-h"><div class="now-k">' + esc(머리) + "</div>" +
        '<div class="now-t">' + esc(t.text) + '</div></div><div class="empty" style="margin:0 18px 12px">순서를 불러오는 중…</div></div>';
      try { guide = await window.gijo.workGuide(t.guideKey); guideCache[t.guideKey] = guide; }
      catch (e) { box.innerHTML = '<div class="empty">가이드를 불러오지 못했습니다.</div>'; return; }
      if (selId !== t.id) return; // 기다리는 사이 다른 것을 골랐으면 이 결과는 버린다
    }

    var done = t.saved ? (t.guideDoneList || []) : [];
    var total = guide.steps.length;
    var pct = total ? Math.round(done.length / total * 100) : 0;
    var nextIdx = -1;
    for (var i = 0; i < total; i++) { if (done.indexOf(i) < 0) { nextIdx = i; break; } }
    var 끝남 = nextIdx < 0;

    var 다음 = 끝남 ? null : guide.steps[nextIdx];
    var 다음설명 = "";
    if (다음) {
      다음설명 = 다음.kind === "ask" && 다음.question
        ? esc(다음.desc || "") + ' <span class="q">"' + esc(fillQuestion(다음.question, t)) + '"</span>'
        : esc(다음.desc || "");
    }
    var 버튼글 = !다음 ? "" : 다음.kind === "open" ? "열기 →" : 다음.kind === "ask" ? "물어보기 →" : "확인함 →";

    // 남은 단계(다음 것 제외) — 접어 둔다. 펼치면 전부 보인다.
    var 나머지 = guide.steps.map(function (s, i) { return { s: s, i: i }; })
      .filter(function (x) { return x.i !== nextIdx; });
    var 남은수 = 나머지.filter(function (x) { return done.indexOf(x.i) < 0; }).length;
    var 한수 = done.length;

    var restHtml = "";
    if (restOpen) {
      restHtml = '<div class="rest-open">' + 나머지.map(function (x) {
        var d = done.indexOf(x.i) >= 0;
        var btn = x.s.kind === "open" ? (d ? "다시 열기" : "열기") : x.s.kind === "ask" ? (d ? "다시 묻기" : "물어보기") : (d ? "다시 보기" : "확인함");
        return '<div class="rs' + (d ? " done" : "") + '" data-step="' + x.i + '">' +
          '<span class="rs-n" title="눌러서 완료 표시 바꾸기">' + (d ? "✓" : (x.i + 1)) + "</span>" +
          '<div class="rs-b"><div class="rs-t">' + esc(x.s.title) + "</div>" +
          (x.s.desc ? '<div class="rs-d">' + esc(x.s.desc) + "</div>" : "") + "</div>" +
          '<button class="rs-go" data-go="' + x.i + '">' + btn + "</button></div>";
      }).join("") + '<div class="rest" id="restToggle" style="margin:8px 0 0">▾ 접기</div></div>';
    } else {
      restHtml = '<div class="rest" id="restToggle">▸ 남은 단계 ' + 남은수 + "개 보기" +
        (한수 ? '　·　<span style="color:var(--teal)">✓ ' + 한수 + "단계 완료함</span>" : "") + "</div>";
    }

    box.innerHTML =
      '<div class="' + cls + (끝남 ? " ok" : "") + '"><div class="now-h">' +
      '<div class="now-k">' + esc(끝남 ? "✓ 단계를 다 마쳤습니다 — 완료 처리해 주세요" : 머리) + "</div>" +
      '<div class="now-t">' + esc(t.text) + "</div>" +
      (t.why ? '<div class="now-w"><b>왜 지금:</b> ' + esc(t.why) + "</div>" : "") +
      '<div class="now-bar"><div class="trk"><i style="width:' + pct + '%"></i></div>' +
      '<span class="now-cnt">' + done.length + " / " + total + " 단계</span></div></div>" +
      (다음
        ? '<div class="step-now"><span class="step-n">' + (nextIdx + 1) + "</span>" +
          '<div class="step-b"><div class="step-t">' + esc(다음.title) + "</div>" +
          (다음설명 ? '<div class="step-d">' + 다음설명 + "</div>" : "") + "</div>" +
          '<button class="big" data-go="' + nextIdx + '">' + 버튼글 + "</button></div>"
        : "") +
      restHtml +
      '<div class="now-f"><span>' +
      (t.saved ? "순서를 건너뛰어도 됩니다." : "시작하면 <b>내 업무에 담깁니다</b> — 그때부터 진행이 저장됩니다.") +
      "</span><span style=\"margin-left:auto;display:flex;gap:7px\">" +
      (t.saved ? '<button class="mini" id="nowDone">이 업무 완료</button>' : '<button class="mini" id="nowAdopt">내 업무에 담기</button>') +
      '<button class="mini" id="nowSkip">다른 일 먼저</button></span></div></div>';

    wireNow(t, guide, done);
  }

  function wireNow(t, guide, done){
    var ask = $("nowAsk");
    if (ask) ask.addEventListener("click", function(){ askAI(t.text + " 어떻게 하면 돼?"); });
    var adopt = $("nowAdopt");
    if (adopt) adopt.addEventListener("click", function(){ adoptItem(t); });
    var comp = $("nowDone");
    if (comp) comp.addEventListener("click", async function(){
      try { await window.gijo.toggleTask(t.id, true); } catch (e) {}
      clearActive();
      selId = null; restOpen = false; await load(); await renderNow();
    });
    var skip = $("nowSkip");
    if (skip) skip.addEventListener("click", async function(){
      // 지금 것을 건너뛰고 다음으로 — 목록에서 다른 것을 고르는 것과 같다.
      var open = (data.today || []).filter(function (x) { return x.id !== t.id && !x.done; });
      selId = open.length ? open[0].id : null; restOpen = false;
      await renderNow();
    });
    var rt = $("restToggle");
    if (rt) rt.addEventListener("click", async function(){ restOpen = !restOpen; await renderNow(); });
    if (!guide) return;

    // 단계 실행 — 실제로 화면을 열거나 AI에게 묻고, 그 단계를 완료로 표시한다.
    $("nowBox").querySelectorAll("[data-go]").forEach(function (b) {
      b.addEventListener("click", async function () {
        var i = Number(b.dataset.go);
        var s = guide.steps[i];
        var task = t;
        if (!task.saved) { task = await adoptItem(t, true); if (!task) return; }
        if (s.kind === "open" && s.page) openScreen(s.page);
        else if (s.kind === "ask" && s.question) askAI(fillQuestion(s.question, task));
        try { await window.gijo.myWorkStep(task.id, i, true); } catch (e) {}
        selId = task.id;
        await load();
        // 다른 화면으로 갔을 수 있다 — 돌아올 수 있게 지금 하던 일을 남긴다.
        markActive(findItem(task.id) || task, guide);
        await renderNow();
      });
    });
    // 동그라미로 완료 표시만 바꾸기(실행 없이) — 이미 손으로 한 일에 쓴다.
    $("nowBox").querySelectorAll(".rs-n").forEach(function (n) {
      n.addEventListener("click", async function () {
        if (!t.saved) return;
        var i = Number(n.closest(".rs").dataset.step);
        try { await window.gijo.myWorkStep(t.id, i, done.indexOf(i) < 0); } catch (e) {}
        await load(); await renderNow();
      });
    });
  }

  // ── ③ 진행 중 표시 — 다른 화면에 가 있어도 돌아올 수 있게 ────────────
  // 화면 이동은 같은 앱 안이므로 localStorage로 충분하다(서버에 둘 이유가 없다 —
  // "지금 이 창에서 내가 하던 일"이지 다른 기기와 나눌 상태가 아니다).
  function markActive(t, guide){
    if (!t || !t.saved) return;
    try {
      localStorage.setItem("gijo:mywork:active", JSON.stringify({
        id: t.id, text: t.text,
        step: (t.guideDoneList || []).length, total: guide ? guide.steps.length : (t.guideTotal || 0),
        at: Date.now(),
      }));
    } catch (e) {}
  }
  function clearActive(){ try { localStorage.removeItem("gijo:mywork:active"); } catch (e) {} }

  // ── ② 나머지 목록 ───────────────────────────────────────────────────
  function rowHtml(t){
    var cls = "it" + (t.origin === "ai" ? " ai" : "") + (t.recur ? " rep" : "") +
      (t.overdue ? " over" : "") + (t.done ? " done" : "");
    var tag = t.origin === "ai" ? '<span class="tag t-ai">AI</span>'
      : t.recur ? '<span class="tag t-rep">🔁 반복</span>' : '<span class="tag t-me">내가</span>';
    var due = dueLabel(t);
    var prog = t.guideTotal > 0 ? '<span class="prog">' + t.guideDoneCount + "/" + t.guideTotal + "</span>" : '<span class="prog"></span>';
    var ck = t.saved ? '<input type="checkbox" class="ck"' + (t.done ? " checked" : "") + ' title="완료 표시">' : '<span style="width:15px;flex:0 0 auto"></span>';
    var btn = t.done ? "" : '<button class="go">' + (t.guideDoneCount > 0 ? "이어서" : "시작") + "</button>";
    return '<div class="' + cls + '" data-id="' + esc(t.id) + '">' + ck +
      '<span class="it-t" title="' + esc(t.text) + '">' + esc(t.text) + "</span>" +
      tag + '<span class="due ' + due.cls + '">' + esc(due.tx) + "</span>" + prog + btn + "</div>";
  }

  function renderRest(){
    var box = $("restBox");
    var 지금 = selId;
    var html = "";
    // ⚠ 빈 구역은 **아예 그리지 않는다**. 예전엔 "이번 주 0건 — 없습니다" 카드가
    //   자리만 먹었다(2026-07-31 진단). 없는 것은 말하지 않는 편이 낫다.
    function 구역(title, items, extra){
      var list = (items || []).filter(function (x) { return x.id !== 지금; });
      if (!list.length) return "";
      var over = list.filter(function (x) { return x.overdue; }).length;
      return '<div class="rows"><div class="rh"><h3>' + title + '</h3><span class="n">' + list.length + "건</span>" +
        (over ? '<span class="r">기한 초과 ' + over + "</span>" : "") + "</div>" +
        list.map(rowHtml).join("") + (extra || "") + "</div>";
    }
    var addRow =
      '<div class="add"><input id="newText" placeholder="할 일 적기 — 적으면 그 일의 순서도 함께 알려 드립니다" maxlength="200">' +
      '<select id="newDue"><option value="today">오늘</option><option value="week">이번 주</option><option value="">기한 없음</option></select>' +
      '<select id="newRecur"><option value="">한 번만</option><option value="weekly">매주</option><option value="monthly">매월</option></select>' +
      '<button id="btnAdd">추가</button></div>';

    var t = 구역("오늘 남은 일", data.today, addRow);
    if (!t) {
      // 오늘 것이 없으면 적는 칸이 사라지면 안 된다 — 빈 카드에라도 붙인다.
      t = '<div class="rows"><div class="rh"><h3>오늘 남은 일</h3><span class="n">0건</span></div>' +
        '<div class="empty">오늘 남은 일이 없습니다.</div>' + addRow + "</div>";
    }
    html += t;
    html += 구역("이번 주", data.week);
    html += 구역("나중에", data.later);
    box.innerHTML = html;
    wireRest();
  }

  function wireRest(){
    $("restBox").querySelectorAll(".it").forEach(function (row) {
      row.addEventListener("click", async function (e) {
        if (e.target.classList.contains("ck")) {
          try { await window.gijo.toggleTask(row.dataset.id, e.target.checked); } catch (err) {}
          await load(); await renderNow();
          return;
        }
        selId = row.dataset.id; restOpen = false;
        await renderNow(); renderRest();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });
    var add = $("btnAdd");
    if (add) {
      add.addEventListener("click", addTask);
      $("newText").addEventListener("keydown", function (e) { if (e.key === "Enter") addTask(); });
    }
  }

  async function load(){
    try { data = await window.gijo.myWork(); }
    catch (e) { $("nowBox").innerHTML = '<div class="empty">업무를 불러오지 못했습니다. 서버 상태를 확인해 주세요.</div>'; return; }
    $("cntDone").textContent = "오늘 " + data.counts.doneToday + "건";
    $("listDone").innerHTML = (data.done && data.done.length)
      ? data.done.map(rowHtml).join("") : '<div class="empty">오늘 끝낸 일이 아직 없습니다.</div>';
    renderRest();
  }

  // '자주 하는 업무'는 따로 늦게 채운다 — RAG+LLM이라 몇 초가 걸린다.
  async function loadRoutines(){
    var box = $("routines");
    try {
      var rs = await window.gijo.myWorkRoutines();
      $("cntRoutines").textContent = (rs && rs.length ? rs.length + "가지" : "");
      box.innerHTML = (rs && rs.length)
        ? '<div class="chips">' + rs.map(function (r) {
            return '<span class="chip" data-text="' + esc(r.text) + '" data-cadence="' + esc(r.cadence) + '">+ ' + esc(r.text) + "</span>";
          }).join("") + "</div>"
        : '<div class="empty">추천할 업무를 아직 만들지 못했습니다.</div>';
      box.querySelectorAll(".chip").forEach(function (chip) {
        chip.addEventListener("click", async function () {
          var cadence = chip.dataset.cadence === "weekly" ? "weekly" : "";
          try {
            await window.gijo.myWorkAdopt({ text: chip.dataset.text, origin: "routine", dueAt: Date.now(), recur: cadence || undefined });
          } catch (err) {}
          await load(); await renderNow();
        });
      });
    } catch (e) { box.innerHTML = '<div class="empty">추천을 불러오지 못했습니다.</div>'; }
  }

  async function adoptItem(t, quiet){
    try {
      // 기한을 반드시 넘긴다 — 안 넘기면 '나중에'로 떨어져 오늘 목록에서 사라진다.
      var created = await window.gijo.myWorkAdopt({ text: t.text, ref: t.ref, origin: t.origin || "ai", dueAt: t.dueAt || Date.now() });
      await load();
      selId = created.id;
      if (!quiet) await renderNow();
      return findItem(created.id) || created;
    } catch (e) { return null; }
  }

  async function addTask(){
    var el = $("newText"), text = el.value.trim();
    if (!text) return;
    el.value = "";
    var dueSel = $("newDue").value;
    var dueAt = dueSel === "today" ? Date.now() : dueSel === "week" ? Date.now() + 6 * DAY : undefined;
    var recur = $("newRecur").value || undefined;
    try { await window.gijo.myWorkAdopt({ text: text, origin: "me", dueAt: dueAt, recur: recur }); } catch (e) {}
    await load(); await renderNow();
  }

  // 접기 — 자주 하는 업무·다 한 일은 매일 보는 것이 아니다.
  ["foldRoutines", "foldDone"].forEach(function (id) {
    $(id).querySelector(".fold-h").addEventListener("click", function () { $(id).classList.toggle("open"); });
  });

  $("askScreen").addEventListener("click", function () {
    if (window.gijoExplain) window.gijoExplain(); else askAI("내 업무 화면 설명해줘");
  });
  $("settingsBtn").addEventListener("click", function () { window.gijo.navigateTo("settings.html"); });
  document.querySelectorAll("[data-page]").forEach(function (el) {
    el.addEventListener("click", function () { window.gijo.navigateTo(el.dataset.page); });
  });

  if (!window.gijo.isAuthenticated()) { window.gijo.navigateTo("login.html"); }
  else {
    tick(); setInterval(tick, 30000);
    loadHealth(); loadUser();
    // 이 화면에 왔으면 "진행 중" 띠는 필요 없다 — 여기가 그 일을 하는 곳이다.
    clearActive();
    load().then(renderNow);
    loadRoutines();
  }
})();
</script>
