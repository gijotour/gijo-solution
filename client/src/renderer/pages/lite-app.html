<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>GIJO AS Lite</title>
<link rel="stylesheet" href="gijo-ui.css">
<!--
  lite-app.html — 라이트 에디션 셸.

  ■ 왜 app.html을 안 쓰나 (작업경계 §4)
    공용 셸은 **탭 셸**이다(살아 있는 iframe 최대 8개 · 상태 보존 · 구역 표시 · 콘솔 연동).
    그 값은 화면을 자주 오가는 관제 자리에서 나온다. 라이트는 **1인·9화면**이라
    탭이 주는 값이 작고, 그 기계가 app.html 700줄의 상당 부분이다.
    라이트 원칙은 빼기다 — 사이드바 + 화면 한 자리로 시작한다.
    ⚠ 탭이 필요해지면 그때 넣는다. 지금 넣으면 「쓸지 모르는 것」을 8GB급에 지고 간다.

  ■ 화면 목록은 여기 없다 — lite-screens.json이 단일 소스다(lite-nav.js가 읽는다).
    메뉴를 HTML에 박으면 서버의 화면 정의와 어긋난다.
-->
<style>
  html, body { height: 100%; margin: 0; }
  /* ⚠ 창을 세로로 쌓는다 — 맨 위 44px 제목줄 + 그 아래 [사이드바 | 본문].
     예전엔 body가 바로 [사이드바|본문]이라 창 버튼이 내용 위에 겹쳤다:
       macOS는 신호등(● ● ●)이 **왼쪽 위**라 「GIJO AS」 글자를 덮었고(2026-08-13 사장님 신고),
       Windows는 (─ ▢ ✕)가 **오른쪽 위**라 화면 제목을 덮는다.
     본 제품 app.html이 쓰는 방식을 그대로 옮긴다 — 44px 제목줄이 창 버튼을 세로로 품고,
     env(titlebar-area-*)로 좌우 버튼 자리를 비운다(두 OS가 한 줄로 맞는다). */
  body { display: flex; flex-direction: column; font-family: inherit;
    background: var(--g-bg, #0f1115); color: var(--g-fg, #e6e8ec); }

  /* 제목줄 — 창을 끄는 손잡이. 브랜드를 여기 담는다(신호등 자리 밖으로 밀려 안 겹친다). */
  .lite-titlebar {
    flex: 0 0 44px; height: 44px; display: flex; align-items: center;
    border-bottom: 1px solid var(--g-border, #262a33); background: var(--g-panel, #141821);
    -webkit-app-region: drag;
    /* macOS: 왼쪽 신호등 폭만큼 민다. Windows: env가 0이라 16px 그대로. */
    padding-left: calc(16px + env(titlebar-area-x, 0px));
    /* Windows: 오른쪽 창 버튼(─ ▢ ✕) 폭을 비운다. macOS: 거의 0. */
    padding-right: calc(16px + 100vw - env(titlebar-area-width, 100vw) - env(titlebar-area-x, 0px));
  }
  .lite-titlebar .p { font-weight: 700; font-size: 13.5px; letter-spacing: .2px; }
  .lite-titlebar .e { font-size: 11px; opacity: .62; margin-left: 8px; }
  /* 문서 작성(Smart MD) — 제목줄 **오른쪽 빈 자리**를 쓴다. 세로 높이는 그대로 44px이라
     화면 세로 공간을 한 픽셀도 안 먹는다(2026-08-14 무료 도구 진입점). */
  .lite-titlebar .smd {
    margin-left: auto; -webkit-app-region: no-drag;   /* 창 끌기 영역 안의 버튼은 이걸 꺼야 눌린다 */
    background: transparent; border: 1px solid var(--g-border, #262a33); color: var(--g-fg, #e6e8ec);
    border-radius: 7px; padding: 4px 10px; font-size: 11.5px; font-weight: 700; cursor: pointer;
  }
  .lite-titlebar .smd:hover { border-color: var(--g-accent, #5fa1ff); color: var(--g-accent, #5fa1ff); }

  /* 제목줄 아래 본체 — 여기서만 [사이드바 | 본문]으로 나뉜다. */
  .lite-body { flex: 1 1 auto; min-height: 0; display: flex; }

  /* 사이드바 — 9개뿐이라 접기·검색이 없다. 없는 것이 라이트의 값이다. */
  .lite-side {
    width: 216px; flex: 0 0 216px; display: flex; flex-direction: column;
    border-right: 1px solid var(--g-border, #262a33); background: var(--g-panel, #141821);
  }
  #liteNav { padding: 8px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
  /* 설정은 번호 매긴 업무 메뉴와 성격이 달라 아래에 따로 둔다. */
  #liteNavFoot { margin-top: auto; padding: 8px; border-top: 1px solid var(--g-border, #262a33); }

  .lite-nav-item {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 9px 10px; border: 0; border-radius: 8px; cursor: pointer;
    background: transparent; color: inherit; font: inherit; text-align: left;
  }
  .lite-nav-item:hover { background: var(--g-hover, #1c212c); }
  .lite-nav-item.on { background: var(--g-accent-weak, #1f2937); font-weight: 600; }
  .lite-nav-item .n {
    flex: 0 0 20px; text-align: center; font-size: 11px; opacity: .55;
    font-variant-numeric: tabular-nums;
  }
  .lite-nav-item .t { flex: 1 1 auto; font-size: 13px; }
  .lite-nav-item.todo .t { opacity: .55; }
  .lite-nav-item .badge {
    font-size: 11px; padding: 1px 6px; border-radius: 999px;
    background: var(--g-border, #262a33); opacity: .8;
  }

  /* 화면 한 자리 — 탭이 없으니 자리도 하나다. */
  .lite-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
  #liteScreen { flex: 1 1 auto; min-height: 0; }
  #liteScreen iframe { width: 100%; height: 100%; border: 0; display: block; }

  .lite-todo { padding: 44px 40px; max-width: 640px; }
  .lite-todo .h { font-size: 17px; font-weight: 700; margin-bottom: 10px; }
  .lite-todo .d { font-size: 13px; line-height: 1.7; opacity: .8; }
  .lite-todo .m { font-size: 12px; opacity: .5; margin-top: 14px; }
</style>
</head>
<body class="g-ui">
  <!-- 제목줄 — 브랜드는 여기(창 버튼 자리를 CSS가 비운다). 창을 끄는 손잡이이기도 하다. -->
  <div class="lite-titlebar">
    <span class="p">GIJO AS</span>
    <span class="e">Lite — 담당자 PC 1인용</span>
    <!-- 무료로 함께 드리는 문서 작성 도구(Smart MD Studio). 별도 창으로 열린다. -->
    <button class="smd" id="smdBtn" type="button" title="GIJO Smart MD Studio — 무료 문서 작성 도구(별도 창)">📝 문서 작성</button>
  </div>
  <script>
    // 🖧 원격 GPU로 전송 중 — 켜졌을 때만 제목줄에 뜬다(2026-08-14 재검토 A-1).
    //   라이트는 1인용이라 쓰는 사람이 곧 admin이지만, **표시가 있는 것과 없는 것은 다르다** —
    //   설정 화면을 열어야 알 수 있으면 「지금 어디로 가는지」를 모르는 채 질문하게 된다.
    // ⚠ 한 번만 읽지 않고 **60초마다 다시 읽는다**(관문 검토 지적 — 표준 titlebar만 고치고
    //   여기는 1회성으로 남아 있었다). 라이트 셸도 세션 내내 살아 있어서, 설정에서 켜면
    //   칩이 안 생기고 끄면 남는 똑같은 반쪽이었다.
    (function () {
      // ⚠ 다리가 없으면 조용히 접는다(관문 M-3) — 없는데 부르면 **동기 TypeError**가 이 스크립트
      //   블록 전체를 죽여, 아래 「📝 문서 작성」 리스너까지 등록이 안 된다(눌러도 무반응 유형).
      if (!window.gijo || typeof window.gijo.remoteLlmWhere !== "function") return;
      function 갱신() {
        window.gijo.remoteLlmWhere().then(function (w) {
          var chip = document.getElementById("liteRemoteChip");
          var bar = document.querySelector(".lite-titlebar");
          var btn = document.getElementById("smdBtn");
          if (w && w.remote && !chip && bar && btn) {
            chip = document.createElement("span");
            chip.id = "liteRemoteChip";
            chip.style.cssText = "-webkit-app-region:no-drag;margin-left:auto;margin-right:8px;" +
              "font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:14px;" +
              "background:rgba(240,160,32,.14);border:1px solid rgba(240,160,32,.45);color:#f0a020;";
            chip.title = "이 PC 대신 VPN 안의 원격 GPU가 답하고 있습니다 — 질문이 그 기계로 전송됩니다. ⚙ 설정 › 원격 GPU에서 끕니다.";
            chip.textContent = "🖧 원격 GPU로 전송 중";
            bar.insertBefore(chip, btn);
            btn.style.marginLeft = "0";                      // 칩이 auto 자리를 가져갔다
          } else if ((!w || !w.remote) && chip) {
            chip.remove();                                    // 껐으면 없는 경고를 남기지 않는다
            if (btn) btn.style.marginLeft = "auto";           // auto 자리를 되돌린다
          }
        }).catch(function () { /* 못 읽은 회차는 건너뛴다 — 다음 회차가 온다 */ });
      }
      갱신();
      setInterval(갱신, 60000);
    })();

    // ⑧ 바깥 연결 상태 칩(🔒 폐쇄망 / 🌐 오픈망 N) — 지금 무엇이 바깥과 통하나를 제목줄에서 한눈에.
    //   누르면 ⚙ 설정(바깥 연결 패널). 왼쪽(브랜드 옆)에 둬서 우측 원격칩·smd와 자리 안 겹친다.
    (function () {
      if (!window.gijo) return;
      function egRefresh() {
        Promise.all([
          window.gijo.getCloudConfig ? window.gijo.getCloudConfig().catch(function () { return null; }) : Promise.resolve(null),
          window.gijo.remoteLlmWhere ? window.gijo.remoteLlmWhere().catch(function () { return null; }) : Promise.resolve(null),
          window.gijo.lawConfig ? window.gijo.lawConfig().catch(function () { return null; }) : Promise.resolve(null)
        ]).then(function (r) {
          var cloud = r[0], remote = r[1], law = r[2];
          var prov = cloud && (cloud.activeProvider || cloud.provider);
          var 두뇌on = !!(cloud && cloud.enabled && (prov === "custom" || prov === "openai"));
          var 외부 = (두뇌on && prov === "openai") || !!(law && law.enabled);
          var n = (두뇌on ? 1 : 0) + (remote && remote.remote ? 1 : 0) + (law && law.enabled ? 1 : 0);
          var bar = document.querySelector(".lite-titlebar");
          var sub = bar && bar.querySelector(".e");
          if (!bar || !sub) return;
          var chip = document.getElementById("liteEgressChip");
          if (!chip) {
            chip = document.createElement("span");
            chip.id = "liteEgressChip";
            chip.style.cssText = "-webkit-app-region:no-drag;margin-left:10px;cursor:pointer;font-size:11px;font-weight:700;padding:2px 9px;border-radius:14px;";
            chip.addEventListener("click", function () { try { (window.gijoOpenScreen ? window : window.parent).gijoOpenScreen("lite-settings"); } catch (e) { /* 셸 밖이면 조용히 */ } });
            sub.parentNode.insertBefore(chip, sub.nextSibling);
          }
          if (n) {
            chip.textContent = "🌐 오픈망 " + n;
            chip.style.background = 외부 ? "rgba(240,160,32,.14)" : "rgba(30,185,128,.14)";
            chip.style.border = "1px solid " + (외부 ? "rgba(240,160,32,.45)" : "rgba(30,185,128,.4)");
            chip.style.color = 외부 ? "#f0a020" : "#1eb980";
            chip.title = "지금 " + n + "개 통로가 바깥과 통합니다" + (외부 ? " (외부로 나가는 것 포함)" : " (사내 유지)") + " — 누르면 ⚙ 설정 › 바깥 연결.";
          } else {
            chip.textContent = "🔒 폐쇄망";
            chip.style.background = "rgba(30,185,128,.12)";
            chip.style.border = "1px solid rgba(30,185,128,.35)";
            chip.style.color = "#1eb980";
            chip.title = "바깥으로 나가는 통로가 없습니다 — 이 PC 안에서만 답합니다. 누르면 ⚙ 설정 › 바깥 연결.";
          }
        }).catch(function () { /* 못 읽은 회차는 다음 회차가 온다 */ });
      }
      egRefresh();
      setInterval(egRefresh, 60000);
    })();

    // 없으면 조용히 지나가지 않고 이유를 말한다 — 「눌러도 아무 일 없다」를 만들지 않는다.
    document.getElementById("smdBtn").addEventListener("click", async function () {
      if (!window.gijo || typeof window.gijo.openSmartMd !== "function") {
        alert("이 판에는 문서 작성 도구가 없습니다 — 최신 버전으로 올리면 함께 들어옵니다.");
        return;
      }
      const r = await window.gijo.openSmartMd();
      if (r && r.ok === false) alert(r.error || "문서 작성 도구를 열지 못했습니다.");
    });
  </script>
  <div class="lite-body">
    <nav class="lite-side" aria-label="라이트 메뉴">
      <div id="liteNav" role="list"></div>
      <div id="liteNavFoot"></div>
    </nav>
    <main class="lite-main">
      <div id="liteScreen"></div>
    </main>
  </div>
  <script>
// lite-nav.js — 라이트 에디션 사이드바 (메뉴 9개).
//
// ■ 왜 nav.js를 안 쓰나
//   공용 nav.js는 1,463줄이고 그 대부분이 **5단계 절차 그룹·배지·허브 리다이렉트 기계**다.
//   라이트는 1인용 9화면이라 그 구조가 통째로 뜻이 없다. 새로 두는 편이 작다.
//   ⚠ 그렇다고 논리를 복사하지는 않는다 — 이 파일은 **목록을 그리고 클릭을 넘기는 것**이 전부다.
//   검색·살균·계산은 공용 서버를 그대로 부른다(작업경계 §4).
//
// ■ 메뉴 목록은 여기 없다 — `lite-screens.json`이 단일 소스다.
//   화면 정의가 서버(server/src/lite/)에 있고 껍데기가 여기 있으면 **둘이 어긋난다.**
//   공용 nav.js가 겪은 실사고가 그것이다: 문서함을 더할 때 분기를 안 더해
//   「메뉴를 눌러도 아무 일도 안 났다」(4.9.0). 그래서 한 곳에서만 읽는다.

(function () {
  "use strict";

  var 화면목록 = [];
  var 자료 = null;   // lite-screens.json 원본(설정 항목이 여기 있다)
  var 지금 = null;

  // 공용 디자인 시스템 — 라이트도 같은 그림을 쓴다(여기서 갈라질 이유가 없다).
  (function injectCss() {
    if (document.getElementById("gijoUiCss")) return;
    var l = document.createElement("link");
    l.id = "gijoUiCss"; l.rel = "stylesheet"; l.href = "gijo-ui.css";
    document.head.appendChild(l);
  })();

  function 그리기() {
    var box = document.getElementById("liteNav");
    if (!box) return;
    box.innerHTML = "";
    화면목록.forEach(function (s) {
      var a = document.createElement("button");
      a.className = "lite-nav-item" + (지금 === s.id ? " on" : "") + (s.구현됨 ? "" : " todo");
      a.type = "button";
      a.dataset.id = s.id;
      // no=0은 번호 없는 특별 항목(💬). s.아이콘이 있으면 그걸 쓴다(📝 문서 작성=창 항목, 재편 ②).
      a.innerHTML =
        '<span class="n">' + (s.아이콘 || (s.no ? s.no : "💬")) + "</span>" +
        '<span class="t">' + esc(s.이름) + "</span>" +
        (s.무료 ? '<span class="badge">무료</span>' : "") +
        (s.구현됨 ? "" : '<span class="badge">준비 중</span>');
      // 창 항목(② Smart MD)은 iframe이 아니라 별도 창을 연다 — 본문·하이라이트를 바꾸지 않는다.
      a.addEventListener("click", function () { if (s.창) 창열기(s); else 열기(s.id); });
      box.appendChild(a);
    });
  }

  // 창-실행 항목(재편 ② — 표준 nav.js의 page.win과 같은 결) — window.gijo의 창 함수를 부른다.
  //   iframe으로 못 여는 별도 창(Smart MD)이라 여기서 갈래를 둔다. 미동봉 판이면 규약대로 안내.
  function 창열기(s) {
    var fn = s.창;
    if (window.gijo && typeof window.gijo[fn] === "function") {
      try { window.gijo[fn](); return; } catch (e) { /* 아래 안내 */ }
    }
    alert("이 판에는 문서 작성 도구(GIJO Smart MD)가 없습니다.");
  }

  function esc(v) {
    return String(v == null ? "" : v).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function 열기(id) {
    var s = 화면목록.find(function (x) { return x.id === id; })
         || (자료 && 자료.settings && 자료.settings.id === id ? 자료.settings : null);
    if (!s) return;
    if (s.창) { 창열기(s); return; } // 창 항목(② Smart MD)은 iframe으로 안 연다 — 본문 유지.
    지금 = id;
    그리기();
    설정그리기();
    var 자리 = document.getElementById("liteScreen");
    if (!자리) return;

    if (!s.구현됨) {
      // ⚠ **없는 화면을 있는 것처럼 보이면 안 된다.** 라이트의 고유 위험이 그것이라
      //   문항까지 따로 뒀다(lite-routing.json lt-neg-*). 껍데기 단계에서도 같은 규칙을 지킨다.
      자리.innerHTML =
        '<div class="lite-todo">' +
        '<div class="h">' + esc(s.이름) + " — 아직 만들지 않았습니다</div>" +
        // ⚠ **`설명` 하나만 읽는다.** 예전엔 사장님말·왜·왜새로·_왜별도로 갈려 있어
        //   폴백 사슬을 썼는데, 새 항목이 다른 열쇠를 쓰면 또 샜다 — 실제로 두 번 빈칸이 났다
        //   (대시보드·설정, 2026-08-12 화면에서 발견). 사슬을 늘리는 대신 **열쇠를 하나로 못박았다.**
        '<div class="d">' + esc(s.설명 || "") + "</div>" +
        '<div class="m">품 ' + esc(s.품 || "?") + (s.본 ? " · 본 " + esc(s.본) : " · 새로 만듭니다") + "</div>" +
        "</div>";
      return;
    }
    자리.innerHTML = "";
    var f = document.createElement("iframe");
    f.src = "lite-" + id.replace(/^lite-/, "") + ".html?embed=1";
    f.setAttribute("title", s.이름);
    자리.appendChild(f);
  }

  // ⚠ 설정은 **화면목록에 안 섞는다.** 섞으면 번호가 10이 되고, 그러면 사장님이 정하신
  //   「메뉴 9개」와 어긋난다. 목록은 업무 화면만이고 설정은 아래 자리에 따로 그린다.
  function 설정그리기() {
    var 설정 = 자료 && 자료.settings;
    var box = document.getElementById("liteNavFoot");
    if (!설정 || !box) return;
    var a = document.createElement("button");
    a.className = "lite-nav-item" + (지금 === 설정.id ? " on" : "") + (설정.구현됨 ? "" : " todo");
    a.type = "button"; a.dataset.id = 설정.id;
    a.innerHTML = '<span class="n">⚙</span><span class="t">' + esc(설정.이름) + "</span>" +
      (설정.구현됨 ? "" : '<span class="badge">준비 중</span>');
    a.addEventListener("click", function () { 열기(설정.id); });
    box.innerHTML = ""; box.appendChild(a);
  }

  // 화면(iframe) 안에서 다른 화면을 열 때 쓰는 다리 — 공용 셸의 window.gijoOpenScreen과 같은 이름.
  // ⚠ 이름을 맞춰야 화면 코드를 라이트용으로 또 고치지 않는다.
  window.gijoOpenScreen = function (page) {
    var id = String(page || "").replace(/\?.*$/, "").replace(/\.html$/, "");
    // 9개 화면뿐 아니라 **설정도** 연다 — 대시보드의 「챗 모델 등록하러 가기」가 이걸 쓴다
    //   (모델 등록이 첫 실행 관문이 됐다, 2026-08-13). 열기()는 이미 설정 id를 처리한다.
    if (화면목록.some(function (x) { return x.id === id; }) || (자료 && 자료.settings && 자료.settings.id === id)) 열기(id);
    else console.warn("[lite-nav] 라이트에 없는 화면입니다:", page);
  };

  async function 시작() {
    try {
      var r = await fetch("lite-screens.json", { cache: "no-store" });
      var d = await r.json();
      자료 = d;
      화면목록 = (d.screens || []).slice().sort(function (a, b) { return a.no - b.no; });
    } catch (e) {
      console.error("[lite-nav] 화면 목록을 못 읽었습니다:", e);
      var box = document.getElementById("liteNav");
      if (box) box.textContent = "화면 목록을 못 읽었습니다";
      return;
    }
    그리기();
    설정그리기();
    if (화면목록.length) 열기(화면목록[0].id);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", 시작);
  else 시작();
})();
</script>
</body>
</html>
