# GIJO AS 운영서버 systemd 드롭인 오버라이드
# 설치 위치: /etc/systemd/system/gijo-as.service.d/override.conf
# 적용:      sudo cp 이 파일 → 위 경로 후 `sudo systemctl daemon-reload`
#
# 목적: 종료(재시작·배포) 시 systemd가 llama-server 자식을 30초 기다리다 timeout으로
#       강제킬(SIGKILL)하던 문제 해결. 기본 KillMode=control-group은 종료 시 cgroup 전체에
#       SIGTERM을 보내는데, WSL에서 llama-server가 종료 시 곧바로 죽지 않아 30초 대기 →
#       "Failed with result 'timeout'"가 배포마다 발생했다.
#
# KillMode=mixed: 메인(Node)에만 SIGTERM → 앱이 15초 그레이스풀 종료(자식 정리) → 메인 exit
#       즉시 systemd가 잔여 자식을 SIGKILL. 결과: 깔끔한 "Deactivated successfully"(2026-07-20 실증).
[Service]
KillMode=mixed
TimeoutStopSec=25
